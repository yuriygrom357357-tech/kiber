name: voice-samples
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          pip install piper-tts edge-tts
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && break; sleep 20; done
      - run: python tts/samples_free.py
      - run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git add tts/samples; git commit -m "Зразки безкоштовних голосів" || true
          git pull --rebase -X theirs || true; git push
