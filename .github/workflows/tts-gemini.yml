name: tts-gemini
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Лише зразки голосів"
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency:
  group: tts
  cancel-in-progress: false
jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install pymupdf
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && break; sleep 20; done
      - name: Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.samples }}" = "true" ]; then python tts/gemini.py --samples; else python tts/gemini.py; fi
      - name: Rebuild and commit
        run: |
          python src/build.py html || true
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          for p in audio tts/gemini_done.json tts/samples tts/debug index.html sw.js; do [ -e "$p" ] && git add "$p"; done; true
          git commit -m "Озвучка тестів Gemini (авто)" || echo nothing
          git pull --rebase -X theirs || true
          git push
