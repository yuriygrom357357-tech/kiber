name: tts
on:
  push:
    paths: ['tts/job.json', '.github/workflows/tts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install edge-tts==6.1.12 && sudo apt-get install -y ffmpeg >/dev/null
      - run: python tts/run.py
      - run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git add audio tts/timing.json || true
          git commit -m "Озвучка (авто)" || echo nothing
          git push
