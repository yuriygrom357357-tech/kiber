:root{
  --bg:#10130D;--bg2:#151A11;--paper:#1B2116;--soft:#222A1C;--line:#2F3926;--line2:#3E4A32;
  --ink:#ECE7D6;--muted:#A7A992;--dim:#7D806B;
  --acc:#F2A33A;--acc-soft:rgba(242,163,58,.12);--onacc:#14180F;--glow:0 0 0 1px rgba(242,163,58,.35),0 6px 22px rgba(242,163,58,.18);
  --amb:#F2A33A;--hl:rgba(242,163,58,.10);--hl-bar:#F2A33A;--blue:#6FB3E6;
  --ok:#8FCB6A;--okbg:rgba(143,203,106,.12);--bad:#E5573D;--badbg:rgba(229,87,61,.12);
  --shadow:none;--r:10px;
  --f-display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --f-head:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17.5px;line-height:1.58;min-height:100vh;
  background-image:linear-gradient(rgba(236,231,214,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(236,231,214,.03) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--f-head)}
/* --- інтерактив: легке підсвічування й анімація при наведенні --- */
.fx{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s,background-color .18s}
.fx:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(242,163,58,.16),transparent);transform:skewX(-18deg);opacity:0;transition:none}
@media (hover:hover){
 .fx:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc);box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(242,163,58,.22)}
 .fx:hover:not(:disabled):after{opacity:1;left:120%;transition:left .65s ease,opacity .2s}
}
.fx:active:not(:disabled){transform:translateY(0) scale(.985)}
@media (prefers-reduced-motion:reduce){.fx,.fx:after{transition:none!important}.fx:hover{transform:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.mark{width:36px;height:36px;flex:none;display:grid;place-items:center}
.mark svg{width:36px;height:36px}
.brand b{display:block;font-family:var(--f-head);font-size:17px;font-weight:700;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.dl{position:relative}
.ib.dl .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--amb);display:none}
.ib.dl.need .dot{display:block}
.ib.dl.ok{color:var(--ok)}

/* cards / generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.off{margin:18px 0 0;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.off .oi{width:52px;height:52px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.off .oi svg{width:28px;height:28px}
.off .ot{flex:1;min-width:220px}
.off .ot b{display:block;font-size:18px;line-height:1.3}
.off .ot span{font-size:14px;color:var(--muted)}
.off .oa{display:flex;gap:8px;flex-wrap:wrap}
.off.done .oi{background:var(--okbg);color:var(--ok)}
.pbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* modal */
.mback{position:fixed;inset:0;z-index:50;background:rgba(2,6,12,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadeIn .15s}
@media (min-width:640px){.mback{align-items:center}}
.modal{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);max-height:90vh;overflow:auto;animation:up .2s}
.modal h2{font-size:22px;line-height:1.25;margin-bottom:6px}
.modal p{color:var(--muted);font-size:15px}
.modal .qr{background:#fff;border-radius:16px;padding:16px;margin:16px auto;width:min(300px,100%)}
.modal .qr svg{width:100%;height:auto;display:block}
.modal .url{font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:clamp(12px,3.4vw,15px)}
.modal .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .mrow .btn{flex:1;min-width:140px}
.modal ol{padding-left:22px;margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.modal .x{float:right;margin:-8px -8px 0 0}
@keyframes fadeIn{from{opacity:0}}
@keyframes up{from{transform:translateY(20px);opacity:.5}}
@keyframes blink{50%{opacity:0}}
/* home */
.hero{padding:30px 0 8px}
.hero .eyebrow:before{content:"";display:inline-block;width:22px;height:2px;background:var(--acc);vertical-align:middle;margin-right:10px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,12vw,92px);line-height:.95;letter-spacing:.02em;margin:12px 0 10px;text-transform:uppercase}
.hero h1 .cur{color:var(--acc)}
.hero p{color:var(--muted);max-width:620px}
.hero .lead{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:-2px 0 10px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.stat{padding:14px 16px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--acc)}
.stat b{display:block;font-family:var(--f-head);font-size:28px;font-weight:700;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.btn{height:48px;padding:0 20px;border-radius:8px;font-family:var(--f-head);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:0 3px 0 #a86a1c}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{height:38px;padding:0 14px;font-size:15px;border-radius:10px}
.btn svg{width:18px;height:18px}
.note{margin-top:14px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--ink)}
.mod{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
.mod h2{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mod:after{content:"";flex:1;height:1px;background:var(--line)}
.blockh{margin:36px 0 4px;font-family:var(--f-head);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-left:4px solid var(--acc);padding-left:12px}
.blockh small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;font-weight:400;color:var(--dim);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.row:hover:not(:disabled) .num{background:var(--acc);color:var(--onacc)}
.row .go{flex:none;color:var(--dim);font-size:22px;transition:transform .18s,color .18s}
.row:hover:not(:disabled) .go{transform:translateX(4px);color:var(--acc)}
.num{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .num{background:var(--acc);color:var(--onacc)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--f-head);font-size:18.5px;font-weight:600;line-height:1.22}
.row .t span{font-size:14px;color:var(--muted)}
.row .t .code{font-family:var(--f-mono);font-size:11px;color:var(--acc);letter-spacing:.08em}
.row.soon{opacity:.55;cursor:default;box-shadow:none;background:transparent;padding:8px 14px;border-style:dashed}
.row.soon .num{width:28px;height:28px;background:transparent}
.row.soon .t{display:flex;gap:10px;align-items:baseline}
.row.soon .t .code{flex:none;min-width:92px}
.row.soon .t b{font-weight:500;font-size:16px}
.list .row.soon+.row.soon{margin-top:-4px}
.row.tool .num{background:var(--acc-soft);color:var(--acc)}
.row.tool .num svg{width:20px;height:20px}
.badge{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--acc-soft);color:var(--acc)}
.badge.low{background:rgba(245,184,61,.14);color:var(--amb)}
.exam{margin-top:30px;border:1px solid var(--line2);border-top:3px solid var(--acc);background:var(--paper);border-radius:10px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.exam div{flex:1;min-width:220px}
.exam b{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;display:block}
.exam span{color:var(--muted);font-size:15px}
.foot{margin:36px 0 40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* topic */
.thead{padding:26px 0 6px}
.thead .eyebrow{display:block;margin-bottom:6px}
.thead h1{font-size:clamp(26px,5vw,38px);line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.thead p{color:var(--muted);font-size:15px;margin-top:6px}
.pass{margin-top:16px;padding:16px 18px}
.pass .goal{font-weight:600;line-height:1.45}
.pass .goal small,.pass dt{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.pass details{margin-top:10px}
.pass summary{cursor:pointer;color:var(--muted);font-size:15px;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.pass summary::-webkit-details-marker{display:none}
.pass summary:before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--acc);font-weight:800}
.pass details[open] summary:before{content:"–"}
.pass dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:12px;font-size:15px}
.pass dl div.w{grid-column:1/-1}
.pass dd ol{padding-left:20px}
@media (max-width:560px){.pass dl{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tab{height:40px;padding:0 18px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--acc);color:var(--onacc)}
.lec{padding-bottom:150px}
.sec{margin-top:30px}
.sec h2{font-size:24px;line-height:1.2;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px;scroll-margin-top:90px}
.blk{border-radius:10px;padding:6px 12px;margin:0 -12px 6px;transition:background .25s;cursor:pointer;scroll-margin-top:110px;position:relative}
.blk:hover{background:var(--soft)}
.blk.now{background:var(--hl)}
.blk.now:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--hl-bar)}
.sec ul{list-style:none;margin:2px 0 8px}
.sec li.blk{padding-left:34px}
.sec li.blk:after{content:"";position:absolute;left:14px;top:.85em;width:8px;height:8px;background:var(--acc)}
.sec li.blk.now:before{left:0}
.callout{background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:14px 16px;margin:8px 0 10px;font-weight:500}
.callout small{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.callout.warn{background:#231A12;border-color:#4A3A1E;border-left-color:var(--bad)}
.callout.warn small{color:var(--bad)}
.keys{margin-top:40px;padding:20px 22px}
.keys{border-top:3px solid var(--acc)}
.keys h2{font-size:21px;margin-bottom:10px;text-transform:uppercase}
.keys ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.keys .btn{margin-top:16px}

/* player */

  const next=()=>{if(my!==QSEQid||QSEQi>=QSEQ.length)return;qa.src="audio/"+QSEQ[QSEQi++];qa.playbackRate=store.get("rate",1);qa.play().catch(()=>{})};
  qa.onended=()=>{if(my===QSEQid)setTimeout(next,180)};next();}
function qReadQuestion(){const it=Q&&Q.items[Q.i];if(!it||!it.clip)return;const L=DATA.qa.letters;
  const seq=[it.clip.q];it.opts.forEach((o,j)=>{seq.push(L[j],it.clip.o[o.k])});qPlay(seq);}
function qReadVerdict(){const it=Q&&Q.items[Q.i];if(!it||!it.clip||Q.picked===null)return;const ok=it.opts[Q.picked].ok;
  const right=it.opts.find(o=>o.ok);qPlay(ok?[DATA.qa.right,it.clip.e]:[DATA.qa.wrong,it.clip.o[right.k],it.clip.e]);}
function voiceBar(){if(!DATA.qa)return"";const on=qvOn();return `<div class="qvoice"><button class="btn fx sm" id="qvToggle" aria-pressed="${on}">${on?"🔊 Озвучка увімкнена":"🔇 Озвучка вимкнена"}</button>${Q.items[Q.i]&&Q.items[Q.i].clip?`<button class="btn fx sm" id="qvReplay">▶ Прослухати ще раз</button>`:""}</div>`}
function bindVoice(){const t=$("#qvToggle");if(t)t.onclick=()=>{store.set("qvoice",!qvOn());if(!qvOn())qStop();renderQ(true)};
  const r=$("#qvReplay");if(r)r.onclick=()=>Q.picked===null||Q.exam?qReadQuestion():qReadVerdict();}
function balWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"бал";if(a>=2&&a<=4&&(b<12||b>14))return"бали";return"балів"}
function pick(k){if(Q.picked!==null)return;qStop();Q.picked=k;const it=Q.items[Q.i];if(it.opts[k].ok)Q.score++;else Q.wrong.push(it);renderQ();
  if(Q.exam){setTimeout(()=>{if(Q&&Q.picked===k&&Q.items[Q.i]===it)nextQ()},650)}}
function nextQ(){qStop();Q.picked=null;Q.i++;if(Q.i>=Q.items.length)renderResult();else{renderQ();const qt=document.querySelector(".quiz");if(qt&&qt.getBoundingClientRect().top<0)qt.scrollIntoView()}}
function gradeOf(p){return p>=90?"Відмінно":p>=80?"Добре":p>=70?"Задовільно":"Незадовільно"}
function renderResult(){
  qStop();const n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  if(Q.save){const b=best(Q.save);if(!b||s/n>b.s/b.n)store.set("best_"+Q.save,{s,n,pct:p});}
  if(Q.exam){const prev=store.get("exam",null);if(!prev||p>prev.pct)store.set("exam",{pct:p,s,n})}
  const C=2*Math.PI*74,col=p>=PASS?"var(--acc)":p>=70?"var(--amb)":"var(--bad)";
  const passed=Q.exam?p>=70:p>=PASS;stopReward();
  let h=`<div class="res"><div class="card rw-card"><svg id="rw" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
  <div class="rw-verdict ${passed?"ok":"no"}">${passed?(p>=90?"На тобі патрон! Матеріал засвоєний.":(Q.exam?"На тобі патрон! Тест складено.":"На тобі патрон! Залік складено.")):(p>=50?"Десять віджимань. Потрібне повторення.":"Десять віджимань. Пройдіть заняття ще раз.")}</div><div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--soft)" stroke-width="14"/><circle cx="85" cy="85" r="74" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s/n)}"/></svg><div class="v"><b>${s}/${n}</b><span>${p}% · ${s} ${balWord(s)}</span></div></div>
  <div class="grade">${gradeOf(p)}</div><p>${p>=PASS?(Q.exam?"Матеріал засвоєно впевнено.":"Заняття засвоєно. Можна переходити до наступного."):`Для засвоєння потрібно ${PASS}%. Перегляньте помилки й спробуйте ще раз.`}</p><div class="cta">`;
  if(Q.wrong.length)h+=`<button class="btn fx p" id="rWrong">Повторити помилки (${Q.wrong.length})</button>`;
  h+=`<button class="btn fx" id="rAgain">Пройти ще раз</button>`;
  if(Q.save){const nx=T[T.indexOf(byId[Q.save])+1];if(nx&&p>=PASS)h+=`<button class="btn fx p" data-go="#${nx.id}">Наступне заняття →</button>`;else if(p<PASS)h+=`<button class="btn fx" data-go="#${Q.save}">Перечитати лекцію</button>`;else h+=`<button class="btn fx" data-go="#">До занять</button>`}
  else h+=`<button class="btn fx" data-go="#">До занять</button>`;
  h+=`</div>`;
  if(Q.exam){const agg={};Q.items.forEach(it=>{const a=agg[it.tid]||(agg[it.tid]={n:0,w:0});a.n++});Q.wrong.forEach(it=>agg[it.tid].w++);
    h+=`<div class="bytopic"><h3 style="font-size:18px;margin-bottom:6px">За заняттями</h3>${Object.entries(agg).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n).map(([id,a])=>`<div class="bt"><span>${esc(byId[id].short)}</span><span style="color:${a.w?"var(--bad)":"var(--ok)"}">${a.n-a.w}/${a.n}</span></div>`).join("")}</div>`}
  if(Q.wrong.length){h+=`<div class="mist"><h3>Розбір помилок</h3>${Q.wrong.map(it=>`<div class="mi">${Q.exam?`<div class="tp">${esc(byId[it.tid].short)}</div>`:""}<b>${esc(it.text)}</b><div class="ans">✓ ${esc(it.opts.find(o=>o.ok).o)}</div><div class="ex">${esc(it.ex)}</div></div>`).join("")}</div>`}
  h+=`</div>`;
  $("#quiz").innerHTML=h;bindGo();{const y=$("#quiz").getBoundingClientRect().top+scrollY-70;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}
  if(passed)rewardPass();else rewardFail();
  const cfg={title:Q.title,save:Q.save,exam:Q.exam};const wrong=Q.wrong.map(it=>({q:it.q,tid:it.tid,i:it.i}));const all=Q.all||Q.items.map(it=>({q:it.q,tid:it.tid,i:it.i}));
  const rw=$("#rWrong");if(rw)rw.onclick=()=>startQuiz({...cfg,save:null,items:wrong,exam:false});
  $("#rAgain").onclick=()=>Q.exam?renderExamStart(true):startQuiz({...cfg,items:all});
}

/* ---------- exam ---------- */
function renderExamStart(direct){
  S={view:"exam"};hidePlayer();
  const pool=[];T.forEach(t=>t.test.forEach((q,i)=>pool.push({q,tid:t.id,i})));
  const N=Math.min(30,pool.length);setHead("Підсумковий тест",N+" питань з усіх занять");
  const per=Math.max(1,Math.floor(N/T.length/2));
  let pickd=[];T.forEach(t=>{pickd.push(...shuffle(pool.filter(p=>p.tid===t.id)).slice(0,per))});
  const rest=shuffle(pool.filter(p=>!pickd.includes(p)));pickd=pickd.concat(rest.slice(0,Math.max(0,N-pickd.length)));
  if(!direct){
    $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Теоретична частина іспиту</span><h1>Підсумковий тест</h1><p>${N} випадкових питань з усіх ${T.length} відкритих занять. Підказки й пояснення — після завершення. Оцінка за Програмою курсу: 90% — відмінно, 80% — добре, 70% — задовільно, менше 70% — незадовільно.</p></div>
    <div class="cta" style="margin-top:22px"><button class="btn fx p" id="exGo">${icon("test")} Почати тест</button><button class="btn fx" data-go="#">До занять</button></div></div>`;
    bindGo();$("#exGo").onclick=()=>renderExamStart(true);return;
  }
  $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Підсумковий тест</span><h1>${N} питань</h1></div><div id="quiz" class="quiz"></div></div>`;
  startQuiz({title:"Тест",items:pickd,save:null,exam:true});Q.all=pickd;
}

  <details class="steps card" ${guideOpen} id="guideD"><summary class="how" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px"><h2 style="flex:1">Як користуватися — 4 кроки</h2><span style="color:var(--muted);font-size:14px;font-weight:600">показати / сховати</span></summary><ol style="margin-top:12px">

    if(Q.picked===null&&(k>=0||k2>=0)){e.preventDefault();pick(k>=0?k:k2)}
    else if(Q.picked!==null&&e.key==="Enter"&&document.activeElement.id!=="qNext"){e.preventDefault();nextQ()}
  }
  if(e.key==="Escape"&&!$("#mback"))go("#");
});
/* ---------- офлайн, встановлення, QR ---------- */
const ASSETS = /*ASSETS*/null;
const CACHE = /*CACHE*/"kb";
const SITE = "https://yuriygrom357357-tech.github.io/kiber/";
const QR_SVG = `/*QR*/`;
const isFile = location.protocol === "file:";
const swOK = "serviceWorker" in navigator && !isFile;
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const totalMB = Math.max(1, Math.round(ASSETS.reduce((a, x) => a + x[1], 0) / 1048576));
let OFF = {state: isFile ? "file" : "unknown", done: 0, bytes: 0};
let installEvt = null;
addEventListener("beforeinstallprompt", e => {e.preventDefault(); installEvt = e; renderOff();});
addEventListener("appinstalled", () => {installEvt = null; renderOff();});
if (swOK) { navigator.serviceWorker.register("sw.js").catch(() => {}); checkOffline(); }
async function checkOffline() {
  try { const c = await caches.open(CACHE); let miss = 0;
    for (const [p] of ASSETS) if (!(await c.match(p))) { miss++; break; }
    OFF.state = miss === 0 ? "ready" : (store.get("offline", false) ? "partial" : "none");
  } catch (e) { OFF.state = "none"; }
  renderOff();
}
async function downloadAll() {
  if (!swOK) return;
  OFF.state = "loading"; OFF.done = 0; OFF.bytes = 0; renderOff();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  try { const c = await caches.open(CACHE); let i = 0;
    const work = async () => { while (i < ASSETS.length) { const [p, b] = ASSETS[i++];
        if (!(await c.match(p))) { const r = await fetch(p, {cache: "reload"}); if (!r.ok) throw new Error(p); await c.put(p, r); }
        OFF.done++; OFF.bytes += b; paintProg(); } };
    await Promise.all([work(), work(), work(), work()]);
    store.set("offline", true); OFF.state = "ready";
  } catch (e) { OFF.state = "error"; }
  renderOff();
  if (OFF.state === "ready" && !isStandalone) setTimeout(() => openInstall(true), 400);
}
function paintProg() { const el = $("#offProg"); if (!el) return; el.style.width = (OFF.done / ASSETS.length * 100) + "%";
  const t = $("#offTxt"); if (t) t.textContent = `Завантажено ${Math.round(OFF.bytes / 1048576)} з ${totalMB} МБ · не закривайте сторінку`; }
const ICON = {
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>'
};
function renderOff() {
  const b = $("#dlBtn");
  if (b) { b.classList.toggle("ok", OFF.state === "ready" || OFF.state === "file"); b.classList.toggle("need", OFF.state === "none" || OFF.state === "partial"); }
  const box = $("#offCard"); if (!box) return;
  let h = ""; const qrb = `<button class="btn fx" onclick="openQR()">${ICON.qr} QR-код</button>`;
  if (OFF.state === "file") h = `<div class="off card done"><div class="oi">${ICON.ok}</div><div class="ot"><b>Офлайн-версія з флешки</b><span>Курс працює без інтернету на цьому комп’ютері.</span></div><div class="oa">${qrb}</div></div>`;
  else if (OFF.state === "loading") h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>Завантаження курсу…</b><span id="offTxt">Підготовка…</span><div class="pbar"><i id="offProg"></i></div></div></div>`;
  else if (OFF.state === "ready") { const inst = isStandalone ? "" : `<button class="btn fx p" onclick="openInstall()">${ICON.dl} Встановити як застосунок</button>`;
    h = `<div class="off card done"><div class="oi">${ICON.ok}</div><div class="ot"><b>Курс збережено на цьому пристрої</b><span>Лекції, озвучка, тести і тренажери працюють без інтернету.</span></div><div class="oa">${inst}${qrb}</div></div>`; }
  else if (!swOK) h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>Офлайн-режим недоступний у цьому браузері</b><span>Відкрийте курс у Chrome, Safari або Edge.</span></div><div class="oa">${qrb}</div></div>`;
  else { const upd = OFF.state === "partial";
    const err = OFF.state === "error" ? "Не вдалося завантажити все — перевірте інтернет і натисніть ще раз." : upd ? `Вийшло оновлення курсу · ${totalMB} МБ` : `Телефон, планшет або комп’ютер · ${totalMB} МБ · один раз з інтернетом`;
    h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>${upd ? "Оновіть курс для офлайну" : "Працюйте без інтернету"}</b><span>${err}</span></div><div class="oa"><button class="btn fx p" onclick="downloadAll()">${ICON.dl} ${upd ? "Оновити курс" : "Завантажити курс"}</button>${qrb}</div></div>`; }
  box.innerHTML = h; paintProg();
}
function modal(html) { closeModal(); const m = document.createElement("div"); m.className = "mback"; m.id = "mback";
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="ib x" onclick="closeModal()" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal() { const m = $("#mback"); if (m) m.remove(); }
function openQR() { const share = navigator.share ? `<button class="btn fx" onclick="navigator.share({title:'КІБЕР',url:SITE}).catch(()=>{})">Поділитися</button>` : "";
  modal(`<h2>Відкрити курс на телефоні</h2><p>Наведіть камеру телефону на код і торкніться посилання. Реєстрація не потрібна.</p><div class="qr">${QR_SVG}</div><div class="url">${SITE.replace("https://", "")}</div><div class="mrow"><button class="btn fx p" id="cpBtn" onclick="copyLink()">Скопіювати посилання</button>${share}</div>`); }
function copyLink() { const done = () => { const b = $("#cpBtn"); if (b) b.textContent = "Скопійовано ✓"; }; if (navigator.clipboard) navigator.clipboard.writeText(SITE).then(done, () => {}); else done(); }
function openInstall(auto) {
  if (installEvt && auto === true) { modal(`<h2>Курс збережено ✓</h2><p>Лекції, озвучка і тести тепер працюють без інтернету. Додайте іконку курсу на екран, щоб відкривати його одним дотиком.</p><div class="mrow"><button class="btn fx p" onclick="closeModal();openInstall()">Встановити застосунок</button><button class="btn fx" onclick="closeModal()">Пізніше</button></div>`); return; }
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderOff(); }); return; }
  let steps;
  if (isIOS) steps = `<ol><li>Натисніть <b>«Поділитися»</b> (квадрат зі стрілкою) внизу Safari.</li><li>Оберіть <b>«На екран „Додому“»</b>.</li><li>Натисніть <b>«Додати»</b> — з’явиться іконка «КІБЕР».</li></ol>`;
  else if (/Android/i.test(ua)) steps = `<ol><li>Натисніть меню браузера <b>⋮</b> угорі праворуч.</li><li>Оберіть <b>«Встановити застосунок»</b> або <b>«Додати на головний екран»</b>.</li><li>Підтвердіть — з’явиться іконка «КІБЕР».</li></ol>`;
  else steps = `<ol><li>У Chrome або Edge натисніть значок <b>встановлення</b> праворуч в адресному рядку.</li><li>Підтвердіть <b>«Встановити»</b> — курс відкриватиметься окремим вікном, навіть без інтернету.</li></ol>`;
  modal(`<h2>Встановити як застосунок</h2><p>Додайте іконку, щоб відкривати курс одним дотиком.</p>${steps}<div class="mrow"><button class="btn fx p" onclick="closeModal()">Зрозуміло</button></div>`);
}
$("#qrBtn").onclick = openQR;
$("#dlBtn").onclick = () => {
  if (OFF.state === "ready") openInstall();
  else if (OFF.state === "file") modal(`<h2>Офлайн-версія</h2><p>Ви відкрили курс з флешки або папки — він уже працює без інтернету.</p><div class="mrow"><button class="btn fx p" onclick="closeModal()">Добре</button></div>`);
  else { if (S.view !== "home") go("#"); setTimeout(() => { const c = $("#offCard"); if (c) c.scrollIntoView({behavior: "smooth", block: "center"}); if (OFF.state !== "loading") downloadAll(); }, 60); }
};
addEventListener("keydown", e => { if (e.key === "Escape" && $("#mback")) { closeModal(); e.stopImmediatePropagation(); } }, true);
route();
</script>
