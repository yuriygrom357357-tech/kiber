Роби по кроках»?", ["Дія розбивається на етапи; курсант не переходить далі, поки не виконає попередній без помилок", "Курсант виконує всю дію від початку до кінця на час", "Інструктор мовчки показує дію", "Курсанти обговорюють дію в групах"], "Наприклад, перевірка зброї на розрядженість виконується за командами, крок за кроком."], ["Чим практика відрізняється від імітації?", ["Курсанти виконують дії самостійно в умовах, наближених до реальних", "Інструктор виконує дію разом з курсантами", "Курсанти лише спостерігають", "Практика проводиться тільки в класі"], "На практиці курсант діє сам, багаторазово, з нарощуванням темпу."], ["Коли на етапі практики інструктор не коментує дії курсантів?", ["Коли заняття перевірочне або контрольне", "Ніколи не коментує", "Завжди коментує кожну дію", "Лише вночі"], "На перевірочному і контрольному заняттях курсант працює без підказок."], ["Який розподіл часу між частинами заняття рекомендовано?", ["Вступна 10%, основна 80%, заключна 10%", "Вступна 30%, основна 40%, заключна 30%", "Вступна 20%, основна 60%, заключна 20%", "Вступна 5%, основна 90%, заключна 5%"], "Основна частина — 80% часу, вступна і заключна — по 10%."], ["Скільки часу основної частини має займати практика?", ["Не менше 50%", "10%", "15%", "25%"], "Практиці віддається максимум часу — не менше половини основної частини."], ["Скільки часу основної частини відводиться на демонстрацію?", ["15%", "50%", "25%", "10%"], "Пояснення 10%, демонстрація 15%, імітація 25%, практика не менше 50%."], ["Скільки часу основної частини відводиться на імітацію?", ["25%", "10%", "15%", "50%"], "Імітація — 25% часу основної частини."], ["Яка послідовність вивчення автомата відповідає логіці EDIP?", ["Призначення і ТТХ → будова → розбирання і збирання → стрільба", "Стрільба → будова → ТТХ", "Розбирання → стрільба → ТТХ", "Будова → стрільба → призначення"], "Кожен наступний елемент — лише після засвоєння попереднього."], ["Що буде з оцінкою за проведене заняття, якщо курсант-інструктор порушив техніку EDIP?", ["Незадовільно", "Знизиться на один бал", "Нічого, якщо інші пункти виконано", "Задовільно"], "Порушення техніки EDIP за оціночним листом — це «незадовільно» за все заняття."]]}, {"id": "b1m2t2z1", "code": "Б1 М2 Т2 З1", "theme": "Тема 2. Фактори та принципи навчання", "title": "Суть навчання та викладання", "short": "Навчання і викладання", "passport": {"goal": "Ознайомити військовослужбовців з принципами, особливостями та різницею між навчанням і викладанням.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Поняття навчання", "Поняття викладання", "Принципи, особливості та різниця між навчанням і викладанням"], "assess": "Усні запитання; у кінці — індивідуальний письмовий тест на 3 питання.", "criteria": "3 правильні відповіді — «відмінно», 2 — «добре», 1 — «задовільно».", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.1; презентація; тест за темою"}, "sections": [{"h": "Що таке навчання", "body": [["p", "Навчання — організована двостороння діяльність, спрямована на максимальне засвоєння та усвідомлення навчального матеріалу і подальше застосування знань, умінь і навичок на практиці."], ["p", "У Збройних Силах навчання визначають так: «Це організована співпраця між інструктором і тими, хто навчається, спрямована на досягнення цілей навчання». Інструктор очолює цю співпрацю, але виконують завдання всі разом: інструктор допомагає курсантам, а курсанти — інструкторові й одне одному."], ["key", "Навчання = викладання + учіння. Два взаємопов’язані процеси, які не працюють один без одного."]]}, {"h": "Викладання і учіння", "body": [["p", "<b>Викладання</b> — діяльність інструктора: поставити перед курсантами пізнавальне завдання, повідомити нові знання, організувати спостереження і практичні заняття, керувати самостійною роботою, перевірити якість знань, умінь і навичок."], ["p", "<b>Учіння</b> — цілеспрямований процес засвоєння знань і оволодіння вміннями та навичками тими, хто навчається."], ["p", "Оскільки навчання — двосторонній процес, ефективність викладання напряму залежить від ефективності учіння. Найкраща лекція не дасть результату, якщо курсант не працює сам."]]}, {"h": "Короткотривалі і довготривалі зміни", "body": [["p", "Навчання — це процес набуття нових знань, навичок і цінностей через досвід, вивчення чи роздуми, що змінює поведінку людини. Але не кожна зміна закріплюється."], ["p", "<b>Короткотривалі зміни</b> — первинна реакція на новий досвід, яка ще не стала звичкою:"], ["ul", ["<b>ефект новизни</b> — курсант правильно займає положення для стрільби, поки свідомо про це думає; щойно увага перемикається, повертається стара модель;", "<b>нестабільність</b> — без повторення навичка «розмивається» вже за 2–3 дні;", "<b>залежність від контексту</b> — під наглядом інструктора діє правильно, а в змінених умовах розгублюється;", "<b>швидка втомлюваність</b> — неавтоматизована дія потребує багато енергії, і через виснаження настає «відкат»."]], ["p", "<b>Довготривалі зміни</b> формуються поступово. Щоб зміни стали постійними, потрібні інтервальні повторення, практичне застосування і зворотний зв’язок."], ["warn", "Те, що курсант правильно виконав дію зараз, ще не означає, що він закріпив навичку назавжди."]]}, {"h": "Дидактичні принципи навчання", "body": [["p", "Принципи навчання — основні положення, що визначають зміст, форми і методи навчальної роботи. Основні з них:"], ["ul", ["<b>Науковості</b> — усі факти й положення, що вивчаються, мають бути науково правильними.", "<b>Системності і послідовності</b> — логічний перехід від засвоєного до нового, фокус на ключових аспектах.", "<b>Доступності</b> — від простого до складного, від відомого до невідомого, з урахуванням рівня курсантів.", "<b>Зв’язку навчання з життям</b> — теорія є основою практики; використовуємо життєвий і бойовий досвід курсантів.", "<b>Свідомості й активності</b> — роз’яснення мети, позитивні мотиви, контроль і самоконтроль.", "<b>Наочності</b> — сприяє активному сприйманню й осмисленню матеріалу.", "<b>Міцності засвоєння</b> — повторення за розділами, поєднання нового з вивченим.", "<b>Індивідуального підходу</b> — кожен опановує матеріал з урахуванням свого рівня."]]]}, {"h": "Як людина отримує досвід", "body": [["p", "Особистий досвід — сукупність знань, умінь, переживань, які людина набуває через власні дії, помилки та успіхи. Він складається з етапів:"], ["ul", ["<b>ситуація</b> — курсант опиняється в умовах, що змушують діяти: нове завдання, змагання або помилка;", "<b>спостереження</b> — що пішло не так, що спрацювало, які були емоції;", "<b>концептуалізація</b> — курсант робить висновки, і знання перетворюється на досвід, власне «правило»."]], ["key", "Завдання інструктора — створити ситуацію, допомогти проаналізувати її і зробити висновок. Саме тому після кожного заняття проводять АПД."]]}], "keys": ["Навчання — організована співпраця інструктора і курсантів для досягнення цілей навчання.", "Навчання складається з викладання (діяльність інструктора) та учіння (діяльність курсанта).", "Короткотривалі зміни нестабільні; для довготривалих потрібні повторення, практика і зворотний зв’язок.", "Основні принципи: науковість, системність, доступність, зв’язок з життям, свідомість, наочність, міцність, індивідуальний підхід.", "Досвід формується через ситуацію, спостереження і висновок."], "test": [["Як у ЗСУ визначають навчання?", ["Організована співпраця інструктора і тих, хто навчається, спрямована на досягнення цілей навчання", "Передача наказів від командира підлеглим", "Самостійне читання статутів", "Перевірка знань курсантів"], "Навчання — співпраця, яку очолює інструктор."], ["З яких двох процесів складається навчання?", ["Викладання й учіння", "Наказу і виконання", "Лекції і тесту", "Теорії і відпочинку"], "Навчання — двосторонній процес."], ["Що таке викладання?", ["Діяльність інструктора: ставить завдання, повідомляє знання, організовує практику, перевіряє", "Самостійна робота курсанта", "Оцінювання на іспиті", "Підготовка навчального класу"], "Викладання — діяльність того, хто навчає."], ["Що таке учіння?", ["Цілеспрямований процес засвоєння знань, умінь і навичок курсантом", "Діяльність інструктора на лекції", "Складання розкладу занять", "Перевірка наявності особового складу"], "Учіння — діяльність того, хто навчається."], ["Від чого напряму залежить ефективність викладання?", ["Від ефективності учіння", "Лише від тривалості заняття", "Від кольору презентації", "Від кількості тестів"], "Навчання двостороннє: без роботи курсанта результату немає."], ["Що характерно для короткотривалих змін у поведінці?", ["Нестабільність: без повторення навичка «розмивається» за 2–3 дні", "Вони закріплюються назавжди після першого показу", "Вони не залежать від умов", "Вони не потребують енергії"], "Короткотривалі зміни ще не закріпилися як навичка."], ["Що потрібно, щоб зміни стали довготривалими?", ["Інтервальні повторення, практичне застосування і зворотний зв’язок", "Одна довга лекція", "Тільки письмовий тест", "Відпочинок без практики"], "Три умови закріплення навички."], ["Курсант правильно діє під наглядом інструктора, але губиться в нових умовах. Що це?", ["Залежність від контексту — ознака короткотривалої зміни", "Повністю сформована навичка", "Порушення дисципліни", "Принцип наочності"], "Навичка ще прив’язана до умов, у яких її вивчали."], ["Що вимагає принцип доступності?", ["Від простого до складного, від відомого до невідомого", "Викладати якомога більше матеріалу за раз", "Використовувати лише наукові терміни", "Навчати тільки найкращих"], "Зміст і методи мають відповідати можливостям курсантів."], ["Що вимагає принцип науковості?", ["Усі факти й положення мають бути науково правильними", "Кожне заняття проводити в лабораторії", "Цитувати науковців", "Заборонити практичні заняття"], "Навчати лише правильного."], ["Що забезпечує принцип зв’язку навчання з життям?", ["Використання життєвого досвіду курсантів і застосування знань на практиці", "Навчання лише в польових умовах", "Відмову від теорії", "Заняття тільки у вихідні"], "Теорія — основа практики."], ["Що сприяє реалізації принципу міцності засвоєння?", ["Повторення матеріалу і поєднання нового з вивченим", "Одноразовий показ", "Скорочення практики", "Відсутність контролю"], "Міцність досягається повторенням."], ["Що дає принцип індивідуального підходу?", ["Кожен опановує матеріал з урахуванням свого рівня в умовах колективної роботи", "Кожен курсант навчається окремо від групи", "Інструктор працює лише з відмінниками", "Курсанти самі обирають тему"], "Колективна робота з урахуванням особливостей кожного."], ["Які етапи формування особистого досвіду?", ["Ситуація, спостереження, концептуалізація", "Наказ, виконання, доповідь", "Лекція, тест, оцінка", "Підйом, зарядка, сніданок"], "Від дії — через аналіз — до висновку."], ["На етапі концептуалізації курсант…", ["Робить висновки, і знання перетворюється на досвід", "Отримує нове завдання", "Тільки спостерігає за іншими", "Складає іспит"], "Створюється власне «правило»."]]}, {"id": "b1m2t2z2", "code": "Б1 М2 Т2 З2", "theme": "Тема 2. Фактори та принципи навчання", "title": "Області (сфери) навчання", "short": "Сфери навчання", "passport": {"goal": "Пояснити військовослужбовцям поняття теоретичних знань та практичних дій (умінь і навичок), чим вони набуваються (формуються).", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Поняття знань, умінь і навичок, різниця між ними", "Як набуваються знання, уміння і навички", "Таксономія Блума і сфери навчання"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо засвоїв матеріал з усіх навчальних питань не нижче оцінки «добре».", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.2; презентація; тест за темою"}, "sections": [{"h": "Навіщо знати сфери навчання", "body": [["p", "Основне завдання навчання — передати курсанту знання і сформувати в нього вміння та навички. Сфери навчання — один з основних аспектів, які враховують під час планування заняття: від типу сфери залежать навчальні завдання, організація заняття і спосіб подачі інформації."], ["p", "За таксономією Блума (1956 рік) виділяють три сфери: <b>когнітивну (знання)</b>, <b>психомоторну (навички)</b> та <b>афективну (ставлення, цінності)</b>. Після заняття курсант має набути нових знань, навичок і змінити систему цінностей."], ["key", "Когнітивна сфера — основна: застосування двох інших завжди потребує певної частки знань."]]}, {"h": "Знання", "body": [["p", "Знання — теоретично узагальнений досвід, результат пізнання дійсності. Знання підвищують усвідомленість діяльності і впевненість у правильності виконання. Без знань виконати діяльність неможливо."], ["ul", ["<b>Фактичні знання</b> — одиничні поняття, інформація, завчена напам’ять: знаки, цифри, назви, події. Це знання «про щось». Наприклад: бензин — пальне для автомобілів, його добувають з нафти, він легкозаймистий.", "<b>Теоретичні знання</b> — схеми й аналогії, що пояснюють природу процесів і дозволяють прогнозувати.", "<b>Процедурні знання</b> — знання про те, «як…?» і «яким чином…?»: порядок і послідовність процесу.", "<b>Інтегровані знання</b> — поєднання фактичних і процедурних."]], ["p", "Приклад з маскування: курсант знає демаскуючі ознаки — відблиск, колір, розмір, тінь, силует, текстуру, форму (фактичні знання) і розуміє, як замаскувати фортифікаційну споруду (процедурні)."]]}, {"h": "Уміння і навичка", "body": [["p", "<b>Уміння</b> — здатність на належному рівні виконувати певні дії на основі доцільного використання знань і навичок. Формується в кілька стадій: ознайомлення й усвідомлення змісту, початкове оволодіння, самостійне і дедалі точніше виконання. Найвищий рівень уміння — розвинута навичка."], ["p", "<b>Навичка</b> — здатність виконувати дію раціонально, точно і швидко, без постійного контролю свідомості і без зайвих витрат сил. Приклади: їзда на велосипеді, керування автомобілем, перевірка зброї."], ["p", "Деякі педагоги виділяють і четвертий результат навчання — <b>ставлення</b>: цінності, переконання, інтереси, мотивацію. Воно впливає на поведінку і бажання навчатися далі."]]}, {"h": "Як знання стають навичкою", "body": [["p", "Джерела знань бувають <b>зовнішні</b> (люди, книги, навчальний контент, спостереження), <b>внутрішні</b> (власні міркування, аналіз, висновки) та <b>інтегровані</b> (власний досвід, доповнений з інших джерел)."], ["p", "Уміння формуються на базі знань під час спроби втілити їх на практиці: знання — основа уміння. Навичка — результат багаторазового виконання дій, тобто практики."], ["p", "Наприклад: курсант вивчив будову автомата АКМ і порядок неповного розбирання — він <b>знає</b>. Потім розбирає і збирає сам, без допомоги — він <b>уміє</b>. Після кількох десятків повторень на час робить це, не контролюючи рук свідомістю, — це вже <b>навичка</b>."], ["key", "Знаю → вмію → роблю автоматично. Знання дає теорія, уміння — перша практика, навичку — багаторазове повторення."]]}, {"h": "Психомоторна і афективна сфери", "body": [["p", "<b>Психомоторна сфера</b> зосереджена на виконанні послідовності рухів із заданою точністю, плавністю, швидкістю чи силою. В основі рухів завжди лежить їх розуміння. Тому ефективні відеозаписи, презентації, покрокова демонстрація. Курсант має продемонструвати навичку в присутності інструктора, який визначає відповідність стандарту."], ["p", "<b>Афективна сфера</b> стосується ставлення, цінностей, емоцій і мотивації — того, як курсант ставиться до навчання і до своєї ролі. Її формують особистий приклад інструктора, атмосфера на занятті та розуміння, навіщо це потрібно в бою."]]}], "keys": ["Три сфери навчання: когнітивна (знання), психомоторна (навички), афективна (ставлення).", "Типи знань: фактичні, теоретичні, процедурні, інтегровані.", "Уміння — виконання дії на основі знань; навичка — виконання без контролю свідомості.", "Знання — основа вміння; навичка — результат багаторазової практики.", "Джерела знань: зовнішні, внутрішні, інтегровані."], "test": [["Які три сфери навчання виділяють?", ["Когнітивну, психомоторну, афективну", "Фізичну, стройову, вогневу", "Теоретичну, лекційну, польову", "Усну, письмову, практичну"], "Знання, навички і ставлення."], ["Яку сферу вважають основною?", ["Когнітивну", "Психомоторну", "Афективну", "Стройову"], "Інші сфери потребують залучення когнітивної складової."], ["Що таке навичка?", ["Здатність виконувати дію точно і швидко без постійного контролю свідомості", "Знання, завчене напам’ять", "Бажання навчатися", "Перша спроба виконати дію"], "Навичка — автоматизована дія."], ["Що таке уміння?", ["Здатність на належному рівні виконувати дії на основі знань і навичок", "Будь-яке завчене визначення", "Емоційне ставлення до предмета", "Розклад тренувань"], "Уміння засноване на використанні знань."], ["Які типи знань ви знаєте?", ["Фактичні, процедурні, інтегровані", "Структурні, прагматичні, інтегральні", "Тільки письмові", "Короткі й довгі"], "Фактичні, теоретичні, процедурні, інтегровані."], ["Що таке фактичні знання?", ["Інформація, завчена напам’ять, — знання «про щось»", "Знання про те, «як» щось зробити", "Емоції під час навчання", "Здатність діяти без контролю свідомості"], "Цифри, назви, факти."], ["Що таке процедурні знання?", ["Знання про те, «як…?» і «яким чином…?»", "Перелік дат і подій", "Цінності та переконання", "Фізична витривалість"], "Порядок і послідовність процесу."], ["Що таке інтегровані знання?", ["Поєднання фактичних і процедурних знань", "Знання, отримані лише з книг", "Знання іноземної мови", "Навички стрільби"], "Знаю «що» і знаю «як»."], ["Курсант уперше самостійно розібрав автомат без допомоги. Це…", ["Уміння", "Навичка", "Фактичне знання", "Ставлення"], "Навичкою це стане після багаторазових повторень."], ["Що є основою уміння?", ["Знання", "Випадок", "Звичка", "Наказ"], "Уміння формуються на базі знань під час практики."], ["Як формується навичка?", ["Багаторазовим практичним виконанням дій", "Одним переглядом відео", "Читанням інструкції", "Відповіддю на тест"], "Навичка — результат практики."], ["Що належить до внутрішніх джерел знань?", ["Власні міркування, аналіз, висновки", "Книги", "Інструктор", "Навчальне відео"], "Зовнішні — інші люди, книги, контент."], ["На чому зосереджена психомоторна сфера?", ["На виконанні послідовності рухів із заданою точністю, швидкістю, силою", "На запам’ятовуванні дат", "На цінностях і мотивації", "На складанні розкладу"], "Психомоторна — це навички."], ["Що належить до афективної сфери?", ["Ставлення, цінності, мотивація", "Будова автомата", "Розбирання зброї на час", "Формули балістики"], "Афективна сфера — про ставлення."], ["Демаскуючі ознаки (відблиск, тінь, силует…) — це який тип знань?", ["Фактичні", "Процедурні", "Афективні", "Психомоторні"], "Перелік ознак — знання «про щось»."], ["Хто запропонував класифікацію педагогічних цілей у 1956 році?", ["Бенджамін Блум", "Чарльз Аллен", "Малкольм Ноулз", "Абрахам Маслоу"], "Таксономія Блума."]]}, {"id": "b1m2t2z3", "code": "Б1 М2 Т2 З3", "theme": "Тема 2. Фактори та принципи навчання", "title": "Сприйняття інформації та комунікація", "short": "Сприйняття інформації", "passport": {"goal": "Ознайомити військовослужбовців з особливостями сприйняття інформації людиною, пояснити зв’язок процесу сприйняття інформації та комунікації, особливості навчання дорослих.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Процес і типи сприйняття", "Особливості навчання дорослих", "Уважність під час навчання", "Графіки активності курсантів"], "assess": "Усне опитування; у кінці — намалювати графіки активності на занятті та протягом дня.", "criteria": "Позитивно — якщо надав відповіді й правильно зобразив обидва графіки.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.3; презентація; практичне завдання"}, "sections": [{"h": "Що таке сприйняття", "body": [["p", "Сприйняття — процес, під час якого сенсорна система надсилає сигнали в мозок, де вони обробляються і стають психічними переживаннями. Схема проста: дія → відчуття → обробка."], ["p", "Люди сприймають одне й те саме по-різному. На обробку впливають досвід, знання, навички, ставлення, розум, темперамент, звички, упередження, очікування, почуття, а також фізичний і психологічний стан."], ["p", "Досвідчений інструктор знає, як курсанти обробляють інформацію, тому краще обирає метод її подачі. Знання рівня підготовки курсантів — необхідна умова вибору методів і форм навчання."]]}, {"h": "Два принципи: цілісність і структура", "body": [["p", "<b>Цілісне сприйняття.</b> Людина сприймає предмет цілком, а не окремі властивості. Дивлячись на кілька ліній, ми «бачимо» щасливе і сумне обличчя — мозок сам додає відсутню інформацію з досвіду. Тому інструктор має подавати матеріал цілісно — словесно і візуально, з прикладами з оточення курсантів."], ["p", "<b>Структурне сприйняття.</b> Якщо сірники чи рисочки викладені впорядковано, їх легко порахувати; хаотичні — важко. Людина сприймає структуру і взаємозв’язки. Тому матеріал має бути чітко впорядкований, а інструктор повинен переконатися, що курсанти бачать загальну картину."], ["key", "Подавайте цілісну картину і чітку структуру: курсант має бачити не набір фактів, а систему, де все пов’язано."]]}, {"h": "Особливості навчання дорослих", "body": [["p", "Андрагогіка — мистецтво і наука допомагати дорослим вчитися. Дорослий учень, за Малкольмом Ноулзом, — зріла людина, яка вважає себе відповідальною за своє життя."], ["ul", ["<b>Самосвідомість</b> — дорослий може мотивувати себе сам і швидше вчиться, коли бере участь у процесі; він чинить опір, коли йому не дають діяти самостійно.", "<b>Досвід</b> — у дорослого є життєвий і бойовий досвід; використовуйте його на користь групи.", "<b>Готовність</b> — дорослі хочуть вчитися того, що потрібно для їхньої ролі; їм треба не «багато вчити», а показати, як робити ефективно.", "<b>Орієнтація на результат</b> — покажіть, як заняття допоможе досягти мети, інакше курсант не побачить цінності навчання."]]]}, {"h": "Сприйняття і комунікація протягом дня", "body": [["p", "Комунікація — обмін інформацією між інструктором і курсантами через мову, жести, міміку, технічні засоби. Що чіткіша й логічніша комунікація, то менше когнітивне навантаження і краще засвоєння."], ["p", "Протягом дня увага курсантів коливається через утому, монотонність або збудження. Підтримують увагу зміна форм подачі матеріалу (лекція, дискусія, практика) і регулярний зворотний зв’язок від курсантів."], ["p", "Чинники, якими інструктор підвищує уважність:"], ["ul", ["варіативність методів і мультимедіа — відео, презентації, анімація;", "позитивна атмосфера — похвала, здорова конкуренція, відкритий діалог;", "групова робота, рольові ігри, мозковий штурм, запитання на роздуми;", "структурованість, повтори й підсумки ключових моментів;", "доречний гумор, відсутність зайвого стресу;", "короткі паузи і чергування розумової роботи з рухом;", "урахування рівня, інтересів і мотивації курсантів."]]]}, {"h": "Графіки активності курсантів", "body": [["p", "Ніхто не може бути повністю зосередженим увесь час. Згідно з довідковим матеріалом, курсанти здатні уважно слухати близько 6 хвилин і дивитися близько 12 хвилин, після чого концентрація падає. Увага вища, коли курсанти не лише слухають, а й беруть активну участь."], ["p", "<b>Крива енергії заняття</b> показує, як змінюється уважність протягом 45 хвилин. Найважчий матеріал подавайте на піку енергії, а коли крива падає — переходьте до методів з активною участю курсантів."], ["p", "<b>Крива енергії дня</b> показує, що найпродуктивніші ранкові заняття, пік — близько 11-ї години. Одразу після обіду енергія падає, тож перше заняття після обіду краще зробити активним, але без важких фізичних вправ. Найскладнішу тему ставте на час піку енергії."], ["key", "Плануйте заняття за кривими енергії: складне — на пік, активне — на спад."], ["p", "Практичне завдання заняття: самостійно намалювати графік уважності на занятті (45 хв) і графік уважності протягом дня."]]}], "keys": ["Сприйняття: дія → відчуття → обробка; на нього впливають досвід, очікування, стан людини.", "Два принципи: люди сприймають цілісно і структурно.", "Дорослі вчаться краще, коли бачать користь, беруть участь і можуть спиратися на свій досвід.", "Увагу підтримують зміна методів, активна участь, паузи, позитивна атмосфера.", "Найпродуктивніший час дня — ранок, пік близько 11:00; після обіду — спад."], "test": [["Що таке сприйняття?", ["Процес, коли сенсорна система надсилає сигнали в мозок, де вони стають психічними переживаннями", "Запам’ятовування тексту", "Відповідь на запитання інструктора", "Перегляд презентації"], "Дія → відчуття → обробка."], ["Які два принципи сприйняття розглядаються на занятті?", ["Цілісність і структурність", "Швидкість і точність", "Гучність і яскравість", "Короткість і простота"], "Люди сприймають цілісно і структурно."], ["Чому кілька ліній ми бачимо як обличчя?", ["Мозок сам додає відсутню інформацію з досвіду — цілісне сприйняття", "Через поганий зір", "Через структурне сприйняття", "Це випадковість"], "Ми сприймаємо цілісність."], ["Чому впорядковані рисочки легше порахувати?", ["Людина сприймає структуру — це структурне сприйняття", "Вони більші за розміром", "Через колір", "Це залежить лише від освітлення"], "Структура полегшує сприйняття."], ["Що з цього НЕ впливає на сприйняття однієї й тієї самої інформації?", ["Колір форми одягу інструктора", "Досвід людини", "Очікування", "Фізичний і психологічний стан"], "Сприйняття залежить від особистих факторів людини."], ["Що таке андрагогіка?", ["Мистецтво і наука допомагати дорослим вчитися", "Методика навчання дітей", "Наука про зброю", "Різновид фізичної підготовки"], "Навчання дорослих."], ["Що важливо показати дорослому учню?", ["Як заняття допоможе досягти його мети", "Скільки сторінок треба вивчити", "Хто головний в аудиторії", "Розклад на місяць"], "Дорослі орієнтовані на результат."], ["Як використовувати досвід дорослих курсантів?", ["На користь групи — залучати до обговорення й прикладів", "Ігнорувати, щоб не заважав", "Забороняти згадувати", "Тільки на іспиті"], "Досвід дорослих — ресурс навчання."], ["Скільки часу курсант здатен уважно слухати, згідно з довідковим матеріалом?", ["Близько 6 хвилин", "Близько 45 хвилин", "Близько 2 годин", "Близько 30 секунд"], "Слухати — близько 6 хвилин, дивитися — близько 12."], ["Коли подавати найважчий матеріал заняття?", ["На піку енергії курсантів", "У кінці заняття", "Коли увага падає", "Після обіду"], "Складне — на пік енергії."], ["Що робити, коли крива уважності на занятті падає?", ["Перейти до методів з активною участю курсантів", "Говорити швидше", "Продовжувати лекцію без змін", "Завершити заняття"], "Активність повертає увагу."], ["Коли, за кривою енергії дня, пік продуктивності?", ["Близько 11:00", "Одразу після обіду", "О 18:00", "Опівночі"], "Ранок найпродуктивніший."], ["Яким має бути перше заняття після обіду?", ["Активним, але без важких фізичних вправ", "Найдовшою лекцією дня", "Іспитом з теорії", "Самостійним читанням"], "Після обіду енергія спадає."], ["Що зменшує когнітивне навантаження курсантів?", ["Чіткість, логічність і доступність викладу", "Багато тексту на слайді", "Монотонна подача", "Відсутність структури"], "Ефективна комунікація покращує сприйняття."], ["Що з переліченого підвищує уважність курсантів?", ["Зміна форм подачі матеріалу і короткі паузи", "Одноманітна лекція без пауз", "Стрес і погрози", "Заборона запитань"], "Варіативність і паузи відновлюють увагу."], ["Яке практичне завдання виконують курсанти в кінці заняття?", ["Малюють графіки уважності на занятті і протягом дня", "Розбирають автомат", "Пишуть опис цілі", "Проводять АПД"], "Графіки енергії заняття і дня."]]}, {"id": "b1m2t2z4", "code": "Б1 М2 Т2 З4", "theme": "Тема 2. Фактори та принципи навчання", "title": "Мотивування курсантів", "short": "Мотивація", "passport": {"goal": "Ознайомити військовослужбовців із принципами мотивування курсантів.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Поняття мотивації та її важливість", "Основні теорії мотивації", "Види та принципи мотивування", "Методи мотивування курсантів"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; тестування «мотивація успіху та страх невдачі» (Мехрабіан).", "criteria": "Позитивно — якщо пояснює, що таке мотивація, називає її види і теорії.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.4; презентація; тест за темою"}, "sections": [{"h": "Що таке мотивація", "body": [["p", "Мотивація — внутрішній емоційний стан людини, що спонукає її до дій. Саме вона визначає напрям, силу і стійкість поведінки в досягненні цілей і є рушієм активної участі курсантів у навчанні."], ["p", "Дії, пов’язані з досягненням бажаного, вимагають менше сил і часу, ніж ті, до яких людина байдужа. Будь-яке навчання може стати рутиною або захопливою справою — залежно від того, чи відповідає воно внутрішнім потребам людини."], ["p", "Низька мотивація призводить до розсіювання уваги і небажання бути на занятті. Тому інструктор організовує роботу так, щоб викликати зацікавленість, підвищити активність і стимулювати бажання прогресувати: навчання має бути важливим і корисним, якомога активнішим, з можливістю бачити власні досягнення."], ["key", "«За відсутності мотивації ви приречені на посередній результат, якими б здібностями не володіли» — Ендрю Карнегі."]]}, {"h": "Теорії мотивації: Маслоу і Врум", "body": [["p", "<b>Ієрархія потреб Абрахама Маслоу.</b> Мотивація залежить від потреб, які мають ієрархію від базових до вищих: фізіологічні → безпеки → соціальні → повага → самовираження. Потреби задовольняються знизу вгору: поки не задоволені базові, вищі слабко проявляються і не мотивують."], ["p", "Голодний, змерзлий або невиспаний курсант думатиме про їжу, тепло і сон, а не про тему заняття."], ["p", "<b>Теорія очікувань Віктора Врума.</b> Мотивація досягається винагородою, а сила прагнення залежить від трьох факторів:"], ["ul", ["чи є зв’язок між зусиллями і результатом;", "чи реально отримати винагороду за результат;", "чи цінна ця винагорода для самої людини."]], ["p", "Якщо очікування не справджуються, виникає відчуття марності зусиль. Допомагають досяжні цілі й винагорода, яку людина цінує. Складність завдання має відповідати здібностям того, хто його виконує."]]}, {"h": "Теорії мотивації: Герцберг і постановка цілей", "body": [["p", "<b>Теорія двох факторів Фредеріка Герцберга (1959).</b> Є дві незалежні групи факторів:"], ["ul", ["<b>гігієнічні</b> — пов’язані з умовами, а не змістом роботи: правила, справедливість керівництва, оплата, стосунки, умови праці, статус, стабільність. Їх наявність не робить людину задоволеною, але відсутність викликає незадоволення — як гігієна: не робить щасливим, але без неї хворієш;", "<b>мотиватори</b> — пов’язані із самою суттю роботи: досягнення, визнання, цікавий зміст, відповідальність, просування, зростання. Саме вони підвищують залученість і продуктивність."]], ["p", "<b>Теорія постановки цілей Едвіна Локка і Гері Латама.</b> Усвідомлені й складні цілі — потужний мотиватор. Принципи: ціль складна, але досяжна; конкретна і вимірювана; прийнята людиною; є регулярний зворотний зв’язок; людина вірить у власну здатність її досягти."], ["p", "Маслоу також описав <b>самореалізацію</b> на вершині піраміди — прагнення розкрити свій потенціал, пов’язане з вищими, «буттєвими» цінностями: істиною, добром, справедливістю, досконалістю."], ["key", "Мотивація зростає, коли людина має чітко визначені, досяжні цілі й отримує зворотний зв’язок про прогрес."]]}, {"h": "Види мотивації", "body": [["ul", ["<b>За джерелом:</b> внутрішня — задоволення від процесу, відчуття компетентності, прагнення розвиватися (найстійкіша); зовнішня — нагороди, покарання, похвала, тиск (ефективна, але менш стійка).", "<b>За спрямованістю:</b> позитивна — заохочення, прагнення до успіху; негативна — страх покарання чи провалу. Негативна діє коротко і може знижувати ініціативу.", "<b>За змістом:</b> матеріальна — грошові винагороди, пільги; нематеріальна — похвала, визнання, цікава робота, розвиток."]], ["p", "Внутрішня мотивація спрямована на процес і результат, зовнішня — на отримання блага або уникнення покарання."]]}, {"h": "Принципи ефективного мотивування", "body": [["ul", ["<b>Індивідуальний підхід</b> — те, що мотивує одного, може бути байдужим іншому.", "<b>Усвідомленість цілей</b> — цілі конкретні, вимірювані, досяжні, доречні й обмежені в часі (SMART).", "<b>Заохочення успіху</b> — відзначайте навіть невеликі досягнення.", "<b>Справедливість</b> — однакові правила заохочення й покарання для всіх.", "<b>Зворотний зв’язок</b> — регулярний і конструктивний.", "<b>Залучення</b> — давайте висловити думку і взяти відповідальність.", "<b>Сприятливе середовище</b> — комфортні умови і нормальні стосунки."]]]}, {"h": "Методи мотивування курсантів", "body": [["p", "<b>Внутрішня мотивація:</b> показуйте, як знання знадобляться на службі і в бою; розповідайте історії успіху випускників; використовуйте інтерактивні методи — дискусії, кейси, рольові ігри, симуляції; заохочуйте пошук додаткової інформації; відзначайте прогрес і зусилля."], ["p", "<b>Зовнішня позитивна:</b> публічно відзначайте успіхи; заохочення в межах статуту — подяки, грамоти, додаткові звільнення; навчальні змагання з чесними критеріями; доручення з відповідальністю."], ["p", "<b>Зовнішня негативна — лише як крайній захід:</b> чіткі правила і наслідки, справедливе й послідовне застосування покарань, акцент на виправленні помилки, а не на приниженні людини."], ["p", "<b>Зворотний зв’язок:</b> частий, конкретний, з рекомендаціями, на основі фактів, своєчасний."], ["warn", "Основний акцент — на позитивних методах. Негативна мотивація у довгостроковій перспективі викликає стрес і вбиває ініціативу."]]}], "keys": ["Мотивація — внутрішній емоційний стан, що спонукає людину до дій.", "Піраміда Маслоу: фізіологічні, безпеки, соціальні, повага, самовираження.", "Врум: зусилля → результат → винагорода, яку людина цінує.", "Герцберг: гігієнічні фактори і мотиватори.", "Види: внутрішня і зовнішня, позитивна і негативна, матеріальна і нематеріальна.", "Негативна мотивація — лише крайній захід; основне — позитивні методи і зворотний зв’язок."], "test": [["Що таке мотивація?", ["Внутрішній емоційний стан людини, що спонукає її до дій", "Наказ командира", "Розклад занять", "Покарання за помилку"], "Мотивація — рушій діяльності."], ["Які види мотивації за джерелом?", ["Внутрішня і зовнішня", "Первинна і вторинна", "Початкова і усвідомлена", "Ранкова і вечірня"], "Внутрішня — з потреб людини, зовнішня — від зовнішніх факторів."], ["Яка мотивація найстійкіша?", ["Внутрішня", "Зовнішня негативна", "Матеріальна", "Короткострокова"], "Внутрішня мотивація найстійкіша."], ["На що спрямована зовнішня мотивація?", ["На отримання блага або уникнення покарання", "На сам процес навчання", "На саморозвиток", "На цікавість"], "Внутрішня — на процес і результат."], ["Яка найвідоміша теорія мотивації А. Маслоу?", ["Ієрархія потреб", "Трикутник мотиваторів", "Двофакторна модель", "Теорія очікувань"], "Піраміда потреб Маслоу."], ["Яка потреба лежить в основі піраміди Маслоу?", ["Фізіологічні", "Самовираження", "Повага", "Соціальні"], "Задоволення йде знизу вгору."], ["Що буде, якщо базові потреби курсанта не задоволені?", ["Вищі потреби слабко проявляються і не мотивують", "Мотивація до навчання зросте", "Нічого не зміниться", "Курсант стане відмінником"], "Спершу людина прагне задовольнити базове."], ["Від чого, за Врумом, залежить сила мотивації?", ["Від зв’язку зусиль з результатом, реальності й цінності винагороди", "Лише від кількості покарань", "Від погоди", "Від тривалості заняття"], "Три ситуаційні фактори теорії очікувань."], ["Які дві групи факторів виділяв Герцберг?", ["Гігієнічні фактори і мотиватори", "Активатори і деактиватори", "Архіватори і демотиватори", "Внутрішні і зовнішні покарання"], "Теорія двох факторів, 1959 рік."], ["Що відбувається за відсутності гігієнічних факторів?", ["Виникає незадоволення", "Зростає мотивація", "Нічого", "Підвищується продуктивність"], "Гігієнічні фактори запобігають незадоволенню."], ["Що з переліченого є мотиватором за Герцбергом?", ["Визнання і досягнення", "Умови праці", "Гарантія зайнятості", "Політика адміністрування"], "Мотиватори пов’язані зі змістом роботи."], ["Яка ідея теорії постановки цілей Локка і Латама?", ["Чіткі, складні, але досяжні цілі є потужним мотиватором", "Цілі заважають навчанню", "Краще не ставити цілей", "Ціль має бути легкою"], "Плюс прийняття цілі та зворотний зв’язок."], ["Що означає SMART для цілей навчання?", ["Конкретні, вимірювані, досяжні, доречні, обмежені в часі", "Швидкі, масові, активні", "Секретні та технічні", "Лише письмові"], "Принцип усвідомленості цілей."], ["Коли застосовується негативна мотивація?", ["Як крайній захід, справедливо і з акцентом на виправлення помилки", "Щодня, як основний метод", "Лише публічно", "Ніколи не застосовується"], "Основний акцент — на позитивних методах."], ["Що з переліченого — метод внутрішньої мотивації?", ["Показати, як знання знадобляться на службі", "Позбавити звільнення", "Підвищити голос", "Скоротити перерву"], "Курсант бачить практичну цінність навчання."], ["Яким має бути зворотний зв’язок?", ["Частим, конкретним, з рекомендаціями, на основі фактів", "Рідкісним і загальним", "Тільки критичним", "Лише в кінці курсу"], "Так курсант встигає коригувати дії."]]}, {"id": "b1m2t2z5", "code": "Б1 М2 Т2 З5", "theme": "Тема 2. Фактори та принципи навчання", "title": "Прийоми та способи впливу інструктора на курсантів", "short": "Прийоми впливу", "passport": {"goal": "Довести до військовослужбовців прийоми та способи впливу інструктора на курсантів.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Фактори, які спонукають до навчання; прийоми та способи впливу", "Вплив попередньо набутих знань і досвіду", "Рекомендації щодо позитивного впливу", "Способи та методи управління класом"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає фактори, що спонукають до навчання, прийоми впливу і методи управління класом.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.5; презентація"}, "sections": [{"h": "Що спонукає до навчання", "body": [["p", "Є чотири основні фактори, які дозволяють досягти найкращого результату в найкоротший термін і з мінімальними зусиллями:"], ["ul", ["<b>Знання власних досягнень</b> — курсант бачить, що виконав правильно, а що ні, і свій прогрес: результати стрільб, фізичних нормативів, рейтинг оцінок.", "<b>Взаємодія інструктор — курсант</b> — навчання найефективніше, коли зв’язок двосторонній.", "<b>Системність і структура</b> — послідовний виклад, виділення основного, логічний перехід від відомого до нового.", "<b>Результативне застосування знань</b> — матеріал максимально наближений до реального життя і служби курсантів."]], ["p", "Вплив — дія, яку одна особа виявляє стосовно іншої. Він буває прямим і непрямим, а основні форми прояву — <b>авторитет, переконання і примус</b>. Інструктор повинен усвідомлювати цілі й наслідки свого впливу."]]}, {"h": "Прийоми впливу інструктора", "body": [["p", "Прийоми впливу застосовуються етично, професійно і з урахуванням особливостей курсантів:"], ["ul", ["<b>Переконання і пояснення</b> — логічне обґрунтування правил і вимог фактами й доказами.", "<b>Прохання і порада</b> — звернення до свідомості й відповідальності, рекомендації з власного досвіду.", "<b>Заохочення і стимулювання</b> — позитивна оцінка зусиль, нагороди, здорова конкуренція.", "<b>Критика і зауваження</b> — обґрунтовані, конкретні, спрямовані на вчинок, а не на особистість.", "<b>Нагадування і попередження</b> — увага до правил і можливих наслідків.", "<b>Особистий приклад</b> — курсанти наслідують поведінку наставника.", "<b>Проблемна ситуація і ситуація успіху</b> — завдання на роздуми і можливість відчути досягнення.", "<b>Ігнорування</b> — у разі дрібних провокацій тимчасове ігнорування припиняє небажану поведінку без зайвої уваги.", "<b>Емоційний, соціальний та інформаційний вплив</b> — емпатія, позитивні групові норми, потрібна інформація для свідомих рішень.", "<b>Статутні вимоги</b> — посилання на статути для обґрунтування вимог."]], ["key", "Критикуємо вчинок, а не людину. Вплив має розвивати відповідальність і самостійність курсанта."]]}, {"h": "Попередній досвід курсантів", "body": [["p", "Попередні знання і досвід можуть і допомагати, і заважати навчанню."], ["p", "<b>Позитивний вплив:</b> легше зрозуміти новий матеріал і пов’язати його з відомим; швидше опанувати нову модифікацію знайомої техніки; розвинене критичне мислення; вища мотивація; кращі практичні навички; обмін досвідом збагачує групу; зріліше ставлення до навчання."], ["p", "<b>Негативний вплив:</b> інтерференція — старі звички заважають новим (нова модель зброї вимагає відмови від звичних рухів); консерватизм і опір новому; самовпевненість і недооцінка матеріалу; стереотипи; різний рівень підготовки в групі."], ["p", "Як урахувати досвід: вхідне оцінювання; пов’язувати нову тему з відомим; давати ділитися досвідом; розбирати реальні ситуації зі служби; диференційований підхід; чітко пояснювати відмінності нового від старого."]]}, {"h": "Як здійснювати позитивний вплив", "body": [["ul", ["<b>Встановіть контакт і довіру:</b> будьте доброзичливим, запам’ятовуйте імена, уважно слухайте, ставтеся до всіх однаково, без фаворитів, поважайте кожного.", "<b>Покажіть професіоналізм:</b> високий рівень знань і дисципліни, доступна мова, чіткі завдання й вимоги.", "<b>Застосовуйте позитивні методи:</b> відзначайте навіть невеликі успіхи, давайте конструктивні коментарі, можливість приймати рішення.", "<b>Враховуйте індивідуальність:</b> кожен навчається у власному темпі; допомагайте тим, кому важко.", "<b>Створюйте групову динаміку:</b> командна робота, правила взаємоповаги, відповідальність за групу.", "<b>Будьте послідовним і системним</b> у вимогах і діях.", "<b>Розвивайтеся самі:</b> аналізуйте свої методи, приймайте зворотний зв’язок від курсантів і колег."]]]}, {"h": "Управління класом", "body": [["p", "<b>Організаційні методи:</b> на початку курсу чітко довести правила поведінки і алгоритми типових дій — вхід, вихід, запитання, здача робіт; завчасно готувати матеріали й обладнання; облаштувати клас так, щоб бачити всіх; дотримуватися плану заняття."], ["p", "<b>Дисциплінарні методи:</b> позитивне підкріплення бажаної поведінки; корекція небажаної — спокійне попередження, конкретне зауваження без критики особистості, позбавлення привілеїв у межах статуту, педагогічно обґрунтовані додаткові завдання, звернення до старшого керівництва. Принципи — невідворотність, справедливість і послідовність."], ["p", "<b>Залученість і мотивація:</b> активні методи, спільні цілі, віра в успіх курсантів, доречний гумор, можливість вибору."], ["p", "<b>Комунікація:</b> чітка мова без незрозумілих термінів, активне слухання, невербальні сигнали, регулярний зворотний зв’язок, індивідуальні бесіди."], ["p", "<b>Управління конфліктами:</b> раннє виявлення, вислухати кожну сторону, шукати компроміс; якщо курсанти не можуть домовитися — інструктор виступає медіатором або ухвалює остаточне рішення."]]}], "keys": ["Чотири фактори: знання власних досягнень, взаємодія інструктор — курсант, системність, застосування знань.", "Форми впливу: авторитет, переконання, примус.", "Критика — конструктивна і спрямована на вчинок, а не на особистість.", "Попередній досвід може допомагати і заважати (інтерференція, консерватизм, самовпевненість).", "Дисципліна: позитивне підкріплення, невідворотність, справедливість, послідовність."], "test": [["Які чотири фактори спонукають до навчання?", ["Знання власних досягнень, взаємодія інструктор — курсант, системність, результативне застосування знань", "Наказ, контроль, покарання, звітність", "Тривалість, гучність, колір, розмір", "Лекція, тест, оцінка, іспит"], "Ці фактори дають найкращий результат з найменшими зусиллями."], ["Що таке вплив?", ["Дія, яку одна особа виявляє стосовно іншої", "Покарання за порушення", "Тільки наказ командира", "Розклад занять"], "Вплив буває прямим і непрямим."], ["Які основні форми прояву впливу?", ["Авторитет, переконання, примус", "Крик, погроза, ігнорування", "Лекція, тест, оцінка", "Похвала, нагорода, подарунок"], "Три форми впливу."], ["Якою має бути критика інструктора?", ["Обґрунтованою, конструктивною і спрямованою на вчинок", "Особистою і публічною", "Різкою, щоб запам’яталося", "Без пояснення причин"], "Критикуємо вчинок, а не людину."], ["Коли доречне ігнорування як прийом впливу?", ["При дрібних провокаціях і незначних порушеннях", "При порушенні заходів безпеки", "Завжди, коли курсант ставить запитання", "При конфлікті між курсантами"], "Без зайвої уваги небажана поведінка припиняється."], ["Що таке «ситуація успіху»?", ["Організація навчання так, щоб курсанти відчули свої досягнення", "Іспит без підготовки", "Нагорода лише найкращому", "Скорочення заняття"], "Це підвищує впевненість і мотивацію."], ["Чому особистий приклад інструктора такий важливий?", ["Курсанти схильні наслідувати поведінку наставника", "Бо так написано в розкладі", "Бо курсанти не слухають пояснень", "Бо це скорочує час заняття"], "Приклад — один з найсильніших прийомів впливу."], ["Що таке інтерференція знань?", ["Старі знання і звички заважають засвоєнню нових", "Швидке засвоєння матеріалу", "Обмін досвідом у групі", "Повторення пройденого"], "Наприклад, нова модель зброї вимагає відмови від звичних рухів."], ["Що з переліченого — позитивний вплив попереднього досвіду?", ["Швидше опанування нової модифікації знайомої техніки", "Консерватизм і опір новому", "Самовпевненість", "Стереотипи"], "Досвід прискорює навчання."], ["Як урахувати різний досвід курсантів?", ["Провести вхідне оцінювання і застосовувати диференційований підхід", "Не звертати уваги", "Навчати лише досвідчених", "Заборонити згадувати попередню службу"], "Плюс обмін досвідом і акцент на відмінностях нового."], ["Що допомагає встановити довіру з курсантами?", ["Запам’ятовувати імена, уважно слухати, ставитися до всіх однаково", "Виділяти улюбленців", "Не відповідати на запитання", "Постійно підвищувати голос"], "Повага і рівне ставлення — основа довіри."], ["Що належить до організаційних методів управління класом?", ["Чіткі правила й алгоритми дій, завчасна підготовка матеріалів", "Позбавлення привілеїв", "Індивідуальні бесіди", "Медіація конфлікту"], "Організація зменшує хаос і економить час."], ["Які принципи дисциплінарних заходів?", ["Невідворотність, справедливість, послідовність", "Раптовість і жорсткість", "Публічність і приниження", "Вибірковість"], "Заходи застосовуються об’єктивно до всіх."], ["Що робить інструктор, якщо курсанти не можуть самі вирішити конфлікт?", ["Виступає медіатором або ухвалює остаточне рішення", "Ігнорує конфлікт", "Карає обох без розбору", "Скасовує заняття"], "Спершу — вислухати сторони і шукати компроміс."], ["Як знання власних досягнень впливає на навчання?", ["Стимулює подальші зусилля курсанта", "Знижує мотивацію", "Не впливає", "Відволікає від заняття"], "Курсант бачить свій прогрес."]]}, {"id": "b1m2t3z1", "code": "Б1 М2 Т3 З1", "theme": "Тема 3. Якості інструктора", "title": "Основні якості та характеристики інструктора", "short": "Якості інструктора", "passport": {"goal": "Ознайомити військовослужбовців з якостями та характеристиками, якими повинен володіти інструктор.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Якості хорошого інструктора", "Важливість цих якостей для результату навчання", "Як розвивати потрібні якості", "Якостей і стилів поведінки, яких слід уникати"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає, якими якостями має володіти інструктор, і яких слід уникати.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 3.1; презентація; тест за темою"}, "sections": [{"h": "П’ять ключових якостей", "body": [["p", "Хорошим інструктором не народжуються — ним стають. Основні якості легко запам’ятати: <b>впевненість, вихованість, ставлення, старанність, ентузіазм</b>."], ["p", "<b>Впевненість.</b> Щоб переконливо викладати, інструктор має випромінювати впевненість. Вона зростає, якщо:"], ["ul", ["глибоко знаєте предмет;", "маєте бездоганні особисті стандарти;", "ретельно готуєтеся і плануєте навчання;", "заздалегідь добре організовуєте заняття."]], ["p", "Обізнаність, планування і тренування дають упевненість в успіху, а з нею приходить повага курсантів."]]}, {"h": "Вихованість: мова, рухи, вигляд", "body": [["p", "Вихованість інструктора — це поєднання мови, рухів, жестів, поведінки і зовнішнього вигляду."], ["ul", ["<b>Мова</b> — гучна, чітка, розбірлива; уникайте одноманітного тону. Зміна ритму, швидкості й гучності утримує увагу. Щоб перевірити голос, запишіть себе на занятті і проаналізуйте запис.", "<b>Рухи</b> — плавні й легкі. Час від часу рухайтеся для кращого контакту з аудиторією, але без зайвих рухів, що відволікають.", "<b>Зовнішній вигляд і поведінка</b> — крім польових занять, бездоганний вигляд і відповідна манера. Будь-яку слабкість чи недоречне висловлювання курсанти помітять одразу."]]]}, {"h": "Ставлення, старанність, ентузіазм", "body": [["p", "<b>Ставлення</b> — інструктор є прикладом ставлення до предмета. Воно включає:"], ["ul", ["<b>чесність і справедливість</b> — без фаворитів, без висміювання тих, хто відстає, без зловживання становищем;", "<b>твердість, рішучість, надійність</b> — чіткі межі стосунків, не дозволяти порушувати порядок, за потреби відновлювати контроль;", "<b>дружність</b> — підтримка, визнання досягнень, заохочення ініціативи створюють взаємну повагу."]], ["p", "<b>Старанність</b> — абсолютна передумова успіху і репутації: прагнення до досконалості, увага до деталей, вимогливість до себе й курсантів, постійне самовдосконалення."], ["p", "<b>Ентузіазм</b> — курсанти миттєво помічають байдужість інструктора, і бажання вчитися зникає. Хороший інструктор ефективно подасть навіть нецікавий предмет. Усі теми важливі, усі теми цікаві — а власні проблеми залишаються за дверима класу."]]}, {"h": "Чому ці якості такі важливі", "body": [["ul", ["знання предмета і комунікативні навички дозволяють чітко доносити інформацію;", "ентузіазм і вміння надихати забезпечують активну участь і мотивацію;", "справедливість, емпатія, терпіння створюють атмосферу довіри і безпеки;", "вимогливість, послідовність і чіткі правила забезпечують дисципліну;", "спостережливість дозволяє підлаштувати методи під кожного;", "особистий приклад і професіоналізм виховують курсантів."]], ["key", "Без цих якостей навчання стає формальністю. З ними інструктор — не просто передавач знань, а наставник, лідер і мотиватор."]]}, {"h": "Як розвивати якості інструктора", "body": [["p", "<b>Формальна підготовка:</b> курси інструкторів і спеціалізовані курси з педагогіки, психології навчання дорослих, управління групою, комунікації; тренінги лідерства; вивчення військової педагогіки; семінари; робота під керівництвом досвідчених інструкторів."], ["p", "<b>Саморозвиток:</b> проводити заняття помічником досвідченого інструктора; самостійно готувати й проводити окремі елементи занять; просити зворотний зв’язок у курсантів і колег; регулярно аналізувати свої заняття; тренувати активне слухання і чіткість висловлювань; розвивати лідерські й організаційні навички; працювати над самодисципліною, відповідальністю і стресостійкістю."]]}, {"h": "Чого інструктор уникає", "body": [["p", "<b>Негативні якості:</b> некомпетентність, відсутність чіткої позиції, необ’єктивність і «улюбленці», нервозність і спалахи гніву, недбала підготовка і запізнення, демонстрація зверхності, нечесність і невиконання обіцянок."], ["p", "<b>Неприйнятні стилі поведінки:</b> авторитарність без діалогу; панібратство і втрата дистанції; залякування і погрози; ігнорування конфліктів; непослідовність; демонстративна втома і байдужість."], ["p", "<b>Неприпустимі стилі спілкування:</b> образливі висловлювання, сарказм і лайка; критика особистості замість дій; монолог замість діалогу; незрозуміла мова; крик; ігнорування запитань; плітки й обговорення особистого життя курсантів."], ["warn", "Також погано: безвідповідальне використання часу заняття, постійне читання з конспекту, перекладання на курсантів власних проблем і пошук виправдань своєї некомпетентності."]]}], "keys": ["П’ять якостей: впевненість, вихованість, ставлення, старанність, ентузіазм.", "Впевненість дають знання предмета, бездоганні стандарти, підготовка й організація.", "Мова гучна і чітка, без одноманітного тону; рухи плавні; вигляд бездоганний.", "Ставлення: чесність, твердість, дружність — без фаворитів і без панібратства.", "Не можна: крик, сарказм, приниження, критика особистості, читання з конспекту."], "test": [["Які п’ять основних якостей інструктора?", ["Впевненість, вихованість, ставлення, старанність, ентузіазм", "Сила, швидкість, витривалість, гнучкість, спритність", "Суворість, мовчазність, відстороненість, байдужість, жорсткість", "Знання, зброя, форма, звання, вислуга"], "Легко запам’ятати за першими літерами: В, В, С, С, Е."], ["Що допомагає інструктору бути впевненим?", ["Глибоке знання предмета, підготовка і організація заняття", "Гучний голос і суворий вигляд", "Відсутність запитань від курсантів", "Читання з конспекту"], "Обізнаність і планування дають упевненість."], ["Якою має бути мова інструктора?", ["Гучною, чіткою, без одноманітного тону", "Тихою і монотонною", "Швидкою, щоб встигнути більше", "Насиченою складними термінами"], "Зміна ритму і гучності утримує увагу."], ["Як перевірити якість свого голосу?", ["Записати себе на занятті і проаналізувати запис", "Спитати лише командира", "Говорити голосніше", "Це неможливо перевірити"], "Запис дозволяє об’єктивно побачити проблеми."], ["Як інструктор має рухатися під час заняття?", ["Плавно, час від часу змінюючи положення для контакту з аудиторією", "Постійно ходити класом", "Стояти нерухомо весь час", "Активно жестикулювати"], "Рухи не повинні відволікати від заняття."], ["Що означає справедливість інструктора?", ["Без фаворитів і без висміювання тих, хто відстає", "Однакові оцінки для всіх", "Покарання лише слабких", "Похвала тільки найкращих"], "Чесність — частина ставлення."], ["Чому важливий ентузіазм інструктора?", ["Курсанти помічають байдужість, і бажання вчитися зникає", "Він скорочує заняття", "Він заміняє підготовку", "Він потрібен лише на польових заняттях"], "Між ентузіазмом інструктора і засвоєнням є прямий зв’язок."], ["Що з переліченого — неприйнятний стиль поведінки?", ["Панібратство і втрата дистанції", "Твердість і послідовність", "Дружність і підтримка", "Вимогливість до себе"], "Панібратство шкодить дисципліні."], ["Що з переліченого — неприпустимий стиль спілкування?", ["Критика особистості замість дій", "Активне слухання", "Чітка мова", "Діалог з курсантами"], "Оцінюємо вчинки, а не людину."], ["Що з переліченого — погана якість інструктора?", ["Постійне читання з конспекту", "Знання предмета", "Ретельна підготовка", "Пунктуальність"], "Конспект — лише для контролю інформації."], ["Що таке газлайтинг?", ["Маніпуляція, що змушує людину сумніватися у власному сприйнятті й пам’яті", "Метод мотивації", "Вид контролю знань", "Прийом невербального спілкування"], "Інструктор ніколи не застосовує маніпуляцій."], ["Що належить до саморозвитку інструктора?", ["Регулярний аналіз своїх занять і запит зворотного зв’язку", "Уникання критики", "Відмова від нових методів", "Робота лише з сильними курсантами"], "Самооцінка і зворотний зв’язок — основа зростання."], ["Що належить до старанності?", ["Прагнення до досконалості, увага до деталей, вимогливість", "Швидке завершення заняття", "Байдужість до помилок", "Перекладання роботи на помічників"], "Старанність — передумова професійної репутації."], ["Яка особливість зовнішнього вигляду інструктора?", ["Бездоганний вигляд, крім польових занять", "Вигляд не має значення", "Лише парадна форма", "Цивільний одяг"], "Будь-яку недбалість курсанти помітять."], ["Яка роль інструктора з потрібними якостями?", ["Наставник, лідер і мотиватор", "Лише передавач інформації", "Наглядач за дисципліною", "Екзаменатор"], "Без якостей навчання стає формальністю."]]}, {"id": "b1m2t3z2", "code": "Б1 М2 Т3 З2", "theme": "Тема 3. Якості інструктора", "title": "Принципи навчання", "short": "Принципи навчання", "passport": {"goal": "Ознайомити військовослужбовців з принципами навчання.", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Основні принципи навчання", "Навчання на власних помилках і через розуміння та вирішення проблем"], "assess": "Усне опитування після навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає і розуміє принципи навчання на власних помилках та через розуміння і вирішення проблеми.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 3.2; презентація"}, "sections": [{"h": "Основні принципи навчання", "body": [["p", "Принципи навчання — фундамент педагогічного процесу: вимоги до організації навчання, що дають найкращий результат. У військовій підготовці найважливіші:"], ["ul", ["<b>Науковості</b> — навчання базується на військових науках, бойовому досвіді, сучасних технологіях і озброєнні.", "<b>Систематичності й послідовності</b> — від простого до складного з урахуванням спеціалізації і рівня підготовки.", "<b>Доступності</b> — матеріал адаптовано до рівня військовослужбовців, але з подоланням труднощів.", "<b>Наочності</b> — карти, схеми, макети, відео бойових дій, практичні демонстрації.", "<b>Активності й самостійності</b> — практичні заняття, тренування, ініціатива в прийнятті рішень.", "<b>Свідомості й творчої активності</b> — розуміння важливості навчання для бойових завдань і творче застосування знань.", "<b>Міцності засвоєння</b> — багаторазове повторення до автоматизму.", "<b>Індивідуалізації і диференціації</b> — урахування здібностей і темпу, але з акцентом на злагодженість підрозділу.", "<b>Виховуючого навчання</b> — формування морально-бойових якостей; особистий приклад командира вирішальний.", "<b>Зв’язку теорії з практикою</b> — максимальне наближення до бойової обстановки."]]]}, {"h": "Специфічні принципи військової педагогіки", "body": [["ul", ["<b>Колективізму і єдиноначальності</b> — уміння діяти в складі підрозділу, виконувати накази і нести колективну відповідальність.", "<b>Високої вимогливості і дисципліни</b> — сувора дисципліна готує до дій в екстремальних умовах.", "<b>Формування психологічної стійкості</b> — елементи психологічної підготовки для розвитку стресостійкості й витримки."]], ["key", "Військове навчання — це не лише знання, а й злагодженість, дисципліна і психологічна стійкість підрозділу."]]}, {"h": "Навчання на власних помилках", "body": [["p", "Помилки — невід’ємна частина навчання: неможливо опанувати навичку, не помиляючись. Через власні помилки людина отримує уроки, які допомагають не повторити їх у майбутньому. Неправильні дії поступово відкидаються, правильні — закріплюються."], ["p", "Принцип працює в чотири кроки:"], ["ul", ["<b>Контрольоване середовище для помилок</b> — симуляції, тренування, навчальні завдання, де помилка відчутна, але не катастрофічна. Страх покарання за кожну помилку паралізує ініціативу.", "<b>Розуміння причини</b> — не просто констатувати помилку, а з’ясувати, чому було прийняте неправильне рішення і які прогалини проявилися. Курсант аналізує власні дії, думки й почуття.", "<b>Вивчені уроки</b> — сформулювати конкретні практичні висновки і задокументувати їх.", "<b>Застосування досвіду</b> — коригувати власні алгоритми, щоб не повторити помилку в критичній ситуації."]], ["warn", "У військовій справі ціна помилки висока, тому помилятися треба на навчанні, а не в бою."]]}, {"h": "Переваги навчання на помилках", "body": [["ul", ["власна помилка запам’ятовується значно краще, ніж пасивно почута інформація;", "аналіз помилок розвиває самостійне мислення і розуміння причин і наслідків;", "усвідомлення наслідків виховує відповідальність і обережність;", "подолання помилок підвищує впевненість у собі;", "готує не здаватися перед неминучими труднощами."]]]}, {"h": "Навчання через розуміння і вирішення проблем", "body": [["p", "Цей принцип ґрунтується не на передаванні готової інформації, а на отриманні знань під час розв’язання теоретичних і практичних завдань. Таке навчання стимулює критичне мислення, дає справжній досвід, систематизує знання і пов’язує навчання з реальним життям."], ["p", "Отримавши завдання, курсанти спершу пробують старі знання, а якщо не виходить — шукають нові способи. Класичний приклад: з’єднати дев’ять точок чотирма прямими лініями, не відриваючи ручку. Це можливо, якщо зрозуміти, що лінії можуть виходити за межі уявного квадрата."], ["p", "Переваги: власне «відкриття» краще сприймається і запам’ятовується, курсант отримує задоволення від виконаного завдання. Недолік: інколи курсанти «застрягають» і відступають — інструктор має вчасно підказати напрям."]]}], "keys": ["Основні принципи: науковість, системність, доступність, наочність, активність, свідомість, міцність, індивідуалізація, виховуюче навчання, зв’язок теорії з практикою.", "Специфічні військові: колективізм і єдиноначальність, вимогливість і дисципліна, психологічна стійкість.", "Навчання на помилках: контрольоване середовище → причина → уроки → застосування.", "Навчання через вирішення проблем розвиває критичне мислення; власне відкриття запам’ятовується краще."], "test": [["Що вимагає принцип міцності засвоєння?", ["Багаторазового повторення і відпрацювання дій до автоматизму", "Одного показу", "Лише теоретичного вивчення", "Короткого заняття"], "Стійкі навички потрібні в бою."], ["Що вимагає принцип зв’язку теорії з практикою?", ["Максимально наближати навчання до реальних бойових умов", "Вивчати лише теорію", "Проводити заняття тільки в класі", "Уникати польових виходів"], "Тактичні навчання, польові виходи, реальна зброя."], ["Який принцип є специфічним для військової педагогіки?", ["Колективізму і єдиноначальності", "Науковості", "Наочності", "Доступності"], "Дії в складі підрозділу і виконання наказів."], ["На що спрямований принцип формування психологічної стійкості?", ["На розвиток стресостійкості і витримки", "На запам’ятовування дат", "На скорочення занять", "На покарання за помилки"], "Підготовка до високого психологічного навантаження."], ["У чому суть принципу індивідуалізації у військовому навчанні?", ["Урахування здібностей і темпу кожного з акцентом на злагодженість підрозділу", "Кожен навчається окремо від підрозділу", "Інструктор працює лише з найкращими", "Курсанти обирають, що вивчати"], "Індивідуальність не скасовує злагодженості."], ["Чому навчання на помилках має відбуватися в контрольованому середовищі?", ["Щоб помилка була відчутною, але не призводила до катастрофічних наслідків", "Щоб помилок не було взагалі", "Щоб покарати курсанта", "Щоб скоротити час"], "Симуляції, тренування, навчальні завдання."], ["Що паралізує ініціативу курсантів?", ["Страх покарання за будь-яку помилку", "Аналіз помилок", "Зворотний зв’язок", "Похвала"], "Курсанти мають вільно пробувати нові рішення."], ["Що потрібно зробити після помилки?", ["З’ясувати її глибинну причину", "Просто констатувати факт", "Забути і рухатися далі", "Покарати курсанта"], "Чому було прийнято неправильне рішення?"], ["Що робити з вивченими уроками?", ["Сформулювати конкретно і задокументувати", "Тримати в голові", "Обговорити лише з командиром", "Нічого"], "Щоб висновки не загубилися з часом."], ["Яка головна мета навчання на помилках?", ["Запобігти їх повторенню в критичних ситуаціях", "Знизити оцінку", "Збільшити кількість тестів", "Скоротити практику"], "Помилятися на навчанні, а не в бою."], ["Чому власна помилка ефективна для навчання?", ["Вона запам’ятовується значно краще, ніж пасивно почута інформація", "Вона завжди веде до покарання", "Вона скорочує курс", "Вона не має наслідків"], "Досвід через помилку — найміцніший."], ["На чому ґрунтується принцип навчання через вирішення проблем?", ["На отриманні знань під час розв’язання завдань, а не на готовій інформації", "На диктуванні конспекту", "На заучуванні напам’ять", "На перегляді фільмів"], "Курсанти самі шукають рішення."], ["Який недолік навчання через вирішення проблем?", ["Курсанти інколи «застрягають» і відступають", "Знання погано запам’ятовуються", "Курсанти не отримують задоволення", "Немає недоліків"], "Інструктор має вчасно підказати напрям."], ["Як розв’язати задачу з дев’ятьма точками і чотирма лініями?", ["Зрозуміти, що лінії можуть виходити за межі уявного квадрата", "Відірвати ручку від паперу", "Використати п’ять ліній", "Це неможливо"], "Класичний приклад нестандартного мислення."], ["Що вимагає принцип наочності у військовому навчанні?", ["Широко використовувати карти, схеми, макети, відео і демонстрації", "Лише усний виклад", "Заборону презентацій", "Тільки підручники"], "Наочність допомагає сприйняттю."]]}, {"id": "b1m2t4z1", "code": "Б1 М2 Т4 З1", "theme": "Тема 4. Організація та проведення занять", "title": "Опис цілі", "short": "Опис цілі", "passport": {"goal": "Довести військовослужбовцям важливість та порядок опису цілі навчання.", "time": "3 години (180 хв)", "method": "Інтерактивна лекція — 50%, практичне заняття — 50%; навчальний клас", "questions": ["Важливість опису цілі", "Порядок опису цілі навчання", "Таксономія Блума", "Порядок визначення навчальних цілей"], "assess": "Практично, письмово, індивідуально — завдання в кінці заняття.", "criteria": "Позитивно — якщо самостійно склав опис цілі згідно з вивченим алгоритмом.", "sources": "Програма, розд. 7.1.1.2 і додаток 3.6; ДМ до СТІ 132Г.42К(Н), п. 4.1; план-конспект; презентація; зразки опису цілі"}, "sections": [{"h": "Що таке ціль заняття", "body": [["p", "Ціль заняття — це запланований результат, якого інструктор прагне досягти. Це орієнтир для інструктора і курсантів: він допомагає спланувати зміст, методи та форми роботи, а потім оцінити ефективність заняття."], ["p", "Простими словами, ціль — це те, що курсанти повинні <b>знати, вміти або розуміти</b> після завершення заняття. Кожне заняття, кожна тема, предмет і навіть увесь курс мають свою мету навчання."], ["p", "За характером цілі бувають:"], ["ul", ["<b>навчальні (дидактичні)</b> — засвоєння нових знань, умінь і навичок;", "<b>розвиваючі</b> — розвиток мислення, творчих здібностей, самостійності;", "<b>виховні</b> — формування цінностей, моральних якостей, патріотизму."]]]}, {"h": "Чому ціль має бути зрозумілою", "body": [["p", "Зрозуміла ціль заняття завжди мотивує. Якщо військовослужбовець бере участь у занятті, ціль якого йому незрозуміла, він швидко стає неуважним, розгубленим і пасивним — думає про що завгодно, крім заняття."], ["p", "Коли курсанти розуміють, що вони знатимуть і вмітимуть наприкінці, вони краще співпрацюють з інструктором, щоб цієї цілі досягти. Інструктор може написати ціль на дошці або роздати картки з ціллю заняття."], ["key", "Ціль має відображати ті навички, які курсанти повинні будуть показати в кінці заняття. Навчання має сенс, коли курсант засвоїв матеріал і може виконати поставлену ціль."]]}, {"h": "Чотири складові опису цілі", "body": [["p", "Опис цілі складається з чотирьох елементів. Саме за цією схемою заповнюється розділ «Опис цілі (мети)» в план-конспекті:"], ["ul", ["<b>Ціль</b> — що курсант повинен знати або вміти після заняття;", "<b>Вимоги</b> — що курсант повинен буде виконати в кінці заняття;", "<b>Умови та обставини</b> — за яких умов курсант виконуватиме завдання;", "<b>Критерії оцінювання</b> — наскільки добре треба виконати завдання."]], ["key", "Ціль → Вимоги → Умови та обставини → Критерії. Результат заняття має бути вимірюваним, тобто таким, що його можна перевірити."]]}, {"h": "Вимоги: тільки вимірювані дієслова", "body": [["p", "Формулюючи ціль і вимоги, вживайте слова, що означають конкретні, перевірювані дії. Те, що не можна виміряти, перевірити неможливо."], ["p", "<b>Для теоретичного заняття</b> відповідні вимоги: написати, назвати, визначити, вибрати, впізнати, дати визначення. Невідповідні: бути здатним, вияснити, зрозуміти, повірити, інформувати."], ["p", "<b>Для практичного заняття</b> відповідні вимоги: з’єднати, розібрати, перев’язати, викопати, виконати, описати. Невідповідні: буде знати, повірить, відчує."], ["warn", "Неприйнятні в описі цілі слова: «зрозуміє», «повірить», «переконається», «відчує», «спробує». Інструктор не зможе перевірити, чи це сталося."], ["p", "Приклад: замість «курсанти знатимуть про іммобілізацію» — «кожен курсант вмітиме іммобілізувати нижню кінцівку». Тепер інструктор точно знає, що курсанти мають уміти накласти шину, а не лише розповісти про неї."]]}, {"h": "Умови та обставини", "body": [["p", "Умови та обставини відповідають на запитання: <b>де? коли? яким чином? за допомогою чого?</b> Вони визначають, чи виконує курсант завдання сам чи з іншими, своїм матеріалом чи спеціально виділеним, вдень чи вночі."], ["p", "Види умов і приклади:"], ["ul", ["<b>Обмеження</b> — обмежують можливості: тільки з холостими боєприпасами; з бойовими боєприпасами.", "<b>Екіпіровка</b> — засоби, одяг, механізми, які можна або не можна використовувати: тільки предмети зі списку; в протигазі; з біноклем.", "<b>Місце, час і кліматичні умови</b>: у будь-яких кліматичних умовах; вдень або вночі; у класі; на ділянці місцевості.", "<b>Підручні засоби</b> — посібники, карти, інструкції: за допомогою словника; самостійно, без підручних засобів; без бінокля.", "<b>Вид виконання</b>: індивідуально; в парах або в групі; бігом; повзком; із зав’язаними очима."]]]}, {"h": "Критерії оцінювання", "body": [["p", "Критерії визначають якість виконання — наскільки добре курсант має виконати завдання."], ["ul", ["критерії повинні містити <b>мінімальні</b> вимоги, за яких курсант у реальних обставинах виконає завдання достатньо добре;", "критерії повинні бути <b>реальними</b> для виконання."]], ["p", "Відповідні критерії: «в правильній послідовності», «без помилок, згідно з інструкцією», «допустима похибка ±2 см», «допускається не більше однієї помилки», «не довше 2 хвилин»."], ["p", "Невідповідні критерії: «7 хвилин», «9 метрів», «щоб гарно виглядало», «швидко». «7 хвилин» означає рівно сім — ні секундою більше чи менше. А що таке «гарно» чи «швидко» в уяві інструктора, курсант знати не може."], ["key", "Критерій — це межа: «не більше», «не довше», «з похибкою до». Не точна цифра і не оцінне слово."]]}, {"h": "Приклади правильного опису цілі", "body": [["p", "<b>Знання.</b> Ціль: ознайомити військовослужбовців з історією української миротворчої місії в Іраку. Вимоги: кожен курсант повинен знати основні дати, райони та цілі направлення контингенту. Умови: письмово в аудиторії, в кінці заняття, 5 хвилин, бланк і ручка, без конспекту; тест із 5 питань. Критерії: 5 правильних — «відмінно», 4 — «добре», 3 — «задовільно», 2 і менше — «незадовільно»."], ["p", "<b>Навичка.</b> Ціль: навчити курсантів вимірювати дистанцію кроками. Вимоги: кожен курсант вимірює дистанцію парами кроків на різній місцевості з обмундируванням. Умови: ділянка дороги 100 м, вдень, без допоміжних засобів вимірювання. Критерії: «виконано» — похибка не більше 5 м; «не виконано» — використовував допоміжні засоби або похибка більше 5 м."], ["p", "<b>Навичка.</b> Ціль: навчити іммобілізації нижньої кінцівки при закритому переломі підручними засобами. Вимоги: кожен курсант іммобілізує нижню кінцівку. Умови: підручними засобами, на ділянці місцевості, протягом 10 хвилин. Критерії: «виконано» — кінцівку іммобілізовано правильно і в межах часу."]]}, {"h": "Таксономія Блума", "body": [["p", "Таксономія Блума — ієрархічна класифікація навчальних цілей у пізнавальній сфері, яку запропонував у 1956 році американський психолог Бенджамін Блум. Вона допомагає вибрати правильне дієслово для вимог — від простого запам’ятовування до створення нового."], ["ul", ["<b>Знання</b> — запам’ятовування і відтворення термінів, фактів, правил, процедур;", "<b>Розуміння</b> — пояснити, переказати своїми словами, перевести з однієї форми в іншу (з тексту в схему), спрогнозувати наслідки;", "<b>Застосування</b> — використати вивчене в конкретних умовах і нових ситуаціях;", "<b>Аналіз</b> — виділити частини цілого, побачити зв’язки між ними, помилки в логіці, різницю між фактами й наслідками;", "<b>Синтез</b> — скомбінувати елементи в нове ціле: план дій, повідомлення, схему;", "<b>Оцінювання</b> — оцінити значення матеріалу для конкретної мети на основі чітких критеріїв."]], ["key", "Чим вищий рівень за Блумом, тим складніше завдання. Для базового солдата здебільшого достатньо знання, розуміння і застосування."]]}, {"h": "Порядок визначення навчальних цілей", "body": [["p", "Визначаючи навчальні цілі, інструктор зазвичай дотримується такого порядку:"], ["ul", ["визначає, що курсанти повинні знати, вміти або розуміти після заняття — конкретний очікуваний результат;", "враховує навчальну програму і попередній рівень підготовки курсантів — цілі мають бути досяжними;", "формулює ціль чітко, дієсловами дії: пояснити, виконати, продемонструвати, розпізнати;", "визначає, які попередні знання й уміння потрібні для досягнення цілі;", "планує методи, обладнання і форми роботи;", "визначає критерії, за якими оцінюватиме досягнення цілі;", "доводить ціль до курсантів на початку заняття, щоб вони розуміли, чого від них очікують."]], ["p", "Практична частина заняття: курсанти тренуються складати опис цілі для своїх тем. Спробуйте це у вкладці «Практика» — тренажер опису цілі."]]}], "keys": ["Ціль — те, що курсант повинен знати або вміти після заняття.", "Опис цілі: ціль, вимоги, умови та обставини, критерії оцінювання.", "Вимоги формулюються вимірюваними дієсловами: назвати, розібрати, перев’язати — не «зрозуміє» чи «відчує».", "Умови та обставини відповідають на запитання: де? коли? яким чином? за допомогою чого?", "Критерії — мінімальні й реальні: «не довше 2 хв», «не більше однієї помилки».", "Таксономія Блума: знання, розуміння, застосування, аналіз, синтез, оцінювання."], "test": [["Що таке ціль заняття?", ["Запланований результат: що курсант повинен знати або вміти після заняття", "Тема заняття, записана в розкладі", "Перелік матеріального забезпечення", "Час, відведений на заняття"], "Ціль — орієнтир і запланований результат заняття."], ["З яких складових складається опис цілі?", ["Ціль, вимоги, умови та обставини, критерії оцінювання", "Тема, мета, час, місце", "Вступ, основна частина, заключна частина", "Пояснення, демонстрація, імітація, практика"], "Чотири елементи опису цілі в план-конспекті."], ["Що описується у «вимогах»?", ["Що курсант повинен буде виконати в кінці заняття", "Де і коли проводиться заняття", "Наскільки добре треба виконати завдання", "Яке обладнання потрібне інструктору"], "Вимоги — конкретна дія, яку курсант покаже наприкінці."], ["Що визначають критерії оцінювання?", ["Наскільки добре треба виконати завдання", "Де виконується завдання", "Яку тему вивчають", "Хто проводить заняття"], "Критерії — про якість виконання."], ["На які запитання відповідає опис умов та обставин?", ["Де? Коли? Яким чином? За допомогою чого?", "Хто? Навіщо? Скільки коштує?", "Чому? Для кого? Що далі?", "Яка оцінка? Скільки балів?"], "Умови та обставини описують середовище виконання завдання."], ["Яке формулювання вимоги для практичного заняття правильне?", ["Кожен курсант вмітиме іммобілізувати нижню кінцівку", "Курсанти зрозуміють важливість іммобілізації", "Курсанти відчують відповідальність", "Курсанти повірять у силу медицини"], "Вимога має бути вимірюваною дією, яку можна перевірити."], ["Яке з дієслів НЕ підходить для опису вимог?", ["Зрозуміти", "Назвати", "Розібрати", "Перев’язати"], "«Зрозуміти» неможливо виміряти, тому воно невідповідне."], ["Які дієслова відповідні для теоретичного заняття?", ["Написати, назвати, визначити, вибрати, впізнати", "Зрозуміти, повірити, відчути", "Бути здатним, вияснити, інформувати", "Спробувати, переконатися, усвідомити"], "Для теорії — дії, які можна перевірити письмово чи усно."], ["Який критерій оцінювання сформульовано правильно?", ["Не довше 2 хвилин", "7 хвилин", "Швидко", "Щоб гарно виглядало"], "Критерій задає межу. «7 хвилин» означає рівно сім, а «швидко» і «гарно» — неперевірювані."], ["Чому критерій «9 метрів» некоректний?", ["Він означає рівно 9 метрів — ні більше, ні менше", "Бо метри не використовуються у ЗСУ", "Бо відстань завжди треба вказувати в кроках", "Він коректний"], "Правильно: «з похибкою не більше…» або «не менше…»."], ["Якими мають бути критерії оцінювання?", ["Мінімальними й реальними для виконання", "Максимально жорсткими", "Однаковими для всіх тем", "Таємними до кінця заняття"], "Мінімальні вимоги, за яких курсант у реальних умовах виконає завдання достатньо добре."], ["«В протигазі», «з біноклем» — це приклад якого виду умов?", ["Екіпіровка", "Обмеження", "Вид виконання", "Місце і час"], "Екіпіровка — засоби й одяг, які можна або не можна використовувати."], ["«Тільки з холостими боєприпасами» — це приклад якого виду умов?", ["Обмеження", "Екіпіровка", "Підручні засоби", "Вид виконання"], "Обмеження обмежують можливості курсанта."], ["«Індивідуально», «в парах», «повзком» — це приклад якого виду умов?", ["Вид виконання", "Місце і час", "Обмеження", "Підручні засоби"], "Вид виконання — яким чином виконуються дії."], ["Чому зрозуміла ціль важлива для курсантів?", ["Вона мотивує: курсант знає, що вмітиме наприкінці, і краще співпрацює", "Вона скорочує тривалість заняття", "Без неї неможливо провести перевірку наявності", "Вона потрібна лише для звітності"], "Без зрозумілої цілі курсант стає неуважним і пасивним."], ["Хто запропонував ієрархічну класифікацію навчальних цілей у 1956 році?", ["Бенджамін Блум", "Чарльз Аллен", "Абрахам Маслоу", "Джеймс Меттіс"], "Таксономія Блума — 1956 рік."], ["Який рівень таксономії Блума означає використання вивченого в нових ситуаціях?", ["Застосування", "Знання", "Розуміння", "Оцінювання"], "Застосування — уміння діяти з вивченим у конкретних умовах."], ["Який рівень таксономії Блума означає запам’ятовування та відтворення фактів?", ["Знання", "Синтез", "Аналіз", "Оцінювання"], "Знання — найнижчий рівень: запам’ятати й відтворити."], ["Що інструктор робить на початку заняття з навчальною ціллю?", ["Доводить її до курсантів, щоб вони розуміли, чого від них очікують", "Тримає в секреті до контролю", "Записує лише в журнал", "Доводить тільки після контролю"], "Ціль доводять на початку — під час організаційно-методичного брифінгу."]]}, {"id": "b1m2t4z2", "code": "Б1 М2 Т4 З2", "theme": "Тема 4. Організація та проведення занять", "title": "Аналіз проведених дій (After Action Review)", "short": "АПД / AAR", "passport": {"goal": "Довести військовослужбовцям важливість та порядок проведення АПД/AAR.", "time": "3 години", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Основні керівні документи з АПД/AAR", "Особливості АПД/AAR у збройних силах держав — членів НАТО та країн-партнерів", "Основні правила та принципи проведення АПД/AAR"], "assess": "Усні запитання, письмовий тест і практична робота — АПД за сценарієм.", "criteria": "Позитивно — знає порядок АПД і успішно виконав практичне завдання.", "sources": "Програма, розд. 3.6 і 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.2; план-конспект; презентація; практична робота «АПД сценарій»"}, "sections": [{"h": "Що таке АПД", "body": [["p", "Аналіз проведених дій (АПД), або After Action Review (AAR), — дієвий інструмент для підвищення ефективності підрозділу та порозуміння між побратимами, між підлеглими і лідером."], ["p", "АПД — це динамічне, об’єктивне обговорення того, як особовий склад виконав завдання відповідно до стандартів. Кожен військовослужбовець може і повинен брати участь, якщо в нього є розуміння, інформація, погляди чи запитання, що допоможуть підрозділу подолати слабкі сторони і зміцнити сильні."], ["key", "Мета АПД — вчитися, а не шукати в
