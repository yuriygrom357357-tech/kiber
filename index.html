осування знань."], ["Як принцип доступності формулюється у військовій підготовці?", ["Матеріал адаптовано до рівня військовослужбовців, але з подоланням труднощів", "Матеріал має бути максимально легким", "Матеріал подається однаково для всіх", "Складне можна пропускати"], "Доступність — адаптація до рівня, але з подоланням труднощів."], ["Яке обмеження має принцип індивідуалізації у військовій педагогіці?", ["Урахування темпу і здібностей — з акцентом на злагодженість підрозділу", "Кожен навчається лише окремо", "Він не застосовується у війську", "Слабких звільняють від колективних занять"], "Індивідуалізація і диференціація — урахування здібностей, але з акцентом на злагодженості підрозділу."], ["Який принцип належить до специфічних принципів військової педагогіки?", ["Формування психологічної стійкості", "Наочності", "Науковості", "Доступності"], "Специфічні: колективізм і єдиноначальність, висока вимогливість і дисципліна, психологічна стійкість."], ["Що за принципом виховуючого навчання має вирішальне значення?", ["Особистий приклад командира", "Кількість годин теорії", "Суворість покарань", "Сучасне обладнання"], "Виховуюче навчання формує морально-бойові якості; особистий приклад командира вирішальний."], ["Інструктор карає за кожну помилку на тренуванні. Як це впливає на навчання на помилках?", ["Страх покарання паралізує ініціативу", "Підвищує якість навчання", "Не впливає", "Прискорює формування навички"], "Потрібне контрольоване середовище, де помилка відчутна, але не катастрофічна; страх покарання паралізує ініціативу."], ["Яка правильна послідовність чотирьох кроків навчання на помилках?", ["Контрольоване середовище → розуміння причини → вивчені уроки → застосування досвіду", "Покарання → аналіз → повторення → оцінка", "Розуміння причини → середовище → застосування → уроки", "Уроки → помилка → аналіз → середовище"], "Контрольоване середовище, розуміння причини, вивчені уроки, застосування досвіду."], ["На кроці «розуміння причини» що найважливіше?", ["З’ясувати, чому прийнято неправильне рішення і які прогалини проявилися", "Зафіксувати факт помилки", "Визначити винного", "Одразу повторити дію"], "Не просто констатувати, а з’ясувати, чому прийняте неправильне рішення; курсант аналізує дії, думки, почуття."], ["Що відбувається на кроці «вивчені уроки»?", ["Формулюють конкретні практичні висновки і документують їх", "Курсант пише пояснювальну", "Інструктор виставляє оцінку", "Помилку забувають"], "Вивчені уроки — конкретні практичні висновки, задокументовані."], ["Чому власна помилка ефективніша за пасивно почуту інформацію?", ["Вона запам’ятовується значно краще і розвиває розуміння причин і наслідків", "Вона займає менше часу", "Її легше оцінити", "Вона не потребує аналізу"], "Переваги: власна помилка запам’ятовується краще, розвиває мислення, відповідальність, впевненість."], ["Як звучить ключове правило про ціну помилки у військовій справі?", ["Помилятися треба на навчанні, а не в бою", "Помилок треба уникати будь-якою ціною", "Помилки допустимі лише в теорії", "За помилки завжди карають"], "Ціна помилки висока, тому помилятися — на навчанні, а не в бою."], ["На чому ґрунтується навчання через розв’язання проблем?", ["На отриманні знань під час розв’язання завдань, а не передаванні готової інформації", "На заучуванні правил", "На демонстрації інструктора", "На самостійному читанні"], "Принцип: знання здобуваються під час розв’язання теоретичних і практичних завдань."], ["Як розв’язується задача з’єднати дев’ять точок чотирма лініями?", ["Лінії мають виходити за межі уявного квадрата", "Лінії треба вести лише по діагоналях", "Ручку треба відривати", "Задача не має розв’язку"], "Розв’язок можливий, якщо зрозуміти, що лінії можуть виходити за межі уявного квадрата."], ["Курсанти «застрягли» над проблемним завданням і хочуть здатися. Що робить інструктор?", ["Вчасно підказує напрям", "Дає готову відповідь одразу", "Знімає завдання", "Чекає до кінця заняття"], "Недолік методу — курсанти можуть застрягнути; інструктор має вчасно підказати напрям."], ["Принцип міцності засвоєння у військовій підготовці означає…", ["Багаторазове повторення до автоматизму", "Одне якісне тренування", "Письмовий конспект", "Перевірку раз на курс"], "Міцність засвоєння — багаторазове повторення до автоматизму."]]}, {"id": "b1m2t4z1", "code": "Б1 М2 Т4 З1", "theme": "Тема 4. Організація та проведення занять", "title": "Опис цілі", "short": "Опис цілі", "passport": {"goal": "Довести військовослужбовцям важливість та порядок опису цілі навчання.", "time": "3 години (180 хв)", "method": "Інтерактивна лекція — 50%, практичне заняття — 50%; навчальний клас", "questions": ["Важливість опису цілі", "Порядок опису цілі навчання", "Таксономія Блума", "Порядок визначення навчальних цілей"], "assess": "Практично, письмово, індивідуально — завдання в кінці заняття.", "criteria": "Позитивно — якщо самостійно склав опис цілі згідно з вивченим алгоритмом.", "sources": "Програма, розд. 7.1.1.2 і додаток 3.6; ДМ до СТІ 132Г.42К(Н), п. 4.1; план-конспект; презентація; зразки опису цілі"}, "sections": [{"h": "Що таке ціль заняття", "body": [["p", "Ціль заняття — це запланований результат, якого інструктор прагне досягти. Це орієнтир для інструктора і курсантів: він допомагає спланувати зміст, методи та форми роботи, а потім оцінити ефективність заняття."], ["p", "Простими словами, ціль — це те, що курсанти повинні <b>знати, вміти або розуміти</b> після завершення заняття. Кожне заняття, кожна тема, предмет і навіть увесь курс мають свою мету навчання."], ["p", "За характером цілі бувають:"], ["ul", ["<b>навчальні (дидактичні)</b> — засвоєння нових знань, умінь і навичок;", "<b>розвиваючі</b> — розвиток мислення, творчих здібностей, самостійності;", "<b>виховні</b> — формування цінностей, моральних якостей, патріотизму."]]]}, {"h": "Чому ціль має бути зрозумілою", "body": [["p", "Зрозуміла ціль заняття завжди мотивує. Якщо військовослужбовець бере участь у занятті, ціль якого йому незрозуміла, він швидко стає неуважним, розгубленим і пасивним — думає про що завгодно, крім заняття."], ["p", "Коли курсанти розуміють, що вони знатимуть і вмітимуть наприкінці, вони краще співпрацюють з інструктором, щоб цієї цілі досягти. Інструктор може написати ціль на дошці або роздати картки з ціллю заняття."], ["key", "Ціль має відображати ті навички, які курсанти повинні будуть показати в кінці заняття. Навчання має сенс, коли курсант засвоїв матеріал і може виконати поставлену ціль."]]}, {"h": "Чотири складові опису цілі", "body": [["p", "Опис цілі складається з чотирьох елементів. Саме за цією схемою заповнюється розділ «Опис цілі (мети)» в план-конспекті:"], ["ul", ["<b>Ціль</b> — що курсант повинен знати або вміти після заняття;", "<b>Вимоги</b> — що курсант повинен буде виконати в кінці заняття;", "<b>Умови та обставини</b> — за яких умов курсант виконуватиме завдання;", "<b>Критерії оцінювання</b> — наскільки добре треба виконати завдання."]], ["key", "Ціль → Вимоги → Умови та обставини → Критерії. Результат заняття має бути вимірюваним, тобто таким, що його можна перевірити."]]}, {"h": "Вимоги: тільки вимірювані дієслова", "body": [["p", "Формулюючи ціль і вимоги, вживайте слова, що означають конкретні, перевірювані дії. Те, що не можна виміряти, перевірити неможливо."], ["p", "<b>Для теоретичного заняття</b> відповідні вимоги: написати, назвати, визначити, вибрати, впізнати, дати визначення. Невідповідні: бути здатним, вияснити, зрозуміти, повірити, інформувати."], ["p", "<b>Для практичного заняття</b> відповідні вимоги: з’єднати, розібрати, перев’язати, викопати, виконати, описати. Невідповідні: буде знати, повірить, відчує."], ["warn", "Неприйнятні в описі цілі слова: «зрозуміє», «повірить», «переконається», «відчує», «спробує». Інструктор не зможе перевірити, чи це сталося."], ["p", "Приклад: замість «курсанти знатимуть про іммобілізацію» — «кожен курсант вмітиме іммобілізувати нижню кінцівку». Тепер інструктор точно знає, що курсанти мають уміти накласти шину, а не лише розповісти про неї."]]}, {"h": "Умови та обставини", "body": [["p", "Умови та обставини відповідають на запитання: <b>де? коли? яким чином? за допомогою чого?</b> Вони визначають, чи виконує курсант завдання сам чи з іншими, своїм матеріалом чи спеціально виділеним, вдень чи вночі."], ["p", "Види умов і приклади:"], ["ul", ["<b>Обмеження</b> — обмежують можливості: тільки з холостими боєприпасами; з бойовими боєприпасами.", "<b>Екіпіровка</b> — засоби, одяг, механізми, які можна або не можна використовувати: тільки предмети зі списку; в протигазі; з біноклем.", "<b>Місце, час і кліматичні умови</b>: у будь-яких кліматичних умовах; вдень або вночі; у класі; на ділянці місцевості.", "<b>Підручні засоби</b> — посібники, карти, інструкції: за допомогою словника; самостійно, без підручних засобів; без бінокля.", "<b>Вид виконання</b>: індивідуально; в парах або в групі; бігом; повзком; із зав’язаними очима."]]]}, {"h": "Критерії оцінювання", "body": [["p", "Критерії визначають якість виконання — наскільки добре курсант має виконати завдання."], ["ul", ["критерії повинні містити <b>мінімальні</b> вимоги, за яких курсант у реальних обставинах виконає завдання достатньо добре;", "критерії повинні бути <b>реальними</b> для виконання."]], ["p", "Відповідні критерії: «в правильній послідовності», «без помилок, згідно з інструкцією», «допустима похибка ±2 см», «допускається не більше однієї помилки», «не довше 2 хвилин»."], ["p", "Невідповідні критерії: «7 хвилин», «9 метрів», «щоб гарно виглядало», «швидко». «7 хвилин» означає рівно сім — ні секундою більше чи менше. А що таке «гарно» чи «швидко» в уяві інструктора, курсант знати не може."], ["key", "Критерій — це межа: «не більше», «не довше», «з похибкою до». Не точна цифра і не оцінне слово."]]}, {"h": "Приклади правильного опису цілі", "body": [["p", "<b>Знання.</b> Ціль: ознайомити військовослужбовців з історією української миротворчої місії в Іраку. Вимоги: кожен курсант повинен знати основні дати, райони та цілі направлення контингенту. Умови: письмово в аудиторії, в кінці заняття, 5 хвилин, бланк і ручка, без конспекту; тест із 5 питань. Критерії: 5 правильних — «відмінно», 4 — «добре», 3 — «задовільно», 2 і менше — «незадовільно»."], ["p", "<b>Навичка.</b> Ціль: навчити курсантів вимірювати дистанцію кроками. Вимоги: кожен курсант вимірює дистанцію парами кроків на різній місцевості з обмундируванням. Умови: ділянка дороги 100 м, вдень, без допоміжних засобів вимірювання. Критерії: «виконано» — похибка не більше 5 м; «не виконано» — використовував допоміжні засоби або похибка більше 5 м."], ["p", "<b>Навичка.</b> Ціль: навчити іммобілізації нижньої кінцівки при закритому переломі підручними засобами. Вимоги: кожен курсант іммобілізує нижню кінцівку. Умови: підручними засобами, на ділянці місцевості, протягом 10 хвилин. Критерії: «виконано» — кінцівку іммобілізовано правильно і в межах часу."]]}, {"h": "Таксономія Блума", "body": [["p", "Таксономія Блума — ієрархічна класифікація навчальних цілей у пізнавальній сфері, яку запропонував у 1956 році американський психолог Бенджамін Блум. Вона допомагає вибрати правильне дієслово для вимог — від простого запам’ятовування до створення нового."], ["ul", ["<b>Знання</b> — запам’ятовування і відтворення термінів, фактів, правил, процедур;", "<b>Розуміння</b> — пояснити, переказати своїми словами, перевести з однієї форми в іншу (з тексту в схему), спрогнозувати наслідки;", "<b>Застосування</b> — використати вивчене в конкретних умовах і нових ситуаціях;", "<b>Аналіз</b> — виділити частини цілого, побачити зв’язки між ними, помилки в логіці, різницю між фактами й наслідками;", "<b>Синтез</b> — скомбінувати елементи в нове ціле: план дій, повідомлення, схему;", "<b>Оцінювання</b> — оцінити значення матеріалу для конкретної мети на основі чітких критеріїв."]], ["key", "Чим вищий рівень за Блумом, тим складніше завдання. Для базового солдата здебільшого достатньо знання, розуміння і застосування."]]}, {"h": "Порядок визначення навчальних цілей", "body": [["p", "Визначаючи навчальні цілі, інструктор зазвичай дотримується такого порядку:"], ["ul", ["визначає, що курсанти повинні знати, вміти або розуміти після заняття — конкретний очікуваний результат;", "враховує навчальну програму і попередній рівень підготовки курсантів — цілі мають бути досяжними;", "формулює ціль чітко, дієсловами дії: пояснити, виконати, продемонструвати, розпізнати;", "визначає, які попередні знання й уміння потрібні для досягнення цілі;", "планує методи, обладнання і форми роботи;", "визначає критерії, за якими оцінюватиме досягнення цілі;", "доводить ціль до курсантів на початку заняття, щоб вони розуміли, чого від них очікують."]], ["p", "Практична частина заняття: курсанти тренуються складати опис цілі для своїх тем. Спробуйте це у вкладці «Практика» — тренажер опису цілі."]]}], "keys": ["Ціль — те, що курсант повинен знати або вміти після заняття.", "Опис цілі: ціль, вимоги, умови та обставини, критерії оцінювання.", "Вимоги формулюються вимірюваними дієсловами: назвати, розібрати, перев’язати — не «зрозуміє» чи «відчує».", "Умови та обставини відповідають на запитання: де? коли? яким чином? за допомогою чого?", "Критерії — мінімальні й реальні: «не довше 2 хв», «не більше однієї помилки».", "Таксономія Блума: знання, розуміння, застосування, аналіз, синтез, оцінювання."], "test": [["З яких чотирьох складових складається опис цілі в план-конспекті?", ["Ціль, вимоги, умови та обставини, критерії оцінювання", "Тема, час, місце, керівник", "Знання, вміння, навички, ставлення", "Вступ, основна частина, висновок, АПД"], "Опис цілі: ціль → вимоги → умови та обставини → критерії."], ["Яке формулювання вимоги для практичного заняття правильне?", ["Кожен курсант накладе турнікет на верхню кінцівку", "Курсанти зрозуміють важливість турнікета", "Курсанти відчують упевненість", "Курсанти повірять у силу турнікета"], "Вимоги — вимірювані дієслова дії. «Зрозуміє», «відчує», «повірить» перевірити неможливо."], ["Чому слово «зрозуміє» неприйнятне в описі цілі?", ["Інструктор не зможе перевірити, чи це сталося", "Воно надто складне", "Воно не з військового лексикону", "Воно прийнятне для теоретичних занять"], "Неприйнятні слова — «зрозуміє», «повірить», «переконається», «відчує», «спробує»: їх неможливо перевірити."], ["Яке з дієслів підходить для вимог теоретичного заняття?", ["Назвати", "Вияснити", "Бути здатним", "Інформувати"], "Для теорії: написати, назвати, визначити, вибрати, впізнати, дати визначення."], ["«Тільки з холостими боєприпасами» — до якого виду умов належить?", ["Обмеження", "Екіпіровка", "Підручні засоби", "Вид виконання"], "Обмеження звужують можливості: тільки з холостими або з бойовими боєприпасами."], ["«В протигазі, з біноклем» — це який вид умов?", ["Екіпіровка", "Обмеження", "Місце і час", "Вид виконання"], "Екіпіровка — засоби, одяг, механізми, які можна або не можна використовувати."], ["«Повзком, у парах» — який вид умов?", ["Вид виконання", "Екіпіровка", "Підручні засоби", "Обмеження"], "Вид виконання: індивідуально, в парах, у групі, бігом, повзком, із зав’язаними очима."], ["Чому критерій «7 хвилин» вважається невідповідним?", ["Він означає рівно сім хвилин — ні більше, ні менше", "Сім хвилин — забагато", "Час не можна використовувати як критерій", "Він відповідний"], "«7 хвилин» означає рівно сім. Правильно — межа: «не довше 7 хвилин»."], ["Яке формулювання критерію правильне?", ["Допускається не більше однієї помилки", "Швидко і гарно", "9 метрів", "На високому рівні"], "Критерій — межа: «не більше», «не довше», «з похибкою до»; не точна цифра і не оцінне слово."], ["Яким вимогам мають відповідати критерії оцінювання?", ["Містити мінімальні вимоги для реальних обставин і бути реальними для виконання", "Бути максимально суворими", "Бути однаковими для всіх тем", "Містити лише час виконання"], "Критерії: мінімальні вимоги, за яких курсант виконає завдання в реальних обставинах, і реальні для виконання."], ["Курсант вимірює 100 м дороги кроками і помиляється на 4 м без допоміжних засобів. За критерієм з прикладу це…", ["Виконано — похибка не більше 5 м", "Не виконано — похибка має бути 0", "Не виконано — похибка не більше 2 м", "Виконано лише з біноклем"], "Критерій прикладу: «виконано» — похибка не більше 5 м без допоміжних засобів."], ["Курсант пояснює своїми словами, чому підвищується кучність, і переносить текст у схему. Який рівень за Блумом?", ["Розуміння", "Знання", "Аналіз", "Синтез"], "Розуміння — пояснити, переказати, перевести з однієї форми в іншу, спрогнозувати наслідки."], ["Курсант складає власний план дій відділення з окремих елементів. Який рівень за Блумом?", ["Синтез", "Застосування", "Аналіз", "Знання"], "Синтез — скомбінувати елементи в нове ціле: план, повідомлення, схему."], ["Курсант знаходить помилки в логіці бойового наказу і різницю між фактами та висновками. Який рівень?", ["Аналіз", "Оцінювання", "Розуміння", "Синтез"], "Аналіз — виділити частини, побачити зв’язки, помилки в логіці, різницю між фактами й наслідками."], ["Яких рівнів Блума здебільшого достатньо для базового солдата?", ["Знання, розуміння, застосування", "Аналіз, синтез, оцінювання", "Лише знання", "Усіх шести"], "Чим вищий рівень, тим складніше; для базового солдата — знання, розуміння, застосування."], ["Коли ціль доводять до курсантів?", ["На початку заняття — щоб розуміли, чого від них очікують", "У кінці заняття під час АПД", "Не доводять — це документ інструктора", "Лише на контрольному занятті"], "Останній крок порядку визначення цілей — довести ціль на початку заняття."], ["Замість «курсанти знатимуть про іммобілізацію» як правильно сформулювати?", ["Кожен курсант вмітиме іммобілізувати нижню кінцівку", "Курсанти ознайомляться з іммобілізацією", "Курсанти зрозуміють іммобілізацію", "Курсанти вивчать шини"], "Правильно — вимірювана дія: «кожен курсант вмітиме іммобілізувати нижню кінцівку»."], ["Які три види цілей виділяють за характером?", ["Навчальні, розвиваючі, виховні", "Короткі, середні, довгі", "Теоретичні, практичні, контрольні", "Знання, вміння, навички"], "Навчальні (дидактичні), розвиваючі (мислення, самостійність), виховні (цінності, патріотизм)."]]}, {"id": "b1m2t4z2", "code": "Б1 М2 Т4 З2", "theme": "Тема 4. Організація та проведення занять", "title": "Аналіз проведених дій (After Action Review)", "short": "АПД / AAR", "passport": {"goal": "Довести військовослужбовцям важливість та порядок проведення АПД/AAR.", "time": "3 години", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Основні керівні документи з АПД/AAR", "Особливості АПД/AAR у збройних силах держав — членів НАТО та країн-партнерів", "Основні правила та принципи проведення АПД/AAR"], "assess": "Усні запитання, письмовий тест і практична робота — АПД за сценарієм.", "criteria": "Позитивно — знає порядок АПД і успішно виконав практичне завдання.", "sources": "Програма, розд. 3.6 і 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.2; план-конспект; презентація; практична робота «АПД сценарій»"}, "sections": [{"h": "Що таке АПД", "body": [["p", "Аналіз проведених дій (АПД), або After Action Review (AAR), — дієвий інструмент для підвищення ефективності підрозділу та порозуміння між побратимами, між підлеглими і лідером."], ["p", "АПД — це динамічне, об’єктивне обговорення того, як особовий склад виконав завдання відповідно до стандартів. Кожен військовослужбовець може і повинен брати участь, якщо в нього є розуміння, інформація, погляди чи запитання, що допоможуть підрозділу подолати слабкі сторони і зміцнити сильні."], ["key", "Мета АПД — вчитися, а не шукати винних. Визначити, що сталося, чому це сталося і як зробити краще."]]}, {"h": "Керівні документи", "body": [["p", "З 2017 року After Action Review згадується в наказах ЗСУ. У 2019 році АПД увійшов до доктрини з вивчення та впровадження досвіду у ЗСУ. Тоді ж процес описано в документі «Тимчасова інструкція з процесу аналізу проведених дій заходів підготовки» ВП 7(3)-00(01).01 — він лишається основним керівним документом щодо АПД у ЗСУ."], ["p", "У Програмі курсу АПД закріплено окремим розділом: керівник заняття вказує ступінь досягнення мети й навчальних цілей, позитивні й негативні сторони, оцінює роботу кожного і дає рекомендації, що вдосконалити — зокрема під час самостійної підготовки."], ["p", "У НАТО і США: доктрини ADP 7-0, ADRP 7-0, FM 7-0 включають AAR у стандарти тренувань; посібник TC 25-20 «A Leader’s Guide to After-Action Reviews» — короткий посібник для командирів; AJP-3 визначає AAR як частину оперативного циклу."]]}, {"h": "АПД у НАТО та країнах-партнерах", "body": [["p", "After Action Review — професійне обговорення події, яке дозволяє солдатам і командирам спільно з’ясувати, що сталося, чому, як зберегти сильні сторони та покращити слабкі. У партнерів будь-яке розгортання відбувається через навчання: «тренуйся так, як будеш битися» — це імператив."], ["ul", ["<b>Стандартизація</b> — процедури регламентовані доктринами та стандартами Альянсу (STANAG);", "<b>Культура відкритості та самокритики</b> — кожен, незалежно від звання, вільно висловлює думку; акцент на вдосконаленні, а не на пошуку винних;", "<b>Фокус на навчанні</b> — уроки фіксуються і змінюють тактику, процедури, підготовку;", "<b>Формалізовані методики</b> — чіткі етапи, питання для обговорення, формати звітності;", "<b>Інтеграція з плануванням</b> — висновки АПД враховуються в нових планах і сценаріях;", "<b>Симуляції, тренажери, технології</b> — запис відео й аудіо, цифрові карти, бойові журнали."]], ["p", "У США широко застосовують неформальний AAR одразу після події (hasty AAR), командир виступає фасилітатором. У Великій Британії — модель «Aim – Outcome – Lessons – Actions». У Бундесвері — «Розпізнати – Оцінити – Покращити»."]]}, {"h": "Чотири запитання і чотири етапи", "body": [["p", "В основі методики — лише чотири прості запитання, які командир розглядає з підлеглими, слухаючи передусім їхні думки:"], ["ul", ["<b>Що мало відбутися?</b>", "<b>Що відбулося насправді і чому?</b>", "<b>Що вдалося, а що ні?</b>", "<b>Що зробити наступного разу, щоб було краще?</b>"]], ["p", "<b>Етап 1. Огляд того, що мало бути виконано.</b> Задум командира, навчальні цілі, завдання. Джерела — наказ, план проведення, графік заняття."], ["p", "<b>Етап 2. Що реально виконано.</b> Керівник збирає якомога більше думок — від підрозділу позначення дій противника (OPFOR), командирів, сержантів і солдатів. Так виробляється спільне розуміння подій."], ["p", "<b>Етап 3. Що виконано правильно і неправильно.</b> На основі критеріїв оцінювання учасники самі визначають сильні та слабкі сторони своїх дій. Керівник лише скеровує дискусію."], ["p", "<b>Етап 4. Як діяти наступного разу.</b> Ті, хто навчаються, самі виявляють проблеми і пропонують рішення; визначається, хто відповідає за впровадження змін."], ["key", "Що планували → Що сталося → Що вдалося і що ні → Що змінимо. Висновки робить сам підрозділ, а не керівник за нього."]]}, {"h": "Формальний і неформальний АПД", "body": [["p", "<b>Офіційний (формальний) АПД</b> планується завчасно, ще під час затвердження планів бойової підготовки. Потребує рекогносцировки, обладнання місця, підготовки навчальної матеріально-технічної бази і координації персоналу. Керівник — командир підрозділу або оцінювач."], ["p", "<b>АПД у робочому порядку (неформальний)</b> проводить безпосередньо командир, інструктор чи оцінювач — у заключній частині заняття, а за потреби й під час нього. Майже не потребує підготовки і засобів, проводиться на місці заняття."], ["p", "Головна перевага неформального АПД — негайний зворотний зв’язок: помилки виправляються на місці, не зупиняючи навчання. Обидва типи потребують участі всього особового складу."]]}, {"h": "Правила і принципи", "body": [["ul", ["АПД проводиться під час або одразу після виконання кожного завдання — поки все свіже;", "акцент — на задум командира, цілі заняття і виконання стандартів;", "увага — порядку дій особового складу, управлінню підрозділом і тактичним діям;", "в обговоренні беруть участь усі — від солдата до командира;", "використовуються відкриті запитання, заохочуються ініціатива і креативність;", "визначаються і сильні, і слабкі сторони;", "висновки фіксуються, щоб уроки не загубилися."]], ["p", "<b>Роль модератора:</b> забезпечує нейтральну атмосферу, стежить за структурою, заохочує відкритість і взаємоповагу, підбиває підсумки й виділяє ключові уроки."], ["warn", "Під час АПД не можна: звинувачувати персонально, переривати чи пригнічувати учасників, замовчувати незручні проблеми, перетворювати АПД на формальність без висновків. Критикуємо дії, а не людей."]]}, {"h": "АПД на практиці: розбір сценарію", "body": [["p", "Практична робота заняття: відділення з командиром і сімома солдатами обороняє стратегічний пункт до підходу підкріплення. Курсант за перебігом подій заповнює чотири пункти АПД."], ["p", "<b>Що планували:</b> зайняти позицію, утримувати до прибуття підкріплення, не допустити прориву противника через контрольовану зону."], ["p", "<b>Що вдалося:</b> позиції зайняли вчасно, противника помітили завчасно, снайпер влучно відкрив вогонь, гранатометник із помічником діяли злагоджено, позицію утримали до підкріплення."], ["p", "<b>Що ні:</b> кулеметну стрічку спорядили неякісно — збої у вогні; після пострілу з гранатомета не проконтролювали зону ураження; спостерігач не доповів про рух на фланзі; командир запізно викликав підкріплення."], ["p", "<b>Що змінимо:</b> контроль спорядження, доповідь про кожну загрозу без вагань, контроль зони ураження після застосування важкого озброєння, чіткий порядок рішення про виклик підкріплення, додаткові засоби спостереження — БпЛА."], ["p", "Пройдіть цей сценарій самостійно у вкладці «Практика» — тренажер АПД."]]}], "keys": ["АПД / AAR — обговорення виконаного завдання, щоб вчитися, а не шукати винних.", "Основний документ у ЗСУ — Тимчасова інструкція з процесу АПД заходів підготовки ВП 7(3)-00(01).01 (2019).", "Чотири запитання: що мало відбутися, що відбулося і чому, що вдалося і що ні, що зробити наступного разу.", "Два типи: офіційний (формальний) і у робочому порядку (неформальний).", "АПД — одразу після завдання, за участі всіх, з відкритими запитаннями.", "Критикуємо дії, а не людей; висновки обов’язково фіксуємо."], "test": [["Яка головна мета АПД?", ["Вчитися: визначити, що сталося, чому і як зробити краще", "Визначити винних і покарати", "Виставити оцінки кожному", "Скласти звіт для командування"], "Мета АПД — вчитися, а не шукати винних."], ["Який документ залишається основним керівним документом щодо АПД у ЗСУ?", ["Тимчасова інструкція з процесу АПД заходів підготовки ВП 7(3)-00(01).01", "FM 7-0", "TC 25-20", "Наказ ГШ № 41"], "Основний документ у ЗСУ — Тимчасова інструкція ВП 7(3)-00(01).01 (2019)."], ["Як називається короткий посібник для командирів армії США з проведення AAR?", ["TC 25-20 «A Leader’s Guide to After-Action Reviews»", "ADP 7-0", "AJP-3", "STANAG 2116"], "TC 25-20 — короткий посібник для командирів; ADP/ADRP/FM 7-0 — стандарти тренувань; AJP-3 — оперативний цикл."], ["Модель «Aim – Outcome – Lessons – Actions» використовують у…", ["Великій Британії", "Бундесвері", "США як hasty AAR", "Польщі"], "Велика Британія — «Aim – Outcome – Lessons – Actions»; Бундесвер — «Розпізнати – Оцінити – Покращити»."], ["Яке з чотирьох запитань АПД стоїть другим?", ["Що відбулося насправді і чому?", "Що мало відбутися?", "Що вдалося, а що ні?", "Що зробити наступного разу?"], "Запитання: що мало відбутися → що відбулося і чому → що вдалося і ні → що зробити наступного разу."], ["Які джерела використовують на етапі 1 «що мало бути виконано»?", ["Наказ, план проведення, графік заняття", "Думки солдатів", "Відеозапис бою", "Висновки оцінювача"], "Етап 1: задум командира, навчальні цілі, завдання — з наказу, плану і графіка."], ["Навіщо на етапі 2 збирати думки і від підрозділу OPFOR, і від солдатів?", ["Щоб виробити спільне розуміння того, що реально відбулося", "Щоб знайти винних", "Щоб скоротити час АПД", "Щоб оцінити OPFOR"], "Етап 2: якомога більше думок — від OPFOR, командирів, сержантів і солдатів — для спільного розуміння."], ["На етапі 3 керівник сам перелічує всі помилки підрозділу. Що не так?", ["Учасники самі визначають сильні й слабкі сторони, керівник лише скеровує", "Нічого, так і має бути", "Помилки на етапі 3 не обговорюють", "Етап 3 проводить лише оцінювач"], "Висновки робить сам підрозділ; керівник скеровує дискусію."], ["Що обов’язково визначають на етапі 4?", ["Рішення проблем і хто відповідає за впровадження змін", "Оцінку кожному солдату", "Дату наступного АПД", "Винних у невдачі"], "Етап 4: ті, хто навчаються, пропонують рішення; визначається відповідальний за впровадження."], ["Головна перевага неформального АПД?", ["Негайний зворотний зв’язок — помилки виправляються на місці", "Повне документування", "Участь вищого командування", "Використання відеозаписів"], "Неформальний АПД — майже без підготовки, на місці, з негайним зворотним зв’язком."], ["Що потребує формальний АПД на відміну від неформального?", ["Планування завчасно, рекогносцировку, обладнання місця і координацію персоналу", "Лише присутності інструктора", "Нічого додаткового", "Лише відеозапису"], "Формальний АПД планується разом із планами підготовки, потребує рекогносцировки, обладнання, НМТБ, координації."], ["Хто бере участь в АПД?", ["Усі — від солдата до командира", "Лише командири", "Лише оцінювачі", "Лише ті, хто помилився"], "Обидва типи АПД потребують участі всього особового складу."], ["Модератор АПД почув: «Це все через Петренка». Як він має відреагувати?", ["Перевести розмову на дії, а не на людей — персональні звинувачення неприпустимі", "Погодитися і записати", "Попросити Петренка вибачитися", "Завершити АПД"], "Під час АПД не можна звинувачувати персонально — критикуємо дії, а не людей."], ["У сценарії оборони пункту що з переліченого — недолік, а не успіх?", ["Спостерігач не доповів про рух на фланзі", "Позиції зайняли вчасно", "Снайпер влучно відкрив вогонь", "Позицію утримали до підкріплення"], "Недоліки: стрічка споряджено неякісно, не проконтролювали зону ураження, спостерігач не доповів, командир запізно викликав підкріплення."], ["Яке рішення в сценарії АПД відповідає проблемі «стрічку спорядили неякісно»?", ["Контроль спорядження", "Додаткові БпЛА для спостереження", "Чіткий порядок виклику підкріплення", "Контроль зони ураження"], "Кожній проблемі — своє рішення: неякісна стрічка → контроль спорядження."], ["Що з переліченого — ознака культури AAR у НАТО?", ["Кожен незалежно від звання вільно висловлює думку", "Говорить лише старший за званням", "Обговорення закрите для солдатів", "Висновки не фіксуються"], "Культура відкритості та самокритики: кожен, незалежно від звання, вільно висловлює думку."], ["Коли проводиться АПД за правилами?", ["Під час або одразу після виконання кожного завдання", "Раз на тиждень", "Лише після іспиту", "Наприкінці курсу"], "АПД — під час або одразу після кожного завдання, поки все свіже."]]}, {"id": "b1m2t4z3", "code": "Б1 М2 Т4 З3", "theme": "Тема 4. Організація та проведення занять", "title": "Складові частини заняття, розподіл часу, план-конспект", "short": "Складові заняття", "passport": {"goal": "Довести військовослужбовцям, з яких частин складається заняття, як розподіляти час між ними; навчити опрацьовувати план-конспект (план) проведення заняття.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Складові частини заняття та значення кожної", "Розподіл часу між частинами заняття", "Порядок і правила опрацювання план-конспекту"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; практичне завдання з опису цілі.", "criteria": "Позитивно — якщо знає частини заняття, розподіл часу і вміє опрацювати план-конспект.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.3 (зразки план-конспектів); презентація; тест за темою"}, "sections": [{"h": "Три частини заняття", "body": [["p", "Будь-яке навчальне заняття складається з трьох частин: <b>вступної, основної і заключної</b>. Кожна має обов’язкові пункти, і пропустити їх не можна — за кожним з них оцінюють курсанта на пробному занятті."], ["key", "Вступна → основна → заключна. Структура однакова для лекції, практичного й польового заняття."]]}, {"h": "Вступна частина", "body": [["ul", ["привітання і перевірка присутності особового складу (за журналом бойової підготовки або списком);", "перевірка матеріальних засобів і доведення правил поводження;", "<b>доведення заходів безпеки</b> — залежать від умов заняття: повітряна тривога, пожежна безпека; на заняттях зі зброєю — перевірка на розрядженість, доповідь про боєприпаси, 5 правил, команда «Стоп»;", "перевірка знань попереднього заняття — тема і опитування;", "доведення теми і мети заняття;", "<b>хід заняття</b> — місце, час, метод, навчальні питання, умови оцінювання (як і коли), критерії оцінювання;", "порядок проведення — як ставити запитання, як відповідати, порядок конспектування, розміщення;", "<b>мотивація</b> — чому ця тема важлива, з прикладом з реального досвіду."]]]}, {"h": "Основна і заключна частини", "body": [["p", "<b>Основна частина</b> складається з трьох елементів:"], ["ul", ["<b>викладання</b> — мінімальний обсяг матеріалу, потрібний, щоб перейти до практики;", "<b>практика</b> — якщо вона передбачена заняттям: топографія, зв’язок, зброя; на практичних заняттях — за EDIP: пояснення, демонстрація, імітація, тренування;", "<b>контроль</b> — перевірка засвоєних знань або навичок."]], ["p", "<b>Заключна частина</b> має два основні елементи:"], ["ul", ["<b>підведення підсумків</b> — нагадати тему, мету і навчальні питання, сказати, чи досягнута мета, оголосити оцінки (техніка «похвала — критика — похвала»);", "<b>кінцеві інструкції</b> — завдання на самостійну підготовку, тема, місце і час наступного заняття, потрібна матеріальна база, призначення прибиральників. На заняттях зі зброєю — обов’язкова перевірка зброї на розрядженість у всіх."]]]}, {"h": "Розподіл часу", "body": [["p", "Рекомендований розподіл часу заняття:"], ["ul", ["<b>вступна частина — 5–10%</b>;", "<b>основна частина — 80–85%</b>;", "<b>заключна частина — 10%</b>."]], ["p", "Для 45-хвилинного заняття це приблизно 3–5 хв на вступ, 38 хв на основну частину і 3–5 хв на завершення. У зразку план-конспекту теоретичного заняття: 3 + 39 + 3 хвилини; практичного на 90 хвилин: 6 + 80 + 4."], ["p", "Принципи розподілу часу:"], ["ul", ["час на кожну частину залежить від її внеску в досягнення мети — найважливішому більше часу;", "передбачайте зміну видів діяльності, щоб уникнути втоми;", "враховуйте рівень підготовки аудиторії — підготовленим менше вступу, більше самостійної роботи;", "закладайте резерв 5–10% на запитання, дискусії, технічні затримки;", "чергуйте інтенсивні й спокійніші види діяльності;", "за потреби візуалізуйте час — таймер, графік."]], ["warn", "Пунктуальність — критичний пункт оціночного листа: час заняття має вкластися в ±5 хвилин, інакше заняття не зараховане."]]}, {"h": "Як готувати план-конспект", "body": [["p", "План-конспект — опорний документ, що відтворює структуру і основний зміст заняття і допомагає провести його ефективно. Його складання — завершальний етап підготовки інструктора."], ["ul", ["<b>Розклад занять</b> — вихідні дані: вид заняття, з ким, час, місце, тема, тривалість, матеріальне забезпечення, керівні документи.", "<b>Програма підготовки</b> — що вже вивчено, що треба вивчити, попередні й наступні заняття, нормативи, форма і методи.", "<b>Мета і навчальні питання</b> — визначити навчальну й виховну мету, розподілити зміст і час між навчальними питаннями.", "<b>Керівні документи і література</b> — вивчити й уточнити зміст, нормативи, методи і забезпечення.", "<b>План-конспект</b> — оформити за зразком."]]]}, {"h": "Що містить план-конспект", "body": [["p", "Шапка: гриф «ЗАТВЕРДЖУЮ», тема, заняття, <b>мета</b>, <b>опис цілі</b> (вимоги, умови та обставини, критерії оцінювання), навчальні питання, час, місце, метод, керівництва і посібники, матеріальне забезпечення."], ["p", "Хід заняття: вступна частина з хвилинами і заходами безпеки; основна частина за навчальними питаннями — для практичного заняття з етапами EDIP: що робить інструктор, що роблять курсанти, розміщення, акценти, запитання; контроль; заключна частина."], ["p", "Наприкінці — підпис керівника заняття. У додатку «КІБР» план-конспект можна зібрати в конструкторі, а мету — потренувати в тренажері «Опис цілі»."], ["key", "План-конспект — опорний документ: чітка структура, хвилини на кожну частину, мета і опис цілі, заходи безпеки."]]}], "keys": ["Три частини заняття: вступна, основна, заключна.", "Основна частина: викладання, практика, контроль.", "Заключна: підведення підсумків і кінцеві інструкції.", "Час: вступ 5–10%, основна 80–85%, заключна 10%; резерв 5–10%.", "План-конспект — опорний документ; готується на основі розкладу і програми."], "test": [["Лекція триває 45 хвилин. Скільки хвилин відведено на основну частину у зразку план-конспекту теоретичного заняття?", ["39 хвилин", "38 хвилин", "36 хвилин", "42 хвилини"], "Зразок теоретичного заняття: 3 + 39 + 3 хвилини."], ["Практичне заняття на 90 хвилин за зразком план-конспекту. Як розподілено час?", ["6 + 80 + 4 хвилини", "9 + 72 + 9 хвилин", "10 + 70 + 10 хвилин", "5 + 80 + 5 хвилин"], "Зразок практичного на 90 хвилин: вступ 6, основна 80, заключна 4."], ["Заняття заплановано на 45 хвилин, а тривало 52. Що це означає за оціночним листом?", ["Заняття не зараховане — вихід за ±5 хвилин", "Мінус один бал", "Нічого, якщо матеріал викладено", "Зауваження без наслідків"], "Пунктуальність — критичний пункт: час має вкластися в ±5 хвилин, інакше заняття не зараховане."], ["Яка частка часу рекомендована на основну частину заняття?", ["80–85%", "50–60%", "70%", "90–95%"], "Розподіл: вступна 5–10%, основна 80–85%, заключна 10%."], ["Інструктор почав заняття зі зброєю одразу з теми, пропустивши перевірку на розрядженість. Яку частину структури порушено?", ["Вступну — доведення заходів безпеки", "Основну — практику", "Заключну — кінцеві інструкції", "Порушень немає"], "У вступній частині на заняттях зі зброєю: перевірка на розрядженість, доповідь про боєприпаси, 5 правил, команда «Стоп»."], ["Що з переліченого НЕ входить до вступної частини?", ["Оголошення оцінок за заняття", "Перевірка знань попереднього заняття", "Мотивація з прикладом з досвіду", "Порядок проведення заняття"], "Оцінки оголошують у заключній частині під час підведення підсумків."], ["Яким має бути обсяг викладання в основній частині?", ["Мінімальним — достатнім, щоб перейти до практики", "Максимальним — щоб нічого не пропустити", "Половина основної частини", "Однаковим для всіх занять"], "Викладання — мінімальний обсяг матеріалу, потрібний для переходу до практики."], ["Яка техніка рекомендована для оголошення оцінок у заключній частині?", ["«Похвала — критика — похвала»", "«Критика — похвала»", "Лише перелік помилок", "Оголошення без коментарів"], "Підведення підсумків — техніка «похвала — критика — похвала»."], ["Що з переліченого входить до кінцевих інструкцій?", ["Завдання на самопідготовку, тема і місце наступного заняття, прибиральники", "Мотивація курсантів", "Перевірка присутності", "Демонстрація навички"], "Кінцеві інструкції: самопідготовка, наступне заняття, матбаза, прибиральники; на заняттях зі зброєю — перевірка на розрядженість."], ["Скільки часу резерву рекомендують закладати на запитання й затримки?", ["5–10%", "20–25%", "1–2%", "Резерв не потрібен"], "Принципи розподілу часу: резерв 5–10% на запитання, дискусії, технічні затримки."], ["Група вже добре підготовлена. Як змінити розподіл часу?", ["Менше вступу, більше самостійної роботи", "Більше вступу і теорії", "Скоротити практику", "Нічого не змінювати"], "Враховуйте рівень: підготовленим менше вступу, більше самостійної роботи."], ["Що є вихідними даними для план-конспекту з розкладу занять?", ["Вид заняття, з ким, час, місце, тема, тривалість, забезпечення", "Оцінки курсантів", "Звіт про попереднє заняття", "Рапорт командира"], "Розклад занять дає вихідні дані: вид, з ким, час, місце, тема, тривалість, забезпечення, документи."], ["Що містить «шапка» план-конспекту?", ["Гриф «ЗАТВЕРДЖУЮ», тему, мету, опис цілі, навчальні питання, час, місце, метод, забезпечення", "Лише тему і дату", "Список курсантів", "Хід заняття з хвилинами"], "Шапка: «ЗАТВЕРДЖУЮ», тема, мета, опис цілі, навчальні питання, час, місце, метод, посібники, забезпечення."], ["Як в план-конспекті практичного заняття описується основна частина?", ["За навчальними питаннями з етапами EDIP: дії інструктора, дії курсантів, розміщення, акценти", "Одним абзацом загального змісту", "Лише переліком нормативів", "Без розподілу часу"], "Хід заняття: основна частина за навчальними питаннями, для практичного — з етапами EDIP."], ["Що є завершальним етапом підготовки інструктора до заняття?", ["Складання план-конспекту", "Вивчення програми", "Отримання розкладу", "Перевірка матбази"], "Складання план-конспекту — завершальний етап підготовки інструктора."], ["Чому пропуск будь-якого обов’язкового пункту структури критичний на пробному занятті?", ["За кожним пунктом оцінюють курсанта", "Бо порушується розклад", "Бо так вимагає командир роти", "Це не критично"], "Кожна частина має обов’язкові пункти, і за кожним з них оцінюють курсанта на пробному занятті."]]}, {"id": "b1m2t4z4", "code": "Б1 М2 Т4 З4", "theme": "Тема 4. Організація та проведення занять", "title": "Обладнання місця проведення заняття. Розташування інструктора", "short": "Місце заняття", "passport": {"goal": "Ознайомити військовослужбовців з правилами обладнання місця проведення заняття (класу), довести принципи, за якими інструктор обирає місце свого розташування відносно курсантів.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Правила обладнання місця проведення заняття", "Принципи вибору місця розташування інструктора", "Варіанти розміщення курсантів і інструктора"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; зобразити варіанти розміщення.", "criteria": "Позитивно — якщо знає правила обладнання класу, принципи розташування інструктора і варіанти розміщення курсантів.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.4; презентація; тест за темою"}, "sections": [{"h": "Як підготувати клас", "body": [["ul", ["<b>Розмір і робочі місця</b> — місце для кожного курсанта, краще з кількома запасними; якщо плануєте групову роботу, простір не має заважати.", "<b>Освітлення</b> — світло від вікон чи ламп не повинне бити в очі курсантам або інструктору і давати відблиски на дошці чи екрані; у класі не повинно бути темно.", "<b>Живлення</b> — справні розетки в потрібному місці або подовжувачі для проектора й інших засобів.", "<b>Резерв</b> — дошка виручить у форс-мажорі, наприклад при вимкненні світла; усі засоби перевірені й готові.", "<b>Нічого зайвого</b> — зайві столи, стільці, непотрібна матеріальна база заважають."]]]}, {"h": "Норми для навчального приміщення", "body": [["p", "У презентації заняття наведено орієнтовні норми:"], ["ul", ["площа — 2,4 м² на курсанта: для 30 курсантів не менше 72 м²;", "від дошки до першої парти — не менше 3 м (кут зору до 35°), до останньої — не більше 10 м;", "температура повітря 18–22 °C, відносна вологість близько 60%, шум — до 45 дБ (рівень звичайної розмови);", "максимум природного світла, яке падає на робочі місця <b>зліва</b>; площа вікон — щонайменше чверть площі підлоги;", "з вересня до травня додають штучне освітлення білого або холодно-білого кольору."]], ["p", "Недостатнє освітлення погіршує здоров’я, знижує працездатність, підвищує втому і нервову напругу."]]}, {"h": "Де стояти інструктору", "body": [["ul", ["<b>Повна видимість</b> — бачите всіх курсантів або визначені групи.", "<b>Чітка комунікація</b> — команди й пояснення чути всім; за потреби — підсилювальні засоби.", "<b>Дисципліна присутністю</b> — позиція, яка запобігає порушенням.", "<b>Безпека</b> — на заняттях з ризиком займайте місце, звідки контролюєте дії і можете запобігти нещасному випадку.", "<b>Доступність</b> — можна швидко підійти до курсанта, якому потрібна допомога.", "<b>Якісна демонстрація</b> — під час показу ваші дії добре видно всім.", "<b>Динамічність і етап заняття</b> — фронтально під час пояснення, між курсантами під час практичної роботи.", "<b>Особливості місцевості</b> — розміри, освітлення, перешкоди на навчальній локації."]], ["key", "Інструктор бачить усіх, усі бачать і чують інструктора — і він може швидко підійти до кожного."]]}, {"h": "Варіанти розміщення курсантів", "body": [["p", "<b>Рядами (два-три ряди)</b> — традиційне розташування обличчям до інструктора. Переваги: добрий візуальний контакт, легкий контроль дисципліни, зручно для лекції і фронтального опитування, ефективне використання площі. Недоліки: мало взаємодії між курсантами, пасивність задніх рядів, складно працювати індивідуально. Для лекцій, теоретичних занять, інструктажів."], ["p", "<b>Літерою «П»</b> — відкрита частина до інструктора. Переваги: всі бачать одне одного, заохочує дискусію, інструктор має доступ до кожного, довірлива атмосфера. Недоліки: потребує більше простору, менш ефективне для великих груп. Для семінарів, тренінгів, обговорень, презентацій курсантів."], ["p", "<b>Групами по 3–6 осіб</b> — інструктор вільно ходить між групами. Переваги: співпраця, командна робота, інтерактивні методи, увага групам, яким потрібна допомога. Недоліки: складніше контролювати дисципліну, не всім комфортно в команді, потрібне ретельне планування завдань. Для практичних занять, кейсів, проєктів."], ["p", "Інші варіанти: <b>коло чи півколо</b> — для рівноправних дискусій; <b>каре</b> — обличчям одне до одного, для дебатів і засідань."], ["p", "Часто найкраще поєднувати різні варіанти протягом одного заняття — інструктор має вміти гнучко змінювати простір."]]}], "keys": ["Клас: місце кожному курсанту, світло не в очі і без відблисків, живлення, нічого зайвого.", "Природне світло — зліва; температура 18–22 °C.", "Інструктор: повна видимість, чутність, безпека, доступність, динамічність.", "Рядами — для лекцій; літерою «П» — для дискусій; групами — для практичної роботи."], "test": [["Клас готують для 25 курсантів. Яка мінімальна площа приміщення за нормою 2,4 м² на курсанта?", ["60 м²", "50 м²", "72 м²", "45 м²"], "2,4 м² × 25 = 60 м²."], ["Перша парта стоїть за 2 метри від дошки. Що не так?", ["Відстань має бути не менше 3 м", "Нічого — менше 3 м навіть краще", "Відстань має бути не менше 5 м", "Норм для цього немає"], "Від дошки до першої парти — не менше 3 м (кут зору до 35°), до останньої — не більше 10 м."], ["Яка максимальна відстань від дошки до останньої парти?", ["10 метрів", "6 метрів", "15 метрів", "20 метрів"], "До останньої парти — не більше 10 м."], ["Яка рекомендована температура повітря в навчальному класі?", ["18–22 °C", "14–16 °C", "24–26 °C", "Не нормується"], "Температура 18–22 °C, вологість близько 60%, шум до 45 дБ."], ["З якого боку має падати природне світло на робочі місця?", ["Зліва", "Справа", "Ззаду", "Спереду, від дошки"], "Максимум природного світла, що падає на робочі місця зліва."], ["Сонце з вікна дає відблиск на екрані проектора. Яке правило підготовки класу порушено?", ["Світло не повинне бити в очі й давати відблиски на дошці чи екрані", "Розміщення живлення", "Наявність резерву", "Кількість робочих місць"], "Освітлення: світло не має бити в очі й відсвічувати на дошці чи екрані."], ["Навіщо мати в класі звичайну дошку, якщо є проектор?", ["Як резерв у форс-мажорі, наприклад при вимкненні світла", "Для прикраси", "Вона обов’язкова за статутом", "Для записів курсантів"], "Резерв: дошка виручить у форс-мажорі, наприклад при вимкненні світла."], ["Під час практичної роботи курсантів з небезпечним обладнанням де має бути інструктор?", ["У місці, звідки контролює дії і може запобігти нещасному випадку", "Біля дверей класу", "За своїм столом", "Позаду всіх, щоб не заважати"], "Безпека: на заняттях з ризиком займайте місце, звідки контролюєте і можете запобігти нещасному випадку."], ["Як змінюється позиція інструктора залежно від етапу заняття?", ["Фронтально під час пояснення, між курсантами під час практики", "Завжди фронтально", "Завжди між курсантами", "Позиція не залежить від етапу"], "Динамічність: фронтально під час пояснення, між курсантами під час практичної роботи."], ["Які головні недоліки розміщення рядами?", ["Мало взаємодії між курсантами і пасивність задніх рядів", "Поганий візуальний контакт з інструктором", "Складно контролювати дисципліну", "Неефективне використання площі"], "Ряди: добрий контакт і контроль, але мало взаємодії, пасивні задні ряди, складно працювати індивідуально."], ["Для семінару з обговоренням на 12 осіб яке розміщення найкраще?", ["Літерою «П»", "Рядами", "Групами по 3–6", "Каре"], "«П» — всі бачать одне одного, заохочує дискусію; менш ефективне для великих груп."], ["Чому розміщення «П» погано підходить для групи з 40 курсантів?", ["Потребує більше простору і менш ефективне для великих груп", "Ускладнює дискусію", "Інструктор не має доступу до курсантів", "Курсанти не бачать одне одного"], "Недоліки «П»: потребує більше простору, менш ефективне для великих груп."], ["Для розбору кейсів у командах яке розміщення доречне і який його ризик?", ["Групи по 3–6; складніше контролювати дисципліну", "Ряди; пасивність", "Коло; брак місця", "Каре; конфлікти"], "Групи по 3–6 — співпраця й інтерактив; недоліки — дисципліна, дискомфорт деяких у команді, потрібне планування."], ["Для дебатів двох сторін яке розміщення описано на занятті?", ["Каре — обличчям одне до одного", "Коло", "Ряди", "Літерою «П»"], "Каре — обличчям одне до одного, для дебатів і засідань; коло — для рівноправних дискусій."], ["Що рекомендовано щодо розміщення протягом одного заняття?", ["Поєднувати різні варіанти, гнучко змінюючи простір", "Тримати одне розміщення весь час", "Завжди використовувати ряди", "Змінювати лише за командою командира"], "Часто найкраще поєднувати варіанти протягом заняття."], ["Яку мінімальну площу вікон передбачає норма?", ["Щонайменше чверть площі підлоги", "Половину площі підлоги", "Десяту частину", "Не нормується"], "Площа вікон — щонайменше чверть площі підлоги."]]}, {"id": "b1m2t4z5", "code": "Б1 М2 Т4 З5", "theme": "Тема 4. Організація та проведення занять", "title": "Навчально-методичні матеріали, НМТБ, технічні та цифрові засоби", "short": "НМТБ і засоби навчання", "passport": {"goal": "Ознайомити військовослужбовців з правилами підготовки навчально-методичних матеріалів, вимогами до презентацій, правилами підготовки НМТБ і використання технічних, медійних та цифрових засобів навчання.", "time": "4 години (180 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Мета і типи візуальної підтримки", "Техніка використання візуальних засобів", "Вимоги до навчально-методичних матеріалів і презентацій", "Підготовка НМТБ до різних видів занять", "Технічні, медійні та цифрові засоби навчання"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.5; презентація; тести за темою"}, "sections": [{"h": "Навіщо візуальна підтримка", "body": [["p", "Візуальна підтримка допомагає донести інформацію швидше, точніше й надійніше, особливо коли часу мало або навантаження високе. Вона покращує сприйняття, зменшує помилки, прискорює прийняття рішень, підтримує пам’ять і уніфікує дії."], ["p", "Основні типи візуальної підтримки та їхні особливості:"], ["ul", ["<b>Плакати</b> — можна в класі й на вулиці, багаторазові; але великі, їх не змінити, можуть відволікати.", "<b>Аудіо і відео</b> — привертають увагу, показують навички; але потрібні живлення і техніка.", "<b>Схеми</b> — наочні, структуровані, економлять час; але обмежені в деталях і потребують пояснення.", "<b>Макети</b> — наочні, практичні, підвищують інтерес; але потребують місця і часу на підготовку.", "<b>Дошка</b> — швидко і зручно, взаємодія з аудиторією; але мало місця.", "<b>Презентація</b> — послідовний показ, легко змінити; але потрібні живлення й навички.", "<b>Демонстраційна група</b> — фактор реальності, живий показ вправи; але складна підготовка."]], ["p", "Принцип вибору засобу: <b>простий, цікавий, підходящий, необхідний, достатнього розміру</b>."]]}, {"h": "Техніка використання візуальних засобів: ВПОВС", "body": [["ul", ["<b>Випробувати</b> — перед заняттям перевірити, що засіб працює і все видно.", "<b>Показати</b> — продемонструвати в потрібний момент, щоб бачили всі.", "<b>Обговорити</b> — пояснити, що саме зображено і на що звернути увагу.", "<b>Використати</b> — застосувати засіб для досягнення мети заняття.", "<b>Сховати</b> — прибрати, щоб не відволікав від подальшого матеріалу."]], ["key", "Випробувати — показати — обговорити — використати — сховати. Цю техніку перевіряють в оціночному листі."]]}, {"h": "Навчально-методичні матеріали", "body": [["p", "<b>За призначенням:</b> основні — підручники, посібники, статути, настанови, курси лекцій; допоміжні — збірники завдань, методичні рекомендації, опорні конспекти, роздатковий матеріал, плакати; контрольно-оцінювальні — тести, контрольні питання, залікові завдання, критерії оцінювання."], ["p", "<b>За носієм:</b> друковані, електронні (презентації, відео, електронні посібники, тренажери, онлайн-курси) і матеріальні засоби (зразки озброєння, макети, тренажери, карти, засоби зв’язку та імітації)."], ["p", "<b>Вимоги до матеріалів:</b>"], ["ul", ["змістовність і науковість — відповідність програмам і документам, достовірність, актуальність, логічна структура;", "методична обґрунтованість — чітка мета, різні методи, практичні завдання, питання для самоконтролю і критерії оцінювання;", "зручність — чітка структура, грамотна мова, якісне оформлення;", "військова специфіка — офіційна термінологія, правила роботи з інформацією обмеженого доступу, наближеність до реальної служби, посилання на керівні документи, регулярне оновлення."]]]}, {"h": "Вимоги до презентацій", "body": [["ul", ["<b>Правило 6×6</b> — не більше 6 рядків на слайді і 6 слів у рядку;", "логічна послідовність і нумерація слайдів;", "інтервал між пунктами більший, ніж між рядками всередині пункту;", "вирівнювання тексту по лівому краю;", "заголовки — 32–44 пт, основний текст — 28–32 пт;", "базовий шрифт комунікації ЗСУ — <b>UAF Sans</b>;", "не писати весь текст великими літерами — це читається як крик;", "не більше 3 основних кольорів на слайді, контраст тексту і фону;", "жодних граматичних і орфографічних помилок;", "якісні зображення, помірна анімація, єдиний стиль;", "перевірити показ на тому обладнанні, де буде заняття."]], ["warn", "Перевантажений текстом слайд — найчастіша помилка. Краще розбити матеріал на кілька слайдів."]]}, {"h": "Підготовка НМТБ", "body": [["p", "<b>Загальні правила:</b> завчасність, планування за план-конспектом, особиста відповідальність інструктора, координація із завідувачами класів і складів, особиста перевірка перед заняттям, безпека, ефективність і аналіз після заняття."], ["p", "<b>До теоретичного заняття:</b> визначити потребу в проекторі, екрані, комп’ютері, звуку й подати запит; перевірити файли презентацій і відео; підготувати роздатковий матеріал; розмістити плакати й макети так, щоб їх бачили всі; розставити меблі, перевірити освітлення; особисто перевірити всю техніку; мати дошку, маркери, указку."], ["p", "<b>До практичного заняття:</b> визначити точну кількість зброї, техніки, приладів, витратних матеріалів і засобів захисту; отримати й доставити їх; обладнати навчальні місця, зробити розмітку і позначити зони безпеки; перевірити засоби пожежогасіння і медичної допомоги; рівномірно розподілити обладнання."], ["p", "<b>Після заняття:</b> зібрати і повернути НМТБ, перевірити комплектність і справність, повідомити про несправності, проаналізувати ефективність."]]}, {"h": "Технічні, медійні та цифрові засоби", "body": [["p", "Технічні засоби навчання — електронні, механічні та аудіовізуальні пристрої, що підвищують ефективність навчання. За сприйняттям вони бувають <b>візуальні, аудитивні й аудіовізуальні</b>; за призначенням — засоби передачі інформації, контролю знань, тренажери, засоби самонавчання і допоміжні."], ["p", "Принципи використання: цілеспрямованість — засіб служить меті, а не для ефекту; візуалізація складного; простота; поєднання з традиційними методами; планована, а не епізодична інтеграція."], ["p", "Медійні засоби: друковані, аудіо (записи, подкасти), відео (навчальні фільми, відеоінструкції), інтерактивні (симуляції, онлайн-курси, мобільні навчальні застосунки) і соціальні (закриті групи, спільна робота з файлами)."], ["p", "Цифрові засоби зі штучним інтелектом допомагають готувати матеріали, тести, озвучку й тренажери — як цей додаток. Але інструктор завжди перевіряє зміст на відповідність керівним документам."]]}], "keys": ["Принцип вибору засобу: простий, цікавий, підходящий, необхідний, достатнього розміру.", "Техніка: випробувати — показати — обговорити — використати — сховати.", "Правило 6×6; заголовки 32–44 пт, текст 28–32 пт; шрифт UAF Sans; не більше 3 кольорів.", "НМТБ: завчасно, за план-конспектом, особиста перевірка і безпека.", "ТЗН: візуальні, аудитивні, аудіовізуальні; засіб служить меті."], "test": [["Що означає абревіатура техніки ВПОВС?", ["Випробувати — показати — обговорити — використати — сховати", "Вивчити — підготувати — оформити — видати — скласти", "Вибрати — показати — оцінити — виправити — сховати", "Встановити — перевірити — оголосити — вимкнути — скласти"], "ВПОВС: випробувати, показати, обговорити, використати, сховати — це перевіряють в оціночному листі."], ["Інструктор показав схему, а потім залишив її висіти до кінця заняття. Який крок ВПОВС пропущено?", ["Сховати — прибрати, щоб не відволікала", "Випробувати", "Обговорити", "Показати"], "Останній крок — сховати засіб, щоб не відволікав від подальшого матеріалу."], ["Перед заняттям проектор не перевірили, і відео не запустилося. Який крок ВПОВС порушено?", ["Випробувати", "Показати", "Обговорити", "Сховати"], "Випробувати — перед заняттям перевірити, що засіб працює і все видно."], ["Який засіб дає «фактор реальності», але найскладніший у підготовці?", ["Демонстраційна група", "Плакат", "Дошка", "Презентація"], "Демонстраційна група — живий показ вправи, але складна підготовка."], ["Назвіть недолік схем як засобу візуальної підтримки.", ["Обмежені в деталях і потребують пояснення", "Потребують живлення", "Їх неможливо використати на вулиці", "Займають багато часу на показ"], "Схеми наочні й економлять час, але обмежені в деталях і потребують пояснення."], ["Тести і залікові завдання — це які навчально-методичні матеріали за призначенням?", ["Контрольно-оцінювальні", "Основні", "Допоміжні", "Матеріальні засоби"], "За призначенням: основні (підручники, статути), допоміжні (методички, роздатка), контрольно-оцінювальні (тести, критерії)."], ["Слайд містить 10 рядків по 12 слів. Яке правило порушено?", ["Правило 6×6 — не більше 6 рядків і 6 слів у рядку", "Правило трьох кольорів", "Вирівнювання по лівому краю", "Розмір заголовка"], "Правило 6×6; перевантажений слайд — найчастіша помилка, краще розбити на кілька."], ["Який розмір основного тексту рекомендований для слайдів?", ["28–32 пт", "12–14 пт", "18–20 пт", "48–60 пт"], "Заголовки — 32–44 пт, основний текст — 28–32 пт."], ["Який базовий шрифт комунікації ЗСУ?", ["UAF Sans", "Times New Roman", "Arial", "Calibri"], "Базовий шрифт комунікації ЗСУ — UAF Sans."], ["Чому не можна писати весь текст слайду великими літерами?", ["Це читається як крик", "Так займає більше місця", "Це заборонено статутом", "Проектор погано показує великі літери"], "Весь текст великими літерами сприймається як крик."], ["Скільки основних кольорів допускається на слайді?", ["Не більше 3", "Не більше 5", "Лише 1", "Скільки завгодно, якщо контрастно"], "Не більше 3 основних кольорів і контраст тексту з фоном."], ["Що інструктор робить з НМТБ після практичного заняття?", ["Збирає, перевіряє комплектність і справність, повідомляє про несправності, аналізує ефективність", "Залишає на навчальних місцях до наступного разу", "Передає курсантам на зберігання", "Нічого — це обов’язок складу"], "Після заняття: зібрати й повернути НМТБ, перевірити комплектність, повідомити про несправності, проаналізувати."], ["Що з переліченого — специфічна підготовка до практичного, а не теоретичного заняття?", ["Позначити зони безпеки і перевірити засоби пожежогасіння та медичної допомоги", "Перевірити файли презентації", "Підготувати роздатковий матеріал", "Перевірити освітлення класу"], "Практичне: точна кількість зброї й засобів, обладнання місць, розмітка, зони безпеки, пожежогасіння, медицина."], ["Інструктор вставляє яскраву анімацію лише «для ефекту». Який принцип використання ТЗН порушено?", ["Цілеспрямованість — засіб служить меті, а не ефекту", "Простота", "Візуалізація складного", "Поєднання з традиційними методами"], "Цілеспрямованість: засіб служить меті, а не для ефекту."], ["Що інструктор зобов’язаний робити з матеріалами, підготовленими за допомогою ШІ?", ["Перевіряти зміст на відповідність керівним документам", "Використовувати без змін", "Не використовувати взагалі", "Позначати як неофіційні"], "Цифрові засоби з ШІ допомагають, але інструктор завжди перевіряє зміст на відповідність керівним документам."], ["Що з переліченого входить до вимоги «військова специфіка» навчальних матеріалів?", ["Офіційна термінологія і правила роботи з інформацією обмеженого доступу", "Яскравий дизайн", "Максимальний обсяг тексту", "Використання жаргону"], "Військова специфіка: офіційна термінологія, правила роботи з обмеженою інформацією, посилання на документи, оновлення."]]}, {"id": "b1m2t4z6", "code": "Б1 М2 Т4 З6", "theme": "Тема 4. Організація та проведення занять", "title": "Техніка постановки та відповіді на питання. Уникнення конфліктів", "short": "Техніка питань", "passport": {"goal": "Ознайомити з технікою постановки інструктором питань курсантам, технікою відповіді на питання і реагування на недоцільні запитання; довести способи уникнення конфліктів та зриву занять.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Необхідність проведення опитування", "Техніка постановки запитань", "Техніка відповіді і реагування на недоцільні запитання", "Способи уникнення конфліктів і зриву занять"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.6; презентація; тест за темою"}, "sections": [{"h": "Навіщо опитування", "body": [["p", "Опитування — найпоширеніший спосіб перевірки знань. Воно виконує три функції:"], ["ul", ["<b>перевірка знань</b> — чи засвоїли курсанти матеріал;", "<b>навчання</b> — додатковими запитаннями інструктор підводить курсанта до правильної відповіді;", "<b>максимальна активність</b> — коли ставиться питання, кожен має бути готовий відповісти."]]]}, {"h": "Техніка APPLE", "body": [["p", "Послідовність дій інструктора — техніка <b>APPLE</b>:"], ["ul", ["<b>Ask — запитання</b>: озвучити питання для всієї аудиторії, щоб кожен почав думати;", "<b>Pause — пауза</b>: 3–5 секунд на обдумування;", "<b>Pick — призначення</b>: обрати, хто відповідає (бажаючий, випадково, пряме звернення до пасивного чи найактивнішого);", "<b>Listen — вислухати відповідь</b>: уважно, не перебиваючи; якщо відповідь не по темі — повторити запитання;", "<b>Evaluate — оцінити</b>: відзначити правильне, тактовно виправити помилку. Неправильна відповідь — дати виправитися самому, призначити іншого, попросити повторити правильну відповідь."]], ["key", "Спочатку питання всім, потім пауза, потім ім’я. Якщо назвати курсанта першим — решта перестане думати."]]}, {"h": "Як правильно ставити запитання", "body": [["p", "Запитання мають бути зрозумілими, короткими, однозначними, по темі, починатися з питального слова (хто, що, коли, як) і стимулювати мислення. Ставте їх у правильній послідовності."], ["ul", ["чергуйте способи вибору відповідаючого — це тримає в напрузі всіх;", "створюйте атмосферу, де курсанти не бояться помилитися;", "уточнюйте або просіть перефразувати нечітку відповідь;", "якщо курсант явно не знає — не затримуйтеся, переадресуйте питання іншому;", "допомагайте простішим навідним запитанням."]], ["warn", "Не ставте двозначних запитань і запитань про навички. Навичку не перевірити словами — лише практикою."]]}, {"h": "Як відповідати на запитання курсантів", "body": [["p", "Інструктор заохочує курсантів ставити запитання. Курсанти можуть питати після вступної частини, після кожного навчального питання, після основної і заключної частин або в будь-який момент — як визначив інструктор."], ["p", "Почувши питання, інструктор спочатку вирішує: <b>чи доречне воно?</b> і <b>чи знаю я відповідь?</b>"], ["ul", ["<b>Доречне питання</b> — можна переадресувати класу: так перевіряється розуміння і зростає активність.", "<b>Правильне, але не по темі</b> — похвалити за питання і пояснити, що його розглянуть окремо.", "<b>Підступне, щоб підірвати авторитет</b> — це порушення дисципліни; за ДМ на нього реагують негайно, як на порушення.", "<b>Не знаєте відповіді</b> — ніколи не блефуйте. Визнайте, що не знаєте, з’ясуйте і повідомте на наступному занятті."]], ["key", "Блеф курсанти розпізнають швидко — і авторитет втрачено. Чесне «з’ясую і відповім» його зберігає."]]}, {"h": "Конфлікти і зрив заняття", "body": [["p", "<b>Перебивання і порушення.</b> Зберігайте спокій — без крику й агресивних жестів. Спокійно і прямо вкажіть на неприпустимість дій і поясніть чому: «Прошу не перебивати, коли я пояснюю», «Ваша розмова заважає іншим». Запропонуйте висловитися пізніше — після пояснення чи на перерві. Швидко поверніться до матеріалу. Якщо повторюється — особиста розмова після заняття: з’ясувати причини, окреслити очікування, за потреби задокументувати."], ["p", "<b>Проблемні курсанти.</b> Якщо курсант вимагає уваги до своєї проблеми — покажіть, що розумієте, але навчальний час на це не витрачайте; поговоріть після заняття. Курсанти з негативним ставленням, які ставлять провокаційні питання, — порушники дисципліни. Того, хто нав’язує свою думку як єдину правильну, нагадайте: він не говорить від імені всіх."], ["p", "<b>Неадекватна поведінка.</b> Якщо один постійно перебиває іншого — дайте висловитися тому, кого перебивають, а першому пообіцяйте чергу. Якщо двоє сперечаються чи кричать — голосно назвіть їх на ім’я, покажіть, що розумієте обидві позиції, і поверніться до теми. Втручайтеся, лише якщо суперечка заважає заняттю."], ["p", "Якщо з якимось курсантом ніхто не хоче працювати — формуйте групи самі, міняйте склад по черзі і уникайте пар: краще трійки."], ["warn", "Курсанти не повинні бачити у вас злості чи розгубленості. Ваша спокійна реакція — приклад для всіх."]]}], "keys": ["Опитування: перевірка знань, навчання, активність.", "APPLE: запитання — пауза (3–5 с) — призначення — відповідь — оцінка.", "Не ставити двозначних запитань і питань про навички.", "Не знаєте відповіді — не блефувати, з’ясувати і повідомити.", "Конфлікт: спокій, чітка вимога, перенести розмову, швидко повернутися до теми."], "test": [["Інструктор каже: «Сидоренко, які п’ять правил поводження зі зброєю?» Яку помилку техніки APPLE він зробив?", ["Назвав курсанта до питання — решта перестала думати", "Поставив занадто складне питання", "Не зробив висновку", "Помилки немає"], "Спочатку питання всім, потім пауза, потім ім’я — інакше решта перестає думати."], ["Скільки секунд триває пауза в техніці APPLE?", ["3–5 секунд", "1 секунда", "10–15 секунд", "Пауза не потрібна"], "Pause — 3–5 секунд на обдумування."], ["Яка правильна послідовність APPLE?", ["Ask → Pause → Pick → Listen → Evaluate", "Pick → Ask → Listen → Pause → Evaluate", "Ask → Pick → Pause → Evaluate → Listen", "Pause → Ask → Pick → Evaluate → Listen"], "APPLE: запитання, пауза, призначення, вислухати, оцінити."], ["Курсант відповідає не по темі. Що за технікою APPLE робить інструктор на етапі Listen?", ["Повторює запитання", "Одразу перебиває і виправляє", "Ставить «незадовільно»", "Пропускає і йде далі"], "Listen: уважно, не перебиваючи; якщо відповідь не по темі — повторити запитання."], ["Які три функції виконує опитування?", ["Перевірка знань, навчання, максимальна активність", "Контроль, покарання, оцінка", "Мотивація, дисципліна, звітність", "Повторення, тестування, атестація"], "Функції опитування: перевірка знань, навчання (навідні питання), активність усіх."], ["Інструктор питає: «Хто вміє швидко перезарядити автомат?» Що не так?", ["Навичку не перевірити словами — лише практикою", "Питання задовге", "Треба назвати курсанта першим", "Нічого"], "Не ставте запитань про навички — навичку перевіряють практикою."], ["Курсант явно не знає відповіді і мовчить. Як діє інструктор?", ["Не затримується — переадресовує питання іншому або дає навідне", "Чекає, поки відповість", "Публічно соромить", "Ставить оцінку і переходить до теми"], "Якщо курсант явно не знає — не затримуйтеся, переадресуйте іншому або допоможіть навідним."], ["Курсант поставив доречне питання по темі. Який варіант реакції рекомендовано, щоб перевірити розуміння групи?", ["Переадресувати питання класу", "Відповісти коротко й одразу", "Перенести на перерву", "Проігнорувати"], "Доречне питання можна переадресувати класу — так перевіряється розуміння і зростає активність."], ["Питання цікаве, але не по темі заняття. Як правильно відреагувати?", ["Похвалити за питання і пояснити, що його розглянуть окремо", "Зробити зауваження", "Детально відповісти, змістивши план", "Не реагувати"], "Правильне, але не по темі — похвалити і сказати, що розглянемо окремо."], ["Курсант ставить підступне питання, щоб підірвати авторитет інструктора. Як його класифікує ДМ?", ["Як порушення дисципліни — реагують негайно", "Як доречне питання", "Як ознаку зацікавленості", "Як привід для дискусії"], "Підступне питання для підриву авторитету — порушення дисципліни, реагують негайно."], ["Інструктор не знає відповіді на питання курсанта. Що робити?", ["Чесно визнати, з’ясувати і відповісти на наступному занятті", "Відповісти приблизно, щоб не втратити авторитет", "Сказати, що питання не по темі", "Перевести на іншу тему"], "Ніколи не блефуйте: блеф швидко розпізнають, а чесне «з’ясую» зберігає авторитет."], ["Курсант перебиває інструктора під час пояснення. Яка реакція правильна?", ["Спокійно вказати на неприпустимість, пояснити чому, запропонувати висловитися пізніше", "Підвищити голос", "Ігнорувати до кінця заняття", "Вигнати з класу"], "Без крику: спокійно вказати, пояснити, запропонувати висловитися пізніше і повернутися до матеріалу."], ["Двоє курсантів голосно сперечаються і заважають заняттю. Що робить інструктор?", ["Голосно називає їх на ім’я, показує розуміння обох позицій і повертає до теми", "Чекає, поки самі заспокояться", "Карає обох", "Підтримує одного з них"], "Назвати на ім’я, показати розуміння обох позицій і повернутися до теми; втручатися, якщо суперечка заважає заняттю."], ["З одним курсантом ніхто не хоче працювати. Як формувати групи?", ["Самому, міняючи склад по черзі; краще трійки, ніж пари", "Дозволити курсантам обрати самим", "Залишити його працювати одного", "Ставити його з найкращим у пару"], "Формуйте групи самі, міняйте склад по черзі і уникайте пар — краще трійки."], ["Курсант вимагає уваги до своєї особистої проблеми під час заняття. Як діяти?", ["Показати розуміння, але поговорити після заняття", "Зупинити заняття і вирішити", "Різко відмовити", "Передати командиру роти"], "Покажіть, що розумієте, але навчальний час на це не витрачайте — поговоріть після заняття."]]}, {"id": "b1m2t4z7", "code": "Б1 М2 Т4 З7", "theme": "Тема 4. Організація та проведення занять", "title": "Застосування невербальних методів спілкування під час заняття", "short": "Невербальне спілкування", "passport": {"goal": "Ознайомити військовослужбовців з принципами застосування інструктором невербальних методів спілкування під час проведення занять.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Важливість невербальних методів спілкування", "Принципи їх застосування інструктором", "Жести і міміка: що застосовувати, чого уникати", "Правила контролю жестикуляції та міміки"], "assess": "Усне опитування індивідуально протягом і в кінці заняття.", "criteria": "Позитивно — якщо знає принципи застосування невербальних методів спілкування.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.7; презентація"}, "sections": [{"h": "Що таке невербальне спілкування", "body": [["p", "Спілкування буває вербальним (словесним, від латинського «вербум» — слово) і невербальним. Невербальне спілкування — система немовних знаків: міміка, жести, хода, поза, простір, одяг. Воно доповнює мову, показує емоційний стан і створює психологічний контакт."], ["p", "За дослідженнями, від 60 до 80% комунікації відбувається невербально. Австралійський фахівець Аллан Піз оцінює: словами передається 7% інформації, звуком (тон, інтонація) — 38%, мімікою, жестами, позою — 55%."], ["ul", ["<b>Міміка</b> — рухи м’язів обличчя, головний показник почуттів, включно з контактом очей.", "<b>Жести</b> — рухи рук і голови, що передають психічний стан.", "<b>Хода</b> — ритм і динаміка кроку, за якими можна судити про самопочуття і характер.", "<b>Поза</b> — положення тіла; показує, як людина сприймає свій статус серед інших."]]]}, {"h": "Чому це важливо інструктору", "body": [["ul", ["словами передаються факти, а почуття часто — лише невербально;", "володіння невербальною мовою показує, наскільки ви володієте собою;", "невербальні сигнали спонтанні й мало контрольовані, тому рідко брешуть: навіть коли слова зважені, почуття «просочуються» через жести й інтонацію."]], ["key", "Курсанти читають ваше тіло раніше, ніж чують слова. Якщо слова і жести розходяться — вірять жестам."]]}, {"h": "Принципи застосування", "body": [["ul", ["<b>Усвідомленість</b> — кожен жест продуманий і підтримує сказане.", "<b>Відповідність контексту</b> — під час складного пояснення жести підкреслюють ключове, на підсумках — відкриті й підбадьорливі.", "<b>Конгруентність</b> — невербальне узгоджене зі словами, інакше виникає недовіра.", "<b>Контакт і залучення</b> — зоровий контакт з різними курсантами, відкриті пози.", "<b>Емоційна підтримка</b> — посмішка, кивок, доброзичливий погляд.", "<b>Регулювання темпу</b> — повільні жести підкреслюють важливе, енергійні — перехід до нового етапу.", "<b>Акцентування</b> — жест і зміна інтонації виділяють ключові поняття.", "<b>Дисципліна й увага</b> — строгий погляд, зміна пози повертають увагу без слів.", "<b>Самоконтроль</b> — без нервових і відволікаючих рухів.", "<b>Спостереження за аудиторією</b> — міміка й пози курсантів показують розуміння, втому чи нудьгу."]]]}, {"h": "Що робити і чого уникати", "body": [["p", "<b>Застосовувати:</b> зоровий контакт з усіма; посмішку; кивки на знак розуміння; відкриті жести долонями вгору; пряму поставу; легкий нахил уперед, коли слухаєте; жести, що ілюструють розмір, форму, напрямок; помірні рухи класом; вираз обличчя, що відповідає змісту."], ["p", "<b>Уникати:</b> блукаючого погляду або його відсутності; нахмурених брів і стиснутих губ; схрещених рук і ніг — це закритість; постукування пальцями і метушні; погляду на годинник; різких і надто частих жестів; монотонного обличчя; рухів-паразитів — почісування, поправляння одягу; рук у кишенях, гри з ручкою; ігнорування сигналів курсантів."], ["warn", "Схрещені руки, руки в кишенях, гра з ручкою, хаотична ходьба — окремий пункт оціночного листа «Позиція відносно курсантів»."]]}, {"h": "Як контролювати жести і міміку", "body": [["ul", ["<b>Записуйте себе на відео</b> і аналізуйте жести, міміку, позу.", "<b>Репетируйте перед дзеркалом.</b>", "<b>Відчувайте тіло</b> — напружені плечі, стиснуті кулаки, метушливі ноги.", "<b>Просіть зворотний зв’язок</b> у колег: які жести відволікали?", "<b>Плануйте жести</b> заздалегідь — розведення рук, вказівний жест; без різких рухів.", "<b>Контролюйте міміку</b> — доброзичливий і зацікавлений вигляд.", "<b>Тримайте нейтральну позу</b> — пряма постава, руки вздовж тіла або складені перед собою.", "<b>Ключові моменти</b> — особливо стежте за собою на початку, на переходах і на підсумках."]], ["p", "Допомагають «якорі» — фізична дія, що нагадує про контроль, наприклад розслабити плечі; кілька глибоких вдихів при нервозності; уявити себе впевненим перед виступом. Контроль не означає придушення — йдеться про свідоме використання сигналів."]]}], "keys": ["Невербальне спілкування: міміка, жести, хода, поза.", "За Пізом: слова — 7%, звук — 38%, міміка й жести — 55% інформації.", "Головний принцип — конгруентність: жести узгоджені зі словами.", "Застосовувати: зоровий контакт, посмішку, відкриті жести, пряму поставу.", "Уникати: схрещених рук, рук у кишенях, погляду на годинник, рухів-паразитів."], "test": [["За Алланом Пізом, яка частка інформації передається мімікою, жестами і позою?", ["55%", "7%", "38%", "80%"], "Піз: словами — 7%, звуком (тон, інтонація) — 38%, мімікою, жестами, позою — 55%."], ["Яку частку інформації за Пізом передають власне слова?", ["7%", "38%", "55%", "60%"], "Словами передається лише 7% інформації."], ["Інструктор каже «Я радий вашим запитанням», схрестивши руки і насупившись. Чому повірять курсанти?", ["Жестам — коли слова і жести розходяться, вірять жестам", "Словам — вони точніші", "Нічому", "Залежить від звання"], "Невербальні сигнали спонтанні й рідко брешуть; при розбіжності вірять жестам."], ["Як називається принцип узгодженості невербального зі словами?", ["Конгруентність", "Акцентування", "Усвідомленість", "Регулювання темпу"], "Конгруентність — невербальне узгоджене зі словами, інакше виникає недовіра."], ["Інструктор робить повільний жест, підкреслюючи важливе, а енергійний — переходячи до нового етапу. Який принцип?", ["Регулювання темпу", "Акцентування", "Самоконтроль", "Емоційна підтримка"], "Регулювання темпу: повільні жести — важливе, енергійні — перехід до нового етапу."], ["Курсанти почали шуміти; інструктор мовчки змінив позу і подивився суворо — стало тихо. Який принцип?", ["Дисципліна й увага", "Контакт і залучення", "Емоційна підтримка", "Конгруентність"], "Строгий погляд і зміна пози повертають увагу без слів."], ["Що з переліченого слід ЗАСТОСОВУВАТИ?", ["Відкриті жести долонями вгору і легкий нахил уперед, коли слухаєте", "Схрещені руки", "Погляд на годинник", "Руки в кишенях"], "Застосовувати: зоровий контакт, посмішку, кивки, відкриті жести, пряму поставу, нахил уперед."], ["Інструктор постійно поправляє одяг і грає ручкою. Як це називається і де перевіряється?", ["Рухи-паразити; окремий пункт оціночного листа «Позиція відносно курсантів»", "Акцентування; пункт «Методика»", "Емоційна підтримка; не перевіряється", "Регулювання темпу; пункт «Час»"], "Схрещені руки, руки в кишенях, гра з ручкою, хаотична ходьба — пункт «Позиція відносно курсантів»."], ["Що показує поза людини за матеріалом заняття?", ["Як людина сприймає свій статус серед інших", "Рівень її знань", "Її фізичну підготовку", "Її звання"], "Поза — положення тіла; показує, як людина сприймає свій статус серед інших."], ["Що є головним показником почуттів людини?", ["Міміка, включно з контактом очей", "Хода", "Одяг", "Жести рук"], "Міміка — рухи м’язів обличчя, головний показник почуттів."], ["Чому невербальні сигнали «рідко брешуть»?", ["Вони спонтанні й мало контрольовані", "Їх неможливо побачити", "Вони завжди позитивні", "Вони вивчаються в школі"], "Невербальні сигнали спонтанні, тому почуття «просочуються» навіть при зважених словах."], ["Який спосіб контролю жестів рекомендовано першим у списку?", ["Записувати себе на відео й аналізувати", "Тримати руки за спиною", "Не рухатися взагалі", "Читати з конспекту"], "Записуйте себе на відео і аналізуйте жести, міміку, позу."], ["У які моменти заняття особливо стежити за своєю невербалікою?", ["На початку, на переходах і на підсумках", "Лише під час опитування", "Лише на перерві", "Лише в середині заняття"], "Ключові моменти: по
