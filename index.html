:root{
  --bg:#10130D;--bg2:#151A11;--paper:#1B2116;--soft:#222A1C;--line:#2F3926;--line2:#3E4A32;
  --ink:#ECE7D6;--muted:#A7A992;--dim:#7D806B;
  --acc:#F2A33A;--acc-soft:rgba(242,163,58,.12);--onacc:#14180F;--glow:0 0 0 1px rgba(242,163,58,.35),0 6px 22px rgba(242,163,58,.18);
  --amb:#F2A33A;--hl:rgba(242,163,58,.10);--hl-bar:#F2A33A;--blue:#6FB3E6;
  --ok:#8FCB6A;--okbg:rgba(143,203,106,.12);--bad:#E5573D;--badbg:rgba(229,87,61,.12);
  --shadow:none;--r:10px;
  --f-display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --f-head:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17.5px;line-height:1.58;min-height:100vh;
  background-image:linear-gradient(rgba(236,231,214,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(236,231,214,.03) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--f-head)}
/* --- інтерактив: легке підсвічування й анімація при наведенні --- */
.fx{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s,background-color .18s}
.fx:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(242,163,58,.16),transparent);transform:skewX(-18deg);opacity:0;transition:none}
@media (hover:hover){
 .fx:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc);box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(242,163,58,.22)}
 .fx:hover:not(:disabled):after{opacity:1;left:120%;transition:left .65s ease,opacity .2s}
}
.fx:active:not(:disabled){transform:translateY(0) scale(.985)}
@media (prefers-reduced-motion:reduce){.fx,.fx:after{transition:none!important}.fx:hover{transform:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.mark{width:36px;height:36px;flex:none;display:grid;place-items:center}
.mark svg{width:36px;height:36px}
.brand b{display:block;font-family:var(--f-head);font-size:17px;font-weight:700;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.dl{position:relative}
.ib.dl .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--amb);display:none}
.ib.dl.need .dot{display:block}
.ib.dl.ok{color:var(--ok)}

/* cards / generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.off{margin:18px 0 0;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.off .oi{width:52px;height:52px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.off .oi svg{width:28px;height:28px}
.off .ot{flex:1;min-width:220px}
.off .ot b{display:block;font-size:18px;line-height:1.3}
.off .ot span{font-size:14px;color:var(--muted)}
.off .oa{display:flex;gap:8px;flex-wrap:wrap}
.off.done .oi{background:var(--okbg);color:var(--ok)}
.pbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* modal */
.mback{position:fixed;inset:0;z-index:50;background:rgba(2,6,12,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadeIn .15s}
@media (min-width:640px){.mback{align-items:center}}
.modal{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);max-height:90vh;overflow:auto;animation:up .2s}
.modal h2{font-size:22px;line-height:1.25;margin-bottom:6px}
.modal p{color:var(--muted);font-size:15px}
.modal .qr{background:#fff;border-radius:16px;padding:16px;margin:16px auto;width:min(300px,100%)}
.modal .qr svg{width:100%;height:auto;display:block}
.modal .url{font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:clamp(12px,3.4vw,15px)}
.modal .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .mrow .btn{flex:1;min-width:140px}
.modal ol{padding-left:22px;margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.modal .x{float:right;margin:-8px -8px 0 0}
@keyframes fadeIn{from{opacity:0}}
@keyframes up{from{transform:translateY(20px);opacity:.5}}
@keyframes blink{50%{opacity:0}}
/* home */
.hero{padding:30px 0 8px}
.hero .eyebrow:before{content:"";display:inline-block;width:22px;height:2px;background:var(--acc);vertical-align:middle;margin-right:10px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,12vw,92px);line-height:.95;letter-spacing:.02em;margin:12px 0 10px;text-transform:uppercase}
.hero h1 .cur{color:var(--acc)}
.hero p{color:var(--muted);max-width:620px}
.hero .lead{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:-2px 0 10px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.stat{padding:14px 16px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--acc)}
.stat b{display:block;font-family:var(--f-head);font-size:28px;font-weight:700;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.btn{height:48px;padding:0 20px;border-radius:8px;font-family:var(--f-head);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:0 3px 0 #a86a1c}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{height:38px;padding:0 14px;font-size:15px;border-radius:10px}
.btn svg{width:18px;height:18px}
.note{margin-top:14px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--ink)}
.mod{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
.mod h2{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mod:after{content:"";flex:1;height:1px;background:var(--line)}
.blockh{margin:36px 0 4px;font-family:var(--f-head);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-left:4px solid var(--acc);padding-left:12px}
.blockh small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;font-weight:400;color:var(--dim);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.row:hover:not(:disabled) .num{background:var(--acc);color:var(--onacc)}
.row .go{flex:none;color:var(--dim);font-size:22px;transition:transform .18s,color .18s}
.row:hover:not(:disabled) .go{transform:translateX(4px);color:var(--acc)}
.num{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .num{background:var(--acc);color:var(--onacc)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--f-head);font-size:18.5px;font-weight:600;line-height:1.22}
.row .t span{font-size:14px;color:var(--muted)}
.row .t .code{font-family:var(--f-mono);font-size:11px;color:var(--acc);letter-spacing:.08em}
.row.soon{opacity:.55;cursor:default;box-shadow:none;background:transparent;padding:8px 14px;border-style:dashed}
.row.soon .num{width:28px;height:28px;background:transparent}
.row.soon .t{display:flex;gap:10px;align-items:baseline}
.row.soon .t .code{flex:none;min-width:92px}
.row.soon .t b{font-weight:500;font-size:16px}
.list .row.soon+.row.soon{margin-top:-4px}
.row.tool .num{background:var(--acc-soft);color:var(--acc)}
.row.tool .num svg{width:20px;height:20px}
.badge{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--acc-soft);color:var(--acc)}
.badge.low{background:rgba(245,184,61,.14);color:var(--amb)}
.exam{margin-top:30px;border:1px solid var(--line2);border-top:3px solid var(--acc);background:var(--paper);border-radius:10px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.exam div{flex:1;min-width:220px}
.exam b{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;display:block}
.exam span{color:var(--muted);font-size:15px}
.foot .credits{display:flex;flex-direction:column;gap:3px}.foot .credits b{color:var(--ink);font-weight:600}
.foot{margin:36px 0 40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* topic */
.thead{padding:26px 0 6px}
.thead .eyebrow{display:block;margin-bottom:6px}
.thead h1{font-size:clamp(26px,5vw,38px);line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.thead p{color:var(--muted);font-size:15px;margin-top:6px}
.pass{margin-top:16px;padding:16px 18px}
.pass .goal{font-weight:600;line-height:1.45}
.pass .goal small,.pass dt{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.pass details{margin-top:10px}
.pass summary{cursor:pointer;color:var(--muted);font-size:15px;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.pass summary::-webkit-details-marker{display:none}
.pass summary:before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--acc);font-weight:800}
.pass details[open] summary:before{content:"–"}
.pass dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:12px;font-size:15px}
.pass dl div.w{grid-column:1/-1}
.pass dd ol{padding-left:20px}
@media (max-width:560px){.pass dl{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tab{height:40px;padding:0 18px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--acc);color:var(--onacc)}
.lec{padding-bottom:150px}
.sec{margin-top:30px}
.sec h2{font-size:24px;line-height:1.2;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px;scroll-margin-top:90px}
.blk{border-radius:10px;padding:6px 12px;margin:0 -12px 6px;transition:background .25s;cursor:pointer;scroll-margin-top:110px;position:relative}
.blk:hover{background:var(--soft)}
.blk.now{background:var(--hl)}
.blk.now:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--hl-bar)}
.sec ul{list-style:none;margin:2px 0 8px}
.sec li.blk{padding-left:34px}
.sec li.blk:after{content:"";position:absolute;left:14px;top:.85em;width:8px;height:8px;background:var(--acc)}
.sec li.blk.now:before{left:0}
.callout{background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:14px 16px;margin:8px 0 10px;font-weight:500}
.callout small{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.callout.warn{background:#231A12;border-color:#4A3A1E;border-left-color:var(--bad)}
.callout.warn small{color:var(--bad)}
.keys{margin-top:40px;padding:20px 22px}
.keys{border-top:3px solid var(--acc)}
.keys h2{font-size:21px;margin-bottom:10px;text-transform:uppercase}
.keys ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.keys .btn{margin-top:16px}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.pl{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:10px 12px 12px}
.pl .bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;cursor:pointer;margin:2px 4px 8px}
.pl .bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px}
.pl .ctr{display:flex;align-items:center;gap:6px}
.play{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none;transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play svg{width:24px;height:24px}
.pl .info{flex:1;min-width:0;padding:0 6px}
.pl .info b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .info span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spd{height:36px;min-width:52px;padding:0 10px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* test */
.quiz{padding:10px 0 60px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.qprog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:22px}
.qprog i{display:block;height:100%;background:var(--acc)}
.qtext{font-family:var(--f-head);font-size:clamp(22px,4vw,28px);line-height:1.25;font-weight:600;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:13px 14px;line-height:1.4;transition:border-color .12s}
.opt{transition:border-color .15s,transform .15s,background-color .15s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(3px);background:var(--soft)}
.opt:hover:not(:disabled) .k{background:var(--acc);color:var(--onacc)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#04130C}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#1A0606}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);color:var(--onacc)}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:4px solid;line-height:1.45}
.verdict.ok{border-color:var(--ok);background:var(--okbg)}
.verdict.no{border-color:var(--bad);background:var(--badbg)}
.verdict b{display:block;margin-bottom:2px}
.qnext{margin-top:18px;display:flex;justify-content:flex-end}
.qvoice{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.res{text-align:center;padding:30px 0 10px}
.ring{width:150px;height:150px;margin:6px auto 12px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-family:var(--f-head);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .v span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grade{font-family:var(--f-head);font-size:26px;font-weight:700;text-transform:uppercase}
.res p{color:var(--muted);margin-top:4px}
.res .cta{justify-content:center}
.mist{margin-top:30px;text-align:left}
.mist h3{font-size:18px;margin-bottom:10px}
.mi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.mi b{display:block;line-height:1.35}
.mi .ans{color:var(--ok);font-weight:600;margin-top:6px}
.mi .ex{color:var(--muted);font-size:15px;margin-top:4px}
.mi .tp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.bytopic{margin-top:22px;text-align:left}
.bt{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bt span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* нагорода: патрон / віджимання */
.rw-card{max-width:440px;margin:0 auto 10px;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.rw-card svg{display:block;width:100%;height:auto}
.rw-verdict{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:6px 0 4px}
.rw-verdict.ok{color:var(--acc)}.rw-verdict.no{color:var(--bad)}
/* оціночний лист */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.seg button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;color:var(--muted)}
.seg button{transition:border-color .15s,color .15s,transform .15s}
.seg button:hover{border-color:var(--acc);color:var(--ink);transform:translateY(-1px)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.how{margin:14px 0 4px;padding:16px 18px}
.how summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.how summary::-webkit-details-marker{display:none}
.how summary .q{width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.how summary .ch{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
@media (max-width:560px){.how summary .ch{display:none}}
.how .hb{margin-top:12px;font-size:16px;display:flex;flex-direction:column;gap:12px}
.how .scale{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.how .scale b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:16px}
.how .scale span{padding-top:5px}
.how .rule{border-left:3px solid var(--bad);padding:2px 0 2px 12px}
.how .rule ul{padding-left:20px;margin-top:4px}
.how .ex{font-size:15px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.fields label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.fields input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.grp{margin-top:26px}
.grp h3{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.crit{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:8px}
.crit .ct{flex:1;min-width:0}
.crit .ct b{display:block;line-height:1.3}
.crit .ct b .st{color:var(--amb);font-size:13px;font-weight:700;margin-left:6px;white-space:nowrap}
.crit .ct span{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.crit.zero{border-color:var(--bad)}
.crit.star.zero{background:var(--badbg)}
.sc{display:flex;gap:4px;flex:none}
.sc button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line2);background:var(--soft);font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);transition:transform .12s,border-color .12s,color .12s}
.sc button:hover{transform:translateY(-2px);border-color:var(--acc);color:var(--ink)}
.sc button.on[data-v="3"]{background:var(--ok);border-color:var(--ok);color:#04130C}
.sc button.on[data-v="2"]{background:var(--blue);border-color:var(--blue);color:#0B1620}
.sc button.on[data-v="1"]{background:var(--amb);border-color:var(--amb);color:#1A1203}
.sc button.on[data-v="0"]{background:var(--bad);border-color:var(--bad);color:#1A0606}
@media (max-width:560px){.crit{flex-direction:column}.sc{align-self:stretch}.sc button{flex:1;height:44px}}
.flags{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.flag input{width:22px;height:22px;accent-color:var(--bad);flex:none}
.flag span{font-weight:600}
.flag small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.sumbar{position:sticky;bottom:0;z-index:15;margin:24px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sumbar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sumbar .avg{font-family:var(--f-head);font-size:32px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
.sumbar .meta{flex:1;min-width:150px;font-size:14px;color:var(--muted);line-height:1.35}
.vchip{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 14px;border-radius:8px;font-size:16px;white-space:nowrap}
.vchip.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.vchip.no{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.vchip.wait{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.reasons{font-size:14px;color:var(--bad);margin-top:6px}
/* тренажери */
.tr{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.fld{padding:14px 16px}
.fld label{display:block;font-weight:700;margin-bottom:2px}
.fld .hint{font-size:14px;color:var(--muted);margin-bottom:8px}
.fld textarea{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:10px 12px;resize:vertical;line-height:1.45}
.chk{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.chk li{display:flex;gap:8px;align-items:flex-start}
.chk li i{flex:none;font-style:normal;font-weight:800;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;margin-top:1px}
.chk li.y i{background:var(--okbg);color:var(--ok)}
.chk li.n i{background:rgba(245,184,61,.15);color:var(--amb)}
.chk li.x i{background:var(--badbg);color:var(--bad)}
.scen{padding:16px 18px}
.scen h3{font-size:17px;margin:12px 0 6px}
.scen h3:first-child{margin-top:0}
.tl{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:10px}
.tl li b{font-family:var(--f-mono);color:var(--acc);font-size:14px;padding-top:1px}
.model{margin-top:10px;border-left:3px solid var(--ok);padding:6px 0 6px 12px;font-size:15px}
.model small{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.kp{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.kp input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}

@media (max-width:560px){
  body{font-size:17px}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:22px}
  .row{padding:12px;gap:12px}.num{width:34px;height:34px;font-size:13px}
  .hide-sm{display:none}
}


/* друк оціночного листа: A4, книжкова */
#printArea{display:none}
@page{size:A4 portrait;margin:10mm 10mm 12mm;@bottom-right{content:"Аркуш " counter(page) " з " counter(pages);font:8pt 'IBM Plex Sans',sans-serif;color:#555}}
.pdoc{font:9pt/1.3 'IBM Plex Sans',Arial,sans-serif;color:#000;background:#fff}
.pdoc .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.pdoc .pk{font:8pt 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.pdoc h1{font:700 15pt 'Fira Sans Condensed',Arial;text-transform:uppercase;margin:2px 0}
.pdoc .pt{font-size:10pt}
.pdoc .plogo .emb{--s:58px}
.pdoc .pfs{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:6px}
.pdoc .pf{display:flex;gap:6px;align-items:baseline;font-size:8.5pt}
.pdoc .pf span{white-space:nowrap;color:#333}
.pdoc .pf b{flex:1;border-bottom:1px solid #000;font-weight:600;min-height:14px;padding-left:4px}
.pdoc .pleg,.pdoc .prule,.pdoc .prs{font-size:8pt;margin:4px 0}
.pdoc table{width:100%;border-collapse:collapse}
.pdoc .pt1 th{background:#e6e6e6;border:1px solid #000;padding:3px;font-size:8.5pt}
.pdoc .pt1 td{border:1px solid #000;padding:1.5px 4px;vertical-align:top;line-height:1.2}
.pdoc .pt1 tr{break-inside:avoid}
.pdoc .pt1 thead{display:table-header-group}
.pdoc .pg td{background:#f0f0f0;font:700 8.5pt 'Fira Sans Condensed',Arial;text-transform:uppercase;letter-spacing:.04em}
.pdoc .pn{width:22px;text-align:center}
.pdoc .ps{width:24px;text-align:center;vertical-align:middle!important}
.pdoc .pd{font-size:7.2pt;color:#333;line-height:1.18}
.pdoc .pb{display:inline-block;width:11px;height:11px;border:1px solid #000;line-height:10px;font-size:9pt;font-weight:700;text-align:center;vertical-align:middle}
.pdoc .pfl{margin:6px 0;font-size:8.5pt}
.pdoc .pt2{margin-top:4px;break-inside:avoid}
.pdoc .pt2 td{border:1px solid #000;padding:4px 6px;font-size:9pt;width:25%}
.pdoc .psig{display:flex;justify-content:space-between;gap:20px;margin-top:12px;font-size:8.5pt;break-inside:avoid}
.pdoc .emb,.pdoc .emb *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdoc .pg td,.pdoc th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
 :root{color-scheme:light!important}
 html,body{background:#fff!important;background-image:none!important;color:#000}
 main,header,.player{display:none!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
}

/* нормативні документи */
.hdoc{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);color:var(--ink);font-family:var(--f-head);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:14px;flex:none}
.hdoc svg{width:20px;height:20px;color:var(--acc)}
.hdoc:hover{border-color:var(--acc)}
@media (max-width:560px){.hdoc span{display:none}.hdoc{padding:0 10px}}
.dsearch{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 14px;margin:14px 0 4px;font-size:16px}
.dtoc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.dtoc a{font-size:13.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
.dtoc a:hover{border-color:var(--acc);color:var(--ink)}
.dsec{margin-top:26px;scroll-margin-top:76px}
.dsec>h2{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.03em;font-size:20px;display:flex;align-items:center;gap:10px}
.dsec>h2 .n{font-family:var(--f-mono);font-size:12px;color:var(--dim);font-weight:400}
.dsec>p{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.doc{display:flex;gap:14px;align-items:center;padding:12px 14px;margin-bottom:8px}
.doc .di{width:40px;height:48px;flex:none;border-radius:6px;background:var(--soft);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--acc);font-weight:700}
.doc .dt{flex:1;min-width:0}
.doc .dt b{display:block;line-height:1.3}
.doc .dt span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.doc .dt small{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
.doc .da{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.doc .da a,.doc .da button{height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.doc .da a:hover,.doc .da button:hover{border-color:var(--acc)}
.doc .da .pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
@media (max-width:720px){.doc{flex-wrap:wrap}.doc .da{width:100%;justify-content:flex-start}.doc .di{display:none}}

.cmap{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:18px 0 0}
.cmap a{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}
.cmap a b{font-family:var(--f-head);font-size:20px;color:var(--acc);line-height:1}
.cmap a:hover{border-color:var(--acc);color:var(--ink)}
@media (max-width:560px){.cmap{grid-template-columns:repeat(3,1fr)}}
.blockh{scroll-margin-top:76px}
.pr-sec{margin-top:22px}
.pr-sec h2{font-family:var(--f-head);text-transform:uppercase;font-size:18px;letter-spacing:.03em;margin-bottom:8px}
.pr-sec ol{margin:0 0 0 20px}.pr-sec li{margin:6px 0;line-height:1.5}
.pr-links{display:flex;flex-wrap:wrap;gap:8px}
/* emblem + 3D word */
.emb{--s:104px;width:var(--s);height:var(--s);border-radius:50%;background:linear-gradient(#2F7FE0 50%,#FFD500 50%);display:grid;place-items:center;flex:none}
.emb>i{width:calc(var(--s)*.885);height:calc(var(--s)*.885);border-radius:50%;background:var(--bg);display:grid;place-items:center}
.emb>i>i{width:calc(var(--s)*.805);height:calc(var(--s)*.805);border-radius:50%;background:#1B2116;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center}
.emb svg{height:calc(var(--s)*.69);width:calc(var(--s)*.354);fill:#ECE7D6;display:block}
.mark .emb{--s:38px}
.mark .emb>i>i{box-shadow:none}
.hero .brandrow{display:flex;align-items:center;gap:22px;margin:14px 0 14px}
.hero h1.kh{margin:0;flex:1;min-width:0;max-width:404px;line-height:0}
.kword{width:100%;height:auto;display:block;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.hero .brandrow{gap:14px}.hero .brandrow .emb{--s:74px}}
/* sheet guide */
.steps{counter-reset:st;display:grid;gap:10px;margin:16px 0 4px;padding:16px 18px}
.steps h2{font-family:var(--f-head);text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.steps ol{list-style:none;display:grid;gap:10px;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.45}
.steps li:before{counter-increment:st;content:counter(st);flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc);color:var(--onacc);font-weight:800;display:grid;place-items:center;font-family:var(--f-head)}
.steps .tip{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:10px}
.tdesc{font-size:14.5px;color:var(--muted);margin:8px 0 0}
.grp h3 .gp{color:var(--dim);letter-spacing:.04em}
.grp h3 .gp.done{color:var(--ok)}
.final{margin-top:18px;padding:16px 18px}
.final h2{font-family:var(--f-head);text-transform:uppercase;font-size:18px;letter-spacing:.03em;margin-bottom:6px}
.final p{font-size:15.5px;margin:6px 0}
.final ul{margin:6px 0 0 18px;font-size:15px}
.final li{margin:3px 0}
.final li b{font-variant-numeric:tabular-nums}
</style>

<body>

ального взводу (старший інструктор) керує процесом: безпека, зв’язок, ротація груп."], ["Хто в роті визначає цілі, взаємодіє зі штабом і приймає фінальні іспити?", ["Командир роти", "Головний сержант роти", "Сержант-інструктор взводу", "Головний сержант навчального центру"], "Командир роти — стратег і арбітр: цілі, взаємодія зі штабом, фінальні іспити, стандарти."], ["У роті інструктори по-різному проводять ранкову перевірку зброї. Хто має запровадити єдину процедуру (SOP)?", ["Головний сержант роти", "Командир роти особисто", "Кожен командир взводу окремо", "Начальник штабу батальйону"], "Головний сержант роти — майстер і наставник: контролює інструкторів і впроваджує єдині стандарти SOP."], ["Що з переліченого НЕ є обов’язком головного сержанта взводу?", ["Приймати фінальні іспити роти", "Проводити АПД", "Розробляти документацію", "Заміщати командира взводу"], "Фінальні іспити — рівень командира роти. Головний сержант взводу проводить АПД, розробляє документацію, заміщає командира."], ["Військова частина має управління і три навчальні центри в підпорядкуванні. Як вона називається?", ["Об’єднаний навчальний центр", "Тренувальний центр", "Школа підготовки спеціалістів", "Навчальний батальйон"], "Об’єднаний навчальний центр — управління і щонайменше три навчальні центри у підпорядкуванні."], ["Школа снайперів у складі навчального центру — це що?", ["Структурний підрозділ НЦ", "Окрема військова частина", "Об’єднаний навчальний центр", "Тренувальний центр"], "Школа підготовки спеціалістів — структурний підрозділ навчального центру, наприклад школа снайперів чи інструкторів."], ["Сержант має контракт 6 років, 3 роки на посадах рівня відділення, ВОС «відмінно», фізпідготовку «задовільно». Чи відповідає він вимогам базового рівня?", ["Ні — фізпідготовка має бути не нижче «добре»", "Так, усі вимоги виконано", "Ні — контракт має бути від 8 років", "Ні — потрібно 500 навчальних годин"], "Базовий рівень: контракт від 5 років, від 2 років на посадах відділення, ВОС «відмінно», ан проведення заняття «Обов’язки інструктора»; обов’язки за статутом; функціональні обов’язки за наказом командира частини; презентація"}, "sections": [{"h": "За що відповідає інструктор", "body": [["p", "Інструктор (старший інструктор) навчального взводу в мирний і воєнний час відповідає за:"], ["ul", ["якість проведення занять та ефективність навчання особового складу;", "навчання і виховання рядового і сержантського складу;", "військову дисципліну, охайний зовнішній вигляд, фізичну підготовку;", "правильне зберігання й експлуатацію озброєння, техніки та майна взводу;", "внутрішній порядок і правильне несення служби в добовому наряді."]], ["p", "Інструктор підпорядковується командиру навчального взводу, а з питань навчання — сержанту-інструктору роти, і є <b>прямим начальником</b> для особового складу, який проходить навчання."]]}, {"h": "Головні обов’язки на заняттях", "body": [["ul", ["досконало знати і вміло володіти озброєнням і технікою, на яких навчає;", "здійснювати навчально-виховну й методичну діяльність, <b>об’єктивно оцінювати</b> знання та вміння курсантів;", "знати керівні документи з бойової підготовки, безпосередньо проводити заняття, застосовувати методи навчання, забезпечувати повноту виконання програм;", "домагатися якісного засвоєння матеріалу, за потреби — індивідуальні заняття з окремими військовослужбовцями;", "проводити додаткові заняття й консультації з тими, хто не встигає;", "постійно підвищувати свій професійний рівень і майстерність."]], ["key", "Інструктор — зразок бездоганного виконання службового обов’язку, дисципліни й організованості."]]}, {"h": "Безпека і порядок", "body": [["ul", ["вживати заходів щодо запобігання травматизму та загибелі особового складу, <b>особисто доводити заходи безпеки перед кожним заняттям</b> і контролювати їх дотримання;", "після занять і стрільб перевіряти, щоб у підлеглих не залишилося боєприпасів, гранат, запалів, вибухових речовин;", "перевіряти наявність особового складу, комплектність озброєння, боєприпасів, імітаційних засобів після занять; організовувати чищення зброї;", "не рідше одного разу на тиждень оглядати озброєння і майно;", "контролювати дисципліну, носіння форми, розпорядок дня;", "негайно доповідати командиру взводу і сержанту-інструктору про надзвичайні події."]], ["warn", "Перевірка на відсутність боєприпасів після занять і стрільб — обов’язок інструктора, а не формальність."]]}, {"h": "Турбота про людей", "body": [["ul", ["знати звання, ПІБ, дату народження, ділові та морально-психологічні якості, родинний стан, успіхи й недоліки кожного курсанта;", "піклуватися про підлеглих, ставитися з повагою, ніколи не принижувати честі та гідності;", "організовувати заходи зі зміцнення здоров’я і фізичної тренованості, своєчасно направляти хворих до медпункту;", "підтримувати морально-психологічний стан і згуртованість колективу;", "проводити індивідуально-виховну роботу, виховувати в сержантів гордість за належність до сержантського корпусу."]]]}, {"h": "Сержант-інструктор і старший інструктор", "body": [["p", "За наказом командира частини розподіл такий:"], ["p", "<b>Сержант-інструктор</b> — безпосередній начальник для інструкторів взводу: організовує їх якісну підготовку до занять, контролює заняття, надає методичну допомогу, розробляє навчально-методичні матеріали, веде облік підготовки групи, у відсутність командира взводу виконує його обов’язки."], ["p", "<b>Старший інструктор (інструктор)</b> — безпосередній начальник для перемінного складу: проводить заняття, оцінює курсантів, доводить заходи безпеки, проводить індивідуальні заняття."], ["key", "Самостійна підготовка до наступних занять: ознайомитися з обов’язками командира взводу."]]}], "keys": ["Інструктор — прямий начальник для курсантів.", "Підпорядкування: командир взводу, з навчання — сержант-інструктор роти.", "Об’єктивно оцінювати знання і вміння курсантів.", "Особисто доводити заходи безпеки перед кожним заняттям.", "Після занять — перевірка на відсутність боєприпасів.", "Знати кожного курсанта і поважати його гідність."], "test": [["Інструктор навчального взводу з питань навчання підпорядковується кому?", ["Сержанту-інструктору роти", "Командиру роти напряму", "Головному сержанту навчального центру", "Начальнику штабу батальйону"], "Інструктор підпорядковується командиру навчального взводу, а з питань навчання — сержанту-інструктору роти."], ["Для кого інструктор є прямим начальником?", ["Для особового складу, який проходить навчання", "Для інших інструкторів взводу", "Для сержанта-інструктора роти", "Лише для командирів відділень курсантів"], "Інструктор — прямий начальник для курсантів, яких навчає."], ["Після стрільб група здала зброю і готується йти на обід. Що інструктор зобов’язаний зробити ще до цього?", ["Перевірити, чи не лишилося в курсантів боєприпасів і запалів", "Перерахувати зброю і передати її черговому по роті", "Нічого — таку перевірку проводить черговий по роті", "Доповісти командиру роти про результати стрільб"], "Перевірка на відсутність боєприпасів після занять і стрільб — особистий обов’язок інструктора, а не формальність."], ["Як часто інструктор щонайменше оглядає озброєння і майно взводу?", ["Не рідше одного разу на тиждень", "Не рідше одного разу на місяць", "Лише перед польовими виходами", "Щодня перед вечірньою перевіркою"], "Інструктор оглядає озброєння і майно не рідше одного разу на тиждень."], ["Курсант двічі поспіль не склав норматив з розбирання автомата. Що з обов’язків інструктора відповідає цій ситуації?", ["Провести додаткове заняття або консультацію з ним", "Виставити «незадовільно» і перейти до нової теми", "Доповісти командиру роти і порушити питання відрахування", "Передати курсанта іншому, досвідченішому інструктору"], "Інструктор домагається засвоєння матеріалу і проводить додаткові заняття й консультації з тими, хто не встигає."], ["Хто особисто доводить заходи безпеки перед кожним заняттям?", ["Інструктор, який проводить заняття", "Командир роти на ранковому шикуванні", "Черговий по навчальному центру", "Відповідальний за полігон"], "Інструктор особисто доводить заходи безпеки перед кожним заняттям і контролює їх дотримання."], ["Під час заняття курсант отримав травму. Кому інструктор доповідає негайно?", ["Командиру взводу і сержанту-інструктору", "Лише черговому медпункту навчального центру", "Командиру бригади через черговця частини", "Нікому, якщо травма легка і без наслідків"], "Про надзвичайні події інструктор негайно доповідає командиру взводу і сержанту-інструктору."], ["Що інструктор має знати про кожного курсанта?", ["Звання, ПІБ, дату народження, якості, родинний стан, успіхи", "Лише звання, прізвище і номер військового квитка", "Лише результати тестів і нормативів за курс", "Медичну історію і попереднє місце служби"], "Інструктор знає про кожного звання, ПІБ, дату народження, якості, родинний стан, успіхи й недоліки."], ["Що з переліченого НЕ входить до сфери відповідальності інструктора?", ["Затвердження бюджету часу навчальної програми", "Внутрішній порядок і несення добового наряду", "Збереження та експлуатація озброєння взводу", "Фізична підготовка і зовнішній вигляд курсантів"], "Інструктор відповідає за якість занять, дисципліну, озброєння, порядок і наряд. Програму він не затверджує."], ["Хто розробляє навчально-методичні матеріали та веде облік підготовки групи?", ["Сержант-інструктор", "Старший інструктор", "Кожен курсант", "Командир роти"], "Сержант-інструктор організовує підготовку інструкторів, контролює заняття, розробляє методичні матеріали і веде облік."], ["Командир взводу у відпустці. Хто виконує його обов’язки за розподілом?", ["Сержант-інструктор", "Наймолодший інструктор", "Командир відділення курсантів", "Черговий по роті"], "У відсутність командира взводу його обов’язки виконує сержант-інструктор."], ["Для кого старший інструктор є безпосереднім начальником?", ["Для перемінного складу — курсантів", "Для сержанта-інструктора", "Для інструкторів інших взводів", "Для командира взводу"], "Старший інструктор (інструктор) — безпосередній начальник для перемінного складу: проводить заняття й оцінює курсантів."], ["Інструктор публічно висміяв курсанта за повільність. Який обов’язок він порушив?", ["Ставитися з повагою, не принижувати честі та гідності", "Перевіряти наявність особового складу після занять", "Оглядати озброєння і майно не рідше разу на тиждень", "Постійно підвищувати свій професійний рівень"], "Інструктор піклується про підлеглих, ставиться з повагою і ніколи не принижує їхньої честі та гідності."], ["Яка вимога до інструктора стосується його власного розвитку?", ["Постійно підвищувати професійний рівень і майстерність", "Раз на рік складати атестаційний іспит у ГШ", "Пройти курс академічного рівня протягом року", "Здобути вищу освіту за заочною формою"], "Серед головних обов’язків — постійно підвищувати свій професійний рівень і майстерність."], ["Курсант скаржиться на гарячку перед польовим виходом. Як діє інструктор?", ["Своєчасно направляє його до медпункту", "Залишає у строю до кінця дня", "Звільняє від занять без огляду", "Доповідає лише ввечері"], "Інструктор організовує зміцнення здоров’я та своєчасно направляє хворих до медпункту."]]}, {"id": "b1m1t2z1", "code": "Б1 М1 Т2 З1", "theme": "Тема 2. Керівні документи, що регламентують діяльність інструкторського складу", "title": "Основні керівні документи з підготовки у ЗСУ", "short": "Керівні документи", "passport": {"goal": "Ознайомити курсантів з основними керівними документами з бойової підготовки у ЗСУ, що використовуються при плануванні та організації навчально-виховного процесу.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція; аудиторія", "questions": ["Доктрина з організації підготовки в ЗСУ", "Настанова з підготовки персоналу в ЗСУ", "Наказ МОУ № 170 від 10.04.2009 (розділ VI)", "Наказ ГШ ЗСУ № 207 від 23.04.2024 про підготовку інструкторів", "Наказ ГШ ЗСУ № 41 від 05.03.2012 про упорядкування діяльності НЦ"], "assess": "Відповіді на запитання протягом і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Презентація «Основні керівні документи з підготовки у ЗСУ»; ВКП 7-00(03).01; ВКП 7-00(01).01; накази МОУ № 170, ГШ ЗСУ № 207, № 41"}, "sections": [{"h": "Доктрина з організації підготовки", "body": [["p", "<b>Доктрина</b> — вид військової керівної публікації, що визначає фундаментальні принципи й положення, напрям розвитку, способи і процедури реалізації."], ["p", "<b>Доктрина з організації підготовки в ЗСУ (ВКП 7-00(03).01)</b> — ключовий керівний документ, що визначає єдині підходи до вишколу військ для набуття потрібних спроможностей. Ґрунтується на науковому підході, бойовому досвіді, формах і методах за стандартами НАТО, світовому досвіді."], ["ul", ["<b>принципи підготовки:</b> відповідність стратегії нацбезпеки, професійна спрямованість, науковість, систематичність і послідовність, комплексність, доступність, індивідуальний підхід, персональна відповідальність;", "<b>види:</b> оперативна, бойова, підготовка персоналу;", "<b>методи:</b> словесно-наочний, ситуативно-пізнавальний, практичний (репродуктивний), пошуковий (евристичний), творчий (дослідницький);", "<b>організація підготовки:</b> планування, забезпечення, керівництво."]], ["key", "Загальне керівництво підготовкою — Головнокомандувач ЗСУ через Генеральний штаб (Головне управління доктрин та підготовки)."]]}, {"h": "Оцінювання і сертифікація", "body": [["p", "Мета оцінювання — визначити готовність підрозділу реалізувати набуті спроможності в умовах бойових дій."], ["p", "<b>Сертифікація</b> — завершальна процедура успішного оцінювання: документальне підтвердження відповідності стандартам колективної підготовки ЗСУ або кваліфікаційним стандартам держав — членів НАТО."], ["p", "Форми індивідуальної підготовки: курсова підготовка, збори, заняття (лекції, семінари, практичні, групові вправи, тренування), стажування, самостійна підготовка, контрольні заходи. Колективної: тренування, навчання, воєнні ігри, тактичні й інструкторсько-методичні заняття, навчальні збори."]]}, {"h": "Настанова з підготовки персоналу", "body": [["p", "<b>Настанова з підготовки персоналу в ЗСУ (ВКП 7-00(01).01)</b> визначає єдині принципи формування професійних компетентностей військових. Вона ґрунтується на Доктрині й конкретизує складові системи підготовки, її організацію, планування і забезпечення."], ["ul", ["офіцери — у ВВНЗ (університети, академії, військові інститути); офіцери запасу — на військових кафедрах (2 роки, «військовий день» раз на тиждень, звання молодший лейтенант запасу);", "сержанти — за моделлю НАТО, багаторівнево: <b>базовий (L-1)</b> — командири відділень і головні сержанти взводів; <b>середній (L-2)</b> — головні сержанти рот; <b>підвищений (L-3)</b> — батальйонів; <b>вищий (L-4)</b> — бригад і вищих штабів;", "заклади підготовки сержантів: центри підготовки сержантського складу (ЦПСС), військові коледжі сержантського складу (ВКСС);", "рядовий склад — БЗВП і фахова підготовка;", "також державні службовці, підвищення кваліфікації і підготовка резервістів."]]]}, {"h": "Наказ МОУ № 170, розділ VI", "body": [["p", "Розділ VI Інструкції про організацію виконання Положення про проходження військової служби присвячений підготовці, перепідготовці та підвищенню кваліфікації."], ["ul", ["<b>рядовий склад:</b> БЗВП для тих, хто раніше не служив, — до 3 місяців у навчальних центрах; фахова підготовка — до 4 місяців у НЦ або спецкурси у частині до 1 місяця;", "<b>сержантський склад:</b> вищу посаду не отримати просто за вислугу — потрібен відповідний рівень підготовки;", "<b>офіцерський склад:</b> оперативний і стратегічний рівні, вища освіта, підвищення кваліфікації, перепідготовка, спеціалізація;", "навчання без відриву від служби — заочно/дистанційно; головні сержанти батальйонів зобов’язані здобувати бакалавра заочно."]]]}, {"h": "Накази ГШ № 207 і № 41", "body": [["p", "<b>Наказ ГШ ЗСУ № 207 від 23.04.2024</b> — основні принципи та вимоги до підготовки інструкторів. Мета розвитку інструкторського складу — забезпечити навчальні частини, ВВНЗ і підрозділи висококваліфікованими інструкторами, на яких лягає основне навантаження з підготовки. Кандидатами можуть бути сержанти, а також офіцери та рядові (зміни від 05.01.2026). У воєнний стан у бригадах можуть створюватися групи інструкторів за напрямками."], ["p", "<b>Наказ ГШ ЗСУ № 41 від 05.03.2012</b> «Про упорядкування діяльності НЦ» затверджує тимчасове положення про навчальний центр та інструкцію з підготовки в НЦ:"], ["ul", ["склад НЦ: управління, навчальні підрозділи, тилові підрозділи, полігон; особовий склад — постійний і змінний;", "на посади інструкторів — особи з бойовим досвідом і методичними навичками;", "підготовка — <b>6 навчальних днів на тиждень по 8 академічних годин</b>; залучати курсантів до робіт поза програмою заборонено;", "методична робота — методичні (педагогічні) ради та комісії;", "начальник НЦ може перерозподіляти години за темами — не більше 20% бюджету часу на предмет;", "після навчання — кваліфікаційна атестація та свідоцтво; чотирибальна шкала оцінювання."]], ["key", "П’ять документів заняття: Доктрина, Настанова, наказ МОУ № 170, накази ГШ № 207 і № 41."]]}], "keys": ["Доктрина ВКП 7-00(03).01 — єдині підходи до вишколу.", "Види підготовки: оперативна, бойова, підготовка персоналу.", "Організація підготовки: планування, забезпечення, керівництво.", "Настанова ВКП 7-00(01).01 конкретизує Доктрину.", "Рівні лідерства сержантів: базовий, середній, підвищений, вищий.", "Наказ № 41: 6 днів на тиждень по 8 год; перерозподіл до 20%."], "test": [["Що таке доктрина у сенсі керівних документів?", ["Керівна публікація з фундаментальними принципами і способами реалізації", "Наказ про організацію навчального процесу на рік", "Методичний посібник для проведення окремого заняття", "Розклад і програма занять навчального центру"], "Доктрина — вид військової керівної публікації: фундаментальні принципи, напрям розвитку, способи і процедури."], ["Хто здійснює загальне керівництво підготовкою у ЗСУ?", ["Головнокомандувач ЗСУ через Генеральний штаб", "Міністр оборони через Департамент освіти", "Командувачі видів ЗСУ кожен самостійно", "Начальники навчальних центрів через ОНЦ"], "Загальне керівництво — Головнокомандувач ЗСУ через ГШ (Головне управління доктрин та підготовки)."], ["Які три види підготовки визначає Доктрина?", ["Оперативна, бойова, підготовка персоналу", "Вогнева, тактична, фізична", "Індивідуальна, колективна, штабна", "Базова, підвищена, академічна"], "Види підготовки за Доктриною: оперативна, бойова і підготовка персоналу."], ["Курсанти самостійно шукають рішення нестандартної тактичної задачі під керівництвом інструктора. Який метод за Доктриною?", ["Пошуковий (евристичний)", "Словесно-наочний", "Практичний (репродуктивний)", "Ситуативно-пізнавальний"], "Пошуковий (евристичний) метод — самостійний пошук рішення. Репродуктивний — відтворення за зразком."], ["Чим сертифікація відрізняється від оцінювання?", ["Це завершальне документальне підтвердження відповідності стандартам", "Це повторне оцінювання після невдалої спроби підрозділу", "Це проміжна перевірка знань окремих військовослужбовців", "Це оцінювання роботи інструкторів, а не підрозділу"], "Сертифікація — завершальна процедура успішного оцінювання з документальним підтвердженням відповідності стандартам ЗСУ або НАТО."], ["Що з переліченого — форма колективної, а не індивідуальної підготовки?", ["Воєнна гра", "Стажування", "Самостійна підготовка", "Курсова підготовка"], "Колективна: тренування, навчання, воєнні ігри, тактичні та інструкторсько-методичні заняття. Стажування й курси — індивідуальна."], ["Яке співвідношення між Доктриною та Настановою з підготовки персоналу?", ["Настанова ґрунтується на Доктрині і конкретизує її", "Доктрина ґрунтується на Настанові і конкретизує її", "Це незалежні документи різних рівнів управління", "Настанова скасовує окремі положення Доктрини"], "Настанова (ВКП 7-00(01).01) ґрунтується на Доктрині та конкретизує складові, організацію й планування підготовки."], ["Головний сержант роти навчається у системі підготовки сержантів. Який це рівень за моделлю НАТО?", ["Середній (L-2)", "Базовий (L-1)", "Підвищений (L-3)", "Вищий (L-4)"], "L-1 — командири відділень і головні сержанти взводів; L-2 — роти; L-3 — батальйони; L-4 — бригади й вищі штаби."], ["Новобранець раніше не служив. Яка максимальна тривалість його БЗВП у навчальному центрі за наказом МОУ № 170?", ["До 3 місяців", "До 1 місяця", "До 4 місяців", "До 6 місяців"], "БЗВП для тих, хто не служив, — до 3 місяців; фахова підготовка в НЦ — до 4 місяців."], ["Сержант прослужив 10 років, але не має відповідного рівня підготовки. Чи може він отримати вищу посаду лише за вислугою?", ["Ні — потрібен відповідний рівень підготовки", "Так — вислуга є головною підставою для посади", "Так — якщо кандидатуру погодить командир роти", "Так — автоматично після 8 років служби"], "За розділом VI наказу № 170 вищу посаду не отримати просто за вислугу — потрібна підготовка відповідного рівня."], ["Хто з сержантів зобов’язаний здобувати ступінь бакалавра заочно?", ["Головні сержанти батальйонів", "Усі командири відділень", "Сержанти-інструктори рот", "Головні сержанти взводів"], "Наказ № 170: головні сержанти батальйонів зобов’язані здобувати бакалавра без відриву від служби."], ["Відповідно до змін наказу ГШ № 207 (від 05.01.2026), хто може бути кандидатом в інструктори?", ["Сержанти, а також офіцери та рядові", "Лише сержанти з контрактом від 5 років", "Лише офіцери з досвідом командування", "Лише особи з вищою педагогічною освітою"], "Після змін від 05.01.2026 кандидатами можуть бути сержанти, офіцери та рядові."], ["Командир роти наказав курсантам після занять розвантажувати машини для сусідньої частини. Що каже наказ ГШ № 41?", ["Залучати курсантів до робіт поза програмою заборонено", "Дозволено у вихідний день за згодою курсантів", "Дозволено не більше 2 годин на день після занять", "Дозволено за письмовим наказом командира роти"], "Наказ № 41: підготовка — 6 днів по 8 академічних годин, залучати курсантів до робіт поза програмою заборонено."], ["Предмет має бюджет 50 годин. На скільки годин найбільше начальник НЦ може перерозподілити час між темами?", ["До 10 годин (20%)", "До 5 годин (10%)", "До 25 годин (50%)", "Перерозподіл заборонено"], "Начальник НЦ може перерозподіляти години між темами — не більше 20% бюджету часу на предмет: 20% від 50 = 10."], ["Як завершується навчання в НЦ за наказом ГШ № 41?", ["Кваліфікаційною атестацією і видачею свідоцтва", "Заліком у командира взводу без видачі документа", "Сертифікацією підрозділу за стандартами НАТО", "Підсумковим тестом і записом у ЖБП"], "Після навчання — кваліфікаційна атестація і свідоцтво; шкала оцінювання чотирибальна."], ["Скільки навчальних годин на тиждень передбачає наказ ГШ № 41 для курсантів НЦ?", ["48 академічних годин — 6 днів по 8", "40 академічних годин — 5 днів по 8", "36 академічних годин — 6 днів по 6", "56 академічних годин — 7 днів по 8"], "6 навчальних днів по 8 академічних годин = 48 годин на тиждень."]]}, {"id": "b1m1t2z2", "code": "Б1 М1 Т2 З2", "theme": "Тема 2. Керівні документи, що регламентують діяльність інструкторського складу", "title": "Методичні рекомендації щодо проведення занять", "short": "Методичні рекомендації", "passport": {"goal": "Ознайомити військовослужбовців з методичними рекомендаціями щодо проведення занять з основних напрямків підготовки у ЗСУ.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція; аудиторія", "questions": ["Методичні рекомендації щодо проведення занять з основних напрямків підготовки", "Збірник керівних документів", "Додаткові методичні матеріали: вимоги до занять на КІБР, положення зброї, теми практичних занять"], "assess": "Відповіді на запитання протягом і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Методичні рекомендації курсу підготовки інструкторів базового рівня (197 ЦПСС, 2026); презентація; тест за темою"}, "sections": [{"h": "Принципи систематичності й послідовності", "body": [["p", "Підготовка організовується відповідно до наказів і директив МОУ, Головнокомандувача, ГШ та навчально-методичних матеріалів: <b>бойові статути, курс стрільб, збірники нормативів, керівництва і посібники, стандарти</b>."], ["p", "Командири всіх рівнів дотримуються принципів <b>систематичності і послідовності навчання</b>: «від простого — до складного», «від відомого — до невідомого». Реалізуються у двох напрямках — <b>структурному</b> і <b>методичному</b>."], ["ul", ["<b>структурний</b> — від індивідуальної підготовки до колективної: діям у складі групи вчать лише після завершення індивідуальної підготовки;", "<b>методичний</b> — формування і вдосконалення теоретичних знань і практичних дій шляхом послідовного ускладнення форм і методів навчання."]], ["key", "Учити військовослужбовця тому, що потрібно на війні, — в умовах, максимально наближених до бойових."]]}, {"h": "Алгоритм навчання дії", "body": [["ul", ["коротке пояснення;", "зразковий показ;", "відпрацювання по елементах — точність виконання прийому;", "тренування в цілому в повільному темпі — без оцінювання;", "тренування на контроль — норматив на оцінку."]], ["p", "<b>Щільність навчання</b> — усі задіяні курсанти виконують практичні дії, ніхто не стоїть без діла. <b>Свідомість, активність, самостійність</b> — умови, за яких курсанти прагнуть оволодіти матеріалом. Єдність напрямків — одночасно знання, навички, бойові якості й психологічна стійкість."], ["key", "При вихованні — демонструвати високі стандарти поведінки і підготовки особистим прикладом."]]}, {"h": "Вимоги до занять на КІБР", "body": [["p", "<b>Зброя.</b> Навички поводження зі зброєю зобов’язані бути на високому рівні; недоліки відпрацьовують завчасно; заходи безпеки дотримуються неухильно. Початок заняття, перевірка, інструктаж, заряджання і після заняття — положення <b>«патруль»</b>; перевірки й відпрацювання тактики — <b>High Ready</b> або <b>Low Ready</b>; бойовий наказ, макет, розмінування — зброя за спиною."], ["p", "<b>Спорядження.</b> Шолом, броня, РПС ідеально підлаштовані під завдання; незакріплені елементи маскуються."], ["p", "<b>Медицина.</b> Кожна навчальна група має стандартизований мінімум аптечок; місця для індивідуальних медзасобів визначають завчасно для всієї групи."], ["p", "<b>Комунікація і дисципліна.</b> Команди максимально наближені до бойових: короткі («СТІЙ», «КОНТАКТ НА», «РУХ»), мінімум радіовипромінювання, беззаперечне виконання команд керівника."], ["warn", "За систематичну непокору, зрив заняття чи порушення безпеки керівник (з дозволу оцінювача) може застосувати фізичні вправи або відсторонити курсанта від занять."]]}, {"h": "Положення зброї", "body": [["ul", ["<b>High Ready</b> — ствол вище горизонту (30–45°), палець поза спуском: контроль сектору, безпека побратимів; рух у приміщеннях, тактичне переміщення;", "<b>Slinged</b> — зброя на ремені за спиною чи збоку, на запобіжнику: вільні руки; марш у безпечних зонах, евакуація;", "<b>Patrol Carry</b> — на ремені перед тілом, ствол вниз 15–30°, обома руками: патрулювання, тривалі переходи, блок-пост;", "<b>Low Ready</b> — приклад у плечі, ствол вниз 25–35°: найуніверсальніше для контролю і швидкої готовності;", "<b>Combat Ready</b> (low/high, ~10°) — бойова готовність без завершеного прицілювання: очікування контакту, «червона зона»;", "<b>Workspace</b> — робоча зона перед грудьми для перевірки на розрядженість, заміни магазину, усунення затримок."]], ["key", "Кожне положення — компроміс між готовністю, контролем, безпекою і втомою."]]}, {"h": "Теми практичних занять", "body": [["p", "Рекомендації містять методику для шести тем: <b>реакція та протидія FPV</b>, <b>дії солдата на спостережному посту</b>, <b>наліт</b>, <b>дії відділення під час обстрілу</b>, <b>зустрічний бій</b>, <b>постконтакт</b>."], ["ul", ["FPV: у відділенні — спостерігач за повітрям; короткі команди («FPV! Низько, 2 години, заходить!»); висота: низько — до 10 м, посередині — 10–30 м, високо — від 30 м;", "розосередження — інтервал щонайменше 10 м у «двійці», на відкритій місцевості — від 20 м; рух — найбільша демаскуюча ознака;", "спостережний пост: непомітність понад усе, без вершин пагорбів і поодиноких орієнтирів; не брати листя ближче 20 м від СП; маскування 70/30 (штучне/природне);", "спостереження «змійкою» — справа наліво, від себе в глибину; огляд оптикою не довше 10 с; доповідь коротка: орієнтир, поправка, що виявлено;", "завжди мати можливість прихованого відходу з СП."]], ["key", "Рекомендації — за досвідом бойових дій; команди і сигнали можна адаптувати під досвід підрозділу."]]}], "keys": ["Принципи: систематичність і послідовність навчання.", "Два напрямки послідовності: структурний і методичний.", "Алгоритм: пояснення, показ, елементи, у цілому повільно, на контроль.", "Щільність: усі курсанти виконують практичні дії.", "Положення зброї: патруль на початку/в кінці, High/Low Ready на тактиці.", "Команди — короткі, наближені до бойових."], "test": [["Інструктор хоче одразу відпрацьовувати з новобранцями дії штурмової групи, хоча вони ще не вміють поводитися зі зброєю. Який принцип він порушує?", ["Структурний напрям: колективні дії — після індивідуальної підготовки", "Принцип щільності: усі курсанти мають бути постійно задіяні", "Принцип єдності: знання і навички формуються одночасно", "Методичний напрям: послідовне ускладнення форм і методів"], "Структурний напрям: від індивідуальної до колективної підготовки, діям у групі вчать лише після завершення індивідуальної."], ["Який етап алгоритму навчання дії проводиться без оцінювання?", ["Тренування в цілому в повільному темпі", "Тренування на контроль із нормативом", "Відпрацювання по елементах на точність", "Зразковий показ з поясненням інструктора"], "Алгоритм: пояснення → показ → по елементах → в цілому повільно (без оцінки) → на контроль (норматив)."], ["Розставте правильно: що йде одразу після зразкового показу?", ["Відпрацювання по елементах", "Тренування на контроль", "Тренування в цілому в бойовому темпі", "Коротке пояснення"], "Після показу — відпрацювання по елементах для точності, потім тренування в цілому і на контроль."], ["Половина відділення чекає своєї черги, поки інші розбирають єдиний автомат. Який принцип порушено?", ["Щільність навчання — ніхто не стоїть без діла", "Свідомість — курсант розуміє мету дій", "Від відомого до невідомого в поясненні", "Єдність знань, навичок і бойових якостей"], "Щільність навчання: усі задіяні курсанти виконують практичні дії."], ["У якому положенні зброя під час бойового наказу, роботи на макеті чи розмінування?", ["За спиною", "High Ready", "Low Ready", "Patrol Carry"], "Вимоги КІБР: бойовий наказ, макет, розмінування — зброя за спиною."], ["Початок заняття, перевірка зброї, інструктаж. Яке положення зброї?", ["«Патруль» (Patrol Carry)", "High Ready (ствол угору)", "Combat Ready (бойове)", "Slinged (за спиною)"], "Початок заняття, перевірка, інструктаж, заряджання і після заняття — положення «патруль»."], ["Група рухається у приміщенні, контролюючи сектор. Ствол піднято на 30–45° вище горизонту. Що це за положення?", ["High Ready", "Low Ready", "Patrol Carry", "Workspace"], "High Ready — ствол вище горизонту на 30–45°, палець поза спуском: рух у приміщеннях, тактичне переміщення."], ["Яке положення вважають найуніверсальнішим для контролю і швидкої готовності?", ["Low Ready — приклад у плечі, ствол униз", "Slinged — зброя на ремені за спиною", "High Ready — ствол вище горизонту", "Patrol Carry — ремінь перед тілом"], "Low Ready — найуніверсальніше положення для контролю і швидкої готовності."], ["Курсант усуває затримку і замінює магазин перед грудьми. Як називається ця зона?", ["Workspace (робоча зона)", "Combat Ready (бойове)", "Patrol Carry (патруль)", "Low Ready (низьке)"], "Workspace — робоча зона перед грудьми для перевірки на розрядженість, заміни магазину, усунення затримок."], ["Курсант зірвав заняття і порушив заходи безпеки. Що може застосувати керівник і за якої умови?", ["Фізичні вправи або відсторонення — з дозволу оцінювача", "Лише усне зауваження і запис у журнал заняття", "Відрахування з курсу — власним рішенням керівника", "Позачерговий наряд — з дозволу командира взводу"], "За систематичну непокору, зрив заняття чи порушення безпеки керівник з дозволу оцінювача може застосувати фізичні вправи або відсторонити курсанта."], ["Спостерігач доповідає: «FPV! Низько, 2 години, заходить!». На якій висоті дрон за прийнятою градацією?", ["До 10 метрів", "10–30 метрів", "Понад 30 метрів", "Понад 100 метрів"], "Градація висоти: низько — до 10 м, посередині — 10–30 м, високо — від 30 м."], ["Двійка рухається відкритою місцевістю під загрозою FPV. Який інтервал між бійцями рекомендований?", ["Від 20 метрів", "Щонайменше 5 метрів", "Щонайменше 10 метрів — і на відкритій місцевості так само", "Не має значення, головне — швидкість"], "Інтервал у двійці — щонайменше 10 м, на відкритій місцевості — від 20 м."], ["Боєць маскує спостережний пост листям, зірваним просто біля позиції. У чому помилка?", ["Листя не беруть ближче 20 м від СП", "Маскування має бути лише штучним", "Листя дозволене лише хвойне", "Листя треба брати ближче 5 м"], "Листя не беруть ближче 20 м від СП, щоб не демаскувати пост; маскування — 70% штучного і 30% природного."], ["Як правильно вести спостереження з поста?", ["«Змійкою» справа наліво, від себе вглиб; оптика — до 10 с", "«Змійкою» зліва направо, з глибини до себе; оптика — до 30 с", "По секторах за годинниковою стрілкою; оптика — безперервно", "Лише в глибину, без бокових секторів; оптика — до 1 хв"], "Спостереження «змійкою» — справа наліво, від себе в глибину; огляд оптикою не довше 10 с."], ["Що названо найбільшою демаскуючою ознакою під час загрози FPV?", ["Рух", "Звук голосу", "Світло ліхтаря вдень", "Колір форми"], "Рух — найбільша демаскуюча ознака; тому розосередження і завмирання."], ["Яка рекомендація щодо вибору місця спостережного поста правильна?", ["Без вершин і поодиноких орієнтирів, з прихованим відходом", "На найвищій точці для огляду, з відходом по відкритому", "Біля поодинокого дерева для кращого маскування", "Без шляху відходу — пост утримують до кінця"], "Непомітність понад усе: без вершин і поодиноких орієнтирів, завжди можливість прихованого відходу."]]}, {"id": "b1m2t1z1", "code": "Б1 М2 Т1 З1", "theme": "Тема 1. Форми та методи навчання, методика викладання", "title": "Форми та методи навчання", "short": "Форми і методи", "passport": {"goal": "Довести до військовослужбовців форми та методи навчання особового складу, їх зміст та принципи застосування.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Методи навчання", "Форми навчання", "Принципи застосування форм і методів навчання"], "assess": "Усні запитання під час і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 1.1; презентація; тест за темою"}, "sections": [{"h": "Форма організації навчання", "body": [["p", "Форма організації навчання — це організаційна складова процесу навчання, сукупність умов, у яких воно відбувається. Форма залежить від мети і складу тих, хто навчається, і визначає структуру заняття, місце, тривалість відпрацювання навчальних питань, роботу керівника й курсантів, використання навчальної матеріально-технічної бази та озброєння."], ["p", "У педагогіці відомо понад тридцять форм організації навчання і більше десяти їх класифікацій. За формою організації це, наприклад, урок, семінар, екскурсія, домашнє завдання, електронне навчання. Для інструктора найважливіша класифікація — <b>за кількістю курсантів</b>, одночасно залучених до навчання."]]}, {"h": "П’ять форм за кількістю курсантів", "body": [["ul", ["<b>Навчання у великих групах</b> — від 15 до 30 і більше курсантів. Якщо інструктор не може приділити рівну увагу всім — це велика група. Використовується на лекціях, на інструктажі перед практичним заняттям і коли завдання виконується лише у складі взводу, наприклад стройова підготовка.", "<b>Навчання у малих групах</b> — від 4 до 12 курсантів (відділення), оптимально 7. Більша частина заняття — обмін знаннями, досвідом і думками між учасниками. Склад груп варто частіше змінювати, щоб не сформувалася група з низькою успішністю.", "<b>Навчання парами</b> — один виконує вправу, другий допомагає, консультує й перевіряє. Можна поєднати сильного курсанта зі слабшим. Часто використовується для засвоєння навичок.", "<b>Індивідуальне навчання</b> — увага інструктора спрямована на кожного окремо; усе, що курсант виконує сам: розбирання зброї, вправи стрільб. Кожен працює у своєму темпі й перевіряє свої сили.", "<b>Самостійна підготовка</b> — кожен військовослужбовець особисто відповідає за своє навчання: вивчає теоретичні питання, тренує прості навички. Ця форма допомагає правильно розподілити навчальний час."]], ["key", "Обираючи форму, інструктор враховує тему, рівень знань курсантів, свій рівень, час і місце заняття — і шукає варіант, що дасть найбільшу активність курсантів."]]}, {"h": "Що таке метод навчання", "body": [["p", "Метод навчання — спосіб досягнення цілі, послідовність кроків, кінцевим результатом яких є досягнення мети заняття. Інакше кажучи, це сукупність прийомів і способів, за допомогою яких передаються й засвоюються знання та формуються вміння і навички."], ["p", "Метод навчання виконує п’ять функцій: <b>освітню, розвивальну, виховну, стимулюючу і корекційну</b>."], ["p", "Спрощена класифікація ділить методи на три групи: <b>словесні, наочні і практичні</b>. До словесних належать лекція, розповідь, дискусія. До наочних — демонстрація (показ) та ілюстрація. До практичних — тренувальні вправи, змагання, завдання, робота в групах."], ["key", "Висока ефективність навчання неможлива без широкого використання наочних методів."]]}, {"h": "П’ять груп методів у ЗСУ", "body": [["p", "У Збройних Силах України використовують п’ять основних груп методів навчання:"], ["ul", ["<b>Словесно-наочний</b> — систематичне доведення матеріалу керівником і показ предметів, що вивчаються. Комунікація йде в одному напрямку — від інструктора до курсантів, тому метод підходить для передачі нових знань і дозволяє навчати одразу велику кількість людей.", "<b>Ситуативно-пізнавальний</b> — розгляд і обговорення реальних чи ймовірних бойових епізодів, досвіду управління військами, розвиток інформаційно-аналітичних навичок.", "<b>Практичний (репродуктивний)</b> — виконання дій за визначеним керівником алгоритмом для формування вмінь і навичок.", "<b>Пошуковий (евристичний)</b> — курсанти самостійно шукають інформацію чи оптимальний варіант дій за напрямом, який визначив керівник.", "<b>Творчий (дослідницький)</b> — самостійний пошук розв’язання проблемної ситуації з нестандартними підходами. Інструктор ставить завдання, а сам виступає радником і наглядачем за безпекою."]]]}, {"h": "Практичний метод: три фази", "body": [["p", "Практичний метод — систематичне поступове вивчення матеріалу. Він ідеально підходить для навичок, де високі вимоги до безпеки й швидкості, зокрема для роботи зі зброєю: усі дії мають бути відпрацьовані до автоматизму навіть у найскладніших умовах."], ["ul", ["<b>«Роби як я»</b> — інструктор виконує кожен елемент і пояснює його. За командою «Дивись!» курсанти спостерігають, за командою «Роби!» — повторюють. Застосовується, коли курсанти вперше працюють зі зброєю.", "<b>«Виконуй по кроках (командам)»</b> — дія ділиться на етапи, курсант не переходить далі, поки не виконає попередній чітко й без помилок. Підходить для складних і довгих маніпуляцій.", "<b>Самостійне виконання</b> — курсанти виконують усю дію від початку до кінця. Тим, хто відстає, інструктор допомагає індивідуально."]], ["p", "Фази не обов’язково застосовувати всі й на кожному занятті — їх можна і треба комбінувати."]]}, {"h": "Метод завдання, змагання, робота в групах", "body": [["p", "<b>Метод завдання</b> має таку послідовність:"], ["ul", ["ознайомлення із завданням: інструктор ставить завдання, час, дозволені засоби, правила виконання;", "прийняття рішення: курсанти вирішують, за потреби звертаючись по пораду;", "презентація рішення: один чи кілька курсантів пояснюють своє рішення, решта ставить запитання й оцінює;", "виконання завдання, якщо воно практичне;", "підведення підсумків: що виконано правильно, що ні, що ще можна було зробити."]], ["p", "Приклади: визначення азимутів і маршруту руху, складання картки вогню, рішення в тактичній ситуації на макеті. Курсант повинен не лише прийняти рішення, а й обґрунтувати його."], ["p", "<b>Змагання</b> добре підтримують практичні навички — стрільбу, орієнтування, розбирання зброї. Вони бувають самостійні (курсант покращує власний результат), індивідуальні (між курсантами) і групові (між парами, відділеннями, взводами)."], ["p", "<b>Робота в групах</b> — курсанти обмінюються знаннями й досвідом, обговорюють і обґрунтовують свої думки. Інструктор не знає наперед, куди приведе дискусія, тому повинен мати досвід проведення таких занять."]]}], "keys": ["Форма навчання — організація умов навчання; метод — спосіб досягнення цілі.", "За кількістю курсантів: великі групи, малі групи, пари, індивідуальне навчання, самостійна підготовка.", "Мала група — 4–12 курсантів, оптимально 7.", "Спрощена класифікація методів: словесні, наочні, практичні.", "У ЗСУ — п’ять груп методів: словесно-наочний, ситуативно-пізнавальний, практичний, пошуковий, творчий.", "Практичний метод: «роби як я», «по кроках», самостійне виконання."], "test": [["Інструктор проводить заняття з 22 курсантами і не може приділити рівну увагу кожному. Яка це форма навчання?", ["Навчання у великій групі", "Навчання у малій групі", "Індивідуальне навчання", "Навчання парами"], "Велика група — від 15 до 30 і більше; критерій — інструктор не може приділити рівну увагу всім."], ["Яка чисельність малої групи вважається оптимальною?", ["7 курсантів", "4 курсанти", "12 курсантів", "15 курсантів"], "Мала група — від 4 до 12 курсантів, оптимально 7."], ["Навіщо в малих групах частіше змінювати склад?", ["Щоб не сформувалася група з низькою успішністю", "Щоб курсанти не створювали неформальних угруповань", "Щоб кожен попрацював з усіма інструкторами взводу", "Щоб вирівняти кількість курсантів у групах"], "Склад малих груп варто змінювати, щоб не утворилася група з низькою успішністю."], ["Сильного курсанта поставили з тим, хто відстає: один виконує вправу, другий консультує й перевіряє. Яка форма?", ["Навчання парами", "Мала група", "Самостійна підготовка", "Індивідуальне навчання"], "Навчання парами: один виконує, другий допомагає і перевіряє; можна поєднати сильного зі слабшим."], ["Для якого заняття найбільше підходить велика група?", ["Стройова підготовка у складі взводу", "Відпрацювання усунення затримок кожним курсантом", "Обмін досвідом у дискусії", "Вправа стрільб"], "Велика група — лекції, інструктаж перед практикою і дії, що виконуються лише у складі взводу, як стройова."], ["Яка форма допомагає правильно розподілити навчальний час і покладає відповідальність на самого військовослужбовця?", ["Самостійна підготовка", "Навчання у великих групах", "Навчання парами", "Робота в групах"], "Самостійна підготовка: кожен особисто відповідає за своє навчання."], ["Що з переліченого — НЕ функція методу навчання?", ["Адміністративна", "Розвивальна", "Корекційна", "Стимулююча"], "П’ять функцій методу: освітня, розвивальна, виховна, стимулююча, корекційна."], ["Ілюстрація і демонстрація належать до якої групи методів у спрощеній класифікації?", ["Наочні", "Словесні", "Практичні", "Пошукові"], "Спрощена класифікація: словесні (лекція, розповідь, дискусія), наочні (демонстрація, ілюстрація), практичні."], ["Чому словесно-наочний метод підходить для передачі нових знань великій кількості людей?", ["Комунікація йде від інструктора до курсантів", "Курсанти самостійно шукають потрібну інформацію", "Кожен курсант виконує дії за алгоритмом", "Інструктор лише радить і наглядає за безпекою"], "Словесно-наочний метод: систематичне доведення матеріалу, комунікація в одному напрямку, можна навчати одразу багатьох."], ["Курсанти розбирають реальний бойовий епізод і обговорюють рішення командира. Який метод?", ["Ситуативно-пізнавальний", "Практичний (репродуктивний)", "Творчий (дослідницький)", "Словесно-наочний"], "Ситуативно-пізнавальний — розгляд реальних чи ймовірних бойових епізодів, розвиток аналітичних навичок."], ["Інструктор ставить проблемне завдання, а сам лише радить і стежить за безпекою; курсанти шукають нестандартне рішення. Який метод?", ["Творчий (дослідницький)", "Пошуковий (евристичний)", "Ситуативно-пізнавальний", "Практичний"], "Творчий — самостійний пошук нестандартного рішення; інструктор — радник і наглядач за безпекою. Пошуковий — пошук у визначеному керівником напрямі."], ["Курсанти вперше беруть до рук автомат. З якої фази практичного методу логічно почати?", ["«Роби як я»", "«Виконуй по кроках»", "Самостійне виконання", "Змагання на час"], "«Роби як я» застосовують, коли курсанти вперше працюють зі зброєю: «Дивись!» — спостерігають, «Роби!» — повторюють."], ["Яка особливість фази «Виконуй по кроках»?", ["Наступний крок — лише після безпомилкового попереднього", "Курсант одразу виконує всю дію від початку до кінця", "Інструктор лише спостерігає і не втручається", "Кроки виконуються в довільному зручному порядку"], "Дія ділиться на етапи; перехід далі — лише після чіткого виконання попереднього. Для складних і довгих маніпуляцій."], ["У методі завдання що відбувається на етапі «презентація рішення»?", ["Курсанти пояснюють рішення, інші питають і оцінюють", "Інструктор пояснює правильне рішення всій групі", "Курсанти виконують практичну частину завдання", "Інструктор оголошує оцінки й робить висновки"], "Послідовність: ознайомлення → рішення → презентація (пояснюють, інші питають і оцінюють) → виконання → підсумки."], ["Курсант покращує власний результат розбирання автомата від спроби до спроби. Який це вид змагання?", ["Самостійне", "Індивідуальне", "Групове", "Командне"], "Змагання: самостійні (власний результат), індивідуальні (м
