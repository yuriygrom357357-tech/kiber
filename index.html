и за невербальними сигналами?", ["На початку, на переходах і на підсумках", "Лише в середині основної частини", "Лише під час практичної роботи", "Тільки під час перерви між парами"], "Ключові моменти — початок, переходи і підсумки."], ["Що означає «контроль» невербальних сигналів?", ["Свідоме використання, а не придушення", "Повна нерухомість протягом заняття", "Відмова від будь-яких жестів", "Постійна посмішка незалежно від теми"], "Контроль не означає придушення — йдеться про свідоме використання сигналів."], ["Яка нейтральна поза рекомендована інструктору?", ["Пряма постава, руки вздовж тіла або перед собою", "Руки за спиною, погляд у підлогу", "Руки на поясі, ноги широко розставлені", "Спертися на стіл, руки схрещені"], "Нейтральна поза: пряма постава, руки вздовж тіла або складені перед собою."]]}, {"id": "b1m2t4z8", "code": "Б1 М2 Т4 З8", "theme": "Тема 4. Організація та проведення занять", "title": "Теорії і засади навчання", "short": "Теорії навчання", "passport": {"goal": "Ознайомити військовослужбовців із загальними теоріями навчання, освітніми контекстами їх застосування, перевагами і недоліками.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Дидактика як основа теорії навчання", "Біхевіоризм, когнітивізм, конструктивізм", "Інші теорії навчання", "Де застосовувати кожну теорію, переваги і недоліки"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.8; презентація; тест за темою"}, "sections": [{"h": "Дидактика", "body": [["p", "Педагогіка складається з теорії виховання і теорії освіти та навчання — <b>дидактики</b>. Дидактика досліджує цілі, закономірності, принципи, зміст, форми і методи навчання. Вона відповідає на запитання: <b>для чого?</b>, <b>кого?</b>, <b>як</b> навчати."], ["p", "Є дві основні дидактичні концепції. <b>Традиційна</b> (Ян Амос Коменський, Песталоцці, Гербарт) — стрижнева роль у викладання, діяльності вчителя. <b>Педоцентрична</b> — у учіння, діяльності учня; зв’язок навчання з життєвими потребами дає кращий результат, ніж запам’ятовування."], ["p", "Сучасна дидактика виходить з того, що викладання й учіння разом складають навчання."]]}, {"h": "Біхевіоризм", "body": [["p", "Біхевіоризм (від англ. behavior — поведінка) зосереджується на спостережуваній поведінці, яку формують зовнішні стимули і наслідки. Внутрішні розумові процеси він майже ігнорує."], ["ul", ["навчання — зміна спостережуваної поведінки;", "стимул — реакція: навчання через асоціацію;", "підкріплення збільшує ймовірність повторення поведінки, покарання — зменшує;", "класичне обумовлення (Павлов) і оперантне обумовлення (Скіннер)."]], ["p", "У навчанні: чіткі цілі й вимірювані результати, нагороди й покарання, складне розбивається на малі кроки, негайний зворотний зв’язок, дриль і практика."], ["p", "<b>Де працює:</b> базові навички і звички, прості рухові дії, стройові вправи, перша допомога, керування технікою до автоматизму, дисципліна і управління групою. <b>Недоліки:</b> ігнорує мислення, слабкий для творчості й розв’язання проблем, формує зовнішню мотивацію."]]}, {"h": "Когнітивізм", "body": [["p", "Когнітивізм вивчає внутрішні процеси: пам’ять, сприйняття, увагу, мислення, розв’язання проблем. Учень — активний обробник інформації, а розум схожий на комп’ютер, що кодує, зберігає і відтворює інформацію."], ["ul", ["короткочасна (робоча) і довготривала пам’ять відіграють ключову роль;", "теорія схем — попередні знання впливають на розуміння нового;", "метакогніція — «мислення про мислення», контроль власного навчання."]], ["p", "<b>Де працює:</b> розуміння складних понять, розв’язання проблем і прийняття рішень, структуровані матеріали — схеми, карти знань, мнемоніка, мультимедіа. <b>Недоліки:</b> мало уваги емоціям, мотивації і соціальному середовищу, механістичний погляд."]]}, {"h": "Конструктивізм", "body": [["p", "Кожен сам будує власне розуміння реальності, осмислюючи новий досвід через наявні знання. Навчання — не накопичення фактів, а побудова смислів."], ["ul", ["активне конструювання знань;", "навчання як соціальний процес;", "нове спирається на попередні знання;", "знання прив’язані до контексту;", "різні люди можуть по-різному зрозуміти одне й те саме."]], ["p", "<b>Де працює:</b> проєктна і дослідницька діяльність, розв’язання реальних складних проблем, співпраця, автентичні завдання, що імітують службу. <b>Недоліки:</b> складно стандартизовано оцінювати, процес менш структурований, вищі вимоги до інструктора як фасилітатора."], ["key", "Біхевіоризм — «роби за зразком», когнітивізм — «зрозумій і застосуй», конструктивізм — «знайди рішення сам»."]]}, {"h": "Інші теорії і висновок", "body": [["ul", ["<b>Гуманістична</b> (Роджерс, Маслоу) — особистість учня, самостійність, безпечне підтримуюче середовище; складно об’єктивно виміряти результат.", "<b>Андрагогіка</b> (Ноулз) — дорослі вчаться краще, коли бачать практичну цінність і можуть спиратися на досвід.", "<b>Соціальна теорія</b> — навчання через спостереження і наслідування, рольові ігри, групова робота.", "<b>Конективізм</b> (Сіменс, Даунс) — навчання через зв’язки в мережі знань: люди, бази даних, цифрові джерела.", "<b>Ситуативне навчання</b> (Лав, Венгер) — знання через участь у реальній діяльності разом з досвідченими.", "<b>Експериментальне навчання</b> (Колб) — цикл: досвід → рефлексія → висновок → експеримент."]], ["p", "Жодна теорія не є всеохопною. Сучасна педагогіка поєднує їх: стрій і безпечне поводження зі зброєю — біхевіоризм; пояснення будови й принципів — когнітивізм; тактичні задачі і АПД — конструктивізм."]]}], "keys": ["Дидактика — теорія навчання: для чого, кого, як навчати.", "Дві концепції: традиційна (викладання) і педоцентрична (учіння).", "Біхевіоризм — поведінка, стимул-реакція, підкріплення; для базових навичок і дисципліни.", "Когнітивізм — пам’ять, увага, мислення; для розуміння і розв’язання проблем.", "Конструктивізм — учень сам будує знання; для проєктів і реальних задач."], "test": [["На які запитання відповідає дидактика?", ["Для чого, кого і як навчати", "Хто, коли і де командує", "Скільки, чим і коли оцінювати", "Що, де і коли вивчати самостійно"], "Дидактика — теорія навчання: для чого?, кого?, як навчати."], ["У чому відмінність педоцентричної концепції від традиційної?", ["Стрижнева роль у учіння — діяльності учня", "Стрижнева роль у викладання — діяльності вчителя", "Вона відкидає зв’язок навчання з життям", "Вона заснована Коменським"], "Традиційна (Коменський, Песталоцці, Гербарт) — роль у викладання; педоцентрична — у учіння."], ["Курсанти до автоматизму відпрацьовують стройові прийоми з негайним зворотним зв’язком. Яка теорія навчання в основі?", ["Біхевіоризм", "Конструктивізм", "Конективізм", "Гуманістична"], "Біхевіоризм: дриль, малі кроки, негайний зворотний зв’язок, підкріплення — для базових навичок і стройових вправ."], ["Хто пов’язаний з оперантним обумовленням?", ["Скіннер", "Павлов", "Колб", "Ноулз"], "Класичне обумовлення — Павлов, оперантне — Скіннер."], ["Який головний недолік біхевіоризму?", ["Ігнорує мислення, слабкий для творчості", "Потребує складного й дорогого обладнання", "Не дає вимірюваних результатів навчання", "Не підходить для базових рухових навичок"], "Біхевіоризм ігнорує мислення, слабкий для творчості, формує зовнішню мотивацію."], ["Інструктор пояснює принцип роботи газового двигуна автомата схемою і мнемонікою. Яка теорія в основі?", ["Когнітивізм", "Біхевіоризм", "Соціальна теорія", "Ситуативне навчання"], "Когнітивізм: розуміння складних понять, схеми, карти знань, мнемоніка, мультимедіа."], ["Що таке метакогніція?", ["«Мислення про мислення» — контроль навчання", "Пам’ять на дати, цифри й назви", "Навчання через спостереження й наслідування", "Механічне повторення до автоматизму"], "Метакогніція — «мислення про мислення», контроль власного навчання (когнітивізм)."], ["Що стверджує теорія схем у когнітивізмі?", ["Попередні знання впливають на розуміння нового", "Усе нове треба вчити з нуля, без опори на відоме", "Ємність робочої пам’яті практично безмежна", "Емоції повністю визначають засвоєння"], "Теорія схем: попередні знання впливають на розуміння нового."], ["Курсанти самостійно розв’язують реальну тактичну задачу і будують власне розуміння. Яка теорія?", ["Конструктивізм", "Біхевіоризм", "Когнітивізм", "Класичне обумовлення"], "Конструктивізм — «знайди рішення сам»: проєкти, реальні проблеми, співпраця, автентичні завдання."], ["Який недолік конструктивізму?", ["Складно стандартизовано оцінювати", "Ігнорує попередні знання учнів", "Не підходить для складних проблем", "Формує лише зовнішню мотивацію"], "Конструктивізм: складно стандартизовано оцінювати, менш структурований, високі вимоги до інструктора."], ["Яка теорія описує цикл «досвід → рефлексія → висновок → експеримент»?", ["Експериментальне навчання (Колб)", "Конективізм (Сіменс, Даунс)", "Андрагогіка (Ноулз)", "Гуманістична теорія (Роджерс)"], "Експериментальне навчання (Колб): досвід → рефлексія → висновок → експеримент."], ["Навчання через зв’язки в мережі знань — людей, баз даних, цифрових джерел. Яка теорія?", ["Конективізм", "Біхевіоризм", "Соціальна теорія", "Ситуативне навчання"], "Конективізм — навчання через зв’язки в мережі знань."], ["Молодий інструктор вчиться, працюючи поруч із досвідченими на реальних заняттях. Яка теорія це описує?", ["Ситуативне навчання", "Біхевіоризм", "Когнітивізм", "Конективізм"], "Ситуативне навчання — знання через участь у реальній діяльності разом з досвідченими."], ["Яке поєднання теорій для військової підготовки наведено в матеріалі?", ["Стрій — біхевіоризм; будова — когнітивізм; тактика — конструктивізм", "Стрій — когнітивізм; будова — конструктивізм; тактика — біхевіоризм", "Стрій — конструктивізм; будова — біхевіоризм; тактика — когнітивізм", "Усі напрями — лише біхевіоризм, бо армія вчить діям за зразком"], "Жодна теорія не всеохопна: стрій і зброя — біхевіоризм, будова — когнітивізм, тактика й АПД — конструктивізм."], ["Гуманістична теорія (Роджерс, Маслоу) має головний недолік. Який?", ["Складно об’єктивно виміряти результат", "Ігнорує особистість учня", "Не створює безпечного середовища", "Підходить лише для дриль-вправ"], "Гуманістична: особистість, самостійність, безпечне середовище; але складно об’єктивно виміряти результат."]]}, {"id": "b1m2t4z9", "code": "Б1 М2 Т4 З9", "theme": "Тема 4. Організація та проведення занять", "title": "Теорія обробки інформації", "short": "Обробка інформації", "passport": {"goal": "Ознайомити військовослужбовців з теорією обробки інформації: психологічними процесами, межами робочої пам’яті і прийомами, що полегшують засвоєння.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Психологічні процеси обробки інформації", "Межі робочої пам’яті", "Прийоми полегшення обробки інформації"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.9; презентація; тест за темою"}, "sections": [{"h": "Як мозок обробляє інформацію", "body": [["p", "Когнітивні процеси працюють як комп’ютер: вхід → обробка → вихід. Обробка інформації включає кілька взаємопов’язаних процесів:"], ["ul", ["<b>Відчуття</b> — первинне відображення окремих властивостей: колір, звук, запах, температура.", "<b>Сприйняття</b> — поєднання відчуттів у цілісний образ на основі досвіду й очікувань.", "<b>Увага</b> — вибір значущого і відсіювання зайвого; буває довільною (свідомою) і мимовільною (яскраве, нове, важливе).", "<b>Пам’ять</b> — кодування, зберігання і відтворення інформації.", "<b>Мислення</b> — аналіз, синтез, порівняння, узагальнення; встановлення зв’язків і висновки.", "<b>Уява</b> — створення нових образів і моделювання ситуацій.", "<b>Мова</b> — кодування думок у слова, внутрішнє мовлення, передача інформації.", "<b>Виконавчі функції</b> — «диригент»: планування, прийняття рішень, контроль, перемикання між завданнями."]]]}, {"h": "Три етапи пам’яті", "body": [["p", "Пам’ять — сукупність процесів <b>кодування</b> (введення інформації), <b>зберігання</b> і <b>відтворення</b> (пошуку і повернення в свідомість)."], ["p", "За моделлю Аткінсона — Шиффріна інформація проходить три сховища:"], ["ul", ["<b>сенсорна пам’ять</b> — дуже коротке зберігання погляду, звуку — до пари секунд;", "<b>короткочасна (робоча) пам’ять</b> — тимчасове сховище, близько 20–30 секунд без повторення;", "<b>довготривала пам’ять</b> — постійне сховище знань, навичок і досвіду, ємність якого практично не має меж."]], ["key", "Завдання інструктора — перевести інформацію з робочої пам’яті в довготривалу."]]}, {"h": "Межі робочої пам’яті", "body": [["p", "<b>Обмежена ємність</b> — «магічне число сім плюс-мінус два»: людина одночасно утримує близько 5–9 окремих елементів. Більше — і нове витісняє попереднє. Ємність можна збільшити групуванням (chunking): номер телефону легше запам’ятати частинами."], ["p", "<b>Обмежена тривалість</b> — без повторення інформація зникає з робочої пам’яті за 20–30 секунд."], ["p", "Якщо ігнорувати ці межі:"], ["ul", ["<b>інформаційне перевантаження</b> — забагато нового одразу, курсант плутається і нічого не засвоює;", "<b>зростання когнітивного навантаження</b> — складний матеріал, погана подача, відволікання забирають ресурси;", "<b>перешкоди для застосування</b> — курсант не може утримати всі елементи, щоб розв’язати задачу."]], ["warn", "Перевантажений слайд чи потік нових термінів без пауз — прямий шлях до того, що курсант не засвоїть нічого."]]}, {"h": "Прийоми, що полегшують засвоєння", "body": [["ul", ["<b>Структурування і сегментація</b> — ділити матеріал на невеликі логічні частини, давати план, заголовки, списки.", "<b>Наочність і кілька каналів</b> — слово плюс схема, зображення, відео; подвійне кодування розвантажує пам’ять.", "<b>Зв’язок з попередніми знаннями</b> — згадати відоме, провести паралелі й аналогії.", "<b>Практика і повторення</b> — задачі, вправи, переказ; особливо ефективне розподілене (інтервальне) повторення.", "<b>Чітка й лаконічна мова</b> — прості речення, без жаргону, чіткі інструкції.", "<b>Мінімум відволікань</b> — тиша, порядок, без багатозадачності."]], ["p", "Також допомагають <b>репетиція</b> — свідоме повторення, <b>візуальні опори</b> — картки, концепт-карти, виділений текст, і <b>мнемоніка</b> — абревіатури й фрази, наприклад EDIP чи APPLE."], ["key", "Невеликими порціями, наочно, з опорою на відоме і з повторенням — так інформація доходить до довготривалої пам’яті."]]}], "keys": ["Процеси: відчуття, сприйняття, увага, пам’ять, мислення, уява, мова, виконавчі функції.", "Пам’ять: кодування, зберігання, відтворення.", "Сенсорна — до 2 с, короткочасна — 20–30 с, довготривала — без меж.", "Ємність робочої пам’яті — 7±2 елементи; групування збільшує її.", "Прийоми: структура, наочність, зв’язок з відомим, повторення, чітка мова, мінімум відволікань."], "test": [["Під час заняття вибухнула шумова граната, і всі обернулися. Який вид уваги спрацював?", ["Мимовільна", "Довільна", "Розподілена", "Вибіркова довільна"], "Увага буває довільною (свідомою) і мимовільною — на яскраве, нове, важливе."], ["Яка функція — «диригент» обробки інформації: планування, рішення, перемикання між завданнями?", ["Виконавчі функції", "Уява", "Сприйняття", "Сенсорна пам’ять"], "Виконавчі функції — планування, прийняття рішень, контроль, перемикання."], ["Чим сприйняття відрізняється від відчуття?", ["Поєднує відчуття в цілісний образ", "Відображає лише одну окрему властивість", "Це повний синонім відчуття", "Відбувається без участі досвіду"], "Відчуття — окремі властивості; сприйняття — цілісний образ з урахуванням досвіду й очікувань."], ["Яка правильна послідовність сховищ пам’яті за моделлю Аткінсона — Шиффріна?", ["Сенсорна → короткочасна → довготривала", "Короткочасна → сенсорна → довготривала", "Довготривала → робоча → сенсорна", "Сенсорна → довготривала → робоча"], "Інформація проходить сенсорну, короткочасну (робочу) і довготривалу пам’ять."], ["Скільки приблизно зберігається інформація в робочій пам’яті без повторення?", ["20–30 секунд", "2–3 секунди", "10 хвилин", "Добу"], "Короткочасна пам’ять — близько 20–30 с без повторення; сенсорна — до пари секунд."], ["Скільки окремих елементів одночасно утримує робоча пам’ять?", ["Близько 5–9", "Близько 1–2", "Близько 15–20", "Понад 50"], "«Магічне число сім плюс-мінус два»: 5–9 елементів."], ["Інструктор на одному слайді дає 15 нових термінів без пауз. Що станеться з робочою пам’яттю курсантів?", ["Інформаційне перевантаження — нове витісняє попереднє", "Вони запам’ятають усі терміни", "Довготривала пам’ять візьме навантаження на себе", "Нічого, якщо слайд гарний"], "Понад 5–9 елементів — перевантаження: курсант плутається і нічого не засвоює."], ["Курсанти краще запам’ятовують позивний «Альфа-Сім-Два-Браво», розбивши його на частини. Який прийом?", ["Групування (chunking)", "Мнемоніка", "Подвійне кодування", "Репетиція"], "Ємність робочої пам’яті збільшують групуванням — запам’ятовування частинами."], ["Що таке подвійне кодування?", ["Подача інформації словом і зображенням разом", "Повторний показ того самого слайда", "Переклад матеріалу двома мовами", "Шифрування службових документів"], "Наочність і кілька каналів: слово плюс схема чи відео — подвійне кодування."], ["Яке повторення найефективніше для переведення в довготривалу пам’ять?", ["Розподілене (інтервальне)", "Одноразове масове", "Лише в день заняття", "Повторення без перерв годину поспіль"], "Особливо ефективне розподілене (інтервальне) повторення."], ["Абревіатури EDIP і APPLE — приклад якого прийому?", ["Мнемоніки", "Сегментації", "Подвійного кодування", "Мінімуму відволікань"], "Мнемоніка — абревіатури й фрази, як EDIP чи APPLE."], ["Яке головне завдання інструктора з погляду теорії обробки інформації?", ["Перевести інформацію в довготривалу пам’ять", "Максимально заповнити сенсорну пам’ять", "Збільшити обсяг матеріалу на заняття", "Тренувати уяву й фантазію курсантів"], "Завдання інструктора — перевести інформацію з робочої пам’яті в довготривалу."], ["Що з переліченого збільшує когнітивне навантаження?", ["Погана подача і відволікання", "Чіткий план заняття", "Зв’язок з попередніми знаннями", "Сегментація матеріалу"], "Когнітивне навантаження зростає через складний матеріал, погану подачу і відволікання."], ["Інструктор починає нову тему з нагадування вже відомого й аналогій. Який прийом?", ["Зв’язок з попередніми знаннями", "Сегментація матеріалу", "Мінімум відволікань", "Репетиція вголос"], "Зв’язок з попередніми знаннями — згадати відоме, провести паралелі й аналогії."], ["Яка ємність довготривалої пам’яті?", ["Практично не має меж", "5–9 елементів", "20–30 секунд", "Кілька сотень слів"], "Довготривала пам’ять — постійне сховище, ємність практично не має меж."]]}, {"id": "b1m2t5z1", "code": "Б1 М2 Т5 З1", "theme": "Тема 5. Публічний виступ", "title": "Підготовка та проведення публічного виступу", "short": "Публічний виступ", "passport": {"goal": "Ознайомити з порядком підготовки та проведення теоретичного (лекційного) і практичного заняття, мистецтвом публічного виступу та способами подолання страху перед аудиторією.", "time": "2 години (90 хв)", "method": "Лекція; навчальний клас", "questions": ["Порядок підготовки та проведення теоретичного (лекційного) заняття", "Принципи підготовки практичного заняття", "Мистецтво публічного виступу", "Способи подолання страху публічного виступу"], "assess": "Усне опитування в кінці заняття.", "criteria": "Позитивно — якщо знає порядок підготовки і проведення заняття та способи подолання страху публічного виступу.", "sources": "ДМ до СТІ 132Г.42К(Н).05, пп. 5.1.1–5.1.4; презентація «Теоретичні (лекційні) заняття»"}, "sections": [{"h": "Підготовка теоретичного заняття", "body": [["p", "Підготовка до лекції — фундаментальний етап. Мета не просто передати інформацію, а домогтися, щоб курсанти її зрозуміли й засвоїли."], ["ul", ["<b>мета і навчальні цілі</b> — що курсанти мають зрозуміти, пояснити, проаналізувати; дієслова когнітивних дій: «пояснити сутність», «порівняти підходи», «сформулювати визначення»;", "<b>аналіз аудиторії</b> — рівень попередньої підготовки, базові знання, можливі труднощі з абстрактними поняттями;", "<b>добір і структурування матеріалу</b> — від загального до часткового, від простого до складного; головні ідеї окремо від другорядних деталей;", "<b>методи викладання</b> — проблемна чи візуальна лекція, бесіда, елементи дискусії, кейси, проблемні запитання;", "<b>дидактичні матеріали</b> — слайди з тезами і схемами, роздатковий матеріал, глосарій; вони доповнюють усний виклад, а не дублюють його;", "<b>контроль і закріплення</b> — коротке опитування, завдання на самопідготовку, підсумки;", "<b>самопідготовка інструктора</b> — досконало знати матеріал, відрепетирувати, перевірити таймінг;", "<b>аудиторія і техніка</b> — дошка, проєктор, справність обладнання; для дистанційного заняття — робота платформи."]], ["key", "Ціль → аудиторія → матеріал → методи → наочність → контроль → репетиція → перевірка класу."]]}, {"h": "Підготовка практичного заняття", "body": [["p", "Практичне заняття формує навички, тому підготовка багатокомпонентна й особливо уважна до безпеки."], ["ul", ["цілі формулюються <b>в термінах дій</b>: «виконати», «зібрати», «застосувати» — з кількісними і якісними критеріями (норматив за час без помилок);", "вивчити програму, настанови, статути і методичні розробки — рекомендований час, обладнання, типові помилки;", "методи — показ, тренування за зразком, виконання частинами і в цілому, імітація, робота в малих групах; від простого до складного;", "покрокові інструкції, картки-завдання, бланки звітності, зразки обладнання;", "<b>критерії оцінювання</b> розробити заздалегідь і довести курсантам ще до практики;", "місце і МТЗ — навчальні місця, справність і комплектність, засоби імітації, освітлення;", "план-конспект з розподілом часу: вступ, демонстрація, інструктаж, вправи, контроль, підсумки, резерв;", "<b>заходи безпеки</b> — аналіз ризиків, інструктаж кожного, засоби захисту, постійний контроль, дії в разі небезпеки;", "самопідготовка — інструктор сам досконало відпрацьовує прийоми, які показуватиме."]], ["warn", "Безпека — один із найпріоритетніших аспектів підготовки практичного заняття. Без інструктажу з безпеки до практики не переходять."]]}, {"h": "Що включає підготовка до виступу", "body": [["p", "Презентація курсу виділяє п’ять складових: <b>підготовка до виступу, організація, місце проведення, візуальна підтримка, практична підготовка</b>."], ["ul", ["проаналізуйте багато даних, виберіть істотні факти й ретельно організуйте їх;", "пояснення — прості, точні, фактичні;", "жарти й анекдоти — рідко: слухачі готові до серйозної розмови; гумор — лише щоб підкреслити чи роз’яснити;", "врахуйте звання і досвід аудиторії та оберіть найкращий підхід;", "організація: ясна логічна структура — <b>вступ, основна частина, висновки</b>;", "місце не повинно працювати проти вас — його організовують заздалегідь;", "візуальна підтримка посилює вплив виступу."]], ["key", "Проводьте репетицію перед кожним виступом! Нехай інша людина перевірить якість звучання, проєктування емоцій і деструктивну поведінку."]]}, {"h": "Проєктування і деструктивна поведінка", "body": [["p", "У великому приміщенні попросіть когось стати в кінці зали й перевірити, чи вас чути. Емоційний тон допомагає аудиторії розділити вашу точку зору: тема серйозна, а ви щиро зацікавлені в результаті."], ["ul", ["відкритий зоровий контакт;", "паузи;", "жести руками;", "інтонація і тон голосу;", "положення тіла;", "вираз обличчя."]], ["p", "Деструктивна поведінка привертає недоречну увагу й заважає спілкуванню: безупинна жестикуляція, не пов’язана з матеріалом; постійне перебування за трибуною або спроби на неї перехилитися; руки в кишенях чи перебирання їх вмісту; безцільне переміщення."], ["key", "Ораторська майстерність дає ефективну передачу знань, мотивацію курсантів, авторитет інструктора та керування навчальним процесом."]]}, {"h": "Як подолати страх виступу", "body": [["p", "Страх публічного виступу (глософобія) поширений, хвилюються навіть досвідчені інструктори. Способи подолання:"], ["ul", ["<b>ретельна підготовка</b> — знати матеріал, структурувати виступ, передбачити запитання, репетирувати вголос, перед дзеркалом або на відео;", "<b>переосмислення страху</b> — фокус на меті й користі для слухачів; хвилювання — джерело енергії;", "<b>візуалізація успіху</b> — уявляти вдалий виступ;", "<b>дихання і тіло</b> — повільні глибокі вдихи, розслаблення плечей і шиї, впевнена постава;", "<b>взаємодія з аудиторією</b> — знайти доброзичливі обличчя, ставити риторичні запитання;", "<b>поступовість</b> — починати з малої знайомої аудиторії; ретельно відпрацювати перші хвилини;", "<b>прийняти недосконалість</b> — дрібні помилки аудиторія пробачає;", "<b>підтримка</b> — колеги, а в складних випадках психолог чи фахівець з публічних виступів."]], ["key", "Подолання страху — процес: з кожним виступом упевненості більше."]]}], "keys": ["Підготовка лекції починається з мети і навчальних цілей.", "Цілі практичного заняття — в термінах дій з критеріями.", "Критерії оцінювання доводять курсантам до практики.", "Безпека — пріоритет підготовки практичного заняття.", "Структура виступу: вступ, основна частина, висновки.", "Репетиція перед кожним виступом.", "Страх долають підготовкою, диханням, взаємодією, практикою."], "test": [["Яка правильна послідовність підготовки лекції?", ["Ціль → аудиторія → матеріал → методи → наочність → контроль → репетиція", "Матеріал → слайди → ціль → аудиторія → методи → контроль → репетиція", "Аудиторія → слайди → ціль → матеріал → репетиція → методи → контроль", "Репетиція → матеріал → ціль → аудиторія → наочність → методи → контроль"], "Підготовка лекції: ціль, аналіз аудиторії, матеріал, методи, наочність, контроль, репетиція, перевірка класу."], ["Як мають співвідноситися слайди з усним викладом лекції?", ["Доповнювати, а не дублювати", "Дублювати слово в слово", "Замінювати усний виклад", "Слайди не потрібні"], "Дидактичні матеріали доповнюють усний виклад, а не дублюють його."], ["Яке дієслово доречне для навчальної цілі теоретичного заняття?", ["«Порівняти підходи»", "«Зібрати»", "«Виконати норматив»", "«Відчути»"], "Для лекції — дієслова когнітивних дій: пояснити, порівняти, сформулювати. Для практики — виконати, зібрати."], ["Коли курсантам доводять критерії оцінювання практичного заняття?", ["Ще до практики", "Після виконання вправи", "На наступному занятті", "Не доводять, щоб не підказувати"], "Критерії оцінювання розробляють заздалегідь і доводять курсантам ще до практики."], ["Що є одним із найпріоритетніших аспектів підготовки практичного заняття?", ["Безпека — без інструктажу до практики не переходять", "Якісні слайди з відео і анімацією", "Ґрунтовна теоретична частина перед практикою", "Мотиваційна промова на початку заняття"], "Безпека — один із найпріоритетніших аспектів; без інструктажу до практики не переходять."], ["Інструктор збирається показувати прийом, який сам давно не виконував. Що каже вимога самопідготовки?", ["Сам досконало відпрацювати прийом заздалегідь", "Показати як вийде — курсанти зрозуміють", "Доручити показ найкращому курсанту групи", "Замінити живий показ відеозаписом"], "Самопідготовка: інструктор сам досконало відпрацьовує прийоми, які показуватиме."], ["Як часто використовувати жарти й анекдоти у виступі?", ["Рідко — щоб підкреслити чи роз’яснити", "Якомога частіше — для розрядки", "Ніколи — це серйозне заняття", "Лише на початку, щоб розрядити атмосферу"], "Жарти — рідко: слухачі готові до серйозної розмови; гумор — лише щоб підкреслити чи роз’яснити."], ["Як перевірити, чи вас чути у великому приміщенні?", ["Попросити когось стати в кінці зали", "Говорити якомога голосніше", "Запитати першу парту", "Не перевіряти — мікрофон вирішить"], "У великому приміщенні попросіть когось стати в кінці зали і перевірити звучання."], ["Що з переліченого — деструктивна поведінка оратора?", ["Постійно стояти за трибуною", "Відкритий зоровий контакт", "Паузи між думками", "Зміна інтонації"], "Деструктивна: безупинна жестикуляція, постійне перебування за трибуною, руки в кишенях, безцільне переміщення."], ["Як називається страх публічного виступу?", ["Глософобія", "Агорафобія", "Клаустрофобія", "Соціопатія"], "Страх публічного виступу — глософобія."], ["Інструктор хвилюється перед першою лекцією. Що з переліченого — дієвий спосіб подолання страху?", ["Відпрацювати перші хвилини і репетирувати вголос", "Не готуватися, щоб не накручувати себе", "Читати з аркуша, не піднімаючи очей", "Попросити колегу провести заняття замість себе"], "Ретельна підготовка, репетиції, відпрацювання перших хвилин, дихання, поступовість."], ["Як переосмислити хвилювання перед виступом?", ["Як джерело енергії, з фокусом на слухачах", "Як ознаку непридатності до інструкторської роботи", "Як привід скоротити заняття вдвічі", "Як сигнал передати заняття іншому"], "Переосмислення страху: фокус на меті й користі для слухачів; хвилювання — джерело енергії."], ["Що порадити інструктору, який дуже боїться великої аудиторії?", ["Почати з малої знайомої аудиторії", "Одразу виступити перед батальйоном", "Уникати виступів, доки страх не мине", "Дивитися поверх голів слухачів"], "Поступовість — починати з малої знайомої аудиторії."], ["Які п’ять складових підготовки до виступу виділяє презентація курсу?", ["Підготовка, організація, місце, наочність, практика", "Текст, слайди, мікрофон, костюм, репетиція", "Вступ, теза, аргумент, приклад, висновок", "Тема, ціль, час, метод, оцінювання"], "П’ять складових: підготовка до виступу, організація, місце проведення, візуальна підтримка, практична підготовка."], ["Що варто зробити перед кожним виступом за рекомендацією курсу?", ["Провести репетицію з перевіркою іншою людиною", "Нічого — імпровізація звучить природніше", "Вивчити весь текст напам’ять дослівно", "Скоротити матеріал удвічі для надійності"], "Проводьте репетицію перед кожним виступом: інша людина перевірить звучання, емоції, деструктивну поведінку."]]}, {"id": "b1m2t6z1", "code": "Б1 М2 Т6 З1", "theme": "Тема 6. Контроль навчання та оцінювання", "title": "Види контролю знань і навичок", "short": "Види контролю", "passport": {"goal": "Ознайомити з видами контролю теоретичних знань і практичних дій (умінь і навичок) під час навчання особового складу, типами тестів і методикою їх розробки.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Види контролю та їх призначення", "Вхідний, проміжний і підсумковий контроль; комплексний іспит", "Типи і види тестів, методика розробки, правила застосування", "Види оцінювання і контролю викладання"], "assess": "Усне опитування; письмова практична робота — скласти кілька тестів різного типу.", "criteria": "Позитивно — якщо знає види тестів і виконує практичне завдання щонайменше на 80% правильно.", "sources": "ДМ до СТІ 132Г.42К(Н).06, пп. 6.1.1–6.1.5; презентація «Види контролю знань та умінь»"}, "sections": [{"h": "Класифікація контролю", "body": [["p", "<b>За часом проведення:</b> вхідний (попередній), проміжний (поточний і рубіжний, модульний) та підсумковий."], ["p", "<b>За формою:</b> усний (опитування, бесіда, дискусія), письмовий (тести, контрольні роботи, есе), практичний (нормативи, вправи на тренажерах і полігонах, моделювання ситуацій), комбінований, а також самоконтроль."], ["p", "Вибір форми залежить від цілей навчання, змісту матеріалу, рівня підготовленості, часу, ресурсів і специфіки спеціальності."], ["key", "Контроль не лише оцінює прогрес — він вчасно показує прогалини, щоб інструктор міг скоригувати навчання."]]}, {"h": "Вхідний, проміжний, підсумковий", "body": [["p", "<b>Вхідний</b> — на початку навчання або нового розділу: визначає початковий рівень. Форми: усне опитування, невеликий тест, прості практичні завдання, анкетування. Результати — для формування груп, адаптації змісту, індивідуальної роботи. За презентацією — також для відбору на курс."], ["p", "<b>Проміжний</b> — регулярно після тем і на практичних заняттях: показує, як засвоюється матеріал, дає зворотний зв’язок і підстави для додаткових занять з відстаючими."], ["p", "<b>Підсумковий</b> — на завершальному етапі, охоплює весь матеріал: письмові, усні та практичні іспити (заліки). За результатами вирішують, чи може людина проходити службу на посаді."], ["key", "Вхідний — «з чого починаємо», проміжний — «як іде», підсумковий — «чи готовий»."]]}, {"h": "Комплексний іспит", "body": [["p", "Комплексний іспит — форма підсумкового контролю, що одночасно оцінює знання та навички з кількох взаємопов’язаних дисциплін."], ["ul", ["<b>інтегрований зміст</b> — завдання охоплюють різні, але пов’язані розділи;", "<b>комплексні практичні завдання</b> — моделювання ситуацій, комплексні нормативи, ситуаційні задачі, захист проєктів;", "<b>комісійний прийом</b> — комісія з фахівців різних напрямків;", "<b>багаторівнева оцінка</b> — не лише правильність, а й мислення, рішення, комунікація, робота в команді;", "можливе поетапне виконання з оцінкою кожного етапу;", "реальне обладнання та імітаційні засоби для наближення до бойових умов."]], ["key", "Комплексний іспит показує, чи вміє військовослужбовець застосовувати знання разом — як у реальному бою."]]}, {"h": "Типи і види тестів", "body": [["p", "<b>Об’єктивні</b> — з однозначними критеріями: так/ні, вибір однієї відповіді, множинний вибір, на відповідність (класифікований), рейтинговий (упорядкування), вставка (заповнення пропуску). <b>Суб’єктивні</b> — оцінка залежить від експерта: коротка відповідь, перерахування, найменування, пояснення, есе, курсова чи дипломна робота."], ["p", "Усні тести — питання, на які курсант відповідає своїми словами; перевіряють фактичні, процедурні та інтегровані знання. Готуються швидко, але тривають довше. Практичні тести — курсант демонструє навичку."], ["p", "За метою: тести досягнень (найпоширеніші), діагностичні, прогностичні, тести здібностей, тести особистості."], ["key", "Приклади з курсу: фактичне знання — «Калібр АК?»; процедурне — «Чому стрілець стоїть праворуч від дерева?»; інтегроване — описати й захистити рішення за 10 хвилин."]]}, {"h": "Як розробити тест", "body": [["ul", ["визначити мету тестування — що саме оцінюємо;", "проаналізувати навчальний зміст;", "скласти специфікацію — скільки завдань з кожної теми, складність, тип;", "сформулювати завдання: стебло з однією проблемою, однозначно правильна відповідь, правдоподібні дистрактори, без підказок;", "для суб’єктивних тестів — заздалегідь визначити критерії оцінювання;", "написати інструкцію — правила, час, спосіб позначення відповідей;", "пілотувати тест на невеликій групі, проаналізувати й виправити;", "розробити ключ або схему оцінювання."]], ["p", "Правила застосування: стандартизовані умови для всіх, чітке інструктування, часові рамки, конфіденційність, об’єктивна перевірка за ключем, зворотний зв’язок і розбір помилок, етичність (запобігання списуванню). Тест — лише один із інструментів контролю."]]}, {"h": "Контроль викладання", "body": [["p", "Викладання теж потребує систематичного оцінювання:"], ["ul", ["<b>самооцінювання</b> — рефлексія після занять, аналіз відеозаписів, щоденник інструктора;", "<b>взаємооцінювання колегами</b> — відвідування заняття і зворотний зв’язок;", "<b>оцінювання керівництвом</b> — відповідність стандартам, перевірка план-конспектів, результатів;", "<b>зворотний зв’язок від курсантів</b> — анкети, опитування;", "<b>аналіз результатів курсантів</b> — низькі результати групи можуть означати потребу змінити методи."]], ["key", "Різнобічне оцінювання дає об’єктивну картину роботи інструктора і напрямки вдосконалення."]]}], "keys": ["За часом: вхідний, проміжний (поточний, рубіжний), підсумковий.", "За формою: усний, письмовий, практичний, комбінований, самоконтроль.", "Комплексний іспит: інтегрований зміст, комісія, багаторівнева оцінка.", "Тести: об’єктивні та суб’єктивні.", "Завдання тесту: одна проблема, однозначна відповідь, правдоподібні дистрактори.", "Практична робота зараховується від 80% правильних відповідей."], "test": [["Перед початком курсу інструктор проводить короткий тест, щоб сформувати групи за рівнем. Який це контроль?", ["Вхідний", "Проміжний", "Підсумковий", "Рубіжний"], "Вхідний — на початку: визначає початковий рівень, допомагає формувати групи й адаптувати зміст."], ["За результатами якого контролю вирішують, чи може людина проходити службу на посаді?", ["Підсумкового", "Вхідного", "Проміжного", "Самоконтролю"], "Підсумковий охоплює весь матеріал; за ним вирішують, чи готова людина до посади."], ["Яке з тверджень найкраще описує призначення проміжного контролю?", ["Показує хід засвоєння і потребу в додаткових заняттях", "Визначає початковий рівень курсантів перед навчанням", "Вирішує питання призначення курсанта на посаду", "Оцінює роботу інструктора за результатами групи"], "Вхідний — «з чого починаємо», проміжний — «як іде», підсумковий — «чи готовий»."], ["Чим комплексний іспит відрізняється від звичайного заліку?", ["Оцінює знання й навички з кількох дисциплін разом", "Проводиться лише в письмовій формі", "Його приймає один провідний інструктор", "Оцінює лише правильність відповідей"], "Комплексний іспит: інтегрований зміст, комплексні практичні завдання, комісія, багаторівнева оцінка."], ["Хто приймає комплексний іспит?", ["Комісія з фахівців різних напрямків", "Один керівник заняття", "Самі курсанти взаємооцінюванням", "Командир роти одноосібно"], "Комісійний прийом — комісія з фахівців різних напрямків."], ["Тест на упорядкування етапів EDIP у правильній послідовності — це який вид об’єктивного тесту?", ["Рейтинговий", "На відповідність", "Вставка", "Множинний вибір"], "Об’єктивні тести: так/ні, вибір, множинний вибір, відповідність, рейтинговий (упорядкування), вставка."], ["«Чому стрілець стоїть праворуч від дерева?» — яке знання перевіряє це питання?", ["Процедурне", "Фактичне", "Інтегроване", "Афективне"], "Фактичне — «Калібр АК?»; процедурне — «Чому стрілець стоїть праворуч від дерева?»; інтегроване — описати й захистити рішення."], ["Що таке дистрактор у тестовому завданні?", ["Правдоподібна неправильна відповідь", "Правильна відповідь у тесті", "Підказка у формулюванні питання", "Інструкція до виконання тесту"], "Завдання: стебло з однією проблемою, однозначно правильна відповідь, правдоподібні дистрактори, без підказок."], ["Яка вада тестового завдання з дистракторами на кшталт «Генштаб ЗСУ, 2019» поруч з «Чарльз Аллен, 1919»?", ["Неправдоподібні дистрактори підказують відповідь", "Вади немає — завдання сформульоване правильно", "Забагато варіантів відповіді для одного питання", "Завдання надто складне для базового рівня"], "Неправдоподібні дистрактори фактично підказують правильну відповідь."], ["Що потрібно зробити з новим тестом перед масовим застосуванням?", ["Пілотувати на малій групі й виправити", "Одразу видати всім курсантам потоку", "Показати лише командиру на погодження", "Перевірити тільки граматику й орфографію"], "Розробка тесту включає пілотування на невеликій групі, аналіз і виправлення."], ["Для суб’єктивного тесту з короткою відповіддю що треба визначити заздалегідь?", ["Критерії оцінювання", "Лише час", "Кількість дистракторів", "Нічого — експерт оцінить сам"], "Для суб’єктивних тестів критерії оцінювання визначають заздалегідь."], ["Що з переліченого — правило застосування тестів?", ["Однакові умови і перевірка за ключем", "Різний час залежно від рівня курсанта", "Оцінювання за загальним враженням", "Без розбору помилок, щоб не підказувати"], "Правила: стандартизовані умови, інструктування, часові рамки, конфіденційність, перевірка за ключем, розбір помилок."], ["Яких тестів за метою найбільше?", ["Тестів досягнень", "Діагностичних", "Прогностичних", "Тестів особистості"], "За метою: досягнень (найпоширеніші), діагностичні, прогностичні, здібностей, особистості."], ["Уся група провалила тест з однієї теми. Що це може означати щодо викладання?", ["Варто змінити методи викладання теми", "Курсанти недбало поставилися до теми", "Тест треба скасувати як надто складний", "Нічого — це випадковий результат"], "Аналіз результатів курсантів: низькі результати групи можуть означати потребу змінити методи."], ["Інструктор переглядає відеозапис свого заняття й веде щоденник. Який вид контролю викладання?", ["Самооцінювання", "Взаємооцінювання", "Оцінювання керівництвом", "Зворотний зв’язок від курсантів"], "Самооцінювання — рефлексія, аналіз відеозаписів, щоденник інструктора."]]}, {"id": "b1m2t6z2", "code": "Б1 М2 Т6 З2", "theme": "Тема 6. Контроль навчання та оцінювання", "title": "Оформлення документації з обліку підготовки", "short": "Облікова документація", "passport": {"goal": "Ознайомити з правилами оформлення та ведення документації, необхідної для проведення навчання.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція / практичне заняття; аудиторія", "questions": ["Основна облікова документація, що необхідна для проведення навчання", "Порядок і правила ведення основної облікової документації"], "assess": "Відповіді на запитання протягом заняття; практичне завдання в кінці.", "criteria": "Позитивно — якщо надав відповіді на запитання і виконав практичне завдання.", "sources": "Презентація «Порядок оформлення та ведення документації з обліку підготовки»; Курс стрільб (КРП 03.032.056-2018), розд. 3"}, "sections": [{"h": "Що таке облікова документація", "body": [["p", "<b>Облікова документація</b> — сукупність документів, у яких фіксують, реєструють і зберігають інформацію про діяльність, події, людей, майно або процеси."], ["p", "Основні документи обліку підготовки:"], ["ul", ["<b>Журнал обліку бойової підготовки (ЖБП)</b>;", "<b>оціночні відомості</b>;", "<b>картка обліку виконання вправ стрільб</b> (картка настрілу)."]], ["key", "Що не записано — того не було. Облік підтверджує, що навчання проведене і результат досягнутий."]]}, {"h": "Журнал бойової підготовки", "body": [["p", "ЖБП — службовий документ підрозділу, у якому фіксують усе, що стосується навчання: перелік предметів, іменний список, теми, дати і час занять, керівника заняття, оцінки та присутність."], ["ul", ["оформлюється на навчальний період; веде командир навчального взводу (інструктор взводу) — за кожного курсанта;", "до початку навчання журнал <b>прошитий, пронумерований і зареєстрований</b> установленим порядком;", "під час занять журнал — у командира (інструктора) взводу;", "заповнюється <b>чорним чорнилом</b>;", "командир взводу на сторінці 2 розписується, що ознайомлений з правилами ведення;", "зберігається протягом календарного року, потім знищується встановленим порядком."]], ["warn", "Журнал з навчальними записами — службовий документ. Не можна виносити його, вести олівцем чи дописувати «заднім числом»."]]}, {"h": "Розділи журналу", "body": [["ul", ["<b>Розділ 2</b> «Зміст журналу» — розділи і номери сторінок;", "<b>Розділ 3</b> — список особового складу за штатно-посадовим розрахунком (заповнюється на самопідготовці);", "<b>Розділ 4</b> — облік за предметами навчання в послідовності Програми бойової підготовки;", "<b>Розділ 5</b> — облік виконання нормативів (практичних робіт): індивідуальна оцінка за кожен норматив;", "<b>Розділи 6 і 7</b> — стрільби і водіння; у розділі 6 графа «вид зброї» ділиться на дві частини, у другій — оцінка за матеріальну частину;", "<b>Розділ 8</b> — вправи ВСК: у графі «дата» — дата і форма одягу («с» — спортивна, «в» — військова); в оцінці: чисельник — результат, знаменник — бали;", "<b>Розділ 9</b> — результати контролю: зауваження перевіряючих; інструктор записує, що недоліки усунено (або причину), дату, і розписується."]]]}, {"h": "Оціночні відомості", "body": [["p", "Оціночна відомість — документ, у який вносять результати теоретичних знань, практичних дій і навичок. Види:"], ["ul", ["<b>за СТІ</b> — посада, звання, ПІБ; предмет і дата; навчальні питання/практичні завдання; бали й оцінка; підпис керівника заняття;", "<b>за виконання нормативів</b> — номер і назва нормативу, час, оцінка, загальна оцінка;", "<b>результатів виконання вправ стрільб</b> — вправа і номери мішеней, зброя і калібр, набої, час, день/ніч, дата, підрозділ; загальний результат за трьома критеріями: стрільба, знання основ і правил, матчастина/нормативи; на звороті — таблиця результатів, аналіз, недоліки, підпис керівника стрільби;", "<b>оціночний лист КТЗ</b> — звання і ПІБ курсанта та інструктора з підписами, дата, оцінки «викон./не викон.», «зал./не зал.», рекомендації, підпис командира підрозділу."]], ["key", "Порядок оцінювання стрільб — у Курсі стрільб (КРП 03.032.056-2018), розділ 3 «Оцінка вогневої підготовки»."]]}, {"h": "Картка настрілу", "body": [["p", "Картка обліку виконання вправ стрільб — особистий обліковий документ, де фіксують усі результати стрільб військовослужбовця:"], ["ul", ["хто стріляв — ПІБ, посада, підрозділ;", "яку вправу і з якої зброї;", "дата і час доби;", "кількість набоїв (настріл);", "результат — влучення, оцінка;", "підписи керівника стрільб (інструктора) і того, хто навчається."]], ["p", "У картці також ведуть облік метання гранат, вправ з психологічної підготовки (обкатка технікою, психологічна смуга перешкод) і виконання КТЗ (польових виходів)."], ["key", "Практичне завдання заняття: правильно заповнити фрагменти ЖБП, відомості та картки на умовних даних."]]}], "keys": ["Основні документи: ЖБП, оціночні відомості, картка настрілу.", "ЖБП: прошитий, пронумерований, зареєстрований; чорне чорнило.", "ЖБП зберігається календарний рік.", "Розділ 9 — зауваження перевіряючих і відмітка про усунення.", "Чотири види відомостей: СТІ, нормативи, стрільби, КТЗ.", "Картка настрілу — особистий облік стрільб."], "test": [["Які три основні документи обліку підготовки?", ["ЖБП, оціночні відомості, картка настрілу", "План-конспект, розклад занять, наказ", "Статут, Курс стрільб, програма курсу", "Рапорт, акт приймання, протокол"], "Основні: Журнал обліку бойової підготовки, оціночні відомості, "В оцінці ВСК: чисельник — результат, знаменник — бали."], ["Перевіряючий записав зауваження в розділ 9. Що робить інструктор?", ["Записує усунення або причину, дату, підпис", "Нічого — це запис самого перевіряючого", "Вириває сторінку і переписує розділ", "Пише пояснювальну записку командиру"], "Розділ 9: інструктор записує усунення недоліків або причину, дату і розписується."], ["У розділі 6 графа «вид зброї» поділена на дві частини. Що в другій?", ["Оцінка за матеріальну частину", "Калібр зброї в міліметрах", "Номер зброї за формуляром", "Кількість витрачених набоїв"], "У розділі 6 друга частина графи «вид зброї» — оцінка за матеріальну частину."], ["За якими трьома критеріями виставляється загальний результат у відомості стрільб?", ["Стрільба, знання основ і правил, матчастина", "Влучність, швидкість, витривалість", "Дисципліна, форма одягу, присутність", "Теорія, практика, поведінка на рубежі"], "Відомість стрільб: загальний результат за стрільбою, знанням основ і правил, матчастиною/нормативами."], ["Де визначено порядок оцінювання стрільб?", ["Курс стрільб КРП 03.032.056-2018", "Наказ ГШ ЗСУ № 41 від 05.03.2012", "Доктрина з організації підготовки", "Тимчасова інструкція з АПД"], "Порядок оцінювання стрільб — Курс стрільб КРП 03.032.056-2018, розділ 3."], ["Що, крім стрільб, обліковують у картці настрілу?", ["Гранати, психологічну підготовку і КТЗ", "Фізичну підготовку і нормативи ВСК", "Стройову підготовку і огляди", "Відвідування лекцій і семінарів"], "У картці також ведуть облік метання гранат, психологічної підготовки (обкатка, смуга) і КТЗ."], ["Хто підписує картку обліку виконання вправ стрільб?", ["Керівник стрільб і той, хто навчається", "Лише командир роти після стрільб", "Лише курсант, що виконував вправу", "Начальник полігону і черговий"], "Картку підписують керівник стрільб (інструктор) і той, хто навчається."]]}, {"id": "b4m1t1z1", "code": "Б4 М1 Т1 З1", "theme": "Блок 4. Модуль 1. Порядок організації та проведення занять на об’єктах НМТБ полігону", "title": "Зразковий показ організації та проведення польових занять", "short": "Польове заняття", "passport": {"goal": "Навчити проводити заняття на об’єктах НМТБ полігону (ділянці місцевості); довести складові частини, принципи підготовки та порядок проведення практичних польових занять.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, інструкторсько-методичне заняття (зразковий показ); аудиторія, ділянка місцевості", "questions": ["Особливості практичних польових занять", "Складові частини практичного польового заняття", "Принципи підготовки і порядок проведення польового заняття, допоміжний персонал"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо засвоєно не менше 70% матеріалу.", "sources": "Програма ТП 7-418.78, розд. 7.1.4; презентація «Зразковий показ…»; план-конспект заняття"}, "sections": [{"h": "Особливості польових занять", "body": [["p", "Практичні заняття можна проводити і в класі, і на ділянці місцевості. Польове заняття відрізняється від лекції метою і методами: лекція дає знання й розуміння, практичне заняття формує, закріплює і вдосконалює навички. На лекції переважає пасивна роль слухачів, на практиці — активні дії кожного."], ["ul", ["на освоєння навичок потрібно <b>більше часу</b>, ніж на теорію;", "використовується методика <b>EDIP</b>: пояснення — демонстрація — імітація — практика;", "заняття <b>вимагає матеріального забезпечення</b>: зброя, засоби імітації, позиція противника, засоби зв’язку, аптечки;", "місцевість працює на тему: лісиста чи відкрита ділянка, рельєф, водні об’єкти, дороги, стежки, будівлі, інженерні споруди, обладнані навчальні місця."]], ["key", "Місце для заняття підбирають якомога реалістичніше під тему."]]}, {"h": "Підготовка до заняття", "body": [["ul", ["<b>план-конспект</b> — за вимогами і ціллю заняття; заходи безпеки та інструкції для персоналу і курсантів виписані детальніше, ніж для класу;", "<b>місце проведення</b> — визначені місця: адміністрації, домедичної допомоги, теорії, демонстрації, тренування, фінальної практики; підготовлені маршрути переміщення, без відволікаючих факторів;", "<b>навчально-матеріальна база</b> — з розрахунку на кожного курсанта: засоби імітації, позиція противника, демогрупа; стан перевірено до початку."]], ["key", "Репетиція і визначення місць на місцевості — обов’язкова частина підготовки."]]}, {"h": "Допоміжний персонал", "body": [["p", "Польове заняття майже завжди проводиться з допоміжним персоналом. Бажано, щоб кожна група мала зв’язок з інструктором."], ["ul", ["<b>демонстраційна група</b> («демо-група») — люди з достатньою підготовкою, щоб зразково показати будь-який елемент;", "<b>імітаційна група (противник)</b> — взаємодіє з курсантами під час тренувань: знає місця відпрацювання, пройшла чіткий інструктаж, уміє користуватися засобами імітації;", "<b>асистент</b> (помічник, суб-інструктор) — має рівень інструктора, знає задум керівника, пройшов інструктаж, володіє матеріалом теми."]], ["p", "Коли прибуває допоміжний персонал (підготовча частина для персоналу): заходи безпеки — перевірка зброї і магазинів, 5 правил, дії за командою «СТОП!», безпека на місцевості; розподіл місць і матеріальних засобів (бирки, імітація, медичні ноші); вказівки демогрупі, асистентам, противнику і <b>репетиція</b>."]]}, {"h": "Складові частини польового заняття", "body": [["ul", ["<b>Підготовча частина (персонал)</b> — безпека, розподіл засобів, репетиція.", "<b>Підготовча частина (курсанти)</b> — привітання і перевірка особового складу, заходи безпеки («Зброю до огляду!», доповідь про боєприпаси та засоби імітації, декларація), перевірка забезпечення, представлення місць проведення заняття, початкова підготовка (маскування, видача імітації).", "<b>Вступна частина</b> — перевірка знань попереднього заняття, тема і мета, порядок і хід заняття (метод, питання, умови і критерії оцінювання, розподіл часу, заміна на навчальних місцях, групи і номери, старший групи), мотивація.", "<b>Основна частина</b> — пояснення, демонстрація, імітація, тренування, переходи між питаннями, дотримання заходів безпеки.", "<b>Контроль</b> — практичний контроль за ціллю заняття; оцінюється весь особовий склад.", "<b>Заключна частина</b> — заходи безпеки (перевірка зброї, декларація, рапорт), підведення підсумків, кінцеві інструкції: тема наступного заняття, прибиральники, самопідготовка."]], ["warn", "Перевірка зброї на розрядженість — і на початку, і в кінці заняття, у всього особового складу, включно з персоналом."]]}, {"h": "Принципи проведення", "body": [["ul", ["<b>безпека</b> — безумовний пріоритет: інструктаж, контроль дій, запобігання небезпечним ситуаціям;", "<b>моделювання реальних умов</b> — обстановка, наближена до бойової, з імітацією;", "<b>активність і свідомість</b> — кожен задіяний у дії;", "<b>послідовність і систематичність</b> — від простого до складного;", "<b>індивідуальний підхід</b> — з урахуванням рівня кожного;", "<b>контроль і оцінювання</b> — систематично й об’єктивно;", "<b>зворотний зв’язок</b> — запитання, роз’яснення, оцінка дій;", "<b>матеріально-технічне забезпечення</b> — наявне і справне."]], ["p", "Інструкторські якості ті самі, що й у класі: зоровий контакт, зовнішній вигляд, впевненість, гучність голосу, чітка вимова, без слів-паразитів."], ["key", "Далі — Тема 2: курсанти по черзі проводять власні польові заняття (1×60 хв) і оцінюються за оціночним листом «Польове»."]]}], "keys": ["Польове заняття — формування навичок; методика EDIP.", "Потребує більше часу і матеріального забезпечення.", "Допоміжний персонал: демо-група, імітаційна група (противник), асистент.", "Підготовча частина двічі: для персоналу і для курсантів.", "Перевірка зброї — на початку і в кінці, у всіх.", "Курсант оцінюється позитивно від 70%."], "test": [["Чим польове практичне заняття принципово відрізняється від лекції?", ["Формує навички, курсанти діють активно", "Дає лише знання й розуміння теми", "Не потребує матеріального забезпечення", "Проводиться без методи х етапів, перевірка зворотного зв’язку через запитання, підведення проміжних підсумків.", "s": false}, {"t": "Послідовність навчальних питань", "d": "Навчальні питання приведені у логічній послідовності, допомагають досягти мети заняття; зосереджується увага на переході між навчальними питаннями.", "s": false}, {"t": "Проведення опитувань", "d": "Опитування проводяться на всіх етапах заняття (вступ, між навчальними питаннями, на контролі); питання випливають зі змісту, запобігають «нерозумінню», актуалізують знання.", "s": false}, {"t": "Знання навчального матеріалу", "d": "Досконале володіння знанням матеріалу; надано відповіді на всі питання курсантів, пов’язані із заняттям; якщо інструктор не знає відповіді на питання – не вводить в оману.", "s": true}, {"t": "Додержання заходів безпеки", "d": "Керівник заняття здійснював безперервний контроль за дотриманням заходів безпеки, регулярно наголошував на їх дотриманні, демонстрував взірцевий особистий приклад.", "s": true}]}, {"g": "ОСНОВНА ЧАСТИНА (контроль)", "items": [{"t": "Порядок контролю", "d": "Нагадав мету заняття, критерії оцінювання; призначено командира відділення, якщо потрібно - видаються засоби імітації.", "s": false}, {"t": "Місце підготовки до фінальної практики (маскування)", "d": "Постановка навчально-бойового завдання на макеті місцевості – обов’язково (ситуація, легенда); завдання, імовірні позиції противника. Доповідь про готовність виконання НБЗ (зворотній брифінг «командир відділення - інструктор»). Постановка навчально-бойового завдання навчальній групі командиром відділення.", "s": false}, {"t": "Фінальний інструктаж", "d": "Фінальні вказівки: наголошення про дотримання ЗБ, час на виконання завдання.", "s": false}, {"t": "Виконання контролю", "d": "Реальний контроль (використовуються противник, засоби імітації), виконується все по меті навчання, спостерігаються дії курсантів (якщо потрібно, використовується додатковий персонал).", "s": false}, {"t": "Заходи безпеки та їх контроль під час фіна }

   <details ${store.get("passOpen",false)?"open":""} id="passD"><summary>Паспорт заняття: час, навчальні питання, оцінювання</summary>
    <dl><div><dt>Час</dt><dd>${esc(P.time)}</dd></div><div><dt>Метод і місце</dt><dd>${esc(P.method)}</dd></div>

  <div class="tabs" role="tablist"><button class="tab ${tab==="lec"?"on":""}" data-go="#${id}">Лекція · ${mins(id)} хв</button><button class="tab ${tab==="test"?"on":""}" data-go="#${id}/test">Тест · ${t.test.length} питань</button></div>`;
  if(tab==="lec"){
    html+=`<article class="lec">`;
    t.sections.forEach((sec,si)=>{
      html+=`<section class="sec"><h2 class="blk" id="s${si}h" data-s="${si}">${esc(sec.h)}</h2>`;

        else if(k==="ul")html+=`<ul>${v.map((it,li)=>`<li class="blk" id="${id_}i${li}" data-s="${si}">${it}</li>`).join("")}</ul>`;

      });
      html+=`</section>`;
    });

/* ---------- audio ---------- */
const audio=new Audio();audio.preload="auto";
const RATES=[1,1.25,1.5,0.9];
let A={t:null,s:0,rate:store.get("rate",1),cur:null,userScroll:0};
audio.playbackRate=A.rate;
function setupPlayer(t){
  A.t=t;$("#player").classList.remove("hidden");$("#pSpd").textContent=fmtRate(A.rate);
  if(A.cur&&A.tid===t.id){paintNow(A.cur);updateUI();return}
  A.tid=t.id;A.s=Math.min(store.get("pos_"+t.id,0),t.sections.length-1);loadSec(A.s,false);
}
function fmtRate(r){return (r+"").replace(".",",")+"×"}
function loadSec(s,play,at){
  const tm=TIMING[A.t.id];if(!tm||!tm[s])return;
  A.s=s;const src="audio/"+tm[s].f;const same=audio.src.endsWith(src)&&audio.readyState>=1;
  const go_=()=>{if(at)audio.currentTime=at;audio.playbackRate=A.rate;if(play)audio.play().catch(()=>{});};
  if(same)go_();else{audio.src=src;audio.addEventListener("loadedmetadata",go_,{once:true});audio.load();}
  store.set("pos_"+A.t.id,s);updateUI();mediaMeta();
}
function updateUI(){
  if(!A.t)return;const sec=A.t.sections[A.s];
  $("#pTitle").textContent=sec?sec.h:"";
  const d=audio.duration||(TIMING[A.t.id][A.s]||{}).d||0;
  $("#pTime").textContent=`${A.s+1}/${A.t.sections.length} · ${fmt(audio.currentTime)} / ${fmt(d)}`;
  $("#pFill").style.width=(d?audio.currentTime/d*100:0)+"%";
  const playing=!audio.paused;$("#icPlay").classList.toggle("hidden",playing);$("#icPause").classList.toggle("hidden",!playing);
  $("#pPlay").setAttribute("aria-label",playing?"Пауза":"Слухати");
}
function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
audio.addEventListener("timeupdate",()=>{
  if(!A.t||S.view!=="topic")return;updateUI();
  const m=(TIMING[A.t.id][A.s]||{}).m||[];let cur=m[0]&&m[0][0];
  for(const [id,t] of m){if(audio.currentTime+0.05>=t)cur=id;else break}
  if(cur&&cur!==A.cur){A.cur=cur;if(S.tab==="lec")paintNow(cur,true)}
});
audio.addEventListener("play",updateUI);audio.addEventListener("pause",updateUI);
audio.addEventListener("ended",()=>{
  const lp=Math.max(lecProg(A.t.id),A.s+1);store.set("lec_"+A.t.id,lp);
  if(A.s+1<A.t.sections.length)loadSec(A.s+1,true);
  else{store.set("pos_"+A.t.id,0);updateUI();const k=document.querySelector(".keys");if(k&&S.tab==="lec")k.scrollIntoView({behavior:"smooth",block:"center"});}
});
function paintNow(id,scroll){
  document.querySelectorAll(".blk.now").forEach(e=>e.classList.remove("now"));
  const el=document.getElementById(id);if(!el)return;el.classList.add("now");
  if(scroll&&Date.now()-A.userScroll>5000){const r=el.getBoundingClientRect();const vh=innerHeight;if(r.top<90||r.bottom>vh-150)el.scrollIntoView({behavior:"smooth",block:"center"})}
}
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{A.userScroll=Date.now()},{passive:true}));
function seekBlock(id){
  const s=+document.getElementById(id).dataset.s;const m=(TIMING[A.t.id][s]||{}).m||[];
  const mk=m.find(x=>x[0]===id);const at=mk?mk[1]:0;
  A.userScroll=0;A.cur=null;
  if(s!==A.s)loadSec(s,true,at);else{audio.currentTime=at;audio.play().catch(()=>{})}
}
function togglePlay(){if(!A.t)return;if(audio.paused){audio.play().catch(()=>{});A.userScroll=0}else audio.pause()}
function pauseAudio(){try{audio.pause()}catch(e){}}
function stopAudio(reset){pauseAudio();if(reset){A.cur=null}}
$("#pPlay").onclick=togglePlay;
$("#pPrev").onclick=()=>{if(audio.currentTime>4)audio.currentTime=0;else if(A.s>0)loadSec(A.s-1,!audio.paused)};
$("#pNext").onclick=()=>{if(A.s+1<A.t.sections.length)loadSec(A.s+1,!audio.paused)};
$("#pSpd").onclick=()=>{A.rate=RATES[(RATES.indexOf(A.rate)+1)%RATES.length];audio.playbackRate=A.rate;store.set("rate",A.rate);$("#pSpd").textContent=fmtRate(A.rate)};
$("#pBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};
function mediaMeta(){if(!("mediaSession" in navigator)||!A.t)return;try{
  navigator.mediaSession.metadata=new MediaMetadata({title:A.t.sections[A.s].h,artist:A.t.short,album:"КІБР"});
  navigator.mediaSession.setActionHandler("play",()=>audio.play());navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack",()=>$("#pNext").onclick());navigator.mediaSession.setActionHandler("previoustrack",()=>$("#pPrev").onclick());
}catch(e){}}

/* ---------- quiz ---------- */
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(cfg){
  Q={...cfg,items:shuffle(cfg.items).map(it=>{const [q,opts,ex,clip]=it.q;return {...it,text:q,ex,clip,opts:shuffle(opts.map((o,k)=>({o,ok:k===0,k})))}}),i:0,score:0,picked:null,wrong:[]};
  renderQ();
}
function renderQ(noVoice){
  const box=$("#quiz");const it=Q.items[Q.i];const n=Q.items.length;const L="АБВГ";
  let h=`<div class="qhead"><span>Питання ${Q.i+1} з ${n}</span><span>${Q.score} ${balWord(Q.score)}</span></div><div class="qprog"><i style="width:${Q.i/n*100}%"></i></div>`;
  if(Q.exam)h+=`<div class="eyebrow" style="margin-bottom:6px">${esc(byId[it.tid].short)}</div>`;
  h+=voiceBar()+`<div class="qtext">${esc(it.text)}</div><div class="opts">`;
  it.opts.forEach((o,k)=>{let c="";if(Q.picked!==null){if(Q.exam)c=k===Q.picked?"sel":"dim";else if(o.ok)c="right";else if(k===Q.picked)c="wrong";else c="dim"}
    h+=`<button class="opt ${c}" data-k="${k}" ${Q.picked!==null?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o.o)}</span></button>`});
  h+=`</div>`;
  if(Q.picked!==null&&!Q.exam){
    const ok=it.opts[Q.picked].ok;
    h+=`<div class="verdict ${ok?"ok":"no"}"><b>${ok?"Правильно. +1 бал":"Неправильно"}</b>${ok?"":`Правильна відповідь: ${esc(it.opts.find(o=>o.ok).o)}. `}${esc(it.ex)}</div>`;
    h+=`<div class="qnext"><button class="btn fx p" id="qNext">${Q.i+1<n?"Далі":"Результат"} →</button></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const nx=$("#qNext");if(nx){nx.onclick=nextQ;nx.focus({preventScroll:true})}
  bindVoice();
  if(!noVoice&&qvOn()){if(Q.picked===null)qReadQuestion();else if(!Q.exam)qReadVerdict();}
}
/* ---------- озвучка тестів ---------- */
const qa=new Audio();qa.preload="auto";let QSEQ=[],QSEQi=0,QSEQid=0;
function qvOn(){return store.get("qvoice",true)&&!!DATA.qa}
function qStop(){QSEQ=[];QSEQid++;try{qa.pause()}catch(e){}}
function qPlay(list){qStop();if(!list.length)return;const my=++QSEQid;QSEQ=list.filter(Boolean);QSEQi=0;
  const next=()=>{if(my!==QSEQid||QSEQi>=QSEQ.length)return;qa.src="audio/"+QSEQ[QSEQi++];qa.playbackRate=store.get("rate",1);qa.play().catch(()=>{})};
  qa.onended=()=>{if(my===QSEQid)setTimeout(next,180)};next();}
function qReadQuestion(){const it=Q&&Q.items[Q.i];if(!it||!it.clip)return;const L=DATA.qa.letters;
  const seq=[it.clip.q];it.opts.forEach((o,j)=>{seq.push(L[j],it.clip.o[o.k])});qPlay(seq);}
function qReadVerdict(){const it=Q&&Q.items[Q.i];if(!it||!it.clip||Q.picked===null)return;const ok=it.opts[Q.picked].ok;
  const right=it.opts.find(o=>o.ok);qPlay(ok?[DATA.qa.right,it.clip.e]:[DATA.qa.wrong,it.clip.o[right.k],it.clip.e]);}
function voiceBar(){if(!DATA.qa)return"";const on=qvOn();return `<div class="qvoice"><button class="btn fx sm" id="qvToggle" aria-pressed="${on}">${on?"🔊 Озвучка увімкнена":"🔇 Озвучка вимкнена"}</button>${Q.items[Q.i]&&Q.items[Q.i].clip?`<button class="btn fx sm" id="qvReplay">▶ Прослухати ще раз</button>`:""}</div>`}
function bindVoice(){const t=$("#qvToggle");if(t)t.onclick=()=>{store.set("qvoice",!qvOn());if(!qvOn())qStop();renderQ(true)};
  const r=$("#qvReplay");if(r)r.onclick=()=>Q.picked===null||Q.exam?qReadQuestion():qReadVerdict();}
function balWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"бал";if(a>=2&&a<=4&&(b<12||b>14))return"бали";return"балів"}
function pick(k){if(Q.picked!==null)return;qStop();Q.picked=k;const it=Q.items[Q.i];if(it.opts[k].ok)Q.score++;else Q.wrong.push(it);renderQ();
  if(Q.exam){setTimeout(()=>{if(Q&&Q.picked===k&&Q.items[Q.i]===it)nextQ()},650)}}
function nextQ(){qStop();Q.picked=null;Q.i++;if(Q.i>=Q.items.length)renderResult();else{renderQ();const qt=document.querySelector(".quiz");if(qt&&qt.getBoundingClientRect().top<0)qt.scrollIntoView()}}
function gradeOf(p){return p>=90?"Відмінно":p>=80?"Добре":p>=70?"Задовільно":"Незадовільно"}
function renderResult(){
  qStop();const n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  if(Q.save){const b=best(Q.save);if(!b||s/n>b.s/b.n)store.set("best_"+Q.save,{s,n,pct:p});}
  if(Q.exam){const prev=store.get("exam",null);if(!prev||p>prev.pct)store.set("exam",{pct:p,s,n})}
  const C=2*Math.PI*74,col=p>=PASS?"var(--acc)":p>=70?"var(--amb)":"var(--bad)";
  const passed=Q.exam?p>=70:p>=PASS;stopReward();

  <div class="grade">${gradeOf(p)}</div><p>${p>=PASS?(Q.exam?"Матеріал засвоєно впевнено.":"Заняття засвоєно. Можна переходити до наступного."):`Для засвоєння потрібно ${PASS}%. Перегляньте помилки й спробуйте ще раз.`}</p><div class="cta">`;
  if(Q.wrong.length)h+=`<button class="btn fx p" id="rWrong">Повторити помилки (${Q.wrong.length})</button>`;
  h+=`<button class="btn fx" id="rAgain">Пройти ще раз</button>`;
  if(Q.save){const nx=T[T.indexOf(byId[Q.save])+1];if(nx&&p>=PASS)h+=`<button class="btn fx p" data-go="#${nx.id}">Наступне заняття →</button>`;else if(p<PASS)h+=`<button class="btn fx" data-go="#${Q.save}">Перечитати лекцію</button>`;else h+=`<button class="btn fx" data-go="#">До занять</button>`}
  else h+=`<button class="btn fx" data-go="#">До занять</button>`;
  h+=`</div>`;
  if(Q.exam){const agg={};Q.items.forEach(it=>{const a=agg[it.tid]||(agg[it.tid]={n:0,w:0});a.n++});Q.wrong.forEach(it=>agg[it.tid].w++);
    h+=`<div class="bytopic"><h3 style="font-size:18px;margin-bottom:6px">За заняттями</h3>${Object.entries(agg).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n).map(([id,a])=>`<div class="bt"><span>${esc(byId[id].short)}</span><span style="color:${a.w?"var(--bad)":"var(--ok)"}">${a.n-a.w}/${a.n}</span></div>`).join("")}</div>`}
  if(Q.wrong.length){h+=`<div class="mist"><h3>Розбір помилок</h3>${Q.wrong.map(it=>`<div class="mi">${Q.exam?`<div class="tp">${esc(byId[it.tid].short)}</div>`:""}<b>${esc(it.text)}</b><div class="ans">✓ ${esc(it.opts.find(o=>o.ok).o)}</div><div class="ex">${esc(it.ex)}</div></div>`).join("")}</div>`}
  h+=`</div>`;
  $("#quiz").innerHTML=h;bindGo();{const y=$("#quiz").getBoundingClientRect().top+scrollY-70;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}
  if(passed)rewardPass();else rewardFail();
  const cfg={title:Q.title,save:Q.save,exam:Q.exam};const wrong=Q.wrong.map(it=>({q:it.q,tid:it.tid,i:it.i}));const all=Q.all||Q.items.map(it=>({q:it.q,tid:it.tid,i:it.i}));
  const rw=$("#rWrong");if(rw)rw.onclick=()=>startQuiz({...cfg,save:null,items:wrong,exam:false});
  $("#rAgain").onclick=()=>Q.exam?renderExamStart(true):startQuiz({...cfg,items:all});
}

/* ---------- exam ---------- */
function renderExamStart(direct){
  S={view:"exam"};hidePlayer();
  const pool=[];T.forEach(t=>t.test.forEach((q,i)=>pool.push({q,tid:t.id,i})));
  const N=Math.min(30,pool.length);setHead("Підсумковий тест",N+" питань з усіх занять");
  const per=Math.max(1,Math.floor(N/T.length/2));
  let pickd=[];T.forEach(t=>{pickd.push(...shuffle(pool.filter(p=>p.tid===t.id)).slice(0,per))});
  const rest=shuffle(pool.filter(p=>!pickd.includes(p)));pickd=pickd.concat(rest.slice(0,Math.max(0,N-pickd.length)));
  if(!direct){
    $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Теоретична частина іспиту</span><h1>Підсумковий тест</h1><p>${N} випадкових питань з усіх ${T.length} відкритих занять. Підказки й пояснення — після завершення. Оцінка за Програмою курсу: 90% — відмінно, 80% — добре, 70% — задовільно, менше 70% — незадовільно.</p></div>
    <div class="cta" style="margin-top:22px"><button class="btn fx p" id="exGo">${icon("test")} Почати тест</button><button class="btn fx" data-go="#">До занять</button></div></div>`;
    bindGo();$("#exGo").onclick=()=>renderExamStart(true);return;
  }
  $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Підсумковий тест</span><h1>${N} питань</h1></div><div id="quiz" class="quiz"></div></div>`;
  startQuiz({title:"Тест",items:pickd,save:null,exam:true});Q.all=pickd;
}

function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}

async function saveFile(blob,name,desc,mime,ext){
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:desc,accept:{[mime]:["."+ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();return "saved"}
    catch(e){if(e&&e.name==="AbortError")return "cancel"}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return "saved";
}
async function busy(btn,label,fn){
  const t0=btn.textContent;btn.disabled=true;btn.textContent=label;
  try{const r=await fn();btn.textContent=r==="cancel"?t0:"Збережено ✓";if(r!=="cancel")setTimeout(()=>btn.textContent=t0,2500)}
  catch(e){console.error(e);btn.textContent="Не вдалося зберегти";setTimeout(()=>btn.textContent=t0,4000)}
  finally{btn.disabled=false}
}

function fmt2(x){return x.toFixed(2).replace(".",",")}
function calcSheet(type,st){
  const G=DATA.sheets[type];let total=0,rated=0,sum=0,starZero=[],plainZero=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{total++;const v=st.v[gi+"_"+ii];if(v===undefined)return;rated++;sum+=v;if(v===0){if(it.s)starZero.push(it.t);else plainZero++}}));
  const avg=rated?Math.round(sum/rated*100)/100:null;const reasons=[];
  if(starZero.length)reasons.push("0 у критичному пункті: "+starZero.join(", "));
  if(plainZero>5)reasons.push(`нулі у ${plainZero} звичайних пунктах (допустимо не більше 5)`);
  if(st.stop)reasons.push("заняття призупинено через порушення заходів безпеки");
  if(st.edip)reasons.push("порушено техніку EDIP");
  let verdict;if(reasons.length)verdict="не виконано";else if(avg===null)verdict="не оцінено";else if(rated<total)verdict=avg>=THR?"попередньо виконано":"попередньо не виконано";else verdict=avg>=THR?"виконано":"не виконано";
  return {total,rated,sum,avg,reasons,verdict,plainZero,starZero};
}
function paintSum(type,st){
  const r=calcSheet(type,st);const fail=r.reasons.length>0||(r.avg!==null&&r.avg<THR);
  const cls=r.avg===null&&!r.reasons.length?"wait":(fail?"no":"ok");
  const label=r.reasons.length?"Не виконано":r.avg===null?"Не оцінено":(r.rated<r.total?(r.avg>=THR?"Попередньо: виконано":"Попередньо: не виконано"):(r.avg>=THR?"Виконано":"Не виконано"));
  $("#sumbar").innerHTML=`<div class="in"><div class="avg">${r.avg===null?"—":fmt2(r.avg)}</div><div class="meta">середній бал · поріг 2,48<br>оцінено ${r.rated} з ${r.total}${r.rated<r.total?` · залишилось ${r.total-r.rated}`:""}</div><span class="vchip ${cls}">${label}</span></div>${r.reasons.length?`<div class="reasons">${r.reasons.map(esc).join(" · ")}</div>`:""}`;
  const fin=$("#final");if(!fin)return;const G=DATA.sheets[type];const weak=[];let n=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{n++;const v=st.v[gi+"_"+ii];if(v===0||v===1)weak.push([n,it.t,v,it.s])}));weak.sort((a,b)=>a[2]-b[2]);
  let why;
  if(r.avg===null&&!r.reasons.length)why="Ще не поставлено жодного балу. Почніть з першого пункту — підсумок з’явиться тут.";
  else if(r.reasons.length)why=`Заняття <b>не зараховано</b>, навіть якщо середній бал високий. Причина: ${r.reasons.map(esc).join("; ")}.`;
  else{const ok=r.avg>=THR;why=`Сума балів ${r.sum} ÷ оцінених пунктів ${r.rated} = <b>${fmt2(r.avg)}</b>. ${ok?"Це не менше порогу 2,48 — <b>виконано</b>.":"Це менше порогу 2,48 — <b>не виконано</b>."}`+(r.rated<r.total?` Оцінено не всі пункти (залишилось ${r.total-r.rated}), тому рішення попереднє.`:"")}
  fin.innerHTML=`<h2>Підсумок і розбір</h2><p>${why}</p>${weak.length?`<p><b>Над чим працювати</b> — пункти з оцінкою 0 і 1, з них почніть розбір (АПД):</p><ul>${weak.map(([n,t,v,st])=>`<li><b>${v}</b> — ${n}. ${esc(t)}${st?' <span style="color:var(--amb)">★</span>':""}</li>`).join("")}</ul>`:(r.rated?"<p>Пунктів з оцінкою 0 або 1 немає.</p>":"")}<p style="color:var(--muted);font-size:14px">У відомість записують бал і словесну оцінку, наприклад: «2,61 (виконано)».</p>`;
}

const isFile = location.protocol === "file:";
const swOK = "serviceWorker" in navigator && !isFile;
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const totalMB = Math.max(1, Math.round(ASSETS.reduce((a, x) => a + x[1], 0) / 1048576));
let OFF = {state: isFile ? "file" : "unknown", done: 0, bytes: 0};
let installEvt = null;
addEventListener("beforeinstallprompt", e => {e.preventDefault(); installEvt = e; renderOff();});
addEventListener("appinstalled", () => {installEvt = null; renderOff();});
if (swOK) { navigator.serviceWorker.register("sw.js").catch(() => {}); checkOffline(); }
async function checkOffline() {
  try { const c = await caches.open(CACHE); let miss = 0;
    for (const [p] of ASSETS) if (!(await c.match(p))) { miss++; break; }
    OFF.state = miss === 0 ? "ready" : (store.get("offline", false) ? "partial" : "none");
  } catch (e) { OFF.state = "none"; }
  renderOff();
}
async function downloadAll() {
  if (!swOK) return;
  OFF.state = "loading"; OFF.done = 0; OFF.bytes = 0; renderOff();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  try { const c = await caches.open(CACHE); let i = 0;
    const work = async () => { while (i < ASSETS.length) { const [p, b] = ASSETS[i++];
        if (!(await c.match(p))) { const r = await fetch(p, {cache: "reload"}); if (!r.ok) throw new Error(p); await c.put(p, r); }
        OFF.done++; OFF.bytes += b; paintProg(); } };
    await Promise.all([work(), work(), work(), work()]);
    store.set("offline", true); OFF.state = "ready";
  } catch (e) { OFF.state = "error"; }
  renderOff();
  if (OFF.state === "ready" && !isStandalone) setTimeout(() => openInstall(true), 400);
}
function paintProg() { const el = $("#offProg"); if (!el) return; el.style.width = (OFF.done / ASSETS.length * 100) + "%";
  const t = $("#offTxt"); if (t) t.textContent = `Завантажено ${Math.round(OFF.bytes / 1048576)} з ${totalMB} МБ · не закривайте сторінку`; }
const ICON = {
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>'
};
function renderOff() {
  const b = $("#dlBtn");
  if (b) { b.classList.toggle("ok", OFF.state === "ready" || OFF.state === "file"); b.classList.toggle("need", OFF.state === "none" || OFF.state === "partial"); }
  const box = $("#offCard"); if (!box) return;
  let h = ""; const qrb = `<button class="btn fx" onclick="openQR()">${ICON.qr} QR-код</button>`;
  if (OFF.state === "file") h = `<div class="off card done"><div class="oi">${ICON.ok}</div><div class="ot"><b>Офлайн-версія з флешки</b><span>Курс працює без інтернету на цьому комп’ютері.</span></div><div class="oa">${qrb}</div></div>`;
  else if (OFF.state === "loading") h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>Завантаження курсу…</b><span id="offTxt">Підготовка…</span><div class="pbar"><i id="offProg"></i></div></div></div>`;
  else if (OFF.state === "ready") { const inst = isStandalone ? "" : `<button class="btn fx p" onclick="openInstall()">${ICON.dl} Встановити як застосунок</button>`;
    h = `<div class="off card done"><div class="oi">${ICON.ok}</div><div class="ot"><b>Курс збережено на цьому пристрої</b><span>Лекції, озвучка, тести і тренажери працюють без інтернету.</span></div><div class="oa">${inst}${qrb}</div></div>`; }

}
function modal(html) { closeModal(); const m = document.createElement("div"); m.className = "mback"; m.id = "mback";
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="ib x" onclick="closeModal()" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal() { const m = $("#mback"); if (m) m.remove(); }
function openQR() { const share = navigator.share ? `<button class="btn fx" onclick="navigator.share({title:'КІБР',url:SITE}).catch(()=>{})">Поділитися</button>` : "";

function copyLink() { const done = () => { const b = $("#cpBtn"); if (b) b.textContent = "Скопійовано ✓"; }; if (navigator.clipboard) navigator.clipboard.writeText(SITE).then(done, () => {}); else done(); }
function openInstall(auto) {
  if (installEvt && auto === true) { modal(`<h2>Курс збережено ✓</h2><p>Лекції, озвучка і тести тепер працюють без інтернету. Додайте іконку курсу на екран, щоб відкривати його одним дотиком.</p><div class="mrow"><button class="btn fx p" onclick="closeModal();openInstall()">Встановити застосунок</button><button class="btn fx" onclick="closeModal()">Пізніше</button></div>`); return; }
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderOff(); }); return; }
  let steps;
  if (isIOS) steps = `<ol><li>Натисніть <b>«Поділитися»</b> (квадрат зі стрілкою) внизу Safari.</li><li>Оберіть <b>«На екран „Додому“»</b>.</li><li>Натисніть <b>«Додати»</b> — з’явиться іконка «КІБР».</li></ol>`;
  else if (/Android/i.test(ua)) steps = `<ol><li>Натисніть меню браузера <b>⋮</b> угорі праворуч.</li><li>Оберіть <b>«Встановити застосунок»</b> або <b>«Додати на головний екран»</b>.</li><li>Підтвердіть — з’явиться іконка «КІБР».</li></ol>`;
  else steps = `<ol><li>У Chrome або Edge натисніть значок <b>встановлення</b> праворуч в адресному рядку.</li><li>Підтвердіть <b>«Встановити»</b> — курс відкриватиметься окремим вікном, навіть без інтернету.</li></ol>`;
  modal(`<h2>Встановити як застосунок</h2><p>Додайте іконку, щоб відкривати курс одним дотиком.</p>${steps}<div class="mrow"><button class="btn fx p" onclick="closeModal()">Зрозуміло</button></div>`);
}
$("#qrBtn").onclick = openQR;
$("#docsBtn").onclick = () => go("#docs");
$("#dlBtn").onclick = () => {
  if (OFF.state === "ready") openInstall();
  else if (OFF.state === "file") modal(`<h2>Офлайн-версія</h2><p>Ви відкрили курс з флешки або папки — він уже працює без інтернету.</p><div class="mrow"><button class="btn fx p" onclick="closeModal()">Добре</button></div>`);
  else { if (S.view !== "home") go("#"); setTimeout(() => { const c = $("#offCard"); if (c) c.scrollIntoView({behavior: "smooth", block: "center"}); if (OFF.state !== "loading") downloadAll(); }, 60); }
};
