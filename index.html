<style>
@font-face{font-family:'Golos Text';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/golos-cyrillic-400.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/golos-cyrillic-500.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/golos-cyrillic-600.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/golos-cyrillic-700.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/golos-cyrillic-800.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}

@font-face{font-family:'Golos Text';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/golos-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Golos Text';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/golos-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

@font-face{font-family:'Golos Text';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/golos-latin-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root,:root[data-theme="dark"]{
  --bg:#070B12;--paper:#0D141F;--soft:#152030;--ink:#E4EEFA;--muted:#8B9CB4;--line:#1D2A3B;
  --acc:#22D3EE;--acc-soft:rgba(34,211,238,.11);--onacc:#03131A;--glow:0 0 0 1px rgba(34,211,238,.35),0 0 22px rgba(34,211,238,.22);
  --amb:#F5B83D;--hl:rgba(34,211,238,.09);--hl-bar:#22D3EE;--mag:#C08BFF;
  --ok:#34D399;--okbg:rgba(52,211,153,.12);--bad:#F87171;--badbg:rgba(248,113,113,.12);
  --shadow:none;--grid:rgba(34,211,238,.045);--r:14px;
}
:root[data-theme="light"]{
  --bg:#F2F5F9;--paper:#FFFFFF;--soft:#E8EEF5;--ink:#0B1422;--muted:#56677E;--line:#D8E0EA;
  --acc:#0789A6;--acc-soft:#DFF3F8;--onacc:#FFFFFF;--glow:0 1px 2px rgba(11,20,34,.08);
  --amb:#B26F0E;--hl:#E2F4F9;--hl-bar:#0789A6;--mag:#7C3AED;
  --ok:#0F8A5F;--okbg:#E3F4EC;--bad:#C2362F;--badbg:#FBE7E4;
  --shadow:0 1px 2px rgba(11,20,34,.05),0 6px 24px rgba(11,20,34,.06);--grid:rgba(7,137,166,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.55;min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;background-attachment:fixed}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
a{color:var(--acc)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.mark{width:36px;height:36px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.04em;flex:none;clip-path:polygon(0 0,78% 0,100% 22%,100% 100%,22% 100%,0 78%)}
.brand b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.brand small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.dl{position:relative}
.ib.dl .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--amb);display:none}
.ib.dl.need .dot{display:block}
.ib.dl.ok{color:var(--ok)}

/* cards / generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.off{margin:18px 0 0;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.off .oi{width:52px;height:52px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.off .oi svg{width:28px;height:28px}
.off .ot{flex:1;min-width:220px}
.off .ot b{display:block;font-size:18px;line-height:1.3}
.off .ot span{font-size:14px;color:var(--muted)}
.off .oa{display:flex;gap:8px;flex-wrap:wrap}
.off.done .oi{background:var(--okbg);color:var(--ok)}
.pbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* modal */
.mback{position:fixed;inset:0;z-index:50;background:rgba(2,6,12,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadeIn .15s}
@media (min-width:640px){.mback{align-items:center}}
.modal{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);max-height:90vh;overflow:auto;animation:up .2s}
.modal h2{font-size:22px;line-height:1.25;margin-bottom:6px}
.modal p{color:var(--muted);font-size:15px}
.modal .qr{background:#fff;border-radius:16px;padding:16px;margin:16px auto;width:min(300px,100%)}
.modal .qr svg{width:100%;height:auto;display:block}
.modal .url{font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:clamp(12px,3.4vw,15px)}
.modal .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .mrow .btn{flex:1;min-width:140px}
.modal ol{padding-left:22px;margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.modal .x{float:right;margin:-8px -8px 0 0}
@keyframes fadeIn{from{opacity:0}}
@keyframes up{from{transform:translateY(20px);opacity:.5}}
@keyframes blink{50%{opacity:0}}
/* home */
.hero{padding:34px 0 8px}
.eyebrow{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-size:clamp(48px,11vw,84px);line-height:.95;font-weight:800;letter-spacing:.04em;margin:10px 0 10px}
.hero h1 .cur{color:var(--acc);animation:blink 1.1s steps(1) infinite}
.hero p{color:var(--muted);max-width:620px}
.hero .lead{font-size:20px;font-weight:600;margin:-2px 0 10px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.stat{padding:14px 16px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--acc);opacity:.7}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.btn{height:48px;padding:0 20px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:var(--glow)}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{height:38px;padding:0 14px;font-size:15px;border-radius:10px}
.btn svg{width:18px;height:18px}
.note{margin-top:14px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--ink)}
.mod{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
.mod h2{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mod:after{content:"";flex:1;height:1px;background:var(--line)}
.blockh{margin:34px 0 4px;font-size:22px;font-weight:800;letter-spacing:.01em}
.blockh small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.row:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.num{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .num{background:var(--acc);color:var(--onacc)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;line-height:1.3}
.row .t span{font-size:14px;color:var(--muted)}
.row .t .code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--acc);letter-spacing:.04em}
.row.soon{opacity:.55;cursor:default;box-shadow:none;background:transparent;padding:8px 14px;border-style:dashed}
.row.soon .num{width:28px;height:28px;background:transparent}
.row.soon .t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row.soon .t b{font-weight:500;font-size:16px}
.list .row.soon+.row.soon{margin-top:-4px}
.row.tool .num{background:var(--acc-soft);color:var(--acc)}
.row.tool .num svg{width:20px;height:20px}
.badge{flex:none;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--acc-soft);color:var(--acc)}
.badge.low{background:rgba(245,184,61,.14);color:var(--amb)}
.exam{margin-top:30px;border:1px solid var(--acc);background:linear-gradient(135deg,var(--acc-soft),transparent 70%);border-radius:18px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.exam div{flex:1;min-width:220px}
.exam b{font-size:21px;display:block}
.exam span{color:var(--muted);font-size:15px}
.foot{margin:36px 0 40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* topic */
.thead{padding:26px 0 6px}
.thead .eyebrow{display:block;margin-bottom:6px}
.thead h1{font-size:clamp(26px,5vw,36px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
.thead p{color:var(--muted);font-size:15px;margin-top:6px}
.pass{margin-top:16px;padding:16px 18px}
.pass .goal{font-weight:600;line-height:1.45}
.pass .goal small,.pass dt{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.pass details{margin-top:10px}
.pass summary{cursor:pointer;color:var(--muted);font-size:15px;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.pass summary::-webkit-details-marker{display:none}
.pass summary:before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--acc);font-weight:800}
.pass details[open] summary:before{content:"–"}
.pass dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:12px;font-size:15px}
.pass dl div.w{grid-column:1/-1}
.pass dd ol{padding-left:20px}
@media (max-width:560px){.pass dl{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tab{height:40px;padding:0 18px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:var(--glow)}
.lec{padding-bottom:150px}
.sec{margin-top:30px}
.sec h2{font-size:23px;line-height:1.25;font-weight:700;margin-bottom:10px;scroll-margin-top:90px}
.blk{border-radius:10px;padding:6px 12px;margin:0 -12px 6px;transition:background .25s;cursor:pointer;scroll-margin-top:110px;position:relative}
.blk:hover{background:var(--soft)}
.blk.now{background:var(--hl)}
.blk.now:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--hl-bar);box-shadow:0 0 10px var(--hl-bar)}
.sec ul{list-style:none;margin:2px 0 8px}
.sec li.blk{padding-left:34px}
.sec li.blk:after{content:"";position:absolute;left:15px;top:.95em;width:7px;height:7px;transform:rotate(45deg);background:var(--acc)}
.sec li.blk.now:before{left:0}
.callout{background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:12px;padding:14px 16px;margin:8px 0 10px;font-weight:500}
.callout small{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.callout.warn{background:rgba(245,184,61,.10);border-color:rgba(245,184,61,.35)}
.callout.warn small{color:var(--amb)}
.keys{margin-top:40px;padding:20px 22px}
.keys h2{font-size:20px;margin-bottom:10px}
.keys ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.keys .btn{margin-top:16px}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.pl{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:10px 12px 12px}
.pl .bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;cursor:pointer;margin:2px 4px 8px}
.pl .bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;box-shadow:0 0 8px var(--acc)}
.pl .ctr{display:flex;align-items:center;gap:6px}
.play{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none;box-shadow:var(--glow)}
.play svg{width:24px;height:24px}
.pl .info{flex:1;min-width:0;padding:0 6px}
.pl .info b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .info span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spd{height:36px;min-width:52px;padding:0 10px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* test */
.quiz{padding:10px 0 60px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.qprog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:22px}
.qprog i{display:block;height:100%;background:var(--acc)}
.qtext{font-size:clamp(21px,4vw,26px);line-height:1.3;font-weight:700;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:13px 14px;line-height:1.4;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#04130C}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#1A0606}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);color:var(--onacc)}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:4px solid;line-height:1.45}
.verdict.ok{border-color:var(--ok);background:var(--okbg)}
.verdict.no{border-color:var(--bad);background:var(--badbg)}
.verdict b{display:block;margin-bottom:2px}
.qnext{margin-top:18px;display:flex;justify-content:flex-end}
.res{text-align:center;padding:30px 0 10px}
.ring{width:170px;height:170px;margin:0 auto 14px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .v span{font-size:14px;color:var(--muted)}
.grade{font-size:24px;font-weight:800}
.res p{color:var(--muted);margin-top:4px}
.res .cta{justify-content:center}
.mist{margin-top:30px;text-align:left}
.mist h3{font-size:18px;margin-bottom:10px}
.mi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.mi b{display:block;line-height:1.35}
.mi .ans{color:var(--ok);font-weight:600;margin-top:6px}
.mi .ex{color:var(--muted);font-size:15px;margin-top:4px}
.mi .tp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.bytopic{margin-top:22px;text-align:left}
.bt{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bt span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* оціночний лист */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.seg button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{border-color:var(--acc);color:var(--ink);box-shadow:var(--glow)}
.how{margin:14px 0 4px;padding:16px 18px}
.how summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.how summary::-webkit-details-marker{display:none}
.how summary .q{width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.how summary .ch{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
@media (max-width:560px){.how summary .ch{display:none}}
.how .hb{margin-top:12px;font-size:16px;display:flex;flex-direction:column;gap:12px}
.how .scale{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.how .scale b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:16px}
.how .scale span{padding-top:5px}
.how .rule{border-left:3px solid var(--bad);padding:2px 0 2px 12px}
.how .rule ul{padding-left:20px;margin-top:4px}
.how .ex{font-size:15px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.fields label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.fields input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.grp{margin-top:26px}
.grp h3{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.crit{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:8px}
.crit .ct{flex:1;min-width:0}
.crit .ct b{display:block;line-height:1.3}
.crit .ct b .st{color:var(--amb);font-size:13px;font-weight:700;margin-left:6px;white-space:nowrap}
.crit .ct span{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.crit.zero{border-color:var(--bad)}
.crit.star.zero{background:var(--badbg)}
.sc{display:flex;gap:4px;flex:none}
.sc button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.sc button.on[data-v="3"]{background:var(--ok);border-color:var(--ok);color:#04130C}
.sc button.on[data-v="2"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.sc button.on[data-v="1"]{background:var(--amb);border-color:var(--amb);color:#1A1203}
.sc button.on[data-v="0"]{background:var(--bad);border-color:var(--bad);color:#1A0606}
@media (max-width:560px){.crit{flex-direction:column}.sc{align-self:stretch}.sc button{flex:1;height:44px}}
.flags{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.flag input{width:22px;height:22px;accent-color:var(--bad);flex:none}
.flag span{font-weight:600}
.flag small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.sumbar{position:sticky;bottom:0;z-index:15;margin:24px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sumbar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sumbar .avg{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.sumbar .meta{flex:1;min-width:150px;font-size:14px;color:var(--muted);line-height:1.35}
.vchip{font-weight:800;padding:8px 14px;border-radius:10px;font-size:15px;white-space:nowrap}
.vchip.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.vchip.no{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.vchip.wait{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.reasons{font-size:14px;color:var(--bad);margin-top:6px}
/* тренажери */
.tr{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.fld{padding:14px 16px}
.fld label{display:block;font-weight:700;margin-bottom:2px}
.fld .hint{font-size:14px;color:var(--muted);margin-bottom:8px}
.fld textarea{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:10px 12px;resize:vertical;line-height:1.45}
.chk{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.chk li{display:flex;gap:8px;align-items:flex-start}
.chk li i{flex:none;font-style:normal;font-weight:800;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;margin-top:1px}
.chk li.y i{background:var(--okbg);color:var(--ok)}
.chk li.n i{background:rgba(245,184,61,.15);color:var(--amb)}
.chk li.x i{background:var(--badbg);color:var(--bad)}
.scen{padding:16px 18px}
.scen h3{font-size:17px;margin:12px 0 6px}
.scen h3:first-child{margin-top:0}
.tl{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:10px}
.tl li b{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acc);font-size:14px;padding-top:1px}
.model{margin-top:10px;border-left:3px solid var(--ok);padding:6px 0 6px 12px;font-size:15px}
.model small{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.kp{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.kp input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}

@media (max-width:560px){
  body{font-size:17px}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:22px}
  .row{padding:12px;gap:12px}.num{width:34px;height:34px;font-size:13px}
  .hide-sm{display:none}
}
</style>

<script>
const DATA = {"topics": [{"id": "b1m2t1z2", "code": "Б1 М2 Т1 З2", "theme": "Тема 1. Форми та методи навчання, методика викладання", "title": "Методика викладання EDIP", "short": "Методика EDIP", "passport": {"goal": "Довести курсантам порядок проведення занять за методикою EDIP (Explanation – Demonstration – Imitation – Practice).", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Суть та принципи методики EDIP", "Порядок практичного використання методики EDIP"], "assess": "Усні запитання під час і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 1.2; план-конспект; презентація"}, "sections": [{"h": "Що таке EDIP", "body": [["p", "EDIP — це сукупність дій інструктора та курсантів для набуття знань, умінь і навичок. Метод розробив у 1919 році Чарльз Р. Аллен, один із засновників професійної освіти в США. Це чотириетапний метод навчання, створений для швидкого засвоєння практичних завдань."], ["p", "Назва складається з перших літер чотирьох етапів: <b>Explain — пояснюй</b>, <b>Demonstrate — показуй</b>, <b>Imitate — повторюй</b>, <b>Practise — практикуй</b>. Вивчення кожної теми ділиться саме на ці чотири етапи."], ["p", "Методика вирізняється виключною ефективністю й успішно використовується в арміях США, Великої Британії, Канади, Польщі, Литви, Латвії, Естонії та інших країн. Особливо добре вона підходить для навчання практичним навичкам у технічній, військовій і професійній підготовці."], ["key", "EDIP = Пояснення → Демонстрація → Імітація → Практика. Чотири етапи, які ведуть курсанта від «чую» до «вмію сам»."]]}, {"h": "E — Explanation, пояснення", "body": [["p", "<b>Мета етапу</b> — дати теоретичне розуміння навички або завдання, яке потрібно опанувати."], ["p", "Пояснення — це дія, під час якої інструктор пояснює матеріал, зокрема відповідає на запитання курсантів. Пояснення застосовують і на теоретичних, і на практичних заняттях, якщо практичне заняття не є перевірочним чи контрольним."], ["ul", ["пояснює, що саме буде вивчатися;", "розповідає, чому це важливо;", "дає загальний огляд процесу або навички."]], ["p", "Наприклад: лекційні заняття з будь-якої дисципліни — від статутів до вогневої та тактичної підготовки."]]}, {"h": "D — Demonstration, демонстрація", "body": [["p", "<b>Мета етапу</b> — показати правильне виконання дії або навички."], ["p", "Демонстрація — це дія, під час якої інструктор показує курсантам ту чи іншу дію або наочні приклади. Її використовують і на теоретичних, і на практичних заняттях."], ["ul", ["показує процес на обладнанні або макеті;", "демонструє і повільно, і в нормальному темпі;", "коментує, вказуючи на критичні моменти."]], ["p", "Наприклад: на лекції з вогневої підготовки будову автомата АК-74 показують на зображеннях або на деталях, викладених перед курсантами. На тактичній підготовці переміщення на полі бою показують на схемах, відео або наочно — силами демогрупи."], ["warn", "Демонстрація має бути зразковою й безпомилковою. Курсант повторить саме те, що побачив, — разом із помилками інструктора."]]}, {"h": "I — Imitation, імітація", "body": [["p", "<b>Мета етапу</b> — курсант повторює дії за інструктором і отримує навичку шляхом копіювання та відпрацювання."], ["p", "Імітацію зазвичай використовують на практичних заняттях. Дії виконуються повільно і правильно — курсантів навчають саме правильності дій. Інструктор коментує й коригує кожного."], ["p", "Відпрацювання йде від простого до складного, у три фази:"], ["ul", ["<b>«Роби, як я»</b> — інструктор поступово виконує кожен елемент і пояснює його. За командою «Дивись!» курсанти спостерігають, за командою «Роби!» — повторюють. Ця фаза потрібна, коли матеріал має багато елементів або курсанти вперше працюють зі зброєю.", "<b>«Роби по кроках (за командами)»</b> — дія розбивається на етапи. Наприклад, перевірка зброї на розрядженість: «Перше: перевідник вогню в крайнє нижнє положення, затворну раму в крайнє заднє положення. Роби!». Курсант не переходить до наступного кроку, поки не виконує попередній чітко і без помилок.", "<b>«Роби в цілому»</b> — курсант виконує всю дію від початку до кінця. Тим, хто ще не готовий, інструктор приділяє увагу індивідуально, решті подає команду «Виконуйте самостійно!»."]], ["p", "Наприклад: курсанти розбирають автомат слідом за інструктором — інструктор від’єднує кришку ствольної коробки, курсанти роблять те саме."], ["key", "Імітація: задіяний 100% особового складу, інструктор контролює кожного й одразу виправляє помилки."]]}, {"h": "P — Practice, практика", "body": [["p", "<b>Мета етапу</b> — дати курсанту можливість закріпити навичку самостійною практикою."], ["p", "Практика — це дія, під час якої курсанти самостійно виконують дії в умовах, максимально наближених до реальних. Коментарі інструктора лунають лише тоді, коли це не перевірочне і не контрольне заняття. Спочатку дії виконують повільно, потім поступово нарощують темп."], ["ul", ["самостійно виконує навичку багаторазово;", "вдосконалює точність, швидкість, автоматизм;", "отримує зворотний зв’язок після виконання."]], ["p", "Наприклад: розбирання автомата на час, виконання тактичних прийомів самостійно або у складі підрозділу."]]}, {"h": "Як застосовувати EDIP на практиці", "body": [["p", "Інструктор поступово нарощує рівень знань і вмінь курсантів, не перевантажуючи їх інформацією. Переходячи до наступного елементу, він упевнений, що попередній матеріал засвоєно."], ["p", "Наприклад, під час вивчення автомата курсанти спочатку вивчають його призначення і ТТХ, потім будову та роботу частин і механізмів, далі вчаться розбирати і збирати — і лише після цього допускаються до стрільби."], ["p", "Для ефективного EDIP важливо правильно розподілити час заняття:"], ["ul", ["<b>вступна частина — 10%</b>, основна — <b>80%</b>, заключна — <b>10%</b>;", "в основній частині: пояснення — <b>10%</b>, демонстрація — <b>15%</b>, імітація — <b>25%</b>, практика — <b>не менше 50%</b>."]], ["key", "Максимум часу — на практику. Половина основної частини заняття і більше — це самостійне відпрацювання."], ["warn", "За оціночним листом порушення техніки EDIP під час проведення заняття означає оцінку «незадовільно» за все заняття."]]}, {"h": "Переваги методики", "body": [["ul", ["проста в застосуванні;", "забезпечує ефективне засвоєння нових навичок;", "легко масштабується на групу будь-якого розміру;", "добре підходить для процедурних дій — зброя, медицина, інженерна справа, тактичні прийоми."]], ["p", "Недолік практичного методу один: курсанти можуть почуватися надто керованими й менше проявляти себе індивідуально. Тому фази імітації інструктор комбінує й змінює залежно від заняття — не обов’язково використовувати всі три на кожному."], ["p", "Завдання на самостійну підготовку: ознайомитися з методами проведення занять — бінарна лекція, рольові ігри, проблемна лекція."]]}], "keys": ["EDIP — Explanation, Demonstration, Imitation, Practice: пояснення, демонстрація, імітація, практика.", "Метод розробив Чарльз Р. Аллен у 1919 році; використовується в арміях НАТО.", "Імітація має три фази: «роби, як я», «роби по кроках», «роби в цілому».", "Час основної частини: пояснення 10%, демонстрація 15%, імітація 25%, практика не менше 50%.", "Вступна і заключна частини — по 10% часу заняття, основна — 80%.", "Порушення техніки EDIP — підстава для оцінки «незадовільно» за проведене заняття."], "test": [["Що означає абревіатура EDIP?", ["Explanation – Demonstration – Imitation – Practice", "Education – Discipline – Instruction – Practice", "Explanation – Discussion – Inspection – Performance", "Exercise – Demonstration – Instruction – Planning"], "EDIP — пояснення, демонстрація, імітація, практика."], ["Хто і коли розробив принцип EDIP?", ["Чарльз Р. Аллен, 1919 рік", "Бенджамін Блум, 1956 рік", "Абрахам Маслоу, 1943 рік", "Генеральний штаб ЗСУ, 2019 рік"], "Принцип EDIP розробив Чарльз Р. Аллен у 1919 році."], ["Скільки етапів має методика EDIP?", ["Чотири", "Три", "П’ять", "Шість"], "Кожна літера назви — окремий етап: E, D, I, P."], ["Яка мета етапу «Пояснення»?", ["Дати теоретичне розуміння навички, яку треба опанувати", "Показати правильне виконання дії", "Закріпити навичку самостійною практикою", "Перевірити знання курсантів"], "Пояснення дає теоретичну основу: що вивчаємо, чому це важливо, як виглядає процес загалом."], ["Яка мета етапу «Демонстрація»?", ["Показати правильне виконання дії або навички", "Пояснити теорію", "Дати курсантам повторити дію", "Оцінити курсантів"], "На демонстрації інструктор показує, як правильно."], ["Як інструктор проводить демонстрацію?", ["Повільно і в нормальному темпі, коментуючи критичні моменти", "Лише в бойовому темпі, щоб показати реальну швидкість", "Мовчки, щоб не відволікати", "Тільки на відео"], "Показ і повільно, і в нормальному темпі, з коментарями до критичних моментів."], ["На якому етапі курсанти повторюють дії слідом за інструктором?", ["Імітація", "Пояснення", "Демонстрація", "Практика"], "Імітація — повторення за інструктором, повільно і правильно."], ["Які три фази має імітація?", ["«Роби, як я», «роби по кроках», «роби в цілому»", "«Слухай», «дивись», «запам’ятовуй»", "Вступ, основна частина, висновок", "Теорія, показ, контроль"], "Відпрацювання йде від простого до складного у три фази."], ["Коли особливо доречна фаза «Роби, як я»?", ["Коли курсанти вперше виконують дії зі зброєю або матеріал має багато елементів", "На контрольному занятті", "Коли курсанти вже впевнено виконують дію", "Лише на теоретичних заняттях"], "Інструктор виконує кожен елемент і пояснює його, курсанти повторюють."], ["Що відбувається у фазі «Роби по кроках»?", ["Дія розбивається на етапи; курсант не переходить далі, поки не виконає попередній без помилок", "Курсант виконує всю дію від початку до кінця на час", "Інструктор мовчки показує дію", "Курсанти обговорюють дію в групах"], "Наприклад, перевірка зброї на розрядженість виконується за командами, крок за кроком."], ["Чим практика відрізняється від імітації?", ["Курсанти виконують дії самостійно в умовах, наближених до реальних", "Інструктор виконує дію разом з курсантами", "Курсанти лише спостерігають", "Практика проводиться тільки в класі"], "На практиці курсант діє сам, багаторазово, з нарощуванням темпу."], ["Коли на етапі практики інструктор не коментує дії курсантів?", ["Коли заняття перевірочне або контрольне", "Ніколи не коментує", "Завжди коментує кожну дію", "Лише вночі"], "На перевірочному і контрольному заняттях курсант працює без підказок."], ["Який розподіл часу між частинами заняття рекомендовано?", ["Вступна 10%, основна 80%, заключна 10%", "Вступна 30%, основна 40%, заключна 30%", "Вступна 20%, основна 60%, заключна 20%", "Вступна 5%, основна 90%, заключна 5%"], "Основна частина — 80% часу, вступна і заключна — по 10%."], ["Скільки часу основної частини має займати практика?", ["Не менше 50%", "10%", "15%", "25%"], "Практиці віддається максимум часу — не менше половини основної частини."], ["Скільки часу основної частини відводиться на демонстрацію?", ["15%", "50%", "25%", "10%"], "Пояснення 10%, демонстрація 15%, імітація 25%, практика не менше 50%."], ["Скільки часу основної частини відводиться на імітацію?", ["25%", "10%", "15%", "50%"], "Імітація — 25% часу основної частини."], ["Яка послідовність вивчення автомата відповідає логіці EDIP?", ["Призначення і ТТХ → будова → розбирання і збирання → стрільба", "Стрільба → будова → ТТХ", "Розбирання → стрільба → ТТХ", "Будова → стрільба → призначення"], "Кожен наступний елемент — лише після засвоєння попереднього."], ["Що буде з оцінкою за проведене заняття, якщо курсант-інструктор порушив техніку EDIP?", ["Незадовільно", "Знизиться на один бал", "Нічого, якщо інші пункти виконано", "Задовільно"], "Порушення техніки EDIP за оціночним листом — це «незадовільно» за все заняття."]]}, {"id": "b1m2t4z1", "code": "Б1 М2 Т4 З1", "theme": "Тема 4. Організація та проведення занять", "title": "Опис цілі", "short": "Опис цілі", "passport": {"goal": "Довести військовослужбовцям важливість та порядок опису цілі навчання.", "time": "3 години (180 хв)", "method": "Інтерактивна лекція — 50%, практичне заняття — 50%; навчальний клас", "questions": ["Важливість опису цілі", "Порядок опису цілі навчання", "Таксономія Блума", "Порядок визначення навчальних цілей"], "assess": "Практично, письмово, індивідуально — завдання в кінці заняття.", "criteria": "Позитивно — якщо самостійно склав опис цілі згідно з вивченим алгоритмом.", "sources": "Програма, розд. 7.1.1.2 і додаток 3.6; ДМ до СТІ 132Г.42К(Н), п. 4.1; план-конспект; презентація; зразки опису цілі"}, "sections": [{"h": "Що таке ціль заняття", "body": [["p", "Ціль заняття — це запланований результат, якого інструктор прагне досягти. Це орієнтир для інструктора і курсантів: він допомагає спланувати зміст, методи та форми роботи, а потім оцінити ефективність заняття."], ["p", "Простими словами, ціль — це те, що курсанти повинні <b>знати, вміти або розуміти</b> після завершення заняття. Кожне заняття, кожна тема, предмет і навіть увесь курс мають свою мету навчання."], ["p", "За характером цілі бувають:"], ["ul", ["<b>навчальні (дидактичні)</b> — засвоєння нових знань, умінь і навичок;", "<b>розвиваючі</b> — розвиток мислення, творчих здібностей, самостійності;", "<b>виховні</b> — формування цінностей, моральних якостей, патріотизму."]]]}, {"h": "Чому ціль має бути зрозумілою", "body": [["p", "Зрозуміла ціль заняття завжди мотивує. Якщо військовослужбовець бере участь у занятті, ціль якого йому незрозуміла, він швидко стає неуважним, розгубленим і пасивним — думає про що завгодно, крім заняття."], ["p", "Коли курсанти розуміють, що вони знатимуть і вмітимуть наприкінці, вони краще співпрацюють з інструктором, щоб цієї цілі досягти. Інструктор може написати ціль на дошці або роздати картки з ціллю заняття."], ["key", "Ціль має відображати ті навички, які курсанти повинні будуть показати в кінці заняття. Навчання має сенс, коли курсант засвоїв матеріал і може виконати поставлену ціль."]]}, {"h": "Чотири складові опису цілі", "body": [["p", "Опис цілі складається з чотирьох елементів. Саме за цією схемою заповнюється розділ «Опис цілі (мети)» в план-конспекті:"], ["ul", ["<b>Ціль</b> — що курсант повинен знати або вміти після заняття;", "<b>Вимоги</b> — що курсант повинен буде виконати в кінці заняття;", "<b>Умови та обставини</b> — за яких умов курсант виконуватиме завдання;", "<b>Критерії оцінювання</b> — наскільки добре треба виконати завдання."]], ["key", "Ціль → Вимоги → Умови та обставини → Критерії. Результат заняття має бути вимірюваним, тобто таким, що його можна перевірити."]]}, {"h": "Вимоги: тільки вимірювані дієслова", "body": [["p", "Формулюючи ціль і вимоги, вживайте слова, що означають конкретні, перевірювані дії. Те, що не можна виміряти, перевірити неможливо."], ["p", "<b>Для теоретичного заняття</b> відповідні вимоги: написати, назвати, визначити, вибрати, впізнати, дати визначення. Невідповідні: бути здатним, вияснити, зрозуміти, повірити, інформувати."], ["p", "<b>Для практичного заняття</b> відповідні вимоги: з’єднати, розібрати, перев’язати, викопати, виконати, описати. Невідповідні: буде знати, повірить, відчує."], ["warn", "Неприйнятні в описі цілі слова: «зрозуміє», «повірить», «переконається», «відчує», «спробує». Інструктор не зможе перевірити, чи це сталося."], ["p", "Приклад: замість «курсанти знатимуть про іммобілізацію» — «кожен курсант вмітиме іммобілізувати нижню кінцівку». Тепер інструктор точно знає, що курсанти мають уміти накласти шину, а не лише розповісти про неї."]]}, {"h": "Умови та обставини", "body": [["p", "Умови та обставини відповідають на запитання: <b>де? коли? яким чином? за допомогою чого?</b> Вони визначають, чи виконує курсант завдання сам чи з іншими, своїм матеріалом чи спеціально виділеним, вдень чи вночі."], ["p", "Види умов і приклади:"], ["ul", ["<b>Обмеження</b> — обмежують можливості: тільки з холостими боєприпасами; з бойовими боєприпасами.", "<b>Екіпіровка</b> — засоби, одяг, механізми, які можна або не можна використовувати: тільки предмети зі списку; в протигазі; з біноклем.", "<b>Місце, час і кліматичні умови</b>: у будь-яких кліматичних умовах; вдень або вночі; у класі; на ділянці місцевості.", "<b>Підручні засоби</b> — посібники, карти, інструкції: за допомогою словника; самостійно, без підручних засобів; без бінокля.", "<b>Вид виконання</b>: індивідуально; в парах або в групі; бігом; повзком; із зав’язаними очима."]]]}, {"h": "Критерії оцінювання", "body": [["p", "Критерії визначають якість виконання — наскільки добре курсант має виконати завдання."], ["ul", ["критерії повинні містити <b>мінімальні</b> вимоги, за яких курсант у реальних обставинах виконає завдання достатньо добре;", "критерії повинні бути <b>реальними</b> для виконання."]], ["p", "Відповідні критерії: «в правильній послідовності», «без помилок, згідно з інструкцією», «допустима похибка ±2 см», «допускається не більше однієї помилки», «не довше 2 хвилин»."], ["p", "Невідповідні критерії: «7 хвилин», «9 метрів», «щоб гарно виглядало», «швидко». «7 хвилин» означає рівно сім — ні секундою більше чи менше. А що таке «гарно» чи «швидко» в уяві інструктора, курсант знати не може."], ["key", "Критерій — це межа: «не більше», «не довше», «з похибкою до». Не точна цифра і не оцінне слово."]]}, {"h": "Приклади правильного опису цілі", "body": [["p", "<b>Знання.</b> Ціль: ознайомити військовослужбовців з історією української миротворчої місії в Іраку. Вимоги: кожен курсант повинен знати основні дати, райони та цілі направлення контингенту. Умови: письмово в аудиторії, в кінці заняття, 5 хвилин, бланк і ручка, без конспекту; тест із 5 питань. Критерії: 5 правильних — «відмінно», 4 — «добре», 3 — «задовільно», 2 і менше — «незадовільно»."], ["p", "<b>Навичка.</b> Ціль: навчити курсантів вимірювати дистанцію кроками. Вимоги: кожен курсант вимірює дистанцію парами кроків на різній місцевості з обмундируванням. Умови: ділянка дороги 100 м, вдень, без допоміжних засобів вимірювання. Критерії: «виконано» — похибка не більше 5 м; «не виконано» — використовував допоміжні засоби або похибка більше 5 м."], ["p", "<b>Навичка.</b> Ціль: навчити іммобілізації нижньої кінцівки при закритому переломі підручними засобами. Вимоги: кожен курсант іммобілізує нижню кінцівку. Умови: підручними засобами, на ділянці місцевості, протягом 10 хвилин. Критерії: «виконано» — кінцівку іммобілізовано правильно і в межах часу."]]}, {"h": "Таксономія Блума", "body": [["p", "Таксономія Блума — ієрархічна класифікація навчальних цілей у пізнавальній сфері, яку запропонував у 1956 році американський психолог Бенджамін Блум. Вона допомагає вибрати правильне дієслово для вимог — від простого запам’ятовування до створення нового."], ["ul", ["<b>Знання</b> — запам’ятовування і відтворення термінів, фактів, правил, процедур;", "<b>Розуміння</b> — пояснити, переказати своїми словами, перевести з однієї форми в іншу (з тексту в схему), спрогнозувати наслідки;", "<b>Застосування</b> — використати вивчене в конкретних умовах і нових ситуаціях;", "<b>Аналіз</b> — виділити частини цілого, побачити зв’язки між ними, помилки в логіці, різницю між фактами й наслідками;", "<b>Синтез</b> — скомбінувати елементи в нове ціле: план дій, повідомлення, схему;", "<b>Оцінювання</b> — оцінити значення матеріалу для конкретної мети на основі чітких критеріїв."]], ["key", "Чим вищий рівень за Блумом, тим складніше завдання. Для базового солдата здебільшого достатньо знання, розуміння і застосування."]]}, {"h": "Порядок визначення навчальних цілей", "body": [["p", "Визначаючи навчальні цілі, інструктор зазвичай дотримується такого порядку:"], ["ul", ["визначає, що курсанти повинні знати, вміти або розуміти після заняття — конкретний очікуваний результат;", "враховує навчальну програму і попередній рівень підготовки курсантів — цілі мають бути досяжними;", "формулює ціль чітко, дієсловами дії: пояснити, виконати, продемонструвати, розпізнати;", "визначає, які попередні знання й уміння потрібні для досягнення цілі;", "планує методи, обладнання і форми роботи;", "визначає критерії, за якими оцінюватиме досягнення цілі;", "доводить ціль до курсантів на початку заняття, щоб вони розуміли, чого від них очікують."]], ["p", "Практична частина заняття: курсанти тренуються складати опис цілі для своїх тем. Спробуйте це у вкладці «Практика» — тренажер опису цілі."]]}], "keys": ["Ціль — те, що курсант повинен знати або вміти після заняття.", "Опис цілі: ціль, вимоги, умови та обставини, критерії оцінювання.", "Вимоги формулюються вимірюваними дієсловами: назвати, розібрати, перев’язати — не «зрозуміє» чи «відчує».", "Умови та обставини відповідають на запитання: де? коли? яким чином? за допомогою чого?", "Критерії — мінімальні й реальні: «не довше 2 хв», «не більше однієї помилки».", "Таксономія Блума: знання, розуміння, застосування, аналіз, синтез, оцінювання."], "test": [["Що таке ціль заняття?", ["Запланований результат: що курсант повинен знати або вміти після заняття", "Тема заняття, записана в розкладі", "Перелік матеріального забезпечення", "Час, відведений на заняття"], "Ціль — орієнтир і запланований результат заняття."], ["З яких складових складається опис цілі?", ["Ціль, вимоги, умови та обставини, критерії оцінювання", "Тема, мета, час, місце", "Вступ, основна частина, заключна частина", "Пояснення, демонстрація, імітація, практика"], "Чотири елементи опису цілі в план-конспекті."], ["Що описується у «вимогах»?", ["Що курсант повинен буде виконати в кінці заняття", "Де і коли проводиться заняття", "Наскільки добре треба виконати завдання", "Яке обладнання потрібне інструктору"], "Вимоги — конкретна дія, яку курсант покаже наприкінці."], ["Що визначають критерії оцінювання?", ["Наскільки добре треба виконати завдання", "Де виконується завдання", "Яку тему вивчають", "Хто проводить заняття"], "Критерії — про якість виконання."], ["На які запитання відповідає опис умов та обставин?", ["Де? Коли? Яким чином? За допомогою чого?", "Хто? Навіщо? Скільки коштує?", "Чому? Для кого? Що далі?", "Яка оцінка? Скільки балів?"], "Умови та обставини описують середовище виконання завдання."], ["Яке формулювання вимоги для практичного заняття правильне?", ["Кожен курсант вмітиме іммобілізувати нижню кінцівку", "Курсанти зрозуміють важливість іммобілізації", "Курсанти відчують відповідальність", "Курсанти повірять у силу медицини"], "Вимога має бути вимірюваною дією, яку можна перевірити."], ["Яке з дієслів НЕ підходить для опису вимог?", ["Зрозуміти", "Назвати", "Розібрати", "Перев’язати"], "«Зрозуміти» неможливо виміряти, тому воно невідповідне."], ["Які дієслова відповідні для теоретичного заняття?", ["Написати, назвати, визначити, вибрати, впізнати", "Зрозуміти, повірити, відчути", "Бути здатним, вияснити, інформувати", "Спробувати, переконатися, усвідомити"], "Для теорії — дії, які можна перевірити письмово чи усно."], ["Який критерій оцінювання сформульовано правильно?", ["Не довше 2 хвилин", "7 хвилин", "Швидко", "Щоб гарно виглядало"], "Критерій задає межу. «7 хвилин» означає рівно сім, а «швидко» і «гарно» — неперевірювані."], ["Чому критерій «9 метрів» некоректний?", ["Він означає рівно 9 метрів — ні більше, ні менше", "Бо метри не використовуються у ЗСУ", "Бо відстань завжди треба вказувати в кроках", "Він коректний"], "Правильно: «з похибкою не більше…» або «не менше…»."], ["Якими мають бути критерії оцінювання?", ["Мінімальними й реальними для виконання", "Максимально жорсткими", "Однаковими для всіх тем", "Таємними до кінця заняття"], "Мінімальні вимоги, за яких курсант у реальних умовах виконає завдання достатньо добре."], ["«В протигазі», «з біноклем» — це приклад якого виду умов?", ["Екіпіровка", "Обмеження", "Вид виконання", "Місце і час"], "Екіпіровка — засоби й одяг, які можна або не можна використовувати."], ["«Тільки з холостими боєприпасами» — це приклад якого виду умов?", ["Обмеження", "Екіпіровка", "Підручні засоби", "Вид виконання"], "Обмеження обмежують можливості курсанта."], ["«Індивідуально», «в парах», «повзком» — це приклад якого виду умов?", ["Вид виконання", "Місце і час", "Обмеження", "Підручні засоби"], "Вид виконання — яким чином виконуються дії."], ["Чому зрозуміла ціль важлива для курсантів?", ["Вона мотивує: курсант знає, що вмітиме наприкінці, і краще співпрацює", "Вона скорочує тривалість заняття", "Без неї неможливо провести перевірку наявності", "Вона потрібна лише для звітності"], "Без зрозумілої цілі курсант стає неуважним і пасивним."], ["Хто запропонував ієрархічну класифікацію навчальних цілей у 1956 році?", ["Бенджамін Блум", "Чарльз Аллен", "Абрахам Маслоу", "Джеймс Меттіс"], "Таксономія Блума — 1956 рік."], ["Який рівень таксономії Блума означає використання вивченого в нових ситуаціях?", ["Застосування", "Знання", "Розуміння", "Оцінювання"], "Застосування — уміння діяти з вивченим у конкретних умовах."], ["Який рівень таксономії Блума означає запам’ятовування та відтворення фактів?", ["Знання", "Синтез", "Аналіз", "Оцінювання"], "Знання — найнижчий рівень: запам’ятати й відтворити."], ["Що інструктор робить на початку заняття з навчальною ціллю?", ["Доводить її до курсантів, щоб вони розуміли, чого від них очікують", "Тримає в секреті до контролю", "Записує лише в журнал", "Доводить тільки після контролю"], "Ціль доводять на початку — під час організаційно-методичного брифінгу."]]}, {"id": "b1m2t4z2", "code": "Б1 М2 Т4 З2", "theme": "Тема 4. Організація та проведення занять", "title": "Аналіз проведених дій (After Action Review)", "short": "АПД / AAR", "passport": {"goal": "Довести військовослужбовцям важливість та порядок проведення АПД/AAR.", "time": "3 години", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Основні керівні документи з АПД/AAR", "Особливості АПД/AAR у збройних силах держав — членів НАТО та країн-партнерів", "Основні правила та принципи проведення АПД/AAR"], "assess": "Усні запитання, письмовий тест і практична робота — АПД за сценарієм.", "criteria": "Позитивно — знає порядок АПД і успішно виконав практичне завдання.", "sources": "Програма, розд. 3.6 і 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.2; план-конспект; презентація; практична робота «АПД сценарій»"}, "sections": [{"h": "Що таке АПД", "body": [["p", "Аналіз проведених дій (АПД), або After Action Review (AAR), — дієвий інструмент для підвищення ефективності підрозділу та порозуміння між побратимами, між підлеглими і лідером."], ["p", "АПД — це динамічне, об’єктивне обговорення того, як особовий склад виконав завдання відповідно до стандартів. Кожен військовослужбовець може і повинен брати участь, якщо в нього є розуміння, інформація, погляди чи запитання, що допоможуть підрозділу подолати слабкі сторони і зміцнити сильні."], ["key", "Мета АПД — вчитися, а не шукати винних. Визначити, що сталося, чому це сталося і як зробити краще."]]}, {"h": "Керівні документи", "body": [["p", "З 2017 року After Action Review згадується в наказах ЗСУ. У 2019 році АПД увійшов до доктрини з вивчення та впровадження досвіду у ЗСУ. Тоді ж процес описано в документі «Тимчасова інструкція з процесу аналізу проведених дій заходів підготовки» ВП 7(3)-00(01).01 — він лишається основним керівним документом щодо АПД у ЗСУ."], ["p", "У Програмі курсу АПД закріплено окремим розділом: керівник заняття вказує ступінь досягнення мети й навчальних цілей, позитивні й негативні сторони, оцінює роботу кожного і дає рекомендації, що вдосконалити — зокрема під час самостійної підготовки."], ["p", "У НАТО і США: доктрини ADP 7-0, ADRP 7-0, FM 7-0 включають AAR у стандарти тренувань; посібник TC 25-20 «A Leader’s Guide to After-Action Reviews» — короткий посібник для командирів; AJP-3 визначає AAR як частину оперативного циклу."]]}, {"h": "АПД у НАТО та країнах-партнерах", "body": [["p", "After Action Review — професійне обговорення події, яке дозволяє солдатам і командирам спільно з’ясувати, що сталося, чому, як зберегти сильні сторони та покращити слабкі. У партнерів будь-яке розгортання відбувається через навчання: «тренуйся так, як будеш битися» — це імператив."], ["ul", ["<b>Стандартизація</b> — процедури регламентовані доктринами та стандартами Альянсу (STANAG);", "<b>Культура відкритості та самокритики</b> — кожен, незалежно від звання, вільно висловлює думку; акцент на вдосконаленні, а не на пошуку винних;", "<b>Фокус на навчанні</b> — уроки фіксуються і змінюють тактику, процедури, підготовку;", "<b>Формалізовані методики</b> — чіткі етапи, питання для обговорення, формати звітності;", "<b>Інтеграція з плануванням</b> — висновки АПД враховуються в нових планах і сценаріях;", "<b>Симуляції, тренажери, технології</b> — запис відео й аудіо, цифрові карти, бойові журнали."]], ["p", "У США широко застосовують неформальний AAR одразу після події (hasty AAR), командир виступає фасилітатором. У Великій Британії — модель «Aim – Outcome – Lessons – Actions». У Бундесвері — «Розпізнати – Оцінити – Покращити»."]]}, {"h": "Чотири запитання і чотири етапи", "body": [["p", "В основі методики — лише чотири прості запитання, які командир розглядає з підлеглими, слухаючи передусім їхні думки:"], ["ul", ["<b>Що мало відбутися?</b>", "<b>Що відбулося насправді і чому?</b>", "<b>Що вдалося, а що ні?</b>", "<b>Що зробити наступного разу, щоб було краще?</b>"]], ["p", "<b>Етап 1. Огляд того, що мало бути виконано.</b> Задум командира, навчальні цілі, завдання. Джерела — наказ, план проведення, графік заняття."], ["p", "<b>Етап 2. Що реально виконано.</b> Керівник збирає якомога більше думок — від підрозділу позначення дій противника (OPFOR), командирів, сержантів і солдатів. Так виробляється спільне розуміння подій."], ["p", "<b>Етап 3. Що виконано правильно і неправильно.</b> На основі критеріїв оцінювання учасники самі визначають сильні та слабкі сторони своїх дій. Керівник лише скеровує дискусію."], ["p", "<b>Етап 4. Як діяти наступного разу.</b> Ті, хто навчаються, самі виявляють проблеми і пропонують рішення; визначається, хто відповідає за впровадження змін."], ["key", "Що планували → Що сталося → Що вдалося і що ні → Що змінимо. Висновки робить сам підрозділ, а не керівник за нього."]]}, {"h": "Формальний і неформальний АПД", "body": [["p", "<b>Офіційний (формальний) АПД</b> планується завчасно, ще під час затвердження планів бойової підготовки. Потребує рекогносцировки, обладнання місця, підготовки навчальної матеріально-технічної бази і координації персоналу. Керівник — командир підрозділу або оцінювач."], ["p", "<b>АПД у робочому порядку (неформальний)</b> проводить безпосередньо командир, інструктор чи оцінювач — у заключній частині заняття, а за потреби й під час нього. Майже не потребує підготовки і засобів, проводиться на місці заняття."], ["p", "Головна перевага неформального АПД — негайний зворотний зв’язок: помилки виправляються на місці, не зупиняючи навчання. Обидва типи потребують участі всього особового складу."]]}, {"h": "Правила і принципи", "body": [["ul", ["АПД проводиться під час або одразу після виконання кожного завдання — поки все свіже;", "акцент — на задум командира, цілі заняття і виконання стандартів;", "увага — порядку дій особового складу, управлінню підрозділом і тактичним діям;", "в обговоренні беруть участь усі — від солдата до командира;", "використовуються відкриті запитання, заохочуються ініціатива і креативність;", "визначаються і сильні, і слабкі сторони;", "висновки фіксуються, щоб уроки не загубилися."]], ["p", "<b>Роль модератора:</b> забезпечує нейтральну атмосферу, стежить за структурою, заохочує відкритість і взаємоповагу, підбиває підсумки й виділяє ключові уроки."], ["warn", "Під час АПД не можна: звинувачувати персонально, переривати чи пригнічувати учасників, замовчувати незручні проблеми, перетворювати АПД на формальність без висновків. Критикуємо дії, а не людей."]]}, {"h": "АПД на практиці: розбір сценарію", "body": [["p", "Практична робота заняття: відділення з командиром і сімома солдатами обороняє стратегічний пункт до підходу підкріплення. Курсант за перебігом подій заповнює чотири пункти АПД."], ["p", "<b>Що планували:</b> зайняти позицію, утримувати до прибуття підкріплення, не допустити прориву противника через контрольовану зону."], ["p", "<b>Що вдалося:</b> позиції зайняли вчасно, противника помітили завчасно, снайпер влучно відкрив вогонь, гранатометник із помічником діяли злагоджено, позицію утримали до підкріплення."], ["p", "<b>Що ні:</b> кулеметну стрічку спорядили неякісно — збої у вогні; після пострілу з гранатомета не проконтролювали зону ураження; спостерігач не доповів про рух на фланзі; командир запізно викликав підкріплення."], ["p", "<b>Що змінимо:</b> контроль спорядження, доповідь про кожну загрозу без вагань, контроль зони ураження після застосування важкого озброєння, чіткий порядок рішення про виклик підкріплення, додаткові засоби спостереження — БпЛА."], ["p", "Пройдіть цей сценарій самостійно у вкладці «Практика» — тренажер АПД."]]}], "keys": ["АПД / AAR — обговорення виконаного завдання, щоб вчитися, а не шукати винних.", "Основний документ у ЗСУ — Тимчасова інструкція з процесу АПД заходів підготовки ВП 7(3)-00(01).01 (2019).", "Чотири запитання: що мало відбутися, що відбулося і чому, що вдалося і що ні, що зробити наступного разу.", "Два типи: офіційний (формальний) і у робочому порядку (неформальний).", "АПД — одразу після завдання, за участі всіх, з відкритими запитаннями.", "Критикуємо дії, а не людей; висновки обов’язково фіксуємо."], "test": [["Що таке АПД / AAR?", ["Професійне обговорення виконаного завдання для визначення сильних і слабких сторін", "Документальний звіт про місію для командування", "Процедура покарання за помилки", "Підрахунок втрат після бою"], "АПД — обговорення, що сталося, чому і як зробити краще."], ["Яка основна мета АПД?", ["Вчитися: визначити сильні і слабкі сторони та як зробити краще", "Знайти винного", "Скласти документацію операції", "Оцінити кожного балами"], "АПД спрямований на навчання, а не на покарання."], ["Що є ключовим елементом успішного АПД?", ["Відкритість і конструктивність обговорення", "С /* ---------- router ---------- */
let S={view:"home"};
function go(hash){if(location.hash!==hash)location.hash=hash;else route()}
window.addEventListener("hashchange",route);
$("#homeBtn").onclick=()=>go("#");
function route(){
  const h=location.hash.replace(/^#\/?/,"");const [a,b]=h.split("/");
  Q=null;
  if(a==="exam"){stopAudio(true);renderExamStart();}
  else if(a==="sheet"){stopAudio(true);renderSheet(b);}
  else if(a==="goal"){stopAudio(true);renderGoal();}
  else if(a==="aar"){stopAudio(true);renderAAR();}
  else if(a&&byId[a]){openTopic(a,b==="test"?"test":"lec");}
  else{stopAudio(true);renderHome();}
  window.scrollTo(0,0);
}

const audio=new Audio();audio.preload="auto";
const RATES=[1,1.25,1.5,0.9];

function setupPlayer(t){
  A.t=t;$("#player").classList.remove("hidden");$("#pSpd").textContent=fmtRate(A.rate);
  if(A.cur&&A.tid===t.id){paintNow(A.cur);updateUI();return}

}
function fmtRate(r){return (r+"").replace(".",",")+"×"}
function loadSec(s,play,at){
  const tm=TIMING[A.t.id];if(!tm||!tm[s])return;
  A.s=s;const src="audio/"+tm[s].f;const same=audio.src.endsWith(src)&&audio.readyState>=1;
  const go_=()=>{if(at)audio.currentTime=at;audio.playbackRate=A.rate;if(play)audio.play().catch(()=>{});};
  if(same)go_();else{audio.src=src;audio.addEventListener("loadedmetadata",go_,{once:true});audio.load();}
  store.set("pos_"+A.t.id,s);updateUI();mediaMeta();
}
function updateUI(){

function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
audio.addEventListener("timeupdate",()=>{
  if(!A.t||S.view!=="topic")return;updateUI();
  const m=(TIMING[A.t.id][A.s]||{}).m||[];let cur=m[0]&&m[0][0];
  for(const [id,t] of m){if(audio.currentTime+0.05>=t)cur=id;else break}
  if(cur&&cur!==A.cur){A.cur=cur;if(S.tab==="lec")paintNow(cur,true)}
});
audio.addEventListener("play",updateUI);audio.addEventListener("pause",updateUI);
audio.addEventListener("ended",()=>{
  const lp=Math.max(lecProg(A.t.id),A.s+1);store.set("lec_"+A.t.id,lp);

function paintNow(id,scroll){

  if(scroll&&Date.now()-A.userScroll>5000){const r=el.getBoundingClientRect();const vh=innerHeight;if(r.top<90||r.bottom>vh-150)el.scrollIntoView({behavior:"smooth",block:"center"})}
}
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{A.userScroll=Date.now()},{passive:true}));
function seekBlock(id){
  const s=+document.getElementById(id).dataset.s;const m=(TIMING[A.t.id][s]||{}).m||[];
  const mk=m.find(x=>x[0]===id);const at=mk?mk[1]:0;

}
function togglePlay(){if(!A.t)return;if(audio.paused){audio.play().catch(()=>{});A.userScroll=0}else audio.pause()}

function stopAudio(reset){pauseAudio();if(reset){A.cur=null}}
$("#pPlay").onclick=togglePlay;

$("#pNext").onclick=()=>{if(A.s+1<A.t.sections.length)loadSec(A.s+1,!audio.paused)};
$("#pSpd").onclick=()=>{A.rate=RATES[(RATES.indexOf(A.rate)+1)%RATES.length];audio.playbackRate=A.rate;store.set("rate",A.rate);$("#pSpd").textContent=fmtRate(A.rate)};
$("#pBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};
function mediaMeta(){if(!("mediaSession" in navigator)||!A.t)return;try{
  navigator.mediaSession.metadata=new MediaMetadata({title:A.t.sections[A.s].h,artist:A.t.short,album:"КІБЕР"});

/* ---------- quiz ---------- */
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(cfg){
  Q={...cfg,items:shuffle(cfg.items).map(it=>{const [q,opts,ex]=it.q;return {...it,text:q,ex,opts:shuffle(opts.map((o,k)=>({o,ok:k===0})))}}),i:0,score:0,picked:null,wrong:[]};
  renderQ();
}
function renderQ(){
  const box=$("#quiz");const it=Q.items[Q.i];const n=Q.items.length;const L="АБВГ";
  let h=`<div class="qhead"><span>Питання ${Q.i+1} з ${n}</span><span>${Q.score} ${balWord(Q.score)}</span></div><div class="qprog"><i style="width:${Q.i/n*100}%"></i></div>`;
  if(Q.exam)h+=`<div class="eyebrow" style="margin-bottom:6px">${esc(byId[it.tid].short)}</div>`;
  h+=`<div class="qtext">${esc(it.text)}</div><div class="opts">`;
  it.opts.forEach((o,k)=>{let c="";if(Q.picked!==null){if(Q.exam)c=k===Q.picked?"sel":"dim";else if(o.ok)c="right";else if(k===Q.picked)c="wrong";else c="dim"}
    h+=`<button class="opt ${c}" data-k="${k}" ${Q.picked!==null?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o.o)}</span></button>`});
  h+=`</div>`;
  if(Q.picked!==null&&!Q.exam){
    const ok=it.opts[Q.picked].ok;
    h+=`<div class="verdict ${ok?"ok":"no"}"><b>${ok?"Правильно. +1 бал":"Неправильно"}</b>${ok?"":`Правильна відповідь: ${esc(it.opts.find(o=>o.ok).o)}. `}${esc(it.ex)}</div>`;
    h+=`<div class="qnext"><button class="btn p" id="qNext">${Q.i+1<n?"Далі":"Результат"} →</button></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const nx=$("#qNext");if(nx){nx.onclick=nextQ;nx.focus({preventScroll:true})}
}
function balWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"бал";if(a>=2&&a<=4&&(b<12||b>14))return"бали";return"балів"}
function pick(k){if(Q.picked!==null)return;Q.picked=k;const it=Q.items[Q.i];if(it.opts[k].ok)Q.score++;else Q.wrong.push(it);renderQ();
  if(Q.exam){setTimeout(()=>{if(Q&&Q.picked===k&&Q.items[Q.i]===it)nextQ()},650)}}
function nextQ(){Q.picked=null;Q.i++;if(Q.i>=Q.items.length)renderResult();else{renderQ();const qt=document.querySelector(".quiz");if(qt&&qt.getBoundingClientRect().top<0)qt.scrollIntoView()}}
function gradeOf(p){return p>=90?"Відмінно":p>=80?"Добре":p>=70?"Задовільно":"Незадовільно"}
function renderResult(){

  if(Q.exam){const prev=store.get("exam",null);if(!prev||p>prev.pct)store.set("exam",{pct:p,s,n})}

  <div class="grade">${gradeOf(p)}</div><p>${p>=PASS?(Q.exam?"Матеріал засвоєно впевнено.":"Заняття засвоєно. Можна переходити до наступного."):`Для засвоєння потрібно ${PASS}%. Перегляньте помилки й спробуйте ще раз.`}</p><div class="cta">`;
  if(Q.wrong.length)h+=`<button class="btn p" id="rWrong">Повторити помилки (${Q.wrong.length})</button>`;
  h+=`<button class="btn" id="rAgain">Пройти ще раз</button>`;
  if(Q.save){const nx=T[T.indexOf(byId[Q.save])+1];if(nx&&p>=PASS)h+=`<button class="btn p" data-go="#${nx.id}">Наступне заняття →</button>`;else if(p<PASS)h+=`<button class="btn" data-go="#${Q.save}">Перечитати лекцію</button>`;else h+=`<button class="btn" data-go="#">До занять</button>`}
  else h+=`<button class="btn" data-go="#">До занять</button>`;
  h+=`</div>`;
  if(Q.exam){const agg={};Q.items.forEach(it=>{const a=agg[it.tid]||(agg[it.tid]={n:0,w:0});a.n++});Q.wrong.forEach(it=>agg[it.tid].w++);

  if(Q.wrong.length){h+=`<div class="mist"><h3>Розбір помилок</h3>${Q.wrong.map(it=>`<div class="mi">${Q.exam?`<div class="tp">${esc(byId[it.tid].short)}</div>`:""}<b>${esc(it.text)}</b><div class="ans">✓ ${esc(it.opts.find(o=>o.ok).o)}</div><div class="ex">${esc(it.ex)}</div></div>`).join("")}</div>`}
  h+=`</div>`;
  $("#quiz").innerHTML=h;bindGo();window.scrollTo({top:0,behavior:"smooth"});
  const cfg={title:Q.title,save:Q.save,exam:Q.exam};const wrong=Q.wrong.map(it=>({q:it.q,tid:it.tid,i:it.i}));const all=Q.all||Q.items.map(it=>({q:it.q,tid:it.tid,i:it.i}));
  const rw=$("#rWrong");if(rw)rw.onclick=()=>startQuiz({...cfg,save:null,items:wrong,exam:false});

function renderExamStart(direct){

}

let confirmT={};function confirmInline(id){const b=$("#"+id);if(confirmT[id]){clearTimeout(confirmT[id]);confirmT[id]=0;return true}b.textContent="Натисніть ще раз, щоб очистити";confirmT[id]=setTimeout(()=>{confirmT[id]=0;b.textContent="Очистити лист"},3000);return false}
function fmt2(x){return x.toFixed(2).replace(".",",")}
function calcSheet(type,st){
  const G=DATA.sheets[type];let total=0,rated=0,sum=0,starZero=[],plainZero=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{total++;const v=st.v[gi+"_"+ii];if(v===undefined)return;rated++;sum+=v;if(v===0){if(it.s)starZero.push(it.t);else plainZero++}}));
