ішення проблем розвиває критичне мислення; власне відкриття запам’ятовується краще."], "test": [["Інструктор проводить заняття з тактики, показуючи відео реальних боїв і макет позиції. Який принцип він реалізує?", ["Наочності", "Науковості", "Міцності засвоєння", "Колективізму"], "Принцип наочності: карти, схеми, макети, відео бойових дій, практичні демонстрації."], ["Як за принципом доступності має подаватися матеріал?", ["Адаптовано до рівня, але з подоланням труднощів", "Максимально просто, без жодних труднощів", "На рівні академічного курсу для всіх однаково", "З орієнтацією на найсильніших курсантів групи"], "Доступність — матеріал адаптовано до рівня, але з подоланням труднощів."], ["Принцип індивідуалізації у військовій педагогіці має обмеження. Яке?", ["Акцент на злагодженості підрозділу", "Він застосовується лише до офіцерів", "Він заборонений у бойовій підготовці", "Він діє лише на лекціях"], "Індивідуалізація враховує здібності й темп, але з акцентом на злагодженість підрозділу."], ["Що вирішальне для принципу виховуючого навчання?", ["Особистий приклад командира", "Кількість лекцій з виховання", "Суворі покарання", "Матеріальні заохочення"], "Виховуюче навчання — формування морально-бойових якостей; особистий приклад командира вирішальний."], ["Який принцип є специфічним для військової педагогіки, а не загальним?", ["Колективізму і єдиноначальності", "Наочності", "Доступності", "Науковості"], "Специфічні військові принципи: колективізм і єдиноначальність, висока вимогливість і дисципліна, психологічна стійкість."], ["Інструктор вводить на заняттях раптові вибухи-імітації і обмеження часу. Який принцип він реалізує?", ["Психологічної стійкості", "Доступності навчання", "Наочності навчання", "Індивідуалізації"], "Формування психологічної стійкості — елементи психологічної підготовки для стресостійкості й витримки."], ["Чому навчання на помилках потребує контрольованого середовища?", ["Помилка має бути відчутною, але не катастрофічною", "Щоб помилок не було взагалі", "Щоб інструктор міг карати за кожну помилку", "Щоб скоротити час заняття"], "Контрольоване середовище — симуляції й тренування, де помилка відчутна, але не катастрофічна."], ["Інструктор карає за кожну помилку на тренуванні. Що відбувається з навчанням?", ["Страх покарання паралізує ініціативу", "Курсанти швидше вчаться", "Помилок стає менше без наслідків", "Нічого не змінюється"], "Страх покарання за кожну помилку паралізує ініціативу."], ["Курсант помилився на тактичному занятті. Що має бути наступним кроком після помилки?", ["З’ясувати, чому прийнято неправильне рішення", "Одразу перейти до наступної вправи", "Виставити оцінку і не повертатися до цього", "Повторити ту саму дію ще раз без аналізу"], "Кроки: контрольоване середовище → розуміння причини → вивчені уроки → застосування досвіду."], ["Що означає крок «вивчені уроки»?", ["Сформулювати і задокументувати практичні висновки", "Прочитати групі лекцію про типові помилки", "Визначити і покарати винного у помилці", "Повторити ту саму тему на наступному занятті"], "Вивчені уроки — конкретні практичні висновки, задокументовані."], ["Чому власна помилка запам’ятовується краще?", ["Вона пережита особисто, а не почута", "Її записують у журнал бойової підготовки", "За неї зазвичай карають перед строєм", "Вона якраз запам’ятовується гірше"], "Власна помилка запам’ятовується значно краще, ніж пасивно почута інформація."], ["На чому ґрунтується навчання через розуміння і вирішення проблем?", ["На отриманні знань під час розв’язання завдань", "На заучуванні готових відповідей і визначень", "На точному повторенні дій за інструктором", "На регулярних письмових тестах"], "Знання отримують під час розв’язання теоретичних і практичних завдань."], ["Завдання: з’єднати дев’ять точок чотирма прямими, не відриваючи ручки. У чому ключ?", ["Лінії можуть виходити за межі квадрата", "Ручку можна відірвати один раз", "Потрібно щонайменше п’ять ліній", "Завдання не має розв’язку"], "Розв’язок можливий, якщо зрозуміти, що лінії можуть виходити за межі уявного квадрата."], ["Курсанти «застрягли» в розв’язанні проблеми і готові здатися. Що має зробити інструктор?", ["Вчасно підказати напрям", "Дати готову відповідь одразу на початку", "Зарахувати невиконання", "Нічого — хай мучаться"], "Недолік методу: курсанти інколи застрягають, тож інструктор має вчасно підказати напрям."], ["Багаторазове повторення до автоматизму — це який принцип?", ["Міцності засвоєння", "Наочності навчання", "Доступності навчання", "Свідомості навчання"], "Міцність засвоєння — багаторазове повторення до автоматизму."]]}, {"id": "b1m2t4z1", "code": "Б1 М2 Т4 З1", "theme": "Тема 4. Організація та проведення занять", "title": "Опис цілі", "short": "Опис цілі", "passport": {"goal": "Довести військовослужбовцям важливість та порядок опису цілі навчання.", "time": "3 години (180 хв)", "method": "Інтерактивна лекція — 50%, практичне заняття — 50%; навчальний клас", "questions": ["Важливість опису цілі", "Порядок опису цілі навчання", "Таксономія Блума", "Порядок визначення навчальних цілей"], "assess": "Практично, письмово, індивідуально — завдання в кінці заняття.", "criteria": "Позитивно — якщо самостійно склав опис цілі згідно з вивченим алгоритмом.", "sources": "Програма, розд. 7.1.1.2 і додаток 3.6; ДМ до СТІ 132Г.42К(Н), п. 4.1; план-конспект; презентація; зразки опису цілі"}, "sections": [{"h": "Що таке ціль заняття", "body": [["p", "Ціль заняття — це запланований результат, якого інструктор прагне досягти. Це орієнтир для інструктора і курсантів: він допомагає спланувати зміст, методи та форми роботи, а потім оцінити ефективність заняття."], ["p", "Простими словами, ціль — це те, що курсанти повинні <b>знати, вміти або розуміти</b> після завершення заняття. Кожне заняття, кожна тема, предмет і навіть увесь курс мають свою мету навчання."], ["p", "За характером цілі бувають:"], ["ul", ["<b>навчальні (дидактичні)</b> — засвоєння нових знань, умінь і навичок;", "<b>розвиваючі</b> — розвиток мислення, творчих здібностей, самостійності;", "<b>виховні</b> — формування цінностей, моральних якостей, патріотизму."]]]}, {"h": "Чому ціль має бути зрозумілою", "body": [["p", "Зрозуміла ціль заняття завжди мотивує. Якщо військовослужбовець бере участь у занятті, ціль якого йому незрозуміла, він швидко стає неуважним, розгубленим і пасивним — думає про що завгодно, крім заняття."], ["p", "Коли курсанти розуміють, що вони знатимуть і вмітимуть наприкінці, вони краще співпрацюють з інструктором, щоб цієї цілі досягти. Інструктор може написати ціль на дошці або роздати картки з ціллю заняття."], ["key", "Ціль має відображати ті навички, які курсанти повинні будуть показати в кінці заняття. Навчання має сенс, коли курсант засвоїв матеріал і може виконати поставлену ціль."]]}, {"h": "Чотири складові опису цілі", "body": [["p", "Опис цілі складається з чотирьох елементів. Саме за цією схемою заповнюється розділ «Опис цілі (мети)» в план-конспекті:"], ["ul", ["<b>Ціль</b> — що курсант повинен знати або вміти після заняття;", "<b>Вимоги</b> — що курсант повинен буде виконати в кінці заняття;", "<b>Умови та обставини</b> — за яких умов курсант виконуватиме завдання;", "<b>Критерії оцінювання</b> — наскільки добре треба виконати завдання."]], ["key", "Ціль → Вимоги → Умови та обставини → Критерії. Результат заняття має бути вимірюваним, тобто таким, що його можна перевірити."]]}, {"h": "Вимоги: тільки вимірювані дієслова", "body": [["p", "Формулюючи ціль і вимоги, вживайте слова, що означають конкретні, перевірювані дії. Те, що не можна виміряти, перевірити неможливо."], ["p", "<b>Для теоретичного заняття</b> відповідні вимоги: написати, назвати, визначити, вибрати, впізнати, дати визначення. Невідповідні: бути здатним, вияснити, зрозуміти, повірити, інформувати."], ["p", "<b>Для практичного заняття</b> відповідні вимоги: з’єднати, розібрати, перев’язати, викопати, виконати, описати. Невідповідні: буде знати, повірить, відчує."], ["warn", "Неприйнятні в описі цілі слова: «зрозуміє», «повірить», «переконається», «відчує», «спробує». Інструктор не зможе перевірити, чи це сталося."], ["p", "Приклад: замість «курсанти знатимуть про іммобілізацію» — «кожен курсант вмітиме іммобілізувати нижню кінцівку». Тепер інструктор точно знає, що курсанти мають уміти накласти шину, а не лише розповісти про неї."]]}, {"h": "Умови та обставини", "body": [["p", "Умови та обставини відповідають на запитання: <b>де? коли? яким чином? за допомогою чого?</b> Вони визначають, чи виконує курсант завдання сам чи з іншими, своїм матеріалом чи спеціально виділеним, вдень чи вночі."], ["p", "Види умов і приклади:"], ["ul", ["<b>Обмеження</b> — обмежують можливості: тільки з холостими боєприпасами; з бойовими боєприпасами.", "<b>Екіпіровка</b> — засоби, одяг, механізми, які можна або не можна використовувати: тільки предмети зі списку; в протигазі; з біноклем.", "<b>Місце, час і кліматичні умови</b>: у будь-яких кліматичних умовах; вдень або вночі; у класі; на ділянці місцевості.", "<b>Підручні засоби</b> — посібники, карти, інструкції: за допомогою словника; самостійно, без підручних засобів; без бінокля.", "<b>Вид виконання</b>: індивідуально; в парах або в групі; бігом; повзком; із зав’язаними очима."]]]}, {"h": "Критерії оцінювання", "body": [["p", "Критерії визначають якість виконання — наскільки добре курсант має виконати завдання."], ["ul", ["критерії повинні містити <b>мінімальні</b> вимоги, за яких курсант у реальних обставинах виконає завдання достатньо добре;", "критерії повинні бути <b>реальними</b> для виконання."]], ["p", "Відповідні критерії: «в правильній послідовності», «без помилок, згідно з інструкцією», «допустима похибка ±2 см», «допускається не більше однієї помилки», «не довше 2 хвилин»."], ["p", "Невідповідні критерії: «7 хвилин», «9 метрів», «щоб гарно виглядало», «швидко». «7 хвилин» означає рівно сім — ні секундою більше чи менше. А що таке «гарно» чи «швидко» в уяві інструктора, курсант знати не може."], ["key", "Критерій — це межа: «не більше», «не довше», «з похибкою до». Не точна цифра і не оцінне слово."]]}, {"h": "Приклади правильного опису цілі", "body": [["p", "<b>Знання.</b> Ціль: ознайомити військовослужбовців з історією української миротворчої місії в Іраку. Вимоги: кожен курсант повинен знати основні дати, райони та цілі направлення контингенту. Умови: письмово в аудиторії, в кінці заняття, 5 хвилин, бланк і ручка, без конспекту; тест із 5 питань. Критерії: 5 правильних — «відмінно», 4 — «добре», 3 — «задовільно», 2 і менше — «незадовільно»."], ["p", "<b>Навичка.</b> Ціль: навчити курсантів вимірювати дистанцію кроками. Вимоги: кожен курсант вимірює дистанцію парами кроків на різній місцевості з обмундируванням. Умови: ділянка дороги 100 м, вдень, без допоміжних засобів вимірювання. Критерії: «виконано» — похибка не більше 5 м; «не виконано» — використовував допоміжні засоби або похибка більше 5 м."], ["p", "<b>Навичка.</b> Ціль: навчити іммобілізації нижньої кінцівки при закритому переломі підручними засобами. Вимоги: кожен курсант іммобілізує нижню кінцівку. Умови: підручними засобами, на ділянці місцевості, протягом 10 хвилин. Критерії: «виконано» — кінцівку іммобілізовано правильно і в межах часу."]]}, {"h": "Таксономія Блума", "body": [["p", "Таксономія Блума — ієрархічна класифікація навчальних цілей у пізнавальній сфері, яку запропонував у 1956 році американський психолог Бенджамін Блум. Вона допомагає вибрати правильне дієслово для вимог — від простого запам’ятовування до створення нового."], ["ul", ["<b>Знання</b> — запам’ятовування і відтворення термінів, фактів, правил, процедур;", "<b>Розуміння</b> — пояснити, переказати своїми словами, перевести з однієї форми в іншу (з тексту в схему), спрогнозувати наслідки;", "<b>Застосування</b> — використати вивчене в конкретних умовах і нових ситуаціях;", "<b>Аналіз</b> — виділити частини цілого, побачити зв’язки між ними, помилки в логіці, різницю між фактами й наслідками;", "<b>Синтез</b> — скомбінувати елементи в нове ціле: план дій, повідомлення, схему;", "<b>Оцінювання</b> — оцінити значення матеріалу для конкретної мети на основі чітких критеріїв."]], ["key", "Чим вищий рівень за Блумом, тим складніше завдання. Для базового солдата здебільшого достатньо знання, розуміння і застосування."]]}, {"h": "Порядок визначення навчальних цілей", "body": [["p", "Визначаючи навчальні цілі, інструктор зазвичай дотримується такого порядку:"], ["ul", ["визначає, що курсанти повинні знати, вміти або розуміти після заняття — конкретний очікуваний результат;", "враховує навчальну програму і попередній рівень підготовки курсантів — цілі мають бути досяжними;", "формулює ціль чітко, дієсловами дії: пояснити, виконати, продемонструвати, розпізнати;", "визначає, які попередні знання й уміння потрібні для досягнення цілі;", "планує методи, обладнання і форми роботи;", "визначає критерії, за якими оцінюватиме досягнення цілі;", "доводить ціль до курсантів на початку заняття, щоб вони розуміли, чого від них очікують."]], ["p", "Практична частина заняття: курсанти тренуються складати опис цілі для своїх тем. Спробуйте це у вкладці «Практика» — тренажер опису цілі."]]}], "keys": ["Ціль — те, що курсант повинен знати або вміти після заняття.", "Опис цілі: ціль, вимоги, умови та обставини, критерії оцінювання.", "Вимоги формулюються вимірюваними дієсловами: назвати, розібрати, перев’язати — не «зрозуміє» чи «відчує».", "Умови та обставини відповідають на запитання: де? коли? яким чином? за допомогою чого?", "Критерії — мінімальні й реальні: «не довше 2 хв», «не більше однієї помилки».", "Таксономія Блума: знання, розуміння, застосування, аналіз, синтез, оцінювання."], "test": [["Які чотири складові має опис цілі в план-конспекті?", ["Ціль, вимоги, умови та обставини, критерії оцінювання", "Тема, час, місце, матеріальне забезпечення", "Вступ, основна частина, заключна частина, АПД", "Пояснення, демонстрація, імітація, практика"], "Опис цілі: ціль → вимоги → умови та обставини → критерії."], ["Яке формулювання вимоги для теоретичного заняття правильне?", ["«Назвати п’ять демаскуючих ознак»", "«Зрозуміти важливість маскування»", "«Бути здатним до маскування»", "«Повірити в ефективність маскування»"], "Вимоги — лише вимірювані дієслова: написати, назвати, визначити, вибрати. «Зрозуміти», «повірити» — неприйнятні."], ["Чому «курсант зрозуміє» — неприйнятне слово в описі цілі?", ["Інструктор не зможе перевірити, чи це сталося", "Це слово занадто складне для курсантів", "Так не пишуть у керівних документах ЗСУ", "Це слово підходить лише для практичних занять"], "Неприйнятні слова — «зрозуміє», «повірить», «відчує», «спробує»: їх неможливо виміряти й перевірити."], ["Як правильно переписати ціль «курсанти знатимуть про іммобілізацію»?", ["«Кожен курсант вмітиме іммобілізувати нижню кінцівку»", "«Курсанти зрозуміють іммобілізацію»", "«Курсанти ознайомляться з шинами»", "«Курсанти відчують важливість першої допомоги»"], "Ціль має описувати перевірювану дію: курсант уміє накласти шину, а не лише розповісти."], ["«Тільки з холостими боєприпасами» — до якого виду умов належить?", ["Обмеження", "Екіпіровка", "Вид виконання", "Підручні засоби"], "Обмеження: тільки з холостими або з бойовими боєприпасами."], ["«В протигазі, з біноклем» — до якого виду умов належить?", ["Екіпіровка", "Обмеження", "Місце і час", "Вид виконання"], "Екіпіровка — засоби, одяг, механізми, які можна або не можна використовувати."], ["«Повзком, у парах, із зав’язаними очима» — це який вид умов?", ["Вид виконання", "Екіпіровка", "Підручні засоби", "Обмеження"], "Вид виконання: індивідуально, в парах, бігом, повзком, із зав’язаними очима."], ["Чому критерій «7 хвилин» — невідповідний?", ["Він означає рівно 7 хвилин, а не межу", "Сім хвилин — завеликий час для будь-якого нормативу", "Час узагалі не можна використовувати як критерій", "Він відповідний — це конкретна вимірювана цифра"], "Критерій — це межа. Правильно: «не довше 7 хвилин»."], ["Яке формулювання критерію правильне?", ["«Допустима похибка ±2 см»", "«Швидко»", "«Щоб гарно виглядало»", "«9 метрів»"], "Відповідні критерії: «у правильній послідовності», «без помилок», «±2 см», «не довше 2 хвилин»."], ["Яким має бути критерій оцінювання з погляду реального бою?", ["Мінімальні вимоги для достатньо доброго виконання", "Максимально високі, щоб відсіяти слабких курсантів", "Такі, які здатен виконати лише досвідчений інструктор", "Довільні — на розсуд конкретного оцінювача"], "Критерії містять мінімальні вимоги для достатньо доброго виконання в реальних обставинах і мають бути реальними."], ["Курсант має перевести текст бойового наказу у схему на карті. Який рівень за таксономією Блума?", ["Розуміння", "Знання", "Синтез", "Оцінювання"], "Розуміння — пояснити своїми словами, перевести з однієї форми в іншу (з тексту в схему), спрогнозувати наслідки."], ["Курсант складає власний план дій відділення з окремих елементів. Який рівень за Блумом?", ["Синтез", "Аналіз", "Застосування", "Розуміння"], "Синтез — скомбінувати елементи в нове ціле: план дій, повідомлення, схему."], ["Курсант знаходить помилки в логіці бойового донесення. Який рівень за Блумом?", ["Аналіз", "Синтез", "Знання", "Застосування"], "Аналіз — виділити частини, побачити зв’язки, помилки в логіці, різницю між фактами й наслідками."], ["Яких рівнів за Блумом здебільшого достатньо для базового солдата?", ["Знання, розуміння і застосування", "Аналізу, синтезу й оцінювання", "Лише оцінювання", "Усіх шести обов’язково"], "Чим вищий рівень, тим складніше. Для базового солдата здебільшого достатньо знання, розуміння і застосування."], ["Коли інструктор доводить ціль до курсантів?", ["На початку заняття", "Наприкінці, під час підсумків", "Лише в план-конспекті, курсантам — ні", "Після перевірки знань"], "Ціль доводять на початку заняття: незрозуміла ціль робить курсантів неуважними й пасивними."], ["Що інструктор визначає ПЕРЕД тим, як планувати методи й обладнання?", ["Потрібні попередні знання й уміння", "Критерії оцінювання результатів", "Склад комісії для контролю", "Тривалість перерви між частинами"], "Порядок: результат → програма і рівень → формулювання → потрібні попередні знання → методи → критерії → доведення."]]}, {"id": "b1m2t4z2", "code": "Б1 М2 Т4 З2", "theme": "Тема 4. Організація та проведення занять", "title": "Аналіз проведених дій (After Action Review)", "short": "АПД / AAR", "passport": {"goal": "Довести військовослужбовцям важливість та порядок проведення АПД/AAR.", "time": "3 години", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Основні керівні документи з АПД/AAR", "Особливості АПД/AAR у збройних силах держав — членів НАТО та країн-партнерів", "Основні правила та принципи проведення АПД/AAR"], "assess": "Усні запитання, письмовий тест і практична робота — АПД за сценарієм.", "criteria": "Позитивно — знає порядок АПД і успішно виконав практичне завдання.", "sources": "Програма, розд. 3.6 і 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.2; план-конспект; презентація; практична робота «АПД сценарій»"}, "sections": [{"h": "Що таке АПД", "body": [["p", "Аналіз проведених дій (АПД), або After Action Review (AAR), — дієвий інструмент для підвищення ефективності підрозділу та порозуміння між побратимами, між підлеглими і лідером."], ["p", "АПД — це динамічне, об’єктивне обговорення того, як особовий склад виконав завдання відповідно до стандартів. Кожен військовослужбовець може і повинен брати участь, якщо в нього є розуміння, інформація, погляди чи запитання, що допоможуть підрозділу подолати слабкі сторони і зміцнити сильні."], ["key", "Мета АПД — вчитися, а не шукати винних. Визначити, що сталося, чому це сталося і як зробити краще."]]}, {"h": "Керівні документи", "body": [["p", "З 2017 року After Action Review згадується в наказах ЗСУ. У 2019 році АПД увійшов до доктрини з вивчення та впровадження досвіду у ЗСУ. Тоді ж процес описано в документі «Тимчасова інструкція з процесу аналізу проведених дій заходів підготовки» ВП 7(3)-00(01).01 — він лишається основним керівним документом щодо АПД у ЗСУ."], ["p", "У Програмі курсу АПД закріплено окремим розділом: керівник заняття вказує ступінь досягнення мети й навчальних цілей, позитивні й негативні сторони, оцінює роботу кожного і дає рекомендації, що вдосконалити — зокрема під час самостійної підготовки."], ["p", "У НАТО і США: доктрини ADP 7-0, ADRP 7-0, FM 7-0 включають AAR у стандарти тренувань; посібник TC 25-20 «A Leader’s Guide to After-Action Reviews» — короткий посібник для командирів; AJP-3 визначає AAR як частину оперативного циклу."]]}, {"h": "АПД у НАТО та країнах-партнерах", "body": [["p", "After Action Review — професійне обговорення події, яке дозволяє солдатам і командирам спільно з’ясувати, що сталося, чому, як зберегти сильні сторони та покращити слабкі. У партнерів будь-яке розгортання відбувається через навчання: «тренуйся так, як будеш битися» — це імператив."], ["ul", ["<b>Стандартизація</b> — процедури регламентовані доктринами та стандартами Альянсу (STANAG);", "<b>Культура відкритості та самокритики</b> — кожен, незалежно від звання, вільно висловлює думку; акцент на вдосконаленні, а не на пошуку винних;", "<b>Фокус на навчанні</b> — уроки фіксуються і змінюють тактику, процедури, підготовку;", "<b>Формалізовані методики</b> — чіткі етапи, питання для обговорення, формати звітності;", "<b>Інтеграція з плануванням</b> — висновки АПД враховуються в нових планах і сценаріях;", "<b>Симуляції, тренажери, технології</b> — запис відео й аудіо, цифрові карти, бойові журнали."]], ["p", "У США широко застосовують неформальний AAR одразу після події (hasty AAR), командир виступає фасилітатором. У Великій Британії — модель «Aim – Outcome – Lessons – Actions». У Бундесвері — «Розпізнати – Оцінити – Покращити»."]]}, {"h": "Чотири запитання і чотири етапи", "body": [["p", "В основі методики — лише чотири прості запитання, які командир розглядає з підлеглими, слухаючи передусім їхні думки:"], ["ul", ["<b>Що мало відбутися?</b>", "<b>Що відбулося насправді і чому?</b>", "<b>Що вдалося, а що ні?</b>", "<b>Що зробити наступного разу, щоб було краще?</b>"]], ["p", "<b>Етап 1. Огляд того, що мало бути виконано.</b> Задум командира, навчальні цілі, завдання. Джерела — наказ, план проведення, графік заняття."], ["p", "<b>Етап 2. Що реально виконано.</b> Керівник збирає якомога більше думок — від підрозділу позначення дій противника (OPFOR), командирів, сержантів і солдатів. Так виробляється спільне розуміння подій."], ["p", "<b>Етап 3. Що виконано правильно і неправильно.</b> На основі критеріїв оцінювання учасники самі визначають сильні та слабкі сторони своїх дій. Керівник лише скеровує дискусію."], ["p", "<b>Етап 4. Як діяти наступного разу.</b> Ті, хто навчаються, самі виявляють проблеми і пропонують рішення; визначається, хто відповідає за впровадження змін."], ["key", "Що планували → Що сталося → Що вдалося і що ні → Що змінимо. Висновки робить сам підрозділ, а не керівник за нього."]]}, {"h": "Формальний і неформальний АПД", "body": [["p", "<b>Офіційний (формальний) АПД</b> планується завчасно, ще під час затвердження планів бойової підготовки. Потребує рекогносцировки, обладнання місця, підготовки навчальної матеріально-технічної бази і координації персоналу. Керівник — командир підрозділу або оцінювач."], ["p", "<b>АПД у робочому порядку (неформальний)</b> проводить безпосередньо командир, інструктор чи оцінювач — у заключній частині заняття, а за потреби й під час нього. Майже не потребує підготовки і засобів, проводиться на місці заняття."], ["p", "Головна перевага неформального АПД — негайний зворотний зв’язок: помилки виправляються на місці, не зупиняючи навчання. Обидва типи потребують участі всього особового складу."]]}, {"h": "Правила і принципи", "body": [["ul", ["АПД проводиться під час або одразу після виконання кожного завдання — поки все свіже;", "акцент — на задум командира, цілі заняття і виконання стандартів;", "увага — порядку дій особового складу, управлінню підрозділом і тактичним діям;", "в обговоренні беруть участь усі — від солдата до командира;", "використовуються відкриті запитання, заохочуються ініціатива і креативність;", "визначаються і сильні, і слабкі сторони;", "висновки фіксуються, щоб уроки не загубилися."]], ["p", "<b>Роль модератора:</b> забезпечує нейтральну атмосферу, стежить за структурою, заохочує відкритість і взаємоповагу, підбиває підсумки й виділяє ключові уроки."], ["warn", "Під час АПД не можна: звинувачувати персонально, переривати чи пригнічувати учасників, замовчувати незручні проблеми, перетворювати АПД на формальність без висновків. Критикуємо дії, а не людей."]]}, {"h": "АПД на практиці: розбір сценарію", "body": [["p", "Практична робота заняття: відділення з командиром і сімома солдатами обороняє стратегічний пункт до підходу підкріплення. Курсант за перебігом подій заповнює чотири пункти АПД."], ["p", "<b>Що планували:</b> зайняти позицію, утримувати до прибуття підкріплення, не допустити прориву противника через контрольовану зону."], ["p", "<b>Що вдалося:</b> позиції зайняли вчасно, противника помітили завчасно, снайпер влучно відкрив вогонь, гранатометник із помічником діяли злагоджено, позицію утримали до підкріплення."], ["p", "<b>Що ні:</b> кулеметну стрічку спорядили неякісно — збої у вогні; після пострілу з гранатомета не проконтролювали зону ураження; спостерігач не доповів про рух на фланзі; командир запізно викликав підкріплення."], ["p", "<b>Що змінимо:</b> контроль спорядження, доповідь про кожну загрозу без вагань, контроль зони ураження після застосування важкого озброєння, чіткий порядок рішення про виклик підкріплення, додаткові засоби спостереження — БпЛА."], ["p", "Пройдіть цей сценарій самостійно у вкладці «Практика» — тренажер АПД."]]}], "keys": ["АПД / AAR — обговорення виконаного завдання, щоб вчитися, а не шукати винних.", "Основний документ у ЗСУ — Тимчасова інструкція з процесу АПД заходів підготовки ВП 7(3)-00(01).01 (2019).", "Чотири запитання: що мало відбутися, що відбулося і чому, що вдалося і що ні, що зробити наступного разу.", "Два типи: офіційний (формальний) і у робочому порядку (неформальний).", "АПД — одразу після завдання, за участі всіх, з відкритими запитаннями.", "Критикуємо дії, а не людей; висновки обов’язково фіксуємо."], "test": [["Яка головна мета АПД?", ["Вчитися: що сталося, чому і як зробити краще", "Знайти винних у провалі завдання", "Виставити оцінки кожному", "Звітувати перед вищим командуванням"], "Мета АПД — вчитися, а не шукати винних."], ["Який документ лишається основним керівним для АПД у ЗСУ?", ["Тимчасова інструкція ВП 7(3)-00(01).01", "Наказ ГШ ЗСУ № 41 від 05.03.2012", "Посібник армії США TC 25-20", "Доктрина НАТО AJP-3 (оперативна)"], "У 2019 році процес описано в Тимчасовій інструкції ВП 7(3)-00(01).01; вона лишається основним документом."], ["Який документ армії США є коротким посібником для командирів з AAR?", ["TC 25-20 «A Leader’s Guide to AAR»", "FM 3-21.8 «Infantry Rifle Platoon»", "AJP-3 «Conduct of Operations»", "ADP 7-0 «Training» (доктрина)"], "TC 25-20 — короткий посібник для командирів з проведення AAR."], ["Модель «Aim – Outcome – Lessons – Actions» використовують у якій армії?", ["Великої Британії", "Сполучених Штатів", "Бундесверу Німеччини", "Війська Польського"], "Велика Британія — «Aim – Outcome – Lessons – Actions»; Бундесвер — «Розпізнати – Оцінити – Покращити»."], ["Що таке hasty AAR у практиці США?", ["Неформальний AAR одразу після події", "Письмовий звіт командира через тиждень", "Формальний AAR лише для офіцерів", "AAR із залученням військової поліції"], "У США широко застосовують неформальний AAR одразу після події, командир виступає фасилітатором."], ["На якому етапі АПД збирають думки підрозділу OPFOR, командирів, сержантів і солдатів?", ["Етап 2 — що реально виконано", "Етап 1 — що мало бути виконано", "Етап 3 — що правильно і неправильно", "Етап 4 — як діяти наступного разу"], "На етапі 2 збирають якомога більше думок, щоб виробити спільне розуміння подій."], ["Хто визначає сильні й слабкі сторони дій на етапі 3?", ["Самі учасники за критеріями; керівник скеровує", "Лише керівник заняття одноосібно", "Оцінювач без обговорення з учасниками", "Командир роти письмово після заняття"], "Учасники самі визначають сильні та слабкі сторони; керівник лише скеровує."], ["Що, крім рішень, визначається на етапі 4?", ["Хто відповідає за впровадження змін", "Хто винний у допущених помилках", "Оцінки кожному учаснику заняття", "Дата і місце наступного заняття"], "Етап 4: учасники пропонують рішення і визначають, хто відповідає за впровадження змін."], ["Звідки беруть інформацію для етапу 1 — що мало бути виконано?", ["З наказу, плану проведення і графіка", "З розповідей учасників після заняття", "З відеозапису перебігу заняття", "З доповідей підрозділу OPFOR"], "Етап 1 — задум, цілі, завдання; джерела — наказ, план проведення, графік заняття."], ["Яка головна перевага неформального АПД?", ["Негайний зворотний зв’язок на місці", "Офіційне документування висновків", "Участь вищого командування", "Не потребує участі всього складу"], "Неформальний АПД дає негайний зворотний зв’язок без зупинки навчання. Обидва типи потребують участі всіх."], ["Що потребує офіційний (формальний) АПД?", ["Завчасне планування, рекогносцировка, обладнання місця", "Нічого — проводиться одразу на місці заняття", "Лише присутності інструктора і журналу", "Лише письмового звіту командира після заняття"], "Формальний АПД планують ще з планами бойової підготовки; потрібні рекогносцировка, обладнання, координація."], ["Під час АПД командир каже: «Через тебе ми провалили завдання». Яке правило порушено?", ["Не можна звинувачувати персонально", "Не можна висловлюватися командиру", "Розбір треба переносити на завтра", "Правил не порушено — це чесно"], "Під час АПД не можна звинувачувати персонально, переривати, замовчувати проблеми."], ["Коли проводиться АПД?", ["Під час або одразу після кожного завдання", "Раз на тиждень за підсумками всіх занять", "Наприкінці курсу як частина іспиту", "Лише після невдало виконаних завдань"], "АПД — під час або одразу після кожного завдання, поки все свіже."], ["Яка роль модератора АПД?", ["Нейтральна атмосфера, структура, підсумки", "Оголосити правильні відповіді учасникам", "Визначити винних і доповісти командиру", "Записати оцінки кожному учаснику"], "Модератор забезпечує нейтральність, структуру, взаємоповагу, підбиває підсумки й виділяє уроки."], ["У сценарії оборони стрічку кулемета спорядили неякісно і були збої у вогні. До якого пункту АПД це належить і що змінюємо?", ["«Що не вдалося» → контроль спорядження", "«Що вдалося» → нічого", "«Що планували» → новий наказ", "«Що змінимо» → замінити кулеметника"], "Неякісне спорядження стрічки — серед того, що не вдалося; зміна — контроль спорядження."], ["Спостерігач у сценарії не доповів про рух на фланзі. Яке рішення відповідає принципам АПД?", ["Доповідати про кожну загрозу і додати БпЛА", "Покарати спостерігача перед відділенням", "Прибрати спостерігача з позиції взагалі", "Не згадувати, щоб не знизити моральний дух"], "Що змінимо: доповідь про кожну загрозу без вагань, додаткові засоби спостереження — БпЛА."]]}, {"id": "b1m2t4z3", "code": "Б1 М2 Т4 З3", "theme": "Тема 4. Організація та проведення занять", "title": "Складові частини заняття, розподіл часу, план-конспект", "short": "Складові заняття", "passport": {"goal": "Довести військовослужбовцям, з яких частин складається заняття, як розподіляти час між ними; навчити опрацьовувати план-конспект (план) проведення заняття.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Складові частини заняття та значення кожної", "Розподіл часу між частинами заняття", "Порядок і правила опрацювання план-конспекту"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; практичне завдання з опису цілі.", "criteria": "Позитивно — якщо знає частини заняття, розподіл часу і вміє опрацювати план-конспект.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.3 (зразки план-конспектів); презентація; тест за темою"}, "sections": [{"h": "Три частини заняття", "body": [["p", "Будь-яке навчальне заняття складається з трьох частин: <b>вступної, основної і заключної</b>. Кожна має обов’язкові пункти, і пропустити їх не можна — за кожним з них оцінюють курсанта на пробному занятті."], ["key", "Вступна → основна → заключна. Структура однакова для лекції, практичного й польового заняття."]]}, {"h": "Вступна частина", "body": [["ul", ["привітання і перевірка присутності особового складу (за журналом бойової підготовки або списком);", "перевірка матеріальних засобів і доведення правил поводження;", "<b>доведення заходів безпеки</b> — залежать від умов заняття: повітряна тривога, пожежна безпека; на заняттях зі зброєю — перевірка на розрядженість, доповідь про боєприпаси, 5 правил, команда «Стоп»;", "перевірка знань попереднього заняття — тема і опитування;", "доведення теми і мети заняття;", "<b>хід заняття</b> — місце, час, метод, навчальні питання, умови оцінювання (як і коли), критерії оцінювання;", "порядок проведення — як ставити запитання, як відповідати, порядок конспектування, розміщення;", "<b>мотивація</b> — чому ця тема важлива, з прикладом з реального досвіду."]]]}, {"h": "Основна і заключна частини", "body": [["p", "<b>Основна частина</b> складається з трьох елементів:"], ["ul", ["<b>викладання</b> — мінімальний обсяг матеріалу, потрібний, щоб перейти до практики;", "<b>практика</b> — якщо вона передбачена заняттям: топографія, зв’язок, зброя; на практичних заняттях — за EDIP: пояснення, демонстрація, імітація, тренування;", "<b>контроль</b> — перевірка засвоєних знань або навичок."]], ["p", "<b>Заключна частина</b> має два основні елементи:"], ["ul", ["<b>підведення підсумків</b> — нагадати тему, мету і навчальні питання, сказати, чи досягнута мета, оголосити оцінки (техніка «похвала — критика — похвала»);", "<b>кінцеві інструкції</b> — завдання на самостійну підготовку, тема, місце і час наступного заняття, потрібна матеріальна база, призначення прибиральників. На заняттях зі зброєю — обов’язкова перевірка зброї на розрядженість у всіх."]]]}, {"h": "Розподіл часу", "body": [["p", "Рекомендований розподіл часу заняття:"], ["ul", ["<b>вступна частина — 5–10%</b>;", "<b>основна частина — 80–85%</b>;", "<b>заключна частина — 10%</b>."]], ["p", "Для 45-хвилинного заняття це приблизно 3–5 хв на вступ, 38 хв на основну частину і 3–5 хв на завершення. У зразку план-конспекту теоретичного заняття: 3 + 39 + 3 хвилини; практичного на 90 хвилин: 6 + 80 + 4."], ["p", "Принципи розподілу часу:"], ["ul", ["час на кожну частину залежить від її внеску в досягнення мети — найважливішому більше часу;", "передбачайте зміну видів діяльності, щоб уникнути втоми;", "враховуйте рівень підготовки аудиторії — підготовленим менше вступу, більше самостійної роботи;", "закладайте резерв 5–10% на запитання, дискусії, технічні затримки;", "чергуйте інтенсивні й спокійніші види діяльності;", "за потреби візуалізуйте час — таймер, графік."]], ["warn", "Пунктуальність — критичний пункт оціночного листа: час заняття має вкластися в ±5 хвилин, інакше заняття не зараховане."]]}, {"h": "Як готувати план-конспект", "body": [["p", "План-конспект — опорний документ, що відтворює структуру і основний зміст заняття і допомагає провести його ефективно. Його складання — завершальний етап підготовки інструктора."], ["ul", ["<b>Розклад занять</b> — вихідні дані: вид заняття, з ким, час, місце, тема, тривалість, матеріальне забезпечення, керівні документи.", "<b>Програма підготовки</b> — що вже вивчено, що треба вивчити, попередні й наступні заняття, нормативи, форма і методи.", "<b>Мета і навчальні питання</b> — визначити навчальну й виховну мету, розподілити зміст і час між навчальними питаннями.", "<b>Керівні документи і література</b> — вивчити й уточнити зміст, нормативи, методи і забезпечення.", "<b>План-конспект</b> — оформити за зразком."]]]}, {"h": "Що містить план-конспект", "body": [["p", "Шапка: гриф «ЗАТВЕРДЖУЮ», тема, заняття, <b>мета</b>, <b>опис цілі</b> (вимоги, умови та обставини, критерії оцінювання), навчальні питання, час, місце, метод, керівництва і посібники, матеріальне забезпечення."], ["p", "Хід заняття: вступна частина з хвилинами і заходами безпеки; основна частина за навчальними питаннями — для практичного заняття з етапами EDIP: що робить інструктор, що роблять курсанти, розміщення, акценти, запитання; контроль; заключна частина."], ["p", "Наприкінці — підпис керівника заняття. У додатку «КІБР» план-конспект можна зібрати в конструкторі, а мету — потренувати в тренажері «Опис цілі»."], ["key", "План-конспект — опорний документ: чітка структура, хвилини на кожну частину, мета і опис цілі, заходи безпеки."]]}], "keys": ["Три частини заняття: вступна, основна, заключна.", "Основна частина: викладання, практика, контроль.", "Заключна: підведення підсумків і кінцеві інструкції.", "Час: вступ 5–10%, основна 80–85%, заключна 10%; резерв 5–10%.", "План-конспект — опорний документ; готується на основі розкладу і програми."], "test": [["Інструктор почав заняття одразу з теми, пропустивши доведення заходів безпеки. Чим це загрожує на пробному занятті?", ["Кожен пункт вступу оцінюється — пропуск знижує оцінку", "Нічим — безпеку можна довести й наприкінці", "Лише усним зауваженням оцінювача", "Нічим, якщо заняття теоретичне, без зброї"], "Кожна частина має обов’язкові пункти; пропустити їх не можна — за кожним оцінюють на пробному занятті."], ["Що з переліченого належить до вступної частини?", ["Мотивація — чому тема важлива", "Оголошення оцінок за заняття", "Призначення прибиральників", "Контроль засвоєних навичок"], "Вступ: присутність, матеріальні засоби, безпека, перевірка попереднього, тема і мета, хід заняття, порядок проведення, мотивація."], ["Які три елементи має основна частина заняття?", ["Викладання, практика, контроль", "Привітання, тема, мотивація", "Підсумки, оцінки, завдання", "Пояснення, обговорення, перерва"], "Основна частина: викладання (мінімум для переходу до практики), практика, контроль."], ["Скільки матеріалу подавати на етапі викладання основної частини?", ["Мінімальний обсяг, потрібний, щоб перейти до практики", "Якомога більше, щоб охопити тему повністю", "Увесь розділ програми", "Стільки, скільки встигне інструктор"], "Викладання — мінімальний обсяг матеріалу, потрібний для переходу до практики."], ["Яку техніку застосовують під час оголошення оцінок у заключній частині?", ["«Похвала — критика — похвала»", "«Критика — критика — похвала»", "Лише критика помилок", "Оцінки не коментують"], "Підведення підсумків з технікою «похвала — критика — похвала»."], ["Що обов’язково в кінцевих інструкціях заняття зі зброєю?", ["Перевірка зброї на розрядженість у всіх", "Чищення зброї інструктором особисто", "Повторне доведення п’яти правил безпеки", "Здача зброї черговому без перевірки"], "На заняттях зі зброєю наприкінці обов’язкова перевірка на розрядженість у всіх."], ["Практичне заняття триває 90 хвилин. Який розподіл часу наведено у зразку план-конспекту?", ["6 + 80 + 4 хвилини", "3 + 39 + 3 хвилини", "10 + 70 + 10 хвилин", "15 + 60 + 15 хвилин"], "Зразок практичного на 90 хв: 6 + 80 + 4. Теоретичного на 45 хв: 3 + 39 + 3."], ["Яка частка часу рекомендована для основної частини?", ["80–85%", "50–60%", "90–95%", "70%"], "Вступ — 5–10%, основна — 80–85%, заключна — 10%."], ["Заняття заплановане на 45 хвилин, а інструктор завершив через 52. Що це означає за оціночним листом?", ["Порушено пунктуальність — заняття не зараховане", "Нічого — якість важливіша за хронометраж", "Лише мінус один бал за організацію", "Зараховане, бо перевищення менше 10 хвилин"], "Пунктуальність — критичний пункт: заняття має вкластися в ±5 хвилин, інакше не зараховане."], ["Скільки часу закладати в резерв на запитання і технічні затримки?", ["5–10%", "20–25%", "1–2%", "Резерв не потрібен"], "Принцип розподілу часу: закладайте резерв 5–10%."], ["Група добре підготовлена. Як змінити розподіл часу?", ["Менше вступу, більше самостійної роботи", "Більше вступу і теоретичного пояснення", "Скоротити практику на користь теорії", "Нічого не змінювати — розподіл сталий"], "Враховуйте рівень: підготовленим — менше вступу, більше самостійної роботи."], ["З чого починається підготовка план-конспекту?", ["З розкладу занять — вихідних даних", "Із заповнення шапки «ЗАТВЕРДЖУЮ»", "З вибору методу", "З написання ходу заняття"], "Порядок: розклад → програма підготовки → мета і навчальні питання → документи → оформлення план-конспекту."], ["Що з переліченого містить шапка план-конспекту?", ["Мету, опис цілі, питання, час, місце, метод", "Оцінки курсантів за попереднє заняття", "Список прибиральників і чергових", "Результати контролю попереднього заняття"], "Шапка: «ЗАТВЕРДЖУЮ», тема, мета, опис цілі, навчальні питання, час, місце, метод, посібники, забезпечення."], ["Що вказується в ході практичного заняття для кожного етапу EDIP?", ["Дії інструктора і курсантів, розміщення, акценти", "Лише назва етапу і його мета", "Лише хвилини, відведені на етап", "Оцінки, отримані курсантами за етап"], "Для практичного заняття — що робить інструктор і курсанти, розміщення, акценти, запитання."], ["Яким за рахунком етапом підготовки інструктора є складання план-конспекту?", ["Завершальним", "Першим", "Другим", "Його складають після заняття"], "Складання план-конспекту — завершальний етап підготовки інструктора."]]}, {"id": "b1m2t4z4", "code": "Б1 М2 Т4 З4", "theme": "Тема 4. Організація та проведення занять", "title": "Обладнання місця проведення заняття. Розташування інструктора", "short": "Місце заняття", "passport": {"goal": "Ознайомити військовослужбовців з правилами обладнання місця проведення заняття (класу), довести принципи, за якими інструктор обирає місце свого розташування відносно курсантів.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Правила обладнання місця проведення заняття", "Принципи вибору місця розташування інструктора", "Варіанти розміщення курсантів і інструктора"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; зобразити варіанти розміщення.", "criteria": "Позитивно — якщо знає правила обладнання класу, принципи розташування інструктора і варіанти розміщення курсантів.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.4; презентація; тест за темою"}, "sections": [{"h": "Як підготувати клас", "body": [["ul", ["<b>Розмір і робочі місця</b> — місце для кожного курсанта, краще з кількома запасними; якщо плануєте групову роботу, простір не має заважати.", "<b>Освітлення</b> — світло від вікон чи ламп не повинне бити в очі курсантам або інструктору і давати відблиски на дошці чи екрані; у класі не повинно бути темно.", "<b>Живлення</b> — справні розетки в потрібному місці або подовжувачі для проектора й інших засобів.", "<b>Резерв</b> — дошка виручить у форс-мажорі, наприклад при вимкненні світла; усі засоби перевірені й готові.", "<b>Нічого зайвого</b> — зайві столи, стільці, непотрібна матеріальна база заважають."]]]}, {"h": "Норми для навчального приміщення", "body": [["p", "У презентації заняття наведено орієнтовні норми:"], ["ul", ["площа — 2,4 м² на курсанта: для 30 курсантів не менше 72 м²;", "від дошки до першої парти — не менше 3 м (кут зору до 35°), до останньої — не більше 10 м;", "температура повітря 18–22 °C, відносна вологість близько 60%, шум — до 45 дБ (рівень звичайної розмови);", "максимум природного світла, яке падає на робочі місця <b>зліва</b>; площа вікон — щонайменше чверть площі підлоги;", "з вересня до травня додають штучне освітлення білого або холодно-білого кольору."]], ["p", "Недостатнє освітлення погіршує здоров’я, знижує працездатність, підвищує втому і нервову напругу."]]}, {"h": "Де стояти інструктору", "body": [["ul", ["<b>Повна видимість</b> — бачите всіх курсантів або визначені групи.", "<b>Чітка комунікація</b> — команди й пояснення чути всім; за потреби — підсилювальні засоби.", "<b>Дисципліна присутністю</b> — позиція, яка запобігає порушенням.", "<b>Безпека</b> — на заняттях з ризиком займайте місце, звідки контролюєте дії і можете запобігти нещасному випадку.", "<b>Доступність</b> — можна швидко підійти до курсанта, якому потрібна допомога.", "<b>Якісна демонстрація</b> — під час показу ваші дії добре видно всім.", "<b>Динамічність і етап заняття</b> — фронтально під час пояснення, між курсантами під час практичної роботи.", "<b>Особливості місцевості</b> — розміри, освітлення, перешкоди на навчальній локації."]], ["key", "Інструктор бачить усіх, усі бачать і чують інструктора — і він може швидко підійти до кожного."]]}, {"h": "Варіанти розміщення курсантів", "body": [["p", "<b>Рядами (два-три ряди)</b> — традиційне розташування обличчям до інструктора. Переваги: добрий візуальний контакт, легкий контроль дисципліни, зручно для лекції і фронтального опитування, ефективне використання площі. Недоліки: мало взаємодії між курсантами, пасивність задніх рядів, складно працювати індивідуально. Для лекцій, теоретичних занять, інструктажів."], ["p", "<b>Літерою «П»</b> — відкрита частина до інструктора. Переваги: всі бачать одне одного, заохочує дискусію, інструктор має доступ до кожного, довірлива атмосфера. Недоліки: потребує більше простору, менш ефективне для великих груп. Для семінарів, тренінгів, обговорень, презентацій курсантів."], ["p", "<b>Групами по 3–6 осіб</b> — інструктор вільно ходить між групами. Переваги: співпраця, командна робота, інтерактивні методи, увага групам, яким потрібна допомога. Недоліки: складніше контролювати дисципліну, не всім комфортно в команді, потрібне ретельне планування завдань. Для практичних занять, кейсів, проєктів."], ["p", "Інші варіанти: <b>коло чи півколо</b> — для рівноправних дискусій; <b>каре</b> — обличчям одне до одного, для дебатів і засідань."], ["p", "Часто найкраще поєднувати різні варіанти протягом одного заняття — інструктор має вміти гнучко змінювати простір."]]}], "keys": ["Клас: місце кожному курсанту, світло не в очі і без відблисків, живлення, нічого зайвого.", "Природне світло — зліва; температура 18–22 °C.", "Інструктор: повна видимість, чутність, безпека, доступність, динамічність.", "Рядами — для лекцій; літерою «П» — для дискусій; групами — для практичної роботи."], "test": [["Клас для 30 курсантів. Якою має бути мінімальна площа за орієнтовною нормою?", ["72 м²", "30 м²", "60 м²", "90 м²"], "Норма — 2,4 м² на курсанта: 30 × 2,4 = 72 м²."], ["Яка відстань від дошки до першої парти вважається мінімальною?", ["Не менше 3 м", "Не менше 1 м", "Не менше 5 м", "Не більше 2 м"], "Від дошки до першої парти — не менше 3 м (кут зору до 35°), до останньої — не більше 10 м."], ["Остання парта стоїть за 13 м від дошки. Що не так?", ["Перевищено максимум — не більше 10 м", "Нічого, норм немає", "Замало — має бути 15 м", "Норма стосується лише першої парти"], "До останньої парти — не більше 10 м."], ["Яка температура повітря рекомендована в навчальному класі?", ["18–22 °C", "14–16 °C", "24–26 °C", "Будь-яка"], "Температура 18–22 °C, вологість близько 60%, шум до 45 дБ."], ["З якого боку має падати природне світло на робочі місця?", ["Зліва", "Справа", "Ззаду", "Спереду, від дошки"], "Максимум природного світла, що падає на робочі місця зліва."], ["Сонце з вікна дає відблиск на екрані проектора. Яке правило порушено?", ["Освітлення — без відблисків на екрані", "Розмір класу і робочі місця", "Живлення і розетки", "Нічого зайвого в класі"], "Освітлення не повинно бити в очі курсантам чи інструктору і давати відблиски."], ["Навіщо мати в класі дошку, навіть якщо є проектор?", ["Як резерв на випадок форс-мажору", "Для оформлення класу за вимогами", "Щоб записувати оцінки курсантів", "Це обов’язкова вимога статуту"], "Резерв: дошка виручить у форс-мажорі."], ["Яка площа вікон має бути відносно площі підлоги?", ["Щонайменше чверть", "Щонайменше половина", "Щонайменше десята частина", "Не нормується"], "Площа вікон — щонайменше чверть площі підлоги."], ["Під час практичної роботи інструктор стоїть біля дошки і не підходить до курсантів. Що не так?", ["На практиці інструктор має ходити між курсантами", "Нічого — від дошки він бачить усю групу", "Він має сидіти за столом і спостерігати", "Він має вийти, щоб не заважати курсантам"], "Динамічність: фронтально під час пояснення, між курсантами під час практичної роботи."], ["На заняття з бойовою зброєю: як обирати позицію інструктора насамперед?", ["Звідки контролюєте дії і запобігаєте нещасному випадку", "Звідки вас найкраще чутно всім курсантам", "Де вам найзручніше стояти протягом заняття", "Позаду всіх курсантів, щоб не заважати"], "Безпека — на заняттях з ризиком займайте місце, звідки контролюєте дії і можете запобігти нещасному випадку."], ["Яке розміщення курсантів найкраще для лекції і фронтального опитування?", ["Рядами", "Літерою «П»", "Групами по 3–6", "Колом"], "Ряди: добрий візуальний контакт, легкий контроль, зручно для лекції й фронтального опитування."], ["Який головний недолік розміщення рядами?", ["Мало взаємодії й пасивність задніх рядів", "Потребує значно більше простору", "Складно контролювати дисципліну", "Погано видно інструктора й дошку"], "Недоліки рядів: мало взаємодії між курсантами, пасивність задніх рядів."], ["Плануєте семінар з обговоренням для 14 курсантів. Яке розміщення доречне?", ["Літерою «П»", "Рядами", "Каре з двома командами", "Шеренгою"], "«П» — всі бачать одне одного, заохочує дискусію, для семінарів і обговорень; менш ефективне для великих груп."], ["Яка складність розміщення групами по 3–6 осіб?", ["Складніший контроль дисципліни і планування", "Взаємодії між курсантами майже немає", "Інструктор не може ходити між групами", "Підходить лише для лекційних занять"], "Групи: співпраця, але складніше контролювати дисципліну і потрібне планування."], ["Для дебатів, де сторони сидять обличчям одна до одної, яке розміщення?", ["Каре", "Ряди", "Літера «П»", "Групи по 3"], "Каре — обличчям одне до одного, для дебатів і засідань; коло — для рівноправних дискусій."]]}, {"id": "b1m2t4z5", "code": "Б1 М2 Т4 З5", "theme": "Тема 4. Організація та проведення занять", "title": "Навчально-методичні матеріали, НМТБ, технічні та цифрові засоби", "short": "НМТБ і засоби навчання", "passport": {"goal": "Ознайомити військовослужбовців з правилами підготовки навчально-методичних матеріалів, вимогами до презентацій, правилами підготовки НМТБ і використання технічних, медійних та цифрових засобів навчання.", "time": "4 години (180 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Мета і типи візуальної підтримки", "Техніка використання візуальних засобів", "Вимоги до навчально-методичних матеріалів і презентацій", "Підготовка НМТБ до різних видів занять", "Технічні, медійні та цифрові засоби навчання"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.5; презентація; тести за темою"}, "sections": [{"h": "Навіщо візуальна підтримка", "body": [["p", "Візуальна підтримка допомагає донести інформацію швидше, точніше й надійніше, особливо коли часу мало або навантаження високе. Вона покращує сприйняття, зменшує помилки, прискорює прийняття рішень, підтримує пам’ять і уніфікує дії."], ["p", "Основні типи візуальної підтримки та їхні особливості:"], ["ul", ["<b>Плакати</b> — можна в класі й на вулиці, багаторазові; але великі, їх не змінити, можуть відволікати.", "<b>Аудіо і відео</b> — привертають увагу, показують навички; але потрібні живлення і техніка.", "<b>Схеми</b> — наочні, структуровані, економлять час; але обмежені в деталях і потребують пояснення.", "<b>Макети</b> — наочні, практичні, підвищують інтерес; але потребують місця і часу на підготовку.", "<b>Дошка</b> — швидко і зручно, взаємодія з аудиторією; але мало місця.", "<b>Презентація</b> — послідовний показ, легко змінити; але потрібні живлення й навички.", "<b>Демонстраційна група</b> — фактор реальності, живий показ вправи; але складна підготовка."]], ["p", "Принцип вибору засобу: <b>простий, цікавий, підходящий, необхідний, достатнього розміру</b>."]]}, {"h": "Техніка використання візуальних засобів: ВПОВС", "body": [["ul", ["<b>Випробувати</b> — перед заняттям перевірити, що засіб працює і все видно.", "<b>Показати</b> — продемонструвати в потрібний момент, щоб бачили всі.", "<b>Обговорити</b> — пояснити, що саме зображено і на що звернути увагу.", "<b>Використати</b> — застосувати засіб для досягнення мети заняття.", "<b>Сховати</b> — прибрати, щоб не відволікав від подальшого матеріалу."]], ["key", "Випробувати — показати — обговорити — використати — сховати. Цю техніку перевіряють в оціночному листі."]]}, {"h": "Навчально-методичні матеріали", "body": [["p", "<b>За призначенням:</b> основні — підручники, посібники, статути, настанови, курси лекцій; допоміжні — збірники завдань, методичні рекомендації, опорні конспекти, роздатковий матеріал, плакати; контрольно-оцінювальні — тести, контрольні питання, залікові завдання, критерії оцінювання."], ["p", "<b>За носієм:</b> друковані, електронні (презентації, відео, електронні посібники, тренажери, онлайн-курси) і матеріальні засоби (зразки озброєння, макети, тренажери, карти, засоби зв’язку та імітації)."], ["p", "<b>Вимоги до матеріалів:</b>"], ["ul", ["змістовність і науковість — відповідність програмам і документам, достовірність, актуальність, логічна структура;", "методична обґрунтованість — чітка мета, різні методи, практичні завдання, питання для самоконтролю і критерії оцінювання;", "зручність — чітка структура, грамотна мова, якісне оформлення;", "військова специфіка — офіційна термінологія, правила роботи з інформацією обмеженого доступу, наближеність до реальної служби, посилання на керівні документи, регулярне оновлення."]]]}, {"h": "Вимоги до презентацій", "body": [["ul", ["<b>Правило 6×6</b> — не більше 6 рядків на слайді і 6 слів у рядку;", "логічна послідовність і нумерація слайдів;", "інтервал між пунктами більший, ніж між рядками всередині пункту;", "вирівнювання тексту по лівому краю;", "заголовки — 32–44 пт, основний текст — 28–32 пт;", "базовий шрифт комунікації ЗСУ — <b>UAF Sans</b>;", "не писати весь текст великими літерами — це читається як крик;", "не більше 3 основних кольорів на слайді, контраст тексту і фону;", "жодних граматичних і орфографічних помилок;", "якісні зображення, помірна анімація, єдиний стиль;", "перевірити показ на тому обладнанні, де буде заняття."]], ["warn", "Перевантажений текстом слайд — найчастіша помилка. Краще розбити матеріал на кілька слайдів."]]}, {"h": "Підготовка НМТБ", "body": [["p", "<b>Загальні правила:</b> завчасність, планування за план-конспектом, особиста відповідальність інструктора, координація із завідувачами класів і складів, особиста перевірка перед заняттям, безпека, ефективність і аналіз після заняття."], ["p", "<b>До теоретичного заняття:</b> визначити потребу в проекторі, екрані, комп’ютері, звуку й подати запит; перевірити файли презентацій і відео; підготувати роздатковий матеріал; розмістити плакати й макети так, щоб їх бачили всі; розставити меблі, перевірити освітлення; особисто перевірити всю техніку; мати дошку, маркери, указку."], ["p", "<b>До практичного заняття:</b> визначити точну кількість зброї, техніки, приладів, витратних матеріалів і засобів захисту; отримати й доставити їх; обладнати навчальні місця, зробити розмітку і позначити зони безпеки; перевірити засоби пожежогасіння і медичної допомоги; рівномірно розподілити обладнання."], ["p", "<b>Після заняття:</b> зібрати і повернути НМТБ, перевірити комплектність і справність, повідомити про несправності, проаналізувати ефективність."]]}, {"h": "Технічні, медійні та цифрові засоби", "body": [["p", "Технічні засоби навчання — електронні, механічні та аудіовізуальні пристрої, що підвищують ефективність навчання. За сприйняттям вони бувають <b>візуальні, аудитивні й аудіовізуальні</b>; за призначенням — засоби передачі інформації, контролю знань, тренажери, засоби самонавчання і допоміжні."], ["p", "Принципи використання: цілеспрямованість — засіб служить меті, а не для ефекту; візуалізація складного; простота; поєднання з традиційними методами; планована, а не епізодична інтеграція."], ["p", "Медійні засоби: друковані, аудіо (записи, подкасти), відео (навчальні фільми, відеоінструкції), інтерактивні (симуляції, онлайн-курси, мобільні навчальні застосунки) і соціальні (закриті групи, спільна робота з файлами)."], ["p", "Цифрові засоби зі штучним інтелектом допомагають готувати матеріали, тести, озвучку й тренажери — як цей додаток. Але інструктор завжди перевіряє зміст на відповідність керівним документам."]]}], "keys": ["Принцип вибору засобу: простий, цікавий, підходящий, необхідний, достатнього розміру.", "Техніка: випробувати — показати — обговорити — використати — сховати.", "Правило 6×6; заголовки 32–44 пт, текст 28–32 пт; шрифт UAF Sans; не більше 3 кольорів.", "НМТБ: завчасно, за план-конспектом, особиста перевірка і безпека.", "ТЗН: візуальні, аудитивні, аудіовізуальні; засіб служить меті."], "test": [["Інструктор показує схему побудови оборони, коротко пояснює її і використовує, а потім лишає на екрані до кінця заняття. Який крок ВПОВС пропущено?", ["Сховати", "Випробувати", "Обговорити", "Показати"], "ВПОВС: випробувати — показати — обговорити — використати — сховати. Засіб прибирають, щоб не відволікав."], ["Що означає крок «Випробувати» в техніці ВПОВС?", ["Перевірити до заняття, що засіб працює і видно", "Дати курсантам потримати засіб у руках", "Перевірити знання курсантів за допомогою засобу", "Протестувати засіб на одному з курсантів"], "Випробувати — перед заняттям перевірити роботу засобу і видимість."], ["Який засіб візуальної підтримки дає «фактор реальності» — живий показ вправи?", ["Демонстраційна група", "Плакат на стенді", "Схема на слайді", "Дошка з малюнком"], "Демонстраційна група — живий показ, фактор реальності; але складна підготовка."], ["Який головний недолік схем як засобу візуальної підтримки?", ["Обмежені в деталях, потребують пояснення", "Їх не можна використовувати в класі", "Для них потрібне живлення і техніка", "Займають багато місця і часу"], "Схеми наочні й структуровані, але обмежені в деталях і потребують пояснення."], ["Слайд містить 10 рядків по 12 слів. Яке правило порушено?", ["Правило 6×6", "Правило трьох кольорів", "Вирівнювання по лівому краю", "Нумерація слайдів"], "Правило 6×6. Перевантажений текстом слайд — найчастіша помилка."], ["Який розмір шрифту рекомендований для основного тексту презентації?", ["28–32 пт", "12–14 пт", "18–20 пт", "48–60 пт"], "Заголовки — 32–44 пт, основний текст — 28–32 пт."], ["Чому не варто писати весь текст слайда великими літерами?", ["Читається як крик і гірше сприймається", "Займає значно більше місця на слайді", "Заборонено вимогами статуту ЗСУ", "Навпаки — це рекомендовано для заголовків і тексту"], "Не писати весь текст великими літерами — це читається як крик."], ["Який базовий шрифт комунікації ЗСУ?", ["UAF Sans", "Times New Roman", "Arial", "Roboto"], "Базовий шрифт комунікації ЗСУ — UAF Sans."], ["Скільки основних кольорів допустимо на слайді?", ["Не більше 3", "Не більше 6", "Скільки завгодно", "Лише один"], "Не більше 3 основних кольорів на слайді, контраст тексту і фону."], ["До якого виду навчально-методичних матеріалів належать тести і критерії оцінювання?", ["Контрольно-оцінювальні", "Основні", "Допоміжні", "Матеріальні засоби"], "За призначенням: основні, допоміжні, контрольно-оцінювальні (тести, контрольні питання, критерії)."], ["Що з переліченого — вимога військової специфіки до матеріалів?", ["Офіційна термінологія і правила обмеженого доступу", "Яскраве оформлення і багато ілюстрацій", "Великий обсяг і детальність викладу", "Обов’язкова анімація на кожному слайді"], "Військова специфіка: офіційна термінологія, правила обмеженого доступу, наближеність до служби, посилання на документи, оновлення."], ["Хто відповідає за підготовку НМТБ до заняття?", ["Інструктор особисто, у координації зі складами", "Лише завідувач складу навчального центру", "Командир роти за заявкою інструктора", "Черговий по класу напередодні заняття"], "Загальні правила: особиста відповідальність інструктора, координація, особиста перевірка перед заняттям."], ["Що інструктор робить з НМТБ після заняття?", ["Повертає, перевіряє справність, повідомляє про несправності", "Залишає в класі до наступного заняття", "Передає курсантам для самостійної підготовки", "Нічого — це обов’язок працівників складу"], "Після заняття: зібрати і повернути, перевірити комплектність і справність, повідомити, проаналізувати."], ["Інструктор вставляє в лекцію ефектне відео без зв’язку з метою. Який принцип використання ТЗН порушено?", ["Цілеспрямованість", "Простота", "Візуалізація складного", "Поєднання з традиційними методами"], "Цілеспрямованість: засіб служить меті заняття, а не для ефекту."], ["Тести для заняття згенерував штучний інтелект. Що обов’язково має зробити інструктор?", ["Перевірити зміст на відповідність документам", "Нічого — ШІ не помиляється у фактах", "Лише перевірити граматику й орфографію", "Видати тести без змін, щоб зекономити час"], "Цифрові засоби з ШІ допомагають, але інструктор завжди перевіряє зміст на відповідність документам."], ["Що перевіряють під час підготовки НМТБ до практичного заняття?", ["Кількість зброї, розмітку зон безпеки, медицину", "Лише наявність проектора та екрана", "Тільки роздатковий матеріал для курсантів", "Лише освітлення і температуру в класі"], "До практичного: точна кількість зброї й матеріалів, навчальні місця, розмітка зон безпеки, пожежогасіння, медицина."]]}, {"id": "b1m2t4z6", "code": "Б1 М2 Т4 З6", "theme": "Тема 4. Організація та проведення занять", "title": "Техніка постановки та відповіді на питання. Уникнення конфліктів", "short": "Техніка питань", "passport": {"goal": "Ознайомити з технікою постановки інструктором питань курсантам, технікою відповіді на питання і реагування на недоцільні запитання; довести способи уникнення конфліктів та зриву занять.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Необхідність проведення опитування", "Техніка постановки запитань", "Техніка відповіді і реагування на недоцільні запитання", "Способи уникнення конфліктів і зриву занять"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.6; презентація; тест за темою"}, "sections": [{"h": "Навіщо опитування", "body": [["p", "Опитування — найпоширеніший спосіб перевірки знань. Воно виконує три функції:"], ["ul", ["<b>перевірка знань</b> — чи засвоїли курсанти матеріал;", "<b>навчання</b> — додатковими запитаннями інструктор підводить курсанта до правильної відповіді;", "<b>максимальна активність</b> — коли ставиться питання, кожен має бути готовий відповісти."]]]}, {"h": "Техніка APPLE", "body": [["p", "Послідовність дій інструктора — техніка <b>APPLE</b>:"], ["ul", ["<b>Ask — запитання</b>: озвучити питання для всієї аудиторії, щоб кожен почав думати;", "<b>Pause — пауза</b>: 3–5 секунд на обдумування;", "<b>Pick — призначення</b>: обрати, хто відповідає (бажаючий, випадково, пряме звернення до пасивного чи найактивнішого);", "<b>Listen — вислухати відповідь</b>: уважно, не перебиваючи; якщо відповідь не по темі — повторити запитання;", "<b>Evaluate — оцінити</b>: відзначити правильне, тактовно виправити помилку. Неправильна відповідь — дати виправитися самому, призначити іншого, попросити повторити правильну відповідь."]], ["key", "Спочатку питання всім, потім пауза, потім ім’я. Якщо назвати курсанта першим — решта перестане думати."]]}, {"h": "Як правильно ставити запитання", "body": [["p", "Запитання мають бути зрозумілими, короткими, однозначними, по темі, починатися з питального слова (хто, що, коли, як) і стимулювати мислення. Ставте їх у правильній послідовності."], ["ul", ["чергуйте способи вибору відповідаючого — це тримає в напрузі всіх;", "створюйте атмосферу, де курсанти не бояться помилитися;", "уточнюйте або просіть перефразувати нечітку відповідь;", "якщо курсант явно не знає — не затримуйтеся, переадресуйте питання іншому;", "допомагайте простішим навідним запитанням."]], ["warn", "Не ставте двозначних запитань і запитань про навички. Навичку не перевірити словами — лише практикою."]]}, {"h": "Як відповідати на запитання курсантів", "body": [["p", "Інструктор заохочує курсантів ставити запитання. Курсанти можуть питати після вступної частини, після кожного навчального питання, після основної і заключної частин або в будь-який момент — як визначив інструктор."], ["p", "Почувши питання, інструктор спочатку вирішує: <b>чи доречне воно?</b> і <b>чи знаю я відповідь?</b>"], ["ul", ["<b>Доречне питання</b> — можна переадресувати класу: так перевіряється розуміння і зростає активність.", "<b>Правильне, але не по темі</b> — похвалити за питання і пояснити, що його розглянуть окремо.", "<b>Підступне, щоб підірвати авторитет</b> — це порушення дисципліни; за ДМ на нього реагують негайно, як на порушення.", "<b>Не знаєте відповіді</b> — ніколи не блефуйте. Визнайте, що не знаєте, з’ясуйте і повідомте на наступному занятті."]], ["key", "Блеф курсанти розпізнають швидко — і авторитет втрачено. Чесне «з’ясую і відповім» його зберігає."]]}, {"h": "Конфлікти і зрив заняття", "body": [["p", "<b>Перебивання і порушення.</b> Зберігайте спокій — без крику й агресивних жестів. Спокійно і прямо вкажіть на неприпустимість дій і поясніть чому: «Прошу не перебивати, коли я пояснюю», «Ваша розмова заважає іншим». Запропонуйте висловитися пізніше — після пояснення чи на перерві. Швидко поверніться до матеріалу. Якщо повторюється — особиста розмова після заняття: з’ясувати причини, окреслити очікування, за потреби задокументувати."], ["p", "<b>Проблемні курсанти.</b> Якщо курсант вимагає уваги до своєї проблеми — покажіть, що розумієте, але навчальний час на це не витрачайте; поговоріть після заняття. Курсанти з негативним ставленням, які ставлять провокаційні питання, — порушники дисципліни. Того, хто нав’язує свою думку як єдину правильну, нагадайте: він не говорить від імені всіх."], ["p", "<b>Неадекватна поведінка.</b> Якщо один постійно перебиває іншого — дайте висловитися тому, кого перебивають, а першому пообіцяйте чергу. Якщо двоє сперечаються чи кричать — голосно назвіть їх на ім’я, покажіть, що розумієте обидві позиції, і поверніться до теми. Втручайтеся, лише якщо суперечка заважає заняттю."], ["p", "Якщо з якимось курсантом ніхто не хоче працювати — формуйте групи самі, міняйте склад по черзі і уникайте пар: краще трійки."], ["warn", "Курсанти не повинні бачити у вас злості чи розгубленості. Ваша спокійна реакція — приклад для всіх."]]}], "keys": ["Опитування: перевірка знань, навчання, активність.", "APPLE: запитання — пауза (3–5 с) — призначення — відповідь — оцінка.", "Не ставити двозначних запитань і питань про навички.", "Не знаєте відповіді — не блефувати, з’ясувати і повідомити.", "Конфлікт: спокій, чітка вимога, перенести розмову, швидко повернутися до теми."], "test": [["Інструктор каже: «Петренко, назвіть п’ять правил поводження зі зброєю». Яку помилку техніки APPLE він зробив?", ["Назвав курсанта першим — решта перестає думати", "Не зробив паузу після відповіді курсанта", "Поставив питання всім замість одного", "Помилки немає — так і має бути"], "Спочатку питання всім, потім пауза, потім ім’я. Якщо назвати курсанта першим, решта перестає думати."], ["Яка правильна послідовність техніки APPLE?", ["Запитання → пауза → призначення → вислухати → оцінити", "Призначення → запитання → оцінити → пауза → вислухати", "Пауза → запитання → вислухати → призначення → оцінити", "Запитання → призначення → пауза → оцінити → вислухати"], "APPLE: Ask, Pause, Pick, Listen, Evaluate."], ["Скільки секунд триває пауза після запитання?", ["3–5 секунд", "Менше секунди", "15–20 секунд", "Хвилину"], "Pause — 3–5 секунд на обдумування."], ["Курсант відповідає не по темі. Як діяти на кроці Listen?", ["Повторити запитання", "Перебити і висміяти", "Одразу поставити «незадовільно»", "Відповісти замість нього"], "Якщо відповідь не по темі — повторити запитання."], ["Курсант дав неправильну відповідь. Що з переліченого відповідає кроку Evaluate?", ["Дати виправитися або призначити іншого", "Публічно розкритикувати перед групою", "Пропустити помилку, щоб не збити темп", "Покарати, щоб інші готувалися краще"], "Неправильна відповідь — дати виправитися, призначити іншого, попросити повторити правильну."], ["Яке запитання поставлене неправильно?", ["«Ви вмієте накладати турнікет?»", "«Що означає команда “Стоп”?»", "«Коли застосовують турнікет?»", "«Хто відповідає за перевірку зброї?»"], "Не ставте запитань про навички: навичку не перевірити словами — лише практикою."], ["Курсант явно не знає відповіді і мовчить. Як діяти?", ["Переадресувати питання або допомогти навідним", "Чекати, доки він обов’язково відповість", "Поставити «незадовільно» і розкритикувати", "Пропустити це питання для всієї групи"], "Якщо курсант явно не знає — не затримуйтеся, переадресуйте або допоможіть простішим навідним запитанням."], ["Які три функції виконує опитування?", ["Перевірка знань, навчання, активність", "Покарання, заохочення, контроль", "Мотивація, виховання, розвага", "Оцінювання, рейтинг, звітність"], "Опитування: перевірка знань, навчання (навідні запитання) і максимальна активність."], ["Курсант поставив доречне запитання по темі. Що можна зробити, щоб підвищити активність групи?", ["Переадресувати запитання класу", "Відповісти дуже коротко", "Відкласти до наступного заняття", "Проігнорувати"], "Доречне питання можна переадресувати класу: перевіряється розуміння і зростає активність."], ["Курсант запитує щось правильне, але зовсім не по темі заняття. Як реагувати?", ["Похвалити і розглянути окремо", "Відповісти детально, відклавши тему", "Зробити зауваження за порушення", "Проігнорувати і продовжити"], "Правильне, але не по темі — похвалити і розглянути окремо."], ["Курсант ставить підступне запитання, щоб підірвати авторитет інструктора. Як реагувати за ДМ?", ["Негайно — як на порушення дисципліни", "Проігнорувати до кінця курсу", "Відповісти жартом", "Погодитися, щоб уникнути конфлікту"], "Підступне питання для підриву авторитету — порушення дисципліни; реагують негайно."], ["Інструктор не знає відповіді на запитання. Що робити?", ["Визнати, з’ясувати й відповісти пізніше", "Відповісти навмання впевненим тоном", "Сказати, що питання не стосується теми", "Перевести розмову на інше питання"], "Ніколи не блефуйте: блеф швидко розпізнають, а чесне «з’ясую і відповім» зберігає авторитет."], ["Курсант постійно перебиває пояснення. Яка реакція правильна?", ["Спокійно вказати на неприпустимість і дати слово пізніше", "Підвищити голос і пригрозити покаранням", "Вигнати з класу без жодних пояснень", "Не реагувати, щоб не провокувати конфлікт"], "Зберігайте спокій, прямо вкажіть на неприпустимість і поясніть, запропонуйте висловитися пізніше."], ["Двоє курсантів голосно сперечаються під час заняття. Як діяти?", ["Назвати обох на ім’я і повернутися до теми", "Дати їм договорити, щоб охололи", "Одразу покарати обох за порушення", "Вийти з класу, поки не заспокояться"], "Якщо двоє сперечаються — назвати на ім’я, показати розуміння позицій, повернутися до теми."], ["З одним курсантом ніхто не хоче працювати в парі. Яке рішення рекомендоване?", ["Формувати групи самому, краще трійки", "Залишити його працювати самостійно", "Дозволити групі вирішити самій", "Поставити його в пару з інструктором"], "Формуйте групи самі, міняйте склад по черзі і уникайте пар — краще трійки."]]}, {"id": "b1m2t4z7", "code": "Б1 М2 Т4 З7", "theme": "Тема 4. Організація та проведення занять", "title": "Застосування невербальних методів спілкування під час заняття", "short": "Невербальне спілкування", "passport": {"goal": "Ознайомити військовослужбовців з принципами застосування інструктором невербальних методів спілкування під час проведення занять.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Важливість невербальних методів спілкування", "Принципи їх застосування інструктором", "Жести і міміка: що застосовувати, чого уникати", "Правила контролю жестикуляції та міміки"], "assess": "Усне опитування індивідуально протягом і в кінці заняття.", "criteria": "Позитивно — якщо знає принципи застосування невербальних методів спілкування.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.7; презентація"}, "sections": [{"h": "Що таке невербальне спілкування", "body": [["p", "Спілкування буває вербальним (словесним, від латинського «вербум» — слово) і невербальним. Невербальне спілкування — система немовних знаків: міміка, жести, хода, поза, простір, одяг. Воно доповнює мову, показує емоційний стан і створює психологічний контакт."], ["p", "За дослідженнями, від 60 до 80% комунікації відбувається невербально. Австралійський фахівець Аллан Піз оцінює: словами передається 7% інформації, звуком (тон, інтонація) — 38%, мімікою, жестами, позою — 55%."], ["ul", ["<b>Міміка</b> — рухи м’язів обличчя, головний показник почуттів, включно з контактом очей.", "<b>Жести</b> — рухи рук і голови, що передають психічний стан.", "<b>Хода</b> — ритм і динаміка кроку, за якими можна судити про самопочуття і характер.", "<b>Поза</b> — положення тіла; показує, як людина сприймає свій статус серед інших."]]]}, {"h": "Чому це важливо інструктору", "body": [["ul", ["словами передаються факти, а почуття часто — лише невербально;", "володіння невербальною мовою показує, наскільки ви володієте собою;", "невербальні сигнали спонтанні й мало контрольовані, тому рідко брешуть: навіть коли слова зважені, почуття «просочуються» через жести й інтонацію."]], ["key", "Курсанти читають ваше тіло раніше, ніж чують слова. Якщо слова і жести розходяться — вірять жестам."]]}, {"h": "Принципи застосування", "body": [["ul", ["<b>Усвідомленість</b> — кожен жест продуманий і підтримує сказане.", "<b>Відповідність контексту</b> — під час складного пояснення жести підкреслюють ключове, на підсумках — відкриті й підбадьорливі.", "<b>Конгруентність</b> — невербальне узгоджене зі словами, інакше виникає недовіра.", "<b>Контакт і залучення</b> — зоровий контакт з різними курсантами, відкриті пози.", "<b>Емоційна підтримка</b> — посмішка, кивок, доброзичливий погляд.", "<b>Регулювання темпу</b> — повільні жести підкреслюють важливе, енергійні — перехід до нового етапу.", "<b>Акцентування</b> — жест і зміна інтонації виділяють ключові поняття.", "<b>Дисципліна й увага</b> — строгий погляд, зміна пози повертають увагу без слів.", "<b>Самоконтроль</b> — без нервових і відволікаючих рухів.", "<b>Спостереження за аудиторією</b> — міміка й пози курсантів показують розуміння, втому чи нудьгу."]]]}, {"h": "Що робити і чого уникати", "body": [["p", "<b>Застосовувати:</b> зоровий контакт з усіма; посмішку; кивки на знак розуміння; відкриті жести долонями вгору; пряму поставу; легкий нахил уперед, коли слухаєте; жести, що ілюструють розмір, форму, напрямок; помірні рухи класом; вираз обличчя, що відповідає змісту."], ["p", "<b>Уникати:</b> блукаючого погляду або його відсутності; нахмурених брів і стиснутих губ; схрещених рук і ніг — це закритість; постукування пальцями і метушні; погляду на годинник; різких і надто частих жестів; монотонного обличчя; рухів-паразитів — почісування, поправляння одягу; рук у кишенях, гри з ручкою; ігнорування сигналів курсантів."], ["warn", "Схрещені руки, руки в кишенях, гра з ручкою, хаотична ходьба — окремий пункт оціночного листа «Позиція відносно курсантів»."]]}, {"h": "Як контролювати жести і міміку", "body": [["ul", ["<b>Записуйте себе на відео</b> і аналізуйте жести, міміку, позу.", "<b>Репетируйте перед дзеркалом.</b>", "<b>Відчувайте тіло</b> — напружені плечі, стиснуті кулаки, метушливі ноги.", "<b>Просіть зворотний зв’язок</b> у колег: які жести відволікали?", "<b>Плануйте жести</b> заздалегідь — розведення рук, вказівний жест; без різких рухів.", "<b>Контролюйте міміку</b> — доброзичливий і зацікавлений вигляд.", "<b>Тримайте нейтральну позу</b> — пряма постава, руки вздовж тіла або складені перед собою.", "<b>Ключові моменти</b> — особливо стежте за собою на початку, на переходах і на підсумках."]], ["p", "Допомагають «якорі» — фізична дія, що нагадує про контроль, наприклад розслабити плечі; кілька глибоких вдихів при нервозності; уявити себе впевненим перед виступом. Контроль не означає придушення — йдеться про свідоме використання сигналів."]]}], "keys": ["Невербальне спілкування: міміка, жести, хода, поза.", "За Пізом: слова — 7%, звук — 38%, міміка й жести — 55% інформації.", "Головний принцип — конгруентність: жести узгоджені зі словами.", "Застосовувати: зоровий контакт, посмішку, відкриті жести, пряму поставу.", "Уникати: схрещених рук, рук у кишенях, погляду на годинник, рухів-паразитів."], "test": [["За оцінкою Аллана Піза, скільки відсотків інформації передається мімікою, жестами і позою?", ["55%", "7%", "38%", "80%"], "Словами — 7%, звуком (тон, інтонація) — 38%, мімікою, жестами, позою — 55%."], ["Яка частка інформації, за Пізом, передається власне словами?", ["7%", "38%", "55%", "60%"], "Лише 7% — словами; решта — тоном і невербальними сигналами."], ["Інструктор каже «Я радий, що ви тут», але стоїть зі схрещеними руками й нахмурений. Чому повірять курсанти?", ["Жестам — невербальне рідко бреше", "Словам — вони точніші за жести", "Нічому — сигнали взаємно гасяться", "Тону голосу — він вирішальний"], "Якщо слова і жести розходяться — вірять жестам. Порушено принцип конгруентності."], ["Який принцип порушує інструктор, коли його жести суперечать словам?", ["Конгруентність", "Акцентування", "Регулювання темпу", "Спостереження за аудиторією"], "Конгруентність — невербальне узгоджене зі словами, інакше виникає недовіра."], ["Курсанти почали розмовляти. Як інструктор може повернути увагу без слів?", ["Строгим поглядом і зміною пози", "Постукуванням ручкою по столу", "Демонстративним поглядом на годинник", "Відвернутися до дошки й чекати"], "Дисципліна й увага: строгий погляд, зміна пози повертають увагу без слів."], ["Які жести допомагають підкреслити важливе?", ["Повільні — для важливого", "Швидкі й різкі — для важливого", "Постійні, без жодних пауз", "Жодні — краще стояти нерухомо"], "Регулювання темпу: повільні жести підкреслюють важливе, енергійні — перехід до нового етапу."], ["Що з переліченого — рекомендований невербальний сигнал?", ["Відкриті жести долонями вгору", "Схрещені на грудях руки", "Погляд на годинник під час пояснення", "Руки в кишенях для невимушеності"], "Застосовувати: зоровий контакт, посмішку, кивки, відкриті жести долонями вгору, пряму поставу."], ["Інструктор під час пояснення грає з ручкою і ходить хаотично. Чим це загрожує на пробному занятті?", ["Знижує бал за пункт «Позиція відносно курсантів»", "Нічим — це особиста звичка інструктора", "Лише усним зауваженням без впливу на бал", "Заняття автоматично не зараховують"], "Схрещені руки, руки в кишенях, гра з ручкою, хаотична ходьба — окремий пункт оціночного листа."], ["Що свідчить схрещування рук і ніг?", ["Закритість", "Впевненість", "Зацікавленість", "Доброзичливість"], "Схрещені руки й ноги — ознака закритості."], ["Як інструктор може отримати інформацію про розуміння матеріалу без запитань?", ["Спостерігати за мімікою й позами", "Частіше дивитися в конспект", "Стояти до групи спиною", "Слухати лише відповіді вголос"], "Міміка й пози курсантів показують розуміння, втому чи нудьгу."], ["Що головне за матеріалом показує поза людини?", ["Як людина сприймає свій статус", "Рівень її фізичної підготовки", "Рівень освіти та ерудиції", "Її вік і досвід служби"], "Поза показує, як людина сприймає свій статус серед інших."], ["Який спосіб контролю жестів найоб’єктивніший?", ["Записати себе на відео і проаналізувати", "Покладатися на власні відчуття", "Запитати одного курсанта", "Тримати руки в кишенях"], "Записуйте себе на відео і аналізуйте жести, міміку, позу; репетируйте перед дзеркалом."], ["На яких моментах заняття особливо стежит
