инних. Визначити, що сталося, чому це сталося і як зробити краще."]]}, {"h": "Керівні документи", "body": [["p", "З 2017 року After Action Review згадується в наказах ЗСУ. У 2019 році АПД увійшов до доктрини з вивчення та впровадження досвіду у ЗСУ. Тоді ж процес описано в документі «Тимчасова інструкція з процесу аналізу проведених дій заходів підготовки» ВП 7(3)-00(01).01 — він лишається основним керівним документом щодо АПД у ЗСУ."], ["p", "У Програмі курсу АПД закріплено окремим розділом: керівник заняття вказує ступінь досягнення мети й навчальних цілей, позитивні й негативні сторони, оцінює роботу кожного і дає рекомендації, що вдосконалити — зокрема під час самостійної підготовки."], ["p", "У НАТО і США: доктрини ADP 7-0, ADRP 7-0, FM 7-0 включають AAR у стандарти тренувань; посібник TC 25-20 «A Leader’s Guide to After-Action Reviews» — короткий посібник для командирів; AJP-3 визначає AAR як частину оперативного циклу."]]}, {"h": "АПД у НАТО та країнах-партнерах", "body": [["p", "After Action Review — професійне обговорення події, яке дозволяє солдатам і командирам спільно з’ясувати, що сталося, чому, як зберегти сильні сторони та покращити слабкі. У партнерів будь-яке розгортання відбувається через навчання: «тренуйся так, як будеш битися» — це імператив."], ["ul", ["<b>Стандартизація</b> — процедури регламентовані доктринами та стандартами Альянсу (STANAG);", "<b>Культура відкритості та самокритики</b> — кожен, незалежно від звання, вільно висловлює думку; акцент на вдосконаленні, а не на пошуку винних;", "<b>Фокус на навчанні</b> — уроки фіксуються і змінюють тактику, процедури, підготовку;", "<b>Формалізовані методики</b> — чіткі етапи, питання для обговорення, формати звітності;", "<b>Інтеграція з плануванням</b> — висновки АПД враховуються в нових планах і сценаріях;", "<b>Симуляції, тренажери, технології</b> — запис відео й аудіо, цифрові карти, бойові журнали."]], ["p", "У США широко застосовують неформальний AAR одразу після події (hasty AAR), командир виступає фасилітатором. У Великій Британії — модель «Aim – Outcome – Lessons – Actions». У Бундесвері — «Розпізнати – Оцінити – Покращити»."]]}, {"h": "Чотири запитання і чотири етапи", "body": [["p", "В основі методики — лише чотири прості запитання, які командир розглядає з підлеглими, слухаючи передусім їхні думки:"], ["ul", ["<b>Що мало відбутися?</b>", "<b>Що відбулося насправді і чому?</b>", "<b>Що вдалося, а що ні?</b>", "<b>Що зробити наступного разу, щоб було краще?</b>"]], ["p", "<b>Етап 1. Огляд того, що мало бути виконано.</b> Задум командира, навчальні цілі, завдання. Джерела — наказ, план проведення, графік заняття."], ["p", "<b>Етап 2. Що реально виконано.</b> Керівник збирає якомога більше думок — від підрозділу позначення дій противника (OPFOR), командирів, сержантів і солдатів. Так виробляється спільне розуміння подій."], ["p", "<b>Етап 3. Що виконано правильно і неправильно.</b> На основі критеріїв оцінювання учасники самі визначають сильні та слабкі сторони своїх дій. Керівник лише скеровує дискусію."], ["p", "<b>Етап 4. Як діяти наступного разу.</b> Ті, хто навчаються, самі виявляють проблеми і пропонують рішення; визначається, хто відповідає за впровадження змін."], ["key", "Що планували → Що сталося → Що вдалося і що ні → Що змінимо. Висновки робить сам підрозділ, а не керівник за нього."]]}, {"h": "Формальний і неформальний АПД", "body": [["p", "<b>Офіційний (формальний) АПД</b> планується завчасно, ще під час затвердження планів бойової підготовки. Потребує рекогносцировки, обладнання місця, підготовки навчальної матеріально-технічної бази і координації персоналу. Керівник — командир підрозділу або оцінювач."], ["p", "<b>АПД у робочому порядку (неформальний)</b> проводить безпосередньо командир, інструктор чи оцінювач — у заключній частині заняття, а за потреби й під час нього. Майже не потребує підготовки і засобів, проводиться на місці заняття."], ["p", "Головна перевага неформального АПД — негайний зворотний зв’язок: помилки виправляються на місці, не зупиняючи навчання. Обидва типи потребують участі всього особового складу."]]}, {"h": "Правила і принципи", "body": [["ul", ["АПД проводиться під час або одразу після виконання кожного завдання — поки все свіже;", "акцент — на задум командира, цілі заняття і виконання стандартів;", "увага — порядку дій особового складу, управлінню підрозділом і тактичним діям;", "в обговоренні беруть участь усі — від солдата до командира;", "використовуються відкриті запитання, заохочуються ініціатива і креативність;", "визначаються і сильні, і слабкі сторони;", "висновки фіксуються, щоб уроки не загубилися."]], ["p", "<b>Роль модератора:</b> забезпечує нейтральну атмосферу, стежить за структурою, заохочує відкритість і взаємоповагу, підбиває підсумки й виділяє ключові уроки."], ["warn", "Під час АПД не можна: звинувачувати персонально, переривати чи пригнічувати учасників, замовчувати незручні проблеми, перетворювати АПД на формальність без висновків. Критикуємо дії, а не людей."]]}, {"h": "АПД на практиці: розбір сценарію", "body": [["p", "Практична робота заняття: відділення з командиром і сімома солдатами обороняє стратегічний пункт до підходу підкріплення. Курсант за перебігом подій заповнює чотири пункти АПД."], ["p", "<b>Що планували:</b> зайняти позицію, утримувати до прибуття підкріплення, не допустити прориву противника через контрольовану зону."], ["p", "<b>Що вдалося:</b> позиції зайняли вчасно, противника помітили завчасно, снайпер влучно відкрив вогонь, гранатометник із помічником діяли злагоджено, позицію утримали до підкріплення."], ["p", "<b>Що ні:</b> кулеметну стрічку спорядили неякісно — збої у вогні; після пострілу з гранатомета не проконтролювали зону ураження; спостерігач не доповів про рух на фланзі; командир запізно викликав підкріплення."], ["p", "<b>Що змінимо:</b> контроль спорядження, доповідь про кожну загрозу без вагань, контроль зони ураження після застосування важкого озброєння, чіткий порядок рішення про виклик підкріплення, додаткові засоби спостереження — БпЛА."], ["p", "Пройдіть цей сценарій самостійно у вкладці «Практика» — тренажер АПД."]]}], "keys": ["АПД / AAR — обговорення виконаного завдання, щоб вчитися, а не шукати винних.", "Основний документ у ЗСУ — Тимчасова інструкція з процесу АПД заходів підготовки ВП 7(3)-00(01).01 (2019).", "Чотири запитання: що мало відбутися, що відбулося і чому, що вдалося і що ні, що зробити наступного разу.", "Два типи: офіційний (формальний) і у робочому порядку (неформальний).", "АПД — одразу після завдання, за участі всіх, з відкритими запитаннями.", "Критикуємо дії, а не людей; висновки обов’язково фіксуємо."], "test": [["Що таке АПД / AAR?", ["Професійне обговорення виконаного завдання для визначення сильних і слабких сторін", "Документальний звіт про місію для командування", "Процедура покарання за помилки", "Підрахунок втрат після бою"], "АПД — обговорення, що сталося, чому і як зробити краще."], ["Яка основна мета АПД?", ["Вчитися: визначити сильні і слабкі сторони та як зробити краще", "Знайти винного", "Скласти документацію операції", "Оцінити кожного балами"], "АПД спрямований на навчання, а не на покарання."], ["Що є ключовим елементом успішного АПД?", ["Відкритість і конструктивність обговорення", "Сувора субординація під час обговорення", "Максимальна критика", "Ретельне документування без обговорення"], "Культура відкритості — кожен вільно висловлює думку незалежно від звання."], ["Який документ є основним щодо АПД у ЗСУ?", ["Тимчасова інструкція з процесу аналізу проведених дій заходів підготовки ВП 7(3)-00(01).01", "Статут внутрішньої служби", "Наказ ГШ № 41 від 2012 року", "FM 7-0 армії США"], "Інструкція 2019 року лишається основним керівним документом."], ["З якого року After Action Review згадується в наказах ЗСУ?", ["З 2017 року", "З 1991 року", "З 2022 року", "З 2014 року"], "З 2017-го — у наказах, у 2019-му — в доктрині та тимчасовій інструкції."], ["Яке перше запитання АПД?", ["Що мало відбутися?", "Хто винен?", "Скільки часу витратили?", "Яка оцінка?"], "Етап 1 — огляд того, що повинно було бути виконано."], ["Яка правильна послідовність запитань АПД?", ["Що мало відбутися → що відбулося і чому → що вдалося і що ні → що зробити наступного разу", "Хто винен → що зламалося → як покарати", "Що вдалося → хто відзначився → нагородження", "Що відбулося → що мало відбутися → оцінки"], "Чотири запитання — основа чотирьох етапів АПД."], ["Хто визначає сильні та слабкі сторони на третьому етапі?", ["Самі учасники, а керівник скеровує дискусію", "Лише керівник", "Вищий штаб", "Тільки оцінювач OPFOR"], "Учасники самостійно встановлюють сильні і слабкі сторони своїх дій."], ["Які два типи АПД існують?", ["Офіційний (формальний) і у робочому порядку (неформальний)", "Письмовий і усний", "Індивідуальний і груповий", "Денний і нічний"], "Обидва включають обмін думками і зосереджені на вдосконаленні навичок."], ["Чим відрізняється неформальний АПД від формального?", ["Потребує менше підготовки, проводиться на місці й дає негайний зворотний зв’язок", "Проводиться лише після навчань батальйонного рівня", "Потребує обладнаного класу і презентації", "У ньому не беруть участі солдати"], "Неформальний АПД дозволяє виправляти помилки на місці, не зупиняючи навчання."], ["Коли проводиться АПД?", ["Під час або одразу після виконання завдання", "Через тиждень після навчань", "Лише в кінці курсу", "Тільки після бойових дій"], "Своєчасність — поки події свіжі в пам’яті."], ["Які запитання використовують під час АПД?", ["Відкриті, що заохочують ініціативу і пошук кращих рішень", "Закриті — так чи ні", "Лише запитання від командира", "Запитання з варіантами відповідей"], "Відкриті запитання змушують учасників аналізувати."], ["Що НЕ можна робити під час АПД?", ["Звинувачувати персонально", "Визначати слабкі сторони", "Залучати всіх учасників", "Фіксувати висновки"], "Критикуємо дії, а не особистостей."], ["Яка роль модератора АПД?", ["Забезпечує нейтральну атмосферу, тримає структуру, підбиває підсумки", "Оголошує винних і покарання", "Сам формулює всі висновки замість учасників", "Мовчки записує все сказане"], "Модератор — фасилітатор, а не суддя."], ["Яку тезу партнерів по НАТО називають імперативом підготовки?", ["Тренуйся так, як будеш битися", "Швидше — значить краще", "Наказ не обговорюється", "Головне — звітність"], "Будь-яке розгортання партнерів відбувається через навчання."], ["Хто бере участь в обговоренні під час АПД?", ["Усі учасники — від солдата до командира", "Лише командири", "Лише сержанти", "Тільки ті, хто помилився"], "Участь кожного — один з основних принципів."], ["Що відбувається з висновками АПД?", ["Фіксуються і використовуються для змін у тактиці, процедурах і підготовці", "Залишаються лише в пам’яті учасників", "Передаються до прокуратури", "Видаляються після обговорення"], "Уроки не повинні «загубитися»: від уроків — до змін."], ["У сценарії практичної роботи після пострілу з гранатомета не перевірили зону ураження. До якого пункту АПД це належить?", ["Що пішло не так", "Що було заплановано", "Що вдалося", "Нічого з переліченого"], "Це слабка сторона, а в пункті «що змінимо» — контроль зони ураження після застосування важкого озброєння."]]}, {"id": "b1m2t4z3", "code": "Б1 М2 Т4 З3", "theme": "Тема 4. Організація та проведення занять", "title": "Складові частини заняття, розподіл часу, план-конспект", "short": "Складові заняття", "passport": {"goal": "Довести військовослужбовцям, з яких частин складається заняття, як розподіляти час між ними; навчити опрацьовувати план-конспект (план) проведення заняття.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Складові частини заняття та значення кожної", "Розподіл часу між частинами заняття", "Порядок і правила опрацювання план-конспекту"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; практичне завдання з опису цілі.", "criteria": "Позитивно — якщо знає частини заняття, розподіл часу і вміє опрацювати план-конспект.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.3 (зразки план-конспектів); презентація; тест за темою"}, "sections": [{"h": "Три частини заняття", "body": [["p", "Будь-яке навчальне заняття складається з трьох частин: <b>вступної, основної і заключної</b>. Кожна має обов’язкові пункти, і пропустити їх не можна — за кожним з них оцінюють курсанта на пробному занятті."], ["key", "Вступна → основна → заключна. Структура однакова для лекції, практичного й польового заняття."]]}, {"h": "Вступна частина", "body": [["ul", ["привітання і перевірка присутності особового складу (за журналом бойової підготовки або списком);", "перевірка матеріальних засобів і доведення правил поводження;", "<b>доведення заходів безпеки</b> — залежать від умов заняття: повітряна тривога, пожежна безпека; на заняттях зі зброєю — перевірка на розрядженість, доповідь про боєприпаси, 5 правил, команда «Стоп»;", "перевірка знань попереднього заняття — тема і опитування;", "доведення теми і мети заняття;", "<b>хід заняття</b> — місце, час, метод, навчальні питання, умови оцінювання (як і коли), критерії оцінювання;", "порядок проведення — як ставити запитання, як відповідати, порядок конспектування, розміщення;", "<b>мотивація</b> — чому ця тема важлива, з прикладом з реального досвіду."]]]}, {"h": "Основна і заключна частини", "body": [["p", "<b>Основна частина</b> складається з трьох елементів:"], ["ul", ["<b>викладання</b> — мінімальний обсяг матеріалу, потрібний, щоб перейти до практики;", "<b>практика</b> — якщо вона передбачена заняттям: топографія, зв’язок, зброя; на практичних заняттях — за EDIP: пояснення, демонстрація, імітація, тренування;", "<b>контроль</b> — перевірка засвоєних знань або навичок."]], ["p", "<b>Заключна частина</b> має два основні елементи:"], ["ul", ["<b>підведення підсумків</b> — нагадати тему, мету і навчальні питання, сказати, чи досягнута мета, оголосити оцінки (техніка «похвала — критика — похвала»);", "<b>кінцеві інструкції</b> — завдання на самостійну підготовку, тема, місце і час наступного заняття, потрібна матеріальна база, призначення прибиральників. На заняттях зі зброєю — обов’язкова перевірка зброї на розрядженість у всіх."]]]}, {"h": "Розподіл часу", "body": [["p", "Рекомендований розподіл часу заняття:"], ["ul", ["<b>вступна частина — 5–10%</b>;", "<b>основна частина — 80–85%</b>;", "<b>заключна частина — 10%</b>."]], ["p", "Для 45-хвилинного заняття це приблизно 3–5 хв на вступ, 38 хв на основну частину і 3–5 хв на завершення. У зразку план-конспекту теоретичного заняття: 3 + 39 + 3 хвилини; практичного на 90 хвилин: 6 + 80 + 4."], ["p", "Принципи розподілу часу:"], ["ul", ["час на кожну частину залежить від її внеску в досягнення мети — найважливішому більше часу;", "передбачайте зміну видів діяльності, щоб уникнути втоми;", "враховуйте рівень підготовки аудиторії — підготовленим менше вступу, більше самостійної роботи;", "закладайте резерв 5–10% на запитання, дискусії, технічні затримки;", "чергуйте інтенсивні й спокійніші види діяльності;", "за потреби візуалізуйте час — таймер, графік."]], ["warn", "Пунктуальність — критичний пункт оціночного листа: час заняття має вкластися в ±5 хвилин, інакше заняття не зараховане."]]}, {"h": "Як готувати план-конспект", "body": [["p", "План-конспект — опорний документ, що відтворює структуру і основний зміст заняття і допомагає провести його ефективно. Його складання — завершальний етап підготовки інструктора."], ["ul", ["<b>Розклад занять</b> — вихідні дані: вид заняття, з ким, час, місце, тема, тривалість, матеріальне забезпечення, керівні документи.", "<b>Програма підготовки</b> — що вже вивчено, що треба вивчити, попередні й наступні заняття, нормативи, форма і методи.", "<b>Мета і навчальні питання</b> — визначити навчальну й виховну мету, розподілити зміст і час між навчальними питаннями.", "<b>Керівні документи і література</b> — вивчити й уточнити зміст, нормативи, методи і забезпечення.", "<b>План-конспект</b> — оформити за зразком."]]]}, {"h": "Що містить план-конспект", "body": [["p", "Шапка: гриф «ЗАТВЕРДЖУЮ», тема, заняття, <b>мета</b>, <b>опис цілі</b> (вимоги, умови та обставини, критерії оцінювання), навчальні питання, час, місце, метод, керівництва і посібники, матеріальне забезпечення."], ["p", "Хід заняття: вступна частина з хвилинами і заходами безпеки; основна частина за навчальними питаннями — для практичного заняття з етапами EDIP: що робить інструктор, що роблять курсанти, розміщення, акценти, запитання; контроль; заключна частина."], ["p", "Наприкінці — підпис керівника заняття. У додатку «Кібер» план-конспект можна зібрати в конструкторі, а мету — потренувати в тренажері «Опис цілі»."], ["key", "План-конспект — опорний документ: чітка структура, хвилини на кожну частину, мета і опис цілі, заходи безпеки."]]}], "keys": ["Три частини заняття: вступна, основна, заключна.", "Основна частина: викладання, практика, контроль.", "Заключна: підведення підсумків і кінцеві інструкції.", "Час: вступ 5–10%, основна 80–85%, заключна 10%; резерв 5–10%.", "План-конспект — опорний документ; готується на основі розкладу і програми."], "test": [["З яких частин складається заняття?", ["Вступна, основна, заключна", "Теорія, перерва, практика", "Лекція, тест, оцінка", "Підготовка, стрільба, чищення зброї"], "Три частини — для будь-якого виду заняття."], ["Які елементи входять до основної частини?", ["Викладання, практика, контроль", "Привітання, мотивація, підсумки", "Перевірка о/с, заходи безпеки, тема", "Кінцеві інструкції і прибирання"], "Практика — якщо передбачена заняттям."], ["З яких двох основних частин складається заключна частина?", ["Підведення підсумків і кінцеві інструкції", "Мотивація і перевірка о/с", "Перевірка знань і нова тема", "Контроль і практика"], "Тест за темою має саме це питання."], ["Що входить до «ходу заняття» у вступній частині?", ["Місце, час, метод, навчальні питання, умови і критерії оцінювання", "Лише тема", "Розклад на тиждень", "Список курсантів"], "Курсант має знати, як буде проходити заняття і як його оцінять."], ["Яким пунктом завершується вступна частина?", ["Мотивацією — чому тема важлива", "Контролем", "Призначенням прибиральників", "Підведенням підсумків"], "Мотивація з прикладом з реального досвіду."], ["Який рекомендований розподіл часу?", ["Вступна 5–10%, основна 80–85%, заключна 10%", "Вступна 30%, основна 40%, заключна 30%", "Порівну по третині", "Вступна 50%, основна 50%"], "Основна частина — найбільша."], ["Скільки часу закладати в резерв?", ["5–10%", "50%", "Не закладати взагалі", "Цілу годину"], "На запитання, дискусії, технічні затримки."], ["Що подається на етапі викладання основної частини?", ["Мінімальний обсяг матеріалу, потрібний для переходу до практики", "Увесь матеріал теми без скорочень", "Лише відповіді на запитання", "Тільки тест"], "Решту часу — на практику."], ["Що є вихідними даними для підготовки до заняття?", ["Розклад занять", "Особисте бажання інструктора", "Погода", "Список прибиральників"], "З розкладу виписують вид, тему, час, місце, тривалість, забезпечення."], ["Що таке план-конспект?", ["Опорний документ, що відтворює структуру й основний зміст заняття", "Список присутніх курсантів", "Звіт про проведене заняття", "Журнал бойової підготовки"], "Засіб ефективного проведення заняття."], ["Що з переліченого обов’язково входить до шапки план-конспекту?", ["Мета, опис цілі, навчальні питання, час, місце, метод", "Біографія інструктора", "Розклад на місяць", "Оцінки за минуле заняття"], "Плюс керівництва і матеріальне забезпечення."], ["Що відбувається наприкінці практичного заняття зі зброєю?", ["Перевірка зброї на розрядженість у всього особового складу", "Нічого особливого", "Нове пояснення теми", "Стрільба без контролю"], "Заходи безпеки — і на початку, і в кінці."], ["Яка техніка рекомендована під час підведення підсумків?", ["Похвала — критика — похвала", "Лише критика", "Мовчання", "Публічне покарання"], "Так зберігається мотивація курсантів."], ["Чому пунктуальність важлива для оцінювання пробного заняття?", ["Це критичний пункт: вихід за ±5 хвилин — заняття не зараховане", "Не впливає на оцінку", "Впливає лише на польових заняттях", "Оцінюється тільки в іспиті"], "Пункт із зірочкою в оціночному листі."], ["Як розподіляти час між навчальними питаннями?", ["За внеском у досягнення мети — найважливішому більше часу", "Порівну, незалежно від змісту", "Найбільше — на вступ", "Як вийде"], "Головне — досягти мети заняття."]]}, {"id": "b1m2t4z4", "code": "Б1 М2 Т4 З4", "theme": "Тема 4. Організація та проведення занять", "title": "Обладнання місця проведення заняття. Розташування інструктора", "short": "Місце заняття", "passport": {"goal": "Ознайомити військовослужбовців з правилами обладнання місця проведення заняття (класу), довести принципи, за якими інструктор обирає місце свого розташування відносно курсантів.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Правила обладнання місця проведення заняття", "Принципи вибору місця розташування інструктора", "Варіанти розміщення курсантів і інструктора"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; зобразити варіанти розміщення.", "criteria": "Позитивно — якщо знає правила обладнання класу, принципи розташування інструктора і варіанти розміщення курсантів.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.4; презентація; тест за темою"}, "sections": [{"h": "Як підготувати клас", "body": [["ul", ["<b>Розмір і робочі місця</b> — місце для кожного курсанта, краще з кількома запасними; якщо плануєте групову роботу, простір не має заважати.", "<b>Освітлення</b> — світло від вікон чи ламп не повинне бити в очі курсантам або інструктору і давати відблиски на дошці чи екрані; у класі не повинно бути темно.", "<b>Живлення</b> — справні розетки в потрібному місці або подовжувачі для проектора й інших засобів.", "<b>Резерв</b> — дошка виручить у форс-мажорі, наприклад при вимкненні світла; усі засоби перевірені й готові.", "<b>Нічого зайвого</b> — зайві столи, стільці, непотрібна матеріальна база заважають."]]]}, {"h": "Норми для навчального приміщення", "body": [["p", "У презентації заняття наведено орієнтовні норми:"], ["ul", ["площа — 2,4 м² на курсанта: для 30 курсантів не менше 72 м²;", "від дошки до першої парти — не менше 3 м (кут зору до 35°), до останньої — не більше 10 м;", "температура повітря 18–22 °C, відносна вологість близько 60%, шум — до 45 дБ (рівень звичайної розмови);", "максимум природного світла, яке падає на робочі місця <b>зліва</b>; площа вікон — щонайменше чверть площі підлоги;", "з вересня до травня додають штучне освітлення білого або холодно-білого кольору."]], ["p", "Недостатнє освітлення погіршує здоров’я, знижує працездатність, підвищує втому і нервову напругу."]]}, {"h": "Де стояти інструктору", "body": [["ul", ["<b>Повна видимість</b> — бачите всіх курсантів або визначені групи.", "<b>Чітка комунікація</b> — команди й пояснення чути всім; за потреби — підсилювальні засоби.", "<b>Дисципліна присутністю</b> — позиція, яка запобігає порушенням.", "<b>Безпека</b> — на заняттях з ризиком займайте місце, звідки контролюєте дії і можете запобігти нещасному випадку.", "<b>Доступність</b> — можна швидко підійти до курсанта, якому потрібна допомога.", "<b>Якісна демонстрація</b> — під час показу ваші дії добре видно всім.", "<b>Динамічність і етап заняття</b> — фронтально під час пояснення, між курсантами під час практичної роботи.", "<b>Особливості місцевості</b> — розміри, освітлення, перешкоди на навчальній локації."]], ["key", "Інструктор бачить усіх, усі бачать і чують інструктора — і він може швидко підійти до кожного."]]}, {"h": "Варіанти розміщення курсантів", "body": [["p", "<b>Рядами (два-три ряди)</b> — традиційне розташування обличчям до інструктора. Переваги: добрий візуальний контакт, легкий контроль дисципліни, зручно для лекції і фронтального опитування, ефективне використання площі. Недоліки: мало взаємодії між курсантами, пасивність задніх рядів, складно працювати індивідуально. Для лекцій, теоретичних занять, інструктажів."], ["p", "<b>Літерою «П»</b> — відкрита частина до інструктора. Переваги: всі бачать одне одного, заохочує дискусію, інструктор має доступ до кожного, довірлива атмосфера. Недоліки: потребує більше простору, менш ефективне для великих груп. Для семінарів, тренінгів, обговорень, презентацій курсантів."], ["p", "<b>Групами по 3–6 осіб</b> — інструктор вільно ходить між групами. Переваги: співпраця, командна робота, інтерактивні методи, увага групам, яким потрібна допомога. Недоліки: складніше контролювати дисципліну, не всім комфортно в команді, потрібне ретельне планування завдань. Для практичних занять, кейсів, проєктів."], ["p", "Інші варіанти: <b>коло чи півколо</b> — для рівноправних дискусій; <b>каре</b> — обличчям одне до одного, для дебатів і засідань."], ["p", "Часто найкраще поєднувати різні варіанти протягом одного заняття — інструктор має вміти гнучко змінювати простір."]]}], "keys": ["Клас: місце кожному курсанту, світло не в очі і без відблисків, живлення, нічого зайвого.", "Природне світло — зліва; температура 18–22 °C.", "Інструктор: повна видимість, чутність, безпека, доступність, динамічність.", "Рядами — для лекцій; літерою «П» — для дискусій; групами — для практичної роботи."], "test": [["Що з переліченого — правило обладнання класу?", ["Світло не повинне бити в очі й давати відблиски на дошці", "Чим темніше, тим краще видно екран", "Зайві столи допомагають", "Розетки не потрібні"], "Освітлення впливає на навчання."], ["Навіщо в класі дошка, якщо є проектор?", ["Вона виручить у форс-мажорі, наприклад при вимкненні світла", "Вона не потрібна", "Лише для прикраси", "Тільки для оцінок"], "Резервний засоб візуальної підтримки."], ["З якого боку має падати природне світло на робочі місця?", ["Зліва", "Справа", "Ззаду", "Спереду в очі"], "Так тінь від руки не заважає писати."], ["Яка орієнтовна норма площі на одного курсанта?", ["2,4 м²", "0,5 м²", "10 м²", "1 м²"], "Для 30 курсантів — не менше 72 м²."], ["Яка рекомендована температура повітря в класі?", ["18–22 °C", "10–12 °C", "26–30 °C", "Не має значення"], "Фізичні фактори впливають на працездатність."], ["Який головний принцип вибору місця інструктора?", ["Бачити всіх курсантів і бути почутим усіма", "Стояти якомога далі від курсантів", "Сидіти за столом", "Стояти спиною до групи"], "Повна видимість і чітка комунікація."], ["Де перебувати інструктору під час практичної роботи?", ["Між курсантами, щоб допомагати й виправляти", "Тільки біля дошки", "За дверима", "Позаду аудиторії"], "Розташування змінюється з етапом заняття."], ["Для якого заняття найкраще розміщення рядами?", ["Лекція, інструктаж, теоретичне заняття", "Дискусія за круглим столом", "Робота в малих групах", "Дебати"], "Передача інформації великій групі."], ["Який недолік розміщення рядами?", ["Мало взаємодії між курсантами і пасивність задніх рядів", "Поганий контроль дисципліни", "Потребує багато місця", "Неможливо читати лекцію"], "Зате зручно для лекції."], ["Яка перевага розміщення літерою «П»?", ["Усі бачать одне одного, це заохочує дискусію", "Найбільше місць у малому класі", "Ідеально для 100 курсантів", "Курсанти не бачать інструктора"], "Добре для семінарів і обговорень."], ["Скільки курсантів зазвичай у групі при груповому розміщенні?", ["3–6", "15–20", "1", "30"], "Малі групи для співпраці."], ["Який недолік розміщення групами?", ["Складніше контролювати загальну дисципліну", "Немає взаємодії між курсантами", "Не можна ходити між групами", "Підходить лише для лекцій"], "Потребує ретельного планування завдань."], ["Що робити інструктору на заняттях з підвищеним ризиком?", ["Займати безпечне місце, звідки контролює дії курсантів", "Стояти серед курсантів на лінії вогню", "Відійти якнайдалі", "Не контролювати"], "Безпека — один з принципів розташування."], ["Яке розміщення найкраще для дебатів і засідань?", ["Каре — обличчям одне до одного", "Рядами", "Хаотичне", "Спиною до центру"], "Коло або каре — для обговорень."], ["Що найефективніше протягом заняття?", ["Поєднувати різні варіанти розміщення залежно від діяльності", "Ніколи не змінювати розміщення", "Завжди лише групами", "Завжди лише рядами"], "Простір змінюють під мету етапу."]]}, {"id": "b1m2t4z5", "code": "Б1 М2 Т4 З5", "theme": "Тема 4. Організація та проведення занять", "title": "Навчально-методичні матеріали, НМТБ, технічні та цифрові засоби", "short": "НМТБ і засоби навчання", "passport": {"goal": "Ознайомити військовослужбовців з правилами підготовки навчально-методичних матеріалів, вимогами до презентацій, правилами підготовки НМТБ і використання технічних, медійних та цифрових засобів навчання.", "time": "4 години (180 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Мета і типи візуальної підтримки", "Техніка використання візуальних засобів", "Вимоги до навчально-методичних матеріалів і презентацій", "Підготовка НМТБ до різних видів занять", "Технічні, медійні та цифрові засоби навчання"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.5; презентація; тести за темою"}, "sections": [{"h": "Навіщо візуальна підтримка", "body": [["p", "Візуальна підтримка допомагає донести інформацію швидше, точніше й надійніше, особливо коли часу мало або навантаження високе. Вона покращує сприйняття, зменшує помилки, прискорює прийняття рішень, підтримує пам’ять і уніфікує дії."], ["p", "Основні типи візуальної підтримки та їхні особливості:"], ["ul", ["<b>Плакати</b> — можна в класі й на вулиці, багаторазові; але великі, їх не змінити, можуть відволікати.", "<b>Аудіо і відео</b> — привертають увагу, показують навички; але потрібні живлення і техніка.", "<b>Схеми</b> — наочні, структуровані, економлять час; але обмежені в деталях і потребують пояснення.", "<b>Макети</b> — наочні, практичні, підвищують інтерес; але потребують місця і часу на підготовку.", "<b>Дошка</b> — швидко і зручно, взаємодія з аудиторією; але мало місця.", "<b>Презентація</b> — послідовний показ, легко змінити; але потрібні живлення й навички.", "<b>Демонстраційна група</b> — фактор реальності, живий показ вправи; але складна підготовка."]], ["p", "Принцип вибору засобу: <b>простий, цікавий, підходящий, необхідний, достатнього розміру</b>."]]}, {"h": "Техніка використання візуальних засобів: ВПОВС", "body": [["ul", ["<b>Випробувати</b> — перед заняттям перевірити, що засіб працює і все видно.", "<b>Показати</b> — продемонструвати в потрібний момент, щоб бачили всі.", "<b>Обговорити</b> — пояснити, що саме зображено і на що звернути увагу.", "<b>Використати</b> — застосувати засіб для досягнення мети заняття.", "<b>Сховати</b> — прибрати, щоб не відволікав від подальшого матеріалу."]], ["key", "Випробувати — показати — обговорити — використати — сховати. Цю техніку перевіряють в оціночному листі."]]}, {"h": "Навчально-методичні матеріали", "body": [["p", "<b>За призначенням:</b> основні — підручники, посібники, статути, настанови, курси лекцій; допоміжні — збірники завдань, методичні рекомендації, опорні конспекти, роздатковий матеріал, плакати; контрольно-оцінювальні — тести, контрольні питання, залікові завдання, критерії оцінювання."], ["p", "<b>За носієм:</b> друковані, електронні (презентації, відео, електронні посібники, тренажери, онлайн-курси) і матеріальні засоби (зразки озброєння, макети, тренажери, карти, засоби зв’язку та імітації)."], ["p", "<b>Вимоги до матеріалів:</b>"], ["ul", ["змістовність і науковість — відповідність програмам і документам, достовірність, актуальність, логічна структура;", "методична обґрунтованість — чітка мета, різні методи, практичні завдання, питання для самоконтролю і критерії оцінювання;", "зручність — чітка структура, грамотна мова, якісне оформлення;", "військова специфіка — офіційна термінологія, правила роботи з інформацією обмеженого доступу, наближеність до реальної служби, посилання на керівні документи, регулярне оновлення."]]]}, {"h": "Вимоги до презентацій", "body": [["ul", ["<b>Правило 6×6</b> — не більше 6 рядків на слайді і 6 слів у рядку;", "логічна послідовність і нумерація слайдів;", "інтервал між пунктами більший, ніж між рядками всередині пункту;", "вирівнювання тексту по лівому краю;", "заголовки — 32–44 пт, основний текст — 28–32 пт;", "базовий шрифт комунікації ЗСУ — <b>UAF Sans</b>;", "не писати весь текст великими літерами — це читається як крик;", "не більше 3 основних кольорів на слайді, контраст тексту і фону;", "жодних граматичних і орфографічних помилок;", "якісні зображення, помірна анімація, єдиний стиль;", "перевірити показ на тому обладнанні, де буде заняття."]], ["warn", "Перевантажений текстом слайд — найчастіша помилка. Краще розбити матеріал на кілька слайдів."]]}, {"h": "Підготовка НМТБ", "body": [["p", "<b>Загальні правила:</b> завчасність, планування за план-конспектом, особиста відповідальність інструктора, координація із завідувачами класів і складів, особиста перевірка перед заняттям, безпека, ефективність і аналіз після заняття."], ["p", "<b>До теоретичного заняття:</b> визначити потребу в проекторі, екрані, комп’ютері, звуку й подати запит; перевірити файли презентацій і відео; підготувати роздатковий матеріал; розмістити плакати й макети так, щоб їх бачили всі; розставити меблі, перевірити освітлення; особисто перевірити всю техніку; мати дошку, маркери, указку."], ["p", "<b>До практичного заняття:</b> визначити точну кількість зброї, техніки, приладів, витратних матеріалів і засобів захисту; отримати й доставити їх; обладнати навчальні місця, зробити розмітку і позначити зони безпеки; перевірити засоби пожежогасіння і медичної допомоги; рівномірно розподілити обладнання."], ["p", "<b>Після заняття:</b> зібрати і повернути НМТБ, перевірити комплектність і справність, повідомити про несправності, проаналізувати ефективність."]]}, {"h": "Технічні, медійні та цифрові засоби", "body": [["p", "Технічні засоби навчання — електронні, механічні та аудіовізуальні пристрої, що підвищують ефективність навчання. За сприйняттям вони бувають <b>візуальні, аудитивні й аудіовізуальні</b>; за призначенням — засоби передачі інформації, контролю знань, тренажери, засоби самонавчання і допоміжні."], ["p", "Принципи використання: цілеспрямованість — засіб служить меті, а не для ефекту; візуалізація складного; простота; поєднання з традиційними методами; планована, а не епізодична інтеграція."], ["p", "Медійні засоби: друковані, аудіо (записи, подкасти), відео (навчальні фільми, відеоінструкції), інтерактивні (симуляції, онлайн-курси, мобільні навчальні застосунки) і соціальні (закриті групи, спільна робота з файлами)."], ["p", "Цифрові засоби зі штучним інтелектом допомагають готувати матеріали, тести, озвучку й тренажери — як цей додаток. Але інструктор завжди перевіряє зміст на відповідність керівним документам."]]}], "keys": ["Принцип вибору засобу: простий, цікавий, підходящий, необхідний, достатнього розміру.", "Техніка: випробувати — показати — обговорити — використати — сховати.", "Правило 6×6; заголовки 32–44 пт, текст 28–32 пт; шрифт UAF Sans; не більше 3 кольорів.", "НМТБ: завчасно, за план-конспектом, особиста перевірка і безпека.", "ТЗН: візуальні, аудитивні, аудіовізуальні; засіб служить меті."], "test": [["Яке правило регламентує кількість тексту на слайді?", ["6×6", "100×100", "1×1", "10×10"], "Не більше 6 рядків і 6 слів у рядку."], ["Яка правильна техніка використання візуальних засобів?", ["Випробувати — показати — обговорити — використати — сховати", "Показати — сховати — забути", "Обговорити — показати — випробувати", "Використати — викинути"], "Цю техніку оцінюють на пробному занятті."], ["Навіщо «сховати» засіб після використання?", ["Щоб не відволікав від подальшого матеріалу", "Щоб ніхто не вкрав", "Щоб скоротити заняття", "Це не обов’язково"], "Візуальний засіб відволікає, якщо постійно на виду."], ["Який базовий шрифт комунікації ЗСУ рекомендовано для презентацій?", ["UAF Sans", "Comic Sans", "Times New Roman", "Gothic"], "Згідно з ДМ."], ["Який розмір шрифту основного тексту на слайді?", ["28–32 пт", "10–12 пт", "60–72 пт", "Будь-який"], "Заголовки — 32–44 пт."], ["Чому не варто писати весь текст великими літерами?", ["Він важче читається і сприймається як крик", "Це заборонено статутом", "Займає менше місця", "Так краще"], "Великі літери — лише для акцентів."], ["Скільки основних кольорів рекомендовано на одному слайді?", ["Не більше 3", "10", "1", "Чим більше, тим краще"], "Плюс достатній контраст тексту і фону."], ["Яка перевага демонстраційної групи?", ["Фактор реальності — живий показ виконання вправи", "Проста підготовка", "Не потребує людей", "Легко отримати"], "Але потребує ретельної підготовки."], ["Хто відповідає за справність і безпечність підготовленої НМТБ?", ["Особисто інструктор", "Курсанти", "Ніхто", "Лише завідувач складу"], "Принцип відповідальності."], ["Що інструктор робить перед практичним заняттям?", ["Визначає точну кількість зброї, засобів захисту й обладнання та позначає зони безпеки", "Нічого — все підготують інші", "Лише друкує тести", "Тільки складає розклад"], "Плюс перевіряє засоби пожежогасіння і медичної допомоги."], ["Що робиться з НМТБ після заняття?", ["Збирається, перевіряється комплектність і справність, аналізується ефективність", "Залишається на місці", "Роздається курсантам", "Нічого"], "Аналіз допомагає наступному заняттю."], ["Як класифікують ТЗН за способом сприйняття?", ["Візуальні, аудитивні, аудіовізуальні", "Великі й малі", "Дорогі й дешеві", "Старі й нові"], "За каналом сприйняття інформації."], ["Що означає принцип цілеспрямованості ТЗН?", ["Засіб використовується для досягнення конкретної мети заняття", "Засіб використовують, бо він є", "Що більше засобів, то краще", "ТЗН замінюють інструктора"], "ТЗН — інструмент, а не самоціль."], ["Що з переліченого — контрольно-оцінювальний матеріал?", ["Тестові завдання і критерії оцінювання", "Підручник", "Плакат", "Статут"], "Служать для перевірки засвоєння."], ["Яка остання перевірка перед заняттям з презентацією?", ["Перевірити показ на тому обладнанні, де буде заняття", "Роздрукувати всі слайди", "Додати більше анімації", "Нічого не перевіряти"], "Щоб усе відображалося коректно."], ["Який з принципів вибору візуального засобу правильний?", ["Простий, цікавий, підходящий, необхідний, достатнього розміру", "Найдорожчий", "Найновіший", "Найскладніший"], "П’ять ознак доброго засобу."]]}, {"id": "b1m2t4z6", "code": "Б1 М2 Т4 З6", "theme": "Тема 4. Організація та проведення занять", "title": "Техніка постановки та відповіді на питання. Уникнення конфліктів", "short": "Техніка питань", "passport": {"goal": "Ознайомити з технікою постановки інструктором питань курсантам, технікою відповіді на питання і реагування на недоцільні запитання; довести способи уникнення конфліктів та зриву занять.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Необхідність проведення опитування", "Техніка постановки запитань", "Техніка відповіді і реагування на недоцільні запитання", "Способи уникнення конфліктів і зриву занять"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.6; презентація; тест за темою"}, "sections": [{"h": "Навіщо опитування", "body": [["p", "Опитування — найпоширеніший спосіб перевірки знань. Воно виконує три функції:"], ["ul", ["<b>перевірка знань</b> — чи засвоїли курсанти матеріал;", "<b>навчання</b> — додатковими запитаннями інструктор підводить курсанта до правильної відповіді;", "<b>максимальна активність</b> — коли ставиться питання, кожен має бути готовий відповісти."]]]}, {"h": "Техніка APPLE", "body": [["p", "Послідовність дій інструктора — техніка <b>APPLE</b>:"], ["ul", ["<b>Ask — запитання</b>: озвучити питання для всієї аудиторії, щоб кожен почав думати;", "<b>Pause — пауза</b>: 3–5 секунд на обдумування;", "<b>Pick — призначення</b>: обрати, хто відповідає (бажаючий, випадково, пряме звернення до пасивного чи найактивнішого);", "<b>Listen — вислухати відповідь</b>: уважно, не перебиваючи; якщо відповідь не по темі — повторити запитання;", "<b>Evaluate — оцінити</b>: відзначити правильне, тактовно виправити помилку. Неправильна відповідь — дати виправитися самому, призначити іншого, попросити повторити правильну відповідь."]], ["key", "Спочатку питання всім, потім пауза, потім ім’я. Якщо назвати курсанта першим — решта перестане думати."]]}, {"h": "Як правильно ставити запитання", "body": [["p", "Запитання мають бути зрозумілими, короткими, однозначними, по темі, починатися з питального слова (хто, що, коли, як) і стимулювати мислення. Ставте їх у правильній послідовності."], ["ul", ["чергуйте способи вибору відповідаючого — це тримає в напрузі всіх;", "створюйте атмосферу, де курсанти не бояться помилитися;", "уточнюйте або просіть перефразувати нечітку відповідь;", "якщо курсант явно не знає — не затримуйтеся, переадресуйте питання іншому;", "допомагайте простішим навідним запитанням."]], ["warn", "Не ставте двозначних запитань і запитань про навички. Навичку не перевірити словами — лише практикою."]]}, {"h": "Як відповідати на запитання курсантів", "body": [["p", "Інструктор заохочує курсантів ставити запитання. Курсанти можуть питати після вступної частини, після кожного навчального питання, після основної і заключної частин або в будь-який момент — як визначив інструктор."], ["p", "Почувши питання, інструктор спочатку вирішує: <b>чи доречне воно?</b> і <b>чи знаю я відповідь?</b>"], ["ul", ["<b>Доречне питання</b> — можна переадресувати класу: так перевіряється розуміння і зростає активність.", "<b>Правильне, але не по темі</b> — похвалити за питання і пояснити, що його розглянуть окремо.", "<b>Підступне, щоб підірвати авторитет</b> — це порушення дисципліни; за ДМ на нього реагують негайно, як на порушення.", "<b>Не знаєте відповіді</b> — ніколи не блефуйте. Визнайте, що не знаєте, з’ясуйте і повідомте на наступному занятті."]], ["key", "Блеф курсанти розпізнають швидко — і авторитет втрачено. Чесне «з’ясую і відповім» його зберігає."]]}, {"h": "Конфлікти і зрив заняття", "body": [["p", "<b>Перебивання і порушення.</b> Зберігайте спокій — без крику й агресивних жестів. Спокійно і прямо вкажіть на неприпустимість дій і поясніть чому: «Прошу не перебивати, коли я пояснюю», «Ваша розмова заважає іншим». Запропонуйте висловитися пізніше — після пояснення чи на перерві. Швидко поверніться до матеріалу. Якщо повторюється — особиста розмова після заняття: з’ясувати причини, окреслити очікування, за потреби задокументувати."], ["p", "<b>Проблемні курсанти.</b> Якщо курсант вимагає уваги до своєї проблеми — покажіть, що розумієте, але навчальний час на це не витрачайте; поговоріть після заняття. Курсанти з негативним ставленням, які ставлять провокаційні питання, — порушники дисципліни. Того, хто нав’язує свою думку як єдину правильну, нагадайте: він не говорить від імені всіх."], ["p", "<b>Неадекватна поведінка.</b> Якщо один постійно перебиває іншого — дайте висловитися тому, кого перебивають, а першому пообіцяйте чергу. Якщо двоє сперечаються чи кричать — голосно назвіть їх на ім’я, покажіть, що розумієте обидві позиції, і поверніться до теми. Втручайтеся, лише якщо суперечка заважає заняттю."], ["p", "Якщо з якимось курсантом ніхто не хоче працювати — формуйте групи самі, міняйте склад по черзі і уникайте пар: краще трійки."], ["warn", "Курсанти не повинні бачити у вас злості чи розгубленості. Ваша спокійна реакція — приклад для всіх."]]}], "keys": ["Опитування: перевірка знань, навчання, активність.", "APPLE: запитання — пауза (3–5 с) — призначення — відповідь — оцінка.", "Не ставити двозначних запитань і питань про навички.", "Не знаєте відповіді — не блефувати, з’ясувати і повідомити.", "Конфлікт: спокій, чітка вимога, перенести розмову, швидко повернутися до теми."], "test": [["Яка правильна послідовність техніки постановки запитань?", ["Запитання — пауза — призначення — відповідь — оцінка", "Призначення — запитання — оцінка", "Пауза — запитання — покарання", "Відповідь — запитання — пауза"], "Техніка APPLE."], ["Для чого робиться пауза після запитання?", ["Щоб усі курсанти встигли обміркувати відповідь", "Щоб інструктор відпочив", "Щоб курсанти встигли записати", "Пауза не потрібна"], "Пауза 3–5 секунд."], ["Чому спочатку ставлять питання всім, а потім називають курсанта?", ["Щоб думала вся аудиторія, а не лише названий", "Так швидше", "Щоб збити курсанта з пантелику", "Це не має значення"], "Інакше решта перестане думати."], ["Яких запитань не можна ставити?", ["Двозначних і запитань про навички", "Коротких і зрозумілих", "Тих, що починаються з «хто» чи «що»", "Тих, що стимулюють мислення"], "Навичку перевіряє лише практика."], ["Що робити, якщо курсант явно не знає відповіді?", ["Не затримуватися — переадресувати питання іншому", "Чекати, поки відповість", "Покарати", "Пропустити питання"], "Можна допомогти навідним питанням."], ["Які три функції виконує опитування?", ["Перевірка знань, навчання, активність курсантів", "Покарання, контроль, звітність", "Відпочинок, розвага, гра", "Лише перевірка знань"], "Опитування — також метод навчання."], ["Що спершу вирішує інструктор, почувши питання курсанта?", ["Чи доречне питання і чи знає він відповідь", "Чи подобається йому курсант", "Скільки часу залишилось", "Хто поставив питання"], "Від цього залежить реакція."], ["Як реагувати на правильне питання, що не стосується теми?", ["Похвалити і пояснити, що розглянете окремо", "Ігнорувати", "Покарати", "Відповідати півгодини"], "Навчальний час — для теми заняття."], ["Що робити, якщо інструктор не знає відповіді?", ["Визнати, з’ясувати і повідомити на наступному занятті", "Блефувати", "Сказати, що питання дурне", "Змінити тему"], "Блеф руйнує авторитет."], ["Як реагувати, якщо курсант перебиває пояснення?", ["Спокійно вказати на неприпустимість і запропонувати висловитися пізніше", "Підвищити голос", "Вигнати з класу", "Не звертати уваги"], "І швидко повернутися до матеріалу."], ["Що робити, якщо порушення повторюються?", ["Провести особисту розмову після заняття і з’ясувати причини", "Публічно висміяти", "Покарати всю групу", "Нічого"], "За потреби — задокументувати."], ["Двоє курсантів кричать один на одного. Що робить інструктор?", ["Голосно називає їх на ім’я, показує, що розуміє позиції, і повертається до теми", "Виходить з класу", "Приєднується до суперечки", "Чекає, поки заспокояться"], "Втручатися, якщо суперечка заважає заняттю."], ["Курсант вимагає часу на заняття для своєї особистої проблеми. Як діяти?", ["Показати розуміння, але поговорити після заняття", "Витратити на неї все заняття", "Відмовити грубо", "Передати командиру одразу"], "Навчальний час не витрачається на особисті питання."], ["З курсантом ніхто не хоче працювати в парі. Що робити?", ["Формувати групи самостійно, міняти склад і уникати пар — краще трійки", "Залишити його одного", "Дозволити групам обирати самим", "Виключити з практики"], "Рекомендація з ДМ."], ["Що курсанти ніколи не повинні бачити в інструкторі під час конфлікту?", ["Злість і розгубленість", "Спокій", "Впевненість", "Послідовність"], "Спокійна реакція — приклад для всіх."], ["Якими мають бути запитання інструктора?", ["Зрозумілими, короткими, однозначними і по темі", "Довгими і складними", "З підступом", "Про особисте життя"], "І стимулювати мислення."]]}, {"id": "b1m2t4z7", "code": "Б1 М2 Т4 З7", "theme": "Тема 4. Організація та проведення занять", "title": "Застосування невербальних методів спілкування під час заняття", "short": "Невербальне спілкування", "passport": {"goal": "Ознайомити військовослужбовців з принципами застосування інструктором невербальних методів спілкування під час проведення занять.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Важливість невербальних методів спілкування", "Принципи їх застосування інструктором", "Жести і міміка: що застосовувати, чого уникати", "Правила контролю жестикуляції та міміки"], "assess": "Усне опитування індивідуально протягом і в кінці заняття.", "criteria": "Позитивно — якщо знає принципи застосування невербальних методів спілкування.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.7; презентація"}, "sections": [{"h": "Що таке невербальне спілкування", "body": [["p", "Спілкування буває вербальним (словесним, від латинського «вербум» — слово) і невербальним. Невербальне спілкування — система немовних знаків: міміка, жести, хода, поза, простір, одяг. Воно доповнює мову, показує емоційний стан і створює психологічний контакт."], ["p", "За дослідженнями, від 60 до 80% комунікації відбувається невербально. Австралійський фахівець Аллан Піз оцінює: словами передається 7% інформації, звуком (тон, інтонація) — 38%, мімікою, жестами, позою — 55%."], ["ul", ["<b>Міміка</b> — рухи м’язів обличчя, головний показник почуттів, включно з контактом очей.", "<b>Жести</b> — рухи рук і голови, що передають психічний стан.", "<b>Хода</b> — ритм і динаміка кроку, за якими можна судити про самопочуття і характер.", "<b>Поза</b> — положення тіла; показує, як людина сприймає свій статус серед інших."]]]}, {"h": "Чому це важливо інструктору", "body": [["ul", ["словами передаються факти, а почуття часто — лише невербально;", "володіння невербальною мовою показує, наскільки ви володієте собою;", "невербальні сигнали спонтанні й мало контрольовані, тому рідко брешуть: навіть коли слова зважені, почуття «просочуються» через жести й інтонацію."]], ["key", "Курсанти читають ваше тіло раніше, ніж чують слова. Якщо слова і жести розходяться — вірять жестам."]]}, {"h": "Принципи застосування", "body": [["ul", ["<b>Усвідомленість</b> — кожен жест продуманий і підтримує сказане.", "<b>Відповідність контексту</b> — під час складного пояснення жести підкреслюють ключове, на підсумках — відкриті й підбадьорливі.", "<b>Конгруентність</b> — невербальне узгоджене зі словами, інакше виникає недовіра.", "<b>Контакт і залучення</b> — зоровий контакт з різними курсантами, відкриті пози.", "<b>Емоційна підтримка</b> — посмішка, кивок, доброзичливий погляд.", "<b>Регулювання темпу</b> — повільні жести підкреслюють важливе, енергійні — перехід до нового етапу.", "<b>Акцентування</b> — жест і зміна інтонації виділяють ключові поняття.", "<b>Дисципліна й увага</b> — строгий погляд, зміна пози повертають увагу без слів.", "<b>Самоконтроль</b> — без нервових і відволікаючих рухів.", "<b>Спостереження за аудиторією</b> — міміка й пози курсантів показують розуміння, втому чи нудьгу."]]]}, {"h": "Що робити і чого уникати", "body": [["p", "<b>Застосовувати:</b> зоровий контакт з усіма; посмішку; кивки на знак розуміння; відкриті жести долонями вгору; пряму поставу; легкий нахил уперед, коли слухаєте; жести, що ілюструють розмір, форму, напрямок; помірні рухи класом; вираз обличчя, що відповідає змісту."], ["p", "<b>Уникати:</b> блукаючого погляду або його відсутності; нахмурених брів і стиснутих губ; схрещених рук і ніг — це закритість; постукування пальцями і метушні; погляду на годинник; різких і надто частих жестів; монотонного обличчя; рухів-паразитів — почісування, поправляння одягу; рук у кишенях, гри з ручкою; ігнорування сигналів курсантів."], ["warn", "Схрещені руки, руки в кишенях, гра з ручкою, хаотична ходьба — окремий пункт оціночного листа «Позиція відносно курсантів»."]]}, {"h": "Як контролювати жести і міміку", "body": [["ul", ["<b>Записуйте себе на відео</b> і аналізуйте жести, міміку, позу.", "<b>Репетируйте перед дзеркалом.</b>", "<b>Відчувайте тіло</b> — напружені плечі, стиснуті кулаки, метушливі ноги.", "<b>Просіть зворотний зв’язок</b> у колег: які жести відволікали?", "<b>Плануйте жести</b> заздалегідь — розведення рук, вказівний жест; без різких рухів.", "<b>Контролюйте міміку</b> — доброзичливий і зацікавлений вигляд.", "<b>Тримайте нейтральну позу</b> — пряма постава, руки вздовж тіла або складені перед собою.", "<b>Ключові моменти</b> — особливо стежте за собою на початку, на переходах і на підсумках."]], ["p", "Допомагають «якорі» — фізична дія, що нагадує про контроль, наприклад розслабити плечі; кілька глибоких вдихів при нервозності; уявити себе впевненим перед виступом. Контроль не означає придушення — йдеться про свідоме використання сигналів."]]}], "keys": ["Невербальне спілкування: міміка, жести, хода, поза.", "За Пізом: слова — 7%, звук — 38%, міміка й жести — 55% інформації.", "Головний принцип — конгруентність: жести узгоджені зі словами.", "Застосовувати: зоровий контакт, посмішку, відкриті жести, пряму поставу.", "Уникати: схрещених рук, рук у кишенях, погляду на годинник, рухів-паразитів."], "test": [["Що таке невербальне спілкування?", ["Система немовних знаків для обміну інформацією між людьми", "Письмове спілкування", "Спілкування по радіо", "Лише мова жестів глухонімих"], "Міміка, жести, хода, поза."], ["Що відносять до невербального спілкування?", ["Міміку, жести, ходу, позу", "Лише слова", "Лише інтонацію", "Тільки одяг"], "Чотири основні складові."], ["Яку частку інформації за А. Пізом передають міміка, жести і пози?", ["55%", "7%", "38%", "100%"], "Слова — 7%, звук — 38%."], ["Що таке конгруентність у спілкуванні?", ["Узгодженість невербальних сигналів зі словами", "Швидкість мовлення", "Гучність голосу", "Кількість жестів"], "Розбіжність викликає недовіру."], ["Чому невербальні сигнали рідко дають недостовірну інформацію?", ["Вони спонтанні й гірше піддаються контролю, ніж слова", "Вони завжди продумані", "Їх ніхто не помічає", "Вони заборонені статутом"], "Почуття «просочуються» через жести."], ["Що свідчить про закритість і захисну позицію?", ["Схрещені руки або ноги", "Відкриті долоні", "Пряма постава", "Зоровий контакт"], "Цього жесту варто уникати."], ["Як сприймається погляд на годинник під час заняття?", ["Як бажання швидше закінчити або неповага", "Як пунктуальність", "Як зацікавленість", "Ніяк"], "Негативний невербальний сигнал."], ["Що виражають розведені руки долонями вгору?", ["Відкритість, чесність і готовність до співпраці", "Агресію", "Нудьгу", "Невпевненість"], "Позитивний жест."], ["Як без слів повернути увагу курсантів?", ["Строгим поглядом або зміною пози", "Криком", "Виходом з класу", "Ніяк"], "Принцип управління дисципліною й увагою."], ["Що з переліченого — рух-паразит?", ["Почісування і поправляння одягу", "Ілюстративний жест", "Кивок", "Посмішка"], "Відволікає увагу і видає нервозність."], ["Який найпростіший спосіб проаналізувати свої жести?", ["Записати себе на відео і переглянути", "Спитати курсантів на іспиті", "Ніяк", "Читати підручник"], "Плюс репетиція перед дзеркалом."], ["Яка нейтральна поза рекомендована, коли жест не потрібен?", ["Пряма постава, руки вздовж тіла або складені перед собою", "Руки в кишенях", "Схрещені руки", "Спертися на стіл"], "Впевнена, але нейтральна поза."], ["Що робити при нервозності, яка проявляється метушнею?", ["Зробити кілька глибоких вдихів і видихів", "Говорити швидше", "Ходити класом", "Тримати ручку в руках"], "Це допомагає заспокоїтися."], ["Що дає інструктору спостереження за мімікою і позами курсантів?", ["Зворотний зв’язок про розуміння, втому чи нудьгу", "Нічого", "Привід для покарання", "Список відсутніх"], "За цим коригують підхід."], ["Чи означає контроль жестів їх повне придушення?", ["Ні, йдеться про свідоме використання сигналів", "Так, жестів має не бути", "Так, але лише на лекціях", "Так, на всіх заняттях"], "Жести мають допомагати комунікації."]]}, {"id": "b1m2t4z8", "code": "Б1 М2 Т4 З8", "theme": "Тема 4. Організація та проведення занять", "title": "Теорії і засади навчання", "short": "Теорії навчання", "passport": {"goal": "Ознайомити військовослужбовців із загальними теоріями навчання, освітніми контекстами їх застосування, перевагами і недоліками.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Дидактика як основа теорії навчання", "Біхевіоризм, когнітивізм, конструктивізм", "Інші теорії навчання", "Де застосовувати кожну теорію, переваги і недоліки"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.8; презентація; тест за темою"}, "sections": [{"h": "Дидактика", "body": [["p", "Педагогіка складається з теорії виховання і теорії освіти та навчання — <b>дидактики</b>. Дидактика досліджує цілі, закономірності, принципи, зміст, форми і методи навчання. Вона відповідає на запитання: <b>для чого?</b>, <b>кого?</b>, <b>як</b> навчати."], ["p", "Є дві основні дидактичні концепції. <b>Традиційна</b> (Ян Амос Коменський, Песталоцці, Гербарт) — стрижнева роль у викладання, діяльності вчителя. <b>Педоцентрична</b> — у учіння, діяльності учня; зв’язок навчання з життєвими потребами дає кращий результат, ніж запам’ятовування."], ["p", "Сучасна дидактика виходить з того, що викладання й учіння разом складають навчання."]]}, {"h": "Біхевіоризм", "body": [["p", "Біхевіоризм (від англ. behavior — поведінка) зосереджується на спостережуваній поведінці, яку формують зовнішні стимули і наслідки. Внутрішні розумові процеси він майже ігнорує."], ["ul", ["навчання — зміна спостережуваної поведінки;", "стимул — реакція: навчання через асоціацію;", "підкріплення збільшує ймовірність повторення поведінки, покарання — зменшує;", "класичне обумовлення (Павлов) і оперантне обумовлення (Скіннер)."]], ["p", "У навчанні: чіткі цілі й вимірювані результати, нагороди й покарання, складне розбивається на малі кроки, негайний зворотний зв’язок, дриль і практика."], ["p", "<b>Де працює:</b> базові навички і звички, прості рухові дії, стройові вправи, перша допомога, керування технікою до автоматизму, дисципліна і управління групою. <b>Недоліки:</b> ігнорує мислення, слабкий для творчості й розв’язання проблем, формує зовнішню мотивацію."]]}, {"h": "Когнітивізм", "body": [["p", "Когнітивізм вивчає внутрішні процеси: пам’ять, сприйняття, увагу, мислення, розв’язання проблем. Учень — активний обробник інформації, а розум схожий на комп’ютер, що кодує, зберігає і відтворює інформацію."], ["ul", ["короткочасна (робоча) і довготривала пам’ять відіграють ключову роль;", "теорія схем — попередні знання впливають на розуміння нового;", "метакогніція — «мислення про мислення», контроль власного навчання."]], ["p", "<b>Де працює:</b> розуміння складних понять, розв’язання проблем і прийняття рішень, структуровані матеріали — схеми, карти знань, мнемоніка, мультимедіа. <b>Недоліки:</b> мало уваги емоціям, мотивації і соціальному середовищу, механістичний погляд."]]}, {"h": "Конструктивізм", "body": [["p", "Кожен сам будує власне розуміння реальності, осмислюючи новий досвід через наявні знання. Навчання — не накопичення фактів, а побудова смислів."], ["ul", ["активне конструювання знань;", "навчання як соціальний процес;", "нове спирається на попередні знання;", "знання прив’язані до контексту;", "різні люди можуть по-різному зрозуміти одне й те саме."]], ["p", "<b>Де працює:</b> проєктна і дослідницька діяльність, розв’язання реальних складних проблем, співпраця, автентичні завдання, що імітують службу. <b>Недоліки:</b> складно стандартизовано оцінювати, процес менш структурований, вищі вимоги до інструктора як фасилітатора."], ["key", "Біхевіоризм — «роби за зразком», когнітивізм — «зрозумій і застосуй», конструктивізм — «знайди рішення сам»."]]}, {"h": "Інші теорії і висновок", "body": [["ul", ["<b>Гуманістична</b> (Роджерс, Маслоу) — особистість учня, самостійність, безпечне підтримуюче середовище; складно об’єктивно виміряти результат.", "<b>Андрагогіка</b> (Ноулз) — дорослі вчаться краще, коли бачать практичну цінність і можуть спиратися на досвід.", "<b>Соціальна теорія</b> — навчання через спостереження і наслідування, рольові ігри, групова робота.", "<b>Конективізм</b> (Сіменс, Даунс) — навчання через зв’язки в мережі знань: люди, бази даних, цифрові джерела.", "<b>Ситуативне навчання</b> (Лав, Венгер) — знання через участь у реальній діяльності разом з досвідченими.", "<b>Експериментальне навчання</b> (Колб) — цикл: досвід → рефлексія → висновок → експеримент."]], ["p", "Жодна теорія не є всеохопною. Сучасна педагогіка поєднує їх: стрій і безпечне поводження зі зброєю — біхевіоризм; пояснення будови й принципів — когнітивізм; тактичні задачі і АПД — конструктивізм."]]}], "keys": ["Дидактика — теорія навчання: для чого, кого, як навчати.", "Дві концепції: традиційна (викладання) і педоцентрична (учіння).", "Біхевіоризм — поведінка, стимул-реакція, підкріплення; для базових навичок і дисципліни.", "Когнітивізм — пам’ять, увага, мислення; для розуміння і розв’язання проблем.", "Конструктивізм — учень сам будує знання; для проєктів і реальних задач."], "test": [["На які дві основні концепції поділяється дидактика?", ["Традиційну і педоцентричну", "Стройову і вогневу", "Теоретичну і польову", "Усну і письмову"], "Стрижень — викладання або учіння."], ["Що відіграє стрижневу роль у традиційній дидактичній системі?", ["Діяльність учителя — викладання", "Діяльність учня — учіння", "Самостійна робота", "Іспит"], "У педоцентричній — учіння."], ["На чому зосереджується біхевіоризм?", ["На спостережуваній поведінці, яку формують стимули і наслідки", "На внутрішніх розумових процесах", "На емоціях учня", "На мережевих зв’язках"], "Від англ. behavior — поведінка."], ["Що таке підкріплення в біхевіоризмі?", ["Наслідок, що збільшує ймовірність повторення поведінки", "Покарання", "Перерва в занятті", "Новий матеріал"], "Позитивне додає бажане, негативне прибирає небажане."], ["Хто пов’язаний з класичним обумовленням?", ["Павлов", "Скіннер", "Колб", "Маслоу"], "Оперантне обумовлення — Скіннер."], ["Для чого найкраще підходить біхевіоризм?", ["Для формування базових навичок і звичок, стройових вправ, дисципліни", "Для творчих проєктів", "Для філософських дискусій", "Для самостійних досліджень"], "Дриль і повторення."], ["Що вивчає когнітивізм?", ["Пам’ять, сприйняття, увагу, мислення, розв’язання проблем", "Лише зовнішню поведінку", "Лише емоції", "Лише фізичну підготовку"], "Учень — активний обробник інформації."], ["Що таке метакогніція?", ["«Мислення про мислення» — контроль власного навчання", "Вид пам’яті", "Метод покарання", "Тип тесту"], "Принцип когнітивізму."], ["Яка головна ідея конструктивізму?", ["Кожен сам будує власне розуміння через досвід і наявні знання", "Знання передаються готовими", "Головне — дриль", "Навчання — лише запам’ятовування"], "Учень — будівельник знання."], ["Який недолік конструктивізму?", ["Складно стандартизовано оцінювати, вищі вимоги до інструктора", "Ігнорує мислення", "Формує лише зовнішню мотивацію", "Немає недоліків"], "Інструктор стає фасилітатором."], ["Який недолік біхевіоризму?", ["Ігнорує внутрішні процеси і слабкий для творчого мислення", "Не дає дисципліни", "Неможливо виміряти результат", "Занадто складний"], "Добрий для навичок, слабкий для мислення."], ["Що стверджує андрагогіка Ноулза?", ["Дорослі вчаться краще, коли бачать практичну цінність знань", "Дорослі не можуть навчатися", "Дорослих треба вчити як дітей", "Досвід заважає навчанню"], "Теорія дорослого навчання."], ["Хто описав цикл: досвід — рефлексія — висновок — експеримент?", ["Девід Колб", "Ян Коменський", "Іван Павлов", "Карл Роджерс"], "Експериментальне навчання."], ["Яку теорію найдоречніше застосувати для розв’язання тактичних задач у групі?", ["Конструктивізм", "Біхевіоризм", "Класичне обумовлення", "Жодну"], "Реальні задачі й співпраця."], ["Чому сучасна педагогіка поєднує різні теорії?", ["Жодна теорія не є всеохопною", "Так простіше", "Через вимоги моди", "Теорії однакові"], "Кожна має свою сферу ефективності."]]}, {"id": "b1m2t4z9", "code": "Б1 М2 Т4 З9", "theme": "Тема 4. Організація та проведення занять", "title": "Теорія обробки інформації", "short": "Обробка інформації", "passport": {"goal": "Ознайомити військовослужбовців з теорією обробки інформації: психологічними процесами, межами робочої пам’яті і прийомами, що полегшують засвоєння.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Психологічні процеси обробки інформації", "Межі робочої пам’яті", "Прийоми полегшення обробки інформації"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.9; презентація; тест за темою"}, "sections": [{"h": "Як мозок обробляє інформацію", "body": [["p", "Когнітивні процеси працюють як комп’ютер: вхід → обробка → вихід. Обробка інформації включає кілька взаємопов’язаних процесів:"], ["ul", ["<b>Відчуття</b> — первинне відображення окремих властивостей: колір, звук, запах, температура.", "<b>Сприйняття</b> — поєднання відчуттів у цілісний образ на основі досвіду й очікувань.", "<b>Увага</b> — вибір значущого і відсіювання зайвого; буває довільною (свідомою) і мимовільною (яскраве, нове, важливе).", "<b>Пам’ять</b> — кодування, зберігання і відтворення інформації.", "<b>Мислення</b> — аналіз, синтез, порівняння, узагальнення; встановлення зв’язків і висновки.", "<b>Уява</b> — створення нових образів і моделювання ситуацій.", "<b>Мова</b> — кодування думок у слова, внутрішнє мовлення, передача інформації.", "<b>Виконавчі функції</b> — «диригент»: планування, прийняття рішень, контроль, перемикання між завданнями."]]]}, {"h": "Три етапи пам’яті", "body": [["p", "Пам’ять — сукупність процесів <b>кодування</b> (введення інформації), <b>зберігання</b> і <b>відтворення</b> (пошуку і повернення в свідомість)."], ["p", "За моделлю Аткінсона — Шиффріна інформація проходить три сховища:"], ["ul", ["<b>сенсорна пам’ять</b> — дуже коротке зберігання погляду, звуку — до пари секунд;", "<b>короткочасна (робоча) пам’ять</b> — тимчасове сховище, близько 20–30 секунд без повторення;", "<b>довготривала пам’ять</b> — постійне сховище знань, навичок і досвіду, ємність якого практично не має меж."]], ["key", "Завдання інструктора — перевести інформацію з робочої пам’яті в довготривалу."]]}, {"h": "Межі робочої пам’яті", "body": [["p", "<b>Обмежена ємність</b> — «магічне число сім плюс-мінус два»: людина одночасно утримує близько 5–9 окремих елементів. Більше — і нове витісняє попереднє. Ємність можна збільшити групуванням (chunking): номер телефону легше запам’ятати частинами."], ["p", "<b>Обмежена тривалість</b> — без повторення інформація зникає з робочої пам’яті за 20–30 секунд."], ["p", "Якщо ігнорувати ці межі:"], ["ul", ["<b>інформаційне перевантаження</b> — забагато нового одразу, курсант плутається і нічого не засвоює;", "<b>зростання когнітивного навантаження</b> — складний матеріал, погана подача, відволікання забирають ресурси;", "<b>перешкоди для застосування</b> — курсант не може утримати всі елементи, щоб розв’язати задачу."]], ["warn", "Перевантажений слайд чи потік нових термінів без пауз — прямий шлях до того, що курсант не засвоїть нічого."]]}, {"h": "Прийоми, що полегшують засвоєння", "body": [["ul", ["<b>Структурування і сегментація</b> — ділити матеріал на невеликі логічні частини, давати план, заголовки, списки.", "<b>Наочність і кілька каналів</b> — слово плюс схема, зображення, відео; подвійне кодування розвантажує пам’ять.", "<b>Зв’язок з попередніми знаннями</b> — згадати відоме, провести паралелі й аналогії.", "<b>Практика і повторення</b> — задачі, вправи, переказ; особливо ефективне розподілене (інтервальне) повторення.", "<b>Чітка й лаконічна мова</b> — прості речення, без жаргону, чіткі інструкції.", "<b>Мінімум відволікань</b> — тиша, порядок, без багатозадачності."]], ["p", "Також допомагають <b>репетиція</b> — свідоме повторення, <b>візуальні опори</b> — картки, концепт-карти, виділений текст, і <b>мнемоніка</b> — абревіатури й фрази, наприклад EDIP чи APPLE."], ["key", "Невеликими порціями, наочно, з опорою на відоме і з повторенням — так інформація доходить до довготривалої пам’яті."]]}], "keys": ["Процеси: відчуття, сприйняття, увага, пам’ять, мислення, уява, мова, виконавчі функції.", "Пам’ять: кодування, зберігання, відтворення.", "Сенсорна — до 2 с, короткочасна — 20–30 с, довготривала — без меж.", "Ємність робочої пам’яті — 7±2 елементи; групування збільшує її.", "Прийоми: структура, наочність, зв’язок з відомим, повторення, чітка мова, мінімум відволікань."], "test": [["Які три процеси включає пам’ять?", ["Кодування, зберігання, відтворення", "Читання, письмо, лічба", "Слухання, мовлення, жести", "Вхід, перерва, вихід"], "Пошук — це повернення інформації в свідомість."], ["Як за тривалістю зберігання поділяється пам’ять?", ["Сенсорна, короткочасна, довготривала", "Зорова, слухова, рухова", "Особиста, службова, бойова", "Ранкова, денна, вечірня"], "Модель Аткінсона — Шиффріна."], ["Скільки зберігається інформація в короткочасній пам’яті без повторення?", ["Близько 20–30 секунд", "Кілька годин", "Тиждень", "Усе життя"], "Тому потрібне повторення."], ["Що означає «магічне число сім плюс-мінус два»?", ["Робоча пам’ять утримує 5–9 окремих елементів", "Заняття має тривати 7 хвилин", "Курсантів у групі має бути 7", "Тест має 7 питань"], "Обмежена ємність робочої пам’яті."], ["Що таке групування (chunking)?", ["Об’єднання окремих елементів у більші значущі блоки", "Поділ курсантів на групи", "Повторення тесту", "Перерва між заняттями"], "Наприклад, номер телефону частинами."], ["Яка ємність довготривалої пам’яті?", ["Практично не має меж", "7 елементів", "20 секунд", "Один день"], "На відміну від короткочасної."], ["Що буде, якщо подати занадто багато нової інформації одразу?", ["Інформаційне перевантаження — курсант нічого не засвоїть", "Курсант засвоїть більше", "Нічого не зміниться", "Покращиться увага"], "Перевищено ємність робочої пам’яті."], ["Яка увага привертається яскравими, новими подразниками?", ["Мимовільна", "Довільна", "Робоча", "Сенсорна"], "Довільна — свідомо спрямована."], ["Що таке подвійне кодування?", ["Подача інформації і словами, і візуально", "Шифрування повідомлень", "Два тести поспіль", "Повторення двічі"], "Розвантажує вербальну частину пам’яті."], ["Що з переліченого полегшує обробку інформації?", ["Структурування матеріалу на невеликі логічні частини", "Довгий монолог без пауз", "Багато нових термінів одразу", "Шум у класі"], "Сегментація зменшує навантаження."], ["Чому корисно пов’язувати нове з відомим?", ["Довготривала пам’ять підтримує роботу робочої пам’яті", "Щоб скоротити заняття", "Це заборонено", "Щоб курсанти не питали"], "Менше ізольованих елементів утримувати."], ["Яке повторення найефективніше для міцного запам’ятовування?", ["Розподілене — через певні проміжки часу", "Одне повторення в день іспиту", "Без повторення", "Безперервне 5 годин поспіль"], "Інтервальне повторення."], ["Що таке мнемоніка?", ["Прийоми запам’ятовування через абревіатури, фрази, шаблони", "Вид контролю", "Хвороба пам’яті", "Розклад занять"], "Наприклад, EDIP чи APPLE."], ["Яку роль відіграють виконавчі функції?", ["Координують інші процеси: планування, рішення, контроль", "Відповідають лише за зір", "Зберігають спогади", "Керують м’язами"], "Працюють як «диригент»."], ["Що перешкоджає запам’ятовуванню на занятті?", ["Перевантаження, відволікання, відсутність повторення", "Чітка структура", "Наочність", "Зв’язок з відомим"], "Це те, що треба мінімізувати."]]}, {"id": "b1m2t5z1", "code": "Б1 М2 Т5 З1", "theme": "Тема 5. Публічний виступ", "title": "Підготовка та проведення публічного виступу", "short": "Публічний виступ", "passport": {"goal": "Ознайомити з порядком підготовки та проведення теоретичного (лекційного) і практичного заняття, мистецтвом публічного виступу та способами подолання страху перед аудиторією.", "time": "2 години (90 хв)", "method": "Лекція; навчальний клас", "questions": ["Порядок підготовки та проведення теоретичного (лекційного) заняття", "Принципи підготовки практичного заняття", "Мистецтво публічного виступу", "Способи подолання страху публічного виступу"], "assess": "Усне опитування в кінці заняття.", "criteria": "Позитивно — якщо знає порядок підготовки і проведення заняття та способи подолання страху публічного виступу.", "sources": "ДМ до СТІ 132Г.42К(Н).05, пп. 5.1.1–5.1.4; презентація «Теоретичні (лекційні) заняття»"}, "sections": [{"h": "Підготовка теоретичного заняття", "body": [["p", "Підготовка до лекції — фундаментальний етап. Мета не просто передати інформацію, а домогтися, щоб курсанти її зрозуміли й засвоїли."], ["ul", ["<b>мета і навчальні цілі</b> — що курсанти мають зрозуміти, пояснити, проаналізувати; дієслова когнітивних дій: «пояснити сутність», «порівняти підходи», «сформулювати визначення»;", "<b>аналіз аудиторії</b> — рівень попередньої підготовки, базові знання, можливі труднощі з абстрактними поняттями;", "<b>добір і структурування матеріалу</b> — від загального до часткового, від простого до складного; головні ідеї окремо від другорядних деталей;", "<b>методи викладання</b> — проблемна чи візуальна лекція, бесіда, елементи дискусії, кейси, проблемні запитання;", "<b>дидактичні матеріали</b> — слайди з тезами і схемами, роздатковий матеріал, глосарій; вони доповнюють усний виклад, а не дублюють його;", "<b>контроль і закріплення</b> — коротке опитування, завдання на самопідготовку, підсумки;", "<b>самопідготовка інструктора</b> — досконало знати матеріал, відрепетирувати, перевірити таймінг;", "<b>аудиторія і техніка</b> — дошка, проєктор, справність обладнання; для дистанційного заняття — робота платформи."]], ["key", "Ціль → аудиторія → матеріал → методи → наочність → контроль → репетиція → перевірка класу."]]}, {"h": "Підготовка практичного заняття", "body": [["p", "Практичне заняття формує навички, тому підготовка багатокомпонентна й особливо уважна до безпеки."], ["ul", ["цілі формулюються <b>в термінах дій</b>: «виконати», «зібрати», «застосувати» — з кількісними і якісними критеріями (норматив за час без помилок);", "вивчити програму, настанови, статути і методичні розробки — рекомендований час, обладнання, типові помилки;", "методи — показ, тренування за зразком, виконання частинами і в цілому, імітація, робота в малих групах; від простого до складного;", "покрокові інструкції, картки-завдання, бланки звітності, зразки обладнання;", "<b>критерії оцінювання</b> розробити заздалегідь і довести курсантам ще до практики;", "місце і МТЗ — навчальні місця, справність і комплектність, засоби імітації, освітлення;", "план-конспект з розподілом часу: вступ, демонстрація, інструктаж, вправи, контроль, підсумки, резерв;", "<b>заходи безпеки</b> — аналіз ризиків, інструктаж кожного, засоби захисту, постійний контроль, дії в разі небезпеки;", "самопідготовка — інструктор сам досконало відпрацьовує прийоми, які показуватиме."]], ["warn", "Безпека — один із найпріоритетніших аспектів підготовки практичного заняття. Без інструктажу з безпеки до практики не переходять."]]}, {"h": "Що включає підготовка до виступу", "body": [["p", "Презентація курсу виділяє п’ять складових: <b>підготовка до виступу, організація, місце проведення, візуальна підтримка, практична підготовка</b>."], ["ul", ["проаналізуйте багато даних, виберіть істотні факти й ретельно організуйте їх;", "пояснення — прості, точні, фактичні;", "жарти й анекдоти — рідко: слухачі готові до серйозної розмови; гумор — лише щоб підкреслити чи роз’яснити;", "врахуйте звання і досвід аудиторії та оберіть найкращий підхід;", "організація: ясна логічна структура — <b>вступ, основна частина, висновки</b>;", "місце не повинно працювати проти вас — його організовують заздалегідь;", "візуальна підтримка посилює вплив виступу."]], ["key", "Проводьте репетицію перед кожним виступом! Нехай інша людина перевірить якість звучання, проєктування емоцій і деструктивну поведінку."]]}, {"h": "Проєктування і деструктивна поведінка", "body": [["p", "У великому приміщенні попросіть когось стати в кінці зали й перевірити, чи вас чути. Емоційний тон допомагає аудиторії розділити вашу точку зору: тема серйозна, а ви щиро зацікавлені в результаті."], ["ul", ["відкритий зоровий контакт;", "паузи;", "жести руками;", "інтонація і тон голосу;", "положення тіла;", "вираз обличчя."]], ["p", "Деструктивна поведінка привертає недоречну увагу й заважає спілкуванню: безупинна жестикуляція, не пов’язана з матеріалом; постійне перебування за трибуною або спроби на неї перехилитися; руки в кишенях чи перебирання їх вмісту; безцільне переміщення."], ["key", "Ораторська майстерність дає ефективну передачу знань, мотивацію курсантів, авторитет інструктора та керування навчальним процесом."]]}, {"h": "Як подолати страх виступу", "body": [["p", "Страх публічного виступу (глософобія) поширений, хвилюються навіть досвідчені інструктори. Способи подолання:"], ["ul", ["<b>ретельна підготовка</b> — знати матеріал, структурувати виступ, передбачити запитання, репетирувати вголос, перед дзеркалом або на відео;", "<b>переосмислення страху</b> — фокус на меті й користі для слухачів; хвилювання — джерело енергії;", "<b>візуалізація успіху</b> — уявляти вдалий виступ;", "<b>дихання і тіло</b> — повільні глибокі вдихи, розслаблення плечей і шиї, впевнена постава;", "<b>взаємодія з аудиторією</b> — знайти доброзичливі обличчя, ставити риторичні запитання;", "<b>поступовість</b> — починати з малої знайомої аудиторії; ретельно відпрацювати перші хвилини;", "<b>прийняти недосконалість</b> — дрібні помилки аудиторія пробачає;", "<b>підтримка</b> — колеги, а в складних випадках психолог чи фахівець з публічних виступів."]], ["key", "Подолання страху — процес: з кожним виступом упевненості більше."]]}], "keys": ["Підготовка лекції починається з мети і навчальних цілей.", "Цілі практичного заняття — в термінах дій з критеріями.", "Критерії оцінювання доводять курсантам до практики.", "Безпека — пріоритет підготовки практичного заняття.", "Структура виступу: вступ, основна частина, висновки.", "Репетиція перед кожним виступом.", "Страх долають підготовкою, диханням, взаємодією, практикою."], "test": [["З чого починається підготовка до теоретичного заняття?", ["З визначення мети і конкретних навчальних цілей", "З вибору шрифту для слайдів", "З перевірки проєктора", "З розподілу курсантів по групах"], "Спершу — що саме курсанти мають зрозуміти після заняття."], ["Які дієслова доречні в цілях теоретичного заняття?", ["Пояснити, проаналізувати, порівняти, сформулювати", "Зібрати, розібрати, відремонтувати", "Пробігти, віджатися", "Почути, побачити"], "Вони відображають когнітивні дії."], ["Які дієслова доречні в цілях практичного заняття?", ["Виконати, зібрати, застосувати", "Знати, розуміти", "Ознайомитися", "Запам’ятати"], "Конкретні, вимірювані дії."], ["Як мають співвідноситися слайди й усний виклад?", ["Слайди доповнюють виклад, а не дублюють його", "Слайди повністю повторюють текст інструктора", "Слайди не потрібні", "Інструктор зачитує слайди"], "Ключові тези, схеми, візуалізація."], ["Коли доводять критерії оцінювання практичних навичок?", ["Ще до початку практичної діяльності", "Після оцінювання", "Ніколи", "Лише на іспиті"], "Курсанти мають знати, на що звертати увагу."], ["Що є одним із найпріоритетніших аспектів підготовки практичного заняття?", ["Планування і здійснення заходів безпеки", "Колір плакатів", "Кількість жартів", "Тривалість перерви"], "Аналіз ризиків, інструктаж, контроль."], ["Яка структура виступу рекомендована?", ["Вступ — основна частина — висновки", "Висновки — вступ", "Лише основна частина", "Анекдот — висновки"], "Ясна, логічна структура допомагає зрозуміти матеріал."], ["Як ставитися до жартів під час брифінгу?", ["Рідко; гумор — лише щоб підкреслити або роз’яснити", "Починати кожен пункт з анекдоту", "Жарти обов’язкові", "Жарти замінюють пояснення"], "Слухачі готові до серйозної розмови."], ["Що перевіряє інша людина під час репетиції виступу?", ["Якість звучання, проєктування емоцій, деструктивну поведінку", "Лише орфографію слайдів", "Освітлення в коридорі", "Розклад занять"], "Так за презентацією курсу."], ["Як перевірити якість звучання у великому приміщенні?", ["Попросити когось стати в кінці зали", "Говорити тихіше", "Вим
