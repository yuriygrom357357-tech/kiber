чаток, переходи і підсумки."], ["Що означає «якір» у контролі невербаліки?", ["Фізична дія, що нагадує про контроль, наприклад розслабити плечі", "Нерухома поза", "Предмет у руках", "Конспект на столі"], "«Якір» — фізична дія-нагадування; також глибокі вдихи і уявлення себе впевненим."], ["Чи означає контроль невербаліки її придушення?", ["Ні — йдеться про свідоме використання сигналів", "Так — жести треба прибрати повністю", "Так — на лекціях", "Лише на контрольному занятті"], "Контроль не означає придушення — це свідоме використання сигналів."], ["Інструктор помітив, що курсанти позіхають і відводять погляд. Який принцип він застосовує, звертаючи на це увагу?", ["Спостереження за аудиторією", "Самоконтроль", "Акцентування", "Конгруентність"], "Міміка й пози курсантів показують розуміння, втому чи нудьгу — це спостереження за аудиторією."]]}, {"id": "b1m2t4z8", "code": "Б1 М2 Т4 З8", "theme": "Тема 4. Організація та проведення занять", "title": "Теорії і засади навчання", "short": "Теорії навчання", "passport": {"goal": "Ознайомити військовослужбовців із загальними теоріями навчання, освітніми контекстами їх застосування, перевагами і недоліками.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Дидактика як основа теорії навчання", "Біхевіоризм, когнітивізм, конструктивізм", "Інші теорії навчання", "Де застосовувати кожну теорію, переваги і недоліки"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.8; презентація; тест за темою"}, "sections": [{"h": "Дидактика", "body": [["p", "Педагогіка складається з теорії виховання і теорії освіти та навчання — <b>дидактики</b>. Дидактика досліджує цілі, закономірності, принципи, зміст, форми і методи навчання. Вона відповідає на запитання: <b>для чого?</b>, <b>кого?</b>, <b>як</b> навчати."], ["p", "Є дві основні дидактичні концепції. <b>Традиційна</b> (Ян Амос Коменський, Песталоцці, Гербарт) — стрижнева роль у викладання, діяльності вчителя. <b>Педоцентрична</b> — у учіння, діяльності учня; зв’язок навчання з життєвими потребами дає кращий результат, ніж запам’ятовування."], ["p", "Сучасна дидактика виходить з того, що викладання й учіння разом складають навчання."]]}, {"h": "Біхевіоризм", "body": [["p", "Біхевіоризм (від англ. behavior — поведінка) зосереджується на спостережуваній поведінці, яку формують зовнішні стимули і наслідки. Внутрішні розумові процеси він майже ігнорує."], ["ul", ["навчання — зміна спостережуваної поведінки;", "стимул — реакція: навчання через асоціацію;", "підкріплення збільшує ймовірність повторення поведінки, покарання — зменшує;", "класичне обумовлення (Павлов) і оперантне обумовлення (Скіннер)."]], ["p", "У навчанні: чіткі цілі й вимірювані результати, нагороди й покарання, складне розбивається на малі кроки, негайний зворотний зв’язок, дриль і практика."], ["p", "<b>Де працює:</b> базові навички і звички, прості рухові дії, стройові вправи, перша допомога, керування технікою до автоматизму, дисципліна і управління групою. <b>Недоліки:</b> ігнорує мислення, слабкий для творчості й розв’язання проблем, формує зовнішню мотивацію."]]}, {"h": "Когнітивізм", "body": [["p", "Когнітивізм вивчає внутрішні процеси: пам’ять, сприйняття, увагу, мислення, розв’язання проблем. Учень — активний обробник інформації, а розум схожий на комп’ютер, що кодує, зберігає і відтворює інформацію."], ["ul", ["короткочасна (робоча) і довготривала пам’ять відіграють ключову роль;", "теорія схем — попередні знання впливають на розуміння нового;", "метакогніція — «мислення про мислення», контроль власного навчання."]], ["p", "<b>Де працює:</b> розуміння складних понять, розв’язання проблем і прийняття рішень, структуровані матеріали — схеми, карти знань, мнемоніка, мультимедіа. <b>Недоліки:</b> мало уваги емоціям, мотивації і соціальному середовищу, механістичний погляд."]]}, {"h": "Конструктивізм", "body": [["p", "Кожен сам будує власне розуміння реальності, осмислюючи новий досвід через наявні знання. Навчання — не накопичення фактів, а побудова смислів."], ["ul", ["активне конструювання знань;", "навчання як соціальний процес;", "нове спирається на попередні знання;", "знання прив’язані до контексту;", "різні люди можуть по-різному зрозуміти одне й те саме."]], ["p", "<b>Де працює:</b> проєктна і дослідницька діяльність, розв’язання реальних складних проблем, співпраця, автентичні завдання, що імітують службу. <b>Недоліки:</b> складно стандартизовано оцінювати, процес менш структурований, вищі вимоги до інструктора як фасилітатора."], ["key", "Біхевіоризм — «роби за зразком», когнітивізм — «зрозумій і застосуй», конструктивізм — «знайди рішення сам»."]]}, {"h": "Інші теорії і висновок", "body": [["ul", ["<b>Гуманістична</b> (Роджерс, Маслоу) — особистість учня, самостійність, безпечне підтримуюче середовище; складно об’єктивно виміряти результат.", "<b>Андрагогіка</b> (Ноулз) — дорослі вчаться краще, коли бачать практичну цінність і можуть спиратися на досвід.", "<b>Соціальна теорія</b> — навчання через спостереження і наслідування, рольові ігри, групова робота.", "<b>Конективізм</b> (Сіменс, Даунс) — навчання через зв’язки в мережі знань: люди, бази даних, цифрові джерела.", "<b>Ситуативне навчання</b> (Лав, Венгер) — знання через участь у реальній діяльності разом з досвідченими.", "<b>Експериментальне навчання</b> (Колб) — цикл: досвід → рефлексія → висновок → експеримент."]], ["p", "Жодна теорія не є всеохопною. Сучасна педагогіка поєднує їх: стрій і безпечне поводження зі зброєю — біхевіоризм; пояснення будови й принципів — когнітивізм; тактичні задачі і АПД — конструктивізм."]]}], "keys": ["Дидактика — теорія навчання: для чого, кого, як навчати.", "Дві концепції: традиційна (викладання) і педоцентрична (учіння).", "Біхевіоризм — поведінка, стимул-реакція, підкріплення; для базових навичок і дисципліни.", "Когнітивізм — пам’ять, увага, мислення; для розуміння і розв’язання проблем.", "Конструктивізм — учень сам будує знання; для проєктів і реальних задач."], "test": [["На які три запитання відповідає дидактика?", ["Для чого, кого і як навчати", "Хто, коли і де", "Що, скільки і чим", "Чому, навіщо і коли"], "Дидактика досліджує цілі, принципи, зміст, форми і методи — для чого, кого, як навчати."], ["Чим педоцентрична концепція відрізняється від традиційної?", ["Стрижнева роль — учіння, діяльність учня", "Стрижнева роль — викладання вчителя", "Вона заперечує зв’язок з життям", "Вона з’явилася раніше за традиційну"], "Традиційна (Коменський, Песталоцці, Гербарт) — викладання; педоцентрична — учіння, зв’язок з життєвими потребами."], ["Інструктор відпрацьовує стройові прийоми: команда — дія — негайна оцінка — повтор. На якій теорії ґрунтується цей підхід?", ["Біхевіоризм", "Конструктивізм", "Когнітивізм", "Конективізм"], "Біхевіоризм: стимул — реакція, підкріплення, малі кроки, негайний зворотний зв’язок, дриль."], ["Хто пов’язаний з оперантним обумовленням?", ["Скіннер", "Павлов", "Колб", "Ноулз"], "Класичне обумовлення — Павлов, оперантне — Скіннер."], ["Який головний недолік біхевіоризму для навчання тактиці?", ["Ігнорує мислення і слабкий для творчості й розв’язання проблем", "Він надто повільний", "Він не дає вимірюваних результатів", "Він не працює для фізичних дій"], "Недоліки біхевіоризму: ігнорує мислення, слабкий для творчості, формує зовнішню мотивацію."], ["Яку метафору розуму використовує когнітивізм?", ["Комп’ютер, що кодує, зберігає і відтворює інформацію", "Чистий аркуш", "Мережа зв’язків", "Майстерня"], "Когнітивізм: учень — активний обробник інформації, розум схожий на комп’ютер."], ["Курсант аналізує, як він сам вчиться, і коригує свій спосіб підготовки. Який це когнітивний феномен?", ["Метакогніція — «мислення про мислення»", "Теорія схем", "Оперантне обумовлення", "Ситуативне навчання"], "Метакогніція — контроль власного навчання."], ["За теорією схем що впливає на розуміння нового?", ["Попередні знання", "Кількість повторень", "Нагорода", "Колектив"], "Теорія схем: попередні знання впливають на розуміння нового."], ["Навчання — не накопичення фактів, а побудова смислів. Яка це теорія?", ["Конструктивізм", "Біхевіоризм", "Когнітивізм", "Гуманістична"], "Конструктивізм: кожен будує власне розуміння, осмислюючи досвід через наявні знання."], ["Які недоліки конструктивізму?", ["Складно стандартизовано оцінювати, процес менш структурований, вищі вимоги до інструктора", "Ігнорує мислення", "Формує лише зовнішню мотивацію", "Не враховує попередні знання"], "Конструктивізм: складне стандартизоване оцінювання, менша структурованість, інструктор-фасилітатор."], ["Цикл «досвід → рефлексія → висновок → експеримент» описує теорію…", ["Експериментального навчання Колба", "Конективізму", "Ситуативного навчання", "Андрагогіки"], "Експериментальне навчання (Колб): досвід, рефлексія, висновок, експеримент."], ["Молодий інструктор вчиться, беручи участь у реальних заняттях разом з досвідченими. Яка теорія?", ["Ситуативне навчання (Лав, Венгер)", "Конективізм", "Біхевіоризм", "Гуманістична"], "Ситуативне навчання: знання через участь у реальній діяльності разом з досвідченими."], ["Навчання через зв’язки в мережі знань — людей, баз даних, цифрових джерел — це…", ["Конективізм (Сіменс, Даунс)", "Когнітивізм", "Соціальна теорія", "Андрагогіка"], "Конективізм — навчання через зв’язки в мережі знань."], ["Яку теорію логічно застосувати для пояснення будови й принципів дії зброї?", ["Когнітивізм", "Біхевіоризм", "Гуманістичну", "Конективізм"], "Стрій і безпечне поводження — біхевіоризм; будова й принципи — когнітивізм; тактика й АПД — конструктивізм."], ["Тактичні задачі й АПД найкраще спираються на…", ["Конструктивізм", "Біхевіоризм", "Класичне обумовлення", "Теорію схем"], "Тактичні задачі і АПД — конструктивізм: «знайди рішення сам»."], ["Яке твердження про теорії навчання правильне?", ["Жодна не всеохопна — сучасна педагогіка їх поєднує", "Найкраща — біхевіоризм", "Для війська підходить лише конструктивізм", "Теорії взаємовиключні"], "Жодна теорія не є всеохопною, їх поєднують залежно від завдання."]]}, {"id": "b1m2t4z9", "code": "Б1 М2 Т4 З9", "theme": "Тема 4. Організація та проведення занять", "title": "Теорія обробки інформації", "short": "Обробка інформації", "passport": {"goal": "Ознайомити військовослужбовців з теорією обробки інформації: психологічними процесами, межами робочої пам’яті і прийомами, що полегшують засвоєння.", "time": "2 години", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Психологічні процеси обробки інформації", "Межі робочої пам’яті", "Прийоми полегшення обробки інформації"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 4.9; презентація; тест за темою"}, "sections": [{"h": "Як мозок обробляє інформацію", "body": [["p", "Когнітивні процеси працюють як комп’ютер: вхід → обробка → вихід. Обробка інформації включає кілька взаємопов’язаних процесів:"], ["ul", ["<b>Відчуття</b> — первинне відображення окремих властивостей: колір, звук, запах, температура.", "<b>Сприйняття</b> — поєднання відчуттів у цілісний образ на основі досвіду й очікувань.", "<b>Увага</b> — вибір значущого і відсіювання зайвого; буває довільною (свідомою) і мимовільною (яскраве, нове, важливе).", "<b>Пам’ять</b> — кодування, зберігання і відтворення інформації.", "<b>Мислення</b> — аналіз, синтез, порівняння, узагальнення; встановлення зв’язків і висновки.", "<b>Уява</b> — створення нових образів і моделювання ситуацій.", "<b>Мова</b> — кодування думок у слова, внутрішнє мовлення, передача інформації.", "<b>Виконавчі функції</b> — «диригент»: планування, прийняття рішень, контроль, перемикання між завданнями."]]]}, {"h": "Три етапи пам’яті", "body": [["p", "Пам’ять — сукупність процесів <b>кодування</b> (введення інформації), <b>зберігання</b> і <b>відтворення</b> (пошуку і повернення в свідомість)."], ["p", "За моделлю Аткінсона — Шиффріна інформація проходить три сховища:"], ["ul", ["<b>сенсорна пам’ять</b> — дуже коротке зберігання погляду, звуку — до пари секунд;", "<b>короткочасна (робоча) пам’ять</b> — тимчасове сховище, близько 20–30 секунд без повторення;", "<b>довготривала пам’ять</b> — постійне сховище знань, навичок і досвіду, ємність якого практично не має меж."]], ["key", "Завдання інструктора — перевести інформацію з робочої пам’яті в довготривалу."]]}, {"h": "Межі робочої пам’яті", "body": [["p", "<b>Обмежена ємність</b> — «магічне число сім плюс-мінус два»: людина одночасно утримує близько 5–9 окремих елементів. Більше — і нове витісняє попереднє. Ємність можна збільшити групуванням (chunking): номер телефону легше запам’ятати частинами."], ["p", "<b>Обмежена тривалість</b> — без повторення інформація зникає з робочої пам’яті за 20–30 секунд."], ["p", "Якщо ігнорувати ці межі:"], ["ul", ["<b>інформаційне перевантаження</b> — забагато нового одразу, курсант плутається і нічого не засвоює;", "<b>зростання когнітивного навантаження</b> — складний матеріал, погана подача, відволікання забирають ресурси;", "<b>перешкоди для застосування</b> — курсант не може утримати всі елементи, щоб розв’язати задачу."]], ["warn", "Перевантажений слайд чи потік нових термінів без пауз — прямий шлях до того, що курсант не засвоїть нічого."]]}, {"h": "Прийоми, що полегшують засвоєння", "body": [["ul", ["<b>Структурування і сегментація</b> — ділити матеріал на невеликі логічні частини, давати план, заголовки, списки.", "<b>Наочність і кілька каналів</b> — слово плюс схема, зображення, відео; подвійне кодування розвантажує пам’ять.", "<b>Зв’язок з попередніми знаннями</b> — згадати відоме, провести паралелі й аналогії.", "<b>Практика і повторення</b> — задачі, вправи, переказ; особливо ефективне розподілене (інтервальне) повторення.", "<b>Чітка й лаконічна мова</b> — прості речення, без жаргону, чіткі інструкції.", "<b>Мінімум відволікань</b> — тиша, порядок, без багатозадачності."]], ["p", "Також допомагають <b>репетиція</b> — свідоме повторення, <b>візуальні опори</b> — картки, концепт-карти, виділений текст, і <b>мнемоніка</b> — абревіатури й фрази, наприклад EDIP чи APPLE."], ["key", "Невеликими порціями, наочно, з опорою на відоме і з повторенням — так інформація доходить до довготривалої пам’яті."]]}], "keys": ["Процеси: відчуття, сприйняття, увага, пам’ять, мислення, уява, мова, виконавчі функції.", "Пам’ять: кодування, зберігання, відтворення.", "Сенсорна — до 2 с, короткочасна — 20–30 с, довготривала — без меж.", "Ємність робочої пам’яті — 7±2 елементи; групування збільшує її.", "Прийоми: структура, наочність, зв’язок з відомим, повторення, чітка мова, мінімум відволікань."], "test": [["Яка правильна послідовність когнітивної обробки за аналогією з комп’ютером?", ["Вхід → обробка → вихід", "Обробка → вхід → вихід", "Вихід → вхід → обробка", "Вхід → вихід → обробка"], "Когнітивні процеси працюють як комп’ютер: вхід → обробка → вихід."], ["Чим сприйняття відрізняється від відчуття?", ["Сприйняття поєднує відчуття в цілісний образ на основі досвіду", "Сприйняття — відображення окремих властивостей", "Це синоніми", "Відчуття складніше за сприйняття"], "Відчуття — окремі властивості; сприйняття — цілісний образ."], ["Яскравий спалах змусив курсантів обернутися. Який це вид уваги?", ["Мимовільна", "Довільна", "Вибіркова", "Розподілена"], "Мимовільна увага — на яскраве, нове, важливе; довільна — свідома."], ["Яку роль у когнітивних процесах відіграють виконавчі функції?", ["«Диригент»: планування, рішення, контроль, перемикання між завданнями", "Зберігання інформації", "Первинне відчуття", "Кодування думок у слова"], "Виконавчі функції — «диригент» когнітивних процесів."], ["Які три сховища пам’яті за моделлю Аткінсона — Шиффріна?", ["Сенсорна, короткочасна (робоча), довготривала", "Зорова, слухова, моторна", "Оперативна, постійна, кеш", "Свідома, підсвідома, несвідома"], "Модель Аткінсона — Шиффріна: сенсорна, короткочасна, довготривала."], ["Скільки зберігається інформація в робочій пам’яті без повторення?", ["Близько 20–30 секунд", "До пари секунд", "Близько години", "До доби"], "Робоча пам’ять — близько 20–30 секунд без повторення."], ["Скільки окремих елементів одночасно утримує робоча пам’ять?", ["Близько 5–9 — «сім плюс-мінус два»", "Близько 2–3", "Близько 15–20", "Необмежено"], "«Магічне число сім плюс-мінус два»: 5–9 елементів."], ["Інструктор на одному слайді дав 15 нових термінів. Що станеться за теорією обробки інформації?", ["Перевантаження — нове витіснятиме попереднє, курсант не засвоїть нічого", "Курсанти запам’ятають половину", "Нічого, якщо слайд гарний", "Курсанти запам’ятають перші 15 секунд"], "Перевищення ємності робочої пам’яті — інформаційне перевантаження."], ["Як збільшити ємність робочої пам’яті?", ["Групуванням (chunking) — як номер телефону частинами", "Швидшим темпом подачі", "Читанням уголос", "Збільшенням кількості слайдів"], "Групування (chunking) збільшує ємність: елементи об’єднуються в блоки."], ["Яке головне завдання інструктора за теорією обробки інформації?", ["Перевести інформацію з робочої пам’яті в довготривалу", "Максимально заповнити робочу пам’ять", "Тренувати сенсорну пам’ять", "Скоротити час заняття"], "Завдання інструктора — перевести інформацію в довготривалу пам’ять."], ["Інструктор пояснює словами і одночасно показує схему. Який прийом?", ["Наочність і кілька каналів — подвійне кодування", "Сегментація", "Мнемоніка", "Репетиція"], "Слово плюс схема — подвійне кодування розвантажує пам’ять."], ["Яке повторення названо особливо ефективним?", ["Розподілене (інтервальне)", "Масоване за один день", "Одноразове перед іспитом", "Повторення лише вголос"], "Особливо ефективне розподілене (інтервальне) повторення."], ["Абревіатури EDIP і APPLE — приклад якого прийому?", ["Мнемоніки", "Сегментації", "Подвійного кодування", "Метакогніції"], "Мнемоніка — абревіатури й фрази для запам’ятовування."], ["Що з переліченого збільшує когнітивне навантаження?", ["Погана подача і відволікання", "Чітка лаконічна мова", "План і заголовки", "Зв’язок з відомим"], "Складний матеріал, погана подача і відволікання забирають ресурси пам’яті."], ["Ємність якої пам’яті практично не має меж?", ["Довготривалої", "Робочої", "Сенсорної", "Короткочасної"], "Довготривала пам’ять — постійне сховище з практично необмеженою ємністю."]]}, {"id": "b1m2t5z1", "code": "Б1 М2 Т5 З1", "theme": "Тема 5. Публічний виступ", "title": "Підготовка та проведення публічного виступу", "short": "Публічний виступ", "passport": {"goal": "Ознайомити з порядком підготовки та проведення теоретичного (лекційного) і практичного заняття, мистецтвом публічного виступу та способами подолання страху перед аудиторією.", "time": "2 години (90 хв)", "method": "Лекція; навчальний клас", "questions": ["Порядок підготовки та проведення теоретичного (лекційного) заняття", "Принципи підготовки практичного заняття", "Мистецтво публічного виступу", "Способи подолання страху публічного виступу"], "assess": "Усне опитування в кінці заняття.", "criteria": "Позитивно — якщо знає порядок підготовки і проведення заняття та способи подолання страху публічного виступу.", "sources": "ДМ до СТІ 132Г.42К(Н).05, пп. 5.1.1–5.1.4; презентація «Теоретичні (лекційні) заняття»"}, "sections": [{"h": "Підготовка теоретичного заняття", "body": [["p", "Підготовка до лекції — фундаментальний етап. Мета не просто передати інформацію, а домогтися, щоб курсанти її зрозуміли й засвоїли."], ["ul", ["<b>мета і навчальні цілі</b> — що курсанти мають зрозуміти, пояснити, проаналізувати; дієслова когнітивних дій: «пояснити сутність», «порівняти підходи», «сформулювати визначення»;", "<b>аналіз аудиторії</b> — рівень попередньої підготовки, базові знання, можливі труднощі з абстрактними поняттями;", "<b>добір і структурування матеріалу</b> — від загального до часткового, від простого до складного; головні ідеї окремо від другорядних деталей;", "<b>методи викладання</b> — проблемна чи візуальна лекція, бесіда, елементи дискусії, кейси, проблемні запитання;", "<b>дидактичні матеріали</b> — слайди з тезами і схемами, роздатковий матеріал, глосарій; вони доповнюють усний виклад, а не дублюють його;", "<b>контроль і закріплення</b> — коротке опитування, завдання на самопідготовку, підсумки;", "<b>самопідготовка інструктора</b> — досконало знати матеріал, відрепетирувати, перевірити таймінг;", "<b>аудиторія і техніка</b> — дошка, проєктор, справність обладнання; для дистанційного заняття — робота платформи."]], ["key", "Ціль → аудиторія → матеріал → методи → наочність → контроль → репетиція → перевірка класу."]]}, {"h": "Підготовка практичного заняття", "body": [["p", "Практичне заняття формує навички, тому підготовка багатокомпонентна й особливо уважна до безпеки."], ["ul", ["цілі формулюються <b>в термінах дій</b>: «виконати», «зібрати», «застосувати» — з кількісними і якісними критеріями (норматив за час без помилок);", "вивчити програму, настанови, статути і методичні розробки — рекомендований час, обладнання, типові помилки;", "методи — показ, тренування за зразком, виконання частинами і в цілому, імітація, робота в малих групах; від простого до складного;", "покрокові інструкції, картки-завдання, бланки звітності, зразки обладнання;", "<b>критерії оцінювання</b> розробити заздалегідь і довести курсантам ще до практики;", "місце і МТЗ — навчальні місця, справність і комплектність, засоби імітації, освітлення;", "план-конспект з розподілом часу: вступ, демонстрація, інструктаж, вправи, контроль, підсумки, резерв;", "<b>заходи безпеки</b> — аналіз ризиків, інструктаж кожного, засоби захисту, постійний контроль, дії в разі небезпеки;", "самопідготовка — інструктор сам досконало відпрацьовує прийоми, які показуватиме."]], ["warn", "Безпека — один із найпріоритетніших аспектів підготовки практичного заняття. Без інструктажу з безпеки до практики не переходять."]]}, {"h": "Що включає підготовка до виступу", "body": [["p", "Презентація курсу виділяє п’ять складових: <b>підготовка до виступу, організація, місце проведення, візуальна підтримка, практична підготовка</b>."], ["ul", ["проаналізуйте багато даних, виберіть істотні факти й ретельно організуйте їх;", "пояснення — прості, точні, фактичні;", "жарти й анекдоти — рідко: слухачі готові до серйозної розмови; гумор — лише щоб підкреслити чи роз’яснити;", "врахуйте звання і досвід аудиторії та оберіть найкращий підхід;", "організація: ясна логічна структура — <b>вступ, основна частина, висновки</b>;", "місце не повинно працювати проти вас — його організовують заздалегідь;", "візуальна підтримка посилює вплив виступу."]], ["key", "Проводьте репетицію перед кожним виступом! Нехай інша людина перевірить якість звучання, проєктування емоцій і деструктивну поведінку."]]}, {"h": "Проєктування і деструктивна поведінка", "body": [["p", "У великому приміщенні попросіть когось стати в кінці зали й перевірити, чи вас чути. Емоційний тон допомагає аудиторії розділити вашу точку зору: тема серйозна, а ви щиро зацікавлені в результаті."], ["ul", ["відкритий зоровий контакт;", "паузи;", "жести руками;", "інтонація і тон голосу;", "положення тіла;", "вираз обличчя."]], ["p", "Деструктивна поведінка привертає недоречну увагу й заважає спілкуванню: безупинна жестикуляція, не пов’язана з матеріалом; постійне перебування за трибуною або спроби на неї перехилитися; руки в кишенях чи перебирання їх вмісту; безцільне переміщення."], ["key", "Ораторська майстерність дає ефективну передачу знань, мотивацію курсантів, авторитет інструктора та керування навчальним процесом."]]}, {"h": "Як подолати страх виступу", "body": [["p", "Страх публічного виступу (глософобія) поширений, хвилюються навіть досвідчені інструктори. Способи подолання:"], ["ul", ["<b>ретельна підготовка</b> — знати матеріал, структурувати виступ, передбачити запитання, репетирувати вголос, перед дзеркалом або на відео;", "<b>переосмислення страху</b> — фокус на меті й користі для слухачів; хвилювання — джерело енергії;", "<b>візуалізація успіху</b> — уявляти вдалий виступ;", "<b>дихання і тіло</b> — повільні глибокі вдихи, розслаблення плечей і шиї, впевнена постава;", "<b>взаємодія з аудиторією</b> — знайти доброзичливі обличчя, ставити риторичні запитання;", "<b>поступовість</b> — починати з малої знайомої аудиторії; ретельно відпрацювати перші хвилини;", "<b>прийняти недосконалість</b> — дрібні помилки аудиторія пробачає;", "<b>підтримка</b> — колеги, а в складних випадках психолог чи фахівець з публічних виступів."]], ["key", "Подолання страху — процес: з кожним виступом упевненості більше."]]}], "keys": ["Підготовка лекції починається з мети і навчальних цілей.", "Цілі практичного заняття — в термінах дій з критеріями.", "Критерії оцінювання доводять курсантам до практики.", "Безпека — пріоритет підготовки практичного заняття.", "Структура виступу: вступ, основна частина, висновки.", "Репетиція перед кожним виступом.", "Страх долають підготовкою, диханням, взаємодією, практикою."], "test": [["Яке формулювання навчальної цілі підходить для лекції, а не для практичного заняття?", ["Пояснити сутність методики EDIP", "Зібрати автомат за норматив", "Накласти турнікет за 30 секунд", "Виконати перебіжку"], "Для лекції — дієслова когнітивних дій: пояснити, порівняти, сформулювати; для практики — виконати, зібрати, застосувати."], ["Яка роль слайдів і роздаткового матеріалу на лекції?", ["Доповнювати усний виклад, а не дублювати його", "Повністю замінити розповідь інструктора", "Містити весь текст лекції", "Використовуються лише для контролю"], "Дидактичні матеріали доповнюють усний виклад, а не дублюють його."], ["Яка правильна послідовність підготовки лекції?", ["Ціль → аудиторія → матеріал → методи → наочність → контроль → репетиція → перевірка класу", "Матеріал → ціль → репетиція → аудиторія", "Наочність → матеріал → ціль → контроль", "Репетиція → ціль → методи → аудиторія"], "Ціль, аналіз аудиторії, матеріал, методи, наочність, контроль, репетиція, перевірка класу."], ["Коли курсантам доводять критерії оцінювання практичного заняття?", ["Заздалегідь — ще до практики", "Після виконання вправ", "Лише тим, хто не впорався", "Не доводять"], "Критерії оцінювання розробляють заздалегідь і доводять курсантам ще до практики."], ["Інструктор хоче почати стрілецьку практику, не провівши інструктаж з безпеки, бо «всі досвідчені». Чи допустимо?", ["Ні — без інструктажу з безпеки до практики не переходять", "Так, якщо курсанти досвідчені", "Так, якщо є медик", "Так, на холостих"], "Безпека — один із найпріоритетніших аспектів; без інструктажу до практики не переходять."], ["Що інструктор має зробити сам перед практичним заняттям?", ["Досконало відпрацювати прийоми, які показуватиме", "Лише прочитати конспект", "Призначити демонстратора з курсантів", "Нічого — він уже інструктор"], "Самопідготовка: інструктор досконало відпрацьовує прийоми, які демонструватиме."], ["Як часто доречні жарти й анекдоти у виступі?", ["Рідко — лише щоб підкреслити чи роз’яснити", "Часто — для розрядки", "На початку кожного питання", "Ніколи"], "Жарти — рідко: слухачі готові до серйозної розмови; гумор — щоб підкреслити чи роз’яснити."], ["Як перевірити, чи вас чути у великому приміщенні?", ["Попросити когось стати в кінці зали і перевірити", "Говорити якомога гучніше", "Запитати курсантів у першому ряду", "Використати мікрофон завжди"], "У великому приміщенні попросіть когось стати в кінці зали й перевірити."], ["Що з переліченого — деструктивна поведінка виступаючого?", ["Постійне перебування за трибуною або спроби на неї перехилитися", "Паузи", "Відкритий зоровий контакт", "Зміна інтонації"], "Деструктивна: безупинна жестикуляція, постійно за трибуною, руки в кишенях, безцільне переміщення."], ["Що з переліченого НЕ є елементом проєктування емоцій?", ["Читання тексту зі слайда", "Паузи", "Вираз обличчя", "Положення тіла"], "Проєктування: зоровий контакт, паузи, жести, інтонація, положення тіла, вираз обличчя."], ["Як називається страх публічного виступу?", ["Глософобія", "Агорафобія", "Клаустрофобія", "Соціопатія"], "Страх публічного виступу — глософобія."], ["Інструктор сприймає хвилювання перед виступом як джерело енергії. Який спосіб подолання страху?", ["Переосмислення страху", "Візуалізація успіху", "Поступовість", "Прийняття недосконалості"], "Переосмислення: фокус на меті й користі, хвилювання — джерело енергії."], ["Що рекомендовано особливо ретельно відпрацювати для подолання страху?", ["Перші хвилини виступу", "Останній слайд", "Відповіді на всі можливі питання", "Жарти"], "Поступовість: почати з малої аудиторії і ретельно відпрацювати перші хвилини."], ["Що порадити інструктору, який болісно переживає дрібні застереження у виступі?", ["Прийняти недосконалість — дрібні помилки аудиторія пробачає", "Скасовувати виступ після помилки", "Вибачатися після кожної помилки", "Говорити швидше"], "Прийняти недосконалість: дрібні помилки аудиторія пробачає."], ["Хто має перевіряти виступ на репетиції?", ["Інша людина — якість звучання, проєктування емоцій і деструктивну поведінку", "Ніхто, достатньо дзеркала", "Лише командир роти", "Курсанти на занятті"], "Репетиція перед кожним виступом; нехай інша людина перевірить звучання, емоції і деструктивну поведінку."]]}, {"id": "b1m2t6z1", "code": "Б1 М2 Т6 З1", "theme": "Тема 6. Контроль навчання та оцінювання", "title": "Види контролю знань і навичок", "short": "Види контролю", "passport": {"goal": "Ознайомити з видами контролю теоретичних знань і практичних дій (умінь і навичок) під час навчання особового складу, типами тестів і методикою їх розробки.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Види контролю та їх призначення", "Вхідний, проміжний і підсумковий контроль; комплексний іспит", "Типи і види тестів, методика розробки, правила застосування", "Види оцінювання і контролю викладання"], "assess": "Усне опитування; письмова практична робота — скласти кілька тестів різного типу.", "criteria": "Позитивно — якщо знає види тестів і виконує практичне завдання щонайменше на 80% правильно.", "sources": "ДМ до СТІ 132Г.42К(Н).06, пп. 6.1.1–6.1.5; презентація «Види контролю знань та умінь»"}, "sections": [{"h": "Класифікація контролю", "body": [["p", "<b>За часом проведення:</b> вхідний (попередній), проміжний (поточний і рубіжний, модульний) та підсумковий."], ["p", "<b>За формою:</b> усний (опитування, бесіда, дискусія), письмовий (тести, контрольні роботи, есе), практичний (нормативи, вправи на тренажерах і полігонах, моделювання ситуацій), комбінований, а також самоконтроль."], ["p", "Вибір форми залежить від цілей навчання, змісту матеріалу, рівня підготовленості, часу, ресурсів і специфіки спеціальності."], ["key", "Контроль не лише оцінює прогрес — він вчасно показує прогалини, щоб інструктор міг скоригувати навчання."]]}, {"h": "Вхідний, проміжний, підсумковий", "body": [["p", "<b>Вхідний</b> — на початку навчання або нового розділу: визначає початковий рівень. Форми: усне опитування, невеликий тест, прості практичні завдання, анкетування. Результати — для формування груп, адаптації змісту, індивідуальної роботи. За презентацією — також для відбору на курс."], ["p", "<b>Проміжний</b> — регулярно після тем і на практичних заняттях: показує, як засвоюється матеріал, дає зворотний зв’язок і підстави для додаткових занять з відстаючими."], ["p", "<b>Підсумковий</b> — на завершальному етапі, охоплює весь матеріал: письмові, усні та практичні іспити (заліки). За результатами вирішують, чи може людина проходити службу на посаді."], ["key", "Вхідний — «з чого починаємо», проміжний — «як іде», підсумковий — «чи готовий»."]]}, {"h": "Комплексний іспит", "body": [["p", "Комплексний іспит — форма підсумкового контролю, що одночасно оцінює знання та навички з кількох взаємопов’язаних дисциплін."], ["ul", ["<b>інтегрований зміст</b> — завдання охоплюють різні, але пов’язані розділи;", "<b>комплексні практичні завдання</b> — моделювання ситуацій, комплексні нормативи, ситуаційні задачі, захист проєктів;", "<b>комісійний прийом</b> — комісія з фахівців різних напрямків;", "<b>багаторівнева оцінка</b> — не лише правильність, а й мислення, рішення, комунікація, робота в команді;", "можливе поетапне виконання з оцінкою кожного етапу;", "реальне обладнання та імітаційні засоби для наближення до бойових умов."]], ["key", "Комплексний іспит показує, чи вміє військовослужбовець застосовувати знання разом — як у реальному бою."]]}, {"h": "Типи і види тестів", "body": [["p", "<b>Об’єктивні</b> — з однозначними критеріями: так/ні, вибір однієї відповіді, множинний вибір, на відповідність (класифікований), рейтинговий (упорядкування), вставка (заповнення пропуску). <b>Суб’єктивні</b> — оцінка залежить від експерта: коротка відповідь, перерахування, найменування, пояснення, есе, курсова чи дипломна робота."], ["p", "Усні тести — питання, на які курсант відповідає своїми словами; перевіряють фактичні, процедурні та інтегровані знання. Готуються швидко, але тривають довше. Практичні тести — курсант демонструє навичку."], ["p", "За метою: тести досягнень (найпоширеніші), діагностичні, прогностичні, тести здібностей, тести особистості."], ["key", "Приклади з курсу: фактичне знання — «Калібр АК?»; процедурне — «Чому стрілець стоїть праворуч від дерева?»; інтегроване — описати й захистити рішення за 10 хвилин."]]}, {"h": "Як розробити тест", "body": [["ul", ["визначити мету тестування — що саме оцінюємо;", "проаналізувати навчальний зміст;", "скласти специфікацію — скільки завдань з кожної теми, складність, тип;", "сформулювати завдання: стебло з однією проблемою, однозначно правильна відповідь, правдоподібні дистрактори, без підказок;", "для суб’єктивних тестів — заздалегідь визначити критерії оцінювання;", "написати інструкцію — правила, час, спосіб позначення відповідей;", "пілотувати тест на невеликій групі, проаналізувати й виправити;", "розробити ключ або схему оцінювання."]], ["p", "Правила застосування: стандартизовані умови для всіх, чітке інструктування, часові рамки, конфіденційність, об’єктивна перевірка за ключем, зворотний зв’язок і розбір помилок, етичність (запобігання списуванню). Тест — лише один із інструментів контролю."]]}, {"h": "Контроль викладання", "body": [["p", "Викладання теж потребує систематичного оцінювання:"], ["ul", ["<b>самооцінювання</b> — рефлексія після занять, аналіз відеозаписів, щоденник інструктора;", "<b>взаємооцінювання колегами</b> — відвідування заняття і зворотний зв’язок;", "<b>оцінювання керівництвом</b> — відповідність стандартам, перевірка план-конспектів, результатів;", "<b>зворотний зв’язок від курсантів</b> — анкети, опитування;", "<b>аналіз результатів курсантів</b> — низькі результати групи можуть означати потребу змінити методи."]], ["key", "Різнобічне оцінювання дає об’єктивну картину роботи інструктора і напрямки вдосконалення."]]}], "keys": ["За часом: вхідний, проміжний (поточний, рубіжний), підсумковий.", "За формою: усний, письмовий, практичний, комбінований, самоконтроль.", "Комплексний іспит: інтегрований зміст, комісія, багаторівнева оцінка.", "Тести: об’єктивні та суб’єктивні.", "Завдання тесту: одна проблема, однозначна відповідь, правдоподібні дистрактори.", "Практична робота зараховується від 80% правильних відповідей."], "test": [["Перед курсом інструктор дає короткий тест, щоб сформувати групи за рівнем. Який це вид контролю?", ["Вхідний", "Проміжний", "Підсумковий", "Рубіжний"], "Вхідний — на початку: визначає рівень, допомагає формувати групи й адаптувати зміст; також відбір на курс."], ["Після кожної теми курсанти виконують короткий норматив. Який вид контролю і навіщо?", ["Проміжний — показати засвоєння і підстави для додаткових занять", "Вхідний — для відбору", "Підсумковий — для допуску на посаду", "Самоконтроль"], "Проміжний (поточний, рубіжний) — регулярно після тем, дає зворотний зв’язок."], ["За результатами якого контролю вирішують, чи може людина проходити службу на посаді?", ["Підсумкового", "Вхідного", "Проміжного", "Самоконтролю"], "Підсумковий охоплює весь матеріал; за ним вирішують про службу на посаді."], ["Норматив на полігоні — це яка форма контролю?", ["Практична", "Письмова", "Усна", "Самоконтроль"], "Практична форма: нормативи, вправи на тренажерах і полігонах, моделювання ситуацій."], ["Що з переліченого — ознака комплексного іспиту?", ["Комісія з фахівців різних напрямків і багаторівнева оцінка, включно з командною роботою", "Тест лише з однієї дисципліни", "Оцінює тільки правильність відповіді", "Приймає один інструктор"], "Комплексний іспит: інтегрований зміст, комісія з різних фахівців, багаторівнева оцінка, можлива поетапність."], ["Тест «упорядкуйте етапи EDIP» — це який вид об’єктивного тесту?", ["Рейтинговий (упорядкування)", "На відповідність", "Вставка", "Множинний вибір"], "Рейтинговий тест — упорядкування; на відповідність — класифікований; вставка — заповнення пропуску."], ["Есе й коротка відповідь належать до яких тестів?", ["Суб’єктивних — оцінка залежить від експерта", "Об’єктивних", "Практичних", "Діагностичних"], "Суб’єктивні: коротка відповідь, перерахування, пояснення, есе, курсова робота."], ["«Чому стрілець стоїть праворуч від дерева?» Яке знання перевіряє це питання?", ["Процедурне", "Фактичне", "Інтегроване", "Афективне"], "Приклади курсу: «Калібр АК?» — фактичне; «Чому праворуч від дерева?» — процедурне; захист рішення — інтегроване."], ["Який тип тестів найпоширеніший за метою?", ["Тести досягнень", "Діагностичні", "Прогностичні", "Тести особистості"], "За метою: досягнень (найпоширеніші), діагностичні, прогностичні, здібностей, особистості."], ["Яка вимога до тестового завдання правильна?", ["Стебло з однією проблемою, однозначно правильна відповідь, правдоподібні дистрактори", "Дистрактори мають бути явно абсурдними", "У стеблі краще кілька проблем", "Правильна відповідь має бути найдовшою"], "Стебло — одна проблема, одна правильна відповідь, правдоподібні дистрактори, без підказок."], ["Що робити з новим тестом перед застосуванням на всьому потоці?", ["Пілотувати на невеликій групі, проаналізувати й виправити", "Одразу застосувати", "Показати курсантам заздалегідь", "Скоротити вдвічі"], "Порядок розробки включає пілотування на невеликій групі і виправлення."], ["Що визначає специфікація тесту?", ["Скільки завдань з кожної теми, складність і тип", "Шрифт і оформлення", "Час проведення", "Склад комісії"], "Специфікація: кількість завдань з кожної теми, складність, тип."], ["Для суб’єктивних тестів що треба зробити заздалегідь?", ["Визначити критерії оцінювання", "Скласти ключ із варіантами", "Обмежити час до 5 хвилин", "Нічого — оцінює експерт на свій розсуд"], "Для суб’єктивних тестів критерії оцінювання визначають заздалегідь."], ["Уся група провалила тест з теми. Що це може означати з погляду контролю викладання?", ["Потребу змінити методи викладання", "Що група слабка", "Що тест занадто короткий", "Що треба покарати групу"], "Аналіз результатів: низькі результати групи можуть означати потребу змінити методи."], ["Відвідування заняття колегою з подальшим зворотним зв’язком — це…", ["Взаємооцінювання", "Самооцінювання", "Оцінювання керівництвом", "Зворотний зв’язок від курсантів"], "Контроль викладання: самооцінювання, взаємооцінювання колегами, керівництвом, від курсантів, аналіз результатів."], ["Що з переліченого — правило застосування тестів?", ["Стандартизовані умови для всіх і розбір помилок", "Різні умови для різних курсантів", "Без часових рамок", "Без зворотного зв’язку"], "Правила: стандартизовані умови, інструктування, час, конфіденційність, перевірка за ключем, розбір помилок, етичність."]]}, {"id": "b1m2t6z2", "code": "Б1 М2 Т6 З2", "theme": "Тема 6. Контроль навчання та оцінювання", "title": "Оформлення документації з обліку підготовки", "short": "Облікова документація", "passport": {"goal": "Ознайомити з правилами оформлення та ведення документації, необхідної для проведення навчання.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція / практичне заняття; аудиторія", "questions": ["Основна облікова документація, що необхідна для проведення навчання", "Порядок і правила ведення основної облікової документації"], "assess": "Відповіді на запитання протягом заняття; практичне завдання в кінці.", "criteria": "Позитивно — якщо надав відповіді на запитання і виконав практичне завдання.", "sources": "Презентація «Порядок оформлення та ведення документації з обліку підготовки»; Курс стрільб (КРП 03.032.056-2018), розд. 3"}, "sections": [{"h": "Що таке облікова документація", "body": [["p", "<b>Облікова документація</b> — сукупність документів, у яких фіксують, реєструють і зберігають інформацію про діяльність, події, людей, майно або процеси."], ["p", "Основні документи обліку підготовки:"], ["ul", ["<b>Журнал обліку бойової підготовки (ЖБП)</b>;", "<b>оціночні відомості</b>;", "<b>картка обліку виконання вправ стрільб</b> (картка настрілу)."]], ["key", "Що не записано — того не було. Облік підтверджує, що навчання проведене і результат досягнутий."]]}, {"h": "Журнал бойової підготовки", "body": [["p", "ЖБП — службовий документ підрозділу, у якому фіксують усе, що стосується навчання: перелік предметів, іменний список, теми, дати і час занять, керівника заняття, оцінки та присутність."], ["ul", ["оформлюється на навчальний період; веде командир навчального взводу (інструктор взводу) — за кожного курсанта;", "до початку навчання журнал <b>прошитий, пронумерований і зареєстрований</b> установленим порядком;", "під час занять журнал — у командира (інструктора) взводу;", "заповнюється <b>чорним чорнилом</b>;", "командир взводу на сторінці 2 розписується, що ознайомлений з правилами ведення;", "зберігається протягом календарного року, потім знищується встановленим порядком."]], ["warn", "Журнал з навчальними записами — службовий документ. Не можна виносити його, вести олівцем чи дописувати «заднім числом»."]]}, {"h": "Розділи журналу", "body": [["ul", ["<b>Розділ 2</b> «Зміст журналу» — розділи і номери сторінок;", "<b>Розділ 3</b> — список особового складу за штатно-посадовим розрахунком (заповнюється на самопідготовці);", "<b>Розділ 4</b> — облік за предметами навчання в послідовності Програми бойової підготовки;", "<b>Розділ 5</b> — облік виконання нормативів (практичних робіт): індивідуальна оцінка за кожен норматив;", "<b>Розділи 6 і 7</b> — стрільби і водіння; у розділі 6 графа «вид зброї» ділиться на дві частини, у другій — оцінка за матеріальну частину;", "<b>Розділ 8</b> — вправи ВСК: у графі «дата» — дата і форма одягу («с» — спортивна, «в» — військова); в оцінці: чисельник — результат, знаменник — бали;", "<b>Розділ 9</b> — результати контролю: зауваження перевіряючих; інструктор записує, що недоліки усунено (або причину), дату, і розписується."]]]}, {"h": "Оціночні відомості", "body": [["p", "Оціночна відомість — документ, у який вносять результати теоретичних знань, практичних дій і навичок. Види:"], ["ul", ["<b>за СТІ</b> — посада, звання, ПІБ; предмет і дата; навчальні питання/практичні завдання; бали й оцінка; підпис керівника заняття;", "<b>за виконання нормативів</b> — номер і назва нормативу, час, оцінка, загальна оцінка;", "<b>результатів виконання вправ стрільб</b> — вправа і номери мішеней, зброя і калібр, набої, час, день/ніч, дата, підрозділ; загальний результат за трьома критеріями: стрільба, знання основ і правил, матчастина/нормативи; на звороті — таблиця результатів, аналіз, недоліки, підпис керівника стрільби;", "<b>оціночний лист КТЗ</b> — звання і ПІБ курсанта та інструктора з підписами, дата, оцінки «викон./не викон.», «зал./не зал.», рекомендації, підпис командира підрозділу."]], ["key", "Порядок оцінювання стрільб — у Курсі стрільб (КРП 03.032.056-2018), розділ 3 «Оцінка вогневої підготовки»."]]}, {"h": "Картка настрілу", "body": [["p", "Картка обліку виконання вправ стрільб — особистий обліковий документ, де фіксують усі результати стрільб військовослужбовця:"], ["ul", ["хто стріляв — ПІБ, посада, підрозділ;", "яку вправу і з якої зброї;", "дата і час доби;", "кількість набоїв (настріл);", "результат — влучення, оцінка;", "підписи керівника стрільб (інструктора) і того, хто навчається."]], ["p", "У картці також ведуть облік метання гранат, вправ з психологічної підготовки (обкатка технікою, психологічна смуга перешкод) і виконання КТЗ (польових виходів)."], ["key", "Практичне завдання заняття: правильно заповнити фрагменти ЖБП, відомості та картки на умовних даних."]]}], "keys": ["Основні документи: ЖБП, оціночні відомості, картка настрілу.", "ЖБП: прошитий, пронумерований, зареєстрований; чорне чорнило.", "ЖБП зберігається календарний рік.", "Розділ 9 — зауваження перевіряючих і відмітка про усунення.", "Чотири види відомостей: СТІ, нормативи, стрільби, КТЗ.", "Картка настрілу — особистий облік стрільб."], "test": [["Які три основні документи обліку підготовки названо на занятті?", ["ЖБП, оціночні відомості, картка настрілу", "Наказ, розклад, план-конспект", "Рапорт, журнал чергування, відомість майна", "Програма, розклад, журнал наряду"], "Основні документи: журнал бойової підготовки, оціночні відомості, картка обліку виконання вправ стрільб."], ["Хто веде журнал бойової підготовки навчального взводу?", ["Командир навчального взводу (інструктор взводу)", "Командир роти", "Писар штабу", "Старший курсант"], "ЖБП оформлюється на навчальний період і ведеться командиром (інструктором) взводу."], ["Інструктор заповнив ЖБП синьою ручкою. Що порушено?", ["Журнал заповнюється чорним чорнилом", "Нічого — колір не важливий", "Журнал заповнюють олівцем", "Журнал заповнює лише писар"], "ЖБП заповнюється чорним чорнилом; олівець і записи «заднім числом» неприпустимі."], ["Що має бути зроблено з ЖБП до початку навчання?", ["Прошитий, пронумерований і зареєстрований установленим порядком", "Підписаний кожним курсантом", "Заповнений оцінками наперед", "Нічого"], "До початку навчання журнал прошитий, пронумерований і зареєстрований."], ["Скільки зберігається ЖБП після завершення?", ["Протягом календарного року, потім знищується установленим порядком", "П’ять років", "Безстроково", "До кінця курсу"], "ЖБП зберігається протягом календарного року, потім знищується установленим порядком."], ["Де командир взводу розписується про ознайомлення з правилами ведення ЖБП?", ["На сторінці 2", "На останній сторінці", "У розділі 9", "На обкладинці"], "Командир взводу на сторінці 2 розписується, що ознайомлений з правилами ведення."], ["Перевіряючий записав зауваження. Що робить інструктор у розділі 9?", ["Записує, що недоліки усунено або причину, дату, і розписується", "Нічого — це запис перевіряючого", "Викреслює зауваження після усунення", "Переносить у розділ 4"], "Розділ 9: інструктор записує усунення недоліків (або причину), дату і підпис."], ["У розділі 8 (ВСК) у графі «дата» стоїть позначка «с». Що вона означає?", ["Спортивна форма одягу", "Субота", "Стройова підготовка", "Самостійне виконання"], "Розділ 8: дата і форма одягу — «с» спортивна, «в» військова."], ["Як записується оцінка у розділі 8 за вправу ВСК?", ["Чисельник — результат, знаменник — бали", "Лише бали", "Лише оцінка словом", "Чисельник — бали, знаменник — оцінка"], "В оцінці ВСК: чисельник — результат, знаменник — бали."], ["У розділі 6 графа «вид зброї» ділиться на дві частини. Що записують у другій?", ["Оцінку за матеріальну частину", "Номер зброї", "Кількість набоїв", "Дату стрільби"], "У розділі 6 друга частина графи «вид зброї» — оцінка за матеріальну частину."], ["У якому документі визначено порядок оцінювання стрільб?", ["Курс стрільб КРП 03.032.056-2018, розділ 3", "Наказ ГШ № 41", "Доктрина з організації підготовки", "Наказ МОУ № 170"], "Порядок оцінювання стрільб — Курс стрільб (КРП 03.032.056-2018), розділ 3."], ["За якими трьома критеріями виставляють загальний результат у відомості стрільб?", ["Стрільба, знання основ і правил, матчастина/нормативи", "Влучність, швидкість, дисципліна", "Теорія, практика, поведінка", "Дальність, кучність, час"], "Загальний результат стрільб: стрільба, знання основ і правил стрільби, матчастина/нормативи."], ["Які оцінки ставлять в оціночному листі КТЗ?", ["«Викон./не викон.», «зал./не зал.»", "За 12-бальною шкалою", "Лише бали 3–2–1–0", "Лише «відмінно» чи «добре»"], "Оціночний лист КТЗ: «виконано/не виконано», «залік/незалік», рекомендації, підписи."], ["Що з переліченого також обліковують у картці настрілу, окрім стрільб?", ["Метання гранат, обкатку технікою, психологічну смугу і КТЗ", "Наряди і відпустки", "Медичні огляди", "Стройові огляди"], "У картці також ведуть облік метання гранат, психологічної підготовки і польових виходів (КТЗ)."], ["Кого підписи обов’язкові в картці настрілу?", ["Керівника стрільб (інструктора) і того, хто навчається", "Лише командира роти", "Лише курсанта", "Начальника полігону"], "Картка настрілу: підписи керівника стрільб та того, хто навчається."], ["Який принцип обліку сформульовано на занятті?", ["Що не записано — того не було", "Облік ведуть лише за потреби", "Головне — результат, а не записи", "Облік дублює усну доповідь"], "Облік підтверджує, що навчання проведене і результат досягнутий: що не записано — того не було."]]}, {"id": "b4m1t1z1", "code": "Б4 М1 Т1 З1", "theme": "Блок 4. Модуль 1. Порядок організації та проведення занять на об’єктах НМТБ полігону", "title": "Зразковий показ організації та проведення польових занять", "short": "Польове заняття", "passport": {"goal": "Навчити проводити заняття на об’єктах НМТБ полігону (ділянці місцевості); довести складові частини, принципи підготовки та порядок проведення практичних польових занять.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, інструкторсько-методичне заняття (зразковий показ); аудиторія, ділянка місцевості", "questions": ["Особливості практичних польових занять", "Складові частини практичного польового заняття", "Принципи підготовки і порядок проведення польового заняття, допоміжний персонал"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо засвоєно не менше 70% матеріалу.", "sources": "Програма ТП 7-418.78, розд. 7.1.4; презентація «Зразковий показ…»; план-конспект заняття"}, "sections": [{"h": "Особливості польових занять", "body": [["p", "Практичні заняття можна проводити і в класі, і на ділянці місцевості. Польове заняття відрізняється від лекції метою і методами: лекція дає знання й розуміння, практичне заняття формує, закріплює і вдосконалює навички. На лекції переважає пасивна роль слухачів, на практиці — активні дії кожного."], ["ul", ["на освоєння навичок потрібно <b>більше часу</b>, ніж на теорію;", "використовується методика <b>EDIP</b>: пояснення — демонстрація — імітація — практика;", "заняття <b>вимагає матеріального забезпечення</b>: зброя, засоби імітації, позиція противника, засоби зв’язку, аптечки;", "місцевість працює на тему: лісиста чи відкрита ділянка, рельєф, водні об’єкти, дороги, стежки, будівлі, інженерні споруди, обладнані навчальні місця."]], ["key", "Місце для заняття підбирають якомога реалістичніше під тему."]]}, {"h": "Підготовка до заняття", "body": [["ul", ["<b>план-конспект</b> — за вимогами і ціллю заняття; заходи безпеки та інструкції для персоналу і курсантів виписані детальніше, ніж для класу;", "<b>місце проведення</b> — визначені місця: адміністрації, домедичної допомоги, теорії, демонстрації, тренування, фінальної практики; підготовлені маршрути переміщення, без відволікаючих факторів;", "<b>навчально-матеріальна база</b> — з розрахунку на кожного курсанта: засоби імітації, позиція противника, демогрупа; стан перевірено до початку."]], ["key", "Репетиція і визначення місць на місцевості — обов’язкова частина підготовки."]]}, {"h": "Допоміжний персонал", "body": [["p", "Польове заняття майже завжди проводиться з допоміжним персоналом. Бажано, щоб кожна група мала зв’язок з інструктором."], ["ul", ["<b>демонстраційна група</b> («демо-група») — люди з достатньою підготовкою, щоб зразково показати будь-який елемент;", "<b>імітаційна група (противник)</b> — взаємодіє з курсантами під час тренувань: знає місця відпрацювання, пройшла чіткий інструктаж, уміє користуватися засобами імітації;", "<b>асистент</b> (помічник, суб-інструктор) — має рівень інструктора, знає задум керівника, пройшов інструктаж, володіє матеріалом теми."]], ["p", "Коли прибуває допоміжний персонал (підготовча частина для персоналу): заходи безпеки — перевірка зброї і магазинів, 5 правил, дії за командою «СТОП!», безпека на місцевості; розподіл місць і матеріальних засобів (бирки, імітація, медичні ноші); вказівки демогрупі, асистентам, противнику і <b>репетиція</b>."]]}, {"h": "Складові частини польового заняття", "body": [["ul", ["<b>Підготовча частина (персонал)</b> — безпека, розподіл засобів, репетиція.", "<b>Підготовча частина (курсанти)</b> — привітання і перевірка особового складу, заходи безпеки («Зброю до огляду!», доповідь про боєприпаси та засоби імітації, декларація), перевірка забезпечення, представлення місць проведення заняття, початкова підготовка (маскування, видача імітації).", "<b>Вступна частина</b> — перевірка знань попереднього заняття, тема і мета, порядок і хід заняття (метод, питання, умови і критерії оцінювання, розподіл часу, заміна на навчальних місцях, групи і номери, старший групи), мотивація.", "<b>Основна частина</b> — пояснення, демонстрація, імітація, тренування, переходи між питаннями, дотримання заходів безпеки.", "<b>Контроль</b> — практичний контроль за ціллю заняття; оцінюється весь особовий склад.", "<b>Заключна частина</b> — заходи безпеки (перевірка зброї, декларація, рапорт), підведення підсумків, кінцеві інструкції: тема наступного заняття, прибиральники, самопідготовка."]], ["warn", "Перевірка зброї на розрядженість — і на початку, і в кінці заняття, у всього особового складу, включно з персоналом."]]}, {"h": "Принципи проведення", "body": [["ul", ["<b>безпека</b> — безумовний пріоритет: інструктаж, контроль дій, запобігання небезпечним ситуаціям;", "<b>моделювання реальних умов</b> — обстановка, наближена до бойової, з імітацією;", "<b>активність і свідомість</b> — кожен задіяний у дії;", "<b>послідовність і систематичність</b> — від простого до складного;", "<b>індивідуальний підхід</b> — з урахуванням рівня кожного;", "<b>контроль і оцінювання</b> — систематично й об’єктивно;", "<b>зворотний зв’язок</b> — запитання, роз’яснення, оцінка дій;", "<b>матеріально-технічне забезпечення</b> — наявне і справне."]], ["p", "Інструкторські якості ті самі, що й у класі: зоровий контакт, зовнішній вигляд, впевненість, гучність голосу, чітка вимова, без слів-паразитів."], ["key", "Далі — Тема 2: курсанти по черзі проводять власні польові заняття (1×60 хв) і оцінюються за оціночним листом «Польове»."]]}], "keys": ["Польове заняття — формування навичок; методика EDIP.", "Потребує більше часу і матеріального забезпечення.", "Допоміжний персонал: демо-група, імітаційна група (противник), асистент.", "Підготовча частина двічі: для персоналу і для курсантів.", "Перевірка зброї — на початку і в кінці, у всіх.", "Курсант оцінюється позитивно від 70%."], "test": [["Чим польове практичне заняття принципово відрізняється від лекції?", ["Формує й закріплює навички через активні дії кожного", "Дає теоретичне розуміння", "Курсанти переважно слухають", "Не потребує матеріального забезпечення"], "Лекція дає знання, практичне заняття формує навички; на практиці — активні дії кожного."], ["Як обирають ділянку місцевості для польового заняття?", ["Якомога реалістичніше під тему заняття", "Найближчу до казарми", "Лише відкриту місцевість", "Будь-яку рівну ділянку"], "Місцевість працює на тему: її підбирають якомога реалістичніше."], ["Чим план-конспект польового заняття відрізняється від класного?", ["Заходи безпеки та інструкції для персоналу й курсантів виписані детальніше", "Він коротший", "У ньому немає розподілу часу", "У ньому немає мети"], "План-конспект польового: заходи безпеки та інструкції виписані детальніше, ніж для класу."], ["Які місця визначають на ділянці під час підготовки?", ["Адміністрації, домедичної допомоги, теорії, демонстрації, тренуванн аняття; проінформовано про паралельні заняття.", "s": false}, {"t": "Мотивація", "d": "Змотивував особовий склад акцентувавши увагу на важливості даного заняття, з наведенням прикладів ситуацій реального досвіду.", "s": false}]}, {"g": "ОСНОВНА ЧАСТИНА (навчання)", "items": [{"t": "Пояснення", "d": "Чітко і ясно пояснив матеріал на занятті з наведенням прикладів, які допомагають досягти мети заняття.", "s": false}, {"t": "Демонстрація", "d": "Зразково-показовий, безпомилковий показ, відповідає меті заняття.", "s": false}, {"t": "Імітація", "d": "Під час етапу було задіяно 100% о/с. Для пришвидшення та полегшення досягнення мети відпрацювання здійснювалося за принципами: \"роби за мною\", \"роби за кроками/командами\", \"роби в цілому\". Забезпечено контроль за діями кожного курсанта; вчасна фіксація та виправлення помилок.", "s": false}, {"t": "Тренування", "d": "Виконується по меті заняття, одночасно задіяний весь особовий склад, вчасно вказував на помилки та одразу виправлялися.", "s": false}, {"t": "Перехід між навчальними етапами", "d": "Виразний акцент після кожної частини заняття: розмежування начальних етапів, перевірка зворотного зв’язку через запитання, підведення проміжних підсумків.", "s": false}, {"t": "Послідовність навчальних питань", "d": "Навчальні питання приведені у логічній послідовності, допомагають досягти мети заняття; зосереджується увага на переході між навчальними питаннями.", "s": false}, {"t": "Проведення опитувань", "d": "Опитування проводяться на всіх етапах заняття (вступ, між навчальними питаннями, на контролі); питання випливають зі змісту, запобігають «нерозумінню», актуалізують знання.", "s": false}, {"t": "Знання навчального матеріалу", "d": "Досконале володіння знанням матеріалу; надано відповіді на всі питання курсантів, пов’язані із заняттям; якщо інструктор не знає відповіді на питання – не вводить в оману.", "s": true}, {"t": "Додержання заходів безпеки", "d": "Керівник заняття здійснював безперервний контроль за дотриманням заходів безпеки, регулярно наголошував на їх дотриманні, демонстрував взірцевий особистий приклад.", "s": true}]}, {"g": "ОСНОВНА ЧАСТИНА (контроль)", "items": [{"t": "Порядок контролю", "d": "Нагадав мету заняття, критерії оцінювання; призначено командира відділення, якщо потрібно - видаються засоби імітації.", "s": false}, {"t": "Місце підготовки до фінальної практики (маскування)", "d": "Постановка навчально-бойового завдання на макеті місцевості – обов’язково (ситуація, легенда); завдання, імовірні позиції противника. Доповідь про готовність виконання НБЗ (зворотній брифінг «командир відділення - інструктор»). Постановка навчально-бойового завдання навчальній групі командиром відділення.", "s": false}, {"t": "Фінальний інструктаж", "d": "Фінальні вказівки: наголошення про дотримання ЗБ, час на виконання завдання.", "s": false}, {"t": "Виконання контролю", "d": "Реальний контроль (використовуються противник, засоби імітації), виконується все по меті навчання, спостерігаються дії курсантів (якщо потрібно, використовується додатковий персонал).", "s": false}, {"t": "Заходи безпеки та їх контроль під час фінальної практики", "d": "Не порушуються заходи безпеки та контролюються їх додержання. Після контролю перевірити зброю на розрядженість.", "s": true}, {"t": "Підведення підсумків контролю", "d": "Опитується противник та група імітації на предмет виконання дій курсантами (проводиться на місці завершення фінальної практики). Заповнюється оціночний лист", "s": false}, {"t": "Досягнення навчальної мети", "d": "Курсанти усвідомили матеріал згідно опису цілі (3 - 100% курсантів виконали 90% навчальних задач; 2 - 90% курсантів виконали 80% навчальних задач; 1 - 70% курсантів виконали 70% навчальних задач; 0 - виконано не вірно 80% навчальних задач або їх виконали правильно менше 70%).", "s": true}]}, {"g": "ЗАКЛЮЧНА ЧАСТИНА", "items": [{"t": "Підведення підсумків", "d": "Курсантам під час підведення підсумків нагадати про мету заняття, використовуючи техніку похвала-критика-похвала, сказати про досягнення мети заняття, провести опитування курсантів та відповісти на їх питання, оголосити оцінки.", "s": false}, {"t": "Перевірка по заходам безпеки", "d": "Перевірка зброї на розрядженість у всього особового складу, демогрупи. Доповідь про наявність б/п та засобів імітації. Прибирання місця проведення заняття.", "s": true}, {"t": "Кінцеві інструкції", "d": "Завдання на самостійну підготовку; доведення місця, часу, теми наступного заняття та необхідної навчально-матеріальної бази; прибирання території.", "s": false}]}, {"g": "НЕВЕРБАЛЬНИЙ ЗВ'ЯЗОК", "items": [{"t": "Зоровий контакт", "d": "Постійно погляд направлений на аудиторію, зоровий контакт з усіма курсантами.", "s": false}, {"t": "Зовнішній вигляд", "d": "Зовнішній вигляд та форма одягу відповідає вимогам Збройних Сил України.", "s": false}, {"t": "Впевненість", "d": "Відсутнє хвилювання, тремтіння голосу, постійно підтримується контакт з аудиторією.", "s": false}, {"t": "Позиція відносно курсантів", "d": "Обмежив вплив відволікаючих факторів (руки у кишенях, схрещування рук, гра з ручкою); уникав хаотичної ходьби, непотрібних рухів руками.", "s": false}, {"t": "Ентузіазм", "d": "Виявляв рішучість та наполегливість, демонстрував позитивну зацікавленість предметом, творче натхнення та прагнення до високих результатів.", "s": false}]}, {"g": "ВЕРБАЛЬНИЙ ЗВ'ЯЗОК", "items": [{"t": "Гучність голосу", "d": "Говорить достатньо голосно (чітко чутно курсантам за останніми партами або в останній шерензі), інтонація та швидкість мови не ускладнює засвоєння навчального матеріалу.", "s": false}, {"t": "Вимова/Діалект", "d": "Чітка вимова, правильна граматика (не ускладнює засвоєння навчального матеріалу).", "s": false}, {"t": "Слова паразити", "d": "Уникає вживання зайвих, неінформативних слів та сталих виразів (наприклад: «так ось», «значить так»).", "s": false}]}, {"g": "МАЙСТЕРНІСТЬ", "items": [{"t": "Пунктуальність", "d": "Оптимально розподілений час заняття. (3 – витримано розподіл між част }

   <details ${store.get("passOpen",false)?"open":""} id="passD"><summary>Паспорт заняття: час, навчальні питання, оцінювання</summary>
    <dl><div><dt>Час</dt><dd>${esc(P.time)}</dd></div><div><dt>Метод і місце</dt><dd>${esc(P.method)}</dd></div>

  <div class="tabs" role="tablist"><button class="tab ${tab==="lec"?"on":""}" data-go="#${id}">Лекція · ${mins(id)} хв</button><button class="tab ${tab==="test"?"on":""}" data-go="#${id}/test">Тест · ${t.test.length} питань</button></div>`;
  if(tab==="lec"){
    html+=`<article class="lec">`;
    t.sections.forEach((sec,si)=>{
      html+=`<section class="sec"><h2 class="blk" id="s${si}h" data-s="${si}">${esc(sec.h)}</h2>`;

        else if(k==="ul")html+=`<ul>${v.map((it,li)=>`<li class="blk" id="${id_}i${li}" data-s="${si}">${it}</li>`).join("")}</ul>`;

      });
      html+=`</section>`;
    });

/* ---------- audio ---------- */
const audio=new Audio();audio.preload="auto";
const RATES=[1,1.25,1.5,0.9];
let A={t:null,s:0,rate:store.get("rate",1),cur:null,userScroll:0};
audio.playbackRate=A.rate;
function setupPlayer(t){
  A.t=t;$("#player").classList.remove("hidden");$("#pSpd").textContent=fmtRate(A.rate);
  if(A.cur&&A.tid===t.id){paintNow(A.cur);updateUI();return}
  A.tid=t.id;A.s=Math.min(store.get("pos_"+t.id,0),t.sections.length-1);loadSec(A.s,false);
}
function fmtRate(r){return (r+"").replace(".",",")+"×"}
function loadSec(s,play,at){
  const tm=TIMING[A.t.id];if(!tm||!tm[s])return;
  A.s=s;const src="audio/"+tm[s].f;const same=audio.src.endsWith(src)&&audio.readyState>=1;
  const go_=()=>{if(at)audio.currentTime=at;audio.playbackRate=A.rate;if(play)audio.play().catch(()=>{});};
  if(same)go_();else{audio.src=src;audio.addEventListener("loadedmetadata",go_,{once:true});audio.load();}
  store.set("pos_"+A.t.id,s);updateUI();mediaMeta();
}
function updateUI(){
  if(!A.t)return;const sec=A.t.sections[A.s];
  $("#pTitle").textContent=sec?sec.h:"";
  const d=audio.duration||(TIMING[A.t.id][A.s]||{}).d||0;
  $("#pTime").textContent=`${A.s+1}/${A.t.sections.length} · ${fmt(audio.currentTime)} / ${fmt(d)}`;
  $("#pFill").style.width=(d?audio.currentTime/d*100:0)+"%";
  const playing=!audio.paused;$("#icPlay").classList.toggle("hidden",playing);$("#icPause").classList.toggle("hidden",!playing);
  $("#pPlay").setAttribute("aria-label",playing?"Пауза":"Слухати");
}
function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
audio.addEventListener("timeupdate",()=>{
  if(!A.t||S.view!=="topic")return;updateUI();
  const m=(TIMING[A.t.id][A.s]||{}).m||[];let cur=m[0]&&m[0][0];
  for(const [id,t] of m){if(audio.currentTime+0.05>=t)cur=id;else break}
  if(cur&&cur!==A.cur){A.cur=cur;if(S.tab==="lec")paintNow(cur,true)}
});
audio.addEventListener("play",updateUI);audio.addEventListener("pause",updateUI);
audio.addEventListener("ended",()=>{
  const lp=Math.max(lecProg(A.t.id),A.s+1);store.set("lec_"+A.t.id,lp);
  if(A.s+1<A.t.sections.length)loadSec(A.s+1,true);
  else{store.set("pos_"+A.t.id,0);updateUI();const k=document.querySelector(".keys");if(k&&S.tab==="lec")k.scrollIntoView({behavior:"smooth",block:"center"});}
});
function paintNow(id,scroll){
  document.querySelectorAll(".blk.now").forEach(e=>e.classList.remove("now"));
  const el=document.getElementById(id);if(!el)return;el.classList.add("now");
  if(scroll&&Date.now()-A.userScroll>5000){const r=el.getBoundingClientRect();const vh=innerHeight;if(r.top<90||r.bottom>vh-150)el.scrollIntoView({behavior:"smooth",block:"center"})}
}
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{A.userScroll=Date.now()},{passive:true}));
function seekBlock(id){
  const s=+document.getElementById(id).dataset.s;const m=(TIMING[A.t.id][s]||{}).m||[];
  const mk=m.find(x=>x[0]===id);const at=mk?mk[1]:0;
  A.userScroll=0;A.cur=null;
  if(s!==A.s)loadSec(s,true,at);else{audio.currentTime=at;audio.play().catch(()=>{})}
}
function togglePlay(){if(!A.t)return;if(audio.paused){audio.play().catch(()=>{});A.userScroll=0}else audio.pause()}
function pauseAudio(){try{audio.pause()}catch(e){}}
function stopAudio(reset){pauseAudio();if(reset){A.cur=null}}
$("#pPlay").onclick=togglePlay;
$("#pPrev").onclick=()=>{if(audio.currentTime>4)audio.currentTime=0;else if(A.s>0)loadSec(A.s-1,!audio.paused)};
$("#pNext").onclick=()=>{if(A.s+1<A.t.sections.length)loadSec(A.s+1,!audio.paused)};
$("#pSpd").onclick=()=>{A.rate=RATES[(RATES.indexOf(A.rate)+1)%RATES.length];audio.playbackRate=A.rate;store.set("rate",A.rate);$("#pSpd").textContent=fmtRate(A.rate)};
$("#pBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};
function mediaMeta(){if(!("mediaSession" in navigator)||!A.t)return;try{
  navigator.mediaSession.metadata=new MediaMetadata({title:A.t.sections[A.s].h,artist:A.t.short,album:"КІБР"});
  navigator.mediaSession.setActionHandler("play",()=>audio.play());navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack",()=>$("#pNext").onclick());navigator.mediaSession.setActionHandler("previoustrack",()=>$("#pPrev").onclick());
}catch(e){}}

/* ---------- quiz ---------- */
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(cfg){
  Q={...cfg,items:shuffle(cfg.items).map(it=>{const [q,opts,ex,clip]=it.q;return {...it,text:q,ex,clip,opts:shuffle(opts.map((o,k)=>({o,ok:k===0,k})))}}),i:0,score:0,picked:null,wrong:[]};
  renderQ();
}
function renderQ(noVoice){
  const box=$("#quiz");const it=Q.items[Q.i];const n=Q.items.length;const L="АБВГ";
  let h=`<div class="qhead"><span>Питання ${Q.i+1} з ${n}</span><span>${Q.score} ${balWord(Q.score)}</span></div><div class="qprog"><i style="width:${Q.i/n*100}%"></i></div>`;
  if(Q.exam)h+=`<div class="eyebrow" style="margin-bottom:6px">${esc(byId[it.tid].short)}</div>`;
  h+=voiceBar()+`<div class="qtext">${esc(it.text)}</div><div class="opts">`;
  it.opts.forEach((o,k)=>{let c="";if(Q.picked!==null){if(Q.exam)c=k===Q.picked?"sel":"dim";else if(o.ok)c="right";else if(k===Q.picked)c="wrong";else c="dim"}
    h+=`<button class="opt ${c}" data-k="${k}" ${Q.picked!==null?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o.o)}</span></button>`});
  h+=`</div>`;
  if(Q.picked!==null&&!Q.exam){
    const ok=it.opts[Q.picked].ok;
    h+=`<div class="verdict ${ok?"ok":"no"}"><b>${ok?"Правильно. +1 бал":"Неправильно"}</b>${ok?"":`Правильна відповідь: ${esc(it.opts.find(o=>o.ok).o)}. `}${esc(it.ex)}</div>`;
    h+=`<div class="qnext"><button class="btn fx p" id="qNext">${Q.i+1<n?"Далі":"Результат"} →</button></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const nx=$("#qNext");if(nx){nx.onclick=nextQ;nx.focus({preventScroll:true})}
  bindVoice();
  if(!noVoice&&qvOn()){if(Q.picked===null)qReadQuestion();else if(!Q.exam)qReadVerdict();}
}
/* ---------- озвучка тестів ---------- */
const qa=new Audio();qa.preload="auto";let QSEQ=[],QSEQi=0,QSEQid=0;
function qvOn(){return store.get("qvoice",true)&&!!DATA.qa}
function qStop(){QSEQ=[];QSEQid++;try{qa.pause()}catch(e){}}
function qPlay(list){qStop();if(!list.length)return;const my=++QSEQid;QSEQ=list.filter(Boolean);QSEQi=0;
  const next=()=>{if(my!==QSEQid||QSEQi>=QSEQ.length)return;qa.src="audio/"+QSEQ[QSEQi++];qa.playbackRate=store.get("rate",1);qa.play().catch(()=>{})};
  qa.onended=()=>{if(my===QSEQid)setTimeout(next,180)};next();}
function qReadQuestion(){const it=Q&&Q.items[Q.i];if(!it||!it.clip)return;const L=DATA.qa.letters;
  const seq=[it.clip.q];it.opts.forEach((o,j)=>{seq.push(L[j],it.clip.o[o.k])});qPlay(seq);}
function qReadVerdict(){const it=Q&&Q.items[Q.i];if(!it||!it.clip||Q.picked===null)return;const ok=it.opts[Q.picked].ok;
  const right=it.opts.find(o=>o.ok);qPlay(ok?[DATA.qa.right,it.clip.e]:[DATA.qa.wrong,it.clip.o[right.k],it.clip.e]);}
function voiceBar(){if(!DATA.qa)return"";const on=qvOn();return `<div class="qvoice"><button class="btn fx sm" id="qvToggle" aria-pressed="${on}">${on?"🔊 Озвучка увімкнена":"🔇 Озвучка вимкнена"}</button>${Q.items[Q.i]&&Q.items[Q.i].clip?`<button class="btn fx sm" id="qvReplay">▶ Прослухати ще раз</button>`:""}</div>`}
function bindVoice(){const t=$("#qvToggle");if(t)t.onclick=()=>{store.set("qvoice",!qvOn());if(!qvOn())qStop();renderQ(true)};
  const r=$("#qvReplay");if(r)r.onclick=()=>Q.picked===null||Q.exam?qReadQuestion():qReadVerdict();}
function balWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"бал";if(a>=2&&a<=4&&(b<12||b>14))return"бали";return"балів"}
function pick(k){if(Q.picked!==null)return;qStop();Q.picked=k;const it=Q.items[Q.i];if(it.opts[k].ok)Q.score++;else Q.wrong.push(it);renderQ();
  if(Q.exam){setTimeout(()=>{if(Q&&Q.picked===k&&Q.items[Q.i]===it)nextQ()},650)}}
function nextQ(){qStop();Q.picked=null;Q.i++;if(Q.i>=Q.items.length)renderResult();else{renderQ();const qt=document.querySelector(".quiz");if(qt&&qt.getBoundingClientRect().top<0)qt.scrollIntoView()}}
function gradeOf(p){return p>=90?"Відмінно":p>=80?"Добре":p>=70?"Задовільно":"Незадовільно"}
function renderResult(){
  qStop();const n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  if(Q.save){const b=best(Q.save);if(!b||s/n>b.s/b.n)store.set("best_"+Q.save,{s,n,pct:p});}
  if(Q.exam){const prev=store.get("exam",null);if(!prev||p>prev.pct)store.set("exam",{pct:p,s,n})}
  const C=2*Math.PI*74,col=p>=PASS?"var(--acc)":p>=70?"var(--amb)":"var(--bad)";
  const passed=Q.exam?p>=70:p>=PASS;stopReward();

  <div class="grade">${gradeOf(p)}</div><p>${p>=PASS?(Q.exam?"Матеріал засвоєно впевнено.":"Заняття засвоєно. Можна переходити до наступного."):`Для засвоєння потрібно ${PASS}%. Перегляньте помилки й спробуйте ще раз.`}</p><div class="cta">`;
  if(Q.wrong.length)h+=`<button class="btn fx p" id="rWrong">Повторити помилки (${Q.wrong.length})</button>`;
  h+=`<button class="btn fx" id="rAgain">Пройти ще раз</button>`;
  if(Q.save){const nx=T[T.indexOf(byId[Q.save])+1];if(nx&&p>=PASS)h+=`<button class="btn fx p" data-go="#${nx.id}">Наступне заняття →</button>`;else if(p<PASS)h+=`<button class="btn fx" data-go="#${Q.save}">Перечитати лекцію</button>`;else h+=`<button class="btn fx" data-go="#">До занять</button>`}
  else h+=`<button class="btn fx" data-go="#">До занять</button>`;
  h+=`</div>`;
  if(Q.exam){const agg={};Q.items.forEach(it=>{const a=agg[it.tid]||(agg[it.tid]={n:0,w:0});a.n++});Q.wrong.forEach(it=>agg[it.tid].w++);
    h+=`<div class="bytopic"><h3 style="font-size:18px;margin-bottom:6px">За заняттями</h3>${Object.entries(agg).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n).map(([id,a])=>`<div class="bt"><span>${esc(byId[id].short)}</span><span style="color:${a.w?"var(--bad)":"var(--ok)"}">${a.n-a.w}/${a.n}</span></div>`).join("")}</div>`}
  if(Q.wrong.length){h+=`<div class="mist"><h3>Розбір помилок</h3>${Q.wrong.map(it=>`<div class="mi">${Q.exam?`<div class="tp">${esc(byId[it.tid].short)}</div>`:""}<b>${esc(it.text)}</b><div class="ans">✓ ${esc(it.opts.find(o=>o.ok).o)}</div><div class="ex">${esc(it.ex)}</div></div>`).join("")}</div>`}
  h+=`</div>`;
  $("#quiz").innerHTML=h;bindGo();{const y=$("#quiz").getBoundingClientRect().top+scrollY-70;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}
  if(passed)rewardPass();else rewardFail();
  const cfg={title:Q.title,save:Q.save,exam:Q.exam};const wrong=Q.wrong.map(it=>({q:it.q,tid:it.tid,i:it.i}));const all=Q.all||Q.items.map(it=>({q:it.q,tid:it.tid,i:it.i}));
  const rw=$("#rWrong");if(rw)rw.onclick=()=>startQuiz({...cfg,save:null,items:wrong,exam:false});
  $("#rAgain").onclick=()=>Q.exam?renderExamStart(true):startQuiz({...cfg,items:all});
}

/* ---------- exam ---------- */
function renderExamStart(direct){
  S={view:"exam"};hidePlayer();
  const pool=[];T.forEach(t=>t.test.forEach((q,i)=>pool.push({q,tid:t.id,i})));
  const N=Math.min(30,pool.length);setHead("Підсумковий тест",N+" питань з усіх занять");
  const per=Math.max(1,Math.floor(N/T.length/2));
  let pickd=[];T.forEach(t=>{pickd.push(...shuffle(pool.filter(p=>p.tid===t.id)).slice(0,per))});
  const rest=shuffle(pool.filter(p=>!pickd.includes(p)));pickd=pickd.concat(rest.slice(0,Math.max(0,N-pickd.length)));
  if(!direct){
    $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Теоретична частина іспиту</span><h1>Підсумковий тест</h1><p>${N} випадкових питань з усіх ${T.length} відкритих занять. Підказки й пояснення — після завершення. Оцінка за Програмою курсу: 90% — відмінно, 80% — добре, 70% — задовільно, менше 70% — незадовільно.</p></div>
    <div class="cta" style="margin-top:22px"><button class="btn fx p" id="exGo">${icon("test")} Почати тест</button><button class="btn fx" data-go="#">До занять</button></div></div>`;
    bindGo();$("#exGo").onclick=()=>renderExamStart(true);return;
  }
  $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Підсумковий тест</span><h1>${N} питань</h1></div><div id="quiz" class="quiz"></div></div>`;
  startQuiz({title:"Тест",items:pickd,save:null,exam:true});Q.all=pickd;
}

function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}

async function saveFile(blob,name,desc,mime,ext){
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:desc,accept:{[mime]:["."+ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();return "saved"}
    catch(e){if(e&&e.name==="AbortError")return "cancel"}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return "saved";
}
async function busy(btn,label,fn){
  const t0=btn.textContent;btn.disabled=true;btn.textContent=label;
  try{const r=await fn();btn.textContent=r==="cancel"?t0:"Збережено ✓";if(r!=="cancel")setTimeout(()=>btn.textContent=t0,2500)}
  catch(e){console.error(e);btn.textContent="Не вдалося зберегти";setTimeout(()=>btn.textContent=t0,4000)}
  finally{btn.disabled=false}
}

function fmt2(x){return x.toFixed(2).replace(".",",")}
function calcSheet(type,st){
  const G=DATA.sheets[type];let total=0,rated=0,sum=0,starZero=[],plainZero=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{total++;const v=st.v[gi+"_"+ii];if(v===undefined)return;rated++;sum+=v;if(v===0){if(it.s)starZero.push(it.t);else plainZero++}}));
  const avg=rated?Math.round(sum/rated*100)/100:null;const reasons=[];
  if(starZero.length)reasons.push("0 у критичному пункті: "+starZero.join(", "));
  if(plainZero>5)reasons.push(`нулі у ${plainZero} звичайних пунктах (допустимо не більше 5)`);
  if(st.stop)reasons.push("заняття призупинено через порушення заходів безпеки");
  if(st.edip)reasons.push("порушено техніку EDIP");
  let verdict;if(reasons.length)verdict="не виконано";else if(avg===null)verdict="не оцінено";else if(rated<total)verdict=avg>=THR?"попередньо виконано":"попередньо не виконано";else verdict=avg>=THR?"виконано":"не виконано";
  return {total,rated,sum,avg,reasons,verdict,plainZero,starZero};
}
function paintSum(type,st){
  const r=calcSheet(type,st);const fail=r.reasons.length>0||(r.avg!==null&&r.avg<THR);
  const cls=r.avg===null&&!r.reasons.length?"wait":(fail?"no":"ok");
  const label=r.reasons.length?"Не виконано":r.avg===null?"Не оцінено":(r.rated<r.total?(r.avg>=THR?"Попередньо: виконано":"Попередньо: не виконано"):(r.avg>=THR?"Виконано":"Не виконано"));
  $("#sumbar").innerHTML=`<div class="in"><div class="avg">${r.avg===null?"—":fmt2(r.avg)}</div><div class="meta">середній бал · поріг 2,48<br>оцінено ${r.rated} з ${r.total}${r.rated<r.total?` · залишилось ${r.total-r.rated}`:""}</div><span class="vchip ${cls}">${label}</span></div>${r.reasons.length?`<div class="reasons">${r.reasons.map(esc).join(" · ")}</div>`:""}`;
  const fin=$("#final");if(!fin)return;const G=DATA.sheets[type];const weak=[];let n=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{n++;const v=st.v[gi+"_"+ii];if(v===0||v===1)weak.push([n,it.t,v,it.s])}));weak.sort((a,b)=>a[2]-b[2]);
  let why;
  if(r.avg===null&&!r.reasons.length)why="Ще не поставлено жодного балу. Почніть з першого пункту — підсумок з’явиться тут.";
  else if(r.reasons.length)why=`Заняття <b>не зараховано</b>, навіть якщо середній бал високий. Причина: ${r.reasons.map(esc).join("; ")}.`;
  else{const ok=r.avg>=THR;why=`Сума балів ${r.sum} ÷ оцінених пунктів ${r.rated} = <b>${fmt2(r.avg)}</b>. ${ok?"Це не менше порогу 2,48 — <b>виконано</b>.":"Це менше порогу 2,48 — <b>не виконано</b>."}`+(r.rated<r.total?` Оцінено не всі пункти (залишилось ${r.total-r.rated}), тому рішення попереднє.`:"")}
  fin.innerHTML=`<h2>Підсумок і розбір</h2><p>${why}</p>${weak.length?`<p><b>Над чим працювати</b> — пункти з оцінкою 0 і 1, з них почніть розбір (АПД):</p><ul>${weak.map(([n,t,v,st])=>`<li><b>${v}</b> — ${n}. ${esc(t)}${st?' <span style="color:var(--amb)">★</span>':""}</li>`).join("")}</ul>`:(r.rated?"<p>Пунктів з оцінкою 0 або 1 немає.</p>":"")}<p style="color:var(--muted);font-size:14px">У відомість записують бал і словесну оцінку, наприклад: «2,61 (виконано)».</p>`;
}
