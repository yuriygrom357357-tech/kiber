:root{
  --bg:#10130D;--bg2:#151A11;--paper:#1B2116;--soft:#222A1C;--line:#2F3926;--line2:#3E4A32;
  --ink:#ECE7D6;--muted:#A7A992;--dim:#7D806B;
  --acc:#F2A33A;--acc-soft:rgba(242,163,58,.12);--onacc:#14180F;--glow:0 0 0 1px rgba(242,163,58,.35),0 6px 22px rgba(242,163,58,.18);
  --amb:#F2A33A;--hl:rgba(242,163,58,.10);--hl-bar:#F2A33A;--blue:#6FB3E6;
  --ok:#8FCB6A;--okbg:rgba(143,203,106,.12);--bad:#E5573D;--badbg:rgba(229,87,61,.12);
  --shadow:none;--r:10px;
  --f-display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --f-head:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17.5px;line-height:1.58;min-height:100vh;
  background-image:linear-gradient(rgba(236,231,214,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(236,231,214,.03) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--f-head)}
/* --- інтерактив: легке підсвічування й анімація при наведенні --- */
.fx{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s,background-color .18s}
.fx:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(242,163,58,.16),transparent);transform:skewX(-18deg);opacity:0;transition:none}
@media (hover:hover){
 .fx:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc);box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(242,163,58,.22)}
 .fx:hover:not(:disabled):after{opacity:1;left:120%;transition:left .65s ease,opacity .2s}
}
.fx:active:not(:disabled){transform:translateY(0) scale(.985)}
@media (prefers-reduced-motion:reduce){.fx,.fx:after{transition:none!important}.fx:hover{transform:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.mark{width:36px;height:36px;flex:none;display:grid;place-items:center}
.mark svg{width:36px;height:36px}
.brand b{display:block;font-family:var(--f-head);font-size:17px;font-weight:700;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.dl{position:relative}
.ib.dl .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--amb);display:none}
.ib.dl.need .dot{display:block}
.ib.dl.ok{color:var(--ok)}

/* cards / generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.off{margin:18px 0 0;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.off .oi{width:52px;height:52px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.off .oi svg{width:28px;height:28px}
.off .ot{flex:1;min-width:220px}
.off .ot b{display:block;font-size:18px;line-height:1.3}
.off .ot span{font-size:14px;color:var(--muted)}
.off .oa{display:flex;gap:8px;flex-wrap:wrap}
.off.done .oi{background:var(--okbg);color:var(--ok)}
.pbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* modal */
.mback{position:fixed;inset:0;z-index:50;background:rgba(2,6,12,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadeIn .15s}
@media (min-width:640px){.mback{align-items:center}}
.modal{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);max-height:90vh;overflow:auto;animation:up .2s}
.modal h2{font-size:22px;line-height:1.25;margin-bottom:6px}
.modal p{color:var(--muted);font-size:15px}
.modal .qr{background:#fff;border-radius:16px;padding:16px;margin:16px auto;width:min(300px,100%)}
.modal .qr svg{width:100%;height:auto;display:block}
.modal .url{font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:clamp(12px,3.4vw,15px)}
.modal .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .mrow .btn{flex:1;min-width:140px}
.modal ol{padding-left:22px;margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.modal .x{float:right;margin:-8px -8px 0 0}
@keyframes fadeIn{from{opacity:0}}
@keyframes up{from{transform:translateY(20px);opacity:.5}}
@keyframes blink{50%{opacity:0}}
/* home */
.hero{padding:30px 0 8px}
.hero .eyebrow:before{content:"";display:inline-block;width:22px;height:2px;background:var(--acc);vertical-align:middle;margin-right:10px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,12vw,92px);line-height:.95;letter-spacing:.02em;margin:12px 0 10px;text-transform:uppercase}
.hero h1 .cur{color:var(--acc)}
.hero p{color:var(--muted);max-width:620px}
.hero .lead{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:-2px 0 10px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.stat{padding:14px 16px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--acc)}
.stat b{display:block;font-family:var(--f-head);font-size:28px;font-weight:700;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.btn{height:48px;padding:0 20px;border-radius:8px;font-family:var(--f-head);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:0 3px 0 #a86a1c}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{height:38px;padding:0 14px;font-size:15px;border-radius:10px}
.btn svg{width:18px;height:18px}
.note{margin-top:14px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--ink)}
.mod{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
.mod h2{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mod:after{content:"";flex:1;height:1px;background:var(--line)}
.blockh{margin:36px 0 4px;font-family:var(--f-head);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-left:4px solid var(--acc);padding-left:12px}
.blockh small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;font-weight:400;color:var(--dim);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.row:hover:not(:disabled) .num{background:var(--acc);color:var(--onacc)}
.row .go{flex:none;color:var(--dim);font-size:22px;transition:transform .18s,color .18s}
.row:hover:not(:disabled) .go{transform:translateX(4px);color:var(--acc)}
.num{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .num{background:var(--acc);color:var(--onacc)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--f-head);font-size:18.5px;font-weight:600;line-height:1.22}
.row .t span{font-size:14px;color:var(--muted)}
.row .t .code{font-family:var(--f-mono);font-size:11px;color:var(--acc);letter-spacing:.08em}
.row.soon{opacity:.55;cursor:default;box-shadow:none;background:transparent;padding:8px 14px;border-style:dashed}
.row.soon .num{width:28px;height:28px;background:transparent}
.row.soon .t{display:flex;gap:10px;align-items:baseline}
.row.soon .t .code{flex:none;min-width:92px}
.row.soon .t b{font-weight:500;font-size:16px}
.list .row.soon+.row.soon{margin-top:-4px}
.row.tool .num{background:var(--acc-soft);color:var(--acc)}
.row.tool .num svg{width:20px;height:20px}
.badge{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--acc-soft);color:var(--acc)}
.badge.low{background:rgba(245,184,61,.14);color:var(--amb)}
.exam{margin-top:30px;border:1px solid var(--line2);border-top:3px solid var(--acc);background:var(--paper);border-radius:10px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.exam div{flex:1;min-width:220px}
.exam b{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;display:block}
.exam span{color:var(--muted);font-size:15px}
.foot{margin:36px 0 40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* topic */
.thead{padding:26px 0 6px}
.thead .eyebrow{display:block;margin-bottom:6px}
.thead h1{font-size:clamp(26px,5vw,38px);line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.thead p{color:var(--muted);font-size:15px;margin-top:6px}
.pass{margin-top:16px;padding:16px 18px}
.pass .goal{font-weight:600;line-height:1.45}
.pass .goal small,.pass dt{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.pass details{margin-top:10px}
.pass summary{cursor:pointer;color:var(--muted);font-size:15px;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.pass summary::-webkit-details-marker{display:none}
.pass summary:before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--acc);font-weight:800}
.pass details[open] summary:before{content:"–"}
.pass dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:12px;font-size:15px}
.pass dl div.w{grid-column:1/-1}
.pass dd ol{padding-left:20px}
@media (max-width:560px){.pass dl{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tab{height:40px;padding:0 18px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--acc);color:var(--onacc)}
.lec{padding-bottom:150px}
.sec{margin-top:30px}
.sec h2{font-size:24px;line-height:1.2;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px;scroll-margin-top:90px}
.blk{border-radius:10px;padding:6px 12px;margin:0 -12px 6px;transition:background .25s;cursor:pointer;scroll-margin-top:110px;position:relative}
.blk:hover{background:var(--soft)}
.blk.now{background:var(--hl)}
.blk.now:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--hl-bar)}
.sec ul{list-style:none;margin:2px 0 8px}
.sec li.blk{padding-left:34px}
.sec li.blk:after{content:"";position:absolute;left:14px;top:.85em;width:8px;height:8px;background:var(--acc)}
.sec li.blk.now:before{left:0}
.callout{background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:14px 16px;margin:8px 0 10px;font-weight:500}
.callout small{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.callout.warn{background:#231A12;border-color:#4A3A1E;border-left-color:var(--bad)}
.callout.warn small{color:var(--bad)}
.keys{margin-top:40px;padding:20px 22px}
.keys{border-top:3px solid var(--acc)}
.keys h2{font-size:21px;margin-bottom:10px;text-transform:uppercase}
.keys ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.keys .btn{margin-top:16px}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.pl{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:10px 12px 12px}
.pl .bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;cursor:pointer;margin:2px 4px 8px}
.pl .bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px}
.pl .ctr{display:flex;align-items:center;gap:6px}
.play{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none;transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play svg{width:24px;height:24px}
.pl .info{flex:1;min-width:0;padding:0 6px}
.pl .info b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .info span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spd{height:36px;min-width:52px;padding:0 10px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* test */
.quiz{padding:10px 0 60px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.qprog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:22px}
.qprog i{display:block;height:100%;background:var(--acc)}
.qtext{font-family:var(--f-head);font-size:clamp(22px,4vw,28px);line-height:1.25;font-weight:600;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:13px 14px;line-height:1.4;transition:border-color .12s}
.opt{transition:border-color .15s,transform .15s,background-color .15s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(3px);background:var(--soft)}
.opt:hover:not(:disabled) .k{background:var(--acc);color:var(--onacc)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#04130C}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#1A0606}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);color:var(--onacc)}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:4px solid;line-height:1.45}
.verdict.ok{border-color:var(--ok);background:var(--okbg)}
.verdict.no{border-color:var(--bad);background:var(--badbg)}
.verdict b{display:block;margin-bottom:2px}
.qnext{margin-top:18px;display:flex;justify-content:flex-end}
.qvoice{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.res{text-align:center;padding:30px 0 10px}
.ring{width:150px;height:150px;margin:6px auto 12px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-family:var(--f-head);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .v span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grade{font-family:var(--f-head);font-size:26px;font-weight:700;text-transform:uppercase}
.res p{color:var(--muted);margin-top:4px}
.res .cta{justify-content:center}
.mist{margin-top:30px;text-align:left}
.mist h3{font-size:18px;margin-bottom:10px}
.mi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.mi b{display:block;line-height:1.35}
.mi .ans{color:var(--ok);font-weight:600;margin-top:6px}
.mi .ex{color:var(--muted);font-size:15px;margin-top:4px}
.mi .tp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.bytopic{margin-top:22px;text-align:left}
.bt{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bt span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* нагорода: патрон / віджимання */
.rw-card{max-width:440px;margin:0 auto 10px;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.rw-card svg{display:block;width:100%;height:auto}
.rw-verdict{font-family:var(--f-head);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:6px 0 4px}
.rw-verdict.ok{color:var(--acc)}.rw-verdict.no{color:var(--bad)}
/* оціночний лист */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.seg button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;color:var(--muted)}
.seg button{transition:border-color .15s,color .15s,transform .15s}
.seg button:hover{border-color:var(--acc);color:var(--ink);transform:translateY(-1px)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.how{margin:14px 0 4px;padding:16px 18px}
.how summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.how summary::-webkit-details-marker{display:none}
.how summary .q{width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.how summary .ch{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
@media (max-width:560px){.how summary .ch{display:none}}
.how .hb{margin-top:12px;font-size:16px;display:flex;flex-direction:column;gap:12px}
.how .scale{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.how .scale b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:16px}
.how .scale span{padding-top:5px}
.how .rule{border-left:3px solid var(--bad);padding:2px 0 2px 12px}
.how .rule ul{padding-left:20px;margin-top:4px}
.how .ex{font-size:15px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.fields label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.fields input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.grp{margin-top:26px}
.grp h3{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.crit{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:8px}
.crit .ct{flex:1;min-width:0}
.crit .ct b{display:block;line-height:1.3}
.crit .ct b .st{color:var(--amb);font-size:13px;font-weight:700;margin-left:6px;white-space:nowrap}
.crit .ct span{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.crit.zero{border-color:var(--bad)}
.crit.star.zero{background:var(--badbg)}
.sc{display:flex;gap:4px;flex:none}
.sc button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line2);background:var(--soft);font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);transition:transform .12s,border-color .12s,color .12s}
.sc button:hover{transform:translateY(-2px);border-color:var(--acc);color:var(--ink)}
.sc button.on[data-v="3"]{background:var(--ok);border-color:var(--ok);color:#04130C}
.sc button.on[data-v="2"]{background:var(--blue);border-color:var(--blue);color:#0B1620}
.sc button.on[data-v="1"]{background:var(--amb);border-color:var(--amb);color:#1A1203}
.sc button.on[data-v="0"]{background:var(--bad);border-color:var(--bad);color:#1A0606}
@media (max-width:560px){.crit{flex-direction:column}.sc{align-self:stretch}.sc button{flex:1;height:44px}}
.flags{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.flag input{width:22px;height:22px;accent-color:var(--bad);flex:none}
.flag span{font-weight:600}
.flag small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.sumbar{position:sticky;bottom:0;z-index:15;margin:24px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sumbar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sumbar .avg{font-family:var(--f-head);font-size:32px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
.sumbar .meta{flex:1;min-width:150px;font-size:14px;color:var(--muted);line-height:1.35}
.vchip{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 14px;border-radius:8px;font-size:16px;white-space:nowrap}
.vchip.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.vchip.no{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.vchip.wait{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.reasons{font-size:14px;color:var(--bad);margin-top:6px}
/* тренажери */
.tr{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.fld{padding:14px 16px}
.fld label{display:block;font-weight:700;margin-bottom:2px}
.fld .hint{font-size:14px;color:var(--muted);margin-bottom:8px}
.fld textarea{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:10px 12px;resize:vertical;line-height:1.45}
.chk{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.chk li{display:flex;gap:8px;align-items:flex-start}
.chk li i{flex:none;font-style:normal;font-weight:800;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;margin-top:1px}
.chk li.y i{background:var(--okbg);color:var(--ok)}
.chk li.n i{background:rgba(245,184,61,.15);color:var(--amb)}
.chk li.x i{background:var(--badbg);color:var(--bad)}
.scen{padding:16px 18px}
.scen h3{font-size:17px;margin:12px 0 6px}
.scen h3:first-child{margin-top:0}
.tl{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:10px}
.tl li b{font-family:var(--f-mono);color:var(--acc);font-size:14px;padding-top:1px}
.model{margin-top:10px;border-left:3px solid var(--ok);padding:6px 0 6px 12px;font-size:15px}
.model small{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.kp{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.kp input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}

@media (max-width:560px){
  body{font-size:17px}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:22px}
  .row{padding:12px;gap:12px}.num{width:34px;height:34px;font-size:13px}
  .hide-sm{display:none}
}


/* друк оціночного листа: A4, книжкова */
#printArea{display:none}
@page{size:A4 portrait;margin:10mm 10mm 12mm;@bottom-right{content:"Аркуш " counter(page) " з " counter(pages);font:8pt 'IBM Plex Sans',sans-serif;color:#555}}
@media print{
 :root{color-scheme:light!important}
 html,body{background:#fff!important;background-image:none!important;color:#000}
 main,header,.player{display:none!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block;font:9pt/1.3 'IBM Plex Sans',Arial,sans-serif;color:#000}
 #printArea .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
 #printArea .pk{font:8pt 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
 #printArea h1{font:700 15pt 'Fira Sans Condensed',Arial;text-transform:uppercase;margin:2px 0}
 #printArea .pt{font-size:10pt}
 #printArea .plogo .emb{--s:58px}
 #printArea .pfs{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:6px}
 #printArea .pf{display:flex;gap:6px;align-items:baseline;font-size:8.5pt}
 #printArea .pf span{white-space:nowrap;color:#333}
 #printArea .pf b{flex:1;border-bottom:1px solid #000;font-weight:600;min-height:14px;padding-left:4px}
 #printArea .pleg,#printArea .prule,#printArea .prs{font-size:8pt;margin:4px 0}
 #printArea table{width:100%;border-collapse:collapse}
 #printArea .pt1 th{background:#e6e6e6;border:1px solid #000;padding:3px;font-size:8.5pt}
 #printArea .pt1 td{border:1px solid #000;padding:1.5px 4px;vertical-align:top;line-height:1.2}
 #printArea .pt1 tr{break-inside:avoid}
 #printArea .pt1 thead{display:table-header-group}
 #printArea .pg td{background:#f0f0f0;font:700 8.5pt 'Fira Sans Condensed',Arial;text-transform:uppercase;letter-spacing:.04em}
 #printArea .pn{width:22px;text-align:center}
 #printArea .ps{width:24px;text-align:center;vertical-align:middle!important}
 #printArea .pd{font-size:7.2pt;color:#333;line-height:1.18}
 #printArea .pb{display:inline-block;width:11px;height:11px;border:1px solid #000;line-height:10px;font-size:9pt;font-weight:700;text-align:center;vertical-align:middle}
 #printArea .pfl{margin:6px 0;font-size:8.5pt}
 #printArea .pt2{margin-top:4px;break-inside:avoid}
 #printArea .pt2 td{border:1px solid #000;padding:4px 6px;font-size:9pt;width:25%}
 #printArea .psig{display:flex;justify-content:space-between;gap:20px;margin-top:12px;font-size:8.5pt;break-inside:avoid}
 #printArea .emb,#printArea .emb *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #printArea .pg td,#printArea th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* emblem + 3D word */
.emb{--s:104px;width:var(--s);height:var(--s);border-radius:50%;background:linear-gradient(#2F7FE0 50%,#FFD500 50%);display:grid;place-items:center;flex:none}
.emb>i{width:calc(var(--s)*.885);height:calc(var(--s)*.885);border-radius:50%;background:var(--bg);display:grid;place-items:center}
.emb>i>i{width:calc(var(--s)*.805);height:calc(var(--s)*.805);border-radius:50%;background:#1B2116;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center}
.emb svg{height:calc(var(--s)*.69);width:auto;fill:#ECE7D6;display:block}
.mark .emb{--s:38px}
.mark .emb>i>i{box-shadow:none}
.hero .brandrow{display:flex;align-items:center;gap:22px;margin:14px 0 14px}
.hero h1.kh{margin:0;flex:1;min-width:0;max-width:480px;line-height:0}
.kword{width:100%;height:auto;display:block;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.hero .brandrow{gap:14px}.hero .brandrow .emb{--s:74px}}
/* sheet guide */
.steps{counter-reset:st;display:grid;gap:10px;margin:16px 0 4px;padding:16px 18px}
.steps h2{font-family:var(--f-head);text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.steps ol{list-style:none;display:grid;gap:10px;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.45}
.steps li:before{counter-increment:st;content:counter(st);flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc);color:var(--onacc);font-weight:800;display:grid;place-items:center;font-family:var(--f-head)}
.steps .tip{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:10px}
.tdesc{font-size:14.5px;color:var(--muted);margin:8px 0 0}
.grp h3 .gp{color:var(--dim);letter-spacing:.04em}
.grp h3 .gp.done{color:var(--ok)}
.final{margin-top:18px;padding:16px 18px}
.final h2{font-family:var(--f-head);text-transform:uppercase;font-size:18px;letter-spacing:.03em;margin-bottom:6px}
.final p{font-size:15.5px;margin:6px 0}
.final ul{margin:6px 0 0 18px;font-size:15px}
.final li{margin:3px 0}
.final li b{font-variant-numeric:tabular-nums}
</style>

я вправ (SOP)", "Нові звання", "Розклад відпусток", "Меню їдальні"], "Майстер і наставник."], ["Що таке об’єднаний навчальний центр?", ["Центр з управлінням і щонайменше трьома навчальними центрами у підпорядкуванні", "Будь-який полігон", "Навчальний взвод", "Школа снайперів"], "Плюс інші частини на окремих штатах."], ["Скільки рівнів підготовки інструкторів передбачає Концепція?", ["Три: базовий, підвищений, академічний", "Два", "П’ять", "Один"], "КІБР — базовий рівень."], ["Яка мінімальна вислуга за контрактом для інструктора базового рівня?", ["5 років", "1 рік", "10 років", "Не вимагається"], "Плюс 2 роки на посадах рівня відділення."], ["Хто розробляє навчальні програми курсів і тести?", ["Інструктор академічного рівня", "Інструктор базового рівня", "Курсант", "Черговий по роті"], "Третій рівень підготовки."], ["Яка мета створення інституту інструкторів?", ["Укомплектувати навчальні центри висококваліфікованими інструкторами із сержантів і старшин", "Скоротити кількість занять", "Замінити всіх сержантів офіцерами", "Скасувати підготовку"], "На них лягає основне навантаження з підготовки."]]}, {"id": "b1m1t1z2", "code": "Б1 М1 Т1 З2", "theme": "Тема 1. Інструкторський склад в Збройних Силах України", "title": "Функціональні обов’язки інструктора", "short": "Обов’язки інструктора", "passport": {"goal": "Довести курсантам функціональні обов’язки інструктора навчального взводу та пояснити їх.", "time": "1 година (45 хв)", "method": "Інтерактивна лекція; аудиторія", "questions": ["Права та відповідальність інструктора взводу", "Обов’язки інструктора взводу; завдання інструктора, його роль у підготовці особового складу"], "assess": "Відповіді на запитання протягом і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "План проведення заняття «Обов’язки інструктора»; обов’язки за статутом; функціональні обов’язки за наказом командира частини; презентація"}, "sections": [{"h": "За що відповідає інструктор", "body": [["p", "Інструктор (старший інструктор) навчального взводу в мирний і воєнний час відповідає за:"], ["ul", ["якість проведення занять та ефективність навчання особового складу;", "навчання і виховання рядового і сержантського складу;", "військову дисципліну, охайний зовнішній вигляд, фізичну підготовку;", "правильне зберігання й експлуатацію озброєння, техніки та майна взводу;", "внутрішній порядок і правильне несення служби в добовому наряді."]], ["p", "Інструктор підпорядковується командиру навчального взводу, а з питань навчання — сержанту-інструктору роти, і є <b>прямим начальником</b> для особового складу, який проходить навчання."]]}, {"h": "Головні обов’язки на заняттях", "body": [["ul", ["досконало знати і вміло володіти озброєнням і технікою, на яких навчає;", "здійснювати навчально-виховну й методичну діяльність, <b>об’єктивно оцінювати</b> знання та вміння курсантів;", "знати керівні документи з бойової підготовки, безпосередньо проводити заняття, застосовувати методи навчання, забезпечувати повноту виконання програм;", "домагатися якісного засвоєння матеріалу, за потреби — індивідуальні заняття з окремими військовослужбовцями;", "проводити додаткові заняття й консультації з тими, хто не встигає;", "постійно підвищувати свій професійний рівень і майстерність."]], ["key", "Інструктор — зразок бездоганного виконання службового обов’язку, дисципліни й організованості."]]}, {"h": "Безпека і порядок", "body": [["ul", ["вживати заходів щодо запобігання травматизму та загибелі особового складу, <b>особисто доводити заходи безпеки перед кожним заняттям</b> і контролювати їх дотримання;", "після занять і стрільб перевіряти, щоб у підлеглих не залишилося боєприпасів, гранат, запалів, вибухових речовин;", "перевіряти наявність особового складу, комплектність озброєння, боєприпасів, імітаційних засобів після занять; організовувати чищення зброї;", "не рідше одного разу на тиждень оглядати озброєння і майно;", "контролювати дисципліну, носіння форми, розпорядок дня;", "негайно доповідати командиру взводу і сержанту-інструктору про надзвичайні події."]], ["warn", "Перевірка на відсутність боєприпасів після занять і стрільб — обов’язок інструктора, а не формальність."]]}, {"h": "Турбота про людей", "body": [["ul", ["знати звання, ПІБ, дату народження, ділові та морально-психологічні якості, родинний стан, успіхи й недоліки кожного курсанта;", "піклуватися про підлеглих, ставитися з повагою, ніколи не принижувати честі та гідності;", "організовувати заходи зі зміцнення здоров’я і фізичної тренованості, своєчасно направляти хворих до медпункту;", "підтримувати морально-психологічний стан і згуртованість колективу;", "проводити індивідуально-виховну роботу, виховувати в сержантів гордість за належність до сержантського корпусу."]]]}, {"h": "Сержант-інструктор і старший інструктор", "body": [["p", "За наказом командира частини розподіл такий:"], ["p", "<b>Сержант-інструктор</b> — безпосередній начальник для інструкторів взводу: організовує їх якісну підготовку до занять, контролює заняття, надає методичну допомогу, розробляє навчально-методичні матеріали, веде облік підготовки групи, у відсутність командира взводу виконує його обов’язки."], ["p", "<b>Старший інструктор (інструктор)</b> — безпосередній начальник для перемінного складу: проводить заняття, оцінює курсантів, доводить заходи безпеки, проводить індивідуальні заняття."], ["key", "Самостійна підготовка до наступних занять: ознайомитися з обов’язками командира взводу."]]}], "keys": ["Інструктор — прямий начальник для курсантів.", "Підпорядкування: командир взводу, з навчання — сержант-інструктор роти.", "Об’єктивно оцінювати знання і вміння курсантів.", "Особисто доводити заходи безпеки перед кожним заняттям.", "Після занять — перевірка на відсутність боєприпасів.", "Знати кожного курсанта і поважати його гідність."], "test": [["Кому підпорядковується інструктор навчального взводу?", ["Командиру навчального взводу, а з питань навчання — сержанту-інструктору роти", "Курсантам", "Лише командиру бригади", "Нікому"], "Так визначено обов’язками."], ["Для кого інструктор є прямим начальником?", ["Для особового складу, який проходить навчання", "Для командира роти", "Для командира взводу", "Ні для кого"], "А також для сержантського складу взводу."], ["За що відповідає інструктор взводу?", ["За якість занять та ефективність навчання особового складу", "Лише за чистоту казарми", "Лише за харчування", "За роботу полігона"], "А також виховання, дисципліну, зберігання озброєння."], ["Коли інструктор доводить заходи безпеки?", ["Особисто перед кожним заняттям", "Раз на місяць", "Лише перед іспитом", "Не доводить"], "І контролює їх дотримання."], ["Що перевіряють у підлеглих після занять і стрільб?", ["Чи не залишилося боєприпасів, гранат, запалів, вибухових речовин", "Стан взуття", "Наявність телефонів", "Нічого"], "Обов’язок інструктора."], ["Як часто інструктор оглядає озброєння і майно взводу?", ["Не рідше одного разу на тиждень", "Раз на рік", "Лише на інспекції", "Ніколи"], "І перевіряє їх наявність."], ["Як інструктор оцінює знання і вміння курсантів?", ["Об’єктивно", "Як подобається курсант", "Завжди «відмінно»", "Не оцінює"], "Об’єктивність — пряма вимога обов’язків."], ["Що робити з курсантами, які не засвоюють програму?", ["Проводити додаткові заняття і консультації", "Відрахувати одразу", "Ігнорувати", "Перевести в інший взвод без пояснень"], "Також індивідуальні заняття."], ["Про що інструктор негайно доповідає командиру взводу?", ["Про надзвичайні події у взводі", "Про погоду", "Про свої плани на вихідні", "Ні про що"], "А також сержанту-інструктору."], ["Хто виконує обов’язки командира навчального взводу в разі його відсутності?", ["Сержант-інструктор (інструктор) взводу", "Курсант-черговий", "Водій", "Кухар"], "Так визначено обов’язками."], ["Як інструктор має ставитися до підлеглих?", ["З повагою, ніколи не принижуючи честі й гідності", "Зверхньо", "Байдуже", "Лише криком"], "Піклуватися і знати їхні потреби."], ["Хто є безпосереднім начальником для інструкторів взводу?", ["Сержант-інструктор навчального взводу", "Курсант", "Черговий по КПП", "Начальник складу"], "За функціональними обов’язками згідно з наказом."], ["Хто розробляє навчально-методичні матеріали з предметів навчання у взводі?", ["Сержант-інструктор", "Курсанти", "Ніхто", "Водій"], "Своєчасно і якісно."], ["Яким має бути інструктор для курсантів?", ["Зразком бездоганного виконання службового обов’язку", "Другом без вимог", "Сторонім спостерігачем", "Суворим без пояснень"], "Особистий приклад."], ["Що з переліченого — обов’язок інструктора щодо здоров’я курсантів?", ["Своєчасно доповідати про захворювання і направляти до медпункту", "Лікувати самостійно", "Ігнорувати скарги", "Скасовувати фізпідготовку"], "А також зміцнювати здоров’я і тренованість."]]}, {"id": "b1m1t2z1", "code": "Б1 М1 Т2 З1", "theme": "Тема 2. Керівні документи, що регламентують діяльність інструкторського складу", "title": "Основні керівні документи з підготовки у ЗСУ", "short": "Керівні документи", "passport": {"goal": "Ознайомити курсантів з основними керівними документами з бойової підготовки у ЗСУ, що використовуються при плануванні та організації навчально-виховного процесу.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція; аудиторія", "questions": ["Доктрина з організації підготовки в ЗСУ", "Настанова з підготовки персоналу в ЗСУ", "Наказ МОУ № 170 від 10.04.2009 (розділ VI)", "Наказ ГШ ЗСУ № 207 від 23.04.2024 про підготовку інструкторів", "Наказ ГШ ЗСУ № 41 від 05.03.2012 про упорядкування діяльності НЦ"], "assess": "Відповіді на запитання протягом і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Презентація «Основні керівні документи з підготовки у ЗСУ»; ВКП 7-00(03).01; ВКП 7-00(01).01; накази МОУ № 170, ГШ ЗСУ № 207, № 41"}, "sections": [{"h": "Доктрина з організації підготовки", "body": [["p", "<b>Доктрина</b> — вид військової керівної публікації, що визначає фундаментальні принципи й положення, напрям розвитку, способи і процедури реалізації."], ["p", "<b>Доктрина з організації підготовки в ЗСУ (ВКП 7-00(03).01)</b> — ключовий керівний документ, що визначає єдині підходи до вишколу військ для набуття потрібних спроможностей. Ґрунтується на науковому підході, бойовому досвіді, формах і методах за стандартами НАТО, світовому досвіді."], ["ul", ["<b>принципи підготовки:</b> відповідність стратегії нацбезпеки, професійна спрямованість, науковість, систематичність і послідовність, комплексність, доступність, індивідуальний підхід, персональна відповідальність;", "<b>види:</b> оперативна, бойова, підготовка персоналу;", "<b>методи:</b> словесно-наочний, ситуативно-пізнавальний, практичний (репродуктивний), пошуковий (евристичний), творчий (дослідницький);", "<b>організація підготовки:</b> планування, забезпечення, керівництво."]], ["key", "Загальне керівництво підготовкою — Головнокомандувач ЗСУ через Генеральний штаб (Головне управління доктрин та підготовки)."]]}, {"h": "Оцінювання і сертифікація", "body": [["p", "Мета оцінювання — визначити готовність підрозділу реалізувати набуті спроможності в умовах бойових дій."], ["p", "<b>Сертифікація</b> — завершальна процедура успішного оцінювання: документальне підтвердження відповідності стандартам колективної підготовки ЗСУ або кваліфікаційним стандартам держав — членів НАТО."], ["p", "Форми індивідуальної підготовки: курсова підготовка, збори, заняття (лекції, семінари, практичні, групові вправи, тренування), стажування, самостійна підготовка, контрольні заходи. Колективної: тренування, навчання, воєнні ігри, тактичні й інструкторсько-методичні заняття, навчальні збори."]]}, {"h": "Настанова з підготовки персоналу", "body": [["p", "<b>Настанова з підготовки персоналу в ЗСУ (ВКП 7-00(01).01)</b> визначає єдині принципи формування професійних компетентностей військових. Вона ґрунтується на Доктрині й конкретизує складові системи підготовки, її організацію, планування і забезпечення."], ["ul", ["офіцери — у ВВНЗ (університети, академії, військові інститути); офіцери запасу — на військових кафедрах (2 роки, «військовий день» раз на тиждень, звання молодший лейтенант запасу);", "сержанти — за моделлю НАТО, багаторівнево: <b>базовий (L-1)</b> — командири відділень і головні сержанти взводів; <b>середній (L-2)</b> — головні сержанти рот; <b>підвищений (L-3)</b> — батальйонів; <b>вищий (L-4)</b> — бригад і вищих штабів;", "заклади підготовки сержантів: центри підготовки сержантського складу (ЦПСС), військові коледжі сержантського складу (ВКСС);", "рядовий склад — БЗВП і фахова підготовка;", "також державні службовці, підвищення кваліфікації і підготовка резервістів."]]]}, {"h": "Наказ МОУ № 170, розділ VI", "body": [["p", "Розділ VI Інструкції про організацію виконання Положення про проходження військової служби присвячений підготовці, перепідготовці та підвищенню кваліфікації."], ["ul", ["<b>рядовий склад:</b> БЗВП для тих, хто раніше не служив, — до 3 місяців у навчальних центрах; фахова підготовка — до 4 місяців у НЦ або спецкурси у частині до 1 місяця;", "<b>сержантський склад:</b> вищу посаду не отримати просто за вислугу — потрібен відповідний рівень підготовки;", "<b>офіцерський склад:</b> оперативний і стратегічний рівні, вища освіта, підвищення кваліфікації, перепідготовка, спеціалізація;", "навчання без відриву від служби — заочно/дистанційно; головні сержанти батальйонів зобов’язані здобувати бакалавра заочно."]]]}, {"h": "Накази ГШ № 207 і № 41", "body": [["p", "<b>Наказ ГШ ЗСУ № 207 від 23.04.2024</b> — основні принципи та вимоги до підготовки інструкторів. Мета розвитку інструкторського складу — забезпечити навчальні частини, ВВНЗ і підрозділи висококваліфікованими інструкторами, на яких лягає основне навантаження з підготовки. Кандидатами можуть бути сержанти, а також офіцери та рядові (зміни від 05.01.2026). У воєнний стан у бригадах можуть створюватися групи інструкторів за напрямками."], ["p", "<b>Наказ ГШ ЗСУ № 41 від 05.03.2012</b> «Про упорядкування діяльності НЦ» затверджує тимчасове положення про навчальний центр та інструкцію з підготовки в НЦ:"], ["ul", ["склад НЦ: управління, навчальні підрозділи, тилові підрозділи, полігон; особовий склад — постійний і змінний;", "на посади інструкторів — особи з бойовим досвідом і методичними навичками;", "підготовка — <b>6 навчальних днів на тиждень по 8 академічних годин</b>; залучати курсантів до робіт поза програмою заборонено;", "методична робота — методичні (педагогічні) ради та комісії;", "начальник НЦ може перерозподіляти години за темами — не більше 20% бюджету часу на предмет;", "після навчання — кваліфікаційна атестація та свідоцтво; чотирибальна шкала оцінювання."]], ["key", "П’ять документів заняття: Доктрина, Настанова, наказ МОУ № 170, накази ГШ № 207 і № 41."]]}], "keys": ["Доктрина ВКП 7-00(03).01 — єдині підходи до вишколу.", "Види підготовки: оперативна, бойова, підготовка персоналу.", "Організація підготовки: планування, забезпечення, керівництво.", "Настанова ВКП 7-00(01).01 конкретизує Доктрину.", "Рівні лідерства сержантів: базовий, середній, підвищений, вищий.", "Наказ № 41: 6 днів на тиждень по 8 год; перерозподіл до 20%."], "test": [["Що таке Доктрина з організації підготовки в ЗСУ?", ["Ключовий керівний документ, що визначає єдині підходи до вишколу військ", "Розклад занять навчального центру", "Курс стрільб", "Наказ про відпустки"], "ВКП 7-00(03).01."], ["На які види поділяється підготовка ЗСУ?", ["Оперативна, бойова, підготовка персоналу", "Денна, нічна, польова", "Теоретична, практична, фізична", "Індивідуальна, групова, масова"], "Питання з перевірки знань презентації."], ["З яких елементів складається організація підготовки?", ["Планування, забезпечення, керівництво", "Набір, навчання, випуск", "Лекція, практика, тест", "Підйом, заняття, відбій"], "Так визначає Доктрина."], ["Хто здійснює загальне керівництво підготовкою у ЗСУ?", ["Головнокомандувач через ГШ (Головне управління доктрин та підготовки)", "Командир взводу", "Міністерство освіти", "Начальник полігону"], "Питання з перевірки знань."], ["Що таке сертифікація?", ["Завершальна процедура успішного оцінювання з документальним підтвердженням відповідності стандартам", "Видача форми одягу", "Перевірка документів на КПП", "Зарахування на курс"], "Стандарти ЗСУ або НАТО."], ["На чому ґрунтується Настанова з підготовки персоналу?", ["На Доктрині з організації підготовки", "На розкладі занять", "На Курсі стрільб", "На побажаннях курсантів"], "Конкретизує й деталізує систему підготовки."], ["Які рівні лідерства передбачені для сержантського складу?", ["Базовий, середній, підвищений, вищий", "Перший і другий", "Молодший і старший", "Початковий і кінцевий"], "L-1 … L-4."], ["Для кого базовий рівень лідерства (L-1)?", ["Командири відділень і головні сержанти взводів", "Головні сержанти бригад", "Курсанти БЗВП", "Офіцери штабу"], "Фокус — управління малими групами."], ["Яка тривалість БЗВП за наказом МОУ № 170?", ["До 3 місяців", "До 1 тижня", "До 1 року", "Без обмежень"], "Для тих, хто раніше не служив."], ["Чи можна отримати вищу сержантську посаду лише за вислугу років?", ["Ні, потрібен відповідний рівень підготовки", "Так, автоматично", "Так, після 1 року", "Лише за рапортом"], "Розділ VI наказу № 170."], ["Що визначає наказ ГШ ЗСУ № 207 від 23.04.2024?", ["Основні принципи та вимоги до підготовки інструкторів", "Порядок видачі пайків", "Правила стройового огляду", "Розклад тренувань"], "І організацію розвитку інструкторського складу."], ["Скільки навчальних днів на тиждень за наказом № 41?", ["Шість, по вісім академічних годин", "П’ять, по шість годин", "Сім, по дванадцять годин", "Три, по чотири години"], "Залучати курсантів до сторонніх робіт заборонено."], ["На скільки начальник НЦ може перерозподіляти години за темами?", ["Не більше 20% бюджету часу на предмет", "До 50%", "До 100%", "Не може взагалі"], "З урахуванням нових зразків озброєння і способів бою."], ["Яку шкалу оцінювання передбачає наказ № 41?", ["Чотирибальну", "Стобальну", "Дванадцятибальну", "Без оцінок"], "Критерії для курсантів, підрозділів і центру."], ["Хто може бути кандидатом на курси інструкторів за змінами від 05.01.2026?", ["Сержанти, а також офіцери та рядові", "Лише офіцери", "Лише цивільні", "Лише генерали"], "Згідно зі змінами до наказу № 207."]]}, {"id": "b1m1t2z2", "code": "Б1 М1 Т2 З2", "theme": "Тема 2. Керівні документи, що регламентують діяльність інструкторського складу", "title": "Методичні рекомендації щодо проведення занять", "short": "Методичні рекомендації", "passport": {"goal": "Ознайомити військовослужбовців з методичними рекомендаціями щодо проведення занять з основних напрямків підготовки у ЗСУ.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція; аудиторія", "questions": ["Методичні рекомендації щодо проведення занять з основних напрямків підготовки", "Збірник керівних документів", "Додаткові методичні матеріали: вимоги до занять на КІБР, положення зброї, теми практичних занять"], "assess": "Відповіді на запитання протягом і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Методичні рекомендації курсу підготовки інструкторів базового рівня (197 ЦПСС, 2026); презентація; тест за темою"}, "sections": [{"h": "Принципи систематичності й послідовності", "body": [["p", "Підготовка організовується відповідно до наказів і директив МОУ, Головнокомандувача, ГШ та навчально-методичних матеріалів: <b>бойові статути, курс стрільб, збірники нормативів, керівництва і посібники, стандарти</b>."], ["p", "Командири всіх рівнів дотримуються принципів <b>систематичності і послідовності навчання</b>: «від простого — до складного», «від відомого — до невідомого». Реалізуються у двох напрямках — <b>структурному</b> і <b>методичному</b>."], ["ul", ["<b>структурний</b> — від індивідуальної підготовки до колективної: діям у складі групи вчать лише після завершення індивідуальної підготовки;", "<b>методичний</b> — формування і вдосконалення теоретичних знань і практичних дій шляхом послідовного ускладнення форм і методів навчання."]], ["key", "Учити військовослужбовця тому, що потрібно на війні, — в умовах, максимально наближених до бойових."]]}, {"h": "Алгоритм навчання дії", "body": [["ul", ["коротке пояснення;", "зразковий показ;", "відпрацювання по елементах — точність виконання прийому;", "тренування в цілому в повільному темпі — без оцінювання;", "тренування на контроль — норматив на оцінку."]], ["p", "<b>Щільність навчання</b> — усі задіяні курсанти виконують практичні дії, ніхто не стоїть без діла. <b>Свідомість, активність, самостійність</b> — умови, за яких курсанти прагнуть оволодіти матеріалом. Єдність напрямків — одночасно знання, навички, бойові якості й психологічна стійкість."], ["key", "При вихованні — демонструвати високі стандарти поведінки і підготовки особистим прикладом."]]}, {"h": "Вимоги до занять на КІБР", "body": [["p", "<b>Зброя.</b> Навички поводження зі зброєю зобов’язані бути на високому рівні; недоліки відпрацьовують завчасно; заходи безпеки дотримуються неухильно. Початок заняття, перевірка, інструктаж, заряджання і після заняття — положення <b>«патруль»</b>; перевірки й відпрацювання тактики — <b>High Ready</b> або <b>Low Ready</b>; бойовий наказ, макет, розмінування — зброя за спиною."], ["p", "<b>Спорядження.</b> Шолом, броня, РПС ідеально підлаштовані під завдання; незакріплені елементи маскуються."], ["p", "<b>Медицина.</b> Кожна навчальна група має стандартизований мінімум аптечок; місця для індивідуальних медзасобів визначають завчасно для всієї групи."], ["p", "<b>Комунікація і дисципліна.</b> Команди максимально наближені до бойових: короткі («СТІЙ», «КОНТАКТ НА», «РУХ»), мінімум радіовипромінювання, беззаперечне виконання команд керівника."], ["warn", "За систематичну непокору, зрив заняття чи порушення безпеки керівник (з дозволу оцінювача) може застосувати фізичні вправи або відсторонити курсанта від занять."]]}, {"h": "Положення зброї", "body": [["ul", ["<b>High Ready</b> — ствол вище горизонту (30–45°), палець поза спуском: контроль сектору, безпека побратимів; рух у приміщеннях, тактичне переміщення;", "<b>Slinged</b> — зброя на ремені за спиною чи збоку, на запобіжнику: вільні руки; марш у безпечних зонах, евакуація;", "<b>Patrol Carry</b> — на ремені перед тілом, ствол вниз 15–30°, обома руками: патрулювання, тривалі переходи, блок-пост;", "<b>Low Ready</b> — приклад у плечі, ствол вниз 25–35°: найуніверсальніше для контролю і швидкої готовності;", "<b>Combat Ready</b> (low/high, ~10°) — бойова готовність без завершеного прицілювання: очікування контакту, «червона зона»;", "<b>Workspace</b> — робоча зона перед грудьми для перевірки на розрядженість, заміни магазину, усунення затримок."]], ["key", "Кожне положення — компроміс між готовністю, контролем, безпекою і втомою."]]}, {"h": "Теми практичних занять", "body": [["p", "Рекомендації містять методику для шести тем: <b>реакція та протидія FPV</b>, <b>дії солдата на спостережному посту</b>, <b>наліт</b>, <b>дії відділення під час обстрілу</b>, <b>зустрічний бій</b>, <b>постконтакт</b>."], ["ul", ["FPV: у відділенні — спостерігач за повітрям; короткі команди («FPV! Низько, 2 години, заходить!»); висота: низько — до 10 м, посередині — 10–30 м, високо — від 30 м;", "розосередження — інтервал щонайменше 10 м у «двійці», на відкритій місцевості — від 20 м; рух — найбільша демаскуюча ознака;", "спостережний пост: непомітність понад усе, без вершин пагорбів і поодиноких орієнтирів; не брати листя ближче 20 м від СП; маскування 70/30 (штучне/природне);", "спостереження «змійкою» — справа наліво, від себе в глибину; огляд оптикою не довше 10 с; доповідь коротка: орієнтир, поправка, що виявлено;", "завжди мати можливість прихованого відходу з СП."]], ["key", "Рекомендації — за досвідом бойових дій; команди і сигнали можна адаптувати під досвід підрозділу."]]}], "keys": ["Принципи: систематичність і послідовність навчання.", "Два напрямки послідовності: структурний і методичний.", "Алгоритм: пояснення, показ, елементи, у цілому повільно, на контроль.", "Щільність: усі курсанти виконують практичні дії.", "Положення зброї: патруль на початку/в кінці, High/Low Ready на тактиці.", "Команди — короткі, наближені до бойових."], "test": [["Яких принципів мають дотримуватися командири для ефективної загальновійськової підготовки?", ["Систематичності і послідовності навчання", "Безперервності та інтенсивності", "Лише індивідуального підходу", "Максимального скорочення термінів"], "Питання з тесту за темою."], ["Назвіть два основні напрямки послідовності навчання.", ["Структурний і методичний", "Денний і нічний", "Теоретичний і фізичний", "Індивідуальний і масовий"], "Питання з тесту за темою."], ["Що передбачає структурний напрямок?", ["Від індивідуальної підготовки — до колективної", "Від колективної — до індивідуальної", "Лише групові заняття", "Лише лекції"], "Групові дії — після завершення індивідуальної підготовки."], ["Що передбачає методичний напрямок?", ["Формування теоретичних знань і практичних дій шляхом послідовного ускладнення форм і методів", "Скорочення кількості занять", "Лише перевірку нормативів", "Вивчення статутів напам’ять"], "Формулювання з тесту."], ["Який перший крок типового алгоритму навчання дії?", ["Коротке пояснення", "Тренування на контроль", "Норматив на оцінку", "Самостійна підготовка"], "Далі — зразковий показ."], ["Який останній крок алгоритму навчання дії?", ["Тренування на контроль — норматив на оцінку", "Коротке пояснення", "Показ", "Перерва"], "Перед ним — тренування в цілому в повільному темпі."], ["Що означає щільність навчання?", ["Усі задіяні курсанти виконують практичні дії", "Багато курсантів в одному класі", "Довга лекція без перерв", "Багато слайдів"], "Ніхто не простоює."], ["Яке положення зброї на початку і в кінці заняття?", ["Патруль", "Combat Ready", "High Ready", "Зброя напоготові на бойовому взводі"], "Вимоги до занять на КІБР."], ["Яке положення під час відпрацювання тактики?", ["High Ready або Low Ready", "Slinged", "Зброя на землі", "Зброя в пірамиді"], "Обома руками, стволом догори або донизу."], ["Де тримають зброю під час віддачі бойового наказу або роботи на макеті?", ["За спиною", "В руках з пальцем на спуску", "На землі", "У піраміді"], "Ствол угору або вниз залежно від ситуації."], ["Для чого положення Workspace?", ["Для маніпуляцій зі зброєю: перевірка на розрядженість, заміна магазину, усунення затримок", "Для маршу", "Для відпочинку", "Для стрільби з укриття"], "Контрольована зона перед грудьми."], ["Які команди використовують на заняттях?", ["Короткі, наближені до бойових: «СТІЙ», «КОНТАКТ НА», «РУХ»", "Довгі описові", "Лише жести", "Будь-які"], "Мінімум радіовипромінювання."], ["Що «низько» для FPV у командах спостерігача?", ["До 10 м", "10–30 м", "Від 30 м", "Від 100 м"], "Посередині — 10–30, високо — від 30 м."], ["Яка мінімальна дистанція між напарниками у «двійці» з загрозою FPV?", ["10 м (на відкритій місцевості — від 20 м)", "1 м", "3 м", "Не має значення"], "Розосередження — основа бойового порядку."], ["Чому не можна брати листя ближче 20 м від спостережного посту?", ["Місцевість «оголиться», і СП стане помітною плямою", "Листя заборонене статутом", "Щоб не забруднити форму", "Так зручніше"], "Маскування в ідеалі 70/30."], ["Скільки триває огляд оптикою зі спостережного посту?", ["Не довше 10 секунд, потім пауза", "Безперервно", "5 хвилин", "1 годину"], "Висока ймовірність бути поміченим."]]}, {"id": "b1m2t1z1", "code": "Б1 М2 Т1 З1", "theme": "Тема 1. Форми та методи навчання, методика викладання", "title": "Форми та методи навчання", "short": "Форми і методи", "passport": {"goal": "Довести до військовослужбовців форми та методи навчання особового складу, їх зміст та принципи застосування.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Методи навчання", "Форми навчання", "Принципи застосування форм і методів навчання"], "assess": "Усні запитання під час і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 1.1; презентація; тест за темою"}, "sections": [{"h": "Форма організації навчання", "body": [["p", "Форма організації навчання — це організаційна складова процесу навчання, сукупність умов, у яких воно відбувається. Форма залежить від мети і складу тих, хто навчається, і визначає структуру заняття, місце, тривалість відпрацювання навчальних питань, роботу керівника й курсантів, використання навчальної матеріально-технічної бази та озброєння."], ["p", "У педагогіці відомо понад тридцять форм організації навчання і більше десяти їх класифікацій. За формою організації це, наприклад, урок, семінар, екскурсія, домашнє завдання, електронне навчання. Для інструктора найважливіша класифікація — <b>за кількістю курсантів</b>, одночасно залучених до навчання."]]}, {"h": "П’ять форм за кількістю курсантів", "body": [["ul", ["<b>Навчання у великих групах</b> — від 15 до 30 і більше курсантів. Якщо інструктор не може приділити рівну увагу всім — це велика група. Використовується на лекціях, на інструктажі перед практичним заняттям і коли завдання виконується лише у складі взводу, наприклад стройова підготовка.", "<b>Навчання у малих групах</b> — від 4 до 12 курсантів (відділення), оптимально 7. Більша частина заняття — обмін знаннями, досвідом і думками між учасниками. Склад груп варто частіше змінювати, щоб не сформувалася група з низькою успішністю.", "<b>Навчання парами</b> — один виконує вправу, другий допомагає, консультує й перевіряє. Можна поєднати сильного курсанта зі слабшим. Часто використовується для засвоєння навичок.", "<b>Індивідуальне навчання</b> — увага інструктора спрямована на кожного окремо; усе, що курсант виконує сам: розбирання зброї, вправи стрільб. Кожен працює у своєму темпі й перевіряє свої сили.", "<b>Самостійна підготовка</b> — кожен військовослужбовець особисто відповідає за своє навчання: вивчає теоретичні питання, тренує прості навички. Ця форма допомагає правильно розподілити навчальний час."]], ["key", "Обираючи форму, інструктор враховує тему, рівень знань курсантів, свій рівень, час і місце заняття — і шукає варіант, що дасть найбільшу активність курсантів."]]}, {"h": "Що таке метод навчання", "body": [["p", "Метод навчання — спосіб досягнення цілі, послідовність кроків, кінцевим результатом яких є досягнення мети заняття. Інакше кажучи, це сукупність прийомів і способів, за допомогою яких передаються й засвоюються знання та формуються вміння і навички."], ["p", "Метод навчання виконує п’ять функцій: <b>освітню, розвивальну, виховну, стимулюючу і корекційну</b>."], ["p", "Спрощена класифікація ділить методи на три групи: <b>словесні, наочні і практичні</b>. До словесних належать лекція, розповідь, дискусія. До наочних — демонстрація (показ) та ілюстрація. До практичних — тренувальні вправи, змагання, завдання, робота в групах."], ["key", "Висока ефективність навчання неможлива без широкого використання наочних методів."]]}, {"h": "П’ять груп методів у ЗСУ", "body": [["p", "У Збройних Силах України використовують п’ять основних груп методів навчання:"], ["ul", ["<b>Словесно-наочний</b> — систематичне доведення матеріалу керівником і показ предметів, що вивчаються. Комунікація йде в одному напрямку — від інструктора до курсантів, тому метод підходить для передачі нових знань і дозволяє навчати одразу велику кількість людей.", "<b>Ситуативно-пізнавальний</b> — розгляд і обговорення реальних чи ймовірних бойових епізодів, досвіду управління військами, розвиток інформаційно-аналітичних навичок.", "<b>Практичний (репродуктивний)</b> — виконання дій за визначеним керівником алгоритмом для формування вмінь і навичок.", "<b>Пошуковий (евристичний)</b> — курсанти самостійно шукають інформацію чи оптимальний варіант дій за напрямом, який визначив керівник.", "<b>Творчий (дослідницький)</b> — самостійний пошук розв’язання проблемної ситуації з нестандартними підходами. Інструктор ставить завдання, а сам виступає радником і наглядачем за безпекою."]]]}, {"h": "Практичний метод: три фази", "body": [["p", "Практичний метод — систематичне поступове вивчення матеріалу. Він ідеально підходить для навичок, де високі вимоги до безпеки й швидкості, зокрема для роботи зі зброєю: усі дії мають бути відпрацьовані до автоматизму навіть у найскладніших умовах."], ["ul", ["<b>«Роби як я»</b> — інструктор виконує кожен елемент і пояснює його. За командою «Дивись!» курсанти спостерігають, за командою «Роби!» — повторюють. Застосовується, коли курсанти вперше працюють зі зброєю.", "<b>«Виконуй по кроках (командам)»</b> — дія ділиться на етапи, курсант не переходить далі, поки не виконає попередній чітко й без помилок. Підходить для складних і довгих маніпуляцій.", "<b>Самостійне виконання</b> — курсанти виконують усю дію від початку до кінця. Тим, хто відстає, інструктор допомагає індивідуально."]], ["p", "Фази не обов’язково застосовувати всі й на кожному занятті — їх можна і треба комбінувати."]]}, {"h": "Метод завдання, змагання, робота в групах", "body": [["p", "<b>Метод завдання</b> має таку послідовність:"], ["ul", ["ознайомлення із завданням: інструктор ставить завдання, час, дозволені засоби, правила виконання;", "прийняття рішення: курсанти вирішують, за потреби звертаючись по пораду;", "презентація рішення: один чи кілька курсантів пояснюють своє рішення, решта ставить запитання й оцінює;", "виконання завдання, якщо воно практичне;", "підведення підсумків: що виконано правильно, що ні, що ще можна було зробити."]], ["p", "Приклади: визначення азимутів і маршруту руху, складання картки вогню, рішення в тактичній ситуації на макеті. Курсант повинен не лише прийняти рішення, а й обґрунтувати його."], ["p", "<b>Змагання</b> добре підтримують практичні навички — стрільбу, орієнтування, розбирання зброї. Вони бувають самостійні (курсант покращує власний результат), індивідуальні (між курсантами) і групові (між парами, відділеннями, взводами)."], ["p", "<b>Робота в групах</b> — курсанти обмінюються знаннями й досвідом, обговорюють і обґрунтовують свої думки. Інструктор не знає наперед, куди приведе дискусія, тому повинен мати досвід проведення таких занять."]]}], "keys": ["Форма навчання — організація умов навчання; метод — спосіб досягнення цілі.", "За кількістю курсантів: великі групи, малі групи, пари, індивідуальне навчання, самостійна підготовка.", "Мала група — 4–12 курсантів, оптимально 7.", "Спрощена класифікація методів: словесні, наочні, практичні.", "У ЗСУ — п’ять груп методів: словесно-наочний, ситуативно-пізнавальний, практичний, пошуковий, творчий.", "Практичний метод: «роби як я», «по кроках», самостійне виконання."], "test": [["Які групи налічує спрощена класифікація методів навчання?", ["Словесні, наочні, практичні", "Словесні, ілюстраційні, прагматичні", "Усні, письмові, практичні", "Словесні, друковані, письмові"], "Спрощена класифікація: словесні, наочні й практичні методи."], ["До яких методів належить «ілюстрація»?", ["Наочних", "Демонстраційних", "Показових", "Оглядових"], "Демонстрація та ілюстрація — наочні методи."], ["Що таке метод навчання?", ["Спосіб досягнення цілі — послідовність кроків, що веде до мети заняття", "Місце проведення заняття", "Кількість курсантів у групі", "Розклад занять на тиждень"], "Метод — сукупність прийомів і способів передачі та засвоєння знань і навичок."], ["Що визначає форма організації навчання?", ["Сукупність умов: структуру заняття, місце, тривалість, роботу керівника й курсантів", "Лише тему заняття", "Тільки оцінку курсантів", "Порядок носіння форми одягу"], "Форма — організаційна складова процесу навчання."], ["Яка оптимальна кількість курсантів у малій групі?", ["7", "15", "2", "30"], "Мала група — 4–12 курсантів, оптимально 7."], ["Коли групу вважають великою?", ["Коли інструктор не може приділити рівну увагу всім курсантам", "Коли в ній більше 5 людей", "Лише на стрільбищі", "Коли заняття триває довше 2 годин"], "Велика група — 15–30 і більше курсантів."], ["Яка форма дозволяє поєднати сильного курсанта зі слабшим?", ["Навчання парами", "Велика група", "Самостійна підготовка", "Лекція"], "У парі один виконує, другий допомагає й перевіряє."], ["Які функції виконує метод навчання?", ["Освітню, розвивальну, виховну, стимулюючу, корекційну", "Тільки освітню", "Контрольну і каральну", "Організаційну і господарську"], "П’ять функцій методу навчання."], ["Скільки основних груп методів навчання використовують у ЗСУ?", ["П’ять", "Дві", "Три", "Десять"], "Словесно-наочний, ситуативно-пізнавальний, практичний, пошуковий, творчий."], ["Для чого найкраще підходить словесно-наочний метод?", ["Для передачі нових знань одразу великій кількості курсантів", "Для відпрацювання навичок до автоматизму", "Для змагань між відділеннями", "Для самостійного пошуку рішень"], "Комунікація йде від інструктора до курсантів — це передача нових знань."], ["Який метод передбачає розгляд реальних бойових епізодів і досвіду управління військами?", ["Ситуативно-пізнавальний", "Практичний", "Словесно-наочний", "Змагальний"], "Ситуативно-пізнавальний метод розвиває аналітичні навички на реальних прикладах."], ["Яка роль інструктора під час творчого (дослідницького) методу?", ["Ставить завдання і виступає радником та наглядачем за безпекою", "Сам виконує завдання замість курсантів", "Лише оголошує оцінки", "Не бере участі в занятті"], "Курсанти шукають рішення самі, інструктор радить і контролює безпеку."], ["Які фази має практичний метод?", ["«Роби як я», «по кроках (командам)», самостійне виконання", "Лекція, дискусія, тест", "Показ, відпочинок, контроль", "Вступ, перерва, висновок"], "Три фази від простого до складного."], ["Що є обов’язковим для курсанта під час методу завдання?", ["Не лише прийняти рішення, а й обґрунтувати його", "Виконати завдання мовчки", "Чекати підказки інструктора", "Працювати тільки в парі"], "Курсант має пояснити, чому прийняв саме таке рішення."], ["Які бувають змагання?", ["Самостійні, індивідуальні та між групами", "Тільки командні", "Лише письмові", "Лише між взводами"], "Курсант може змагатися з собою, з іншими і в складі групи."], ["Чому інструктор повинен мати досвід перед роботою в групах (дискусією)?", ["Бо не знає наперед, до яких результатів приведе дискусія", "Бо дискусія завжди триває 3 години", "Бо дискусію проводять лише офіцери", "Бо в дискусії немає правил"], "Дискусією треба вміти керувати."]]}, {"id": "b1m2t1z2", "code": "Б1 М2 Т1 З2", "theme": "Тема 1. Форми та методи навчання, методика викладання", "title": "Методика викладання EDIP", "short": "Методика EDIP", "passport": {"goal": "Довести курсантам порядок проведення занять за методикою EDIP (Explanation – Demonstration – Imitation – Practice).", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Суть та принципи методики EDIP", "Порядок практичного використання методики EDIP"], "assess": "Усні запитання під час і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 1.2; план-конспект; презентація"}, "sections": [{"h": "Що таке EDIP", "body": [["p", "EDIP — це сукупність дій інструктора та курсантів для набуття знань, умінь і навичок. Метод розробив у 1919 році Чарльз Р. Аллен, один із засновників професійної освіти в США. Це чотириетапний метод навчання, створений для швидкого засвоєння практичних завдань."], ["p", "Назва складається з перших літер чотирьох етапів: <b>Explain — пояснюй</b>, <b>Demonstrate — показуй</b>, <b>Imitate — повторюй</b>, <b>Practise — практикуй</b>. Вивчення кожної теми ділиться саме на ці чотири етапи."], ["p", "Методика вирізняється виключною ефективністю й успішно використовується в арміях США, Великої Британії, Канади, Польщі, Литви, Латвії, Естонії та інших країн. Особливо добре вона підходить для навчання практичним навичкам у технічній, військовій і професійній підготовці."], ["key", "EDIP = Пояснення → Демонстрація → Імітація → Практика. Чотири етапи, які ведуть курсанта від «чую» до «вмію сам»."]]}, {"h": "E — Explanation, пояснення", "body": [["p", "<b>Мета етапу</b> — дати теоретичне розуміння навички або завдання, яке потрібно опанувати."], ["p", "Пояснення — це дія, під час якої інструктор пояснює матеріал, зокрема відповідає на запитання курсантів. Пояснення застосовують і на теоретичних, і на практичних заняттях, якщо практичне заняття не є перевірочним чи контрольним."], ["ul", ["пояснює, що саме буде вивчатися;", "розповідає, чому це важливо;", "дає загальний огляд процесу або навички."]], ["p", "Наприклад: лекційні заняття з будь-якої дисципліни — від статутів до вогневої та тактичної підготовки."]]}, {"h": "D — Demonstration, демонстрація", "body": [["p", "<b>Мета етапу</b> — показати правильне виконання дії або навички."], ["p", "Демонстрація — це дія, під час якої інструктор показує курсантам ту чи іншу дію або наочні приклади. Її використовують і на теоретичних, і на практичних заняттях."], ["ul", ["показує процес на обладнанні або макеті;", "демонструє і повільно, і в нормальному темпі;", "коментує, вказуючи на критичні моменти."]], ["p", "Наприклад: на лекції з вогневої підготовки будову автомата АК-74 показують на зображеннях або на деталях, викладених перед курсантами. На тактичній підготовці переміщення на полі бою показують на схемах, відео або наочно — силами демогрупи."], ["warn", "Демонстрація має бути зразковою й безпомилковою. Курсант повторить саме те, що побачив, — разом із помилками інструктора."]]}, {"h": "I — Imitation, імітація", "body": [["p", "<b>Мета етапу</b> — курсант повторює дії за інструктором і отримує навичку шляхом копіювання та відпрацювання."], ["p", "Імітацію зазвичай використовують на практичних заняттях. Дії виконуються повільно і правильно — курсантів навчають саме правильності дій. Інструктор коментує й коригує кожного."], ["p", "Відпрацювання йде від простого до складного, у три фази:"], ["ul", ["<b>«Роби, як я»</b> — інструктор поступово виконує кожен елемент і пояснює його. За командою «Дивись!» курсанти спостерігають, за командою «Роби!» — повторюють. Ця фаза потрібна, коли матеріал має багато елементів або курсанти вперше працюють зі зброєю.", "<b>«Роби по кроках (за командами)»</b> — дія розбивається на етапи. Наприклад, перевірка зброї на розрядженість: «Перше: перевідник вогню в крайнє нижнє положення, затворну раму в крайнє заднє положення. Роби!». Курсант не переходить до наступного кроку, поки не виконує попередній чітко і без помилок.", "<b>«Роби в цілому»</b> — курсант виконує всю дію від початку до кінця. Тим, хто ще не готовий, інструктор приділяє увагу індивідуально, решті подає команду «Виконуйте самостійно!»."]], ["p", "Наприклад: курсанти розбирають автомат слідом за інструктором — інструктор від’єднує кришку ствольної коробки, курсанти роблять те саме."], ["key", "Імітація: задіяний 100% особового складу, інструктор контролює кожного й одразу виправляє помилки."]]}, {"h": "P — Practice, практика", "body": [["p", "<b>Мета етапу</b> — дати курсанту можливість закріпити навичку самостійною практикою."], ["p", "Практика — це дія, під час якої курсанти самостійно виконують дії в умовах, максимально наближених до реальних. Коментарі інструктора лунають лише тоді, коли це не перевірочне і не контрольне заняття. Спочатку дії виконують повільно, потім поступово нарощують темп."], ["ul", ["самостійно виконує навичку багаторазово;", "вдосконалює точність, швидкість, автоматизм;", "отримує зворотний зв’язок після виконання."]], ["p", "Наприклад: розбирання автомата на час, виконання тактичних прийомів самостійно або у складі підрозділу."]]}, {"h": "Як застосовувати EDIP на практиці", "body": [["p", "Інструктор поступово нарощує рівень знань і вмінь курсантів, не перевантажуючи їх інформацією. Переходячи до наступного елементу, він упевнений, що попередній матеріал засвоєно."], ["p", "Наприклад, під час вивчення автомата курсанти спочатку вивчають його призначення і ТТХ, потім будову та роботу частин і механізмів, далі вчаться розбирати і збирати — і лише після цього допускаються до стрільби."], ["p", "Для ефективного EDIP важливо правильно розподілити час заняття:"], ["ul", ["<b>вступна частина — 10%</b>, основна — <b>80%</b>, заключна — <b>10%</b>;", "в основній частині: пояснення — <b>10%</b>, демонстрація — <b>15%</b>, імітація — <b>25%</b>, практика — <b>не менше 50%</b>."]], ["key", "Максимум часу — на практику. Половина основної частини заняття і більше — це самостійне відпрацювання."], ["warn", "За оціночним листом порушення техніки EDIP під час проведення заняття означає оцінку «незадовільно» за все заняття."]]}, {"h": "Переваги методики", "body": [["ul", ["проста в застосуванні;", "забезпечує ефективне засвоєння нових навичок;", "легко масштабується на групу будь-якого розміру;", "добре підходить для процедурних дій — зброя, медицина, інженерна справа, тактичні прийоми."]], ["p", "Недолік практичного методу один: курсанти можуть почуватися надто керованими й менше проявляти себе індивідуально. Тому фази імітації інструктор комбінує й змінює залежно від заняття — не обов’язково використовувати всі три на кожному."], ["p", "Завдання на самостійну підготовку: ознайомитися з методами проведення занять — бінарна лекція, рольові ігри, проблемна лекція."]]}], "keys": ["EDIP — Explanation, Demonstration, Imitation, Practice: пояснення, демонстрація, імітація, практика.", "Метод розробив Чарльз Р. Аллен у 1919 році; використовується в арміях НАТО.", "Імітація має три фази: «роби, як я», «роби по кроках», «роби в цілому».", "Час основної частини: пояснення 10%, демонстрація 15%, імітація 25%, практика не менше 50%.", "Вступна і заключна частини — по 10% часу заняття, основна — 80%.", "Порушення техніки EDIP — підстава для оцінки «незадовільно» за проведене заняття."], "test": [["Що означає абревіатура EDIP?", ["Explanation – Demonstration – Imitation – Practice", "Education – Discipline – Instruction – Practice", "Explanation – Discussion – Inspection – Performance", "Exercise – Demonstration – Instruction – Planning"], "EDIP — пояснення, демонстрація, імітація, практика."], ["Хто і коли розробив принцип EDIP?", ["Чарльз Р. Аллен, 1919 рік", "Бенджамін Блум, 1956 рік", "Абрахам Маслоу, 1943 рік", "Генеральний штаб ЗСУ, 2019 рік"], "Принцип EDIP розробив Чарльз Р. Аллен у 1919 році."], ["Скільки етапів має методика EDIP?", ["Чотири", "Три", "П’ять", "Шість"], "Кожна літера назви — окремий етап: E, D, I, P."], ["Яка мета етапу «Пояснення»?", ["Дати теоретичне розуміння навички, яку треба опанувати", "Показати правильне виконання дії", "Закріпити навичку самостійною практикою", "Перевірити знання курсантів"], "Пояснення дає теоретичну основу: що вивчаємо, чому це важливо, як виглядає процес загалом."], ["Яка мета етапу «Демонстрація»?", ["Показати правильне виконання дії або навички", "Пояснити теорію", "Дати курсантам повторити дію", "Оцінити курсантів"], "На демонстрації інструктор показує, як правильно."], ["Як інструктор проводить демонстрацію?", ["Повільно і в нормальному темпі, коментуючи критичні моменти", "Лише в бойовому темпі, щоб показати реальну швидкість", "Мовчки, щоб не відволікати", "Тільки на відео"], "Показ і повільно, і в нормальному темпі, з коментарями до критичних моментів."], ["На якому етапі курсанти повторюють дії слідом за інструктором?", ["Імітація", "Пояснення", "Демонстрація", "Практика"], "Імітація — повторення за інструктором, повільно і правильно."], ["Які три фази має імітація?", ["«Роби, як я», «роби по кроках», «роби в цілому»", "«Слухай», «дивись», «запам’ятовуй»", "Вступ, основна частина, висновок", "Теорія, показ, контроль"], "Відпрацювання йде від простого до складного у три фази."], ["Коли особливо доречна фаза «Роби, як я»?", ["Коли курсанти вперше виконують дії зі зброєю або матеріал має багато елементів", "На контрольному занятті", "Коли курсанти вже впевнено виконують дію", "Лише на теоретичних заняттях"], "Інструктор виконує кожен елемент і пояснює його, курсанти повторюють."], ["Що відбувається у фазі «
