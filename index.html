онує всю дію від початку до кінця", "Інструктор лише спостерігає", "Етапи виконуються в довільному порядку"], "Дія ділиться на етапи; перехід далі — лише після чіткого виконання попереднього. Для складних і довгих маніпуляцій."], ["У методі завдання що відбувається на етапі «презентація рішення»?", ["Курсанти пояснюють рішення, решта ставить запитання й оцінює", "Інструктор показує правильну відповідь", "Курсанти виконують практичну частину", "Інструктор оголошує оцінки"], "Послідовність: ознайомлення → рішення → презентація (пояснюють, інші питають і оцінюють) → виконання → підсумки."], ["Курсант покращує власний результат розбирання автомата від спроби до спроби. Який це вид змагання?", ["Самостійне", "Індивідуальне", "Групове", "Командне"], "Змагання: самостійні (власний результат), індивідуальні (між курсантами), групові (між підрозділами)."], ["Чому робота в групах вимагає досвідченого інструктора?", ["Він не знає наперед, куди приведе дискусія", "Вона потребує складного обладнання", "Вона проводиться лише в полі", "Курсанти працюють без нагляду"], "У роботі в групах інструктор не знає заздалегідь, куди приведе дискусія, тому потрібен досвід."]]}, {"id": "b1m2t1z2", "code": "Б1 М2 Т1 З2", "theme": "Тема 1. Форми та методи навчання, методика викладання", "title": "Методика викладання EDIP", "short": "Методика EDIP", "passport": {"goal": "Довести курсантам порядок проведення занять за методикою EDIP (Explanation – Demonstration – Imitation – Practice).", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Суть та принципи методики EDIP", "Порядок практичного використання методики EDIP"], "assess": "Усні запитання під час і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 1.2; план-конспект; презентація"}, "sections": [{"h": "Що таке EDIP", "body": [["p", "EDIP — це сукупність дій інструктора та курсантів для набуття знань, умінь і навичок. Метод розробив у 1919 році Чарльз Р. Аллен, один із засновників професійної освіти в США. Це чотириетапний метод навчання, створений для швидкого засвоєння практичних завдань."], ["p", "Назва складається з перших літер чотирьох етапів: <b>Explain — пояснюй</b>, <b>Demonstrate — показуй</b>, <b>Imitate — повторюй</b>, <b>Practise — практикуй</b>. Вивчення кожної теми ділиться саме на ці чотири етапи."], ["p", "Методика вирізняється виключною ефективністю й успішно використовується в арміях США, Великої Британії, Канади, Польщі, Литви, Латвії, Естонії та інших країн. Особливо добре вона підходить для навчання практичним навичкам у технічній, військовій і професійній підготовці."], ["key", "EDIP = Пояснення → Демонстрація → Імітація → Практика. Чотири етапи, які ведуть курсанта від «чую» до «вмію сам»."]]}, {"h": "E — Explanation, пояснення", "body": [["p", "<b>Мета етапу</b> — дати теоретичне розуміння навички або завдання, яке потрібно опанувати."], ["p", "Пояснення — це дія, під час якої інструктор пояснює матеріал, зокрема відповідає на запитання курсантів. Пояснення застосовують і на теоретичних, і на практичних заняттях, якщо практичне заняття не є перевірочним чи контрольним."], ["ul", ["пояснює, що саме буде вивчатися;", "розповідає, чому це важливо;", "дає загальний огляд процесу або навички."]], ["p", "Наприклад: лекційні заняття з будь-якої дисципліни — від статутів до вогневої та тактичної підготовки."]]}, {"h": "D — Demonstration, демонстрація", "body": [["p", "<b>Мета етапу</b> — показати правильне виконання дії або навички."], ["p", "Демонстрація — це дія, під час якої інструктор показує курсантам ту чи іншу дію або наочні приклади. Її використовують і на теоретичних, і на практичних заняттях."], ["ul", ["показує процес на обладнанні або макеті;", "демонструє і повільно, і в нормальному темпі;", "коментує, вказуючи на критичні моменти."]], ["p", "Наприклад: на лекції з вогневої підготовки будову автомата АК-74 показують на зображеннях або на деталях, викладених перед курсантами. На тактичній підготовці переміщення на полі бою показують на схемах, відео або наочно — силами демогрупи."], ["warn", "Демонстрація має бути зразковою й безпомилковою. Курсант повторить саме те, що побачив, — разом із помилками інструктора."]]}, {"h": "I — Imitation, імітація", "body": [["p", "<b>Мета етапу</b> — курсант повторює дії за інструктором і отримує навичку шляхом копіювання та відпрацювання."], ["p", "Імітацію зазвичай використовують на практичних заняттях. Дії виконуються повільно і правильно — курсантів навчають саме правильності дій. Інструктор коментує й коригує кожного."], ["p", "Відпрацювання йде від простого до складного, у три фази:"], ["ul", ["<b>«Роби, як я»</b> — інструктор поступово виконує кожен елемент і пояснює його. За командою «Дивись!» курсанти спостерігають, за командою «Роби!» — повторюють. Ця фаза потрібна, коли матеріал має багато елементів або курсанти вперше працюють зі зброєю.", "<b>«Роби по кроках (за командами)»</b> — дія розбивається на етапи. Наприклад, перевірка зброї на розрядженість: «Перше: перевідник вогню в крайнє нижнє положення, затворну раму в крайнє заднє положення. Роби!». Курсант не переходить до наступного кроку, поки не виконує попередній чітко і без помилок.", "<b>«Роби в цілому»</b> — курсант виконує всю дію від початку до кінця. Тим, хто ще не готовий, інструктор приділяє увагу індивідуально, решті подає команду «Виконуйте самостійно!»."]], ["p", "Наприклад: курсанти розбирають автомат слідом за інструктором — інструктор від’єднує кришку ствольної коробки, курсанти роблять те саме."], ["key", "Імітація: задіяний 100% особового складу, інструктор контролює кожного й одразу виправляє помилки."]]}, {"h": "P — Practice, практика", "body": [["p", "<b>Мета етапу</b> — дати курсанту можливість закріпити навичку самостійною практикою."], ["p", "Практика — це дія, під час якої курсанти самостійно виконують дії в умовах, максимально наближених до реальних. Коментарі інструктора лунають лише тоді, коли це не перевірочне і не контрольне заняття. Спочатку дії виконують повільно, потім поступово нарощують темп."], ["ul", ["самостійно виконує навичку багаторазово;", "вдосконалює точність, швидкість, автоматизм;", "отримує зворотний зв’язок після виконання."]], ["p", "Наприклад: розбирання автомата на час, виконання тактичних прийомів самостійно або у складі підрозділу."]]}, {"h": "Як застосовувати EDIP на практиці", "body": [["p", "Інструктор поступово нарощує рівень знань і вмінь курсантів, не перевантажуючи їх інформацією. Переходячи до наступного елементу, він упевнений, що попередній матеріал засвоєно."], ["p", "Наприклад, під час вивчення автомата курсанти спочатку вивчають його призначення і ТТХ, потім будову та роботу частин і механізмів, далі вчаться розбирати і збирати — і лише після цього допускаються до стрільби."], ["p", "Для ефективного EDIP важливо правильно розподілити час заняття:"], ["ul", ["<b>вступна частина — 10%</b>, основна — <b>80%</b>, заключна — <b>10%</b>;", "в основній частині: пояснення — <b>10%</b>, демонстрація — <b>15%</b>, імітація — <b>25%</b>, практика — <b>не менше 50%</b>."]], ["key", "Максимум часу — на практику. Половина основної частини заняття і більше — це самостійне відпрацювання."], ["warn", "За оціночним листом порушення техніки EDIP під час проведення заняття означає оцінку «незадовільно» за все заняття."]]}, {"h": "Переваги методики", "body": [["ul", ["проста в застосуванні;", "забезпечує ефективне засвоєння нових навичок;", "легко масштабується на групу будь-якого розміру;", "добре підходить для процедурних дій — зброя, медицина, інженерна справа, тактичні прийоми."]], ["p", "Недолік практичного методу один: курсанти можуть почуватися надто керованими й менше проявляти себе індивідуально. Тому фази імітації інструктор комбінує й змінює залежно від заняття — не обов’язково використовувати всі три на кожному."], ["p", "Завдання на самостійну підготовку: ознайомитися з методами проведення занять — бінарна лекція, рольові ігри, проблемна лекція."]]}], "keys": ["EDIP — Explanation, Demonstration, Imitation, Practice: пояснення, демонстрація, імітація, практика.", "Метод розробив Чарльз Р. Аллен у 1919 році; використовується в арміях НАТО.", "Імітація має три фази: «роби, як я», «роби по кроках», «роби в цілому».", "Час основної частини: пояснення 10%, демонстрація 15%, імітація 25%, практика не менше 50%.", "Вступна і заключна частини — по 10% часу заняття, основна — 80%.", "Порушення техніки EDIP — підстава для оцінки «незадовільно» за проведене заняття."], "test": [["Практичне заняття триває 90 хвилин. Скільки хвилин за EDIP припадає на основну частину?", ["72 хвилини", "60 хвилин", "81 хвилина", "45 хвилин"], "Основна частина — 80% заняття: 80% від 90 хв = 72 хв."], ["Основна частина заняття триває 40 хвилин. Скільки щонайменше має тривати практика?", ["20 хвилин", "10 хвилин", "16 хвилин", "30 хвилин"], "Практика — не менше 50% основної частини: 50% від 40 = 20 хв."], ["Основна частина — 60 хвилин. Скільки часу відводять на демонстрацію?", ["9 хвилин", "6 хвилин", "15 хвилин", "12 хвилин"], "Демонстрація — 15% основної частини: 15% від 60 = 9 хв."], ["Інструктор витратив 40% основної частини на пояснення, а на практику залишив 20%. Чим це загрожує за оціночним листом?", ["Порушення техніки EDIP — «незадовільно» за все заняття", "Лише зниженням балу за один пункт", "Нічим, якщо матеріал складний", "Попередженням без наслідків"], "Порушення техніки EDIP під час проведення заняття означає «незадовільно» за все заняття."], ["На контрольному занятті курсанти виконують нормативи. Чи проводиться етап пояснення?", ["Ні — пояснення застосовують, якщо заняття не перевірочне і не контрольне", "Так, обов’язково на кожному занятті", "Так, але лише 5 хвилин", "Лише якщо курсанти попросять"], "Пояснення застосовують на теоретичних і практичних заняттях, якщо практичне заняття не є перевірочним чи контрольним."], ["Під час демонстрації інструктор пропустив перевірку патронника. Чому це критична помилка?", ["Курсанти повторять саме те, що побачили, — разом із помилкою", "Бо демонстрацію оцінює комісія", "Бо це затягує заняття", "Це не критично, можна пояснити пізніше"], "Демонстрація має бути зразковою й безпомилковою: курсант повторює побачене разом із помилками інструктора."], ["Як правильно проводити демонстрацію складної дії?", ["Повільно і в нормальному темпі, коментуючи критичні моменти", "Лише в бойовому темпі", "Мовчки, щоб курсанти зосередилися", "Лише на відео"], "Інструктор демонструє і повільно, і в нормальному темпі, вказуючи на критичні моменти."], ["«Перше: перевідник вогню в крайнє нижнє положення, затворну раму в крайнє заднє положення. Роби!» Яка це фаза імітації?", ["«Роби по кроках (за командами)»", "«Роби, як я»", "«Роби в цілому»", "Практика"], "Дія розбивається на етапи за командами — фаза «Роби по кроках»."], ["Кому інструктор подає команду «Виконуйте самостійно!» у фазі «Роби в цілому»?", ["Тим, хто готовий; з неготовими працює індивідуально", "Усім одночасно без винятку", "Лише найкращим курсантам на змаганні", "Нікому — це команда етапу практики"], "У фазі «Роби в цілому» неготовим інструктор приділяє увагу індивідуально, решті — «Виконуйте самостійно!»."], ["Який відсоток особового складу має бути задіяний на етапі імітації?", ["100%", "50%", "Лише найслабші", "Лише одне відділення"], "Імітація: задіяний 100% особового складу, інструктор контролює кожного й одразу виправляє помилки."], ["Чим практика відрізняється від імітації?", ["Курсанти діють самостійно в умовах, наближених до реальних, нарощуючи темп", "Інструктор виконує дію разом з курсантами", "Курсанти лише спостерігають", "Практика проводиться тільки на контрольному занятті"], "Практика — самостійне виконання в умовах, наближених до реальних: спочатку повільно, потім темп зростає."], ["Коли інструктор коментує дії курсантів на етапі практики?", ["Лише якщо заняття не перевірочне і не контрольне", "Завжди, після кожної дії", "Ніколи", "Лише на прохання курсанта"], "Коментарі інструктора на практиці лунають лише тоді, коли це не перевірочне і не контрольне заняття."], ["Яка правильна послідовність вивчення автомата за принципом EDIP?", ["Призначення і ТТХ → будова і робота → розбирання-збирання → стрільба", "Стрільба → будова → розбирання → ТТХ", "Розбирання → стрільба → ТТХ → будова", "ТТХ → стрільба → будова → розбирання"], "Інструктор нарощує рівень поступово: ТТХ, будова, розбирання-збирання і лише потім допуск до стрільби."], ["Який єдиний недолік практичного методу і як його компенсують?", ["Курсанти почуваються надто керованими — фази імітації комбінують і змінюють", "Він довгий — скорочують практику", "Він дорогий — заміняють лекцією", "Він небезпечний — прибирають зброю"], "Курсанти можуть почуватися надто керованими; тому фази імітації інструктор комбінує, не обов’язково всі три на кожному занятті."], ["Хто і коли розробив методику EDIP?", ["Чарльз Р. Аллен, 1919 рік", "Бенджамін Блум, 1956 рік", "Генштаб армії США, 1945 рік", "Абрахам Маслоу, 1943 рік"], "EDIP розробив Чарльз Р. Аллен у 1919 році, один із засновників професійної освіти в США."], ["Для якого заняття EDIP підходить найменше?", ["Дискусія про мотивацію без конкретної навички", "Накладання турнікета", "Розбирання автомата", "Встановлення протипіхотної міни на макеті"], "EDIP найкраще для процедурних дій — зброя, медицина, інженерна справа, тактичні прийоми."]]}, {"id": "b1m2t2z1", "code": "Б1 М2 Т2 З1", "theme": "Тема 2. Фактори та принципи навчання", "title": "Суть навчання та викладання", "short": "Навчання і викладання", "passport": {"goal": "Ознайомити військовослужбовців з принципами, особливостями та різницею між навчанням і викладанням.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Поняття навчання", "Поняття викладання", "Принципи, особливості та різниця між навчанням і викладанням"], "assess": "Усні запитання; у кінці — індивідуальний письмовий тест на 3 питання.", "criteria": "3 правильні відповіді — «відмінно», 2 — «добре», 1 — «задовільно».", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.1; презентація; тест за темою"}, "sections": [{"h": "Що таке навчання", "body": [["p", "Навчання — організована двостороння діяльність, спрямована на максимальне засвоєння та усвідомлення навчального матеріалу і подальше застосування знань, умінь і навичок на практиці."], ["p", "У Збройних Силах навчання визначають так: «Це організована співпраця між інструктором і тими, хто навчається, спрямована на досягнення цілей навчання». Інструктор очолює цю співпрацю, але виконують завдання всі разом: інструктор допомагає курсантам, а курсанти — інструкторові й одне одному."], ["key", "Навчання = викладання + учіння. Два взаємопов’язані процеси, які не працюють один без одного."]]}, {"h": "Викладання і учіння", "body": [["p", "<b>Викладання</b> — діяльність інструктора: поставити перед курсантами пізнавальне завдання, повідомити нові знання, організувати спостереження і практичні заняття, керувати самостійною роботою, перевірити якість знань, умінь і навичок."], ["p", "<b>Учіння</b> — цілеспрямований процес засвоєння знань і оволодіння вміннями та навичками тими, хто навчається."], ["p", "Оскільки навчання — двосторонній процес, ефективність викладання напряму залежить від ефективності учіння. Найкраща лекція не дасть результату, якщо курсант не працює сам."]]}, {"h": "Короткотривалі і довготривалі зміни", "body": [["p", "Навчання — це процес набуття нових знань, навичок і цінностей через досвід, вивчення чи роздуми, що змінює поведінку людини. Але не кожна зміна закріплюється."], ["p", "<b>Короткотривалі зміни</b> — первинна реакція на новий досвід, яка ще не стала звичкою:"], ["ul", ["<b>ефект новизни</b> — курсант правильно займає положення для стрільби, поки свідомо про це думає; щойно увага перемикається, повертається стара модель;", "<b>нестабільність</b> — без повторення навичка «розмивається» вже за 2–3 дні;", "<b>залежність від контексту</b> — під наглядом інструктора діє правильно, а в змінених умовах розгублюється;", "<b>швидка втомлюваність</b> — неавтоматизована дія потребує багато енергії, і через виснаження настає «відкат»."]], ["p", "<b>Довготривалі зміни</b> формуються поступово. Щоб зміни стали постійними, потрібні інтервальні повторення, практичне застосування і зворотний зв’язок."], ["warn", "Те, що курсант правильно виконав дію зараз, ще не означає, що він закріпив навичку назавжди."]]}, {"h": "Дидактичні принципи навчання", "body": [["p", "Принципи навчання — основні положення, що визначають зміст, форми і методи навчальної роботи. Основні з них:"], ["ul", ["<b>Науковості</b> — усі факти й положення, що вивчаються, мають бути науково правильними.", "<b>Системності і послідовності</b> — логічний перехід від засвоєного до нового, фокус на ключових аспектах.", "<b>Доступності</b> — від простого до складного, від відомого до невідомого, з урахуванням рівня курсантів.", "<b>Зв’язку навчання з життям</b> — теорія є основою практики; використовуємо життєвий і бойовий досвід курсантів.", "<b>Свідомості й активності</b> — роз’яснення мети, позитивні мотиви, контроль і самоконтроль.", "<b>Наочності</b> — сприяє активному сприйманню й осмисленню матеріалу.", "<b>Міцності засвоєння</b> — повторення за розділами, поєднання нового з вивченим.", "<b>Індивідуального підходу</b> — кожен опановує матеріал з урахуванням свого рівня."]]]}, {"h": "Як людина отримує досвід", "body": [["p", "Особистий досвід — сукупність знань, умінь, переживань, які людина набуває через власні дії, помилки та успіхи. Він складається з етапів:"], ["ul", ["<b>ситуація</b> — курсант опиняється в умовах, що змушують діяти: нове завдання, змагання або помилка;", "<b>спостереження</b> — що пішло не так, що спрацювало, які були емоції;", "<b>концептуалізація</b> — курсант робить висновки, і знання перетворюється на досвід, власне «правило»."]], ["key", "Завдання інструктора — створити ситуацію, допомогти проаналізувати її і зробити висновок. Саме тому після кожного заняття проводять АПД."]]}], "keys": ["Навчання — організована співпраця інструктора і курсантів для досягнення цілей навчання.", "Навчання складається з викладання (діяльність інструктора) та учіння (діяльність курсанта).", "Короткотривалі зміни нестабільні; для довготривалих потрібні повторення, практика і зворотний зв’язок.", "Основні принципи: науковість, системність, доступність, зв’язок з життям, свідомість, наочність, міцність, індивідуальний підхід.", "Досвід формується через ситуацію, спостереження і висновок."], "test": [["Яке визначення навчання прийняте у Збройних Силах?", ["Організована співпраця між інструктором і тими, хто навчається, для досягнення цілей навчання", "Передача знань від інструктора до курсанта", "Самостійна робота курсанта з літературою", "Контроль виконання нормативів"], "У ЗСУ навчання — організована співпраця інструктора і курсантів, спрямована на досягнення цілей навчання."], ["Інструктор прочитав блискучу лекцію, але курсанти нічого не засвоїли, бо не працювали самі. Яку закономірність це ілюструє?", ["Ефективність викладання напряму залежить від ефективності учіння", "Лекція — неефективний метод", "Курсанти мали низький рівень", "Інструктор порушив принцип науковості"], "Навчання = викладання + учіння: найкраща лекція не дасть результату, якщо курсант не працює сам."], ["Що з переліченого — це учіння, а не викладання?", ["Курсант самостійно відпрацьовує усунення затримок", "Інструктор ставить пізнавальне завдання", "Інструктор перевіряє якість знань", "Інструктор керує самостійною роботою"], "Учіння — процес засвоєння знань тими, хто навчається. Решта — дії інструктора, тобто викладання."], ["Курсант правильно займає положення для стрільби, але щойно відволікається на ціль — повертається до старої пози. Який це прояв короткотривалих змін?", ["Ефект новизни", "Залежність від контексту", "Швидка втомлюваність", "Нестабільність"], "Ефект новизни: правильно, поки свідомо думає; щойно увага перемикається — стара модель."], ["Без повторення нова навичка «розмивається». За скільки днів, за текстом заняття?", ["За 2–3 дні", "За 2–3 тижні", "За місяць", "За кілька годин"], "Нестабільність: без повторення навичка розмивається вже за 2–3 дні."], ["На полігоні під наглядом інструктора курсант діє бездоганно, а на нічному виході розгублюється. Який це прояв?", ["Залежність від контексту", "Ефект новизни", "Нестабільність", "Принцип наочності"], "Залежність від контексту: під наглядом — правильно, у змінених умовах — розгубленість."], ["Що потрібно, щоб короткотривалі зміни стали довготривалими?", ["Інтервальні повторення, практичне застосування і зворотний зв’язок", "Одне інтенсивне тренування до втоми", "Лише детальне пояснення", "Письмовий конспект"], "Довготривалі зміни формуються поступово: інтервальні повторення, практика, зворотний зв’язок."], ["Інструктор пояснює прицілювання через досвід курсантів-мисливців. Який принцип він реалізує?", ["Зв’язку навчання з життям", "Науковості", "Наочності", "Міцності засвоєння"], "Принцип зв’язку з життям: використовуємо життєвий і бойовий досвід курсантів."], ["На початку заняття інструктор пояснює, навіщо ця навичка в бою, і залучає курсантів до самоконтролю. Який принцип?", ["Свідомості й активності", "Доступності", "Системності", "Науковості"], "Свідомість і активність: роз’яснення мети, позитивні мотиви, контроль і самоконтроль."], ["Інструктор переказує непідтверджену «байку» про бронепробиття як факт. Який принцип порушено?", ["Науковості", "Наочності", "Індивідуального підходу", "Доступності"], "Принцип науковості: усі факти й положення мають бути науково правильними."], ["Новий матеріал щоразу пов’язують з уже вивченим і повторюють за розділами. Який принцип?", ["Міцності засвоєння", "Наочності", "Зв’язку з життям", "Свідомості"], "Міцність засвоєння: повторення за розділами, поєднання нового з вивченим."], ["Курсант уперше пропустив ціль на макеті й аналізує, що пішло не так і що він відчував. Який це етап отримання досвіду?", ["Спостереження", "Ситуація", "Концептуалізація", "Імітація"], "Етапи досвіду: ситуація → спостереження (що не так, які емоції) → концептуалізація (висновок, власне «правило»)."], ["На якому етапі знання перетворюється на власне «правило» курсанта?", ["Концептуалізація", "Ситуація", "Спостереження", "Демонстрація"], "Концептуалізація — курсант робить висновки, і знання стає досвідом."], ["Чому після кожного заняття проводять АПД?", ["Щоб допомогти проаналізувати ситуацію і зробити висновок — завершити цикл досвіду", "Щоб виставити оцінки", "Щоб заповнити журнал", "Щоб покарати винних"], "Завдання інструктора — створити ситуацію, допомогти проаналізувати і зробити висновок; тому проводять АПД."], ["Курсант правильно виконав дію один раз. Який висновок коректний?", ["Це ще не означає, що навичку закріплено назавжди", "Навичку сформовано, можна переходити далі", "Варто одразу ставити норматив", "Повторення вже не потрібні"], "Правильне виконання зараз не означає закріпленої навички — потрібні повторення і практика."]]}, {"id": "b1m2t2z2", "code": "Б1 М2 Т2 З2", "theme": "Тема 2. Фактори та принципи навчання", "title": "Області (сфери) навчання", "short": "Сфери навчання", "passport": {"goal": "Пояснити військовослужбовцям поняття теоретичних знань та практичних дій (умінь і навичок), чим вони набуваються (формуються).", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Поняття знань, умінь і навичок, різниця між ними", "Як набуваються знання, уміння і навички", "Таксономія Блума і сфери навчання"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо засвоїв матеріал з усіх навчальних питань не нижче оцінки «добре».", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.2; презентація; тест за темою"}, "sections": [{"h": "Навіщо знати сфери навчання", "body": [["p", "Основне завдання навчання — передати курсанту знання і сформувати в нього вміння та навички. Сфери навчання — один з основних аспектів, які враховують під час планування заняття: від типу сфери залежать навчальні завдання, організація заняття і спосіб подачі інформації."], ["p", "За таксономією Блума (1956 рік) виділяють три сфери: <b>когнітивну (знання)</b>, <b>психомоторну (навички)</b> та <b>афективну (ставлення, цінності)</b>. Після заняття курсант має набути нових знань, навичок і змінити систему цінностей."], ["key", "Когнітивна сфера — основна: застосування двох інших завжди потребує певної частки знань."]]}, {"h": "Знання", "body": [["p", "Знання — теоретично узагальнений досвід, результат пізнання дійсності. Знання підвищують усвідомленість діяльності і впевненість у правильності виконання. Без знань виконати діяльність неможливо."], ["ul", ["<b>Фактичні знання</b> — одиничні поняття, інформація, завчена напам’ять: знаки, цифри, назви, події. Це знання «про щось». Наприклад: бензин — пальне для автомобілів, його добувають з нафти, він легкозаймистий.", "<b>Теоретичні знання</b> — схеми й аналогії, що пояснюють природу процесів і дозволяють прогнозувати.", "<b>Процедурні знання</b> — знання про те, «як…?» і «яким чином…?»: порядок і послідовність процесу.", "<b>Інтегровані знання</b> — поєднання фактичних і процедурних."]], ["p", "Приклад з маскування: курсант знає демаскуючі ознаки — відблиск, колір, розмір, тінь, силует, текстуру, форму (фактичні знання) і розуміє, як замаскувати фортифікаційну споруду (процедурні)."]]}, {"h": "Уміння і навичка", "body": [["p", "<b>Уміння</b> — здатність на належному рівні виконувати певні дії на основі доцільного використання знань і навичок. Формується в кілька стадій: ознайомлення й усвідомлення змісту, початкове оволодіння, самостійне і дедалі точніше виконання. Найвищий рівень уміння — розвинута навичка."], ["p", "<b>Навичка</b> — здатність виконувати дію раціонально, точно і швидко, без постійного контролю свідомості і без зайвих витрат сил. Приклади: їзда на велосипеді, керування автомобілем, перевірка зброї."], ["p", "Деякі педагоги виділяють і четвертий результат навчання — <b>ставлення</b>: цінності, переконання, інтереси, мотивацію. Воно впливає на поведінку і бажання навчатися далі."]]}, {"h": "Як знання стають навичкою", "body": [["p", "Джерела знань бувають <b>зовнішні</b> (люди, книги, навчальний контент, спостереження), <b>внутрішні</b> (власні міркування, аналіз, висновки) та <b>інтегровані</b> (власний досвід, доповнений з інших джерел)."], ["p", "Уміння формуються на базі знань під час спроби втілити їх на практиці: знання — основа уміння. Навичка — результат багаторазового виконання дій, тобто практики."], ["p", "Наприклад: курсант вивчив будову автомата АКМ і порядок неповного розбирання — він <b>знає</b>. Потім розбирає і збирає сам, без допомоги — він <b>уміє</b>. Після кількох десятків повторень на час робить це, не контролюючи рук свідомістю, — це вже <b>навичка</b>."], ["key", "Знаю → вмію → роблю автоматично. Знання дає теорія, уміння — перша практика, навичку — багаторазове повторення."]]}, {"h": "Психомоторна і афективна сфери", "body": [["p", "<b>Психомоторна сфера</b> зосереджена на виконанні послідовності рухів із заданою точністю, плавністю, швидкістю чи силою. В основі рухів завжди лежить їх розуміння. Тому ефективні відеозаписи, презентації, покрокова демонстрація. Курсант має продемонструвати навичку в присутності інструктора, який визначає відповідність стандарту."], ["p", "<b>Афективна сфера</b> стосується ставлення, цінностей, емоцій і мотивації — того, як курсант ставиться до навчання і до своєї ролі. Її формують особистий приклад інструктора, атмосфера на занятті та розуміння, навіщо це потрібно в бою."]]}], "keys": ["Три сфери навчання: когнітивна (знання), психомоторна (навички), афективна (ставлення).", "Типи знань: фактичні, теоретичні, процедурні, інтегровані.", "Уміння — виконання дії на основі знань; навичка — виконання без контролю свідомості.", "Знання — основа вміння; навичка — результат багаторазової практики.", "Джерела знань: зовнішні, внутрішні, інтегровані."], "test": [["Які три сфери навчання виділяє таксономія Блума?", ["Когнітивна, психомоторна, афективна", "Теоретична, практична, бойова", "Фактична, процедурна, інтегрована", "Словесна, наочна, практична"], "За Блумом (1956): когнітивна (знання), психомоторна (навички), афективна (ставлення, цінності)."], ["Чому когнітивну сферу вважають основною?", ["Застосування двох інших завжди потребує певної частки знань", "Вона найлегша для оцінювання", "Вона займає найбільше часу", "Бо так визначено наказом"], "Когнітивна сфера основна: навички й ставлення завжди спираються на знання."], ["Курсант знає, що бензин легкозаймистий і його добувають з нафти. Який вид знань?", ["Фактичні", "Процедурні", "Теоретичні", "Інтегровані"], "Фактичні знання — знання «про щось»: поняття, факти, назви."], ["Курсант знає послідовність накладання турнікета. Який це вид знань?", ["Процедурні", "Фактичні", "Теоретичні", "Афективні"], "Процедурні знання — «як…?»: порядок і послідовність процесу."], ["Знання, що пояснюють природу процесів і дозволяють прогнозувати, — це…", ["Теоретичні знання", "Фактичні знання", "Процедурні знання", "Навички"], "Теоретичні знання — схеми й аналогії, що пояснюють природу процесів і дають змогу прогнозувати."], ["Курсант знає демаскуючі ознаки і розуміє, як замаскувати окоп. Які це знання разом?", ["Інтегровані — поєднання фактичних і процедурних", "Лише фактичні", "Лише теоретичні", "Навичка"], "Демаскуючі ознаки — фактичні, як маскувати — процедурні; разом — інтегровані."], ["Що з переліченого НЕ є демаскуючою ознакою з прикладу заняття?", ["Звук двигуна", "Відблиск", "Тінь", "Силует"], "У прикладі названо відблиск, колір, розмір, тінь, силует, текстуру, форму."], ["Курсант уперше самостійно, повільно, але без допомоги розібрав АКМ. Що в нього сформовано?", ["Уміння", "Навичка", "Лише знання", "Ставлення"], "Знає → вміє (сам, без допомоги) → навичка (автоматично після десятків повторень)."], ["Чим навичка відрізняється від уміння?", ["Виконується раціонально, швидко, без постійного контролю свідомості", "Навичка базується на знаннях, а вміння — ні", "Уміння вищий рівень, ніж навичка", "Нічим, це синоніми"], "Навичка — дія без постійного контролю свідомості і зайвих витрат сил; найвищий рівень уміння — розвинута навичка."], ["Що є основою для формування навички?", ["Багаторазове повторення — практика", "Лише вивчення теорії", "Одноразовий показ", "Мотивація"], "Знання дає теорія, уміння — перша практика, навичку — багаторазове повторення."], ["Курсант доповнив прочитане в посібнику власним досвідом з фронту. Яке це джерело знань?", ["Інтегроване", "Зовнішнє", "Внутрішнє", "Фактичне"], "Джерела: зовнішні (люди, книги), внутрішні (власні міркування), інтегровані (власний досвід + інші джерела)."], ["Який четвертий результат навчання виділяють деякі педагоги?", ["Ставлення — цінності, переконання, мотивацію", "Оцінку", "Дисципліну", "Фізичну форму"], "Окрім знань, умінь і навичок, виділяють ставлення: цінності, переконання, інтереси, мотивацію."], ["Чому для психомоторної сфери ефективні відео та покрокова демонстрація?", ["Бо в основі рухів завжди лежить їх розуміння", "Бо курсанти не люблять лекцій", "Бо так дешевше", "Бо психомоторна сфера не потребує практики"], "Психомоторна сфера — точність, плавність, швидкість рухів; в основі рухів лежить розуміння."], ["Як перевіряють засвоєння у психомоторній сфері?", ["Курсант демонструє навичку при інструкторі, який визначає відповідність стандарту", "Письмовим тестом", "Усним опитуванням", "Самооцінкою курсанта"], "Курсант має продемонструвати навичку в присутності інструктора, який визначає відповідність стандарту."], ["Що найбільше впливає на афективну сферу курсанта?", ["Особистий приклад інструктора, атмосфера і розуміння, навіщо це в бою", "Кількість годин теорії", "Складність тесту", "Суворість покарань"], "Афективну сферу формують особистий приклад, атмосфера на занятті і розуміння бойової потреби."]]}, {"id": "b1m2t2z3", "code": "Б1 М2 Т2 З3", "theme": "Тема 2. Фактори та принципи навчання", "title": "Сприйняття інформації та комунікація", "short": "Сприйняття інформації", "passport": {"goal": "Ознайомити військовослужбовців з особливостями сприйняття інформації людиною, пояснити зв’язок процесу сприйняття інформації та комунікації, особливості навчання дорослих.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Процес і типи сприйняття", "Особливості навчання дорослих", "Уважність під час навчання", "Графіки активності курсантів"], "assess": "Усне опитування; у кінці — намалювати графіки активності на занятті та протягом дня.", "criteria": "Позитивно — якщо надав відповіді й правильно зобразив обидва графіки.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.3; презентація; практичне завдання"}, "sections": [{"h": "Що таке сприйняття", "body": [["p", "Сприйняття — процес, під час якого сенсорна система надсилає сигнали в мозок, де вони обробляються і стають психічними переживаннями. Схема проста: дія → відчуття → обробка."], ["p", "Люди сприймають одне й те саме по-різному. На обробку впливають досвід, знання, навички, ставлення, розум, темперамент, звички, упередження, очікування, почуття, а також фізичний і психологічний стан."], ["p", "Досвідчений інструктор знає, як курсанти обробляють інформацію, тому краще обирає метод її подачі. Знання рівня підготовки курсантів — необхідна умова вибору методів і форм навчання."]]}, {"h": "Два принципи: цілісність і структура", "body": [["p", "<b>Цілісне сприйняття.</b> Людина сприймає предмет цілком, а не окремі властивості. Дивлячись на кілька ліній, ми «бачимо» щасливе і сумне обличчя — мозок сам додає відсутню інформацію з досвіду. Тому інструктор має подавати матеріал цілісно — словесно і візуально, з прикладами з оточення курсантів."], ["p", "<b>Структурне сприйняття.</b> Якщо сірники чи рисочки викладені впорядковано, їх легко порахувати; хаотичні — важко. Людина сприймає структуру і взаємозв’язки. Тому матеріал має бути чітко впорядкований, а інструктор повинен переконатися, що курсанти бачать загальну картину."], ["key", "Подавайте цілісну картину і чітку структуру: курсант має бачити не набір фактів, а систему, де все пов’язано."]]}, {"h": "Особливості навчання дорослих", "body": [["p", "Андрагогіка — мистецтво і наука допомагати дорослим вчитися. Дорослий учень, за Малкольмом Ноулзом, — зріла людина, яка вважає себе відповідальною за своє життя."], ["ul", ["<b>Самосвідомість</b> — дорослий може мотивувати себе сам і швидше вчиться, коли бере участь у процесі; він чинить опір, коли йому не дають діяти самостійно.", "<b>Досвід</b> — у дорослого є життєвий і бойовий досвід; використовуйте його на користь групи.", "<b>Готовність</b> — дорослі хочуть вчитися того, що потрібно для їхньої ролі; їм треба не «багато вчити», а показати, як робити ефективно.", "<b>Орієнтація на результат</b> — покажіть, як заняття допоможе досягти мети, інакше курсант не побачить цінності навчання."]]]}, {"h": "Сприйняття і комунікація протягом дня", "body": [["p", "Комунікація — обмін інформацією між інструктором і курсантами через мову, жести, міміку, технічні засоби. Що чіткіша й логічніша комунікація, то менше когнітивне навантаження і краще засвоєння."], ["p", "Протягом дня увага курсантів коливається через утому, монотонність або збудження. Підтримують увагу зміна форм подачі матеріалу (лекція, дискусія, практика) і регулярний зворотний зв’язок від курсантів."], ["p", "Чинники, якими інструктор підвищує уважність:"], ["ul", ["варіативність методів і мультимедіа — відео, презентації, анімація;", "позитивна атмосфера — похвала, здорова конкуренція, відкритий діалог;", "групова робота, рольові ігри, мозковий штурм, запитання на роздуми;", "структурованість, повтори й підсумки ключових моментів;", "доречний гумор, відсутність зайвого стресу;", "короткі паузи і чергування розумової роботи з рухом;", "урахування рівня, інтересів і мотивації курсантів."]]]}, {"h": "Графіки активності курсантів", "body": [["p", "Ніхто не може бути повністю зосередженим увесь час. Згідно з довідковим матеріалом, курсанти здатні уважно слухати близько 6 хвилин і дивитися близько 12 хвилин, після чого концентрація падає. Увага вища, коли курсанти не лише слухають, а й беруть активну участь."], ["p", "<b>Крива енергії заняття</b> показує, як змінюється уважність протягом 45 хвилин. Найважчий матеріал подавайте на піку енергії, а коли крива падає — переходьте до методів з активною участю курсантів."], ["p", "<b>Крива енергії дня</b> показує, що найпродуктивніші ранкові заняття, пік — близько 11-ї години. Одразу після обіду енергія падає, тож перше заняття після обіду краще зробити активним, але без важких фізичних вправ. Найскладнішу тему ставте на час піку енергії."], ["key", "Плануйте заняття за кривими енергії: складне — на пік, активне — на спад."], ["p", "Практичне завдання заняття: самостійно намалювати графік уважності на занятті (45 хв) і графік уважності протягом дня."]]}], "keys": ["Сприйняття: дія → відчуття → обробка; на нього впливають досвід, очікування, стан людини.", "Два принципи: люди сприймають цілісно і структурно.", "Дорослі вчаться краще, коли бачать користь, беруть участь і можуть спиратися на свій досвід.", "Увагу підтримують зміна методів, активна участь, паузи, позитивна атмосфера.", "Найпродуктивніший час дня — ранок, пік близько 11:00; після обіду — спад."], "test": [["Яка правильна схема процесу сприйняття?", ["Дія → відчуття → обробка", "Обробка → дія → відчуття", "Відчуття → дія → обробка", "Дія → обробка → відчуття"], "Сенсорна система надсилає сигнали в мозок, де вони обробляються: дія → відчуття → обробка."], ["Два курсанти по-різному зрозуміли одну й ту саму схему. Що з переліченого НЕ впливає на обробку інформації?", ["Номер навчальної аудиторії", "Попередній досвід", "Очікування й упередження", "Фізичний і психологічний стан"], "На обробку впливають досвід, знання, ставлення, темперамент, звички, упередження, очікування, стан."], ["Дивлячись на кілька ліній, ми «бачимо» обличчя. Який принцип сприйняття це ілюструє?", ["Цілісне сприйняття — мозок додає відсутнє з досвіду", "Структурне сприйняття", "Ефект новизни", "Вибіркова увага"], "Цілісне сприйняття: людина сприймає предмет цілком, мозок сам домальовує відсутню інформацію."], ["Яка практична вимога до інструктора випливає з принципу структурного сприйняття?", ["Матеріал має бути чітко впорядкований, курсанти мають бачити загальну картину", "Подавати якомога більше фактів", "Подавати матеріал лише візуально", "Не повторювати ключові моменти"], "Впорядковане легко сприйняти, хаотичне — важко; тому чітка структура і загальна картина."], ["Хто описав дорослого учня як зрілу людину, відповідальну за своє життя?", ["Малкольм Ноулз", "Бенджамін Блум", "Абрахам Маслоу", "Чарльз Аллен"], "Андрагогіка — допомога дорослим учитися; визначення дорослого учня — за Малкольмом Ноулзом."], ["Досвідчений боєць на курсі чинить опір, коли інструктор диктує кожен крок. Яку особливість дорослих ігнорує інструктор?", ["Самосвідомість — дорослий опирається, коли йому не дають діяти самостійно", "Орієнтацію на результат", "Готовність", "Цілісне сприйняття"], "Самосвідомість: дорослий швидше вчиться, беручи участь, і чинить опір, коли не дають діяти самостійно."], ["Як інструктор має використати бойовий досвід курсантів?", ["На користь групи — залучати до прикладів і обговорень", "Ігнорувати, щоб не відхилятися від програми", "Забороняти, бо досвід у всіх різний", "Використовувати лише для оцінювання"], "Досвід дорослого — ресурс: використовуйте його на користь групи."], ["Курсанти не бачать сенсу в темі. Яка особливість дорослих підказує рішення?", ["Орієнтація на результат — показати, як заняття допоможе досягти мети", "Самосвідомість — дати свободу", "Цілісність — додати схеми", "Готовність — збільшити обсяг матеріалу"], "Орієнтація на результат: без розуміння користі курсант не бачить цінності навчання."], ["Скільки приблизно хвилин курсанти здатні уважно слухати, за довідковим матеріалом?", ["Близько 6 хвилин", "Близько 20 хвилин", "Усі 45 хвилин", "Близько 2 хвилин"], "Курсанти уважно слухають близько 6 хвилин і дивляться близько 12, далі концентрація падає."], ["Довше вони здатні уважно дивитися чи слухати?", ["Дивитися — близько 12 хвилин проти 6", "Слухати — 12 проти 6", "Однаково", "Слухати — до 30 хвилин"], "Дивитися — близько 12 хвилин, слухати — близько 6."], ["Крива енергії 45-хвилинного заняття падає. Що робити інструктору?", ["Перейти до методів з активною участю курсантів", "Подати найважчий матеріал", "Говорити гучніше", "Завершити заняття раніше"], "Найважче — на піку енергії; на спаді — методи з активною участю."], ["Коли за кривою енергії дня найкраще ставити найскладнішу тему?", ["На пік — близько 11-ї години", "Одразу після обіду", "Пізно ввечері", "О 7-й ранку перед сніданком"], "Найпродуктивніші ранкові заняття, пік — близько 11-ї; найскладніше ставте на пік."], ["Яким має бути перше заняття після обіду?", ["Активним, але без важких фізичних вправ", "Лекцією з найскладнішої теми", "Інтенсивним фізичним тренуванням", "Самопідготовкою без контролю"], "Після обіду енергія падає: заняття активне, але без важкого фізичного навантаження."], ["Що з переліченого ЗНИЖУЄ уважність курсантів?", ["Монотонна подача без пауз і зміни форм", "Доречний гумор", "Чергування розумової роботи з рухом", "Підсумки ключових моментів"], "Увагу підтримують зміна форм, паузи, гумор, структурованість; монотонність її знижує."], ["Чому чітка і логічна комунікація покращує засвоєння?", ["Вона зменшує когнітивне навантаження", "Вона скорочує тривалість заняття", "Вона замінює практику", "Вона підвищує дисципліну"], "Що чіткіша комунікація, то менше когнітивне навантаження і краще засвоєння."]]}, {"id": "b1m2t2z4", "code": "Б1 М2 Т2 З4", "theme": "Тема 2. Фактори та принципи навчання", "title": "Мотивування курсантів", "short": "Мотивація", "passport": {"goal": "Ознайомити військовослужбовців із принципами мотивування курсантів.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Поняття мотивації та її важливість", "Основні теорії мотивації", "Види та принципи мотивування", "Методи мотивування курсантів"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; тестування «мотивація успіху та страх невдачі» (Мехрабіан).", "criteria": "Позитивно — якщо пояснює, що таке мотивація, називає її види і теорії.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.4; презентація; тест за темою"}, "sections": [{"h": "Що таке мотивація", "body": [["p", "Мотивація — внутрішній емоційний стан людини, що спонукає її до дій. Саме вона визначає напрям, силу і стійкість поведінки в досягненні цілей і є рушієм активної участі курсантів у навчанні."], ["p", "Дії, пов’язані з досягненням бажаного, вимагають менше сил і часу, ніж ті, до яких людина байдужа. Будь-яке навчання може стати рутиною або захопливою справою — залежно від того, чи відповідає воно внутрішнім потребам людини."], ["p", "Низька мотивація призводить до розсіювання уваги і небажання бути на занятті. Тому інструктор організовує роботу так, щоб викликати зацікавленість, підвищити активність і стимулювати бажання прогресувати: навчання має бути важливим і корисним, якомога активнішим, з можливістю бачити власні досягнення."], ["key", "«За відсутності мотивації ви приречені на посередній результат, якими б здібностями не володіли» — Ендрю Карнегі."]]}, {"h": "Теорії мотивації: Маслоу і Врум", "body": [["p", "<b>Ієрархія потреб Абрахама Маслоу.</b> Мотивація залежить від потреб, які мають ієрархію від базових до вищих: фізіологічні → безпеки → соціальні → повага → самовираження. Потреби задовольняються знизу вгору: поки не задоволені базові, вищі слабко проявляються і не мотивують."], ["p", "Голодний, змерзлий або невиспаний курсант думатиме про їжу, тепло і сон, а не про тему заняття."], ["p", "<b>Теорія очікувань Віктора Врума.</b> Мотивація досягається винагородою, а сила прагнення залежить від трьох факторів:"], ["ul", ["чи є зв’язок між зусиллями і результатом;", "чи реально отримати винагороду за результат;", "чи цінна ця винагорода для самої людини."]], ["p", "Якщо очікування не справджуються, виникає відчуття марності зусиль. Допомагають досяжні цілі й винагорода, яку людина цінує. Складність завдання має відповідати здібностям того, хто його виконує."]]}, {"h": "Теорії мотивації: Герцберг і постановка цілей", "body": [["p", "<b>Теорія двох факторів Фредеріка Герцберга (1959).</b> Є дві незалежні групи факторів:"], ["ul", ["<b>гігієнічні</b> — пов’язані з умовами, а не змістом роботи: правила, справедливість керівництва, оплата, стосунки, умови праці, статус, стабільність. Їх наявність не робить людину задоволеною, але відсутність викликає незадоволення — як гігієна: не робить щасливим, але без неї хворієш;", "<b>мотиватори</b> — пов’язані із самою суттю роботи: досягнення, визнання, цікавий зміст, відповідальність, просування, зростання. Саме вони підвищують залученість і продуктивність."]], ["p", "<b>Теорія постановки цілей Едвіна Локка і Гері Латама.</b> Усвідомлені й складні цілі — потужний мотиватор. Принципи: ціль складна, але досяжна; конкретна і вимірювана; прийнята людиною; є регулярний зворотний зв’язок; людина вірить у власну здатність її досягти."], ["p", "Маслоу також описав <b>самореалізацію</b> на вершині піраміди — прагнення розкрити свій потенціал, пов’язане з вищими, «буттєвими» цінностями: істиною, добром, справедливістю, досконалістю."], ["key", "Мотивація зростає, коли людина має чітко визначені, досяжні цілі й отримує зворотний зв’язок про прогрес."]]}, {"h": "Види мотивації", "body": [["ul", ["<b>За джерелом:</b> внутрішня — задоволення від процесу, відчуття компетентності, прагнення розвиватися (найстійкіша); зовнішня — нагороди, покарання, похвала, тиск (ефективна, але менш стійка).", "<b>За спрямованістю:</b> позитивна — заохочення, прагнення до успіху; негативна — страх покарання чи провалу. Негативна діє коротко і може знижувати ініціативу.", "<b>За змістом:</b> матеріальна — грошові винагороди, пільги; нематеріальна — похвала, визнання, цікава робота, розвиток."]], ["p", "Внутрішня мотивація спрямована на процес і результат, зовнішня — на отримання блага або уникнення покарання."]]}, {"h": "Принципи ефективного мотивування", "body": [["ul", ["<b>Індивідуальний підхід</b> — те, що мотивує одного, може бути байдужим іншому.", "<b>Усвідомленість цілей</b> — цілі конкретні, вимірювані, досяжні, доречні й обмежені в часі (SMART).", "<b>Заохочення успіху</b> — відзначайте навіть невеликі досягнення.", "<b>Справедливість</b> — однакові правила заохочення й покарання для всіх.", "<b>Зворотний зв’язок</b> — регулярний і конструктивний.", "<b>Залучення</b> — давайте висловити думку і взяти відповідальність.", "<b>Сприятливе середовище</b> — комфортні умови і нормальні стосунки."]]]}, {"h": "Методи мотивування курсантів", "body": [["p", "<b>Внутрішня мотивація:</b> показуйте, як знання знадобляться на службі і в бою; розповідайте історії успіху випускників; використовуйте інтерактивні методи — дискусії, кейси, рольові ігри, симуляції; заохочуйте пошук додаткової інформації; відзначайте прогрес і зусилля."], ["p", "<b>Зовнішня позитивна:</b> публічно відзначайте успіхи; заохочення в межах статуту — подяки, грамоти, додаткові звільнення; навчальні змагання з чесними критеріями; доручення з відповідальністю."], ["p", "<b>Зовнішня негативна — лише як крайній захід:</b> чіткі правила і наслідки, справедливе й послідовне застосування покарань, акцент на виправленні помилки, а не на приниженні людини."], ["p", "<b>Зворотний зв’язок:</b> частий, конкретний, з рекомендаціями, на основі фактів, своєчасний."], ["warn", "Основний акцент — на позитивних методах. Негативна мотивація у довгостроковій перспективі викликає стрес і вбиває ініціативу."]]}], "keys": ["Мотивація — внутрішній емоційний стан, що спонукає людину до дій.", "Піраміда Маслоу: фізіологічні, безпеки, соціальні, повага, самовираження.", "Врум: зусилля → результат → винагорода, яку людина цінує.", "Герцберг: гігієнічні фактори і мотиватори.", "Види: внутрішня і зовнішня, позитивна і негативна, матеріальна і нематеріальна.", "Негативна мотивація — лише крайній захід; основне — позитивні методи і зворотний зв’язок."], "test": [["Що визначає мотивація в поведінці людини?", ["Напрям, силу і стійкість поведінки в досягненні цілей", "Лише швидкість виконання", "Тільки дисципліну", "Рівень знань"], "Мотивація визначає напрям, силу і стійкість поведінки."], ["Курсанти після нічного наряду, змерзлі й голодні, неуважні на лекції. Яка теорія це пояснює?", ["Ієрархія потреб Маслоу — поки не задоволені базові, вищі не мотивують", "Теорія очікувань Врума", "Теорія постановки цілей", "Теорія двох факторів Герцберга"], "За Маслоу потреби задовольняються знизу вгору; голодний і невиспаний думає про їжу і сон."], ["Яка правильна послідовність потреб за Маслоу, знизу вгору?", ["Фізіологічні → безпеки → соціальні → повага → самовираження", "Безпеки → фізіологічні → повага → соціальні → самовираження", "Соціальні → фізіологічні → безпеки → самовираження → повага", "Повага → безпеки → соціальні → фізіологічні → самовираження"], "Ієрархія Маслоу: фізіологічні, безпеки, соціальні, повага, самовираження."], ["Курсант вважає, що навіть ідеальна стрільба не вплине на оцінку, бо «все вирішено заздалегідь». Який фактор Врума порушено?", ["Реальність отримати винагороду за результат", "Зв’язок зусиль і результату", "Цінність винагороди", "Ієрархія потреб"], "Врум: зв’язок зусилля–результат, реальність винагороди за результат, цінність винагороди."], ["Винагорода — грамота, але курсанту вона байдужа. Що за теорією Врума станеться з мотивацією?", ["Вона буде слабкою — винагорода не цінна для людини", "Зросте, бо винагорода є", "Не зміниться", "Перетвориться на внутрішню"], "Сила прагнення залежить і від того, чи цінна винагорода для самої людини."], ["За Герцбергом, справедливе керівництво, нормальні умови і стабільність — це…", ["Гігієнічні фактори: їх відсутність викликає незадоволення", "Мотиватори, що підвищують продуктивність", "Внутрішня мотивація", "Негативна мотивація"], "Гігієнічні фактори пов’язані з умовами: наявність не робить задоволеним, відсутність — незадоволення."], ["Що з переліченого — мотиватор за Герцбергом?", ["Визнання і відповідальність", "Умови в казармі", "Правила розпорядку", "Стабільність посади"], "Мотиватори — суть роботи: досягнення, визнання, цікавий зміст, відповідальність, зростання."], ["Інструктор поставив ціль: «Попрацюйте краще над стрільбою». Який принцип теорії Локка і Латама порушено?", ["Ціль має бути конкретною і вимірюваною", "Ціль має бути легкою", "Ціль має ставити сам курсант", "Ціль не повинна мати термінів"], "Локк і Латам: ціль складна, але досяжна, конкретна, вимірювана, прийнята людиною, з регулярним зворотним зв’язком."], ["Яка мотивація найстійкіша?", ["Внутрішня — задоволення від процесу, відчуття компетентності", "Зовнішня позитивна", "Негативна", "Матеріальна"], "Внутрішня мотивація найстійкіша; зовнішня ефективна, але менш стійка."], ["Чим небезпечна негативна мотивація у довгостроковій перспективі?", ["Викликає стрес і вбиває ініціативу", "Вона надто м’яка", "Вона дорога", "Вона не діє взагалі"], "Негативна мотивація діє коротко, викликає стрес і знижує ініціативу; основний акцент — на позитивних методах."], ["Що означає SMART у принципі усвідомленості цілей?", ["Конкретні, вимірювані, досяжні, доречні, обмежені в часі", "Прості, масові, активні, реальні, точні", "Складні, мотивуючі, амбітні, ризиковані, творчі", "Стандартні, затверджені, обов’язкові"], "SMART — конкретні, вимірювані, досяжні, доречні й обмежені в часі цілі."], ["Інструктор заохочує одних курсантів за те, за що інших карає. Який принцип порушено?", ["Справедливість — однакові правила для всіх", "Індивідуальний підхід", "Залучення", "Сприятливе середовище"], "Справедливість: однакові правила заохочення й покарання для всіх."], ["Що з переліченого — метод внутрішньої мотивації?", ["Показати, як знання знадобляться в бою, і розповісти історії випускників", "Подяка перед строєм", "Додаткове звільнення", "Попередження про покарання"], "Внутрішня мотивація: зв’язок з бойовою потребою, історії успіху, інтерактив, відзначення прогресу."], ["Яким має бути зворотний зв’язок для мотивації?", ["Частим, конкретним, своєчасним, на основі фактів і з рекомендаціями", "Рідким, щоб не набриднути", "Лише в кінці курсу", "Загальним, без деталей"], "Зворотний зв’язок: частий, конкретний, з рекомендаціями, на фактах, своєчасний."], ["Коли допустимо застосовувати зовнішню негативну мотивацію?", ["Лише як крайній захід — справедливо, послідовно, з акцентом на виправленні", "Як основний метод для дисципліни", "Ніколи за жодних умов", "Лише для слабких курсантів"], "Негативна — лише як крайній захід: чіткі правила, послідовність, виправлення помилки, а не приниження."], ["Що Маслоу пов’язував із самореалізацією на вершині піраміди?", ["Прагнення розкрити потенціал і «буттєві» цінності: істину, добро, справедливість", "Матеріальний добробут", "Безпеку родини", "Повагу колег"], "Самореалізація — розкриття потенціалу, пов’язане з вищими «буттєвими» цінностями."]]}, {"id": "b1m2t2z5", "code": "Б1 М2 Т2 З5", "theme": "Тема 2. Фактори та принципи навчання", "title": "Прийоми та способи впливу інструктора на курсантів", "short": "Прийоми впливу", "passport": {"goal": "Довести до військовослужбовців прийоми та способи впливу інструктора на курсантів.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Фактори, які спонукають до навчання; прийоми та способи впливу", "Вплив попередньо набутих знань і досвіду", "Рекомендації щодо позитивного впливу", "Способи та методи управління класом"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає фактори, що спонукають до навчання, прийоми впливу і методи управління класом.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.5; презентація"}, "sections": [{"h": "Що спонукає до навчання", "body": [["p", "Є чотири основні фактори, які дозволяють досягти найкращого результату в найкоротший термін і з мінімальними зусиллями:"], ["ul", ["<b>Знання власних досягнень</b> — курсант бачить, що виконав правильно, а що ні, і свій прогрес: результати стрільб, фізичних нормативів, рейтинг оцінок.", "<b>Взаємодія інструктор — курсант</b> — навчання найефективніше, коли зв’язок двосторонній.", "<b>Системність і структура</b> — послідовний виклад, виділення основного, логічний перехід від відомого до нового.", "<b>Результативне застосування знань</b> — матеріал максимально наближений до реального життя і служби курсантів."]], ["p", "Вплив — дія, яку одна особа виявляє стосовно іншої. Він буває прямим і непрямим, а основні форми прояву — <b>авторитет, переконання і примус</b>. Інструктор повинен усвідомлювати цілі й наслідки свого впливу."]]}, {"h": "Прийоми впливу інструктора", "body": [["p", "Прийоми впливу застосовуються етично, професійно і з урахуванням особливостей курсантів:"], ["ul", ["<b>Переконання і пояснення</b> — логічне обґрунтування правил і вимог фактами й доказами.", "<b>Прохання і порада</b> — звернення до свідомості й відповідальності, рекомендації з власного досвіду.", "<b>Заохочення і стимулювання</b> — позитивна оцінка зусиль, нагороди, здорова конкуренція.", "<b>Критика і зауваження</b> — обґрунтовані, конкретні, спрямовані на вчинок, а не на особистість.", "<b>Нагадування і попередження</b> — увага до правил і можливих наслідків.", "<b>Особистий приклад</b> — курсанти наслідують поведінку наставника.", "<b>Проблемна ситуація і ситуація успіху</b> — завдання на роздуми і можливість відчути досягнення.", "<b>Ігнорування</b> — у разі дрібних провокацій тимчасове ігнорування припиняє небажану поведінку без зайвої уваги.", "<b>Емоційний, соціальний та інформаційний вплив</b> — емпатія, позитивні групові норми, потрібна інформація для свідомих рішень.", "<b>Статутні вимоги</b> — посилання на статути для обґрунтування вимог."]], ["key", "Критикуємо вчинок, а не людину. Вплив має розвивати відповідальність і самостійність курсанта."]]}, {"h": "Попередній досвід курсантів", "body": [["p", "Попередні знання і досвід можуть і допомагати, і заважати навчанню."], ["p", "<b>Позитивний вплив:</b> легше зрозуміти новий матеріал і пов’язати його з відомим; швидше опанувати нову модифікацію знайомої техніки; розвинене критичне мислення; вища мотивація; кращі практичні навички; обмін досвідом збагачує групу; зріліше ставлення до навчання."], ["p", "<b>Негативний вплив:</b> інтерференція — старі звички заважають новим (нова модель зброї вимагає відмови від звичних рухів); консерватизм і опір новому; самовпевненість і недооцінка матеріалу; стереотипи; різний рівень підготовки в групі."], ["p", "Як урахувати досвід: вхідне оцінювання; пов’язувати нову тему з відомим; давати ділитися досвідом; розбирати реальні ситуації зі служби; диференційований підхід; чітко пояснювати відмінності нового від старого."]]}, {"h": "Як здійснювати позитивний вплив", "body": [["ul", ["<b>Встановіть контакт і довіру:</b> будьте доброзичливим, запам’ятовуйте імена, уважно слухайте, ставтеся до всіх однаково, без фаворитів, поважайте кожного.", "<b>Покажіть професіоналізм:</b> високий рівень знань і дисципліни, доступна мова, чіткі завдання й вимоги.", "<b>Застосовуйте позитивні методи:</b> відзначайте навіть невеликі успіхи, давайте конструктивні коментарі, можливість приймати рішення.", "<b>Враховуйте індивідуальність:</b> кожен навчається у власному темпі; допомагайте тим, кому важко.", "<b>Створюйте групову динаміку:</b> командна робота, правила взаємоповаги, відповідальність за групу.", "<b>Будьте послідовним і системним</b> у вимогах і діях.", "<b>Розвивайтеся самі:</b> аналізуйте свої методи, приймайте зворотний зв’язок від курсантів і колег."]]]}, {"h": "Управління класом", "body": [["p", "<b>Організаційні методи:</b> на початку курсу чітко довести правила поведінки і алгоритми типових дій — вхід, вихід, запитання, здача робіт; завчасно готувати матеріали й обладнання; облаштувати клас так, щоб бачити всіх; дотримуватися плану заняття."], ["p", "<b>Дисциплінарні методи:</b> позитивне підкріплення бажаної поведінки; корекція небажаної — спокійне попередження, конкретне зауваження без критики особистості, позбавлення привілеїв у межах статуту, педагогічно обґрунтовані додаткові завдання, звернення до старшого керівництва. Принципи — невідворотність, справедливість і послідовність."], ["p", "<b>Залученість і мотивація:</b> активні методи, спільні цілі, віра в успіх курсантів, доречний гумор, можливість вибору."], ["p", "<b>Комунікація:</b> чітка мова без незрозумілих термінів, активне слухання, невербальні сигнали, регулярний зворотний зв’язок, індивідуальні бесіди."], ["p", "<b>Управління конфліктами:</b> раннє виявлення, вислухати кожну сторону, шукати компроміс; якщо курсанти не можуть домовитися — інструктор виступає медіатором або ухвалює остаточне рішення."]]}], "keys": ["Чотири фактори: знання власних досягнень, взаємодія інструктор — курсант, системність, застосування знань.", "Форми впливу: авторитет, переконання, примус.", "Критика — конструктивна і спрямована на вчинок, а не на особистість.", "Попередній досвід може допомагати і заважати (інтерференція, консерватизм, самовпевненість).", "Дисципліна: позитивне підкріплення, невідворотність, справедливість, послідовність."], "test": [["Інструктор щодня вивішує рейтинг результатів стрільб і нормативів. Який фактор, що спонукає до навчання, він використовує?", ["Знання власних досягнень", "Системність і структура", "Взаємодія інструктор — курсант", "Результативне застосування знань"], "Знання власних досягнень: курсант бачить, що виконав правильно, і свій прогрес."], ["Які три основні форми прояву впливу?", ["Авторитет, переконання, примус", "Похвала, критика, ігнорування", "Наказ, прохання, порада", "Приклад, гумор, емпатія"], "Вплив буває прямим і непрямим; основні форми — авторитет, переконання і примус."], ["Інструктор сказав: «Ти лінивий і ніколи не станеш бійцем». Яке правило критики порушено?", ["Критика має бути спрямована на вчинок, а не на особистість", "Критика має бути публічною", "Критика має бути рідкою", "Порушень немає"], "Критика — обґрунтована, конкретна, спрямована на вчинок, а не на людину."], ["Курсант на задньому ряду демонстративно позіхає, щоб відволікти увагу. Який прийом рекомендовано для такої дрібної провокації?", ["Тимчасове ігнорування", "Публічне покарання", "Виведення з класу", "Доповідь командиру роти"], "Ігнорування: у разі дрібних провокацій тимчасове ігнорування припиняє небажану поведінку без зайвої уваги."], ["Інструктор дає слабкому курсанту завдання, з яким той гарантовано впорається на очах у групи. Який прийом?", ["Ситуація успіху", "Проблемна ситуація", "Статутні вимоги", "Нагадування і попередження"], "Ситуація успіху — можливість відчути досягнення; проблемна ситуація — завдання на роздуми."], ["Досвідчений стрілець на новій моделі гвинтівки за звичкою робить зайві рухи. Як називається цей негативний вплив досвіду?", ["Інтерференція — старі звички заважають новим", "Консерватизм", "Стереотип", "Самовпевненість"], "Інтерференція: старі звички заважають новим, нова модель вимагає відмови від звичних рухів."], ["Як інструктор може врахувати різний попередній досвід групи на початку курсу?", ["Провести вхідне оцінювання і застосувати диференційований підхід", "Ігнорувати досвід, щоб усі були рівні", "Посадити досвідчених окремо без завдань", "Пропустити базові теми для всіх"], "Урахування досвіду: вхідне оцінювання, зв’язок з відомим, обмін досвідом, диференційований підхід, пояснення відмінностей."], ["Що з переліченого — ПОЗИТИВНИЙ вплив попереднього досвіду?", ["Швидше опанування нової модифікації знайомої техніки", "Опір новому", "Недооцінка матеріалу", "Стереотипи"], "Позитивний вплив: легше зрозуміти нове, швидше опанувати модифікацію, вища мотивація."], ["Інструктор помічає, що завжди хвалить одних і тих самих курсантів. Яку рекомендацію позитивного впливу він порушує?", ["Ставитися до всіх однаково, без фаворитів", "Бути послідовним у вимогах", "Розвиватися самому", "Створювати групову динаміку"], "Контакт і довіра: доброзичливість, імена, уважність, однакове ставлення без фаворитів."], ["Що з переліченого — організаційний метод управління класом?", ["На початку курсу довести правила поведінки і алгоритми типових дій", "Позбавлення привілеїв у межах статуту", "Медіація в конфлікті", "Індивідуальна бесіда"], "Організаційні методи: правила і алгоритми дій, підготовка матеріалів, облаштування класу, дотримання плану."], ["Яка послідовність корекції небажаної поведінки найбільш педагогічно обґрунтована?", ["Спокійне попередження → конкретне зауваження → статутні заходи → звернення до керівництва", "Звернення до командира → попередження → ігнорування", "Крик → покарання → бесіда", "Одразу позбавлення привілеїв"], "Корекція: спокійне попередження, зауваження без критики особистості, позбавлення привілеїв у межах статуту, звернення до керівництва."], ["Двоє курсантів посварилися і не можуть домовитися. Яка роль інструктора?", ["Вислухати обидві сторони, бути медіатором або ухвалити остаточне рішення", "Покарати обох однаково без розбору", "Не втручатися", "Перевести одного в інший взвод"], "Управління конфліктами: раннє виявлення, вислухати кожного, компроміс; інакше — медіатор або остаточне рішення."], ["Посилання на статут для обґрунтування вимоги — це який прийом?", ["Статутні вимоги", "Переконання і пояснення", "Інформаційний вплив", "Примус"], "Статутні вимоги — посилання на статути для обґрунтування вимог."], ["Яка мета будь-якого впливу інструктора?", ["Розвивати відповідальність і самостійність курсанта", "Забезпечити беззаперечне підкорення", "Зменшити кількість запитань", "Підвищити власний авторитет"], "Вплив має розвивати відповідальність і самостійність курсанта."], ["Які принципи застосування дисциплінарних заходів?", ["Невідворотність, справедливість і послідовність", "Суворість і швидкість", "Публічність і жорсткість", "Гнучкість і вибірковість"], "Дисциплінарні методи застосовують за принципами невідворотності, справедливості й послідовності."]]}, {"id": "b1m2t3z1", "code": "Б1 М2 Т3 З1", "theme": "Тема 3. Якості інструктора", "title": "Основні якості та характеристики інструктора", "short": "Якості інструктора", "passport": {"goal": "Ознайомити військовослужбовців з якостями та характеристиками, якими повинен володіти інструктор.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Якості хорошого інструктора", "Важливість цих якостей для результату навчання", "Як розвивати потрібні якості", "Якостей і стилів поведінки, яких слід уникати"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає, якими якостями має володіти інструктор, і яких слід уникати.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 3.1; презентація; тест за темою"}, "sections": [{"h": "П’ять ключових якостей", "body": [["p", "Хорошим інструктором не народжуються — ним стають. Основні якості легко запам’ятати: <b>впевненість, вихованість, ставлення, старанність, ентузіазм</b>."], ["p", "<b>Впевненість.</b> Щоб переконливо викладати, інструктор має випромінювати впевненість. Вона зростає, якщо:"], ["ul", ["глибоко знаєте предмет;", "маєте бездоганні особисті стандарти;", "ретельно готуєтеся і плануєте навчання;", "заздалегідь добре організовуєте заняття."]], ["p", "Обізнаність, планування і тренування дають упевненість в успіху, а з нею приходить повага курсантів."]]}, {"h": "Вихованість: мова, рухи, вигляд", "body": [["p", "Вихованість інструктора — це поєднання мови, рухів, жестів, поведінки і зовнішнього вигляду."], ["ul", ["<b>Мова</b> — гучна, чітка, розбірлива; уникайте одноманітного тону. Зміна ритму, швидкості й гучності утримує увагу. Щоб перевірити голос, запишіть себе на занятті і проаналізуйте запис.", "<b>Рухи</b> — плавні й легкі. Час від часу рухайтеся для кращого контакту з аудиторією, але без зайвих рухів, що відволікають.", "<b>Зовнішній вигляд і поведінка</b> — крім польових занять, бездоганний вигляд і відповідна манера. Будь-яку слабкість чи недоречне висловлювання курсанти помітять одразу."]]]}, {"h": "Ставлення, старанність, ентузіазм", "body": [["p", "<b>Ставлення</b> — інструктор є прикладом ставлення до предмета. Воно включає:"], ["ul", ["<b>чесність і справедливість</b> — без фаворитів, без висміювання тих, хто відстає, без зловживання становищем;", "<b>твердість, рішучість, надійність</b> — чіткі межі стосунків, не дозволяти порушувати порядок, за потреби відновлювати контроль;", "<b>дружність</b> — підтримка, визнання досягнень, заохочення ініціативи створюють взаємну повагу."]], ["p", "<b>Старанність</b> — абсолютна передумова успіху і репутації: прагнення до досконалості, увага до деталей, вимогливість до себе й курсантів, постійне самовдосконалення."], ["p", "<b>Ентузіазм</b> — курсанти миттєво помічають байдужість інструктора, і бажання вчитися зникає. Хороший інструктор ефективно подасть навіть нецікавий предмет. Усі теми важливі, усі теми цікаві — а власні проблеми залишаються за дверима класу."]]}, {"h": "Чому ці якості такі важливі", "body": [["ul", ["знання предмета і комунікативні навички дозволяють чітко доносити інформацію;", "ентузіазм і вміння надихати забезпечують активну участь і мотивацію;", "справедливість, емпатія, терпіння створюють атмосферу довіри і безпеки;", "вимогливість, послідовність і чіткі правила забезпечують дисципліну;", "спостережливість дозволяє підлаштувати методи під кожного;", "особистий приклад і професіоналізм виховують курсантів."]], ["key", "Без цих якостей навчання стає формальністю. З ними інструктор — не просто передавач знань, а наставник, лідер і мотиватор."]]}, {"h": "Як розвивати якості інструктора", "body": [["p", "<b>Формальна підготовка:</b> курси інструкторів і спеціалізовані курси з педагогіки, психології навчання дорослих, управління групою, комунікації; тренінги лідерства; вивчення військової педагогіки; семінари; робота під керівництвом досвідчених інструкторів."], ["p", "<b>Саморозвиток:</b> проводити заняття помічником досвідченого інструктора; самостійно готувати й проводити окремі елементи занять; просити зворотний зв’язок у курсантів і колег; регулярно аналізувати свої заняття; тренувати активне слухання і чіткість висловлювань; розвивати лідерські й організаційні навички; працювати над самодисципліною, відповідальністю і стресостійкістю."]]}, {"h": "Чого інструктор уникає", "body": [["p", "<b>Негативні якості:</b> некомпетентність, відсутність чіткої позиції, необ’єктивність і «улюбленці», нервозність і спалахи гніву, недбала підготовка і запізнення, демонстрація зверхності, нечесність і невиконання обіцянок."], ["p", "<b>Неприйнятні стилі поведінки:</b> авторитарність без діалогу; панібратство і втрата дистанції; залякування і погрози; ігнорування конфліктів; непослідовність; демонстративна втома і байдужість."], ["p", "<b>Неприпустимі стилі спілкування:</b> образливі висловлювання, сарказм і лайка; критика особистості замість дій; монолог замість діалогу; незрозуміла мова; крик; ігнорування запитань; плітки й обговорення особистого життя курсантів."], ["warn", "Також погано: безвідповідальне використання часу заняття, постійне читання з конспекту, перекладання на курсантів власних проблем і пошук виправдань своєї некомпетентності."]]}], "keys": ["П’ять якостей: впевненість, вихованість, ставлення, старанність, ентузіазм.", "Впевненість дають знання предмета, бездоганні стандарти, підготовка й організація.", "Мова гучна і чітка, без одноманітного тону; рухи плавні; вигляд бездоганний.", "Ставлення: чесність, твердість, дружність — без фаворитів і без панібратства.", "Не можна: крик, сарказм, приниження, критика особистості, читання з конспекту."], "test": [["Які п’ять ключових якостей інструктора названо на занятті?", ["Впевненість, вихованість, ставлення, старанність, ентузіазм", "Сила, витривалість, знання, дисципліна, гумор", "Суворість, справедливість, точність, швидкість, досвід", "Харизма, голос, зріст, вислуга, звання"], "Ключові якості: впевненість, вихованість, ставлення, старанність, ентузіазм."], ["Молодий інструктор нервує перед заняттям. Що за матеріалом найкраще підвищить його впевненість?", ["Глибоке знання предмета, ретельне планування й організація заняття", "Гучніший голос", "Суворіші вимоги до курсантів", "Скорочення заняття"], "Впевненість зростає від знання предмета, бездоганних стандартів, ретельної підготовки й організації."], ["Як інструктору перевірити й покращити свій голос?", ["Записати себе на занятті і проаналізувати запис", "Говорити якомога гучніше", "Читати з конспекту", "Попросити курсантів сидіти ближче"], "Мова — гучна, чітка, без монотонності; перевірити — записати себе і проаналізувати."], ["Інструктор весь час говорить однаковим рівним тоном. Що порушено?", ["Мова має змінювати ритм, швидкість і гучність, щоб утримувати увагу", "Мова має бути тихою", "Нічого — рівний тон заспокоює", "Темп має бути лише швидким"], "Уникайте одноманітного тону: зміна ритму, швидкості й гучності утримує увагу."], ["Яку вимогу до рухів інструктора дає матеріал?", ["Плавні й легкі, час від часу рух для контакту, без зайвих рухів", "Стояти нерухомо за трибуною", "Постійно ходити класом", "Активно жестикулювати весь час"], "Рухи плавні й легкі; рухатися для контакту з аудиторією, але без відволікальних рухів."], ["Інструктор висміяв курсанта, що відстає. Яка складова «ставлення» порушена?", ["Чесність і справедливість", "Твердість і рішучість", "Старанність", "Ентузіазм"], "Чесність і справедливість: без фаворитів, без висміювання тих, хто відстає, без зловживань."], ["Курсанти почали порушувати порядок, і інструктор відновлює контроль, чітко окреслюючи межі. Яку рису він проявляє?", ["Твердість, рішучість, надійність", "Дружність", "Ентузіазм", "Вихованість"], "Твердість, рішучість, надійність — чіткі межі стосунків і відновлення контролю."], ["Тема заняття сама по собі нудна. Що за матеріалом має зробити інструктор?", ["Подати її з ентузіазмом — усі теми важливі й цікаві", "Скоротити її до мінімуму", "Попередити курсантів, що буде нудно", "Перенести на самопідготовку"], "Хороший інструктор ефективно подасть навіть нецікавий предмет; байдужість миттєво вбиває бажання вчитися."], ["Що названо абсолютною передумовою успіху і репутації інструктора?", ["Старанність", "Харизма", "Вислуга років", "Бойовий досвід"], "Старанність — абсолютна передумова успіху і репутації: прагнення досконалості, увага до деталей."], ["Яка якість дозволяє інструктору підлаштувати методи під кожного курсанта?", ["Спостережливість", "Вимогливість", "Ентузіазм", "Впевненість"], "Спостережливість дозволяє підлаштувати методи під кожного."], ["Що з переліченого — шлях саморозвитку, а не формальної підготовки?", ["Проводити заняття помічником досвідченого інструктора і просити зворотний зв’язок", "Курс інструкторів", "Тренінг лідерства", "Семінар з військової педагогіки"], "Саморозвиток: помічник досвідченого інструктора, окремі елементи занять, зворотний зв’язок, аналіз своїх занять."], ["Інструктор переходить з курсантами на «ти», жартує про особисте і втрачає дистанцію. Як називається цей неприйнятний стиль?", ["Панібратство", "Авторитарність", "Непослідовність", "Залякування"], "Неприйнятні стилі: авторитарність без діалогу, панібратство і втрата дистанції, залякування, непослідовність."], ["Що з переліченого — неприпустимий стиль спілкування?", ["Монолог замість діалогу", "Активне слухання", "Чітка мова", "Відповіді на запитання"], "Неприпустимо: образи, сарказм, критика особистості, монолог замість діалогу, крик, ігнорування запитань."], ["Інструктор усе заняття читає з конспекту. Як це оцінено в матеріалі?", ["Погано — разом із безвідповідальним використанням часу і пошуком виправдань", "Добре — так нічого не пропуститься", "Нейтрально", "Добре для складних тем"], "Погано: постійне читання з конспекту, безвідповідальне використання часу, перекладання проблем на курсантів."], ["У якому випадку вимога бездоганного зовнішнього вигляду інструктора може бути пом’якшена?", ["На польових заняттях", "Ніколи", "На лекціях", "У вихідні"], "Крім польових занять, вигляд і манера мають бути бездоганними."]]}, {"id": "b1m2t3z2", "code": "Б1 М2 Т3 З2", "theme": "Тема 3. Якості інструктора", "title": "Принципи навчання", "short": "Принципи навчання", "passport": {"goal": "Ознайомити військовослужбовців з принципами навчання.", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Основні принципи навчання", "Навчання на власних помилках і через розуміння та вирішення проблем"], "assess": "Усне опитування після навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає і розуміє принципи навчання на власних помилках та через розуміння і вирішення проблеми.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 3.2; презентація"}, "sections": [{"h": "Основні принципи навчання", "body": [["p", "Принципи навчання — фундамент педагогічного процесу: вимоги до організації навчання, що дають найкращий результат. У військовій підготовці найважливіші:"], ["ul", ["<b>Науковості</b> — навчання базується на військових науках, бойовому досвіді, сучасних технологіях і озброєнні.", "<b>Систематичності й послідовності</b> — від простого до складного з урахуванням спеціалізації і рівня підготовки.", "<b>Доступності</b> — матеріал адаптовано до рівня військовослужбовців, але з подоланням труднощів.", "<b>Наочності</b> — карти, схеми, макети, відео бойових дій, практичні демонстрації.", "<b>Активності й самостійності</b> — практичні заняття, тренування, ініціатива в прийнятті рішень.", "<b>Свідомості й творчої активності</b> — розуміння важливості навчання для бойових завдань і творче застосування знань.", "<b>Міцності засвоєння</b> — багаторазове повторення до автоматизму.", "<b>Індивідуалізації і диференціації</b> — урахування здібностей і темпу, але з акцентом на злагодженість підрозділу.", "<b>Виховуючого навчання</b> — формування морально-бойових якостей; особистий приклад командира вирішальний.", "<b>Зв’язку теорії з практикою</b> — максимальне наближення до бойової обстановки."]]]}, {"h": "Специфічні принципи військової педагогіки", "body": [["ul", ["<b>Колективізму і єдиноначальності</b> — уміння діяти в складі підрозділу, виконувати накази і нести колективну відповідальність.", "<b>Високої вимогливості і дисципліни</b> — сувора дисципліна готує до дій в екстремальних умовах.", "<b>Формування психологічної стійкості</b> — елементи психологічної підготовки для розвитку стресостійкості й витримки."]], ["key", "Військове навчання — це не лише знання, а й злагодженість, дисципліна і психологічна стійкість підрозділу."]]}, {"h": "Навчання на власних помилках", "body": [["p", "Помилки — невід’ємна частина навчання: неможливо опанувати навичку, не помиляючись. Через власні помилки людина отримує уроки, які допомагають не повторити їх у майбутньому. Неправильні дії поступово відкидаються, правильні — закріплюються."], ["p", "Принцип працює в чотири кроки:"], ["ul", ["<b>Контрольоване середовище для помилок</b> — симуляції, тренування, навчальні завдання, де помилка відчутна, але не катастрофічна. Страх покарання за кожну помилку паралізує ініціативу.", "<b>Розуміння причини</b> — не просто констатувати помилку, а з’ясувати, чому було прийняте неправильне рішення і які прогалини проявилися. Курсант аналізує власні дії, думки й почуття.", "<b>Вивчені уроки</b> — сформулювати конкретні практичні висновки і задокументувати їх.", "<b>Застосування досвіду</b> — коригувати власні алгоритми, щоб не повторити помилку в критичній ситуації."]], ["warn", "У військовій справі ціна помилки висока, тому помилятися треба на навчанні, а не в бою."]]}, {"h": "Переваги навчання на помилках", "body": [["ul", ["власна помилка запам’ятовується значно краще, ніж пасивно почута інформація;", "аналіз помилок розвиває самостійне мислення і розуміння причин і наслідків;", "усвідомлення наслідків виховує відповідальність і обережність;", "подолання помилок підвищує впевненість у собі;", "готує не здаватися перед неминучими труднощами."]]]}, {"h": "Навчання через розуміння і вирішення проблем", "body": [["p", "Цей принцип ґрунтується не на передаванні готової інформації, а на отриманні знань під час розв’язання теоретичних і практичних завдань. Таке навчання стимулює критичне мислення, дає справжній досвід, систематизує знання і пов’язує навчання з реальним життям."], ["p", "Отримавши завдання, курсанти спершу пробують старі знання, а якщо не виходить — шукають нові способи. Класичний приклад: з’єднати дев’ять точок чотирма прямими лініями, не відриваючи ручку. Це можливо, якщо зрозуміти, що лінії можуть виходити за межі уявного квадрата."], ["p", "Переваги: власне «відкриття» краще сприймається і запам’ятовується, курсант отримує задоволення від виконаного завдання. Недолік: інколи курсанти «застрягають» і відступають — інструктор має вчасно підказати напрям."]]}], "keys": ["Основні принципи: науковість, системність, доступність, наочність, активність, свідомість, міцність, індивідуалізація, виховуюче навчання, зв’язок теорії з практикою.", "Специфічні військові: колективізм і єдиноначальність, вимогливість і дисципліна, психологічна стійкість.", "Навчання на помилках: контрольоване середовище → причина → уроки → застосування.", "Навчання через вирішення проблем розвиває критичне мислення; власне відкриття запам’ятовується краще."], "test": [["Інструктор завжди пояснює, навіщо навичка потрібна в бою, і заохочує нестандартні рішення. Який принцип він реалізує?", ["Свідомості й творчої активності", "Міцності засвоєння", "Доступності", "Колективізму"], "Свідомість і творча активність: розуміння важливості навчання для бойових завдань і творче заст
