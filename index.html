кнути мікрофон", "Не перевіряти"], "Вас мають чути всі."], ["Що з переліченого — деструктивна поведінка?", ["Руки в кишенях або перебирання їх вмісту", "Відкритий зоровий контакт", "Доречні паузи", "Зміна інтонації"], "Вона відволікає аудиторію."], ["Як називають страх публічного виступу?", ["Глософобія", "Клаустрофобія", "Агорафобія", "Акрофобія"], "Поширене явище навіть серед досвідчених інструкторів."], ["Що найефективніше допомагає боротися зі страхом виступу?", ["Ретельна підготовка і репетиції", "Уникати виступів", "Читати з аркуша, не дивлячись на аудиторію", "Говорити якомога швидше"], "Чим глибше знаєте матеріал, тим упевненіше."], ["Які хвилини виступу варто відпрацювати найретельніше?", ["Перші хвилини", "Останні секунди", "Перерву", "Відповіді на тест"], "На початку хвилювання найсильніше, вдалий старт додає впевненості."], ["Як ставитися до дрібних помилок під час виступу?", ["Прийняти недосконалість — аудиторія лояльна", "Зупинити заняття", "Почати спочатку", "Вибачатися кожні дві хвилини"], "Важливіше донести основну ідею."], ["Що з переліченого — елемент проєктування емоцій?", ["Зоровий контакт, паузи, жести, інтонація, положення тіла, міміка", "Розмір шрифту", "Кількість слайдів", "Час перерви"], "Емоційний тон переконує, що тема серйозна."]]}, {"id": "b1m2t6z1", "code": "Б1 М2 Т6 З1", "theme": "Тема 6. Контроль навчання та оцінювання", "title": "Види контролю знань і навичок", "short": "Види контролю", "passport": {"goal": "Ознайомити з видами контролю теоретичних знань і практичних дій (умінь і навичок) під час навчання особового складу, типами тестів і методикою їх розробки.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Види контролю та їх призначення", "Вхідний, проміжний і підсумковий контроль; комплексний іспит", "Типи і види тестів, методика розробки, правила застосування", "Види оцінювання і контролю викладання"], "assess": "Усне опитування; письмова практична робота — скласти кілька тестів різного типу.", "criteria": "Позитивно — якщо знає види тестів і виконує практичне завдання щонайменше на 80% правильно.", "sources": "ДМ до СТІ 132Г.42К(Н).06, пп. 6.1.1–6.1.5; презентація «Види контролю знань та умінь»"}, "sections": [{"h": "Класифікація контролю", "body": [["p", "<b>За часом проведення:</b> вхідний (попередній), проміжний (поточний і рубіжний, модульний) та підсумковий."], ["p", "<b>За формою:</b> усний (опитування, бесіда, дискусія), письмовий (тести, контрольні роботи, есе), практичний (нормативи, вправи на тренажерах і полігонах, моделювання ситуацій), комбінований, а також самоконтроль."], ["p", "Вибір форми залежить від цілей навчання, змісту матеріалу, рівня підготовленості, часу, ресурсів і специфіки спеціальності."], ["key", "Контроль не лише оцінює прогрес — він вчасно показує прогалини, щоб інструктор міг скоригувати навчання."]]}, {"h": "Вхідний, проміжний, підсумковий", "body": [["p", "<b>Вхідний</b> — на початку навчання або нового розділу: визначає початковий рівень. Форми: усне опитування, невеликий тест, прості практичні завдання, анкетування. Результати — для формування груп, адаптації змісту, індивідуальної роботи. За презентацією — також для відбору на курс."], ["p", "<b>Проміжний</b> — регулярно після тем і на практичних заняттях: показує, як засвоюється матеріал, дає зворотний зв’язок і підстави для додаткових занять з відстаючими."], ["p", "<b>Підсумковий</b> — на завершальному етапі, охоплює весь матеріал: письмові, усні та практичні іспити (заліки). За результатами вирішують, чи може людина проходити службу на посаді."], ["key", "Вхідний — «з чого починаємо», проміжний — «як іде», підсумковий — «чи готовий»."]]}, {"h": "Комплексний іспит", "body": [["p", "Комплексний іспит — форма підсумкового контролю, що одночасно оцінює знання та навички з кількох взаємопов’язаних дисциплін."], ["ul", ["<b>інтегрований зміст</b> — завдання охоплюють різні, але пов’язані розділи;", "<b>комплексні практичні завдання</b> — моделювання ситуацій, комплексні нормативи, ситуаційні задачі, захист проєктів;", "<b>комісійний прийом</b> — комісія з фахівців різних напрямків;", "<b>багаторівнева оцінка</b> — не лише правильність, а й мислення, рішення, комунікація, робота в команді;", "можливе поетапне виконання з оцінкою кожного етапу;", "реальне обладнання та імітаційні засоби для наближення до бойових умов."]], ["key", "Комплексний іспит показує, чи вміє військовослужбовець застосовувати знання разом — як у реальному бою."]]}, {"h": "Типи і види тестів", "body": [["p", "<b>Об’єктивні</b> — з однозначними критеріями: так/ні, вибір однієї відповіді, множинний вибір, на відповідність (класифікований), рейтинговий (упорядкування), вставка (заповнення пропуску). <b>Суб’єктивні</b> — оцінка залежить від експерта: коротка відповідь, перерахування, найменування, пояснення, есе, курсова чи дипломна робота."], ["p", "Усні тести — питання, на які курсант відповідає своїми словами; перевіряють фактичні, процедурні та інтегровані знання. Готуються швидко, але тривають довше. Практичні тести — курсант демонструє навичку."], ["p", "За метою: тести досягнень (найпоширеніші), діагностичні, прогностичні, тести здібностей, тести особистості."], ["key", "Приклади з курсу: фактичне знання — «Калібр АК?»; процедурне — «Чому стрілець стоїть праворуч від дерева?»; інтегроване — описати й захистити рішення за 10 хвилин."]]}, {"h": "Як розробити тест", "body": [["ul", ["визначити мету тестування — що саме оцінюємо;", "проаналізувати навчальний зміст;", "скласти специфікацію — скільки завдань з кожної теми, складність, тип;", "сформулювати завдання: стебло з однією проблемою, однозначно правильна відповідь, правдоподібні дистрактори, без підказок;", "для суб’єктивних тестів — заздалегідь визначити критерії оцінювання;", "написати інструкцію — правила, час, спосіб позначення відповідей;", "пілотувати тест на невеликій групі, проаналізувати й виправити;", "розробити ключ або схему оцінювання."]], ["p", "Правила застосування: стандартизовані умови для всіх, чітке інструктування, часові рамки, конфіденційність, об’єктивна перевірка за ключем, зворотний зв’язок і розбір помилок, етичність (запобігання списуванню). Тест — лише один із інструментів контролю."]]}, {"h": "Контроль викладання", "body": [["p", "Викладання теж потребує систематичного оцінювання:"], ["ul", ["<b>самооцінювання</b> — рефлексія після занять, аналіз відеозаписів, щоденник інструктора;", "<b>взаємооцінювання колегами</b> — відвідування заняття і зворотний зв’язок;", "<b>оцінювання керівництвом</b> — відповідність стандартам, перевірка план-конспектів, результатів;", "<b>зворотний зв’язок від курсантів</b> — анкети, опитування;", "<b>аналіз результатів курсантів</b> — низькі результати групи можуть означати потребу змінити методи."]], ["key", "Різнобічне оцінювання дає об’єктивну картину роботи інструктора і напрямки вдосконалення."]]}], "keys": ["За часом: вхідний, проміжний (поточний, рубіжний), підсумковий.", "За формою: усний, письмовий, практичний, комбінований, самоконтроль.", "Комплексний іспит: інтегрований зміст, комісія, багаторівнева оцінка.", "Тести: об’єктивні та суб’єктивні.", "Завдання тесту: одна проблема, однозначна відповідь, правдоподібні дистрактори.", "Практична робота зараховується від 80% правильних відповідей."], "test": [["Які види контролю виділяють за часом проведення?", ["Вхідний, проміжний, підсумковий", "Усний, письмовий, практичний", "Об’єктивний і суб’єктивний", "Денний і нічний"], "Проміжний поділяють на поточний і рубіжний."], ["Яка мета вхідного контролю?", ["Визначити початковий рівень підготовленості", "Видати свідоцтво", "Оцінити інструктора", "Скласти розклад"], "Дозволяє адаптувати навчання до аудиторії."], ["Коли проводиться рубіжний (модульний) контроль?", ["Після завершення логічно завершеного обсягу матеріалу — модуля чи розділу", "Щодня на шикуванні", "До початку навчання", "Лише після випуску"], "Різновид проміжного контролю."], ["Для чого служить підсумковий контроль?", ["Визначити загальний рівень і вирішити, чи може людина проходити службу на посаді", "Познайомитися з курсантами", "Перевірити справність проєктора", "Розподілити наряди"], "Охоплює весь матеріал."], ["Що з переліченого — особливість комплексного іспиту?", ["Інтегрований зміст і комісійний прийом", "Один інструктор і одне питання", "Лише усна форма", "Без практичних завдань"], "Ще — багаторівнева оцінка і поетапне виконання."], ["Що відрізняє об’єктивні тести?", ["Чіткі однозначні критерії оцінювання", "Оцінка за думкою екзаменатора", "Розгорнута відповідь", "Відсутність ключа"], "Наприклад, вибір відповіді чи так/ні."], ["Який тест суб’єктивний?", ["Есе або коротка відповідь", "Так/ні", "Вибір однієї відповіді", "На встановлення відповідності"], "Оцінювання залежить від експерта."], ["Який вид тестів найпоширеніший у навчальному процесі?", ["Тести досягнень", "Тести особистості", "Прогностичні", "Тести здібностей"], "Оцінюють засвоєння конкретного матеріалу."], ["Яким має бути стебло тестового завдання?", ["Чітким і містити лише одну проблему", "Довгим і заплутаним", "З підказкою на правильну відповідь", "Без питання"], "Так результат буде валідним."], ["Якими мають бути дистрактори?", ["Правдоподібними, але очевидно невірними для того, хто знає матеріал", "Абсурдними", "Теж правильними", "Однаковими"], "Інакше тест нічого не перевіряє."], ["Що таке специфікація тесту?", ["План: кількість завдань за темами, складність і тип", "Ключ відповідей", "Бланк для курсанта", "Протокол перевірки"], "Забезпечує репрезентативність."], ["Навіщо пілотувати тест?", ["Щоб виявити недоліки завдань та інструкції і оцінити час", "Щоб показати тест заздалегідь усім курсантам", "Щоб скоротити кількість питань до одного", "Пілотування заборонене"], "Апробація на невеликій схожій групі."], ["Який мінімальний результат практичного завдання на цьому занятті?", ["80% правильних відповідей", "50%", "30%", "100%"], "Так у критеріях оцінювання."], ["Яка особливість усних тестів?", ["Готуються швидко, але тривають довше, якщо перевіряти кожного", "Перевіряються автоматично", "Не потребують чітких формулювань", "Підходять лише для нормативів"], "Питання формулюються дуже чітко."], ["Що з переліченого — вид контролю викладання?", ["Самооцінювання інструктора через аналіз відеозапису заняття", "Чищення зброї", "Добовий наряд", "Строєвий огляд"], "Також оцінювання колегами, керівництвом, курсантами."], ["Що може означати низький результат усієї групи?", ["Потребу переглянути методи викладання", "Що курсанти ліниві, і нічого міняти не треба", "Що тест був зайвий", "Нічого"], "Аналіз результатів — індикатор якості викладання."]]}, {"id": "b1m2t6z2", "code": "Б1 М2 Т6 З2", "theme": "Тема 6. Контроль навчання та оцінювання", "title": "Оформлення документації з обліку підготовки", "short": "Облікова документація", "passport": {"goal": "Ознайомити з правилами оформлення та ведення документації, необхідної для проведення навчання.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція / практичне заняття; аудиторія", "questions": ["Основна облікова документація, що необхідна для проведення навчання", "Порядок і правила ведення основної облікової документації"], "assess": "Відповіді на запитання протягом заняття; практичне завдання в кінці.", "criteria": "Позитивно — якщо надав відповіді на запитання і виконав практичне завдання.", "sources": "Презентація «Порядок оформлення та ведення документації з обліку підготовки»; Курс стрільб (КРП 03.032.056-2018), розд. 3"}, "sections": [{"h": "Що таке облікова документація", "body": [["p", "<b>Облікова документація</b> — сукупність документів, у яких фіксують, реєструють і зберігають інформацію про діяльність, події, людей, майно або процеси."], ["p", "Основні документи обліку підготовки:"], ["ul", ["<b>Журнал обліку бойової підготовки (ЖБП)</b>;", "<b>оціночні відомості</b>;", "<b>картка обліку виконання вправ стрільб</b> (картка настрілу)."]], ["key", "Що не записано — того не було. Облік підтверджує, що навчання проведене і результат досягнутий."]]}, {"h": "Журнал бойової підготовки", "body": [["p", "ЖБП — службовий документ підрозділу, у якому фіксують усе, що стосується навчання: перелік предметів, іменний список, теми, дати і час занять, керівника заняття, оцінки та присутність."], ["ul", ["оформлюється на навчальний період; веде командир навчального взводу (інструктор взводу) — за кожного курсанта;", "до початку навчання журнал <b>прошитий, пронумерований і зареєстрований</b> установленим порядком;", "під час занять журнал — у командира (інструктора) взводу;", "заповнюється <b>чорним чорнилом</b>;", "командир взводу на сторінці 2 розписується, що ознайомлений з правилами ведення;", "зберігається протягом календарного року, потім знищується встановленим порядком."]], ["warn", "Журнал з навчальними записами — службовий документ. Не можна виносити його, вести олівцем чи дописувати «заднім числом»."]]}, {"h": "Розділи журналу", "body": [["ul", ["<b>Розділ 2</b> «Зміст журналу» — розділи і номери сторінок;", "<b>Розділ 3</b> — список особового складу за штатно-посадовим розрахунком (заповнюється на самопідготовці);", "<b>Розділ 4</b> — облік за предметами навчання в послідовності Програми бойової підготовки;", "<b>Розділ 5</b> — облік виконання нормативів (практичних робіт): індивідуальна оцінка за кожен норматив;", "<b>Розділи 6 і 7</b> — стрільби і водіння; у розділі 6 графа «вид зброї» ділиться на дві частини, у другій — оцінка за матеріальну частину;", "<b>Розділ 8</b> — вправи ВСК: у графі «дата» — дата і форма одягу («с» — спортивна, «в» — військова); в оцінці: чисельник — результат, знаменник — бали;", "<b>Розділ 9</b> — результати контролю: зауваження перевіряючих; інструктор записує, що недоліки усунено (або причину), дату, і розписується."]]]}, {"h": "Оціночні відомості", "body": [["p", "Оціночна відомість — документ, у який вносять результати теоретичних знань, практичних дій і навичок. Види:"], ["ul", ["<b>за СТІ</b> — посада, звання, ПІБ; предмет і дата; навчальні питання/практичні завдання; бали й оцінка; підпис керівника заняття;", "<b>за виконання нормативів</b> — номер і назва нормативу, час, оцінка, загальна оцінка;", "<b>результатів виконання вправ стрільб</b> — вправа і номери мішеней, зброя і калібр, набої, час, день/ніч, дата, підрозділ; загальний результат за трьома критеріями: стрільба, знання основ і правил, матчастина/нормативи; на звороті — таблиця результатів, аналіз, недоліки, підпис керівника стрільби;", "<b>оціночний лист КТЗ</b> — звання і ПІБ курсанта та інструктора з підписами, дата, оцінки «викон./не викон.», «зал./не зал.», рекомендації, підпис командира підрозділу."]], ["key", "Порядок оцінювання стрільб — у Курсі стрільб (КРП 03.032.056-2018), розділ 3 «Оцінка вогневої підготовки»."]]}, {"h": "Картка настрілу", "body": [["p", "Картка обліку виконання вправ стрільб — особистий обліковий документ, де фіксують усі результати стрільб військовослужбовця:"], ["ul", ["хто стріляв — ПІБ, посада, підрозділ;", "яку вправу і з якої зброї;", "дата і час доби;", "кількість набоїв (настріл);", "результат — влучення, оцінка;", "підписи керівника стрільб (інструктора) і того, хто навчається."]], ["p", "У картці також ведуть облік метання гранат, вправ з психологічної підготовки (обкатка технікою, психологічна смуга перешкод) і виконання КТЗ (польових виходів)."], ["key", "Практичне завдання заняття: правильно заповнити фрагменти ЖБП, відомості та картки на умовних даних."]]}], "keys": ["Основні документи: ЖБП, оціночні відомості, картка настрілу.", "ЖБП: прошитий, пронумерований, зареєстрований; чорне чорнило.", "ЖБП зберігається календарний рік.", "Розділ 9 — зауваження перевіряючих і відмітка про усунення.", "Чотири види відомостей: СТІ, нормативи, стрільби, КТЗ.", "Картка настрілу — особистий облік стрільб."], "test": [["Що таке облікова документація?", ["Сукупність документів, у яких фіксують, реєструють і зберігають інформацію", "Лише розклад занять", "Особисті нотатки інструктора", "План-конспект"], "Про const audio=new Audio();audio.preload="auto";
const RATES=[1,1.25,1.5,0.9];
let A={t:null,s:0,rate:store.get("rate",1),cur:null,userScroll:0};
audio.playbackRate=A.rate;
function setupPlayer(t){
  A.t=t;$("#player").classList.remove("hidden");$("#pSpd").textContent=fmtRate(A.rate);
  if(A.cur&&A.tid===t.id){paintNow(A.cur);updateUI();return}
  A.tid=t.id;A.s=Math.min(store.get("pos_"+t.id,0),t.sections.length-1);loadSec(A.s,false);
}
function fmtRate(r){return (r+"").replace(".",",")+"×"}
function loadSec(s,play,at){
  const tm=TIMING[A.t.id];if(!tm||!tm[s])return;
  A.s=s;const src="audio/"+tm[s].f;const same=audio.src.endsWith(src)&&audio.readyState>=1;
  const go_=()=>{if(at)audio.currentTime=at;audio.playbackRate=A.rate;if(play)audio.play().catch(()=>{});};
  if(same)go_();else{audio.src=src;audio.addEventListener("loadedmetadata",go_,{once:true});audio.load();}
  store.set("pos_"+A.t.id,s);updateUI();mediaMeta();
}
function updateUI(){
  if(!A.t)return;const sec=A.t.sections[A.s];
  $("#pTitle").textContent=sec?sec.h:"";
  const d=audio.duration||(TIMING[A.t.id][A.s]||{}).d||0;
  $("#pTime").textContent=`${A.s+1}/${A.t.sections.length} · ${fmt(audio.currentTime)} / ${fmt(d)}`;
  $("#pFill").style.width=(d?audio.currentTime/d*100:0)+"%";
  const playing=!audio.paused;$("#icPlay").classList.toggle("hidden",playing);$("#icPause").classList.toggle("hidden",!playing);
  $("#pPlay").setAttribute("aria-label",playing?"Пауза":"Слухати");
}
function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
audio.addEventListener("timeupdate",()=>{
  if(!A.t||S.view!=="topic")return;updateUI();
  const m=(TIMING[A.t.id][A.s]||{}).m||[];let cur=m[0]&&m[0][0];
  for(const [id,t] of m){if(audio.currentTime+0.05>=t)cur=id;else break}
  if(cur&&cur!==A.cur){A.cur=cur;if(S.tab==="lec")paintNow(cur,true)}
});
audio.addEventListener("play",updateUI);audio.addEventListener("pause",updateUI);
audio.addEventListener("ended",()=>{
  const lp=Math.max(lecProg(A.t.id),A.s+1);store.set("lec_"+A.t.id,lp);
  if(A.s+1<A.t.sections.length)loadSec(A.s+1,true);
  else{store.set("pos_"+A.t.id,0);updateUI();const k=document.querySelector(".keys");if(k&&S.tab==="lec")k.scrollIntoView({behavior:"smooth",block:"center"});}
});
function paintNow(id,scroll){
  document.querySelectorAll(".blk.now").forEach(e=>e.classList.remove("now"));
  const el=document.getElementById(id);if(!el)return;el.classList.add("now");
  if(scroll&&Date.now()-A.userScroll>5000){const r=el.getBoundingClientRect();const vh=innerHeight;if(r.top<90||r.bottom>vh-150)el.scrollIntoView({behavior:"smooth",block:"center"})}
}
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{A.userScroll=Date.now()},{passive:true}));

  const s=+document.getElementById(id).dataset.s;const m=(TIMING[A.t.id][s]||{}).m||[];

function togglePlay(){if(!A.t)return;if(audio.paused){audio.play().catch(()=>{});A.userScroll=0}else audio.pause()}

function stopAudio(reset){pauseAudio();if(reset){A.cur=null}}
$("#pPlay").onclick=togglePlay;
$("#pPrev").onclick=()=>{if(audio.currentTime>4)audio.currentTime=0;else if(A.s>0)loadSec(A.s-1,!audio.paused)};
$("#pNext").onclick=()=>{if(A.s+1<A.t.sections.length)loadSec(A.s+1,!audio.paused)};
$("#pSpd").onclick=()=>{A.rate=RATES[(RATES.indexOf(A.rate)+1)%RATES.length];audio.playbackRate=A.rate;store.set("rate",A.rate);$("#pSpd").textContent=fmtRate(A.rate)};
$("#pBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};

  navigator.mediaSession.metadata=new MediaMetadata({title:A.t.sections[A.s].h,artist:A.t.short,album:"КІБЕР"});

let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(cfg){
  Q={...cfg,items:shuffle(cfg.items).map(it=>{const [q,opts,ex,clip]=it.q;return {...it,text:q,ex,clip,opts:shuffle(opts.map((o,k)=>({o,ok:k===0,k})))}}),i:0,score:0,picked:null,wrong:[]};
  renderQ();
}
function renderQ(noVoice){
  const box=$("#quiz");const it=Q.items[Q.i];const n=Q.items.length;const L="АБВГ";
  let h=`<div class="qhead"><span>Питання ${Q.i+1} з ${n}</span><span>${Q.score} ${balWord(Q.score)}</span></div><div class="qprog"><i style="width:${Q.i/n*100}%"></i></div>`;

    h+=`<button class="opt ${c}" data-k="${k}" ${Q.picked!==null?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o.o)}</span></button>`});

  if(Q.picked!==null&&!Q.exam){

/* ---------- озвучка тестів ---------- */
const qa=new Audio();qa.preload="auto";let QSEQ=[],QSEQi=0,QSEQid=0;
function qvOn(){return store.get("qvoice",true)&&!!DATA.qa}
function qStop(){QSEQ=[];QSEQid++;try{qa.pause()}catch(e){}}
function qPlay(list){qStop();if(!list.length)return;const my=++QSEQid;QSEQ=list.filter(Boolean);QSEQi=0;
  const next=()=>{if(my!==QSEQid||QSEQi>=QSEQ.length)return;qa.src="audio/"+QSEQ[QSEQi++];qa.playbackRate=store.get("rate",1);qa.play().catch(()=>{})};
  qa.onended=()=>{if(my===QSEQid)setTimeout(next,180)};next();}
function qReadQuestion(){const it=Q&&Q.items[Q.i];if(!it||!it.clip)return;const L=DATA.qa.letters;
  const seq=[it.clip.q];it.opts.forEach((o,j)=>{seq.push(L[j],it.clip.o[o.k])});qPlay(seq);}
function qReadVerdict(){const it=Q&&Q.items[Q.i];if(!it||!it.clip||Q.picked===null)return;const ok=it.opts[Q.picked].ok;
  const right=it.opts.find(o=>o.ok);qPlay(ok?[DATA.qa.right,it.clip.e]:[DATA.qa.wrong,it.clip.o[right.k],it.clip.e]);}
function voiceBar(){if(!DATA.qa)return"";const on=qvOn();return `<div class="qvoice"><button class="btn fx sm" id="qvToggle" aria-pressed="${on}">${on?"🔊 Озвучка увімкнена":"🔇 Озвучка вимкнена"}</button>${Q.items[Q.i]&&Q.items[Q.i].clip?`<button class="btn fx sm" id="qvReplay">▶ Прослухати ще раз</button>`:""}</div>`}
function bindVoice(){const t=$("#qvToggle");if(t)t.onclick=()=>{store.set("qvoice",!qvOn());if(!qvOn())qStop();renderQ(true)};
  const r=$("#qvReplay");if(r)r.onclick=()=>Q.picked===null||Q.exam?qReadQuestion():qReadVerdict();}
function balWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"бал";if(a>=2&&a<=4&&(b<12||b>14))return"бали";return"балів"}
function pick(k){if(Q.picked!==null)return;qStop();Q.picked=k;const it=Q.items[Q.i];if(it.opts[k].ok)Q.score++;else Q.wrong.push(it);renderQ();
  if(Q.exam){setTimeout(()=>{if(Q&&Q.picked===k&&Q.items[Q.i]===it)nextQ()},650)}}
function nextQ(){qStop();Q.picked=null;Q.i++;if(Q.i>=Q.items.length)renderResult();else{renderQ();const qt=document.querySelector(".quiz");if(qt&&qt.getBoundingClientRect().top<0)qt.scrollIntoView()}}
function gradeOf(p){return p>=90?"Відмінно":p>=80?"Добре":p>=70?"Задовільно":"Незадовільно"}
function renderResult(){
  qStop();const n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  if(Q.save){const b=best(Q.save);if(!b||s/n>b.s/b.n)store.set("best_"+Q.save,{s,n,pct:p});}
  if(Q.exam){const prev=store.get("exam",null);if(!prev||p>prev.pct)store.set("exam",{pct:p,s,n})}
  const C=2*Math.PI*74,col=p>=PASS?"var(--acc)":p>=70?"var(--amb)":"var(--bad)";
  const passed=Q.exam?p>=70:p>=PASS;stopReward();
  let h=`<div class="res"><div class="card rw-card"><svg id="rw" viewBox="0 0 320 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
  <div class="rw-verdict ${passed?"ok":"no"}">${passed?(p>=90?"На тобі патрон! Матеріал засвоєний.":(Q.exam?"На тобі патрон! Тест складено.":"На тобі патрон! Залік складено.")):(p>=50?"Десять віджимань. Потрібне повторення.":"Десять віджимань. Пройдіть заняття ще раз.")}</div><div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--soft)" stroke-width="14"/><circle cx="85" cy="85" r="74" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s/n)}"/></svg><div class="v"><b>${s}/${n}</b><span>${p}% · ${s} ${balWord(s)}</span></div></div>
  <div class="grade">${gradeOf(p)}</div><p>${p>=PASS?(Q.exam?"Матеріал засвоєно впевнено.":"Заняття засвоєно. Можна переходити до наступного."):`Для засвоєння потрібно ${PASS}%. Перегляньте помилки й спробуйте ще раз.`}</p><div class="cta">`;

  if(Q.save){const nx=T[T.indexOf(byId[Q.save])+1];if(nx&&p>=PASS)h+=`<button class="btn fx p" data-go="#${nx.id}">Наступне заняття →</button>`;else if(p<PASS)h+=`<button class="btn fx" data-go="#${Q.save}">Перечитати лекцію</button>`;else h+=`<button class="btn fx" data-go="#">До занять</button>`}
  else h+=`<button class="btn fx" data-go="#">До занять</button>`;

  if(Q.exam){const agg={};Q.items.forEach(it=>{const a=agg[it.tid]||(agg[it.tid]={n:0,w:0});a.n++});Q.wrong.forEach(it=>agg[it.tid].w++);

  if(Q.wrong.length){h+=`<div class="mist"><h3>Розбір помилок</h3>${Q.wrong.map(it=>`<div class="mi">${Q.exam?`<div class="tp">${esc(byId[it.tid].short)}</div>`:""}<b>${esc(it.text)}</b><div class="ans">✓ ${esc(it.opts.find(o=>o.ok).o)}</div><div class="ex">${esc(it.ex)}</div></div>`).join("")}</div>`}

  $("#quiz").innerHTML=h;bindGo();{const y=$("#quiz").getBoundingClientRect().top+scrollY-70;window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}
  if(passed)rewardPass();else rewardFail();
  const cfg={title:Q.title,save:Q.save,exam:Q.exam};const wrong=Q.wrong.map(it=>({q:it.q,tid:it.tid,i:it.i}));const all=Q.all||Q.items.map(it=>({q:it.q,tid:it.tid,i:it.i}));
  const rw=$("#rWrong");if(rw)rw.onclick=()=>startQuiz({...cfg,save:null,items:wrong,exam:false});
  $("#rAgain").onclick=()=>Q.exam?renderExamStart(true):startQuiz({...cfg,items:all});
}

/* ---------- exam ---------- */
function renderExamStart(direct){
  S={view:"exam"};hidePlayer();
  const pool=[];T.forEach(t=>t.test.forEach((q,i)=>pool.push({q,tid:t.id,i})));
  const N=Math.min(30,pool.length);setHead("Підсумковий тест",N+" питань з усіх занять");
  const per=Math.max(1,Math.floor(N/T.length/2));
  let pickd=[];T.forEach(t=>{pickd.push(...shuffle(pool.filter(p=>p.tid===t.id)).slice(0,per))});
  const rest=shuffle(pool.filter(p=>!pickd.includes(p)));pickd=pickd.concat(rest.slice(0,Math.max(0,N-pickd.length)));
  if(!direct){
    $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Теоретична частина іспиту</span><h1>Підсумковий тест</h1><p>${N} випадкових питань з усіх ${T.length} відкритих занять. Підказки й пояснення — після завершення. Оцінка за Програмою курсу: 90% — відмінно, 80% — добре, 70% — задовільно, менше 70% — незадовільно.</p></div>
    <div class="cta" style="margin-top:22px"><button class="btn fx p" id="exGo">${icon("test")} Почати тест</button><button class="btn fx" data-go="#">До занять</button></div></div>`;
    bindGo();$("#exGo").onclick=()=>renderExamStart(true);return;
  }
  $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Підсумковий тест</span><h1>${N} питань</h1></div><div id="quiz" class="quiz"></div></div>`;
  startQuiz({title:"Тест",items:pickd,save:null,exam:true});Q.all=pickd;
}

function fmt2(x){return x.toFixed(2).replace(".",",")}
function calcSheet(type,st){
  const G=DATA.sheets[type];let total=0,rated=0,sum=0,starZero=[],plainZero=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{total++;const v=st.v[gi+"_"+ii];if(v===undefined)return;rated++;sum+=v;if(v===0){if(it.s)starZero.push(it.t);else plainZero++}}));
  const avg=rated?Math.round(sum/rated*100)/100:null;const reasons=[];
  if(starZero.length)reasons.push("0 у критичному пункті: "+starZero.join(", "));
  if(plainZero>5)reasons.push(`нулі у ${plainZero} звичайних пунктах (допустимо не більше 5)`);
  if(st.stop)reasons.push("заняття призупинено через порушення заходів безпеки");
  if(st.edip)reasons.push("порушено техніку EDIP");
  let verdict;if(reasons.length)verdict="не виконано";else if(avg===null)verdict="не оцінено";else if(rated<total)verdict=avg>=THR?"попередньо виконано":"попередньо не виконано";else verdict=avg>=THR?"виконано":"не виконано";
  return {total,rated,sum,avg,reasons,verdict,plainZero,starZero};
}
function paintSum(type,st){
  const r=calcSheet(type,st);const fail=r.reasons.length>0||(r.avg!==null&&r.avg<THR);
  const cls=r.avg===null&&!r.reasons.length?"wait":(fail?"no":"ok");
  const label=r.reasons.length?"Не виконано":r.avg===null?"Не оцінено":(r.rated<r.total?(r.avg>=THR?"Попередньо: виконано":"Попередньо: не виконано"):(r.avg>=THR?"Виконано":"Не виконано"));
  $("#sumbar").innerHTML=`<div class="in"><div class="avg">${r.avg===null?"—":fmt2(r.avg)}</div><div class="meta">середній бал · поріг 2,48<br>оцінено ${r.rated} з ${r.total}${r.rated<r.total?` · залишилось ${r.total-r.rated}`:""}</div><span class="vchip ${cls}">${label}</span></div>${r.reasons.length?`<div class="reasons">${r.reasons.map(esc).join(" · ")}</div>`:""}`;
  const fin=$("#final");if(!fin)return;const G=DATA.sheets[type];const weak=[];let n=0;
  G.forEach((g,gi)=>g.items.forEach((it,ii)=>{n++;const v=st.v[gi+"_"+ii];if(v===0||v===1)weak.push([n,it.t,v,it.s])}));weak.sort((a,b)=>a[2]-b[2]);
  let why;
  if(r.avg===null&&!r.reasons.length)why="Ще не поставлено жодного балу. Почніть з першого пункту — підсумок з’явиться тут.";
  else if(r.reasons.length)why=`Заняття <b>не зараховано</b>, навіть якщо середній бал високий. Причина: ${r.reasons.map(esc).join("; ")}.`;
  else{const ok=r.avg>=THR;why=`Сума балів ${r.sum} ÷ оцінених пунктів ${r.rated} = <b>${fmt2(r.avg)}</b>. ${ok?"Це не менше порогу 2,48 — <b>виконано</b>.":"Це менше порогу 2,48 — <b>не виконано</b>."}`+(r.rated<r.total?` Оцінено не всі пункти (залишилось ${r.total-r.rated}), тому рішення попереднє.`:"")}
  fin.innerHTML=`<h2>Підсумок і розбір</h2><p>${why}</p>${weak.length?`<p><b>Над чим працювати</b> — пункти з оцінкою 0 і 1, з них почніть розбір (АПД):</p><ul>${weak.map(([n,t,v,st])=>`<li><b>${v}</b> — ${n}. ${esc(t)}${st?' <span style="color:var(--amb)">★</span>':""}</li>`).join("")}</ul>`:(r.rated?"<p>Пунктів з оцінкою 0 або 1 немає.</p>":"")}<p style="color:var(--muted);font-size:14px">У відомість записують бал і словесну оцінку, наприклад: «2,61 (виконано)».</p>`;
}

function renderAAR(){
  S={view:"aar"};hidePlayer();setHead("Тренажер АПД","Б1 М2 Т4 З2 · практика");
  const d=store.get("aar",{a:["","","",""],shown:false,kp:{}});
  let h=`<div class="wrap"><div class="thead"><span class="eyebrow">Практика // Аналіз проведених дій</span><h1>Тренажер АПД</h1><p>Прочитайте завдання і перебіг подій. Дайте відповіді на чотири запитання АПД, потім порівняйте з еталоном і відмітьте, що ви помітили самі. Оцінювання — «виконано / не виконано» за правильністю і повнотою.</p></div>
  <section class="scen card"><h3>Завдання</h3><p style="font-size:16px">${esc(AAR.task)}</p>
   <h3>Склад відділення</h3><ul style="padding-left:20px;font-size:15px">${AAR.team.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <h3>Перебіг подій</h3><ul class="tl">${AAR.tl.map(([t,x])=>`<li><b>${t}</b><span>${esc(x)}</span></li>`).join("")}</ul></section><div class="tr">`;
  AAR.qs.forEach(([q,m],i)=>{h+=`<div class="fld card"><label for="a${i}">${i+1}. ${esc(q)}</label><textarea id="a${i}" placeholder="Ваша відповідь…">${esc(d.a[i]||"")}</textarea>${d.shown?`<div class="model"><small>Еталон</small>${esc(m).replace(/\n/g,"<br>")}</div>`:""}</div>`});
  h+=`</div><div class="cta" style="margin-top:16px"><button class="btn fx p" id="aShow">${d.shown?"Сховати еталон":"Порівняти з еталоном"}</button><button class="btn fx" data-go="#b1m2t4z2">Лекція «АПД»</button></div>`;
  if(d.shown){
    const all=[...AAR.kp.plus.map(x=>["+",x]),...AAR.kp.minus.map(x=>["−",x]),...AAR.kp.fix.map(x=>["→",x])];
    const got=all.filter((x,i)=>d.kp[i]).length;
    h+=`<section class="scen card" style="margin-top:18px"><h3>Ключові моменти: що ви помітили самі? <span style="color:var(--acc)" id="kpN">${got}/${all.length}</span></h3>${all.map(([s,x],i)=>`<label class="kp"><input type="checkbox" data-i="${i}" ${d.kp[i]?"checked":""}><span><b style="color:${s==="+"?"var(--ok)":s==="−"?"var(--bad)":"var(--acc)"}">${s}</b> ${esc(x)}</span></label>`).join("")}
    <p style="font-size:14px;color:var(--muted);margin-top:10px">Орієнтир: знайшли 11 і більше з 15 — аналіз повний. Пам’ятайте: критикуємо дії, а не людей.</p></section>`;
  }
  h+=`<div style="height:60px"></div></div>`;
  $("#view").innerHTML=h;bindGo();
  AAR.qs.forEach((_,i)=>$("#a"+i).oninput=e=>{d.a[i]=e.target.value;store.set("aar",d)});
  $("#aShow").onclick=()=>{d.shown=!d.shown;store.set("aar",d);const y=scrollY;renderAAR();scrollTo(0,y)};
  document.querySelectorAll(".kp input").forEach(c=>c.onchange=()=>{d.kp[c.dataset.i]=c.checked;store.set("aar",d);$("#kpN").textContent=Object.values(d.kp).filter(Boolean).length+"/15"});
}

/* ---------- keys ---------- */
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if(S.view==="topic"&&S.tab==="lec"){
    if(e.code==="Space"){e.preventDefault();togglePlay()}
    else if(e.key==="ArrowRight"&&!e.altKey){$("#pNext").onclick()}
    else if(e.key==="ArrowLeft"&&!e.altKey){$("#pPrev").onclick()}
  }
  if(Q&&$("#quiz")){
    const k="1234".indexOf(e.key);const k2="абвгАБВГ".indexOf(e.key)%4;
    if(Q.picked===null&&(k>=0||k2>=0)){e.preventDefault();pick(k>=0?k:k2)}
    else if(Q.picked!==null&&e.key==="Enter"&&document.activeElement.id!=="qNext"){e.preventDefault();nextQ()}
  }
  if(e.key==="Escape"&&!$("#mback"))go("#");
});

const isFile = location.protocol === "file:";
const swOK = "serviceWorker" in navigator && !isFile;
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const totalMB = Math.max(1, Math.round(ASSETS.reduce((a, x) => a + x[1], 0) / 1048576));
let OFF = {state: isFile ? "file" : "unknown", done: 0, bytes: 0};
let installEvt = null;
addEventListener("beforeinstallprompt", e => {e.preventDefault(); installEvt = e; renderOff();});
addEventListener("appinstalled", () => {installEvt = null; renderOff();});
if (swOK) { navigator.serviceWorker.register("sw.js").catch(() => {}); checkOffline(); }
async function checkOffline() {
  try { const c = await caches.open(CACHE); let miss = 0;
    for (const [p] of ASSETS) if (!(await c.match(p))) { miss++; break; }
    OFF.state = miss === 0 ? "ready" : (store.get("offline", false) ? "partial" : "none");
  } catch (e) { OFF.state = "none"; }
  renderOff();
}
async function downloadAll() {
  if (!swOK) return;
  OFF.state = "loading"; OFF.done = 0; OFF.bytes = 0; renderOff();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  try { const c = await caches.open(CACHE); let i = 0;
    const work = async () => { while (i < ASSETS.length) { const [p, b] = ASSETS[i++];
        if (!(await c.match(p))) { const r = await fetch(p, {cache: "reload"}); if (!r.ok) throw new Error(p); await c.put(p, r); }
        OFF.done++; OFF.bytes += b; paintProg(); } };
    await Promise.all([work(), work(), work(), work()]);
    store.set("offline", true); OFF.state = "ready";
  } catch (e) { OFF.state = "error"; }
  renderOff();
  if (OFF.state === "ready" && !isStandalone) setTimeout(() => openInstall(true), 400);
}
function paintProg() { const el = $("#offProg"); if (!el) return; el.style.width = (OFF.done / ASSETS.length * 100) + "%";
  const t = $("#offTxt"); if (t) t.textContent = `Завантажено ${Math.round(OFF.bytes / 1048576)} з ${totalMB} МБ · не закривайте сторінку`; }
const ICON = {
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>'
};
function renderOff() {
  const b = $("#dlBtn");
  if (b) { b.classList.toggle("ok", OFF.state === "ready" || OFF.state === "file"); b.classList.toggle("need", OFF.state === "none" || OFF.state === "partial"); }
  const box = $("#offCard"); if (!box) return;
  let h = ""; const qrb = `<button class="btn fx" onclick="openQR()">${ICON.qr} QR-код</button>`;
  if (OFF.state === "file") h = `<div class="off card done"><div class="oi">${ICON.ok}</div><div class="ot"><b>Офлайн-версія з флешки</b><span>Курс працює без інтернету на цьому комп’ютері.</span></div><div class="oa">${qrb}</div></div>`;
  else if (OFF.state === "loading") h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>Завантаження курсу…</b><span id="offTxt">Підготовка…</span><div class="pbar"><i id="offProg"></i></div></div></div>`;
  else if (OFF.state === "ready") { const inst = isStandalone ? "" : `<button class="btn fx p" onclick="openInstall()">${ICON.dl} Встановити як застосунок</button>`;
    h = `<div class="off card done"><div class="oi">${ICON.ok}</div><div class="ot"><b>Курс збережено на цьому пристрої</b><span>Лекції, озвучка, тести і тренажери працюють без інтернету.</span></div><div class="oa">${inst}${qrb}</div></div>`; }
  else if (!swOK) h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>Офлайн-режим недоступний у цьому браузері</b><span>Відкрийте курс у Chrome, Safari або Edge.</span></div><div class="oa">${qrb}</div></div>`;

    const err = OFF.state === "error" ? "Не вдалося завантажити все — перевірте інтернет і натисніть ще раз." : upd ? `Вийшло оновлення курсу · ${totalMB} МБ` : `Телефон, планшет або комп’ютер · ${totalMB} МБ · один раз з інтернетом`;
    h = `<div class="off card"><div class="oi">${ICON.dl}</div><div class="ot"><b>${upd ? "Оновіть курс для офлайну" : "Працюйте без інтернету"}</b><span>${err}</span></div><div class="oa"><button class="btn fx p" onclick="downloadAll()">${ICON.dl} ${upd ? "Оновити курс" : "Завантажити курс"}</button>${qrb}</div></div>`; }
  box.innerHTML = h; paintProg();
}
function modal(html) { closeModal(); const m = document.createElement("div"); m.className = "mback"; m.id = "mback";
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="ib x" onclick="closeModal()" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal() { const m = $("#mback"); if (m) m.remove(); }
function openQR() { const share = navigator.share ? `<button class="btn fx" onclick="navigator.share({title:'КІБЕР',url:SITE}).catch(()=>{})">Поділитися</button>` : "";

function copyLink() { const done = () => { const b = $("#cpBtn"); if (b) b.textContent = "Скопійовано ✓"; }; if (navigator.clipboard) navigator.clipboard.writeText(SITE).then(done, () => {}); else done(); }
function openInstall(auto) {
  if (installEvt && auto === true) { modal(`<h2>Курс збережено ✓</h2><p>Лекції, озвучка і тести тепер працюють без інтернету. Додайте іконку курсу на екран, щоб відкривати його одним дотиком.</p><div class="mrow"><button class="btn fx p" onclick="closeModal();openInstall()">Встановити застосунок</button><button class="btn fx" onclick="closeModal()">Пізніше</button></div>`); return; }
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderOff(); }); return; }
  let steps;
  if (isIOS) steps = `<ol><li>Натисніть <b>«Поділитися»</b> (квадрат зі стрілкою) внизу Safari.</li><li>Оберіть <b>«На екран „Додому“»</b>.</li><li>Натисніть <b>«Додати»</b> — з’явиться іконка «КІБЕР».</li></ol>`;
  else if (/Android/i.test(ua)) steps = `<ol><li>Натисніть меню браузера <b>⋮</b> угорі праворуч.</li><li>Оберіть <b>«Встановити застосунок»</b> або <b>«Додати на головний екран»</b>.</li><li>Підтвердіть — з’явиться іконка «КІБЕР».</li></ol>`;
  else steps = `<ol><li>У Chrome або Edge натисніть значок <b>встановлення</b> праворуч в адресному рядку.</li><li>Підтвердіть <b>«Встановити»</b> — курс відкриватиметься окремим вікном, навіть без інтернету.</li></ol>`;
  modal(`<h2>Встановити як застосунок</h2><p>Додайте іконку, щоб відкривати курс одним дотиком.</p>${steps}<div class="mrow"><button class="btn fx p" onclick="closeModal()">Зрозуміло</button></div>`);
}
$("#qrBtn").onclick = openQR;
$("#dlBtn").onclick = () => {
  if (OFF.state === "ready") openInstall();
  else if (OFF.state === "file") modal(`<h2>Офлайн-версія</h2><p>Ви відкрили курс з флешки або папки — він уже працює без інтернету.</p><div class="mrow"><button class="btn fx p" onclick="closeModal()">Добре</button></div>`);
  else { if (S.view !== "home") go("#"); setTimeout(() => { const c = $("#offCard"); if (c) c.scrollIntoView({behavior: "smooth", block: "center"}); if (OFF.state !== "loading") downloadAll(); }, 60); }
};
addEventListener("keydown", e => { if (e.key === "Escape" && $("#mback")) { closeModal(); e.stopImmediatePropagation(); } }, true);
