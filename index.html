іж курсантами), групові (між підрозділами)."], ["Чому робота в групах вимагає досвідченого інструктора?", ["Він не знає наперед, куди приведе дискусія", "Вона потребує складного обладнання", "Вона проводиться лише в полі", "Курсанти працюють без нагляду"], "У роботі в групах інструктор не знає заздалегідь, куди приведе дискусія, тому потрібен досвід."]]}, {"id": "b1m2t1z2", "code": "Б1 М2 Т1 З2", "theme": "Тема 1. Форми та методи навчання, методика викладання", "title": "Методика викладання EDIP", "short": "Методика EDIP", "passport": {"goal": "Довести курсантам порядок проведення занять за методикою EDIP (Explanation – Demonstration – Imitation – Practice).", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Суть та принципи методики EDIP", "Порядок практичного використання методики EDIP"], "assess": "Усні запитання під час і в кінці заняття.", "criteria": "Позитивно — якщо надав відповідь на запитання і пояснив її.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 1.2; план-конспект; презентація"}, "sections": [{"h": "Що таке EDIP", "body": [["p", "EDIP — це сукупність дій інструктора та курсантів для набуття знань, умінь і навичок. Метод розробив у 1919 році Чарльз Р. Аллен, один із засновників професійної освіти в США. Це чотириетапний метод навчання, створений для швидкого засвоєння практичних завдань."], ["p", "Назва складається з перших літер чотирьох етапів: <b>Explain — пояснюй</b>, <b>Demonstrate — показуй</b>, <b>Imitate — повторюй</b>, <b>Practise — практикуй</b>. Вивчення кожної теми ділиться саме на ці чотири етапи."], ["p", "Методика вирізняється виключною ефективністю й успішно використовується в арміях США, Великої Британії, Канади, Польщі, Литви, Латвії, Естонії та інших країн. Особливо добре вона підходить для навчання практичним навичкам у технічній, військовій і професійній підготовці."], ["key", "EDIP = Пояснення → Демонстрація → Імітація → Практика. Чотири етапи, які ведуть курсанта від «чую» до «вмію сам»."]]}, {"h": "E — Explanation, пояснення", "body": [["p", "<b>Мета етапу</b> — дати теоретичне розуміння навички або завдання, яке потрібно опанувати."], ["p", "Пояснення — це дія, під час якої інструктор пояснює матеріал, зокрема відповідає на запитання курсантів. Пояснення застосовують і на теоретичних, і на практичних заняттях, якщо практичне заняття не є перевірочним чи контрольним."], ["ul", ["пояснює, що саме буде вивчатися;", "розповідає, чому це важливо;", "дає загальний огляд процесу або навички."]], ["p", "Наприклад: лекційні заняття з будь-якої дисципліни — від статутів до вогневої та тактичної підготовки."]]}, {"h": "D — Demonstration, демонстрація", "body": [["p", "<b>Мета етапу</b> — показати правильне виконання дії або навички."], ["p", "Демонстрація — це дія, під час якої інструктор показує курсантам ту чи іншу дію або наочні приклади. Її використовують і на теоретичних, і на практичних заняттях."], ["ul", ["показує процес на обладнанні або макеті;", "демонструє і повільно, і в нормальному темпі;", "коментує, вказуючи на критичні моменти."]], ["p", "Наприклад: на лекції з вогневої підготовки будову автомата АК-74 показують на зображеннях або на деталях, викладених перед курсантами. На тактичній підготовці переміщення на полі бою показують на схемах, відео або наочно — силами демогрупи."], ["warn", "Демонстрація має бути зразковою й безпомилковою. Курсант повторить саме те, що побачив, — разом із помилками інструктора."]]}, {"h": "I — Imitation, імітація", "body": [["p", "<b>Мета етапу</b> — курсант повторює дії за інструктором і отримує навичку шляхом копіювання та відпрацювання."], ["p", "Імітацію зазвичай використовують на практичних заняттях. Дії виконуються повільно і правильно — курсантів навчають саме правильності дій. Інструктор коментує й коригує кожного."], ["p", "Відпрацювання йде від простого до складного, у три фази:"], ["ul", ["<b>«Роби, як я»</b> — інструктор поступово виконує кожен елемент і пояснює його. За командою «Дивись!» курсанти спостерігають, за командою «Роби!» — повторюють. Ця фаза потрібна, коли матеріал має багато елементів або курсанти вперше працюють зі зброєю.", "<b>«Роби по кроках (за командами)»</b> — дія розбивається на етапи. Наприклад, перевірка зброї на розрядженість: «Перше: перевідник вогню в крайнє нижнє положення, затворну раму в крайнє заднє положення. Роби!». Курсант не переходить до наступного кроку, поки не виконує попередній чітко і без помилок.", "<b>«Роби в цілому»</b> — курсант виконує всю дію від початку до кінця. Тим, хто ще не готовий, інструктор приділяє увагу індивідуально, решті подає команду «Виконуйте самостійно!»."]], ["p", "Наприклад: курсанти розбирають автомат слідом за інструктором — інструктор від’єднує кришку ствольної коробки, курсанти роблять те саме."], ["key", "Імітація: задіяний 100% особового складу, інструктор контролює кожного й одразу виправляє помилки."]]}, {"h": "P — Practice, практика", "body": [["p", "<b>Мета етапу</b> — дати курсанту можливість закріпити навичку самостійною практикою."], ["p", "Практика — це дія, під час якої курсанти самостійно виконують дії в умовах, максимально наближених до реальних. Коментарі інструктора лунають лише тоді, коли це не перевірочне і не контрольне заняття. Спочатку дії виконують повільно, потім поступово нарощують темп."], ["ul", ["самостійно виконує навичку багаторазово;", "вдосконалює точність, швидкість, автоматизм;", "отримує зворотний зв’язок після виконання."]], ["p", "Наприклад: розбирання автомата на час, виконання тактичних прийомів самостійно або у складі підрозділу."]]}, {"h": "Як застосовувати EDIP на практиці", "body": [["p", "Інструктор поступово нарощує рівень знань і вмінь курсантів, не перевантажуючи їх інформацією. Переходячи до наступного елементу, він упевнений, що попередній матеріал засвоєно."], ["p", "Наприклад, під час вивчення автомата курсанти спочатку вивчають його призначення і ТТХ, потім будову та роботу частин і механізмів, далі вчаться розбирати і збирати — і лише після цього допускаються до стрільби."], ["p", "Для ефективного EDIP важливо правильно розподілити час заняття:"], ["ul", ["<b>вступна частина — 10%</b>, основна — <b>80%</b>, заключна — <b>10%</b>;", "в основній частині: пояснення — <b>10%</b>, демонстрація — <b>15%</b>, імітація — <b>25%</b>, практика — <b>не менше 50%</b>."]], ["key", "Максимум часу — на практику. Половина основної частини заняття і більше — це самостійне відпрацювання."], ["warn", "За оціночним листом порушення техніки EDIP під час проведення заняття означає оцінку «незадовільно» за все заняття."]]}, {"h": "Переваги методики", "body": [["ul", ["проста в застосуванні;", "забезпечує ефективне засвоєння нових навичок;", "легко масштабується на групу будь-якого розміру;", "добре підходить для процедурних дій — зброя, медицина, інженерна справа, тактичні прийоми."]], ["p", "Недолік практичного методу один: курсанти можуть почуватися надто керованими й менше проявляти себе індивідуально. Тому фази імітації інструктор комбінує й змінює залежно від заняття — не обов’язково використовувати всі три на кожному."], ["p", "Завдання на самостійну підготовку: ознайомитися з методами проведення занять — бінарна лекція, рольові ігри, проблемна лекція."]]}], "keys": ["EDIP — Explanation, Demonstration, Imitation, Practice: пояснення, демонстрація, імітація, практика.", "Метод розробив Чарльз Р. Аллен у 1919 році; використовується в арміях НАТО.", "Імітація має три фази: «роби, як я», «роби по кроках», «роби в цілому».", "Час основної частини: пояснення 10%, демонстрація 15%, імітація 25%, практика не менше 50%.", "Вступна і заключна частини — по 10% часу заняття, основна — 80%.", "Порушення техніки EDIP — підстава для оцінки «незадовільно» за проведене заняття."], "test": [["Практичне заняття триває 90 хвилин. Скільки хвилин за EDIP припадає на основну частину?", ["72 хвилини", "60 хвилин", "81 хвилина", "45 хвилин"], "Основна частина — 80% заняття: 80% від 90 хв = 72 хв."], ["Основна частина заняття триває 40 хвилин. Скільки щонайменше має тривати практика?", ["20 хвилин", "10 хвилин", "16 хвилин", "30 хвилин"], "Практика — не менше 50% основної частини: 50% від 40 = 20 хв."], ["Основна частина — 60 хвилин. Скільки часу відводять на демонстрацію?", ["9 хвилин", "6 хвилин", "15 хвилин", "12 хвилин"], "Демонстрація — 15% основної частини: 15% від 60 = 9 хв."], ["Інструктор витратив 40% основної частини на пояснення, а на практику залишив 20%. Чим це загрожує за оціночним листом?", ["Порушення EDIP — «незадовільно» за все заняття", "Зниження балу лише за пункт «розподіл часу»", "Нічим, якщо матеріал теоретично складний", "Попередженням оцінювача без впливу на оцінку"], "Порушення техніки EDIP під час проведення заняття означає «незадовільно» за все заняття."], ["На контрольному занятті курсанти виконують нормативи. Чи проводиться етап пояснення?", ["Ні — на контрольному занятті пояснення не проводять", "Так — пояснення обов’язкове на кожному занятті", "Так — але скорочене до 5 хвилин на початку", "Лише якщо курсанти попросять повторити"], "Пояснення застосовують на теоретичних і практичних заняттях, якщо практичне заняття не є перевірочним чи контрольним."], ["Під час демонстрації інструктор пропустив перевірку патронника. Чому це критична помилка?", ["Курсанти повторять побачене — разом із помилкою", "Демонстрацію оцінює комісія за окремим пунктом", "Повторний показ затягує заняття за межі часу", "Не критично — можна пояснити пізніше на практиці"], "Демонстрація має бути зразковою й безпомилковою: курсант повторює побачене разом із помилками інструктора."], ["Як правильно проводити демонстрацію складної дії?", ["Повільно і в нормальному темпі, з коментарями", "Лише в бойовому темпі, щоб показати реальність", "Мовчки, щоб курсанти зосередилися на рухах", "Лише на відео, щоб уникнути помилок показу"], "Інструктор демонструє і повільно, і в нормальному темпі, вказуючи на критичні моменти."], ["«Перше: перевідник вогню в крайнє нижнє положення, затворну раму в крайнє заднє положення. Роби!» Яка це фаза імітації?", ["«Роби по кроках»", "«Роби, як я»", "«Роби в цілому»", "Етап практики"], "Дія розбивається на етапи за командами — фаза «Роби по кроках»."], ["Кому інструктор подає команду «Виконуйте самостійно!» у фазі «Роби в цілому»?", ["Готовим; з неготовими — індивідуально", "Усім одночасно, без жодних винятків", "Лише найкращим — для змагання на час", "Нікому — це команда етапу практики"], "У фазі «Роби в цілому» неготовим інструктор приділяє увагу індивідуально, решті — «Виконуйте самостійно!»."], ["Який відсоток особового складу має бути задіяний на етапі імітації?", ["100%", "50%", "Лише найслабші", "Лише одне відділення"], "Імітація: задіяний 100% особового складу, інструктор контролює кожного й одразу виправляє помилки."], ["Чим практика відрізняється від імітації?", ["Самостійно, в умовах, наближених до реальних", "Разом з інструктором, повторюючи кожен рух", "Під постійні команди інструктора на кожен крок", "Лише на контрольному занятті з нормативом"], "Практика — самостійне виконання в умовах, наближених до реальних: спочатку повільно, потім темп зростає."], ["Коли інструктор коментує дії курсантів на етапі практики?", ["Якщо заняття не перевірочне і не контрольне", "Завжди, після кожної дії кожного курсанта", "Ніколи — практика проходить без коментарів", "Лише на прохання самого курсанта"], "Коментарі інструктора на практиці лунають лише тоді, коли це не перевірочне і не контрольне заняття."], ["Яка правильна послідовність вивчення автомата за принципом EDIP?", ["ТТХ → будова → розбирання-збирання → стрільба", "Будова → ТТХ → стрільба → розбирання-збирання", "Розбирання-збирання → ТТХ → будова → стрільба", "ТТХ → стрільба → будова → розбирання-збирання"], "Інструктор нарощує рівень поступово: ТТХ, будова, розбирання-збирання і лише потім допуск до стрільби."], ["Який єдиний недолік практичного методу і як його компенсують?", ["Надмірна керованість — фази імітації комбінують", "Тривалість — практику скорочують до мінімуму", "Висока вартість — частково заміняють лекцією", "Небезпека — зброю замінюють макетами"], "Курсанти можуть почуватися надто керованими; тому фази імітації інструктор комбінує, не обов’язково всі три на кожному занятті."], ["Хто і коли розробив методику EDIP?", ["Чарльз Р. Аллен, 1919 рік", "Бенджамін Блум, 1956 рік", "Генштаб армії США, 1945 рік", "Абрахам Маслоу, 1943 рік"], "EDIP розробив Чарльз Р. Аллен у 1919 році, один із засновників професійної освіти в США."], ["Для якого заняття EDIP підходить найменше?", ["Дискусія про мотивацію без конкретної навички", "Накладання турнікета", "Розбирання автомата", "Встановлення протипіхотної міни на макеті"], "EDIP найкраще для процедурних дій — зброя, медицина, інженерна справа, тактичні прийоми."]]}, {"id": "b1m2t2z1", "code": "Б1 М2 Т2 З1", "theme": "Тема 2. Фактори та принципи навчання", "title": "Суть навчання та викладання", "short": "Навчання і викладання", "passport": {"goal": "Ознайомити військовослужбовців з принципами, особливостями та різницею між навчанням і викладанням.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Поняття навчання", "Поняття викладання", "Принципи, особливості та різниця між навчанням і викладанням"], "assess": "Усні запитання; у кінці — індивідуальний письмовий тест на 3 питання.", "criteria": "3 правильні відповіді — «відмінно», 2 — «добре», 1 — «задовільно».", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.1; презентація; тест за темою"}, "sections": [{"h": "Що таке навчання", "body": [["p", "Навчання — організована двостороння діяльність, спрямована на максимальне засвоєння та усвідомлення навчального матеріалу і подальше застосування знань, умінь і навичок на практиці."], ["p", "У Збройних Силах навчання визначають так: «Це організована співпраця між інструктором і тими, хто навчається, спрямована на досягнення цілей навчання». Інструктор очолює цю співпрацю, але виконують завдання всі разом: інструктор допомагає курсантам, а курсанти — інструкторові й одне одному."], ["key", "Навчання = викладання + учіння. Два взаємопов’язані процеси, які не працюють один без одного."]]}, {"h": "Викладання і учіння", "body": [["p", "<b>Викладання</b> — діяльність інструктора: поставити перед курсантами пізнавальне завдання, повідомити нові знання, організувати спостереження і практичні заняття, керувати самостійною роботою, перевірити якість знань, умінь і навичок."], ["p", "<b>Учіння</b> — цілеспрямований процес засвоєння знань і оволодіння вміннями та навичками тими, хто навчається."], ["p", "Оскільки навчання — двосторонній процес, ефективність викладання напряму залежить від ефективності учіння. Найкраща лекція не дасть результату, якщо курсант не працює сам."]]}, {"h": "Короткотривалі і довготривалі зміни", "body": [["p", "Навчання — це процес набуття нових знань, навичок і цінностей через досвід, вивчення чи роздуми, що змінює поведінку людини. Але не кожна зміна закріплюється."], ["p", "<b>Короткотривалі зміни</b> — первинна реакція на новий досвід, яка ще не стала звичкою:"], ["ul", ["<b>ефект новизни</b> — курсант правильно займає положення для стрільби, поки свідомо про це думає; щойно увага перемикається, повертається стара модель;", "<b>нестабільність</b> — без повторення навичка «розмивається» вже за 2–3 дні;", "<b>залежність від контексту</b> — під наглядом інструктора діє правильно, а в змінених умовах розгублюється;", "<b>швидка втомлюваність</b> — неавтоматизована дія потребує багато енергії, і через виснаження настає «відкат»."]], ["p", "<b>Довготривалі зміни</b> формуються поступово. Щоб зміни стали постійними, потрібні інтервальні повторення, практичне застосування і зворотний зв’язок."], ["warn", "Те, що курсант правильно виконав дію зараз, ще не означає, що він закріпив навичку назавжди."]]}, {"h": "Дидактичні принципи навчання", "body": [["p", "Принципи навчання — основні положення, що визначають зміст, форми і методи навчальної роботи. Основні з них:"], ["ul", ["<b>Науковості</b> — усі факти й положення, що вивчаються, мають бути науково правильними.", "<b>Системності і послідовності</b> — логічний перехід від засвоєного до нового, фокус на ключових аспектах.", "<b>Доступності</b> — від простого до складного, від відомого до невідомого, з урахуванням рівня курсантів.", "<b>Зв’язку навчання з життям</b> — теорія є основою практики; використовуємо життєвий і бойовий досвід курсантів.", "<b>Свідомості й активності</b> — роз’яснення мети, позитивні мотиви, контроль і самоконтроль.", "<b>Наочності</b> — сприяє активному сприйманню й осмисленню матеріалу.", "<b>Міцності засвоєння</b> — повторення за розділами, поєднання нового з вивченим.", "<b>Індивідуального підходу</b> — кожен опановує матеріал з урахуванням свого рівня."]]]}, {"h": "Як людина отримує досвід", "body": [["p", "Особистий досвід — сукупність знань, умінь, переживань, які людина набуває через власні дії, помилки та успіхи. Він складається з етапів:"], ["ul", ["<b>ситуація</b> — курсант опиняється в умовах, що змушують діяти: нове завдання, змагання або помилка;", "<b>спостереження</b> — що пішло не так, що спрацювало, які були емоції;", "<b>концептуалізація</b> — курсант робить висновки, і знання перетворюється на досвід, власне «правило»."]], ["key", "Завдання інструктора — створити ситуацію, допомогти проаналізувати її і зробити висновок. Саме тому після кожного заняття проводять АПД."]]}], "keys": ["Навчання — організована співпраця інструктора і курсантів для досягнення цілей навчання.", "Навчання складається з викладання (діяльність інструктора) та учіння (діяльність курсанта).", "Короткотривалі зміни нестабільні; для довготривалих потрібні повторення, практика і зворотний зв’язок.", "Основні принципи: науковість, системність, доступність, зв’язок з життям, свідомість, наочність, міцність, індивідуальний підхід.", "Досвід формується через ситуацію, спостереження і висновок."], "test": [["Як у ЗСУ визначають навчання?", ["Організована співпраця інструктора і курсантів для досягнення цілей", "Передача знань від інструктора до курсантів в одному напрямку", "Самостійне вивчення матеріалу курсантом під контролем", "Систематичний контроль виконання нормативів і стандартів"], "У ЗСУ навчання — організована співпраця між інструктором і тими, хто навчається; інструктор її очолює, але завдання виконують усі разом."], ["Навчання складається з двох взаємопов’язаних процесів. Яких?", ["Викладання і учіння", "Пояснення і демонстрації", "Теорії і практики", "Контролю і оцінювання"], "Навчання = викладання (діяльність інструктора) + учіння (засвоєння курсантом)."], ["Інструктор прочитав блискучу лекцію, але курсанти нічого не запам’ятали, бо не працювали самі. Яку закономірність це ілюструє?", ["Викладання ефективне, лише коли ефективне учіння", "Принцип наочності: без схем лекція не працює", "Ефект новизни: курсанти відволіклися на нове", "Залежність від контексту: клас був незвичним"], "Навчання двостороннє: найкраща лекція не дасть результату, якщо курсант не працює сам."], ["Що з переліченого — діяльність інструктора (викладання), а не учіння?", ["Поставити пізнавальне завдання і перевірити знання", "Засвоювати нові знання під час лекції", "Відпрацьовувати навичку самостійно", "Запам’ятовувати порядок дій за інструктором"], "Викладання: поставити завдання, повідомити знання, організувати практику, керувати самостійною роботою, перевірити якість."], ["Курсант правильно тримає положення для стрільби, поки думає про це, але відволікся — і повернувся до старої пози. Як це називається?", ["Ефект новизни", "Нестабільність", "Швидка втомлюваність", "Залежність від контексту"], "Ефект новизни — правильна дія, поки курсант свідомо про неї думає; щойно увага перемикається, повертається стара модель."], ["Через скільки часу без повторення навичка, що ще не закріпилася, починає «розмиватися»?", ["Через 2–3 дні", "Через 2–3 тижні", "Через місяць", "Через пів року"], "Нестабільність: без повторення навичка «розмивається» вже за 2–3 дні."], ["Під наглядом інструктора курсант діє бездоганно, а на незнайомій місцевості губиться. Яка ознака короткотривалої зміни?", ["Залежність від контексту", "Ефект новизни", "Швидка втомлюваність", "Нестабільність"], "Залежність від контексту — правильна дія лише у знайомих умовах."], ["Що потрібно, щоб короткотривалі зміни стали довготривалими?", ["Інтервальні повторення, практика і зворотний зв’язок", "Одне інтенсивне тренування до повного виснаження", "Більше теоретичних лекцій перед кожною практикою", "Суворий контроль і покарання за кожну помилку"], "Довготривалі зміни формуються поступово: інтервальні повторення, практика і зворотний зв’язок."], ["Інструктор використовує бойовий досвід курсантів, щоб пояснити тему. Який дидактичний принцип він реалізує?", ["Зв’язку навчання з життям", "Науковості навчання", "Наочності навчання", "Міцності засвоєння"], "Принцип зв’язку навчання з життям: теорія — основа практики, використовуємо життєвий і бойовий досвід."], ["Інструктор пояснює курсантам мету заняття і чому це знадобиться в бою. Який принцип?", ["Свідомості й активності", "Доступності", "Системності", "Індивідуального підходу"], "Свідомість і активність: роз’яснення мети, позитивні мотиви, контроль і самоконтроль."], ["Регулярне повторення за розділами і поєднання нового з вивченим — це який принцип?", ["Міцності засвоєння", "Наочності навчання", "Науковості навчання", "Доступності навчання"], "Принцип міцності засвоєння — повторення за розділами, поєднання нового з вивченим."], ["Інструктор переказує курсантам застарілі й неперевірені дані про дрони противника. Який принцип порушено?", ["Науковості", "Наочності", "Доступності", "Індивідуального підходу"], "Принцип науковості — усі факти й положення мають бути науково правильними."], ["Яка правильна послідовність етапів набуття особистого досвіду?", ["Ситуація → спостереження → концептуалізація", "Спостереження → ситуація → висновок", "Теорія → практика → контроль", "Концептуалізація → ситуація → спостереження"], "Досвід: ситуація (змушує діяти) → спостереження (що спрацювало) → концептуалізація (власне «правило»)."], ["На якому етапі знання перетворюється на власне «правило» курсанта?", ["Концептуалізація", "Спостереження", "Ситуація", "Імітація"], "Концептуалізація — курсант робить висновки, і знання перетворюється на досвід."], ["Чому після кожного заняття проводять АПД?", ["Щоб курсанти проаналізували досвід і зробили висновки", "Щоб виставити оцінки і внести їх до журналу", "Щоб доповісти командиру про результати заняття", "Щоб визначити, хто винний у допущених помилках"], "Завдання інструктора — створити ситуацію, допомогти проаналізувати і зробити висновок; для цього — АПД."]]}, {"id": "b1m2t2z2", "code": "Б1 М2 Т2 З2", "theme": "Тема 2. Фактори та принципи навчання", "title": "Області (сфери) навчання", "short": "Сфери навчання", "passport": {"goal": "Пояснити військовослужбовцям поняття теоретичних знань та практичних дій (умінь і навичок), чим вони набуваються (формуються).", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Поняття знань, умінь і навичок, різниця між ними", "Як набуваються знання, уміння і навички", "Таксономія Блума і сфери навчання"], "assess": "Усні запитання під час і в кінці заняття; письмовий тест.", "criteria": "Позитивно — якщо засвоїв матеріал з усіх навчальних питань не нижче оцінки «добре».", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.2; презентація; тест за темою"}, "sections": [{"h": "Навіщо знати сфери навчання", "body": [["p", "Основне завдання навчання — передати курсанту знання і сформувати в нього вміння та навички. Сфери навчання — один з основних аспектів, які враховують під час планування заняття: від типу сфери залежать навчальні завдання, організація заняття і спосіб подачі інформації."], ["p", "За таксономією Блума (1956 рік) виділяють три сфери: <b>когнітивну (знання)</b>, <b>психомоторну (навички)</b> та <b>афективну (ставлення, цінності)</b>. Після заняття курсант має набути нових знань, навичок і змінити систему цінностей."], ["key", "Когнітивна сфера — основна: застосування двох інших завжди потребує певної частки знань."]]}, {"h": "Знання", "body": [["p", "Знання — теоретично узагальнений досвід, результат пізнання дійсності. Знання підвищують усвідомленість діяльності і впевненість у правильності виконання. Без знань виконати діяльність неможливо."], ["ul", ["<b>Фактичні знання</b> — одиничні поняття, інформація, завчена напам’ять: знаки, цифри, назви, події. Це знання «про щось». Наприклад: бензин — пальне для автомобілів, його добувають з нафти, він легкозаймистий.", "<b>Теоретичні знання</b> — схеми й аналогії, що пояснюють природу процесів і дозволяють прогнозувати.", "<b>Процедурні знання</b> — знання про те, «як…?» і «яким чином…?»: порядок і послідовність процесу.", "<b>Інтегровані знання</b> — поєднання фактичних і процедурних."]], ["p", "Приклад з маскування: курсант знає демаскуючі ознаки — відблиск, колір, розмір, тінь, силует, текстуру, форму (фактичні знання) і розуміє, як замаскувати фортифікаційну споруду (процедурні)."]]}, {"h": "Уміння і навичка", "body": [["p", "<b>Уміння</b> — здатність на належному рівні виконувати певні дії на основі доцільного використання знань і навичок. Формується в кілька стадій: ознайомлення й усвідомлення змісту, початкове оволодіння, самостійне і дедалі точніше виконання. Найвищий рівень уміння — розвинута навичка."], ["p", "<b>Навичка</b> — здатність виконувати дію раціонально, точно і швидко, без постійного контролю свідомості і без зайвих витрат сил. Приклади: їзда на велосипеді, керування автомобілем, перевірка зброї."], ["p", "Деякі педагоги виділяють і четвертий результат навчання — <b>ставлення</b>: цінності, переконання, інтереси, мотивацію. Воно впливає на поведінку і бажання навчатися далі."]]}, {"h": "Як знання стають навичкою", "body": [["p", "Джерела знань бувають <b>зовнішні</b> (люди, книги, навчальний контент, спостереження), <b>внутрішні</b> (власні міркування, аналіз, висновки) та <b>інтегровані</b> (власний досвід, доповнений з інших джерел)."], ["p", "Уміння формуються на базі знань під час спроби втілити їх на практиці: знання — основа уміння. Навичка — результат багаторазового виконання дій, тобто практики."], ["p", "Наприклад: курсант вивчив будову автомата АКМ і порядок неповного розбирання — він <b>знає</b>. Потім розбирає і збирає сам, без допомоги — він <b>уміє</b>. Після кількох десятків повторень на час робить це, не контролюючи рук свідомістю, — це вже <b>навичка</b>."], ["key", "Знаю → вмію → роблю автоматично. Знання дає теорія, уміння — перша практика, навичку — багаторазове повторення."]]}, {"h": "Психомоторна і афективна сфери", "body": [["p", "<b>Психомоторна сфера</b> зосереджена на виконанні послідовності рухів із заданою точністю, плавністю, швидкістю чи силою. В основі рухів завжди лежить їх розуміння. Тому ефективні відеозаписи, презентації, покрокова демонстрація. Курсант має продемонструвати навичку в присутності інструктора, який визначає відповідність стандарту."], ["p", "<b>Афективна сфера</b> стосується ставлення, цінностей, емоцій і мотивації — того, як курсант ставиться до навчання і до своєї ролі. Її формують особистий приклад інструктора, атмосфера на занятті та розуміння, навіщо це потрібно в бою."]]}], "keys": ["Три сфери навчання: когнітивна (знання), психомоторна (навички), афективна (ставлення).", "Типи знань: фактичні, теоретичні, процедурні, інтегровані.", "Уміння — виконання дії на основі знань; навичка — виконання без контролю свідомості.", "Знання — основа вміння; навичка — результат багаторазової практики.", "Джерела знань: зовнішні, внутрішні, інтегровані."], "test": [["За таксономією Блума яка сфера навчання є основною і чому?", ["Когнітивна — дві інші завжди потребують знань", "Психомоторна — армія насамперед вчить діям", "Афективна — без мотивації навчання не працює", "Усі три рівнозначні — основної немає"], "Когнітивна сфера основна: психомоторна й афективна завжди потребують певної частки знань."], ["Курсант відпрацьовує перев’язку з потрібною швидкістю і точністю рухів. Яка це сфера навчання?", ["Психомоторна", "Когнітивна", "Афективна", "Процедурна"], "Психомоторна сфера — виконання послідовності рухів із заданою точністю, плавністю, швидкістю чи силою."], ["Інструктор особистим прикладом формує відповідальне ставлення до безпеки зі зброєю. Яка сфера?", ["Афективна", "Когнітивна", "Психомоторна", "Фактична"], "Афективна сфера — ставлення, цінності, емоції й мотивація; її формують особистий приклад і атмосфера."], ["Курсант знає демаскуючі ознаки: відблиск, колір, тінь, силует. Який це вид знань?", ["Фактичні", "Процедурні", "Теоретичні", "Інтегровані"], "Перелік ознак — знання «про щось», тобто фактичні. Знання, як маскувати, — процедурні."], ["Курсант знає, в якому порядку маскувати фортифікаційну споруду. Який вид знань?", ["Процедурні", "Фактичні", "Теоретичні", "Афективні"], "Процедурні знання — про те, «як…» і «яким чином…»: порядок і послідовність процесу."], ["Які знання пояснюють природу процесів і дозволяють прогнозувати?", ["Теоретичні", "Фактичні", "Процедурні", "Інтегровані"], "Теоретичні знання — схеми й аналогії, що пояснюють природу процесів і дозволяють прогнозувати."], ["Курсант вивчив порядок неповного розбирання АКМ, але сам ще не розбирав. На якому він етапі?", ["Знає", "Уміє", "Має навичку", "Має досвід"], "Знає → вміє → робить автоматично. Без практичної спроби є лише знання."], ["Курсант уперше самостійно, без підказок розібрав і зібрав автомат, повільно і зосереджено. Що сформувалося?", ["Уміння", "Навичка", "Лише знання", "Ставлення"], "Уміння — виконання дії на основі знань. Навичка — коли дія автоматична, швидка, без контролю свідомості."], ["Чим навичка відрізняється від уміння?", ["Виконується швидко і точно без контролю свідомості", "Навичка формується без попередніх знань", "Навичка формується після однієї вдалої спроби", "Уміння є вищим рівнем, ніж навичка"], "Навичка — найвищий рівень уміння: швидко, точно, без контролю свідомості і зайвих витрат сил."], ["Що є джерелом навички?", ["Багаторазове виконання — практика", "Ретельне вивчення настанов і статутів", "Одна вдала спроба під наглядом", "Лекція з детальною демонстрацією"], "Знання дає теорія, уміння — перша практика, навичку — багаторазове повторення."], ["Курсант сам проаналізував свою помилку на стрільбах і зробив висновок. Яке це джерело знань?", ["Внутрішнє", "Зовнішнє", "Інтегроване", "Фактичне"], "Внутрішні джерела — власні міркування, аналіз, висновки. Зовнішні — люди, книги, контент."], ["Чому для психомоторної сфери ефективні відео і покрокова демонстрація?", ["В основі рухів завжди лежить їх розуміння", "Бо курсанти не читають", "Бо так швидше", "Бо інструктор не мусить показувати сам"], "В основі рухів лежить їх розуміння, тому допомагають відео, презентації, покроковий показ."], ["Як підтверджують засвоєння навички психомоторної сфери?", ["Курсант демонструє навичку перед інструктором за стандартом", "Курсант письмово описує порядок виконання навички", "Курсант усно відповідає на запитання про навичку", "Курсант самостійно оцінює себе за контрольним листом"], "Курсант має продемонструвати навичку перед інструктором, який визначає відповідність стандарту."], ["Який четвертий результат навчання виділяють деякі педагоги?", ["Ставлення — цінності, мотивація", "Досвід — сума пережитих ситуацій", "Оцінка — результат контролю", "Дисципліна — виконання наказів"], "Крім знань, умінь і навичок, виділяють ставлення: цінності, переконання, інтереси, мотивацію."], ["Навіщо інструктору враховувати сферу навчання під час планування?", ["Від неї залежать завдання, організація і подача", "Щоб правильно заповнити шапку план-конспекту", "Щоб обрати оцінювача потрібної спеціалізації", "Щоб визначити тривалість заключної частини"], "Сфера навчання визначає навчальні завдання, організацію заняття і спосіб подачі інформації."]]}, {"id": "b1m2t2z3", "code": "Б1 М2 Т2 З3", "theme": "Тема 2. Фактори та принципи навчання", "title": "Сприйняття інформації та комунікація", "short": "Сприйняття інформації", "passport": {"goal": "Ознайомити військовослужбовців з особливостями сприйняття інформації людиною, пояснити зв’язок процесу сприйняття інформації та комунікації, особливості навчання дорослих.", "time": "3 години (135 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Процес і типи сприйняття", "Особливості навчання дорослих", "Уважність під час навчання", "Графіки активності курсантів"], "assess": "Усне опитування; у кінці — намалювати графіки активності на занятті та протягом дня.", "criteria": "Позитивно — якщо надав відповіді й правильно зобразив обидва графіки.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.3; презентація; практичне завдання"}, "sections": [{"h": "Що таке сприйняття", "body": [["p", "Сприйняття — процес, під час якого сенсорна система надсилає сигнали в мозок, де вони обробляються і стають психічними переживаннями. Схема проста: дія → відчуття → обробка."], ["p", "Люди сприймають одне й те саме по-різному. На обробку впливають досвід, знання, навички, ставлення, розум, темперамент, звички, упередження, очікування, почуття, а також фізичний і психологічний стан."], ["p", "Досвідчений інструктор знає, як курсанти обробляють інформацію, тому краще обирає метод її подачі. Знання рівня підготовки курсантів — необхідна умова вибору методів і форм навчання."]]}, {"h": "Два принципи: цілісність і структура", "body": [["p", "<b>Цілісне сприйняття.</b> Людина сприймає предмет цілком, а не окремі властивості. Дивлячись на кілька ліній, ми «бачимо» щасливе і сумне обличчя — мозок сам додає відсутню інформацію з досвіду. Тому інструктор має подавати матеріал цілісно — словесно і візуально, з прикладами з оточення курсантів."], ["p", "<b>Структурне сприйняття.</b> Якщо сірники чи рисочки викладені впорядковано, їх легко порахувати; хаотичні — важко. Людина сприймає структуру і взаємозв’язки. Тому матеріал має бути чітко впорядкований, а інструктор повинен переконатися, що курсанти бачать загальну картину."], ["key", "Подавайте цілісну картину і чітку структуру: курсант має бачити не набір фактів, а систему, де все пов’язано."]]}, {"h": "Особливості навчання дорослих", "body": [["p", "Андрагогіка — мистецтво і наука допомагати дорослим вчитися. Дорослий учень, за Малкольмом Ноулзом, — зріла людина, яка вважає себе відповідальною за своє життя."], ["ul", ["<b>Самосвідомість</b> — дорослий може мотивувати себе сам і швидше вчиться, коли бере участь у процесі; він чинить опір, коли йому не дають діяти самостійно.", "<b>Досвід</b> — у дорослого є життєвий і бойовий досвід; використовуйте його на користь групи.", "<b>Готовність</b> — дорослі хочуть вчитися того, що потрібно для їхньої ролі; їм треба не «багато вчити», а показати, як робити ефективно.", "<b>Орієнтація на результат</b> — покажіть, як заняття допоможе досягти мети, інакше курсант не побачить цінності навчання."]]]}, {"h": "Сприйняття і комунікація протягом дня", "body": [["p", "Комунікація — обмін інформацією між інструктором і курсантами через мову, жести, міміку, технічні засоби. Що чіткіша й логічніша комунікація, то менше когнітивне навантаження і краще засвоєння."], ["p", "Протягом дня увага курсантів коливається через утому, монотонність або збудження. Підтримують увагу зміна форм подачі матеріалу (лекція, дискусія, практика) і регулярний зворотний зв’язок від курсантів."], ["p", "Чинники, якими інструктор підвищує уважність:"], ["ul", ["варіативність методів і мультимедіа — відео, презентації, анімація;", "позитивна атмосфера — похвала, здорова конкуренція, відкритий діалог;", "групова робота, рольові ігри, мозковий штурм, запитання на роздуми;", "структурованість, повтори й підсумки ключових моментів;", "доречний гумор, відсутність зайвого стресу;", "короткі паузи і чергування розумової роботи з рухом;", "урахування рівня, інтересів і мотивації курсантів."]]]}, {"h": "Графіки активності курсантів", "body": [["p", "Ніхто не може бути повністю зосередженим увесь час. Згідно з довідковим матеріалом, курсанти здатні уважно слухати близько 6 хвилин і дивитися близько 12 хвилин, після чого концентрація падає. Увага вища, коли курсанти не лише слухають, а й беруть активну участь."], ["p", "<b>Крива енергії заняття</b> показує, як змінюється уважність протягом 45 хвилин. Найважчий матеріал подавайте на піку енергії, а коли крива падає — переходьте до методів з активною участю курсантів."], ["p", "<b>Крива енергії дня</b> показує, що найпродуктивніші ранкові заняття, пік — близько 11-ї години. Одразу після обіду енергія падає, тож перше заняття після обіду краще зробити активним, але без важких фізичних вправ. Найскладнішу тему ставте на час піку енергії."], ["key", "Плануйте заняття за кривими енергії: складне — на пік, активне — на спад."], ["p", "Практичне завдання заняття: самостійно намалювати графік уважності на занятті (45 хв) і графік уважності протягом дня."]]}], "keys": ["Сприйняття: дія → відчуття → обробка; на нього впливають досвід, очікування, стан людини.", "Два принципи: люди сприймають цілісно і структурно.", "Дорослі вчаться краще, коли бачать користь, беруть участь і можуть спиратися на свій досвід.", "Увагу підтримують зміна методів, активна участь, паузи, позитивна атмосфера.", "Найпродуктивніший час дня — ранок, пік близько 11:00; після обіду — спад."], "test": [["Яка схема процесу сприйняття?", ["Дія → відчуття → обробка", "Обробка → дія → відчуття", "Відчуття → дія → оцінка", "Увага → пам’ять → дія"], "Сприйняття: дія → відчуття → обробка в мозку, де сигнали стають психічними переживаннями."], ["Двоє курсантів дивилися ту саму демонстрацію, але зрозуміли її по-різному. Чому?", ["На обробку впливають досвід, знання й стан людини", "Один із них був неуважним під час показу", "Демонстрація була проведена неправильно", "Різне розуміння можливе лише при поганому показі"], "Люди сприймають одне й те саме по-різному: впливають досвід, знання, звички, упередження, фізичний і психологічний стан."], ["Кілька ліній ми бачимо як обличчя — мозок «домальовує» решту. Який принцип сприйняття?", ["Цілісне сприйняття", "Структурне сприйняття", "Вибіркова увага", "Ефект новизни"], "Цілісне сприйняття: людина сприймає предмет цілком, мозок додає відсутнє з досвіду."], ["Впорядковані сірники порахувати легко, розкидані — важко. Що з цього випливає для інструктора?", ["Матеріал має бути структурованим, з цілісною картиною", "Треба показувати якомога менше предметів одночасно", "Треба давати більше часу на кожен елемент", "Наочні засоби більше шкодять, ніж допомагають"], "Структурне сприйняття: людина бачить структуру і взаємозв’язки, тому матеріал має бути впорядкованим."], ["Що таке андрагогіка?", ["Наука і мистецтво навчання дорослих", "Методика навчання дітей і підлітків", "Наука про мотивацію і поведінку", "Система оцінювання курсантів"], "Андрагогіка — мистецтво і наука допомагати дорослим вчитися (Малкольм Ноулз)."], ["Досвідчений курсант чинить опір, коли інструктор не дає йому діяти самостійно. Яку особливість дорослих це відображає?", ["Самосвідомість", "Готовність", "Орієнтацію на результат", "Залежність від контексту"], "Самосвідомість: дорослий мотивує себе сам і чинить опір, коли йому не дають діяти самостійно."], ["У групі є курсанти з бойовим досвідом. Як діяти за принципами навчання дорослих?", ["Використати їхній досвід на користь групи", "Не давати їм слова, щоб не збивали програму", "Перевести їх в іншу групу", "Ігнорувати, бо досвід у всіх різний"], "Досвід дорослого — ресурс: використовуйте його на користь групи."], ["Курсант запитує: «Навіщо мені це?» Яку особливість дорослих треба врахувати?", ["Орієнтацію на результат — показати користь заняття", "Самосвідомість — дати йому самому знайти відповідь", "Готовність — дати більше теорії перед практикою", "Досвід — попросити його розповісти про себе"], "Орієнтація на результат: якщо не показати, як заняття допоможе, курсант не побачить цінності навчання."], ["Скільки приблизно хвилин курсанти здатні уважно слухати, перш ніж концентрація падає?", ["Близько 6 хвилин", "Близько 20 хвилин", "Близько 45 хвилин", "Близько 2 хвилин"], "За довідковим матеріалом курсанти уважно слухають близько 6 хв і дивляться близько 12 хв."], ["Коли за кривою енергії заняття подавати найважчий матеріал?", ["На піку енергії", "Наприкінці заняття", "Коли крива падає", "На самому початку, до вступу"], "Найважчий матеріал — на піку енергії; на спаді — методи з активною участю курсантів."], ["О котрій приблизно годині пік енергії дня?", ["Близько 11-ї", "Близько 8-ї", "Близько 14-ї", "Близько 17-ї"], "Найпродуктивніші ранкові заняття, пік — близько 11-ї години."], ["Перше заняття після обіду. Яке рішення найкраще?", ["Активне заняття без важких фізичних вправ", "Найскладніша лекція дня, поки всі ситі", "Інтенсивна фізична підготовка", "Самостійне читання конспектів"], "Після обіду енергія падає: заняття має бути активним, але без важкого фізичного навантаження."], ["Що з переліченого НЕ підвищує уважність курсантів?", ["Зайвий стрес і постійний тиск", "Короткі паузи і чергування розумової роботи з рухом", "Доречний гумор", "Повтори й підсумки ключових моментів"], "Уважність підвищують варіативність, позитивна атмосфера, структура, гумор, паузи. Зайвий стрес — шкодить."], ["Чому чітка логічна комунікація покращує засвоєння?", ["Вона зменшує когнітивне навантаження", "Вона скорочує заняття", "Вона усуває потребу в практиці", "Вона замінює наочність"], "Що чіткіша й логічніша комунікація, то менше когнітивне навантаження і краще засвоєння."], ["Інструктор 40 хвилин поспіль читає лекцію без жодної зміни форми. Що він робить не так?", ["Не змінює форм подачі — увага неминуче падає", "Нічого — лекція і має бути безперервною", "Говорить надто повільно", "Мало пише на дошці"], "Увагу підтримують зміна форм подачі (лекція, дискусія, практика) і зворотний зв’язок."]]}, {"id": "b1m2t2z4", "code": "Б1 М2 Т2 З4", "theme": "Тема 2. Фактори та принципи навчання", "title": "Мотивування курсантів", "short": "Мотивація", "passport": {"goal": "Ознайомити військовослужбовців із принципами мотивування курсантів.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, практичне заняття; навчальний клас", "questions": ["Поняття мотивації та її важливість", "Основні теорії мотивації", "Види та принципи мотивування", "Методи мотивування курсантів"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці; тестування «мотивація успіху та страх невдачі» (Мехрабіан).", "criteria": "Позитивно — якщо пояснює, що таке мотивація, називає її види і теорії.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.4; презентація; тест за темою"}, "sections": [{"h": "Що таке мотивація", "body": [["p", "Мотивація — внутрішній емоційний стан людини, що спонукає її до дій. Саме вона визначає напрям, силу і стійкість поведінки в досягненні цілей і є рушієм активної участі курсантів у навчанні."], ["p", "Дії, пов’язані з досягненням бажаного, вимагають менше сил і часу, ніж ті, до яких людина байдужа. Будь-яке навчання може стати рутиною або захопливою справою — залежно від того, чи відповідає воно внутрішнім потребам людини."], ["p", "Низька мотивація призводить до розсіювання уваги і небажання бути на занятті. Тому інструктор організовує роботу так, щоб викликати зацікавленість, підвищити активність і стимулювати бажання прогресувати: навчання має бути важливим і корисним, якомога активнішим, з можливістю бачити власні досягнення."], ["key", "«За відсутності мотивації ви приречені на посередній результат, якими б здібностями не володіли» — Ендрю Карнегі."]]}, {"h": "Теорії мотивації: Маслоу і Врум", "body": [["p", "<b>Ієрархія потреб Абрахама Маслоу.</b> Мотивація залежить від потреб, які мають ієрархію від базових до вищих: фізіологічні → безпеки → соціальні → повага → самовираження. Потреби задовольняються знизу вгору: поки не задоволені базові, вищі слабко проявляються і не мотивують."], ["p", "Голодний, змерзлий або невиспаний курсант думатиме про їжу, тепло і сон, а не про тему заняття."], ["p", "<b>Теорія очікувань Віктора Врума.</b> Мотивація досягається винагородою, а сила прагнення залежить від трьох факторів:"], ["ul", ["чи є зв’язок між зусиллями і результатом;", "чи реально отримати винагороду за результат;", "чи цінна ця винагорода для самої людини."]], ["p", "Якщо очікування не справджуються, виникає відчуття марності зусиль. Допомагають досяжні цілі й винагорода, яку людина цінує. Складність завдання має відповідати здібностям того, хто його виконує."]]}, {"h": "Теорії мотивації: Герцберг і постановка цілей", "body": [["p", "<b>Теорія двох факторів Фредеріка Герцберга (1959).</b> Є дві незалежні групи факторів:"], ["ul", ["<b>гігієнічні</b> — пов’язані з умовами, а не змістом роботи: правила, справедливість керівництва, оплата, стосунки, умови праці, статус, стабільність. Їх наявність не робить людину задоволеною, але відсутність викликає незадоволення — як гігієна: не робить щасливим, але без неї хворієш;", "<b>мотиватори</b> — пов’язані із самою суттю роботи: досягнення, визнання, цікавий зміст, відповідальність, просування, зростання. Саме вони підвищують залученість і продуктивність."]], ["p", "<b>Теорія постановки цілей Едвіна Локка і Гері Латама.</b> Усвідомлені й складні цілі — потужний мотиватор. Принципи: ціль складна, але досяжна; конкретна і вимірювана; прийнята людиною; є регулярний зворотний зв’язок; людина вірить у власну здатність її досягти."], ["p", "Маслоу також описав <b>самореалізацію</b> на вершині піраміди — прагнення розкрити свій потенціал, пов’язане з вищими, «буттєвими» цінностями: істиною, добром, справедливістю, досконалістю."], ["key", "Мотивація зростає, коли людина має чітко визначені, досяжні цілі й отримує зворотний зв’язок про прогрес."]]}, {"h": "Види мотивації", "body": [["ul", ["<b>За джерелом:</b> внутрішня — задоволення від процесу, відчуття компетентності, прагнення розвиватися (найстійкіша); зовнішня — нагороди, покарання, похвала, тиск (ефективна, але менш стійка).", "<b>За спрямованістю:</b> позитивна — заохочення, прагнення до успіху; негативна — страх покарання чи провалу. Негативна діє коротко і може знижувати ініціативу.", "<b>За змістом:</b> матеріальна — грошові винагороди, пільги; нематеріальна — похвала, визнання, цікава робота, розвиток."]], ["p", "Внутрішня мотивація спрямована на процес і результат, зовнішня — на отримання блага або уникнення покарання."]]}, {"h": "Принципи ефективного мотивування", "body": [["ul", ["<b>Індивідуальний підхід</b> — те, що мотивує одного, може бути байдужим іншому.", "<b>Усвідомленість цілей</b> — цілі конкретні, вимірювані, досяжні, доречні й обмежені в часі (SMART).", "<b>Заохочення успіху</b> — відзначайте навіть невеликі досягнення.", "<b>Справедливість</b> — однакові правила заохочення й покарання для всіх.", "<b>Зворотний зв’язок</b> — регулярний і конструктивний.", "<b>Залучення</b> — давайте висловити думку і взяти відповідальність.", "<b>Сприятливе середовище</b> — комфортні умови і нормальні стосунки."]]]}, {"h": "Методи мотивування курсантів", "body": [["p", "<b>Внутрішня мотивація:</b> показуйте, як знання знадобляться на службі і в бою; розповідайте історії успіху випускників; використовуйте інтерактивні методи — дискусії, кейси, рольові ігри, симуляції; заохочуйте пошук додаткової інформації; відзначайте прогрес і зусилля."], ["p", "<b>Зовнішня позитивна:</b> публічно відзначайте успіхи; заохочення в межах статуту — подяки, грамоти, додаткові звільнення; навчальні змагання з чесними критеріями; доручення з відповідальністю."], ["p", "<b>Зовнішня негативна — лише як крайній захід:</b> чіткі правила і наслідки, справедливе й послідовне застосування покарань, акцент на виправленні помилки, а не на приниженні людини."], ["p", "<b>Зворотний зв’язок:</b> частий, конкретний, з рекомендаціями, на основі фактів, своєчасний."], ["warn", "Основний акцент — на позитивних методах. Негативна мотивація у довгостроковій перспективі викликає стрес і вбиває ініціативу."]]}], "keys": ["Мотивація — внутрішній емоційний стан, що спонукає людину до дій.", "Піраміда Маслоу: фізіологічні, безпеки, соціальні, повага, самовираження.", "Врум: зусилля → результат → винагорода, яку людина цінує.", "Герцберг: гігієнічні фактори і мотиватори.", "Види: внутрішня і зовнішня, позитивна і негативна, матеріальна і нематеріальна.", "Негативна мотивація — лише крайній захід; основне — позитивні методи і зворотний зв’язок."], "test": [["Курсанти після нічного наряду, голодні й змерзлі, не можуть зосередитися на темі. Яка теорія мотивації це пояснює?", ["Ієрархія потреб Маслоу", "Теорія очікувань Врума", "Теорія двох факторів Герцберга", "Теорія цілей Локка і Латама"], "За Маслоу потреби задовольняються знизу вгору: голодний чи невиспаний думає про їжу і сон, а не про тему."], ["Яка правильна послідовність потреб у піраміді Маслоу знизу вгору?", ["Фізіологічні → безпеки → соціальні → повага → самовираження", "Безпеки → фізіологічні → повага → соціальні → самовираження", "Соціальні → фізіологічні → безпеки → повага → самовираження", "Повага → безпеки → соціальні → фізіологічні → самовираження"], "Знизу вгору: фізіологічні, безпеки, соціальні, повага, самовираження."], ["Курсант не бачить зв’язку між тим, скільки тренується, і своїм результатом на стрільбах. Який фактор теорії Врума «не працює»?", ["Зв’язок між зусиллями і результатом", "Цінність винагороди", "Реальність отримати винагороду", "Гігієнічний фактор"], "Врум: сила прагнення залежить від зв’язку зусилля–результат, реальності винагороди і її цінності для людини."], ["Інструктор пообіцяв винагороду, яку курсанти не цінують. Що станеться за теорією Врума?", ["Мотивація буде слабкою — винагорода має бути цінною", "Мотивація зросте — важливий сам факт винагороди", "Мотивація зросте, якщо винагорода буде публічною", "Курсанти перейдуть до потреби самовираження"], "Винагорода мотивує лише тоді, коли вона цінна для самої людини."], ["У казармі холодно, а правила несправедливі. За Герцбергом, до чого це призведе?", ["До незадоволення — це гігієнічні фактори", "До зростання мотивації — це мотиватори", "Ні до чого — умови на мотивацію не впливають", "До самореалізації через подолання труднощів"], "Гігієнічні фактори (умови, справедливість, правила) не роблять задоволеним, але їх відсутність викликає незадоволення."], ["Що з переліченого — мотиватор за Герцбергом, а не гігієнічний фактор?", ["Визнання досягнень", "Умови праці", "Справедливість керівництва", "Стабільність служби"], "Мотиватори пов’язані зі змістом роботи: досягнення, визнання, цікавий зміст, відповідальність, зростання."], ["Яка ціль найкраще відповідає теорії постановки цілей Локка і Латама?", ["Скласти норматив з розбирання АК за 25 с до п’ятниці", "Старатися на кожному занятті якнайкраще й надалі", "Стати найкращим стрільцем роти до кінця служби", "Розібрати автомат за 5 секунд уже завтра зранку"], "Ціль має бути складною, але досяжною, конкретною і вимірюваною, прийнятою людиною, зі зворотним зв’язком."], ["Яка мотивація найстійкіша?", ["Внутрішня — задоволення від процесу і розвитку", "Зовнішня негативна — страх покарання чи провалу", "Матеріальна — грошова винагорода і пільги", "Зовнішня позитивна — публічна похвала"], "Внутрішня мотивація найстійкіша; зовнішня ефективна, але менш стійка."], ["Чим небезпечна негативна мотивація в довгостроковій перспективі?", ["Викликає стрес і вбиває ініціативу", "Робить курсантів надто самостійними", "Підвищує витрати на навчання", "Нічим, якщо застосовувати часто"], "Негативна мотивація діє коротко, викликає стрес і знижує ініціативу; її застосовують лише як крайній захід."], ["Інструктор заохочує одних курсантів за те, за що інших карає. Який принцип мотивування порушено?", ["Справедливість — однакові правила для всіх", "Індивідуальний підхід — різне для різних", "Залучення — можливість висловити думку", "Сприятливе середовище — комфортні умови"], "Принцип справедливості: однакові правила заохочення й покарання для всіх."], ["Що означає абревіатура SMART щодо цілей?", ["Конкретні, вимірювані, досяжні, доречні, обмежені в часі", "Прості, масові, активні, реальні, точні", "Складні, мотивуючі, амбітні, ризиковані, творчі", "Самостійні, методичні, адаптивні, раціональні, тактичні"], "SMART — specific, measurable, achievable, relevant, time-bound: конкретні, вимірювані, досяжні, доречні й обмежені в часі."], ["Яким має бути зворотний зв’язок для мотивування?", ["Частим, конкретним, на основі фактів, своєчасним", "Рідкісним, щоб курсанти не розслаблялися", "Загальним, без деталей, щоб не образити", "Лише підсумковим — наприкінці курсу"], "Зворотний зв’язок: частий, конкретний, з рекомендаціями, на основі фактів, своєчасний."], ["Який метод формує саме внутрішню мотивацію курсанта?", ["Показати, як знання знадобляться в бою", "Видати грамоту найкращим за тиждень", "Пригрозити позачерговим нарядом", "Дати додаткове звільнення за норматив"], "Внутрішня мотивація: зв’язок знань із бойовою реальністю, історії успіху, інтерактивні методи, відзначення прогресу."], ["Якщо вже доводиться застосовувати покарання, на чому має бути акцент?", ["На виправленні помилки, а не на приниженні", "На публічному осуді перед строєм", "На суворості, щоб інші боялися повторити", "На покаранні всієї групи за одного"], "Негативна мотивація — крайній захід: чіткі правила, справедливість, акцент на виправленні помилки."], ["Що означає принцип індивідуального підходу в мотивуванні?", ["Те, що мотивує одного, може бути байдужим іншому", "Кожен курсант отримує однакову винагороду", "Мотивують лише найкращих", "Мотивація — особиста справа курсанта"], "Індивідуальний підхід: різних людей мотивують різні речі."]]}, {"id": "b1m2t2z5", "code": "Б1 М2 Т2 З5", "theme": "Тема 2. Фактори та принципи навчання", "title": "Прийоми та способи впливу інструктора на курсантів", "short": "Прийоми впливу", "passport": {"goal": "Довести до військовослужбовців прийоми та способи впливу інструктора на курсантів.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Фактори, які спонукають до навчання; прийоми та способи впливу", "Вплив попередньо набутих знань і досвіду", "Рекомендації щодо позитивного впливу", "Способи та методи управління класом"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає фактори, що спонукають до навчання, прийоми впливу і методи управління класом.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 2.5; презентація"}, "sections": [{"h": "Що спонукає до навчання", "body": [["p", "Є чотири основні фактори, які дозволяють досягти найкращого результату в найкоротший термін і з мінімальними зусиллями:"], ["ul", ["<b>Знання власних досягнень</b> — курсант бачить, що виконав правильно, а що ні, і свій прогрес: результати стрільб, фізичних нормативів, рейтинг оцінок.", "<b>Взаємодія інструктор — курсант</b> — навчання найефективніше, коли зв’язок двосторонній.", "<b>Системність і структура</b> — послідовний виклад, виділення основного, логічний перехід від відомого до нового.", "<b>Результативне застосування знань</b> — матеріал максимально наближений до реального життя і служби курсантів."]], ["p", "Вплив — дія, яку одна особа виявляє стосовно іншої. Він буває прямим і непрямим, а основні форми прояву — <b>авторитет, переконання і примус</b>. Інструктор повинен усвідомлювати цілі й наслідки свого впливу."]]}, {"h": "Прийоми впливу інструктора", "body": [["p", "Прийоми впливу застосовуються етично, професійно і з урахуванням особливостей курсантів:"], ["ul", ["<b>Переконання і пояснення</b> — логічне обґрунтування правил і вимог фактами й доказами.", "<b>Прохання і порада</b> — звернення до свідомості й відповідальності, рекомендації з власного досвіду.", "<b>Заохочення і стимулювання</b> — позитивна оцінка зусиль, нагороди, здорова конкуренція.", "<b>Критика і зауваження</b> — обґрунтовані, конкретні, спрямовані на вчинок, а не на особистість.", "<b>Нагадування і попередження</b> — увага до правил і можливих наслідків.", "<b>Особистий приклад</b> — курсанти наслідують поведінку наставника.", "<b>Проблемна ситуація і ситуація успіху</b> — завдання на роздуми і можливість відчути досягнення.", "<b>Ігнорування</b> — у разі дрібних провокацій тимчасове ігнорування припиняє небажану поведінку без зайвої уваги.", "<b>Емоційний, соціальний та інформаційний вплив</b> — емпатія, позитивні групові норми, потрібна інформація для свідомих рішень.", "<b>Статутні вимоги</b> — посилання на статути для обґрунтування вимог."]], ["key", "Критикуємо вчинок, а не людину. Вплив має розвивати відповідальність і самостійність курсанта."]]}, {"h": "Попередній досвід курсантів", "body": [["p", "Попередні знання і досвід можуть і допомагати, і заважати навчанню."], ["p", "<b>Позитивний вплив:</b> легше зрозуміти новий матеріал і пов’язати його з відомим; швидше опанувати нову модифікацію знайомої техніки; розвинене критичне мислення; вища мотивація; кращі практичні навички; обмін досвідом збагачує групу; зріліше ставлення до навчання."], ["p", "<b>Негативний вплив:</b> інтерференція — старі звички заважають новим (нова модель зброї вимагає відмови від звичних рухів); консерватизм і опір новому; самовпевненість і недооцінка матеріалу; стереотипи; різний рівень підготовки в групі."], ["p", "Як урахувати досвід: вхідне оцінювання; пов’язувати нову тему з відомим; давати ділитися досвідом; розбирати реальні ситуації зі служби; диференційований підхід; чітко пояснювати відмінності нового від старого."]]}, {"h": "Як здійснювати позитивний вплив", "body": [["ul", ["<b>Встановіть контакт і довіру:</b> будьте доброзичливим, запам’ятовуйте імена, уважно слухайте, ставтеся до всіх однаково, без фаворитів, поважайте кожного.", "<b>Покажіть професіоналізм:</b> високий рівень знань і дисципліни, доступна мова, чіткі завдання й вимоги.", "<b>Застосовуйте позитивні методи:</b> відзначайте навіть невеликі успіхи, давайте конструктивні коментарі, можливість приймати рішення.", "<b>Враховуйте індивідуальність:</b> кожен навчається у власному темпі; допомагайте тим, кому важко.", "<b>Створюйте групову динаміку:</b> командна робота, правила взаємоповаги, відповідальність за групу.", "<b>Будьте послідовним і системним</b> у вимогах і діях.", "<b>Розвивайтеся самі:</b> аналізуйте свої методи, приймайте зворотний зв’язок від курсантів і колег."]]]}, {"h": "Управління класом", "body": [["p", "<b>Організаційні методи:</b> на початку курсу чітко довести правила поведінки і алгоритми типових дій — вхід, вихід, запитання, здача робіт; завчасно готувати матеріали й обладнання; облаштувати клас так, щоб бачити всіх; дотримуватися плану заняття."], ["p", "<b>Дисциплінарні методи:</b> позитивне підкріплення бажаної поведінки; корекція небажаної — спокійне попередження, конкретне зауваження без критики особистості, позбавлення привілеїв у межах статуту, педагогічно обґрунтовані додаткові завдання, звернення до старшого керівництва. Принципи — невідворотність, справедливість і послідовність."], ["p", "<b>Залученість і мотивація:</b> активні методи, спільні цілі, віра в успіх курсантів, доречний гумор, можливість вибору."], ["p", "<b>Комунікація:</b> чітка мова без незрозумілих термінів, активне слухання, невербальні сигнали, регулярний зворотний зв’язок, індивідуальні бесіди."], ["p", "<b>Управління конфліктами:</b> раннє виявлення, вислухати кожну сторону, шукати компроміс; якщо курсанти не можуть домовитися — інструктор виступає медіатором або ухвалює остаточне рішення."]]}], "keys": ["Чотири фактори: знання власних досягнень, взаємодія інструктор — курсант, системність, застосування знань.", "Форми впливу: авторитет, переконання, примус.", "Критика — конструктивна і спрямована на вчинок, а не на особистість.", "Попередній досвід може допомагати і заважати (інтерференція, консерватизм, самовпевненість).", "Дисципліна: позитивне підкріплення, невідворотність, справедливість, послідовність."], "test": [["Курсант бачить свій рейтинг оцінок і прогрес на стрільбах. Який фактор, що спонукає до навчання, працює?", ["Знання власних досягнень", "Системність і структура", "Результативне застосування знань", "Взаємодія інструктор — курсант"], "Знання власних досягнень: курсант бачить, що виконав правильно, і свій прогрес."], ["Які три основні форми прояву впливу?", ["Авторитет, переконання і примус", "Похвала, критика і покарання", "Пояснення, показ і практика", "Наказ, прохання і порада"], "Вплив буває прямим і непрямим, а основні форми прояву — авторитет, переконання і примус."], ["Курсант зробив помилку. Яке зауваження правильне з погляду прийомів впливу?", ["«Не перевірив патронник — це небезпечно, повтори»", "«Ти завжди все робиш погано, як і вчора»", "«З тебе солдата не вийде, якщо так і далі»", "Промовчати, щоб не образити і не збити темп"], "Критика — обґрунтована, конкретна, спрямована на вчинок, а не на особистість."], ["Курсант дрібно провокує інструктора, щоб привернути увагу групи. Який прийом може тимчасово припинити це без зайвої уваги?", ["Ігнорування", "Публічна критика", "Залякування", "Покарання всієї групи"], "Тимчасове ігнорування дрібних провокацій припиняє небажану поведінку без зайвої уваги."], ["Інструктор посилається на статут, щоб обґрунтувати вимогу до носіння форми. Який це прийом?", ["Статутні вимоги", "Особистий приклад", "Проблемна ситуація", "Емоційний вплив"], "Статутні вимоги — посилання на статути для обґрунтування вимог."], ["Курсант, який роками стріляв з АК, на новій зброї НАТО повторює старі рухи. Як це називається?", ["Інтерференція", "Консерватизм", "Самовпевненість", "Стереотип"], "Інтерференція: старі звички заважають новим, нова модель зброї вимагає відмови від звичних рухів."], ["Досвідчений курсант недооцінює тему: «Я це все знаю». Який негативний вплив попереднього досвіду?", ["Самовпевненість", "Інтерференція", "Різний рівень у групі", "Консерватизм"], "Негативний вплив досвіду: інтерференція, консерватизм, самовпевненість, стереотипи, різний рівень у групі."], ["Як найкраще з’ясувати попередній рівень підготовки нової групи?", ["Провести вхідне оцінювання", "Запитати командира роти", "Дивитися на звання", "Не з’ясовувати — програма однакова для всіх"], "Щоб урахувати досвід: вхідне оцінювання, зв’язок нового з відомим, обмін досвідом, диференційований підхід."], ["Що допомагає встановити контакт і довіру з групою?", ["Запам’ятовувати імена, слухати, ставитися до всіх рівно", "Відзначати улюбленців серед найкращих курсантів", "Тримати максимальну дистанцію, не вступати в розмови", "Цікавитися особистим життям курсантів при групі"], "Контакт і довіра: доброзичливість, імена, уважне слухання, однакове ставлення без фаворитів."], ["Що варто зробити на початку курсу для управління класом?", ["Чітко довести правила і алгоритми типових дій", "Дати групі самій домовитися про правила", "Нічого — правила стануть зрозумілі з часом", "Суворо покарати першого порушника для прикладу"], "Організаційні методи: на початку чітко довести правила і алгоритми — вхід, вихід, запитання, здача робіт."], ["Які принципи застосування дисциплінарних методів?", ["Невідворотність, справедливість і послідовність", "Суворість, раптовість і публічність покарання", "Гнучкість залежно від ситуації і настрою", "Колективна відповідальність усієї групи"], "Дисциплінарні методи застосовують за принципами невідворотності, справедливості і послідовності."], ["Двоє курсантів посварилися й не можуть домовитися. Яка роль інструктора?", ["Медіатор або той, хто ухвалює рішення", "Не втручатися — хай розберуться самі", "Одразу покарати обох за порушення", "Перевести обох в інші групи"], "Конфлікт: раннє виявлення, вислухати обидві сторони, компроміс; якщо не домовились — інструктор медіатор або ухвалює рішення."], ["Інструктор першим прибуває, завжди охайний і першим виконує норматив. Який прийом впливу?", ["Особистий приклад", "Переконання фактами", "Нагадування правил", "Заохочення успіхів"], "Особистий приклад — курсанти наслідують поведінку наставника."], ["Що з переліченого — НЕ дисциплінарний метод корекції поведінки?", ["Приниження курсанта перед строєм", "Спокійне попередження", "Позбавлення привілеїв у межах статуту", "Педагогічно обґрунтоване додаткове завдання"], "Корекція: попередження, зауваження без критики особистості, позбавлення привілеїв, додаткові завдання, звернення до керівництва."], ["Інструктор дає курсантам завдання, яке вони точно виконають, щоб відчули досягнення. Який прийом?", ["Ситуація успіху", "Проблемна ситуація", "Ігнорування", "Попередження"], "Проблемна ситуація — завдання на роздуми; ситуація успіху — можливість відчути досягнення."]]}, {"id": "b1m2t3z1", "code": "Б1 М2 Т3 З1", "theme": "Тема 3. Якості інструктора", "title": "Основні якості та характеристики інструктора", "short": "Якості інструктора", "passport": {"goal": "Ознайомити військовослужбовців з якостями та характеристиками, якими повинен володіти інструктор.", "time": "2 години (90 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Якості хорошого інструктора", "Важливість цих якостей для результату навчання", "Як розвивати потрібні якості", "Якостей і стилів поведінки, яких слід уникати"], "assess": "Усне опитування після кожного навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає, якими якостями має володіти інструктор, і яких слід уникати.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 3.1; презентація; тест за темою"}, "sections": [{"h": "П’ять ключових якостей", "body": [["p", "Хорошим інструктором не народжуються — ним стають. Основні якості легко запам’ятати: <b>впевненість, вихованість, ставлення, старанність, ентузіазм</b>."], ["p", "<b>Впевненість.</b> Щоб переконливо викладати, інструктор має випромінювати впевненість. Вона зростає, якщо:"], ["ul", ["глибоко знаєте предмет;", "маєте бездоганні особисті стандарти;", "ретельно готуєтеся і плануєте навчання;", "заздалегідь добре організовуєте заняття."]], ["p", "Обізнаність, планування і тренування дають упевненість в успіху, а з нею приходить повага курсантів."]]}, {"h": "Вихованість: мова, рухи, вигляд", "body": [["p", "Вихованість інструктора — це поєднання мови, рухів, жестів, поведінки і зовнішнього вигляду."], ["ul", ["<b>Мова</b> — гучна, чітка, розбірлива; уникайте одноманітного тону. Зміна ритму, швидкості й гучності утримує увагу. Щоб перевірити голос, запишіть себе на занятті і проаналізуйте запис.", "<b>Рухи</b> — плавні й легкі. Час від часу рухайтеся для кращого контакту з аудиторією, але без зайвих рухів, що відволікають.", "<b>Зовнішній вигляд і поведінка</b> — крім польових занять, бездоганний вигляд і відповідна манера. Будь-яку слабкість чи недоречне висловлювання курсанти помітять одразу."]]]}, {"h": "Ставлення, старанність, ентузіазм", "body": [["p", "<b>Ставлення</b> — інструктор є прикладом ставлення до предмета. Воно включає:"], ["ul", ["<b>чесність і справедливість</b> — без фаворитів, без висміювання тих, хто відстає, без зловживання становищем;", "<b>твердість, рішучість, надійність</b> — чіткі межі стосунків, не дозволяти порушувати порядок, за потреби відновлювати контроль;", "<b>дружність</b> — підтримка, визнання досягнень, заохочення ініціативи створюють взаємну повагу."]], ["p", "<b>Старанність</b> — абсолютна передумова успіху і репутації: прагнення до досконалості, увага до деталей, вимогливість до себе й курсантів, постійне самовдосконалення."], ["p", "<b>Ентузіазм</b> — курсанти миттєво помічають байдужість інструктора, і бажання вчитися зникає. Хороший інструктор ефективно подасть навіть нецікавий предмет. Усі теми важливі, усі теми цікаві — а власні проблеми залишаються за дверима класу."]]}, {"h": "Чому ці якості такі важливі", "body": [["ul", ["знання предмета і комунікативні навички дозволяють чітко доносити інформацію;", "ентузіазм і вміння надихати забезпечують активну участь і мотивацію;", "справедливість, емпатія, терпіння створюють атмосферу довіри і безпеки;", "вимогливість, послідовність і чіткі правила забезпечують дисципліну;", "спостережливість дозволяє підлаштувати методи під кожного;", "особистий приклад і професіоналізм виховують курсантів."]], ["key", "Без цих якостей навчання стає формальністю. З ними інструктор — не просто передавач знань, а наставник, лідер і мотиватор."]]}, {"h": "Як розвивати якості інструктора", "body": [["p", "<b>Формальна підготовка:</b> курси інструкторів і спеціалізовані курси з педагогіки, психології навчання дорослих, управління групою, комунікації; тренінги лідерства; вивчення військової педагогіки; семінари; робота під керівництвом досвідчених інструкторів."], ["p", "<b>Саморозвиток:</b> проводити заняття помічником досвідченого інструктора; самостійно готувати й проводити окремі елементи занять; просити зворотний зв’язок у курсантів і колег; регулярно аналізувати свої заняття; тренувати активне слухання і чіткість висловлювань; розвивати лідерські й організаційні навички; працювати над самодисципліною, відповідальністю і стресостійкістю."]]}, {"h": "Чого інструктор уникає", "body": [["p", "<b>Негативні якості:</b> некомпетентність, відсутність чіткої позиції, необ’єктивність і «улюбленці», нервозність і спалахи гніву, недбала підготовка і запізнення, демонстрація зверхності, нечесність і невиконання обіцянок."], ["p", "<b>Неприйнятні стилі поведінки:</b> авторитарність без діалогу; панібратство і втрата дистанції; залякування і погрози; ігнорування конфліктів; непослідовність; демонстративна втома і байдужість."], ["p", "<b>Неприпустимі стилі спілкування:</b> образливі висловлювання, сарказм і лайка; критика особистості замість дій; монолог замість діалогу; незрозуміла мова; крик; ігнорування запитань; плітки й обговорення особистого життя курсантів."], ["warn", "Також погано: безвідповідальне використання часу заняття, постійне читання з конспекту, перекладання на курсантів власних проблем і пошук виправдань своєї некомпетентності."]]}], "keys": ["П’ять якостей: впевненість, вихованість, ставлення, старанність, ентузіазм.", "Впевненість дають знання предмета, бездоганні стандарти, підготовка й організація.", "Мова гучна і чітка, без одноманітного тону; рухи плавні; вигляд бездоганний.", "Ставлення: чесність, твердість, дружність — без фаворитів і без панібратства.", "Не можна: крик, сарказм, приниження, критика особистості, читання з конспекту."], "test": [["Назвіть п’ять ключових якостей інструктора.", ["Впевненість, вихованість, ставлення, старанність, ентузіазм", "Сила, витривалість, спритність, швидкість, гнучкість", "Знання, уміння, навичка, досвід, звання", "Суворість, вимогливість, контроль, дисципліна, покарання"], "П’ять якостей: впевненість, вихованість, ставлення, старанність, ентузіазм."], ["Молодий інструктор нервує перед першим заняттям. Що за матеріалом найкраще підвищить його впевненість?", ["Знання предмета, ретельна підготовка й організація", "Гучніший голос і суворий вигляд перед групою", "Скорочення заняття, щоб менше хвилюватися", "Дослівне читання з конспекту без відхилень"], "Впевненість зростає від знання предмета, бездоганних стандартів, ретельної підготовки й організації."], ["Як інструктор може перевірити свій голос і манеру мовлення?", ["Записати себе на занятті й проаналізувати", "Запитати думку одного з курсантів", "Говорити якомога гучніше весь час", "Ніяк — голос і манера вроджені"], "Щоб перевірити голос, запишіть себе на занятті й проаналізуйте запис."], ["Що допомагає утримувати увагу під час мовлення?", ["Зміна ритму, швидкості й гучності", "Рівний спокійний тон без змін", "Підвищений голос протягом заняття", "Швидке мовлення без зайвих пауз"], "Уникайте одноманітного тону: зміна ритму, швидкості й гучності утримує увагу."], ["Інструктор постійно ходить по класу і жестикулює, курсанти стежать за ним, а не за темою. Що не так?", ["Зайві рухи, що відволікають", "Він мало рухається", "Він не дивиться в конспект", "Нічого, рух — це добре"], "Рухи мають бути плавними; час від часу рухатися корисно, але без зайвих рухів, що відволікають."], ["До якої якості належать чесність, справедливість і відсутність фаворитів?", ["Ставлення", "Вихованість", "Старанність", "Впевненість"], "Ставлення включає чесність і справедливість, твердість і надійність, дружність."], ["Інструктору дісталася нудна, на його думку, тема. Як має бути за принципом ентузіазму?", ["Подати ефективно — усі теми важливі й цікаві", "Швидко прочитати і відпустити групу", "Попередити курсантів, що тема нудна", "Передати тему іншому інструктору"], "Курсанти миттєво помічають байдужість. Хороший інструктор ефективно подасть навіть нецікавий предмет."], ["Що є «абсолютною передумовою успіху і репутації» інструктора?", ["Старанність", "Ентузіазм", "Звання", "Гучний голос"], "Старанність — прагнення до досконалості, увага до деталей, вимогливість, самовдосконалення."], ["Яка якість дозволяє підлаштувати методи під кожного курсанта?", ["Спостережливість", "Суворість", "Впевненість", "Гучність голосу"], "Спостережливість дозволяє підлаштувати методи під кожного курсанта."], ["Що з переліченого — шлях саморозвитку, а не формальної підготовки?", ["Просити зворотний зв’язок і аналізувати свої заняття", "Пройти курс інструкторів у навчальному центрі", "Пройти спеціалізований курс з військової педагогіки", "Пройти тренінг лідерства, організований ГШ"], "Саморозвиток: проводити заняття помічником, просити зворотний зв’язок, аналізувати свої заняття."], ["Інструктор дозволяє курсантам звертатися до себе на «ти» і жартувати під час інструктажу з безпеки. Який неприйнятний стиль?", ["Панібратство і втрата дистанції", "Авторитарність без діалогу", "Залякування", "Непослідовність"], "Неприйнятні стилі: авторитарність, панібратство і втрата дистанції, залякування, ігнорування конфліктів, непослідовність."], ["Сьогодні інструктор карає за запізнення, а завтра не помічає. Який неприйнятний стиль?", ["Непослідовність", "Панібратство", "Авторитарність", "Демонстративна втома"], "Непослідовність підриває дисципліну і довіру."], ["Що з переліченого — неприпустимий стиль спілкування?", ["Сарказм і критика особистості", "Активне слухання курсантів", "Доречний гумор на занятті", "Чітка й зрозуміла мова"], "Неприпустимо: образливі висловлювання, сарказм, лайка, критика особистості, монолог, крик, ігнорування запитань."], ["Інструктор усе заняття читає з конспекту і скаржиться курсантам на свої проблеми. Що з цього погано?", ["І читання з конспекту, і скарги на свої проблеми", "Лише постійне читання з конспекту", "Лише скарги на власні проблеми", "Нічого — головне, щоб зміст був повним"], "Погано: постійне читання з конспекту, перекладання на курсантів власних проблем, безвідповідальне використання часу."], ["Чим, за матеріалом, стає навчання без якостей інструктора?", ["Формальністю", "Самостійною роботою", "Змаганням", "Ще ефективнішим"], "Без цих якостей навчання стає формальністю; з ними інструктор — наставник, лідер і мотиватор."]]}, {"id": "b1m2t3z2", "code": "Б1 М2 Т3 З2", "theme": "Тема 3. Якості інструктора", "title": "Принципи навчання", "short": "Принципи навчання", "passport": {"goal": "Ознайомити військовослужбовців з принципами навчання.", "time": "1 година (45 хв)", "method": "Інтерактивна лекція, навчальний клас", "questions": ["Основні принципи навчання", "Навчання на власних помилках і через розуміння та вирішення проблем"], "assess": "Усне опитування після навчального питання і контроль у кінці.", "criteria": "Позитивно — якщо знає і розуміє принципи навчання на власних помилках та через розуміння і вирішення проблеми.", "sources": "Програма, розд. 7.1.1.2; ДМ до СТІ 132Г.42К(Н), п. 3.2; презентація"}, "sections": [{"h": "Основні принципи навчання", "body": [["p", "Принципи навчання — фундамент педагогічного процесу: вимоги до організації навчання, що дають найкращий результат. У військовій підготовці найважливіші:"], ["ul", ["<b>Науковості</b> — навчання базується на військових науках, бойовому досвіді, сучасних технологіях і озброєнні.", "<b>Систематичності й послідовності</b> — від простого до складного з урахуванням спеціалізації і рівня підготовки.", "<b>Доступності</b> — матеріал адаптовано до рівня військовослужбовців, але з подоланням труднощів.", "<b>Наочності</b> — карти, схеми, макети, відео бойових дій, практичні демонстрації.", "<b>Активності й самостійності</b> — практичні заняття, тренування, ініціатива в прийнятті рішень.", "<b>Свідомості й творчої активності</b> — розуміння важливості навчання для бойових завдань і творче застосування знань.", "<b>Міцності засвоєння</b> — багаторазове повторення до автоматизму.", "<b>Індивідуалізації і диференціації</b> — урахування здібностей і темпу, але з акцентом на злагодженість підрозділу.", "<b>Виховуючого навчання</b> — формування морально-бойових якостей; особистий приклад командира вирішальний.", "<b>Зв’язку теорії з практикою</b> — максимальне наближення до бойової обстановки."]]]}, {"h": "Специфічні принципи військової педагогіки", "body": [["ul", ["<b>Колективізму і єдиноначальності</b> — уміння діяти в складі підрозділу, виконувати накази і нести колективну відповідальність.", "<b>Високої вимогливості і дисципліни</b> — сувора дисципліна готує до дій в екстремальних умовах.", "<b>Формування психологічної стійкості</b> — елементи психологічної підготовки для розвитку стресостійкості й витримки."]], ["key", "Військове навчання — це не лише знання, а й злагодженість, дисципліна і психологічна стійкість підрозділу."]]}, {"h": "Навчання на власних помилках", "body": [["p", "Помилки — невід’ємна частина навчання: неможливо опанувати навичку, не помиляючись. Через власні помилки людина отримує уроки, які допомагають не повторити їх у майбутньому. Неправильні дії поступово відкидаються, правильні — закріплюються."], ["p", "Принцип працює в чотири кроки:"], ["ul", ["<b>Контрольоване середовище для помилок</b> — симуляції, тренування, навчальні завдання, де помилка відчутна, але не катастрофічна. Страх покарання за кожну помилку паралізує ініціативу.", "<b>Розуміння причини</b> — не просто констатувати помилку, а з’ясувати, чому було прийняте неправильне рішення і які прогалини проявилися. Курсант аналізує власні дії, думки й почуття.", "<b>Вивчені уроки</b> — сформулювати конкретні практичні висновки і задокументувати їх.", "<b>Застосування досвіду</b> — коригувати власні алгоритми, щоб не повторити помилку в критичній ситуації."]], ["warn", "У військовій справі ціна помилки висока, тому помилятися треба на навчанні, а не в бою."]]}, {"h": "Переваги навчання на помилках", "body": [["ul", ["власна помилка запам’ятовується значно краще, ніж пасивно почута інформація;", "аналіз помилок розвиває самостійне мислення і розуміння причин і наслідків;", "усвідомлення наслідків виховує відповідальність і обережність;", "подолання помилок підвищує впевненість у собі;", "готує не здаватися перед неминучими труднощами."]]]}, {"h": "Навчання через розуміння і вирішення проблем", "body": [["p", "Цей принцип ґрунтується не на передаванні готової інформації, а на отриманні знань під час розв’язання теоретичних і практичних завдань. Таке навчання стимулює критичне мислення, дає справжній досвід, систематизує знання і пов’язує навчання з реальним життям."], ["p", "Отримавши завдання, курсанти спершу пробують старі знання, а якщо не виходить — шукають нові способи. Класичний приклад: з’єднати дев’ять точок чотирма прямими лініями, не відриваючи ручку. Це можливо, якщо зрозуміти, що лінії можуть виходити за межі уявного квадрата."], ["p", "Переваги: власне «відкриття» краще сприймається і запам’ятовується, курсант отримує задоволення від виконаного завдання. Недолік: інколи курсанти «застрягають» і відступають — інструктор має вчасно підказати напрям."]]}], "keys": ["Основні принципи: науковість, системність, доступність, наочність, активність, свідомість, міцність, індивідуалізація, виховуюче навчання, зв’язок теорії з практикою.", "Специфічні військові: колективізм і єдиноначальність, вимогливість і дисципліна, психологічна стійкість.", "Навчання на помилках: контрольоване середовище → причина → уроки → застосування.", "Навчання через вир
